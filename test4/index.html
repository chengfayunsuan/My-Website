<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼠标特效 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
<style>
 html, body { min-height: 100vh; overflow: hidden; }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .center-tip {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255,255,255,.35);
    font-size: 16px;
    pointer-events: none;
    user-select: none;
    z-index: 2;
  }
</style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="logo" href="/">乘法</a>
      <div class="nav-right">
        <span class="ip-wrap">你的 IP：<span id="ip">获取中…</span></span>
        <button class="theme-btn" id="themeBtn" aria-label="切换深色模式">
          <svg id="themeIcon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <canvas id="canvas"></canvas>
  <div class="center-tip">移动鼠标试试 ✨</div>

<script>
/* ===== 主题切换 ===== */
const themeBtn  = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const moonSVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const sunSVG  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  themeIcon.innerHTML = sunSVG;
}
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  themeIcon.innerHTML = isDark ? sunSVG : moonSVG;
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
});

/* ===== 顶部 IP ===== */
document.querySelector('.logo').addEventListener('click', e => {
  e.preventDefault();
  location.href = '/';
});
fetch('https://api.ip.sb/ip')
  .then(r => r.text())
  .then(ip => document.getElementById('ip').textContent = ip.trim())
  .catch(() => document.getElementById('ip').textContent = '获取失败');

/* ===== 流光拖尾（原版逻辑，去依赖） ===== */
(function () {
  var ctx, hue, target = {}, tendrils = [], settings = {};

  settings.friction  = 0.55;    // 0.5 → 0.55（摩擦大，节点收得更紧）
settings.trails    = 10;      // 20 → 10（绳子减半，不密）
settings.size      = 40;      // 50 → 40（每根节点少，长度短）
settings.dampening = 0.15;    // 0.25 → 0.15（阻尼小，跟随更紧）
settings.tension   = 0.99;    // 0.98 → 0.99（张力大，绳子硬）

  Math.TWO_PI = Math.PI * 2;

  function Oscillator(opt) {
    opt = opt || {};
    this.phase = opt.phase || 0;
    this.offset = opt.offset || 0;
    this.frequency = opt.frequency || 0.001;
    this.amplitude = opt.amplitude || 1;
    this._v = 0;
  }
  Oscillator.prototype.update = function () {
    this.phase += this.frequency;
    this._v = this.offset + Math.sin(this.phase) * this.amplitude;
    return this._v;
  };
  Oscillator.prototype.value = function () { return this._v; };

  function Tendril(opt) {
    this.spring = opt.spring + (Math.random() * 0.1) - 0.05;
    this.friction = settings.friction + (Math.random() * 0.01) - 0.005;
    this.nodes = [];
    for (var i = 0; i < settings.size; i++) {
      this.nodes.push({ x: target.x, y: target.y, vx: 0, vy: 0 });
    }
  }
  Tendril.prototype.update = function () {
    var spring = this.spring;
    var node = this.nodes[0];
    node.vx += (target.x - node.x) * spring;
    node.vy += (target.y - node.y) * spring;
    for (var prev, i = 0, n = this.nodes.length; i < n; i++) {
      node = this.nodes[i];
      if (i > 0) {
        prev = this.nodes[i - 1];
        node.vx += (prev.x - node.x) * spring;
        node.vy += (prev.y - node.y) * spring;
        node.vx += prev.vx * settings.dampening;
        node.vy += prev.vy * settings.dampening;
      }
      node.vx *= this.friction;
      node.vy *= this.friction;
      node.x += node.vx;
      node.y += node.vy;
      spring *= settings.tension;
    }
  };
  Tendril.prototype.draw = function () {
    var x = this.nodes[0].x;
    var y = this.nodes[0].y;
    var a, b;
    ctx.beginPath();
    ctx.moveTo(x, y);
    var i, n = this.nodes.length - 2;
    for (i = 1; i < n; i++) {
      a = this.nodes[i];
      b = this.nodes[i + 1];
      x = (a.x + b.x) * 0.5;
      y = (a.y + b.y) * 0.5;
      ctx.quadraticCurveTo(a.x, a.y, x, y);
    }
    a = this.nodes[i];
    b = this.nodes[i + 1];
    ctx.quadraticCurveTo(a.x, a.y, b.x, b.y);
    ctx.stroke();
    ctx.closePath();
  };

  function reset() {
    tendrils = [];
    for (var i = 0; i < settings.trails; i++) {
      tendrils.push(new Tendril({ spring: 0.45 + 0.025 * (i / settings.trails) }));
    }
  }

  function loop() {
    if (!ctx.running) return;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(8,5,16,0.4)';
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'hsla(' + Math.round(hue.update()) + ',90%,50%,0.25)';
    ctx.lineWidth = 1;

    for (var i = 0, t; i < settings.trails; i++) {
      t = tendrils[i];
      t.update();
      t.draw();
    }
    requestAnimationFrame(loop);
  }

  function resize() {
    ctx.canvas.width  = window.innerWidth;
    ctx.canvas.height = window.innerHeight;
  }

  function mousemove(e) {
    if (e.touches) {
      target.x = e.touches[0].pageX;
      target.y = e.touches[0].pageY;
    } else {
      target.x = e.clientX;
      target.y = e.clientY;
    }
    if (e.preventDefault) e.preventDefault();
  }

  function init(e) {
    document.removeEventListener('mousemove', init);
    document.removeEventListener('touchstart', init);
    document.addEventListener('mousemove', mousemove);
    document.addEventListener('touchmove', mousemove, { passive: true });
    document.addEventListener('touchstart', mousemove, { passive: true });
    mousemove(e);
    reset();
    loop();
  }

  window.addEventListener('load', function () {
    ctx = document.getElementById('canvas').getContext('2d');
    ctx.running = true;

    hue = new Oscillator({
      phase: Math.random() * Math.TWO_PI,
      amplitude: 85,
      frequency: 0.0015,
      offset: 285
    });

    target.x = window.innerWidth  / 2;
    target.y = window.innerHeight / 2;

    document.addEventListener('mousemove', init);
    document.addEventListener('touchstart', init);
    window.addEventListener('resize', resize);

    resize();
  });
})();
</script>

</body>
</html>
