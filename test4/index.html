<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼠标特效 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
<style>
  html, body { min-height: 100vh; overflow: hidden; }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .center-tip {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--text-light);
    font-size: 16px;
    pointer-events: none;
    user-select: none;
    z-index: 2;
  }
</style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="logo" href="/">乘法</a>
      <div class="nav-right">
        <span class="ip-wrap">你的 IP：<span id="ip">获取中…</span></span>
        <button class="theme-btn" id="themeBtn" aria-label="切换深色模式">
          <svg id="themeIcon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <canvas id="canvas"></canvas>
  <div class="center-tip">移动鼠标试试 ✨</div>

<script>
/* ===== 主题切换 ===== */
const themeBtn  = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const moonSVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const sunSVG  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  themeIcon.innerHTML = sunSVG;
}
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  themeIcon.innerHTML = isDark ? sunSVG : moonSVG;
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
});

/* ===== 顶部 IP ===== */
document.querySelector('.logo').addEventListener('click', e => {
  e.preventDefault();
  location.href = '/';
});
fetch('https://api.ip.sb/ip')
  .then(r => r.text())
  .then(ip => document.getElementById('ip').textContent = ip.trim())
  .catch(() => document.getElementById('ip').textContent = '获取失败');

/* ===== 鼠标拖尾（路径点记录版） ===== */
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // 路径点队列
  const points = [];
  const MAX_POINTS = 60;          // 轨迹长度

  // 鼠标位置（坐标平滑一点，避免抖动）
  let lastX = null, lastY = null;

  function pushPoint(x, y) {
    // 如果跟上一个点太近就不记，防止点过密
    if (lastX !== null) {
      const dx = x - lastX, dy = y - lastY;
      if (dx*dx + dy*dy < 4) return;   // 距离小于 2px 不加
    }
    points.push({ x, y, life: 1 });
    if (points.length > MAX_POINTS) points.shift();
    lastX = x;
    lastY = y;
  }

  document.addEventListener('mousemove', e => pushPoint(e.clientX, e.clientY));
  document.addEventListener('touchmove', e => {
    if (e.touches[0]) pushPoint(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  // 主题相关：暗色用亮紫，亮色用深紫
  function isDark() {
    return document.body.classList.contains('dark');
  }

  function draw() {
    // 每帧完全清空（不留残影，路径本身自带渐隐）
    ctx.clearRect(0, 0, W, H);

    if (points.length < 2) {
      requestAnimationFrame(draw);
      return;
    }

    // 让每个点的 life 衰减
    for (let i = 0; i < points.length; i++) {
      points[i].life -= 0.02;
    }
    // 移除 life <= 0 的
    while (points.length && points[0].life <= 0) points.shift();

    // ---- 画主体：一条平滑渐变曲线 ----
    // 用分段画，每段透明度按 life 变化
    const dark = isDark();

    // 从旧到新画，这样新的盖在旧的上面
    for (let i = 1; i < points.length; i++) {
      const p0 = points[i - 1];
      const p1 = points[i];
      const life = p1.life;

      // 越新越不透明
      const alpha = Math.max(0, life * 0.8);

      // 颜色：紫色系，明暗模式不同亮度
      const hue = 280;                        // 紫色相
      const light = dark ? 70 : 45;           // 暗色模式亮一点
      const color = `hsla(${hue}, 85%, ${light}%, ${alpha})`;

      // 线宽：中间粗两头细
      const t = i / points.length;
      const lineW = 2 + Math.sin(t * Math.PI) * 6;

      // 用二次贝塞尔让曲线平滑
      ctx.beginPath();
      if (i < points.length - 1) {
        const p2 = points[i + 1];
        const xc = (p1.x + p2.x) / 2;
        const yc = (p1.y + p2.y) / 2;
        ctx.moveTo(p0.x, p0.y);
        ctx.quadraticCurveTo(p1.x, p1.y, xc, yc);
      } else {
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = lineW;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // 光晕（同一根线再画一次更宽的）
      ctx.globalCompositeOperation = 'lighter';
      ctx.stroke();

      // 用更宽更透的线做光晕
      ctx.lineWidth = lineW * 3;
      const glowColor = `hsla(${hue}, 85%, ${light}%, ${alpha * 0.15})`;
      ctx.strokeStyle = glowColor;
      ctx.stroke();

      ctx.globalCompositeOperation = 'source-over';
    }

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

</body>
</html>
