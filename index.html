<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乘法 · 个人主页</title>
<style>
  :root {
    --bg: #f7f9fc;
    --card: #ffffff;
    --text: #333333;
    --text-light: #666666;
    --nav-bg: #ffffff;
    --primary: #4A90D9;
    --border: #eaeaea;
    --icon: #333333;
  }

  body.dark {
    --bg: #18191C;
    --card: #222327;
    --text: #E0E0E0;
    --text-light: #9499A0;
    --nav-bg: #222327;
    --primary: #00AEEC;
    --border: #2f3033;
    --icon: #E0E0E0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    transition: background .3s, color .3s;
  }

  nav {
    position: sticky;
    top: 0;
    background: var(--nav-bg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    z-index: 100;
    transition: background .3s;
  }
  .nav-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-size: 20px;
    font-weight: bold;
    color: var(--primary);
    text-decoration: none;
    cursor: pointer;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 14px;
    color: var(--text-light);
  }
  #ip {
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(74,144,217,.12);
    color: var(--primary);
    font-family: monospace;
  }
  .theme-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(74,144,217,.12);
    color: var(--primary);          /* 跟小电视、邮件一样的颜色 */
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
  }
  .theme-btn:hover {
    background: var(--primary);
    color: #fff;
  }
  .theme-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  header {
    max-width: 900px;
    margin: 60px auto 40px;
    padding: 0 20px;
    text-align: center;
  }
  .avatar {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--card);
    box-shadow: 0 4px 14px rgba(74,144,217,.25);
    background: var(--card);
  }
  .name {
    font-size: 40px;
    margin: 20px 0 10px;
    color: var(--text);
  }
  .tagline {
    font-size: 17px;
    color: var(--text-light);
  }

  section {
    max-width: 900px;
    margin: 0 auto 50px;
    padding: 0 20px;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    transition: background .3s;
  }
  .section-title {
    font-size: 22px;
    color: var(--text);
    margin-bottom: 16px;
    position: relative;
    padding-left: 14px;
  }
  .section-title::before {
    content: "";
    position: absolute;
    left: 0;
    top: 6px;
    width: 4px;
    height: 22px;
    background: var(--primary);
    border-radius: 2px;
  }

  /* 测试页网格：横纵间距一致、字大 */
  .test-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;                     /* 横纵一样 */
    margin-top: 10px;
  }
  .test-item {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 12px;
    background: #4CAF50;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 20px;               /* 字调大 */
    font-weight: 500;
    text-align: center;
    transition: all .2s;
    box-shadow: 0 2px 6px rgba(76,175,80,.2);
  }
  .test-item:hover {
    background: #43A047;
    transform: translateY(-2px);
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 8px;
  }
  .socials a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(74,144,217,.12);
    color: var(--primary);
    text-decoration: none;
    transition: all .2s;
  }
  .socials a:hover {
    background: var(--primary);
    color: #fff;
    transform: translateY(-3px);
  }
  .socials svg { width: 22px; height: 22px; }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-light);
    font-size: 14px;
  }

  @media (max-width: 600px) {
    .nav-inner { flex-direction: column; gap: 10px; }
    .name { font-size: 30px; }
    .card { padding: 22px; }
    .test-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="logo" href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">乘法</a>
      <div class="nav-right">
        <span>你的 IP：<span id="ip">获取中…</span></span>
        <button class="theme-btn" id="themeBtn" title="切换日/夜模式">
          <!-- 月亮图标，跟小电视/邮件同一套 SVG 风格 -->
          <svg id="themeIcon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <header>
    <img class="avatar" src="avatar.jpg" alt="头像">
    <h1 class="name">乘法</h1>
    <p class="tagline">这是想要进行乘法运算的测试网页</p>
  </header>

  <section id="test">
    <div class="card">
      <h2 class="section-title">测试页</h2>
      <div class="test-grid">
        <a class="test-item" href="https://chengfa.dpdns.org/test">测试页</a>
        <a class="test-item" href="#">功能二</a>
        <a class="test-item" href="#">功能三</a>
        <a class="test-item" href="#">功能四</a>
        <a class="test-item" href="#">功能五</a>
        <a class="test-item" href="#">功能六</a>
      </div>
    </div>
  </section>

  <section id="about">
    <div class="card">
      <h2 class="section-title">关于我</h2>
      <p>你好，我是乘法。一名热爱编程与计算机技术的学习者，目前正在认真学习 C 语言，喜欢折腾各种小项目，乐于把想法一点点变成代码。希望在这里记录成长，也期待与你交流。</p>

      <div class="socials" style="margin-top:22px;">
        <a href="https://github.com/你的用户名" target="_blank" title="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.11-.76.41-1.27.74-1.56-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.38-5.25 5.66.42.36.79 1.08.79 2.18v3.23c0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/>
          </svg>
        </a>
        <a href="#" target="_blank" title="B站">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2"/>
            <path d="m6 3 3 3M18 3l-3 3"/>
          </svg>
        </a>
        <a href="mailto:your@email.com" title="邮箱">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m2 7 10 7 10-7"/>
          </svg>
        </a>
        <a href="#" target="_blank" title="稿纸">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
            <path d="M8 13h8M8 17h8M8 9h2"/>
          </svg>
        </a>
      </div>
    </div>
  </section>

  <footer>
    © 2026 CHENGFA
  </footer>

<script>
fetch('https://api.ip.sb/ip')
  .then(r => r.text())
  .then(ip => document.getElementById('ip').textContent = ip.trim())
  .catch(() => document.getElementById('ip').textContent = '获取失败');

  const themeBtn = document.getElementById('themeBtn');
  const themeIcon = document.getElementById('themeIcon');

  // 月亮
  const moonSVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  // 太阳
  const sunSVG = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';

  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
    themeIcon.innerHTML = sunSVG;
  }
  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    themeIcon.innerHTML = isDark ? sunSVG : moonSVG;
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });
</script>

</body>
</html>
