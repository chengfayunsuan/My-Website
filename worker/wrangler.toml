name = "r2-guard"
main = "r2-guard.js"
compatibility_date = "2026-11-13"
workers_dev = true

# KV：存用量与档位。名称随便起，id 在 Cloudflare 创建后填
[[kv_namespaces]]
binding = "QUOTA"
id = "03a9574f2b6d42aea86ab41cc4fb0c82"

# R2 桶绑定：读文件走这里（不产生 S3 的 GetObject 计费口径以外的额外费用）
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "chengfa-bucket"

# 每小时同步一次真实用量
[triggers]
crons = ["0 * * * *"]

[vars]
ALLOW_ORIGIN = "https://chengfa-761.pages.dev"
PUBLIC_BASE = "https://chengfa-761.pages.dev"
MAX_UPLOAD_MB = "200"
LIMIT_STORAGE_GB = "10"
LIMIT_OPS_A = "100"
LIMIT_OPS_B = "1000"
R2_ACCOUNT_ID = "c3dbe83cfd4d081cee1e011f90f454f0"
R2_BUCKET = "chengfa-bucket"
SUPABASE_URL = "https://masgzimdndyewzpagrmd.supabase.co"

# 机密（不进本文件，用 wrangler secret put 设置）：
#   R2_ACCESS_KEY_ID / R2_SECRET_KEY   上传签名用的 S3 密钥
#   CF_API_TOKEN                       查真实用量的只读令牌
#   SUPABASE_ANON_KEY                  校验登录态
