<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="880" height="436" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="436" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.4-4  净额和全额：一个攒着算，一个当场结</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CHIPS 用净额，一天结束只划一笔；Fedwire 用全额，每一笔都单独结</text>
<text x="40" y="92" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">三家银行互相欠钱</text>
<circle cx="130" cy="150" r="34" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="130" y="155" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">A 行</text>
<circle cx="330" cy="150" r="34" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="330" y="155" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">B 行</text>
<circle cx="230" cy="300" r="34" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="230" y="305" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">C 行</text>
<line x1="168.0" y1="150.0" x2="292.0" y2="150.0" stroke="#67b5ef" stroke-width="1.4"/>
<path d="M292.0,150.0 L282.0,154.5 L282.0,145.5 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<text x="230.0" y="142.0" fill="#67b5ef" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欠 100</text>
<line x1="308.9" y1="181.6" x2="251.1" y2="268.4" stroke="#e8b84b" stroke-width="1.4"/>
<path d="M251.1,268.4 L252.9,257.6 L260.4,262.6 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<text x="304.0" y="225.0" fill="#e8b84b" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欠 80</text>
<line x1="208.9" y1="268.4" x2="151.1" y2="181.6" stroke="#67d9a0" stroke-width="1.4"/>
<path d="M151.1,181.6 L160.4,187.4 L152.9,192.4 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<text x="156.0" y="225.0" fill="#67d9a0" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欠 60</text>
<rect x="470" y="100" width="370" height="250" rx="5" fill="#1e1e30" stroke="#5a5a80" stroke-width="1.3"/>
<text x="492" y="128" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">净额：一天结束算总账</text>
<text x="492" y="178" fill="#67b5ef" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">A 行</text>
<text x="560" y="178" fill="#6f6f88" font-size="9" text-anchor="start" font-family="monospace">100 − 60</text>
<text x="700" y="178" fill="#67b5ef" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">付 40</text>
<text x="492" y="228" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">B 行</text>
<text x="560" y="228" fill="#6f6f88" font-size="9" text-anchor="start" font-family="monospace">100 − 80</text>
<text x="700" y="228" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收 20</text>
<text x="492" y="278" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">C 行</text>
<text x="560" y="278" fill="#6f6f88" font-size="9" text-anchor="start" font-family="monospace">80 − 60</text>
<text x="700" y="278" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收 20</text>
<line x1="492" y1="310" x2="818" y2="310" stroke="#3a3a52" stroke-width="1"/>
<text x="492" y="334" fill="#9a9ab4" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三笔债变成一笔 40 的转账</text>
<text x="40" y="384" fill="#a0a0b8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">净额的好处是省流水：一整天几万笔，最后只按净值划一次。坏处是慢 —— 必须等到收盘，而且一家违约会牵连一圈。</text>
<text x="40" y="408" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全额的好处是即时、隔离：每笔当场结清，谁倒闭都不影响已经结完的。坏处是费流动性 —— 每笔都要真的有那么多钱。</text>
</svg>
