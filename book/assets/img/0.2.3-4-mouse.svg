<svg width="760" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="m1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#e8b84b"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">鼠标在拍桌子：两张图错开几格，就是移动了多少</text>

  <!-- 左：剖面 -->
  <text x="40" y="76" fill="#9fd4f5" font-size="10">结构：LED + 透镜 + 传感器</text>

  <rect x="66" y="126" width="250" height="174" rx="10" fill="#171725" stroke="#4a4a68"/>

  <rect x="90" y="240" width="34" height="22" rx="3" fill="#3a2a18" stroke="#e8b84b"/>
  <text x="107" y="255" fill="#e8b84b" font-size="7" text-anchor="middle">LED</text>

  <line x1="124" y1="252" x2="186" y2="298" stroke="#e8b84b" stroke-width="1.4" marker-end="url(#m1)"/>
  <text x="140" y="284" fill="#e8b84b" font-size="7.5">斜照</text>

  <line x1="192" y1="298" x2="228" y2="234" stroke="#e8b84b" stroke-width="1.4" marker-end="url(#m1)"/>
  <text x="222" y="278" fill="#e8b84b" font-size="7.5">反射</text>

  <ellipse cx="232" cy="220" rx="20" ry="9" fill="#1b2740" stroke="#67b5ef"/>
  <text x="232" y="223" fill="#9fd4f5" font-size="6.5" text-anchor="middle">透镜</text>

  <rect x="206" y="150" width="52" height="32" rx="3" fill="#20303a" stroke="#4ec9a3"/>
  <text x="232" y="165" fill="#9fe0c9" font-size="7" text-anchor="middle">传感器</text>
  <text x="232" y="176" fill="#6b6b85" font-size="6.5" text-anchor="middle">20×20 像素</text>

  <line x1="232" y1="182" x2="232" y2="211" stroke="#4ec9a3" stroke-width="1.2"/>

  <line x1="40" y1="300" x2="340" y2="300" stroke="#4a4a68" stroke-width="1.6"/>
  <text x="40" y="318" fill="#6b6b85" font-size="8">桌面（必须有纹理）</text>

  <text x="40" y="344" fill="#9a9ab4" font-size="8.5">每秒拍上千张，每张只取中间一小块</text>

  <!-- 右：两张图 -->
  <line x1="370" y1="66" x2="370" y2="320" stroke="#2a2a44"/>

  <text x="392" y="76" fill="#9fd4f5" font-size="10">比较两张小图，找「错开多少最像」</text>

  <!-- 上一帧 -->
  <text x="400" y="104" fill="#6b6b85" font-size="8.5">上一帧</text>
  <g stroke="#2a2a44" stroke-width="1">
    <rect x="400" y="112" width="120" height="120" fill="#12121c"/>
    <line x1="424" y1="112" x2="424" y2="232"/><line x1="448" y1="112" x2="448" y2="232"/>
    <line x1="472" y1="112" x2="472" y2="232"/><line x1="496" y1="112" x2="496" y2="232"/>
    <line x1="400" y1="136" x2="520" y2="136"/><line x1="400" y1="160" x2="520" y2="160"/>
    <line x1="400" y1="184" x2="520" y2="184"/><line x1="400" y1="208" x2="520" y2="208"/>
  </g>
  <g fill="#67b5ef">
    <rect x="424" y="136" width="24" height="24" fill-opacity="0.55"/>
    <rect x="472" y="160" width="24" height="24" fill-opacity="0.55"/>
    <rect x="448" y="184" width="24" height="24" fill-opacity="0.55"/>
    <rect x="496" y="136" width="24" height="24" fill-opacity="0.35"/>
  </g>

  <!-- 这一帧 -->
  <text x="560" y="104" fill="#6b6b85" font-size="8.5">这一帧</text>
  <g stroke="#2a2a44" stroke-width="1">
    <rect x="560" y="112" width="120" height="120" fill="#12121c"/>
    <line x1="584" y1="112" x2="584" y2="232"/><line x1="608" y1="112" x2="608" y2="232"/>
    <line x1="632" y1="112" x2="632" y2="232"/><line x1="656" y1="112" x2="656" y2="232"/>
    <line x1="560" y1="136" x2="680" y2="136"/><line x1="560" y1="160" x2="680" y2="160"/>
    <line x1="560" y1="184" x2="680" y2="184"/><line x1="560" y1="208" x2="680" y2="208"/>
  </g>
  <g fill="#67b5ef">
    <rect x="584" y="136" width="24" height="24" fill-opacity="0.55"/>
    <rect x="632" y="160" width="24" height="24" fill-opacity="0.55"/>
    <rect x="608" y="184" width="24" height="24" fill-opacity="0.55"/>
    <rect x="656" y="136" width="24" height="24" fill-opacity="0.35"/>
  </g>

  <!-- 位移箭头 -->
  <path d="M520,172 L556,172" fill="none" stroke="#e8b84b" stroke-width="1.6" marker-end="url(#m1)"/>
  <text x="538" y="166" fill="#e8b84b" font-size="7" text-anchor="middle">1 格</text>

  <text x="560" y="256" fill="#9a9ab4" font-size="8.5">图案整体右移了一格 → 鼠标向左移动</text>
  <text x="560" y="272" fill="#6b6b85" font-size="8">这一步计算叫「互相关」，每秒做上千次</text>

  <!-- CPI -->
  <line x1="392" y1="290" x2="720" y2="290" stroke="#2a2a44"/>
  <text x="392" y="308" fill="#e8b84b" font-size="8.5">CPI：每英寸产生多少个「一格」</text>
  <text x="392" y="324" fill="#6b6b85" font-size="8">1600 CPI → 每格 0.0159 毫米</text>

  <!-- 底部 -->
  <line x1="24" y1="350" x2="736" y2="350" stroke="#2a2a44"/>
  <text x="24" y="372" fill="#e8b84b" font-size="9">玻璃、镜面、纯白纸上用不了：画面没有纹理，两张图怎么错开都一样，算不出方向。</text>
  <text x="24" y="394" fill="#9a9ab4" font-size="9">鼠标垫的花纹不是装饰，是给传感器提供可追踪的特征点。</text>
  <text x="24" y="416" fill="#9a9ab4" font-size="9">系统里的「鼠标速度」滑块改的是系数，不是传感器——调高只会放大同样的移动，精度反而下降。</text>
  <text x="24" y="438" fill="#6b6b85" font-size="8.5">早期的滚球鼠标靠两个滚轮和光栅盘直接测角度，不需要纹理；它被淘汰是因为粘灰打滑，不是不准。</text>
</svg>
