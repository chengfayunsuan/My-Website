<svg width="880" height="440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">gcc hello.c -o hello 背后的四个程序</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一步都有独立产物；方框下方是按对数画的体积，涨落本身就是理解这条流水线最好的线索</text>
<rect x="21.0" y="92" width="118" height="48" rx="5" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="80.0" y="118" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="monospace">hello.c</text>
<text x="80.0" y="133" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">0.4 KB</text>
<rect x="201.0" y="92" width="118" height="48" rx="5" fill="#16161f" stroke="#e8b84b" stroke-width="1.4"/>
<text x="260.0" y="118" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="monospace">hello.i</text>
<text x="260.0" y="133" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">800 KB</text>
<rect x="381.0" y="92" width="118" height="48" rx="5" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="440.0" y="118" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="monospace">hello.s</text>
<text x="440.0" y="133" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">2 KB</text>
<rect x="561.0" y="92" width="118" height="48" rx="5" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="620.0" y="118" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="monospace">hello.o</text>
<text x="620.0" y="133" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">2 KB</text>
<rect x="741.0" y="92" width="118" height="48" rx="5" fill="#16161f" stroke="#b58ae8" stroke-width="1.4"/>
<text x="800.0" y="118" fill="#b58ae8" font-size="11.5" text-anchor="middle" font-family="monospace">hello</text>
<text x="800.0" y="133" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">16 KB</text>
<line x1="143.0" y1="116" x2="188.0" y2="116.0" stroke="#8a8aa4" stroke-width="1.4"/>
<polygon points="197.0,116 188.0,120.5 188.0,111.5" fill="#8a8aa4"/>
<text x="170.0" y="101" fill="#8a8aa4" font-size="10" text-anchor="middle" font-family="monospace">cpp</text>
<text x="170.0" y="134" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">预处理</text>
<line x1="323.0" y1="116" x2="368.0" y2="116.0" stroke="#8a8aa4" stroke-width="1.4"/>
<polygon points="377.0,116 368.0,120.5 368.0,111.5" fill="#8a8aa4"/>
<text x="350.0" y="101" fill="#8a8aa4" font-size="10" text-anchor="middle" font-family="monospace">cc1</text>
<text x="350.0" y="134" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">编译</text>
<line x1="503.0" y1="116" x2="548.0" y2="116.0" stroke="#8a8aa4" stroke-width="1.4"/>
<polygon points="557.0,116 548.0,120.5 548.0,111.5" fill="#8a8aa4"/>
<text x="530.0" y="101" fill="#8a8aa4" font-size="10" text-anchor="middle" font-family="monospace">as</text>
<text x="530.0" y="134" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">汇编</text>
<line x1="683.0" y1="116" x2="728.0" y2="116.0" stroke="#8a8aa4" stroke-width="1.4"/>
<polygon points="737.0,116 728.0,120.5 728.0,111.5" fill="#8a8aa4"/>
<text x="710.0" y="101" fill="#8a8aa4" font-size="10" text-anchor="middle" font-family="monospace">ld</text>
<text x="710.0" y="134" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">链接</text>
<text x="80.0" y="172" fill="#6a6a82" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你写的</text>
<text x="170.0" y="172" fill="#2e2e44" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<text x="260.0" y="172" fill="#6a6a82" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三万行文本</text>
<text x="350.0" y="172" fill="#2e2e44" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<text x="440.0" y="172" fill="#6a6a82" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">助记符</text>
<text x="530.0" y="172" fill="#2e2e44" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<text x="620.0" y="172" fill="#6a6a82" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">字节 + 符号表</text>
<text x="710.0" y="172" fill="#2e2e44" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<text x="800.0" y="172" fill="#6a6a82" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可执行</text>
<rect x="64.0" y="322.0" width="32" height="8.0" rx="2" fill="#16161f" stroke="#67b5ef" stroke-width="1.2"/>
<text x="80.0" y="315.0" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">0.4 KB</text>
<rect x="244.0" y="210.0" width="32" height="120.0" rx="2" fill="#16161f" stroke="#e8b84b" stroke-width="1.2"/>
<text x="260.0" y="203.0" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">800 KB</text>
<rect x="424.0" y="298.28478366192866" width="32" height="31.715216338071365" rx="2" fill="#16161f" stroke="#67d9a0" stroke-width="1.2"/>
<text x="440.0" y="291.28478366192866" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">2 KB</text>
<rect x="604.0" y="298.28478366192866" width="32" height="31.715216338071365" rx="2" fill="#16161f" stroke="#67d9a0" stroke-width="1.2"/>
<text x="620.0" y="291.28478366192866" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">2 KB</text>
<rect x="784.0" y="267.6440204225892" width="32" height="62.35597957741079" rx="2" fill="#16161f" stroke="#b58ae8" stroke-width="1.2"/>
<text x="800.0" y="260.6440204225892" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">16 KB</text>
<line x1="11.0" y1="330" x2="869.0" y2="330" stroke="#2a2a3e" stroke-width="1"/>
<text x="36" y="352" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">体积（对数）</text>
<text x="36" y="404" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">预处理后暴涨是因为头文件被原样粘进来；编译后又缩回去，因为两千行声明里只有几行被真正用上。</text>
<text x="36" y="422" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最后链接再涨一次：C 运行库（crt0、printf、malloc）被打包进来，即使你的 main 只有三行。</text>
</svg>
