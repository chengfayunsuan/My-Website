<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="346" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.4.5 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你刷 100 块，这 100 块被切成四份</text>
<text x="60" y="88" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分给谁</text>
<text x="260" y="88" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">金额</text>
<text x="380" y="88" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这笔钱的性质</text>
<line x1="60" y1="98" x2="820" y2="98" stroke="#3a3a52" stroke-width="1"/>
<rect x="60" y="120" width="6" height="24" rx="3" fill="#2a2a3e" stroke="#2a2a3e" stroke-width="0"/>
<text x="80" y="136" fill="#dcdcea" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商户到手</text>
<text x="260" y="136" fill="#c8c8d4" font-size="12" text-anchor="start" font-family="monospace">99.34 元</text>
<text x="380" y="136" fill="#8a8aa0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">占大头，费率约 0.6%</text>
<rect x="60" y="164" width="6" height="24" rx="3" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<text x="80" y="180" fill="#dcdcea" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发卡行</text>
<text x="260" y="180" fill="#67b5ef" font-size="12" text-anchor="start" font-family="monospace">0.45 元</text>
<text x="380" y="180" fill="#8a8aa0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你那张卡的银行，拿得最多</text>
<rect x="60" y="208" width="6" height="24" rx="3" fill="#e8965a" stroke="#e8965a" stroke-width="0"/>
<text x="80" y="224" fill="#dcdcea" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收单行</text>
<text x="260" y="224" fill="#e8965a" font-size="12" text-anchor="start" font-family="monospace">0.15 元</text>
<text x="380" y="224" fill="#8a8aa0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">给商户装机器的银行或支付公司</text>
<rect x="60" y="252" width="6" height="24" rx="3" fill="#b58ae8" stroke="#b58ae8" stroke-width="0"/>
<text x="80" y="268" fill="#dcdcea" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡组织</text>
<text x="260" y="268" fill="#b58ae8" font-size="12" text-anchor="start" font-family="monospace">0.065 元</text>
<text x="380" y="268" fill="#8a8aa0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银联／Visa，只管转接和清算</text>
<line x1="60" y1="286" x2="820" y2="286" stroke="#3a3a52" stroke-width="1"/>
<text x="60" y="312" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这笔钱叫"交换费"（interchange）。费率看着小，但按流水抽：月流水 30 万的店，0.6% 就是 1 800 元。</text>
<text x="60" y="332" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">借记卡约 0.5%，扫码支付更低（0.2%～0.38%），所以商家都愿意你扫码。</text>
</svg>
