<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'PingFang SC','Microsoft YaHei',monospace">
  <rect width="640" height="400" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5">文件开头的那几个字节，就是它的身份证</text>
  <text x="24" y="46" fill="#6b6b85" font-size="11">系统不看你把它命名成什么，只看头几个字节（这叫 magic number）</text>

  <!-- 表头 -->
  <text x="24" y="76" fill="#6b6b85" font-size="10.5">格式</text>
  <text x="132" y="76" fill="#6b6b85" font-size="10.5">开头的字节（十六进制）</text>
  <text x="452" y="76" fill="#6b6b85" font-size="10.5">按 ASCII 读像</text>
  <line x1="24" y1="84" x2="616" y2="84" stroke="#2a2a44"/>

  <!-- PNG -->
  <text x="24" y="112" fill="#4ec9a3" font-size="12.5" font-weight="700">PNG</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="132" y="96" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="149" y="112" fill="#7fe0c2">89</text>
    <rect x="170" y="96" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="187" y="112" fill="#7fe0c2">50</text>
    <rect x="208" y="96" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="225" y="112" fill="#7fe0c2">4E</text>
    <rect x="246" y="96" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="263" y="112" fill="#7fe0c2">47</text>
    <rect x="284" y="96" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="301" y="112" fill="#7fe0c2">0D</text>
    <rect x="322" y="96" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="339" y="112" fill="#7fe0c2">0A</text>
    <rect x="360" y="96" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="377" y="112" fill="#7fe0c2">1A</text>
    <rect x="398" y="96" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="415" y="112" fill="#7fe0c2">0A</text>
  </g>
  <text x="452" y="112" fill="#9a9ab4" font-size="11.5">.PNG....</text>

  <!-- JPEG -->
  <text x="24" y="154" fill="#e8b84b" font-size="12.5" font-weight="700">JPEG</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="132" y="138" width="34" height="24" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="149" y="154" fill="#f0cd7a">FF</text>
    <rect x="170" y="138" width="34" height="24" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="187" y="154" fill="#f0cd7a">D8</text>
    <rect x="208" y="138" width="34" height="24" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="225" y="154" fill="#f0cd7a">FF</text>
  </g>
  <text x="452" y="154" fill="#9a9ab4" font-size="11.5">（不可打印）</text>

  <!-- GIF -->
  <text x="24" y="196" fill="#67b5ef" font-size="12.5" font-weight="700">GIF</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="132" y="180" width="34" height="24" rx="3" fill="#182231" stroke="#67b5ef" stroke-opacity="0.6"/><text x="149" y="196" fill="#a8d8f7">47</text>
    <rect x="170" y="180" width="34" height="24" rx="3" fill="#182231" stroke="#67b5ef" stroke-opacity="0.6"/><text x="187" y="196" fill="#a8d8f7">49</text>
    <rect x="208" y="180" width="34" height="24" rx="3" fill="#182231" stroke="#67b5ef" stroke-opacity="0.6"/><text x="225" y="196" fill="#a8d8f7">46</text>
    <rect x="246" y="180" width="34" height="24" rx="3" fill="#182231" stroke="#67b5ef" stroke-opacity="0.6"/><text x="263" y="196" fill="#a8d8f7">38</text>
  </g>
  <text x="452" y="196" fill="#9a9ab4" font-size="11.5">GIF8</text>

  <!-- PDF -->
  <text x="24" y="238" fill="#f0606a" font-size="12.5" font-weight="700">PDF</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="132" y="222" width="34" height="24" rx="3" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.6"/><text x="149" y="238" fill="#f7a3a8">25</text>
    <rect x="170" y="222" width="34" height="24" rx="3" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.6"/><text x="187" y="238" fill="#f7a3a8">50</text>
    <rect x="208" y="222" width="34" height="24" rx="3" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.6"/><text x="225" y="238" fill="#f7a3a8">44</text>
    <rect x="246" y="222" width="34" height="24" rx="3" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.6"/><text x="263" y="238" fill="#f7a3a8">46</text>
  </g>
  <text x="452" y="238" fill="#9a9ab4" font-size="11.5">%PDF</text>

  <!-- ZIP -->
  <text x="24" y="280" fill="#c9b0ff" font-size="12.5" font-weight="700">ZIP</text>
  <text x="24" y="296" fill="#6b6b85" font-size="9.5">docx / xlsx</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="132" y="264" width="34" height="24" rx="3" fill="#221636" stroke="#9b4df0" stroke-opacity="0.6"/><text x="149" y="280" fill="#d8c8ff">50</text>
    <rect x="170" y="264" width="34" height="24" rx="3" fill="#221636" stroke="#9b4df0" stroke-opacity="0.6"/><text x="187" y="280" fill="#d8c8ff">4B</text>
    <rect x="208" y="264" width="34" height="24" rx="3" fill="#221636" stroke="#9b4df0" stroke-opacity="0.6"/><text x="225" y="280" fill="#d8c8ff">03</text>
    <rect x="246" y="264" width="34" height="24" rx="3" fill="#221636" stroke="#9b4df0" stroke-opacity="0.6"/><text x="263" y="280" fill="#d8c8ff">04</text>
  </g>
  <text x="452" y="280" fill="#9a9ab4" font-size="11.5">PK..</text>

  <!-- EXE -->
  <text x="24" y="322" fill="#4ec9a3" font-size="12.5" font-weight="700">EXE</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="132" y="306" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/><text x="149" y="322" fill="#7fe0c2">4D</text>
    <rect x="170" y="306" width="34" height="24" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/><text x="187" y="322" fill="#7fe0c2">5A</text>
  </g>
  <text x="452" y="322" fill="#9a9ab4" font-size="11.5">MZ（作者名缩写）</text>

  <!-- 注释 -->
  <line x1="24" y1="348" x2="616" y2="348" stroke="#2a2a44"/>
  <text x="24" y="370" fill="#9a9ab4" font-size="11">所以「改后缀」不会改格式：程序打开文件时先读这几个字节，认出来了就按对应规则解析，认不出来才看后缀。</text>
  <text x="24" y="390" fill="#6b6b85" font-size="11">也所以：一个文件「打不开」，可能是它真的坏了，也可能只是它根本不是你以为的那种格式。</text>
</svg>
