<svg width="760" height="452" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="452" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">MOSFET 剖面：用一层绝缘的氧化硅，把控制端隔开</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">栅极下面没有电流流过——它靠电场「隔空」把沟道里的载流子吸过来</text>
  <rect x="80" y="176" width="600" height="76" fill="#2e2030" stroke="#8a4a70"/>
  <text x="380" y="228" fill="#c090b0" font-size="9.5" text-anchor="middle">P 型衬底（Body）</text>
  <rect x="110" y="136" width="120" height="40" fill="#1e2a3e" stroke="#3a5a7a"/>
  <text x="170" y="162" fill="#9fd4f5" font-size="10" text-anchor="middle">N+ 源</text>
  <rect x="530" y="136" width="120" height="40" fill="#1e2a3e" stroke="#3a5a7a"/>
  <text x="590" y="162" fill="#9fd4f5" font-size="10" text-anchor="middle">N+ 漏</text>
  <rect x="230" y="122" width="300" height="14" fill="#1a2430" stroke="#4a7a9a"/>
  <text x="380" y="133" fill="#7fb0d0" font-size="7.5" text-anchor="middle">二氧化硅（绝缘）</text>
  <rect x="290" y="92" width="180" height="30" fill="#3a3a52" stroke="#8a8aa0"/>
  <text x="380" y="112" fill="#d8d8e4" font-size="10" text-anchor="middle">栅极 G（多晶硅）</text>
  <line x1="170" y1="136" x2="170" y2="96" stroke="#9fd4f5" stroke-width="1.6"/>
  <text x="170" y="88" fill="#9fd4f5" font-size="10" text-anchor="middle">S</text>
  <line x1="590" y1="136" x2="590" y2="96" stroke="#9fd4f5" stroke-width="1.6"/>
  <text x="590" y="88" fill="#9fd4f5" font-size="10" text-anchor="middle">D</text>
  <line x1="380" y1="92" x2="380" y2="66" stroke="#d8d8e4" stroke-width="1.6"/>
  <text x="380" y="58" fill="#d8d8e4" font-size="10" text-anchor="middle">G</text>
  <rect x="230" y="168" width="300" height="8" fill="#4ec9a3" opacity="0.85"/>
  <text x="380" y="190" fill="#9fe0c9" font-size="8" text-anchor="middle">沟道（栅压足够时才出现）</text>
  <text x="80" y="272" fill="#6b6b85" font-size="8">栅极和沟道之间隔着一层几十纳米厚的氧化硅——这是「绝缘栅」四个字的全部含义</text>
  <line x1="30" y1="292" x2="730" y2="292" stroke="#2a2a3c"/>
  <text x="60" y="314" fill="#f0a0a8" font-size="9">V_G = 0：没有沟道</text>
  <rect x="60" y="324" width="60" height="26" fill="#1e2a3e" stroke="#3a5a7a"/>
  <rect x="120" y="324" width="160" height="26" fill="#2e2030" stroke="#8a4a70" stroke-dasharray="3 3"/>
  <rect x="280" y="324" width="60" height="26" fill="#1e2a3e" stroke="#3a5a7a"/>
  <text x="200" y="341" fill="#8a6a80" font-size="8" text-anchor="middle">断开</text>
  <text x="420" y="314" fill="#9fe0c9" font-size="9">V_G &gt; 阈值：沟道形成</text>
  <rect x="420" y="324" width="60" height="26" fill="#1e2a3e" stroke="#3a5a7a"/>
  <rect x="480" y="324" width="160" height="26" fill="#204a3e" stroke="#4ec9a3"/>
  <rect x="640" y="324" width="60" height="26" fill="#1e2a3e" stroke="#3a5a7a"/>
  <text x="560" y="341" fill="#9fe0c9" font-size="8" text-anchor="middle">导通</text>
  <line x1="30" y1="368" x2="730" y2="368" stroke="#2a2a3c"/>
  <text x="30" y="388" fill="#d8d8e4" font-size="9">关键区别：三极管靠「基极电流」控制，MOS 管靠「栅极电压」控制。栅极下面是绝缘层，静态时几乎不耗电。</text>
  <text x="30" y="406" fill="#9a9ab4" font-size="8.5">这就是为什么 CMOS 电路静态功耗极低：一个门要么上面的管导通、要么下面的管导通，不会两个同时通。</text>
  <text x="30" y="424" fill="#6b6b85" font-size="8.5">只有切换的瞬间两个管同时半开，才有一小段电流——这部分叫「动态功耗」，正比于频率，所以降频能省电。</text>
  <text x="30" y="448" fill="#6b6b85" font-size="8.5">阈值电压的典型值：早期 0.7 伏，现代低功耗工艺降到 0.3 伏左右。越低越快，但漏电越大。</text>
</svg>