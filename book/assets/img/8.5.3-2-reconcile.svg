<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="450" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">三方对账：三个数必须能对上</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">通道结算单、你的订单、银行流水</text>
<rect x="30" y="90" width="196" height="86" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="30" y="90" width="4" height="86" rx="2" fill="#b58ae8" stroke="none" stroke-width="0"/>
<text x="48" y="118" fill="#b58ae8" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">通道结算单</text>
<text x="48" y="142" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">通道说：我欠你多少</text>
<line x1="128" y1="176" x2="128" y2="196" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M124,190 L128,197 L132,190" fill="none" stroke="#5a5a72" stroke-width="1.4"/>
<rect x="242" y="90" width="196" height="86" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="242" y="90" width="4" height="86" rx="2" fill="#67b5ef" stroke="none" stroke-width="0"/>
<text x="260" y="118" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">订单系统</text>
<text x="260" y="142" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你说：我卖了多少</text>
<line x1="340" y1="176" x2="340" y2="196" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M336,190 L340,197 L344,190" fill="none" stroke="#5a5a72" stroke-width="1.4"/>
<rect x="454" y="90" width="196" height="86" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="454" y="90" width="4" height="86" rx="2" fill="#67d9a0" stroke="none" stroke-width="0"/>
<text x="472" y="118" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">银行流水</text>
<text x="472" y="142" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行说：你收到多少</text>
<line x1="552" y1="176" x2="552" y2="196" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M548,190 L552,197 L556,190" fill="none" stroke="#5a5a72" stroke-width="1.4"/>
<rect x="30" y="198" width="658" height="52" rx="5" fill="#191924" stroke="#4a4a62" stroke-width="1.3"/>
<text x="44" y="230" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="monospace">期初余额 ＋ 本期收款 － 退款 － 手续费 － 提现 ＝ 期末余额</text>
<text x="30" y="282" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对不上的四类差额</text>
<rect x="30" y="296" width="152" height="96" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.3"/>
<circle cx="46" cy="320" r="4" fill="#e8b84b"/>
<text x="58" y="324" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">手续费</text>
<text x="46" y="350" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按费率算得出</text>
<text x="46" y="369" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">金额对得上就放过</text>
<rect x="196" y="296" width="152" height="96" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.3"/>
<circle cx="212" cy="320" r="4" fill="#67b5ef"/>
<text x="224" y="324" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">在途</text>
<text x="212" y="350" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">差一个结算日</text>
<text x="212" y="369" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">T+1 的钱还没到</text>
<rect x="362" y="296" width="152" height="96" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.3"/>
<circle cx="378" cy="320" r="4" fill="#e8965a"/>
<text x="390" y="324" fill="#e8965a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">退款 / 拒付</text>
<text x="378" y="350" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有单据可查</text>
<text x="378" y="369" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">状态没同步就会差</text>
<rect x="528" y="296" width="152" height="96" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.3"/>
<circle cx="544" cy="320" r="4" fill="#e87a8a"/>
<text x="556" y="324" fill="#e87a8a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">真差错</text>
<text x="544" y="350" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">漏单、重复、错价</text>
<text x="544" y="369" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">必须逐笔找出来</text>
<text x="30" y="424" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前三类都能解释，第四类不能——对账的功夫全在第四类上。</text>
</svg>
