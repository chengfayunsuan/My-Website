<text x="24" y="412" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意 SSD 和 HDD 那两条：它们不是 CPU 直接访问的，要走缺页和驱动。放进来只为说明「等 IO」和「算一条指令」相差七个数量级。</text>
