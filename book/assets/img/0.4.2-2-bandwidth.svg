<svg width="760" height="505" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="505" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">带宽的数字，不能直接比</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">M1 的 68 GB/s 在独显面前很低——但独显要先过一道 32 GB/s 的门</text>

  <text x="130" y="106" fill="#9a9ab4" font-size="8" text-anchor="end">GDDR6 128 位（中端独显）</text>
  <rect x="140" y="92" width="480" height="20" rx="2" fill="#f0606a" fill-opacity="0.28" stroke="#f0606a"/>
  <text x="628" y="106" fill="#f0606a" font-size="8.5">448 GB/s</text>
  <text x="130" y="136" fill="#9a9ab4" font-size="8" text-anchor="end">M1 Max 统一内存</text>
  <rect x="140" y="122" width="429" height="20" rx="2" fill="#4ec9a3" fill-opacity="0.28" stroke="#4ec9a3"/>
  <text x="577" y="136" fill="#4ec9a3" font-size="8.5">400 GB/s</text>
  <text x="130" y="166" fill="#9a9ab4" font-size="8" text-anchor="end">M1 Pro 统一内存</text>
  <rect x="140" y="152" width="214" height="20" rx="2" fill="#4ec9a3" fill-opacity="0.28" stroke="#4ec9a3"/>
  <text x="362" y="166" fill="#4ec9a3" font-size="8.5">200 GB/s</text>
  <text x="130" y="196" fill="#9a9ab4" font-size="8" text-anchor="end">DDR5-5600 双通道</text>
  <rect x="140" y="182" width="96" height="20" rx="2" fill="#67b5ef" fill-opacity="0.28" stroke="#67b5ef"/>
  <text x="244" y="196" fill="#67b5ef" font-size="8.5">89.6 GB/s</text>
  <text x="130" y="226" fill="#9a9ab4" font-size="8" text-anchor="end">M1 统一内存</text>
  <rect x="140" y="212" width="73" height="20" rx="2" fill="#4ec9a3" fill-opacity="0.28" stroke="#4ec9a3"/>
  <text x="221" y="226" fill="#4ec9a3" font-size="8.5">68.25 GB/s</text>
  <text x="130" y="256" fill="#9a9ab4" font-size="8" text-anchor="end">PCIe 4.0 ×16（CPU 到显卡）</text>
  <rect x="140" y="242" width="34" height="20" rx="2" fill="#e8b84b" fill-opacity="0.28" stroke="#e8b84b"/>
  <text x="182" y="256" fill="#e8b84b" font-size="8.5">32 GB/s</text>

  <line x1="24" y1="286" x2="736" y2="286" stroke="#2a2a44"/>

  <text x="24" y="308" fill="#d8d8e4" font-size="10.5">一条管线，看最窄的那一段</text>

  <!-- 独显 -->
  <text x="24" y="334" fill="#f0606a" font-size="8.5">独显：入口窄，里面宽</text>
  <path d="M28,368 L58,368" stroke="#e8b84b" stroke-width="2" marker-end="url(#h1)"/>
  <defs>
    <marker id="h1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,0.5 L6,3.5 L1,6.5 z" fill="#e8b84b"/>
    </marker>
  </defs>
  <rect x="62" y="360" width="30" height="16" fill="#332a18" stroke="#e8b84b"/>
  <text x="77" y="392" fill="#e8b84b" font-size="7" text-anchor="middle">PCIe 32</text>
  <path d="M92,368 L104,368" stroke="#6b6b85" stroke-width="1"/>
  <rect x="106" y="344" width="300" height="48" rx="3" fill="#3a1e26" stroke="#f0606a"/>
  <text x="256" y="364" fill="#f0a0aa" font-size="8.5" text-anchor="middle">显存 448 GB/s</text>
  <text x="256" y="380" fill="#6b6b85" font-size="7" text-anchor="middle">里面再宽，入口只有 32</text>

  <!-- M1 -->
  <text x="24" y="424" fill="#4ec9a3" font-size="8.5">M1：全程一样宽</text>
  <path d="M28,458 L58,458" stroke="#4ec9a3" stroke-width="2" marker-end="url(#h2)"/>
  <defs>
    <marker id="h2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,0.5 L6,3.5 L1,6.5 z" fill="#4ec9a3"/>
    </marker>
  </defs>
  <rect x="62" y="434" width="68" height="48" rx="3" fill="#183028" stroke="#4ec9a3"/>
  <text x="96" y="456" fill="#9fe0c9" font-size="7.5" text-anchor="middle">68 GB/s</text>
  <text x="96" y="470" fill="#6b6b85" font-size="7" text-anchor="middle">入口即全程</text>
  <rect x="134" y="434" width="272" height="48" rx="3" fill="#183028" stroke="#4ec9a3"/>
  <text x="270" y="456" fill="#9fe0c9" font-size="7.5" text-anchor="middle">同一块内存</text>
  <text x="270" y="470" fill="#6b6b85" font-size="7" text-anchor="middle">CPU / GPU / NPU 共用一个池子</text>

  <text x="440" y="440" fill="#e8b84b" font-size="8.5">所以「谁快」要看任务：</text>
  <text x="440" y="458" fill="#9a9ab4" font-size="8">搬大块数据、模型权重——独显的 448 能用上；</text>
  <text x="440" y="474" fill="#9a9ab4" font-size="8">大量小批量、CPU 参与——M1 反而不用等。</text>
</svg>