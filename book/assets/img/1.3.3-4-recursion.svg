<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">递归：栈一层层往下长，直到撞上 guard page</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">8 MiB 的栈能撑多少层，完全由每层开销决定</text>
<text x="70" y="88" fill="#8a8aa2" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">栈（上限 8 MiB）</text>
<rect x="70" y="96" width="190" height="30" rx="2" fill="#1c1c2a" stroke="#3a3a52" stroke-width="1"/>
<text x="82" y="116" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 1 层帧</text>
<text x="248" y="116" fill="#6a6a82" font-size="9" text-anchor="end" font-family="monospace">40 字节</text>
<line x1="82" y1="124" x2="248" y2="124" stroke="#2e2e44" stroke-width="1"/>
<rect x="70" y="128" width="190" height="30" rx="2" fill="#171724" stroke="#3a3a52" stroke-width="1"/>
<text x="82" y="148" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 2 层帧</text>
<text x="248" y="148" fill="#6a6a82" font-size="9" text-anchor="end" font-family="monospace">40 字节</text>
<line x1="82" y1="156" x2="248" y2="156" stroke="#2e2e44" stroke-width="1"/>
<rect x="70" y="160" width="190" height="30" rx="2" fill="#1c1c2a" stroke="#3a3a52" stroke-width="1"/>
<text x="82" y="180" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 3 层帧</text>
<text x="248" y="180" fill="#6a6a82" font-size="9" text-anchor="end" font-family="monospace">40 字节</text>
<line x1="82" y1="188" x2="248" y2="188" stroke="#2e2e44" stroke-width="1"/>
<rect x="70" y="192" width="190" height="30" rx="2" fill="#171724" stroke="#3a3a52" stroke-width="1"/>
<text x="82" y="212" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 4 层帧</text>
<text x="248" y="212" fill="#6a6a82" font-size="9" text-anchor="end" font-family="monospace">40 字节</text>
<line x1="82" y1="220" x2="248" y2="220" stroke="#2e2e44" stroke-width="1"/>
<rect x="70" y="224" width="190" height="30" rx="2" fill="#1c1c2a" stroke="#3a3a52" stroke-width="1"/>
<text x="82" y="244" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 5 层帧</text>
<text x="248" y="244" fill="#6a6a82" font-size="9" text-anchor="end" font-family="monospace">40 字节</text>
<line x1="82" y1="252" x2="248" y2="252" stroke="#2e2e44" stroke-width="1"/>
<rect x="70" y="256" width="190" height="30" rx="2" fill="#171724" stroke="#3a3a52" stroke-width="1"/>
<text x="82" y="276" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 6 层帧</text>
<text x="248" y="276" fill="#6a6a82" font-size="9" text-anchor="end" font-family="monospace">40 字节</text>
<line x1="82" y1="284" x2="248" y2="284" stroke="#2e2e44" stroke-width="1"/>
<rect x="70" y="288" width="190" height="34" rx="2" fill="#2a1418" stroke="#e87a8a" stroke-width="1.6"/>
<text x="165.0" y="310" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">guard page（不可访问）</text>
<line x1="165.0" y1="328" x2="165.0" y2="344" stroke="#e87a8a" stroke-width="1.6"/>
<path d="M165,346 L160,336 L170,336 Z" fill="#e87a8a"/>
<text x="177.0" y="342" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">再往下就是别的映射了</text>
<line x1="62" y1="96" x2="62" y2="110" stroke="#67d9a0" stroke-width="2"/>
<text x="56" y="106" fill="#67d9a0" font-size="10" text-anchor="end" font-family="monospace">rsp</text>
<text x="330" y="92" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每层开销 → 最多能递归几层</text>
<text x="330" y="144" fill="#e8965a" font-size="11" text-anchor="start" font-family="monospace">40 字节</text>
<text x="330" y="160" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只有几次加法，无局部数组</text>
<rect x="520" y="130" width="319.29776968607484" height="18" rx="2" fill="#1e2a3a" stroke="#3a5a72" stroke-width="1"/>
<text x="847.2977696860748" y="144" fill="#67b5ef" font-size="10" text-anchor="start" font-family="monospace">21 万层</text>
<text x="330" y="206" fill="#e8965a" font-size="11" text-anchor="start" font-family="monospace">112 字节</text>
<text x="330" y="222" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">带一个 char[64]</text>
<rect x="520" y="192" width="292.4682132537752" height="18" rx="2" fill="#1e2a3a" stroke="#3a5a72" stroke-width="1"/>
<text x="820.4682132537753" y="206" fill="#67b5ef" font-size="10" text-anchor="start" font-family="monospace">7.5 万层</text>
<text x="330" y="268" fill="#e8965a" font-size="11" text-anchor="start" font-family="monospace">4112 字节</text>
<text x="330" y="284" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">带一个 4 KB 缓冲</text>
<rect x="520" y="254" width="198.57781004555392" height="18" rx="2" fill="#1e2a3a" stroke="#3a5a72" stroke-width="1"/>
<text x="726.5778100455539" y="268" fill="#67b5ef" font-size="10" text-anchor="start" font-family="monospace">2040 层</text>
<text x="330" y="330" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一台机器，把局部数组从 0 加到 4 KB，能递归的层数掉了一百倍。</text>
<text x="330" y="350" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这就是为什么「递归写起来漂亮」在实际项目里经常不能用。</text>
<text x="40" y="392" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">栈溢出时进程收到 SIGSEGV，和访问野指针是同一个信号——因为 guard page 本来就是「一块没有映射的地址」。</text>
<text x="40" y="412" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内核看到异常地址落在栈的合法增长范围之外，判定为溢出。深度可以自己量：递归里记 rsp，在信号处理里打印层数。</text>
</svg>
