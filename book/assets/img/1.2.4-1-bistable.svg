<text x="343.0" y="345.0" fill="#e87a8a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">坡顶：任何扰动都会把它推走</text>
<text x="506" y="120" fill="#c8c8dc" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">怎么看这张图</text>
<text x="506" y="152" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把电路的状态想成一个点，它每绕环一圈，</text>
<text x="506" y="172" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">就从横轴的位置跳到曲线上的位置。</text>
<text x="506" y="192" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「停住」等价于「点落在 45° 线上」。</text>
<text x="506" y="232" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三个交点 = 三个不动点：</text>
<circle cx="511" cy="268" r="4" fill="#67d9a0"/>
<text x="524" y="272" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">左交点 (0, 0)</text>
<text x="524" y="289" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">曲线在它下面，扰动后必回来</text>
<text x="524" y="306" fill="#6a6a84" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">稳定，读作 0</text>
<circle cx="511" cy="330" r="4" fill="#67d9a0"/>
<text x="524" y="334" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">右交点 (V, V)</text>
<text x="524" y="351" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">曲线在它上面，扰动后必回来</text>
<text x="524" y="368" fill="#6a6a84" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">稳定，读作 1</text>
<circle cx="511" cy="392" r="4" fill="#e87a8a"/>
<text x="524" y="396" fill="#e87a8a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">中间交点</text>
<text x="524" y="413" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">曲线斜率 > 1，扰动被放大</text>
<text x="524" y="430" fill="#6a6a84" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不稳定，停不住</text>
<line x1="24" y1="486" x2="736" y2="486" stroke="#2a2a3e" stroke-width="1"/>
<text x="24" y="506" fill="#8a8aa4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">判稳的规矩就一条：看曲线在交点处的斜率。小于 1 会把偏差吃掉（稳定），大于 1 会把偏差放大（不稳定）。</text>
</svg>
