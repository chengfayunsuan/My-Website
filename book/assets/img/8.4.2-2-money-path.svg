<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">一次刷流量，钱在哪一段被烧掉</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用户 → CDN → 源站，三段各有各的计费方式</text>
<rect x="70" y="105" width="120" height="70" rx="8" fill="#67b5ef1e" stroke="#67b5ef" stroke-width="1.5"/>
<text x="130" y="136" fill="#67b5ef" font-size="13.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">用户</text>
<text x="130" y="156" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">浏览器、App</text>
<rect x="280" y="105" width="120" height="70" rx="8" fill="#b58ae81e" stroke="#b58ae8" stroke-width="1.5"/>
<text x="340" y="136" fill="#b58ae8" font-size="13.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">CDN 节点</text>
<text x="340" y="156" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">缓存静态资源</text>
<rect x="490" y="105" width="120" height="70" rx="8" fill="#e8965a1e" stroke="#e8965a" stroke-width="1.5"/>
<text x="550" y="136" fill="#e8965a" font-size="13.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">源站</text>
<text x="550" y="156" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的服务器</text>
<line x1="194" y1="140" x2="270" y2="140" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M270,140 L262,135 L262,145 Z" fill="#8a8aa0" stroke="none" stroke-width="0"/>
<line x1="404" y1="140" x2="480" y2="140" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M480,140 L472,135 L472,145 Z" fill="#8a8aa0" stroke="none" stroke-width="0"/>
<text x="232" y="128" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">① 请求</text>
<text x="442" y="128" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">② 回源</text>
<rect x="40" y="206" width="186" height="140" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="40" y="206" width="4" height="140" rx="2" fill="#67b5ef" stroke="none" stroke-width="0"/>
<text x="58" y="232" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">用户端</text>
<text x="58" y="258" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">攻击者伪造海量请求</text>
<text x="58" y="282" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每秒几千个 IP</text>
<text x="58" y="302" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每个只开一次连接</text>
<rect x="246" y="206" width="186" height="140" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="246" y="206" width="4" height="140" rx="2" fill="#b58ae8" stroke="none" stroke-width="0"/>
<text x="264" y="232" fill="#b58ae8" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">CDN 出流量</text>
<text x="264" y="258" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">账单起飞的地方</text>
<text x="264" y="282" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0.2 元 / GB</text>
<text x="264" y="302" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">刷 10 TB 就是 2000 元</text>
<rect x="452" y="206" width="186" height="140" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="452" y="206" width="4" height="140" rx="2" fill="#e8965a" stroke="none" stroke-width="0"/>
<text x="470" y="232" fill="#e8965a" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">源站回源</text>
<text x="470" y="258" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">缓存被打穿</text>
<text x="470" y="282" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CPU 打满、连接数爆</text>
<text x="470" y="302" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">服务是真的挂了</text>
<text x="40" y="368" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最关键的一句：CDN 是替源站挡枪的，但它是按流量收费的——挡得住请求，挡不住账单。</text>
</svg>
