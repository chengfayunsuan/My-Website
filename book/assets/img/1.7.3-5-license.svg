<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.7.3-5  许可证是一条光谱：从「随便用」到「用了就得开源」</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">选错不会立刻出事，等公司做大被律师找上门才发现 —— 那时候改已经来不及了</text>
<rect x="60" y="100" width="760" height="46" rx="3" fill="#14141e" stroke="#2a2a3e" stroke-width="1"/>
<rect x="60.0" y="100" width="212.8" height="46" rx="0" fill="#67d9a0" stroke="#0e0e16" stroke-width="1"/>
<text x="166.4" y="120" fill="#0e0e16" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">MIT / Apache 2.0</text>
<text x="166.4" y="138" fill="#0e0e16" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">随便用</text>
<rect x="272.8" y="100" width="106.39999999999998" height="46" rx="0" fill="#5f9a7a" stroke="#0e0e16" stroke-width="1"/>
<text x="326.0" y="120" fill="#0e0e16" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">BSD</text>
<text x="326.0" y="138" fill="#0e0e16" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">也宽松</text>
<rect x="379.2" y="100" width="182.40000000000003" height="46" rx="0" fill="#e8b84b" stroke="#0e0e16" stroke-width="1"/>
<text x="470.4" y="120" fill="#0e0e16" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">LGPL</text>
<text x="470.4" y="138" fill="#0e0e16" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">库要开源</text>
<rect x="561.6" y="100" width="258.4" height="46" rx="0" fill="#e87a8a" stroke="#0e0e16" stroke-width="1"/>
<text x="690.8" y="120" fill="#0e0e16" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">GPL / AGPL</text>
<text x="690.8" y="138" fill="#0e0e16" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用了就开源</text>
<text x="60" y="90" fill="#67d9a0" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">← 宽松</text>
<text x="820" y="90" fill="#e87a8a" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">传染 →</text>
<text x="30" y="186" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">三个最常问的问题</text>
<circle cx="38" cy="210" r="3.5" fill="#67d9a0"/>
<text x="52" y="214" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">我能用在闭源产品里吗</text>
<text x="52" y="232" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">MIT / Apache / BSD：可以</text>
<text x="52" y="248" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">GPL：不行，整个产品都得开源</text>
<circle cx="38" cy="270" r="3.5" fill="#e8b84b"/>
<text x="52" y="274" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">我改了要开源吗</text>
<text x="52" y="292" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">MIT / Apache / BSD：不用</text>
<text x="52" y="308" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">GPL / LGPL：改了的部分要</text>
<circle cx="38" cy="330" r="3.5" fill="#e8965a"/>
<text x="52" y="334" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">我调用它算不算「链接」</text>
<text x="52" y="352" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">动态链接 vs 静态链接，法律上仍有争议</text>
<text x="52" y="368" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">—— 这条只能问律师</text>
<line x1="30" y1="400" x2="850" y2="400" stroke="#2a2a3e" stroke-width="1"/>
<text x="30" y="424" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">另外还有一份「贡献者许可协议」（CLA）：签了它，你贡献的代码版权归项目方，你保留著作权但授权他随便用。</text>
</svg>
