<text x="136.0" y="318" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">预热</text>
<line x1="100" y1="138.54545454545456" x2="820" y2="138.54545454545456" stroke="#67b5ef" stroke-width="2"/>
