<text x="142.0" y="108.54545454545456" fill="#e8b84b" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">交叉点</text>
<text x="388.0" y="94.63636363636365" fill="#e87a8a" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">峰值</text>
<line x1="520.0" y1="106.63636363636365" x2="520.0" y2="234.27272727272728" stroke="#8a4a56" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="527.0" y="159.8181818181818" fill="#d08896" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">去优化</text>
<text x="527.0" y="173.8181818181818" fill="#9a7080" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">优化成果清零</text>
<text x="36" y="390" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">AOT 从第一毫秒就在自己的水平线上；JIT 起步很低，跨过交叉点后爬到峰值，中途被一次去优化打回原形。</text>
<text x="36" y="408" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以评估任何 JIT 系统，先问跑多久，再问输入分布稳不稳——两问答不上，「快」这个字就没有意义。</text>
</svg>
