<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="t1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1.2 L8,4.5 L0,7.8 z" fill="#9b4df0"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">Type-C：24 针，上下对称</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">正反插不是靠机械花招，是靠两根 CC 针交替上岗</text>

  <!-- ===== 左上：针脚 ===== -->
  <rect x="40" y="72" width="352" height="158" rx="8" fill="#12121c" stroke="#2a2a44"/>
  <text x="56" y="92" fill="#9a9ab4" font-size="9">插座正面看：上排 A1–A12，下排 B12–B1（数字为针脚序号）</text>

  <!-- 上排 A1-A12 -->
  <g>
    <rect x="56" y="100" width="24" height="36" rx="2" fill="#2a2a30" stroke="#9a9ab4"/><text x="68" y="124" fill="#c8c8d4" font-size="8" text-anchor="middle">1</text>
    <rect x="84" y="100" width="24" height="36" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="96" y="124" fill="#9fd4f5" font-size="8" text-anchor="middle">2</text>
    <rect x="112" y="100" width="24" height="36" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="124" y="124" fill="#9fd4f5" font-size="8" text-anchor="middle">3</text>
    <rect x="140" y="100" width="24" height="36" rx="2" fill="#3a1e26" stroke="#f0606a"/><text x="152" y="124" fill="#f0606a" font-size="8" text-anchor="middle">4</text>
    <rect x="168" y="100" width="24" height="36" rx="2" fill="#332a18" stroke="#e8b84b" stroke-width="2"/><text x="180" y="124" fill="#e8b84b" font-size="8" text-anchor="middle">5</text>
    <rect x="196" y="100" width="24" height="36" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="208" y="124" fill="#4ec9a3" font-size="8" text-anchor="middle">6</text>
    <rect x="224" y="100" width="24" height="36" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="236" y="124" fill="#4ec9a3" font-size="8" text-anchor="middle">7</text>
    <rect x="252" y="100" width="24" height="36" rx="2" fill="#2e2a3a" stroke="#9b4df0"/><text x="264" y="124" fill="#cfc6ff" font-size="8" text-anchor="middle">8</text>
    <rect x="280" y="100" width="24" height="36" rx="2" fill="#3a1e26" stroke="#f0606a"/><text x="292" y="124" fill="#f0606a" font-size="8" text-anchor="middle">9</text>
    <rect x="308" y="100" width="24" height="36" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="320" y="124" fill="#9fd4f5" font-size="8" text-anchor="middle">10</text>
    <rect x="336" y="100" width="24" height="36" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="348" y="124" fill="#9fd4f5" font-size="8" text-anchor="middle">11</text>
    <rect x="364" y="100" width="24" height="36" rx="2" fill="#2a2a30" stroke="#9a9ab4"/><text x="376" y="124" fill="#c8c8d4" font-size="8" text-anchor="middle">12</text>
  </g>
  <text x="180" y="146" fill="#e8b84b" font-size="7.5" text-anchor="middle">CC1</text>

  <!-- 下排 B12-B1 -->
  <g>
    <rect x="56" y="152" width="24" height="36" rx="2" fill="#2a2a30" stroke="#9a9ab4"/><text x="68" y="176" fill="#c8c8d4" font-size="8" text-anchor="middle">12</text>
    <rect x="84" y="152" width="24" height="36" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="96" y="176" fill="#9fd4f5" font-size="8" text-anchor="middle">11</text>
    <rect x="112" y="152" width="24" height="36" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="124" y="176" fill="#9fd4f5" font-size="8" text-anchor="middle">10</text>
    <rect x="140" y="152" width="24" height="36" rx="2" fill="#3a1e26" stroke="#f0606a"/><text x="152" y="176" fill="#f0606a" font-size="8" text-anchor="middle">9</text>
    <rect x="168" y="152" width="24" height="36" rx="2" fill="#2e2a3a" stroke="#9b4df0"/><text x="180" y="176" fill="#cfc6ff" font-size="8" text-anchor="middle">8</text>
    <rect x="196" y="152" width="24" height="36" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="208" y="176" fill="#4ec9a3" font-size="8" text-anchor="middle">7</text>
    <rect x="224" y="152" width="24" height="36" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="236" y="176" fill="#4ec9a3" font-size="8" text-anchor="middle">6</text>
    <rect x="252" y="152" width="24" height="36" rx="2" fill="#332a18" stroke="#e8b84b" stroke-width="2"/><text x="264" y="176" fill="#e8b84b" font-size="8" text-anchor="middle">5</text>
    <rect x="280" y="152" width="24" height="36" rx="2" fill="#3a1e26" stroke="#f0606a"/><text x="292" y="176" fill="#f0606a" font-size="8" text-anchor="middle">4</text>
    <rect x="308" y="152" width="24" height="36" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="320" y="176" fill="#9fd4f5" font-size="8" text-anchor="middle">3</text>
    <rect x="336" y="152" width="24" height="36" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="348" y="176" fill="#9fd4f5" font-size="8" text-anchor="middle">2</text>
    <rect x="364" y="152" width="24" height="36" rx="2" fill="#2a2a30" stroke="#9a9ab4"/><text x="376" y="176" fill="#c8c8d4" font-size="8" text-anchor="middle">1</text>
  </g>
  <text x="264" y="200" fill="#e8b84b" font-size="7.5" text-anchor="middle">CC2</text>

  <!-- 图例 -->
  <g font-size="8">
    <rect x="56" y="212" width="9" height="9" rx="1" fill="#3a1e26" stroke="#f0606a"/><text x="70" y="220" fill="#9a9ab4">VBUS ×4</text>
    <rect x="128" y="212" width="9" height="9" rx="1" fill="#2a2a30" stroke="#9a9ab4"/><text x="142" y="220" fill="#9a9ab4">GND ×4</text>
    <rect x="200" y="212" width="9" height="9" rx="1" fill="#332a18" stroke="#e8b84b" stroke-width="1.5"/><text x="214" y="220" fill="#e8b84b">CC ×2</text>
    <rect x="264" y="212" width="9" height="9" rx="1" fill="#1b2740" stroke="#67b5ef"/><text x="278" y="220" fill="#9a9ab4">超速 ×8</text>
    <rect x="330" y="212" width="9" height="9" rx="1" fill="#183028" stroke="#4ec9a3"/><text x="344" y="220" fill="#9a9ab4">D± ×2</text>
  </g>

  <!-- ===== 右上：CC 检测 ===== -->
  <text x="424" y="92" fill="#e8b84b" font-size="10">插上时，两根 CC 里总有一根连上</text>

  <rect x="424" y="104" width="96" height="86" rx="5" fill="#171725" stroke="#4a4a68"/>
  <text x="472" y="128" fill="#d8d8e4" font-size="9.5" text-anchor="middle">充电器</text>
  <text x="472" y="146" fill="#6b6b85" font-size="8.5" text-anchor="middle">源端 · Rp 上拉</text>
  <text x="472" y="164" fill="#6b6b85" font-size="8.5" text-anchor="middle">两根 CC 都接</text>
  <text x="472" y="180" fill="#6b6b85" font-size="8.5" text-anchor="middle">5V / 1.5A / 3A</text>

  <rect x="614" y="104" width="96" height="86" rx="5" fill="#171725" stroke="#4a4a68"/>
  <text x="662" y="128" fill="#d8d8e4" font-size="9.5" text-anchor="middle">设备</text>
  <text x="662" y="146" fill="#6b6b85" font-size="8.5" text-anchor="middle">受端 · Rd 5.1k 下拉</text>
  <text x="662" y="164" fill="#6b6b85" font-size="8.5" text-anchor="middle">插头一翻，</text>
  <text x="662" y="180" fill="#6b6b85" font-size="8.5" text-anchor="middle">换另一根上岗</text>

  <line x1="520" y1="126" x2="614" y2="126" stroke="#e8b84b" stroke-width="1.8"/>
  <circle cx="567" cy="126" r="4" fill="#e8b84b"/>
  <text x="567" y="118" fill="#e8b84b" font-size="8.5" text-anchor="middle">CC1 接通</text>

  <line x1="520" y1="172" x2="614" y2="172" stroke="#4a4a68" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="560" y1="164" x2="574" y2="180" stroke="#f0606a" stroke-width="1.6"/>
  <line x1="574" y1="164" x2="560" y2="180" stroke="#f0606a" stroke-width="1.6"/>
  <text x="567" y="198" fill="#f0606a" font-size="8.5" text-anchor="middle">CC2 悬空</text>

  <text x="424" y="222" fill="#9a9ab4" font-size="8.5">有电压的那根 = 插的方向；悬空那根拿来给线材里的 E-Marker 供电</text>

  <!-- ===== 底部：PD 四步 ===== -->
  <line x1="24" y1="246" x2="736" y2="246" stroke="#2a2a44"/>
  <text x="24" y="268" fill="#d8d8e4" font-size="10.5">谈拢之前，线上一直只有 5 伏</text>

  <rect x="24" y="282" width="166" height="94" rx="6" fill="#171725" stroke="#67b5ef"/>
  <text x="40" y="304" fill="#67b5ef" font-size="9.5">① 报价</text>
  <text x="40" y="324" fill="#d8d8e4" font-size="8.5">Source_Capabilities</text>
  <text x="40" y="340" fill="#9a9ab4" font-size="8.5">5V3A / 9V3A / 12V3A</text>
  <text x="40" y="356" fill="#9a9ab4" font-size="8.5">15V3A / 20V5A</text>

  <rect x="206" y="282" width="166" height="94" rx="6" fill="#171725" stroke="#67b5ef"/>
  <text x="222" y="304" fill="#67b5ef" font-size="9.5">② 挑一档</text>
  <text x="222" y="324" fill="#d8d8e4" font-size="8.5">Request</text>
  <text x="222" y="340" fill="#9a9ab4" font-size="8.5">「第 5 档，20 伏，</text>
  <text x="222" y="356" fill="#9a9ab4" font-size="8.5">但我只用 3.25 安」</text>

  <rect x="388" y="282" width="166" height="94" rx="6" fill="#171725" stroke="#9b4df0"/>
  <text x="404" y="304" fill="#cfc6ff" font-size="9.5">③ 接受</text>
  <text x="404" y="324" fill="#d8d8e4" font-size="8.5">Accept</text>
  <text x="404" y="340" fill="#9a9ab4" font-size="8.5">充电器把电压</text>
  <text x="404" y="356" fill="#9a9ab4" font-size="8.5">慢慢升到 20 伏</text>

  <rect x="570" y="282" width="166" height="94" rx="6" fill="#171725" stroke="#4ec9a3"/>
  <text x="586" y="304" fill="#4ec9a3" font-size="9.5">④ 就绪</text>
  <text x="586" y="324" fill="#d8d8e4" font-size="8.5">PS_RDY</text>
  <text x="586" y="340" fill="#9a9ab4" font-size="8.5">设备才开始按</text>
  <text x="586" y="356" fill="#9a9ab4" font-size="8.5">20 伏取电</text>

  <line x1="192" y1="329" x2="202" y2="329" stroke="#9b4df0" stroke-width="1.6" marker-end="url(#t1)"/>
  <line x1="374" y1="329" x2="384" y2="329" stroke="#9b4df0" stroke-width="1.6" marker-end="url(#t1)"/>
  <line x1="556" y1="329" x2="566" y2="329" stroke="#9b4df0" stroke-width="1.6" marker-end="url(#t1)"/>

  <line x1="24" y1="398" x2="736" y2="398" stroke="#2a2a44"/>
  <text x="24" y="420" fill="#e8b84b" font-size="9">「支持 100 瓦」这件事是线在说，不是头在说：5 安线里嵌了一颗 E-Marker 芯片，读不到就只敢按 3 安供。</text>
  <text x="24" y="444" fill="#9a9ab4" font-size="9">只有 VBUS 和 GND 的「充电线」连 CC 电阻都没有，插在电脑上毫无反应——电脑要先看到电阻才肯输出。</text>
  <text x="24" y="468" fill="#6b6b85" font-size="8.5">PPS 更细：3.3 到 21 伏之间以 20 毫伏为步进连续调，让电池一直工作在最适合的电压上，发热更低。</text>
</svg>
