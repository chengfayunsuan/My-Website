<svg width="900" height="454" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="454" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.3.4-5  乱序执行引擎：前端按顺序，后端随便走，退休再按顺序</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">猜错了能退回去，全靠右边那条重排缓冲（ROB）：没退休的指令，做什么都能撤</text>
<rect x="24" y="100" width="118" height="66" rx="4" fill="#171722" stroke="#5aa9e6" stroke-width="1.4"/>
<text x="83.0" y="126" fill="#5aa9e6" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">取指</text>
<text x="83.0" y="146" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">IF / 分支预测</text>
<rect x="164" y="100" width="118" height="66" rx="4" fill="#171722" stroke="#5aa9e6" stroke-width="1.4"/>
<text x="223.0" y="126" fill="#5aa9e6" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">译码</text>
<text x="223.0" y="146" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">变长 → μop</text>
<rect x="304" y="100" width="118" height="66" rx="4" fill="#171722" stroke="#b78ef0" stroke-width="1.4"/>
<text x="363.0" y="126" fill="#b78ef0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">重命名</text>
<text x="363.0" y="146" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">RAT：架构 → 物理</text>
<rect x="444" y="100" width="118" height="66" rx="4" fill="#171722" stroke="#f0a44a" stroke-width="1.4"/>
<text x="503.0" y="126" fill="#f0a44a" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保留站</text>
<text x="503.0" y="146" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">等操作数齐</text>
<rect x="584" y="100" width="118" height="66" rx="4" fill="#171722" stroke="#67d9a0" stroke-width="1.4"/>
<text x="643.0" y="126" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">执行</text>
<text x="643.0" y="146" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ALU / 访存 / 浮点</text>
<rect x="724" y="100" width="118" height="66" rx="4" fill="#171722" stroke="#67d9a0" stroke-width="1.4"/>
<text x="783.0" y="126" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">写回</text>
<text x="783.0" y="146" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只写物理寄存器</text>
<line x1="142" y1="133.0" x2="160" y2="133.0" stroke="#8a8aa0" stroke-width="1.8"/>
<path d="M156,129.0 L162,133.0 L156,137.0" fill="none" stroke="#8a8aa0" stroke-width="1.8"/>
<line x1="282" y1="133.0" x2="300" y2="133.0" stroke="#8a8aa0" stroke-width="1.8"/>
<path d="M296,129.0 L302,133.0 L296,137.0" fill="none" stroke="#8a8aa0" stroke-width="1.8"/>
<line x1="422" y1="133.0" x2="440" y2="133.0" stroke="#8a8aa0" stroke-width="1.8"/>
<path d="M436,129.0 L442,133.0 L436,137.0" fill="none" stroke="#8a8aa0" stroke-width="1.8"/>
<line x1="562" y1="133.0" x2="580" y2="133.0" stroke="#8a8aa0" stroke-width="1.8"/>
<path d="M576,129.0 L582,133.0 L576,137.0" fill="none" stroke="#8a8aa0" stroke-width="1.8"/>
<line x1="702" y1="133.0" x2="720" y2="133.0" stroke="#8a8aa0" stroke-width="1.8"/>
<path d="M716,129.0 L722,133.0 L716,137.0" fill="none" stroke="#8a8aa0" stroke-width="1.8"/>
<rect x="12" y="82" width="422" height="102" rx="6" fill="none" stroke="#5aa9e6" stroke-width="1"/>
<text x="20" y="76" fill="#5aa9e6" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前端：严格按程序顺序</text>
<rect x="432" y="82" width="430" height="102" rx="6" fill="none" stroke="#f0a44a" stroke-width="1"/>
<text x="442" y="76" fill="#f0a44a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">后端：执行顺序随便，谁准备好谁走</text>
<rect x="304" y="258" width="556" height="62" rx="4" fill="#141420" stroke="#b78ef0" stroke-width="1.4"/>
<text x="314" y="273" fill="#b78ef0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">重排缓冲 ROB：所有指令按程序顺序进来，只有队头能退休</text>
<rect x="316.0" y="284" width="84.33333333333333" height="30" rx="2" fill="#1a1a26" stroke="#67d9a0" stroke-width="1.1"/>
<text x="358.1666666666667" y="298" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">I1</text>
<text x="358.1666666666667" y="310" fill="#7a7a94" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">已退休</text>
<rect x="405.3333333333333" y="284" width="84.33333333333333" height="30" rx="2" fill="#1a1a26" stroke="#67d9a0" stroke-width="1.1"/>
<text x="447.5" y="298" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">I2</text>
<text x="447.5" y="310" fill="#7a7a94" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">已退休</text>
<rect x="494.66666666666663" y="284" width="84.33333333333333" height="30" rx="2" fill="#1a1a26" stroke="#f06a7a" stroke-width="1.1"/>
<text x="536.8333333333333" y="298" fill="#f06a7a" font-size="9" text-anchor="middle" font-family="monospace">I3</text>
<text x="536.8333333333333" y="310" fill="#7a7a94" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">等缓存</text>
<rect x="584.0" y="284" width="84.33333333333333" height="30" rx="2" fill="#1a1a26" stroke="#e0d060" stroke-width="1.1"/>
<text x="626.1666666666666" y="298" fill="#e0d060" font-size="9" text-anchor="middle" font-family="monospace">I4</text>
<text x="626.1666666666666" y="310" fill="#7a7a94" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">算完了</text>
<rect x="673.3333333333333" y="284" width="84.33333333333333" height="30" rx="2" fill="#1a1a26" stroke="#e0d060" stroke-width="1.1"/>
<text x="715.4999999999999" y="298" fill="#e0d060" font-size="9" text-anchor="middle" font-family="monospace">I5</text>
<text x="715.4999999999999" y="310" fill="#7a7a94" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">算完了</text>
<rect x="762.6666666666666" y="284" width="84.33333333333333" height="30" rx="2" fill="#1a1a26" stroke="#e0d060" stroke-width="1.1"/>
<text x="804.8333333333333" y="298" fill="#e0d060" font-size="9" text-anchor="middle" font-family="monospace">I6</text>
<text x="804.8333333333333" y="310" fill="#7a7a94" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">算完了</text>
<line x1="363.0" y1="166" x2="363.0" y2="258" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="503.0" y1="166" x2="503.0" y2="258" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="643.0" y1="166" x2="643.0" y2="258" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="783.0" y1="166" x2="783.0" y2="258" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M830,320 L830,344" fill="none" stroke="#67d9a0" stroke-width="1.8"/>
<text x="830" y="360" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">退休：写内存、报异常</text>
<text x="24" y="396" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">I3 卡在缓存未命中的那 200 拍里，但 I4、I5、I6 已经算完了——它们能在 ROB 里等着，</text>
<text x="24" y="414" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">却不能退休，因为 I3 还没走。程序的可见状态仍然是 I1、I2 之后的那个状态。</text>
<text x="24" y="436" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这条「只允许队头退休」的规则，是整个乱序执行能保持正确性的唯一保证。</text>
</svg>
