<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.2-2  外汇市场的四层：价格是从上往下传的</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你在银行 App 上看到的那个数字，是这条链一层层加价之后的结果</text>
<rect x="60" y="92" width="760" height="60" rx="4" fill="#201a2e" stroke="#b58ae8" stroke-width="1.3"/>
<text x="82" y="117" fill="#b58ae8" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">央行</text>
<text x="82" y="137" fill="#9a9ab4" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">定政策利率，偶尔直接下场买本币</text>
<text x="798" y="128" fill="#6f6f88" font-size="8.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不追求盈利，只追求汇率别失控</text>
<rect x="60" y="182" width="760" height="60" rx="4" fill="#1a2434" stroke="#67b5ef" stroke-width="1.3"/>
<text x="82" y="207" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">做市商 / 大银行</text>
<text x="82" y="227" fill="#9a9ab4" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同时报买入价和卖出价，赚中间的差</text>
<text x="798" y="218" fill="#6f6f88" font-size="8.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全球十几家，报价决定了「公允价」</text>
<rect x="60" y="272" width="760" height="60" rx="4" fill="#16281c" stroke="#67d9a0" stroke-width="1.3"/>
<text x="82" y="297" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">银行间市场</text>
<text x="82" y="317" fill="#9a9ab4" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行互相拆借和买卖外汇</text>
<text x="798" y="308" fill="#6f6f88" font-size="8.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每天七万多亿美元，真正的大池子</text>
<rect x="60" y="362" width="760" height="60" rx="4" fill="#2a2018" stroke="#e8965a" stroke-width="1.3"/>
<text x="82" y="387" fill="#e8965a" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">企业 / 个人</text>
<text x="82" y="407" fill="#9a9ab4" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">付进口货款、发工资、出国旅游</text>
<text x="798" y="398" fill="#6f6f88" font-size="8.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">拿到的价最差，因为要养上面三层</text>
<line x1="440" y1="155" x2="440" y2="173" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M435,173 L440,181 L445,173 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="452" y="171.0" fill="#5f5f78" font-size="7.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">报价往下传</text>
<line x1="440" y1="245" x2="440" y2="263" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M435,263 L440,271 L445,263 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="452" y="261.0" fill="#5f5f78" font-size="7.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">报价往下传</text>
<line x1="440" y1="335" x2="440" y2="353" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M435,353 L440,361 L445,353 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="452" y="351.0" fill="#5f5f78" font-size="7.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">报价往下传</text>
<text x="40" y="442" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">越往下，点差越大、额度越小、速度越慢。一条完整的换汇链条上，每个环节都只赚一点点，但加起来就是普通人看到的价格。</text>
</svg>
