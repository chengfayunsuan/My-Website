<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="306" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.3 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管住资本流动，主要靠三道闸门</text>
<rect x="24" y="92" width="266" height="140" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="157" y="122" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">额度</text>
<text x="157" y="158" fill="#cfcfe0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">个人每年等值 5 万美元</text>
<text x="157" y="184" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">够旅游、留学、看病</text>
<rect x="306" y="92" width="266" height="140" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="439" y="122" fill="#e8b84b" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">真实性</text>
<text x="439" y="158" fill="#cfcfe0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要说明用途、交材料</text>
<text x="439" y="184" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是想换就能换</text>
<rect x="588" y="92" width="266" height="140" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="721" y="122" fill="#b58ae8" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">跨境</text>
<text x="721" y="158" fill="#cfcfe0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">企业大额进出要申报</text>
<text x="721" y="184" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">防止热钱大进大出</text>
<text x="24" y="264" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这三道不是墙，是水闸：该放的放（留学、就医、正常贸易），该拦的拦（投机、洗钱、外逃）。</text>
<text x="24" y="290" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价是手续麻烦，收益是汇率和金融体系不容易被冲垮。</text>
</svg>
