<text x="449.0" y="165" fill="#5f5f78" font-size="9.5" text-anchor="middle" font-family="monospace">4</text>
<rect x="490" y="104" width="78" height="46" rx="3" fill="#14141e" stroke="#67d9a0" stroke-width="1.4"/>
<text x="529.0" y="133" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="monospace">zhang</text>
<text x="529.0" y="165" fill="#8a8aa0" font-size="9.5" text-anchor="middle" font-family="monospace">5</text>
<text x="529.0" y="182" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="monospace">h=13</text>
<rect x="570" y="104" width="78" height="46" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="609.0" y="165" fill="#5f5f78" font-size="9.5" text-anchor="middle" font-family="monospace">6</text>
<rect x="650" y="104" width="78" height="46" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="689.0" y="165" fill="#5f5f78" font-size="9.5" text-anchor="middle" font-family="monospace">7</text>
<text x="90" y="288" fill="#a8a8c0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">新表 · m = 16（容量翻倍，扩容点到了）</text>
<rect x="90" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="113.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">0</text>
