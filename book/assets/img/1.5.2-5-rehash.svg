<text x="289.0" y="182" fill="#67b5ef" font-size="9.5" text-anchor="middle" font-family="monospace">h=10</text>
<rect x="330" y="104" width="78" height="46" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="369.0" y="165" fill="#5f5f78" font-size="9.5" text-anchor="middle" font-family="monospace">3</text>
