<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.5.2-5  扩容必须重新散列：老位置不能照搬</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">槽位 = h % m，m 一变，每个 key 的位置都得重算</text>
<text x="90" y="92" fill="#a8a8c0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">旧表 · m = 8</text>
