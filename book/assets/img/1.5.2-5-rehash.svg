<text x="305.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">4</text>
<rect x="330" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="353.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">5</text>
<rect x="378" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="401.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">6</text>
<rect x="426" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="449.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">7</text>
<rect x="474" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="497.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">8</text>
<rect x="522" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#e8965a" stroke-width="1.4"/>
<text x="545.0" y="326" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="monospace">sun</text>
<text x="545.0" y="356" fill="#8a8aa0" font-size="9" text-anchor="middle" font-family="monospace">9</text>
<rect x="570" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#67b5ef" stroke-width="1.4"/>
<text x="593.0" y="326" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="monospace">liu</text>
<text x="593.0" y="356" fill="#8a8aa0" font-size="9" text-anchor="middle" font-family="monospace">10</text>
<rect x="618" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="641.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">11</text>
<rect x="666" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="689.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">12</text>
<rect x="714" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#67d9a0" stroke-width="1.4"/>
<text x="737.0" y="326" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="monospace">zhang</text>
<text x="737.0" y="356" fill="#8a8aa0" font-size="9" text-anchor="middle" font-family="monospace">13</text>
<rect x="762" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="785.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">14</text>
<rect x="810" y="300" width="46" height="42" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="833.0" y="356" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">15</text>
<line x1="289.0" y1="184" x2="593.0" y2="296" stroke="#67b5ef" stroke-width="1.4"/>
<polygon points="593.0,296 587.0,296.4 588.7,291.8" fill="#67b5ef"/>
<line x1="529.0" y1="184" x2="737.0" y2="296" stroke="#67d9a0" stroke-width="1.4"/>
<polygon points="737.0,296 731.0,295.6 733.3,291.2" fill="#67d9a0"/>
<line x1="209.0" y1="184" x2="545.0" y2="296" stroke="#e8965a" stroke-width="1.4"/>
<polygon points="545.0,296 539.0,296.6 540.6,291.9" fill="#e8965a"/>
<text x="866" y="246" fill="#8a8aa0" font-size="10.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个 key，三个新位置</text>
<text x="866" y="266" fill="#8a8aa0" font-size="10.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">—— 因为除数从 8 换成了 16</text>
<text x="36" y="418" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扩容不是把老数组拷过去就完事：槽位是 h % m 算出来的，m 变了，每个 key 都得重新算一遍再落位。</text>
<text x="36" y="436" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这就是 rehash。翻倍扩容摊还下来插入仍是 O(1)，但「那一次」要对全部 key 重算重放，是个真实的停顿。</text>
<text x="36" y="456" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Redis 的对策是渐进式 rehash：新旧两表并存，每次读写顺手搬一桶，把停顿摊到无数次操作上。</text>
</svg>
