<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="450" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.4-1  两种测法：抽样和埋点</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个每隔几毫秒问一次「你在干嘛」，一个在每个函数门口装个计数器</text>
<text x="30" y="84" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">采样（sampling）</text>
<text x="150" y="84" fill="#6f6f88" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每 10 毫秒打断一次，记下当前在哪个函数</text>
<rect x="30" y="96" width="160" height="34" rx="2" fill="#14141e" stroke="#67b5ef" stroke-width="1.2"/>
<text x="110.0" y="118" fill="#67b5ef" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">parse</text>
<rect x="190" y="96" width="120" height="34" rx="2" fill="#14141e" stroke="#b58ae8" stroke-width="1.2"/>
<text x="250.0" y="118" fill="#b58ae8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">render</text>
<rect x="310" y="96" width="110" height="34" rx="2" fill="#14141e" stroke="#e8b84b" stroke-width="1.2"/>
<text x="365.0" y="118" fill="#e8b84b" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">sort</text>
<rect x="420" y="96" width="260" height="34" rx="2" fill="#14141e" stroke="#e8965a" stroke-width="1.2"/>
<text x="550.0" y="118" fill="#e8965a" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">network</text>
<line x1="34" y1="96" x2="34" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="64" y1="96" x2="64" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="94" y1="96" x2="94" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="124" y1="96" x2="124" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="154" y1="96" x2="154" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="184" y1="96" x2="184" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="214" y1="96" x2="214" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="244" y1="96" x2="244" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="274" y1="96" x2="274" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="304" y1="96" x2="304" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="334" y1="96" x2="334" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="364" y1="96" x2="364" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="394" y1="96" x2="394" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="424" y1="96" x2="424" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="454" y1="96" x2="454" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="484" y1="96" x2="484" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="514" y1="96" x2="514" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="544" y1="96" x2="544" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="574" y1="96" x2="574" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="604" y1="96" x2="604" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="634" y1="96" x2="634" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="664" y1="96" x2="664" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="694" y1="96" x2="694" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="724" y1="96" x2="724" y2="144" stroke="#e87a8a" stroke-width="1.4"/>
<text x="30" y="164" fill="#8a8aa2" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 每根红线是一次采样。跑 10 秒采 1000 次，数一数落在各函数里的次数，就是时间占比</text>
<text x="30" y="190" fill="#67d9a0" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开销：1% 到 3%</text>
<text x="30" y="208" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">看不到：活不到 10 毫秒的短函数</text>
<text x="30" y="248" fill="#67b5ef" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">插桩（instrumentation）</text>
<text x="196" y="248" fill="#6f6f88" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在每个函数入口和出口插一条记录，进出都记一笔</text>
<rect x="30" y="262" width="700" height="90" rx="3" fill="#12121c" stroke="#2a2a3e" stroke-width="1"/>
<rect x="50" y="272" width="660" height="20" rx="2" fill="#16202c" stroke="#67b5ef" stroke-width="1"/>
<text x="60" y="286" fill="#7a9ab8" font-size="8.2" text-anchor="start" font-family="monospace">main  entry ........................................................ exit</text>
<rect x="70" y="296" width="300" height="18" rx="2" fill="#201a2e" stroke="#b58ae8" stroke-width="1"/>
<text x="80" y="309" fill="#a08ac0" font-size="8.2" text-anchor="start" font-family="monospace">parse  entry ............... exit</text>
<rect x="390" y="296" width="280" height="18" rx="2" fill="#2a2410" stroke="#e8b84b" stroke-width="1"/>
<text x="400" y="309" fill="#c8a860" font-size="8.2" text-anchor="start" font-family="monospace">render  entry .............. exit</text>
<rect x="90" y="320" width="120" height="18" rx="2" fill="#201a2e" stroke="#b58ae8" stroke-width="1"/>
<text x="100" y="333" fill="#a08ac0" font-size="8.2" text-anchor="start" font-family="monospace">lex  in .... out</text>
<text x="30" y="380" fill="#e87a8a" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开销：30% 到 200%（函数越碎越贵）</text>
<text x="30" y="398" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能看到：每一个函数，再短也跑不掉</text>
<line x1="30" y1="414" x2="850" y2="414" stroke="#2a2a3e" stroke-width="1"/>
<text x="30" y="438" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以生产环境默认用采样（开销小到可以一直开着），只有在需要精确计数时才上插桩。</text>
</svg>
