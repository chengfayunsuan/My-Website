<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="336" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.1 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一笔存款，能在体系里转好几圈</text>
<rect x="40" y="88" width="190" height="70" rx="8" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="135.0" y="116" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你存 100 元</text>
<text x="135.0" y="138" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在 A 银行</text>
<rect x="330" y="88" width="200" height="70" rx="8" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="430.0" y="116" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">A 银行贷给企业</text>
<text x="430.0" y="138" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">80 元</text>
<rect x="620" y="88" width="200" height="70" rx="8" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="720.0" y="116" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">企业付给供应商</text>
<text x="720.0" y="138" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱到 B 银行</text>
<rect x="330" y="216" width="200" height="70" rx="8" fill="#16161f" stroke="#b58ae8" stroke-width="1.5"/>
<text x="430.0" y="244" fill="#b58ae8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">B 银行再贷出去</text>
<text x="430.0" y="266" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">64 元</text>
<rect x="40" y="216" width="190" height="70" rx="8" fill="#16161f" stroke="#e87a8a" stroke-width="1.5"/>
<text x="135.0" y="244" fill="#e87a8a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">又变成别人的存款</text>
<text x="135.0" y="266" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一圈接一圈</text>
<path d="M234,123 L320,123" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M320,117 L330,123 L320,129 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<path d="M534,123 L612,123" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M612,117 L622,123 L612,129 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<path d="M720,162 L720,190 L434,190 L434,208" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M428,208 L434,218 L440,208 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<path d="M330,251 L238,251" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M238,245 L228,251 L238,257 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<text x="40" y="314" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意：这 100 元从头到尾只有一份现金，但账上出现了 100 + 80 + 64 的“钱”。这就是信用货币。</text>
</svg>
