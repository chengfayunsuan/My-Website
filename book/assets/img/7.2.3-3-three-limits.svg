<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="306" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.3 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行不能无限造钱，卡在三道约束上</text>
<rect x="24" y="92" width="266" height="138" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="157" y="122" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">准备金率</text>
<text x="157" y="158" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每收 100 元存款，</text>
<text x="157" y="184" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">必须留一部分在央行</text>
<rect x="306" y="92" width="266" height="138" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="439" y="122" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资本充足率</text>
<text x="439" y="158" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">放出去的贷款要有资本金</text>
<text x="439" y="184" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">兜底，大约 8%～11%</text>
<rect x="588" y="92" width="266" height="138" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="721" y="122" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">流动性</text>
<text x="721" y="158" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">随时能变现的资产</text>
<text x="721" y="184" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要够应付日常支取</text>
<text x="24" y="266" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三道约束里，资本充足率是最硬的：贷款亏了要用资本金填，资本金不够就得停贷。</text>
<text x="24" y="292" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以“银行能造钱”这句话对，但只在约束之内成立。</text>
</svg>
