<svg width="880" height="392" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="392" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">脏钱洗白的三个环节</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一笔被追回的诈骗资金，都是在这条链上的某一环被截住的。</text>
<rect x="40" y="84" width="240" height="206" rx="6" fill="#15151f" stroke="#e8965a" stroke-width="1.4"/>
<text x="58" y="112" fill="#e8965a" font-size="15" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">① 处置</text>
<text x="58" y="134" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="monospace">Placement</text>
<text x="58" y="162" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">赃款进入金融体系，</text>
<text x="58" y="184" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这是最容易被抓的一步</text>
<text x="58" y="218" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">例：诈骗得手 50 万现金，</text>
<text x="58" y="238" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分给 20 张收购来的卡，</text>
<text x="58" y="258" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在不同网点的 ATM</text>
<text x="58" y="278" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">零散存入，每张 2.5 万</text>
<path d="M280,179 L330,179" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M330,172 L342,179 L330,186 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="1"/>
<rect x="342" y="84" width="240" height="206" rx="6" fill="#15151f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="360" y="112" fill="#67b5ef" font-size="15" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">② 离析</text>
<text x="360" y="134" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="monospace">Layering</text>
<text x="360" y="162" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">层层转移，切断</text>
<text x="360" y="184" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱和案子的关系</text>
<text x="360" y="218" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">例：跨行快进快出，</text>
<text x="360" y="238" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">拆成上百笔流向跑分</text>
<text x="360" y="258" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">平台和虚拟货币，</text>
<text x="360" y="278" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">10 分钟过三层</text>
<path d="M582,179 L632,179" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M632,172 L644,179 L632,186 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="1"/>
<rect x="644" y="84" width="200" height="206" rx="6" fill="#15151f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="662" y="112" fill="#67d9a0" font-size="15" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">③ 融合</text>
<text x="662" y="134" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="monospace">Integration</text>
<text x="662" y="162" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">变成看起来合法</text>
<text x="662" y="184" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">的钱</text>
<text x="662" y="218" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">例：以「经营收入」</text>
<text x="662" y="238" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">「借款还款」名义</text>
<text x="662" y="258" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">回流，进入消费和</text>
<text x="662" y="278" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">投资循环</text>
<line x1="40" y1="312" x2="844" y2="312" stroke="#3a3a52" stroke-width="1"/>
<text x="40" y="338" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">反洗钱管的就是这三步：处置靠开户尽调拦，离析靠交易监测盯，</text>
<text x="40" y="362" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">融合最难查——所以整条链的前两步都要压缩。</text>
</svg>
