<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="306" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.3 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三万多亿美元的外汇储备，是稳定汇率的弹药</text>
<rect x="30" y="96" width="220" height="148" rx="10" fill="#16161f" stroke="#e8b84b" stroke-width="1.6"/>
<text x="140" y="140" fill="#e8b84b" font-size="22" text-anchor="middle" font-family="monospace">3.2 万亿</text>
<text x="140" y="172" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美元等外币资产</text>
<text x="140" y="196" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是政府的「闲钱」</text>
<rect x="320" y="96" width="530" height="40" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="336" y="121" fill="#b8b8cc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">稳住汇率：有人疯狂抛人民币时，用它买回来</text>
<path d="M252,166 L300,116" fill="none" stroke="#4a4a62" stroke-width="1.2"/>
<rect x="320" y="150" width="530" height="40" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="336" y="175" fill="#b8b8cc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">支付进口：买油、买粮、买芯片要用外汇</text>
<path d="M252,166 L300,170" fill="none" stroke="#4a4a62" stroke-width="1.2"/>
<rect x="320" y="204" width="530" height="40" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="336" y="229" fill="#b8b8cc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">应对挤兑：外资集中撤走时的缓冲垫</text>
<path d="M252,166 L300,224" fill="none" stroke="#4a4a62" stroke-width="1.2"/>
<text x="24" y="282" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它对应的另一面是负债：央行要放出等额人民币，所以外储增加时，国内流动性也会增加。</text>
</svg>
