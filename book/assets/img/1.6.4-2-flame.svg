<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.4-2  火焰图怎么读：宽度是时间，不是时间轴</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一层是一层调用栈，块越宽表示采样落在它里面的次数越多；找最宽的「平顶」</text>
<rect x="60" y="350" width="500" height="30" rx="2" fill="#3a4a5a" stroke="none" stroke-width="1.5"/>
<text x="68" y="370" fill="#d8d8e4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">main  100%</text>
<rect x="60" y="316" width="371" height="30" rx="2" fill="#2a3a4a" stroke="none" stroke-width="1.5"/>
<text x="68" y="336" fill="#d8d8e4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">handle_request  74%</text>
<rect x="431" y="316" width="129" height="30" rx="2" fill="#2a2a3e" stroke="none" stroke-width="1.5"/>
<text x="439" y="336" fill="#d8d8e4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">log  26%</text>
<rect x="60" y="282" width="214" height="30" rx="2" fill="#201a2e" stroke="none" stroke-width="1.5"/>
<text x="68" y="302" fill="#d8d8e4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">parse_json  43%</text>
<rect x="274" y="282" width="157" height="30" rx="2" fill="#201a2e" stroke="none" stroke-width="1.5"/>
<text x="282" y="302" fill="#d8d8e4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">validate  31%</text>
<rect x="60" y="248" width="186" height="30" rx="2" fill="#7a2a3a" stroke="none" stroke-width="1.5"/>
<text x="68" y="268" fill="#d8d8e4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">scan_string  37%</text>
<rect x="246" y="248" width="28" height="30" rx="2" fill="#2a2a3e" stroke="none" stroke-width="1.5"/>
<rect x="274" y="248" width="86" height="30" rx="2" fill="#2a2a3e" stroke="none" stroke-width="1.5"/>
<text x="282" y="268" fill="#d8d8e4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">check  17%</text>
<rect x="360" y="248" width="71" height="30" rx="2" fill="#2a2a3e" stroke="none" stroke-width="1.5"/>
<text x="104" y="236" fill="#e87a8a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↓ 最宽的平顶，热点就在这儿</text>
<line x1="104" y1="242" x2="104" y2="248" stroke="#e87a8a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="60" y="398" fill="#6f6f88" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">自下而上是调用方向：main 调用 handle_request，后者又调用 parse_json 和 validate</text>
<text x="60" y="416" fill="#6f6f88" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左右并排的块是「兄弟」：它们是同一个函数里的不同分支，宽度加起来才是父函数的总时间</text>
<text x="600" y="96" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">读图三条</text>
<text x="600" y="126" fill="#e87a8a" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">找平顶</text>
<text x="600" y="144" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">顶部没有子块、又很宽的那一段，</text>
<text x="600" y="160" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">就是真正在干活的地方</text>
<text x="600" y="200" fill="#67b5ef" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">看宽度</text>
<text x="600" y="218" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">宽度 = 采样占比 = 时间占比，</text>
<text x="600" y="234" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">和横轴上的位置无关</text>
<text x="600" y="274" fill="#e8b84b" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">别当时间轴</text>
<text x="600" y="292" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左边不等于「先执行」，</text>
<text x="600" y="308" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一层的块顺序没有意义</text>
<text x="30" y="442" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一次看火焰图最容易犯的错：把它当成时间轴，以为左边先发生、越往右越晚。实际上横轴的唯一含义是「占了多少时间」。</text>
</svg>
