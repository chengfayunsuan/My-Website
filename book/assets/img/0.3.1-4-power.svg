<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="400" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">功耗是一道加法，余量是一道乘法</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">算出峰值 425 瓦，再乘 1.5，得到该买的 650 瓦</text>

  <line x1="80" y1="330" x2="700" y2="330" stroke="#4a4a68"/>
  <g fill="#6b6b85" font-size="8" text-anchor="middle">
    <text x="80" y="346">0</text><text x="235" y="346">200</text><text x="390" y="346">400</text>
    <text x="545" y="346">600</text><text x="700" y="346">800 W</text>
  </g>
  <g stroke="#2a2a44">
    <line x1="235" y1="326" x2="235" y2="334"/><line x1="390" y1="326" x2="390" y2="334"/><line x1="545" y1="326" x2="545" y2="334"/>
  </g>

  <text x="24" y="98" fill="#d8d8e4" font-size="9.5">实际峰值</text>
  <rect x="80" y="82" width="97" height="28" fill="#1b2740" stroke="#67b5ef"/>
  <text x="128" y="100" fill="#9fd4f5" font-size="7.5" text-anchor="middle">CPU 125</text>
  <rect x="177" y="82" width="194" height="28" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="274" y="100" fill="#cfc6ff" font-size="8" text-anchor="middle">显卡 250</text>
  <rect x="371" y="82" width="39" height="28" fill="#20303a" stroke="#4ec9a3"/>
  <text x="420" y="100" fill="#e8b84b" font-size="9">425 W</text>

  <text x="24" y="168" fill="#d8d8e4" font-size="9.5">推荐电源</text>
  <rect x="80" y="152" width="97" height="28" fill="#1b2740" fill-opacity="0.5" stroke="#67b5ef"/>
  <rect x="177" y="152" width="194" height="28" fill="#2e2a3a" fill-opacity="0.5" stroke="#9b4df0"/>
  <rect x="371" y="152" width="39" height="28" fill="#20303a" fill-opacity="0.5" stroke="#4ec9a3"/>
  <rect x="410" y="152" width="174" height="28" fill="none" stroke="#e8b84b" stroke-dasharray="4 3"/>
  <text x="497" y="170" fill="#e8b84b" font-size="8" text-anchor="middle">余量 225</text>
  <text x="594" y="170" fill="#e8b84b" font-size="9">650 W</text>

  <text x="24" y="238" fill="#d8d8e4" font-size="9.5">半载工作点</text>
  <rect x="80" y="222" width="252" height="28" fill="#20303a" fill-opacity="0.7" stroke="#4ec9a3"/>
  <text x="206" y="240" fill="#9fe0c9" font-size="8" text-anchor="middle">实际用掉 325 瓦（效率最高、最安静）</text>
  <text x="342" y="240" fill="#9fe0c9" font-size="9">325 W</text>

  <line x1="24" y1="356" x2="736" y2="356" stroke="#2a2a44"/>
  <text x="24" y="376" fill="#e8b84b" font-size="9">为什么是 1.5 倍：显卡瞬态尖峰能到平均的两倍，而电源在半载时效率最高、风扇最安静。</text>
  <text x="24" y="396" fill="#6b6b85" font-size="8.5">留太多是浪费钱（大电源低负载效率反而低），留太少会随机重启——1.4 到 1.5 是个好落点。</text>
</svg>
