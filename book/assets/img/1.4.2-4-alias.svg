<svg width="860" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="860" height="420" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">别名：为什么编译器不敢把这两行并行</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左边两个指针可能指向同一块内存，每轮循环都可能改掉下一轮要读的值；右边加了 restrict，编译器才敢四个一组</text>
<text x="30" y="74" fill="#e87a8a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">有别名：编译器只能逐轮执行</text>
<rect x="56" y="118" width="36" height="30" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="74.0" y="137" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">0</text>
<rect x="92" y="118" width="36" height="30" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="110.0" y="137" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">1</text>
<rect x="128" y="118" width="36" height="30" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="146.0" y="137" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">2</text>
<rect x="164" y="118" width="36" height="30" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="182.0" y="137" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">3</text>
<rect x="200" y="118" width="36" height="30" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="218.0" y="137" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">4</text>
<rect x="236" y="118" width="36" height="30" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="254.0" y="137" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">5</text>
<rect x="272" y="118" width="36" height="30" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="290.0" y="137" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">6</text>
<rect x="308" y="118" width="36" height="30" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="326.0" y="137" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">7</text>
<text x="74" y="101" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="monospace">a</text>
<line x1="74" y1="103" x2="74.0" y2="108.0" stroke="#67b5ef" stroke-width="1.2"/>
<polygon points="74,116 70.0,108.0 78.0,108.0" fill="#67b5ef"/>
<text x="146" y="101" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="monospace">b</text>
<line x1="146" y1="103" x2="146.0" y2="108.0" stroke="#67d9a0" stroke-width="1.2"/>
<polygon points="146,116 142.0,108.0 150.0,108.0" fill="#67d9a0"/>
<rect x="92" y="112" width="108" height="42" rx="3" fill="none" stroke="#e8b84b" stroke-width="1.2"/>
<text x="146" y="174" fill="#e8b84b" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这两个指针可能指向同一块内存</text>
<rect x="56" y="196" width="52" height="34" rx="3" fill="#16161f" stroke="#3a3a52" stroke-width="1.1"/>
<text x="82" y="217" fill="#8a8aa4" font-size="9" text-anchor="middle" font-family="monospace">i=0</text>
<line x1="110" y1="213" x2="118.0" y2="213.0" stroke="#7a7a92" stroke-width="1.2"/>
<polygon points="126,213 118.0,217.0 118.0,209.0" fill="#7a7a92"/>
<rect x="128" y="196" width="52" height="34" rx="3" fill="#16161f" stroke="#3a3a52" stroke-width="1.1"/>
<text x="154" y="217" fill="#8a8aa4" font-size="9" text-anchor="middle" font-family="monospace">i=1</text>
<line x1="182" y1="213" x2="190.0" y2="213.0" stroke="#7a7a92" stroke-width="1.2"/>
<polygon points="198,213 190.0,217.0 190.0,209.0" fill="#7a7a92"/>
<rect x="200" y="196" width="52" height="34" rx="3" fill="#16161f" stroke="#3a3a52" stroke-width="1.1"/>
<text x="226" y="217" fill="#8a8aa4" font-size="9" text-anchor="middle" font-family="monospace">i=2</text>
<line x1="254" y1="213" x2="262.0" y2="213.0" stroke="#7a7a92" stroke-width="1.2"/>
<polygon points="270,213 262.0,217.0 262.0,209.0" fill="#7a7a92"/>
<rect x="272" y="196" width="52" height="34" rx="3" fill="#16161f" stroke="#3a3a52" stroke-width="1.1"/>
<text x="298" y="217" fill="#8a8aa4" font-size="9" text-anchor="middle" font-family="monospace">i=3</text>
<text x="56" y="252" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每轮都要等上一轮写完，因为 b[i] 可能被 a[j] 改过</text>
<line x1="432" y1="66" x2="432" y2="300" stroke="#26263a" stroke-width="1"/>
<text x="456" y="74" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">restrict：承诺两块内存不重叠</text>
<text x="462" y="132" fill="#67b5ef" font-size="10" text-anchor="start" font-family="monospace">a</text>
<rect x="480" y="112" width="36" height="30" rx="2" fill="#16161f" stroke="#67b5ef" stroke-width="1"/>
<text x="498.0" y="131" fill="#4e4e66" font-size="7.5" text-anchor="middle" font-family="monospace">a[0]</text>
<rect x="516" y="112" width="36" height="30" rx="2" fill="#16161f" stroke="#67b5ef" stroke-width="1"/>
<text x="534.0" y="131" fill="#4e4e66" font-size="7.5" text-anchor="middle" font-family="monospace">a[1]</text>
<rect x="552" y="112" width="36" height="30" rx="2" fill="#16161f" stroke="#67b5ef" stroke-width="1"/>
<text x="570.0" y="131" fill="#4e4e66" font-size="7.5" text-anchor="middle" font-family="monospace">a[2]</text>
<rect x="588" y="112" width="36" height="30" rx="2" fill="#16161f" stroke="#67b5ef" stroke-width="1"/>
<text x="606.0" y="131" fill="#4e4e66" font-size="7.5" text-anchor="middle" font-family="monospace">a[3]</text>
<text x="462" y="178" fill="#67d9a0" font-size="10" text-anchor="start" font-family="monospace">b</text>
<rect x="480" y="158" width="36" height="30" rx="2" fill="#16161f" stroke="#67d9a0" stroke-width="1"/>
<text x="498.0" y="177" fill="#4e4e66" font-size="7.5" text-anchor="middle" font-family="monospace">b[0]</text>
<rect x="516" y="158" width="36" height="30" rx="2" fill="#16161f" stroke="#67d9a0" stroke-width="1"/>
<text x="534.0" y="177" fill="#4e4e66" font-size="7.5" text-anchor="middle" font-family="monospace">b[1]</text>
<rect x="552" y="158" width="36" height="30" rx="2" fill="#16161f" stroke="#67d9a0" stroke-width="1"/>
<text x="570.0" y="177" fill="#4e4e66" font-size="7.5" text-anchor="middle" font-family="monospace">b[2]</text>
<rect x="588" y="158" width="36" height="30" rx="2" fill="#16161f" stroke="#67d9a0" stroke-width="1"/>
<text x="606.0" y="177" fill="#4e4e66" font-size="7.5" text-anchor="middle" font-family="monospace">b[3]</text>
<rect x="480" y="196" width="52" height="34" rx="3" fill="#16161f" stroke="#67d9a0" stroke-width="1.1"/>
<text x="506" y="217" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">i=0</text>
<rect x="552" y="196" width="52" height="34" rx="3" fill="#16161f" stroke="#67d9a0" stroke-width="1.1"/>
<text x="578" y="217" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">i=1</text>
<rect x="624" y="196" width="52" height="34" rx="3" fill="#16161f" stroke="#67d9a0" stroke-width="1.1"/>
<text x="650" y="217" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">i=2</text>
<rect x="696" y="196" width="52" height="34" rx="3" fill="#16161f" stroke="#67d9a0" stroke-width="1.1"/>
<text x="722" y="217" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">i=3</text>
<text x="456" y="252" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">四个互不相干，一条 SIMD 指令同时算完</text>
<text x="30" y="320" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">编译器默认「指针可能重叠」，因为它没法在编译期知道调用者传什么。restrict 不是优化开关，是把「我知道它们不重叠」这个事实写进类型系统。</text>
<text x="30" y="342" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">承诺的代价：真传了两个重叠的指针进来，行为未定义——不会报错，只会算错。</text>
</svg>
