<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.1-2  央行对银行做的四件事</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">「央行的银行」不是口号，是四条具体的通道。每一条都能在银行流水里看到</text>
<rect x="40" y="106" width="176" height="250" rx="6" fill="#201a2e" stroke="#b58ae8" stroke-width="1.6"/>
<text x="128" y="140" fill="#b58ae8" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">中国人民银行</text>
<text x="128" y="168" fill="#9a8ab4" font-size="9.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只跟银行往来</text>
<text x="128" y="188" fill="#9a8ab4" font-size="9.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不碰企业和个人</text>
<rect x="664" y="106" width="176" height="250" rx="6" fill="#1a2434" stroke="#67b5ef" stroke-width="1.6"/>
<text x="752" y="140" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">商业银行</text>
<text x="752" y="168" fill="#7a8aa2" font-size="9.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">四千多家</text>
<text x="752" y="188" fill="#7a8aa2" font-size="9.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">直接面对你我</text>
<rect x="262" y="116" width="356" height="46" rx="5" fill="#16161f" stroke="#67d9a0" stroke-width="1.3"/>
<text x="276" y="136" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">准备金账户</text>
<text x="276" y="153" fill="#9a9ab4" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行在这里开户存钱，所有清算的终点站</text>
<line x1="218" y1="139" x2="256" y2="139" stroke="#b58ae8" stroke-width="1.4"/>
<path d="M256,133.5 L266,139 L256,144.5 Z" fill="#b58ae8" stroke="#b58ae8" stroke-width="1"/>
<line x1="626" y1="139" x2="660" y2="139" stroke="#67b5ef" stroke-width="1.4"/>
<path d="M660,133.5 L670,139 L660,144.5 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<rect x="262" y="176" width="356" height="46" rx="5" fill="#16161f" stroke="#e8965a" stroke-width="1.3"/>
<text x="276" y="196" fill="#e8965a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">借钱的窗口</text>
<text x="276" y="213" fill="#9a9ab4" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">逆回购、MLF、再贷款，要抵押、要付息</text>
<line x1="218" y1="199" x2="256" y2="199" stroke="#b58ae8" stroke-width="1.4"/>
<path d="M256,193.5 L266,199 L256,204.5 Z" fill="#b58ae8" stroke="#b58ae8" stroke-width="1"/>
<line x1="626" y1="199" x2="660" y2="199" stroke="#67b5ef" stroke-width="1.4"/>
<path d="M660,193.5 L670,199 L660,204.5 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<rect x="262" y="236" width="356" height="46" rx="5" fill="#16161f" stroke="#67b5ef" stroke-width="1.3"/>
<text x="276" y="256" fill="#67b5ef" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">清算系统</text>
<text x="276" y="273" fill="#9a9ab4" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大额支付系统，银行之间的账在这里划</text>
<line x1="218" y1="259" x2="256" y2="259" stroke="#b58ae8" stroke-width="1.4"/>
<path d="M256,253.5 L266,259 L256,264.5 Z" fill="#b58ae8" stroke="#b58ae8" stroke-width="1"/>
<line x1="626" y1="259" x2="660" y2="259" stroke="#67b5ef" stroke-width="1.4"/>
<path d="M660,253.5 L670,259 L660,264.5 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<rect x="262" y="296" width="356" height="46" rx="5" fill="#16161f" stroke="#e8b84b" stroke-width="1.3"/>
<text x="276" y="316" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">现金投放</text>
<text x="276" y="333" fill="#9a9ab4" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ATM 里的钞票是央行印的，银行只是搬运</text>
<line x1="218" y1="319" x2="256" y2="319" stroke="#b58ae8" stroke-width="1.4"/>
<path d="M256,313.5 L266,319 L256,324.5 Z" fill="#b58ae8" stroke="#b58ae8" stroke-width="1"/>
<line x1="626" y1="319" x2="660" y2="319" stroke="#67b5ef" stroke-width="1.4"/>
<path d="M660,313.5 L670,319 L660,324.5 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<text x="40" y="392" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这四条通道对应教科书里的三个身份：发行的银行（印钞）、银行的银行（准备金、最后贷款人、清算）、政府的银行（国库、国债）。</text>
<text x="40" y="416" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">但别把它当口诀背——落到具体动作上，你才知道「降准」动的是第一条，「逆回购」动的是第二条。</text>
<text x="40" y="442" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行做不到的事同样清楚：它不给你开储蓄账户、不放房贷、不收你的存款。它想影响你，只能通过右边这四千多家。</text>
</svg>
