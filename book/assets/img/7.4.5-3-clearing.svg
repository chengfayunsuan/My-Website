<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="300" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.4.5 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同样一笔消费，境内和境外的清算路径不一样</text>
<rect x="40" y="76" width="380" height="170" rx="8" fill="#14141e" stroke="#67b5ef" stroke-width="1.3"/>
<text x="60" y="102" fill="#67b5ef" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">境内消费（人民币）</text>
<text x="60" y="130" fill="#c8c8d4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的卡 → 发卡行 → 银联 → 收单行 → 商户</text>
<text x="60" y="158" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">清算在境内完成，当天或 T+1 到账</text>
<text x="60" y="186" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全程人民币，不涉及换汇</text>
<text x="60" y="214" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费率 0.5%～0.6%，封顶规则由发改委定</text>
<rect x="460" y="76" width="380" height="170" rx="8" fill="#14141e" stroke="#e8965a" stroke-width="1.3"/>
<text x="480" y="102" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">境外消费（外币）</text>
<text x="480" y="130" fill="#c8c8d4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的卡 → 发卡行 → Visa/万事达 → 收单行 → 商户</text>
<text x="480" y="158" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">清算在卡组织的全球网络里跑，美元为主</text>
<text x="480" y="186" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要换汇，还可能收 1%～2% 货币转换费</text>
<text x="480" y="214" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">到账慢，争议处理也更久</text>
<text x="40" y="280" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡组织不只是"通道"，它是规则制定者：谁能接入、费率多少、争议怎么判，都是它定的。</text>
</svg>
