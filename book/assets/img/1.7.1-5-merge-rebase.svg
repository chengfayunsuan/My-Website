<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.7.1-5  merge 留一个岔口，rebase 抹平它</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同样是把分支合进来，一个保留了「曾经并行过」这件事，一个当它没发生过</text>
<text x="30" y="76" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">merge：保留岔口</text>
<text x="158" y="76" fill="#6f6f88" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">造一个「合并提交」，它有两个父提交</text>
<circle cx="90" cy="122" r="22" fill="#14141e" stroke="#67d9a0" stroke-width="1.6"/>
<text x="90" y="126" fill="#67d9a0" font-size="8.8" text-anchor="middle" font-family="monospace">C1</text>
<circle cx="200" cy="122" r="22" fill="#14141e" stroke="#67d9a0" stroke-width="1.6"/>
<text x="200" y="126" fill="#67d9a0" font-size="8.8" text-anchor="middle" font-family="monospace">C2</text>
<circle cx="310" cy="122" r="22" fill="#14141e" stroke="#67d9a0" stroke-width="1.6"/>
<text x="310" y="126" fill="#67d9a0" font-size="8.8" text-anchor="middle" font-family="monospace">C3</text>
<circle cx="420" cy="122" r="22" fill="#14141e" stroke="#67d9a0" stroke-width="1.6"/>
<text x="420" y="126" fill="#67d9a0" font-size="8.8" text-anchor="middle" font-family="monospace">C4</text>
<line x1="112" y1="122" x2="174" y2="122" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M165,125 L174,122 L165,118 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="222" y1="122" x2="284" y2="122" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M275,125 L284,122 L275,118 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="332" y1="122" x2="394" y2="122" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M385,125 L394,122 L385,118 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<circle cx="310" cy="202" r="22" fill="#14141e" stroke="#e8b84b" stroke-width="1.6"/>
<text x="310" y="206" fill="#e8b84b" font-size="8.8" text-anchor="middle" font-family="monospace">F1</text>
<circle cx="420" cy="202" r="22" fill="#14141e" stroke="#e8b84b" stroke-width="1.6"/>
<text x="420" y="206" fill="#e8b84b" font-size="8.8" text-anchor="middle" font-family="monospace">F2</text>
<line x1="200" y1="142" x2="300" y2="188" stroke="#6a5a2a" stroke-width="1.3"/>
<path d="M291,188 L300,188 L294,181 Z" fill="#6a5a2a" stroke="#6a5a2a" stroke-width="1"/>
<line x1="332" y1="202" x2="394" y2="202" stroke="#6a5a2a" stroke-width="1.3"/>
<path d="M385,205 L394,202 L385,198 Z" fill="#6a5a2a" stroke="#6a5a2a" stroke-width="1"/>
<circle cx="552" cy="162" r="24" fill="#201a2e" stroke="#b58ae8" stroke-width="1.6"/>
<text x="552" y="166" fill="#b58ae8" font-size="8.8" text-anchor="middle" font-family="monospace">M</text>
<line x1="444" y1="130" x2="532" y2="155" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M523,156 L532,155 L525,149 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="442" y1="202" x2="532" y2="172" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M525,178 L532,172 L523,170 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="586" y="152" fill="#b58ae8" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">合并提交</text>
<text x="586" y="168" fill="#9a7ab0" font-size="8.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">父 = C4 和 F2</text>
<text x="30" y="252" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">历史留下一个岔口 —— 以后能看出「这两个功能是并行做的」</text>
<text x="30" y="300" fill="#67b5ef" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">rebase：抹平岔口</text>
<text x="158" y="300" fill="#6f6f88" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把 F1 F2 复制一份，接到 C4 后面</text>
<circle cx="90" cy="348" r="22" fill="#14141e" stroke="#67d9a0" stroke-width="1.6"/>
<text x="90" y="352" fill="#67d9a0" font-size="8.8" text-anchor="middle" font-family="monospace">C1</text>
<circle cx="200" cy="348" r="22" fill="#14141e" stroke="#67d9a0" stroke-width="1.6"/>
<text x="200" y="352" fill="#67d9a0" font-size="8.8" text-anchor="middle" font-family="monospace">C2</text>
<circle cx="310" cy="348" r="22" fill="#14141e" stroke="#67d9a0" stroke-width="1.6"/>
<text x="310" y="352" fill="#67d9a0" font-size="8.8" text-anchor="middle" font-family="monospace">C3</text>
<circle cx="420" cy="348" r="22" fill="#14141e" stroke="#67d9a0" stroke-width="1.6"/>
<text x="420" y="352" fill="#67d9a0" font-size="8.8" text-anchor="middle" font-family="monospace">C4</text>
<line x1="112" y1="348" x2="174" y2="348" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M165,351 L174,348 L165,344 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="222" y1="348" x2="284" y2="348" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M275,351 L284,348 L275,344 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="332" y1="348" x2="394" y2="348" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M385,351 L394,348 L385,344 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<circle cx="540" cy="348" r="22" fill="#14141e" stroke="#67b5ef" stroke-width="1.6"/>
<text x="540" y="352" fill="#67b5ef" font-size="8.8" text-anchor="middle" font-family="monospace">F1'</text>
<circle cx="650" cy="348" r="22" fill="#14141e" stroke="#67b5ef" stroke-width="1.6"/>
<text x="650" y="352" fill="#67b5ef" font-size="8.8" text-anchor="middle" font-family="monospace">F2'</text>
<line x1="442" y1="348" x2="516" y2="348" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M507,351 L516,348 L507,344 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="562" y1="348" x2="626" y2="348" stroke="#4a4a66" stroke-width="1.3"/>
<path d="M617,351 L626,348 L617,344 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="540" y="392" fill="#5f7080" font-size="8.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内容一样，但父提交变了，</text>
<text x="540" y="408" fill="#5f7080" font-size="8.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以哈希全变了</text>
<text x="680" y="342" fill="#67b5ef" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">← 新的两个提交</text>
<text x="30" y="442" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">rebase 之后历史是一条直线，看不出「曾经并行」。代价是所有相关提交的哈希都变了 —— 所以只能对「还没推给别人」的提交做。</text>
</svg>
