<line x1="130" y1="162" x2="156" y2="162" stroke="#e8965a" stroke-width="2.4"/>
<text x="164" y="166" fill="#e8965a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">线性探测：½(1 + 1/(1−α))</text>
<line x1="130" y1="184" x2="156" y2="184" stroke="#67d9a0" stroke-width="2.4"/>
<text x="164" y="188" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">链地址：平均 1 + α/2</text>
<line x1="634.0" y1="96" x2="634.0" y2="380" stroke="#e87a8a" stroke-width="1.3" stroke-dasharray="4 4"/>
<circle cx="634.0" cy="320.8333333333333" r="4.5" fill="#e87a8a"/>
<text x="622.0" y="290.8333333333333" fill="#e87a8a" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">多数实现把扩容点</text>
<text x="622.0" y="306.8333333333333" fill="#e87a8a" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">定在 0.5 ~ 0.75</text>
<text x="612.64" y="130" fill="#e8965a" font-size="10.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">α → 1，探测次数爆炸</text>
<path d="M616.1999999999999,135 L683.8399999999999,200 L740.8000000000001,262" fill="none" stroke="#e8965a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="36" y="428" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">链地址的代价随 α 平缓上涨：α = 1 也就平均看 1.5 个节点。开放寻址在 α 接近 1 时探测次数飙升 —— 表一满就基本不可用。</text>
<text x="36" y="446" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以扩容点的本质是：在手感变差之前主动翻倍，把 α 拉回低位。翻倍扩容摊还下来，插入仍是 O(1)。</text>
<text x="36" y="466" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开放寻址必须压低 α，所以它省指针、对缓存友好，但要为此付出「更早扩容、更多空槽」的空间代价。</text>
</svg>
