<svg width="760" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1.2 L8,4.5 L0,7.8 z" fill="#e8b84b"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">液晶不发光，它只负责「开闸门」</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">两片偏振片方向垂直，液晶分子的任务是：要不要把光的偏振方向拧 90 度</text>

  <!-- 左：不加电压 -->
  <text x="100" y="82" fill="#9fe0c9" font-size="10.5" text-anchor="middle">不加电压：亮</text>

  <!-- 背光 -->
  <rect x="40" y="382" width="260" height="18" rx="3" fill="#332a18" stroke="#e8b84b"/>
  <text x="170" y="395" fill="#e8b84b" font-size="8" text-anchor="middle">背光 LED（一直亮）</text>

  <!-- 偏振片 A -->
  <rect x="40" y="352" width="260" height="14" fill="#1b2740" stroke="#67b5ef"/>
  <g stroke="#67b5ef" stroke-width="1">
    <line x1="50" y1="352" x2="50" y2="366"/><line x1="80" y1="352" x2="80" y2="366"/>
    <line x1="110" y1="352" x2="110" y2="366"/><line x1="140" y1="352" x2="140" y2="366"/>
    <line x1="170" y1="352" x2="170" y2="366"/><line x1="200" y1="352" x2="200" y2="366"/>
    <line x1="230" y1="352" x2="230" y2="366"/><line x1="260" y1="352" x2="260" y2="366"/>
  </g>
  <text x="312" y="363" fill="#9fd4f5" font-size="8">偏振片 A（竖）</text>

  <!-- 液晶 -->
  <rect x="40" y="230" width="260" height="118" fill="#12121c" stroke="#4a4a68"/>
  <g stroke="#4ec9a3" stroke-width="1.4">
    <line x1="100" y1="248" x2="130" y2="266"/>
    <line x1="130" y1="266" x2="100" y2="284"/>
    <line x1="100" y1="284" x2="130" y2="302"/>
    <line x1="130" y1="302" x2="100" y2="320"/>
    <line x1="140" y1="248" x2="170" y2="266"/>
    <line x1="170" y1="266" x2="140" y2="284"/>
    <line x1="140" y1="284" x2="170" y2="302"/>
    <line x1="170" y1="302" x2="140" y2="320"/>
  </g>
  <text x="205" y="292" fill="#4ec9a3" font-size="8.5">液晶分子</text>
  <text x="205" y="306" fill="#6b6b85" font-size="8">自然扭成螺旋</text>
  <text x="312" y="292" fill="#9a9ab4" font-size="8">液晶层</text>

  <!-- 偏振片 B -->
  <rect x="40" y="206" width="260" height="14" fill="#1b2740" stroke="#67b5ef"/>
  <g stroke="#67b5ef" stroke-width="1">
    <line x1="54" y1="206" x2="54" y2="220"/><line x1="84" y1="206" x2="84" y2="220"/>
    <line x1="114" y1="206" x2="114" y2="220"/><line x1="144" y1="206" x2="144" y2="220"/>
    <line x1="174" y1="206" x2="174" y2="220"/><line x1="204" y1="206" x2="204" y2="220"/>
    <line x1="234" y1="206" x2="234" y2="220"/><line x1="264" y1="206" x2="264" y2="220"/>
  </g>
  <text x="312" y="217" fill="#9fd4f5" font-size="8">偏振片 B（横）</text>

  <!-- 彩膜 -->
  <rect x="40" y="180" width="260" height="16" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="170" y="192" fill="#cfc6ff" font-size="8" text-anchor="middle">彩色滤光片</text>

  <!-- 光路 -->
  <line x1="170" y1="380" x2="170" y2="200" stroke="#e8b84b" stroke-width="2.4" marker-end="url(#d1)"/>
  <text x="182" y="150" fill="#e8b84b" font-size="9">光通过了</text>

  <!-- 右：加电压 -->
  <text x="550" y="82" fill="#f0606a" font-size="10.5" text-anchor="middle">加电压：暗</text>

  <rect x="420" y="382" width="260" height="18" rx="3" fill="#332a18" stroke="#e8b84b"/>
  <text x="550" y="395" fill="#e8b84b" font-size="8" text-anchor="middle">背光 LED</text>

  <rect x="420" y="352" width="260" height="14" fill="#1b2740" stroke="#67b5ef"/>
  <g stroke="#67b5ef" stroke-width="1">
    <line x1="430" y1="352" x2="430" y2="366"/><line x1="460" y1="352" x2="460" y2="366"/>
    <line x1="490" y1="352" x2="490" y2="366"/><line x1="520" y1="352" x2="520" y2="366"/>
    <line x1="550" y1="352" x2="550" y2="366"/><line x1="580" y1="352" x2="580" y2="366"/>
    <line x1="610" y1="352" x2="610" y2="366"/><line x1="640" y1="352" x2="640" y2="366"/>
  </g>

  <rect x="420" y="230" width="260" height="118" fill="#12121c" stroke="#4a4a68"/>
  <g stroke="#f0606a" stroke-width="1.4">
    <line x1="466" y1="248" x2="466" y2="320"/><line x1="494" y1="248" x2="494" y2="320"/>
    <line x1="522" y1="248" x2="522" y2="320"/><line x1="550" y1="248" x2="550" y2="320"/>
    <line x1="578" y1="248" x2="578" y2="320"/><line x1="606" y1="248" x2="606" y2="320"/>
  </g>
  <text x="624" y="278" fill="#f0606a" font-size="8.5">分子竖起来了</text>
  <text x="624" y="292" fill="#6b6b85" font-size="8">不再旋转偏振</text>

  <rect x="420" y="206" width="260" height="14" fill="#1b2740" stroke="#67b5ef"/>
  <g stroke="#67b5ef" stroke-width="1">
    <line x1="434" y1="206" x2="434" y2="220"/><line x1="464" y1="206" x2="464" y2="220"/>
    <line x1="494" y1="206" x2="494" y2="220"/><line x1="524" y1="206" x2="524" y2="220"/>
    <line x1="554" y1="206" x2="554" y2="220"/><line x1="584" y1="206" x2="584" y2="220"/>
    <line x1="614" y1="206" x2="614" y2="220"/><line x1="644" y1="206" x2="644" y2="220"/>
  </g>

  <rect x="420" y="180" width="260" height="16" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="550" y="192" fill="#cfc6ff" font-size="8" text-anchor="middle">彩色滤光片</text>

  <line x1="550" y1="380" x2="550" y2="224" stroke="#e8b84b" stroke-width="2.4" marker-end="url(#d1)"/>
  <text x="550" y="166" fill="#f0606a" font-size="9" text-anchor="middle">光被挡住了</text>
  <line x1="550" y1="206" x2="550" y2="220" stroke="#f0606a" stroke-width="2"/>
  <line x1="538" y1="210" x2="562" y2="216" stroke="#f0606a" stroke-width="2"/>
  <line x1="562" y1="210" x2="538" y2="216" stroke="#f0606a" stroke-width="2"/>

  <!-- 底部 -->
  <line x1="24" y1="418" x2="736" y2="418" stroke="#2a2a44"/>
  <text x="24" y="438" fill="#e8b84b" font-size="9">亮度取决于「闸门开多大」；闸门开合的速度，就是响应时间。</text>
  <text x="24" y="452" fill="#6b6b85" font-size="8.5">灰色（半亮）是液晶分子转了一半——所以响应时间总是相对于「从什么灰到什么灰」才有意义。</text>
</svg>
