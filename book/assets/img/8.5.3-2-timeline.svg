<text x="24" y="372" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么这么长：EIN 拿不到，银行开不了；银行开不了，通道批不下来。</text>
<text x="24" y="392" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">唯一能压缩的一步是 EIN——走传真比邮寄快，很多人两周拿到，但别把两周当承诺。</text>
<text x="24" y="418" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">乐观十周，现实十四周。有人在第六周就收到第一笔钱，那是 EIN 特别顺的情况。</text>
<text x="24" y="444" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这四个星期不是浪费：等 EIN 时把网站、定价、收款页面全做完，通道一批就能收钱。</text>
