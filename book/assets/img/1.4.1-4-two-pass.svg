<svg width="840" height="452" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 452" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="840" height="452" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">汇编器的两遍扫描：先量长度记标签，再生成字节</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前向引用让「一遍扫完」不可能；外部符号则留给链接器，靠重定位表交接</text>
<rect x="36" y="88" width="196" height="246" rx="4" fill="#141420" stroke="#3a3a52" stroke-width="1.2"/>
<text x="50" y="108" fill="#6a6a82" font-size="10" text-anchor="start" font-family="monospace">sum.s</text>
<text x="50" y="132" fill="#b0b0c8" font-size="10" text-anchor="start" font-family="monospace">      jmp   .Ldone</text>
<text x="50" y="156" fill="#b0b0c8" font-size="10" text-anchor="start" font-family="monospace">      add   rax, 1</text>
<text x="50" y="180" fill="#e8b84b" font-size="10" text-anchor="start" font-family="monospace">.Ldone:</text>
<text x="50" y="204" fill="#b0b0c8" font-size="10" text-anchor="start" font-family="monospace">      ret</text>
<line x1="48" y1="250" x2="220" y2="250" stroke="#26263a" stroke-width="1"/>
<text x="50" y="270" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一遍：只用标签前</text>
<text x="50" y="286" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">的字节数累加出地址</text>
<text x="50" y="308" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第二遍：回头把 .Ldone</text>
<text x="50" y="322" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换成那个地址</text>
<rect x="292" y="96" width="138" height="66" rx="4" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="361" y="122" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一遍扫描</text>
<text x="361" y="142" fill="#7a7a92" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只量长度，不编字节</text>
<rect x="492" y="96" width="210" height="66" rx="4" fill="#16161f" stroke="#67b5ef" stroke-width="1.2"/>
<text x="504" y="114" fill="#67b5ef" font-size="9.5" text-anchor="start" font-family="monospace">符号表</text>
<text x="504" y="136" fill="#b0b0c8" font-size="10" text-anchor="start" font-family="monospace">.Ldone</text>
<text x="572" y="136" fill="#e8b84b" font-size="10" text-anchor="start" font-family="monospace">0x0004</text>
<line x1="232" y1="122" x2="279.0" y2="122.0" stroke="#67b5ef" stroke-width="1.4"/>
<polygon points="288,122 279.0,126.5 279.0,117.5" fill="#67b5ef"/>
<line x1="434" y1="122" x2="479.0" y2="122.0" stroke="#67b5ef" stroke-width="1.4"/>
<polygon points="488,122 479.0,126.5 479.0,117.5" fill="#67b5ef"/>
<rect x="292" y="232" width="138" height="66" rx="4" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="361" y="258" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第二遍扫描</text>
<text x="361" y="278" fill="#7a7a92" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查表填地址，出字节</text>
<rect x="492" y="224" width="316" height="120" rx="4" fill="#141420" stroke="#3a3a52" stroke-width="1.2"/>
<text x="504" y="242" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="monospace">sum.o</text>
<rect x="504" y="252" width="292" height="34" rx="3" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="514" y="274" fill="#67d9a0" font-size="9" text-anchor="start" font-family="monospace">代码段</text>
<text x="566" y="274" fill="#b0b0c8" font-size="9.5" text-anchor="start" font-family="monospace">eb 04 48 83 c0 01 c3</text>
<rect x="504" y="294" width="292" height="38" rx="3" fill="#16161f" stroke="#e8965a" stroke-width="1"/>
<text x="514" y="312" fill="#e8965a" font-size="9" text-anchor="start" font-family="monospace">重定位表</text>
<text x="514" y="326" fill="#8a8aa4" font-size="8.8" text-anchor="start" font-family="monospace">0x02  ←  printf（链接时填）</text>
<line x1="232" y1="265" x2="279.0" y2="265.0" stroke="#67d9a0" stroke-width="1.4"/>
<polygon points="288,265 279.0,269.5 279.0,260.5" fill="#67d9a0"/>
<line x1="434" y1="265" x2="479.0" y2="265.0" stroke="#67d9a0" stroke-width="1.4"/>
<polygon points="488,265 479.0,269.5 479.0,260.5" fill="#67d9a0"/>
<path d="M361,298 L361,356 L252,356 L252,129" fill="none" stroke="#e87a8a" stroke-width="1.3" stroke-dasharray="5 4"/>
<line x1="252" y1="129" x2="278.0" y2="129.0" stroke="#e87a8a" stroke-width="1.4"/>
<polygon points="287,129 278.0,133.5 278.0,124.5" fill="#e87a8a"/>
<text x="280" y="376" fill="#e87a8a" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">位移超范围：jmp 从 2 字节换成 5 字节，后面所有标签的地址全变，只能重来一轮</text>
<text x="36" y="412" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两遍就够了的前提是「标签地址不会因为编码变化而移动」。x86 是变长指令集，这个前提不成立，所以要反复扫到收敛。</text>
<text x="36" y="430" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ARM 这类定长指令集一遍就够——标签地址在第一遍就是准确的。定长编码的隐性好处不只在译码，也在汇编。</text>
</svg>
