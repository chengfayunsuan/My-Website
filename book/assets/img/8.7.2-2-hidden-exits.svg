<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">数据出境常常不是你搬的，是依赖搬的</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个"完全本地部署"的站，也可能有六个出口</text>
<line x1="348" y1="84" x2="348" y2="300" stroke="#e87a8a" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="200" y="326" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">境内</text>
<text x="348" y="326" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据出境线</text>
<text x="510" y="326" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">境外</text>
<rect x="40" y="124" width="190" height="120" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="135" y="152" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你的服务器</text>
<text x="135" y="174" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">境内机房 · 数据库</text>
<text x="135" y="194" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">看起来什么都没出去</text>
<text x="135" y="220" fill="#e8b84b" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">实际有六个出口 →</text>
<rect x="392" y="91" width="250" height="30" rx="4" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="404" y="110" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">国外 CDN</text>
<text x="630" y="110" fill="#a0a0b8" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用户 IP、访问日志</text>
<line x1="352" y1="106" x2="388" y2="106" stroke="#5a5a72" stroke-width="1.2"/>
<circle cx="388" cy="106" r="3" fill="#8a8aa0"/>
<rect x="392" y="125" width="250" height="30" rx="4" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="404" y="144" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">统计 SDK</text>
<text x="630" y="144" fill="#a0a0b8" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">页面、设备、行为</text>
<line x1="352" y1="140" x2="388" y2="140" stroke="#5a5a72" stroke-width="1.2"/>
<circle cx="388" cy="140" r="3" fill="#8a8aa0"/>
<rect x="392" y="159" width="250" height="30" rx="4" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="404" y="178" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">错误监控</text>
<text x="630" y="178" fill="#a0a0b8" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">堆栈里夹带的用户数据</text>
<line x1="352" y1="174" x2="388" y2="174" stroke="#5a5a72" stroke-width="1.2"/>
<circle cx="388" cy="174" r="3" fill="#8a8aa0"/>
<rect x="392" y="193" width="250" height="30" rx="4" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="404" y="212" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">邮件服务</text>
<text x="630" y="212" fill="#a0a0b8" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收件邮箱、正文</text>
<line x1="352" y1="208" x2="388" y2="208" stroke="#5a5a72" stroke-width="1.2"/>
<circle cx="388" cy="208" r="3" fill="#8a8aa0"/>
<rect x="392" y="227" width="250" height="30" rx="4" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="404" y="246" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">客服工单</text>
<text x="630" y="246" fill="#a0a0b8" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用户对话原文</text>
<line x1="352" y1="242" x2="388" y2="242" stroke="#5a5a72" stroke-width="1.2"/>
<circle cx="388" cy="242" r="3" fill="#8a8aa0"/>
<rect x="392" y="261" width="250" height="30" rx="4" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="404" y="280" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">AI 接口</text>
<text x="630" y="280" fill="#a0a0b8" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你粘贴进去的文本</text>
<line x1="352" y1="276" x2="388" y2="276" stroke="#5a5a72" stroke-width="1.2"/>
<circle cx="388" cy="276" r="3" fill="#8a8aa0"/>
<text x="340" y="372" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每接一个境外服务，就多一条出境链路——哪怕你的服务器一台都没出海。</text>
<text x="340" y="400" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用户不知道，监管会问；出了事，责任在你。</text>
</svg>
