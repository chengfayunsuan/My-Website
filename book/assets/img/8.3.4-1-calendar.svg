<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">一年的报税日历：真正要记的日子只有四类</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每月 15 日、季度末、5 月 31 日、6 月 30 日——错过就是罚款</text>
<rect x="18" y="64" width="180" height="104" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.3"/>
