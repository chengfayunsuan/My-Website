<text x="596" y="354" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（次年 1 月又一轮）</text>
<text x="390" y="414" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">黄 = 按月/按季的常规申报　红 = 一年只有一次、错过特别麻烦的那两个</text>
