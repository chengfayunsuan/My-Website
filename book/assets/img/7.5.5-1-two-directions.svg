<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">扫一扫有两个方向：你扫它，还是它扫你</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">主扫要你输金额，被扫不用——差别在这一步谁掌握主动权</text>
<defs><marker id="q1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#8a8aa0"/></marker></defs><rect x="24" y="64" width="344" height="300" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="44" y="92" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">主扫（你扫商户的码）</text>
<circle cx="52" cy="118" r="4" fill="#67b5ef"/>
<text x="68" y="122" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">打开扫一扫</text>
<text x="68" y="140" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对准收银台的静态码</text>
<circle cx="52" cy="164" r="4" fill="#67b5ef"/>
<text x="68" y="168" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">解析出一串地址</text>
<text x="68" y="186" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">码里是商户 + 订单信息</text>
<circle cx="52" cy="210" r="4" fill="#67b5ef"/>
<text x="68" y="214" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你自己输金额</text>
<text x="68" y="232" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">输错就是转错</text>
<circle cx="52" cy="256" r="4" fill="#67b5ef"/>
<text x="68" y="260" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">确认付款</text>
<text x="68" y="278" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">验密码或指纹</text>
<circle cx="52" cy="302" r="4" fill="#67b5ef"/>
<text x="68" y="306" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商户收到通知</text>
<text x="68" y="324" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">语音播报「微信到账 12 元」</text>
<rect x="392" y="64" width="344" height="300" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="412" y="92" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">被扫（商户扫你的付款码）</text>
<circle cx="420" cy="118" r="4" fill="#67d9a0"/>
<text x="436" y="122" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">打开付款码</text>
<text x="436" y="140" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一串 18 位数字，每分钟变</text>
<circle cx="420" cy="164" r="4" fill="#67d9a0"/>
<text x="436" y="168" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收银员扫一下</text>
<text x="436" y="186" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扫码枪读走这串数字</text>
<circle cx="420" cy="210" r="4" fill="#67d9a0"/>
<text x="436" y="214" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商户端发起扣款</text>
<text x="436" y="232" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">金额由商户输入</text>
<circle cx="420" cy="256" r="4" fill="#67d9a0"/>
<text x="436" y="260" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">免密扣款</text>
<text x="436" y="278" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小额不用你确认</text>
<circle cx="420" cy="302" r="4" fill="#67d9a0"/>
<text x="436" y="306" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你收到扣款通知</text>
<text x="436" y="324" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这时才知道花了多少</text>
<text x="380" y="392" fill="#e8965a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">被扫快，是因为把「确认」这一步省掉了——代价是你放弃了对金额的事前控制</text>
<text x="380" y="414" fill="#a0a0b8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以付款码只给看不给拍，一旦被别人拍走，钱就是他的了</text>
</svg>
