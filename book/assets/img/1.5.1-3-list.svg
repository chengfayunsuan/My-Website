<svg width="880" height="396" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="396" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.5.1-3  链表：用指针把散落的块串起来</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">块与块之间不挨着，下一块在哪写在当前块里</text>
<text x="36" y="84" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">插入前</text>
<rect x="40" y="96" width="150" height="56" rx="3" fill="#16161f" stroke="#8a8aa0" stroke-width="1.3"/>
<line x1="96" y1="104" x2="96" y2="144" stroke="#2e2e44" stroke-width="1"/>
<text x="68" y="130" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="monospace">42</text>
<text x="143" y="130" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">next</text>
<text x="115.0" y="88" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">0x2000</text>
<rect x="400" y="96" width="150" height="56" rx="3" fill="#16161f" stroke="#8a8aa0" stroke-width="1.3"/>
<line x1="456" y1="104" x2="456" y2="144" stroke="#2e2e44" stroke-width="1"/>
<text x="428" y="130" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="monospace">17</text>
<text x="503" y="130" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">next</text>
<text x="475.0" y="88" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">0x2180</text>
<rect x="580" y="96" width="150" height="56" rx="3" fill="#16161f" stroke="#8a8aa0" stroke-width="1.3"/>
<line x1="636" y1="104" x2="636" y2="144" stroke="#2e2e44" stroke-width="1"/>
<text x="608" y="130" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="monospace">93</text>
<text x="683" y="130" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">next</text>
<text x="655.0" y="88" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">0x2F40</text>
<line x1="190" y1="124.0" x2="396" y2="124.0" stroke="#e87a8a" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M396.0,124.0 L387.0,119.5 L387.0,128.5 Z" fill="#e87a8a"/>
<text x="295.0" y="145" fill="#c07a86" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这条要断</text>
<line x1="550" y1="124.0" x2="576" y2="124.0" stroke="#5a5a72" stroke-width="1.6"/>
<path d="M576.0,124.0 L567.0,119.5 L567.0,128.5 Z" fill="#5a5a72"/>
<line x1="730" y1="124.0" x2="752" y2="124.0" stroke="#3a3a52" stroke-width="1.4"/>
<text x="758" y="128.0" fill="#4e4e66" font-size="8.5" text-anchor="start" font-family="monospace">NULL</text>
<text x="36" y="216" fill="#67d9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">插入后：在 42 和 17 之间挂上 65</text>
<rect x="40" y="228" width="150" height="56" rx="3" fill="#16161f" stroke="#8a8aa0" stroke-width="1.3"/>
<line x1="96" y1="236" x2="96" y2="276" stroke="#2e2e44" stroke-width="1"/>
<text x="68" y="262" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="monospace">42</text>
<text x="143" y="262" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">next</text>
<text x="115.0" y="220" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">0x2000</text>
<rect x="220" y="228" width="150" height="56" rx="3" fill="#12261e" stroke="#67d9a0" stroke-width="1.3"/>
<line x1="276" y1="236" x2="276" y2="276" stroke="#2e2e44" stroke-width="1"/>
<text x="248" y="262" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="monospace">65</text>
<text x="323" y="262" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">next</text>
<text x="295.0" y="220" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">0x1C80</text>
<rect x="400" y="228" width="150" height="56" rx="3" fill="#16161f" stroke="#8a8aa0" stroke-width="1.3"/>
<line x1="456" y1="236" x2="456" y2="276" stroke="#2e2e44" stroke-width="1"/>
<text x="428" y="262" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="monospace">17</text>
<text x="503" y="262" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">next</text>
<text x="475.0" y="220" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">0x2180</text>
<rect x="580" y="228" width="150" height="56" rx="3" fill="#16161f" stroke="#8a8aa0" stroke-width="1.3"/>
<line x1="636" y1="236" x2="636" y2="276" stroke="#2e2e44" stroke-width="1"/>
<text x="608" y="262" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="monospace">93</text>
<text x="683" y="262" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">next</text>
<text x="655.0" y="220" fill="#4e4e66" font-size="8.5" text-anchor="middle" font-family="monospace">0x2F40</text>
<line x1="190" y1="256.0" x2="216" y2="256.0" stroke="#67d9a0" stroke-width="1.6"/>
<path d="M216.0,256.0 L207.0,251.5 L207.0,260.5 Z" fill="#67d9a0"/>
<line x1="370" y1="256.0" x2="396" y2="256.0" stroke="#67d9a0" stroke-width="1.6"/>
<path d="M396.0,256.0 L387.0,251.5 L387.0,260.5 Z" fill="#67d9a0"/>
<line x1="550" y1="256.0" x2="576" y2="256.0" stroke="#5a5a72" stroke-width="1.6"/>
<path d="M576.0,256.0 L567.0,251.5 L567.0,260.5 Z" fill="#5a5a72"/>
<text x="46" y="296.0" fill="#7fbf9f" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只改这两条指针</text>
<text x="295.0" y="296.0" fill="#6a8a76" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">新节点</text>
<text x="844" y="84" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每节点多一个 8 字节指针</text>
<text x="844" y="216" fill="#7fbf9f" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据一个字节都没挪</text>
<text x="36" y="358" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意地址：0x2000、0x1C80、0x2180、0x2F40 —— 节点在内存里根本不挨着，走哪儿全看指针。</text>
<text x="36" y="378" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「链表插得快」说的是改指针快，代价是每找下一个都得真读一次内存 —— 下一张图算这笔账。</text>
</svg>
