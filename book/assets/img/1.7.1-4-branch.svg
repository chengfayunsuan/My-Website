<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.7.1-4  分支只是一个装着哈希的文件</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所谓「新建分支」，就是在 .git/refs/heads/ 下写一个 41 字节的文本文件</text>
<circle cx="90" cy="140" r="26" fill="#16281c" stroke="#67d9a0" stroke-width="1.8"/>
<text x="90" y="144" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">C1</text>
<circle cx="240" cy="140" r="26" fill="#16281c" stroke="#67d9a0" stroke-width="1.8"/>
<text x="240" y="144" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">C2</text>
<line x1="116" y1="140" x2="212" y2="140" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M212,136 L220,140 L212,144 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<circle cx="390" cy="140" r="26" fill="#16281c" stroke="#67d9a0" stroke-width="1.8"/>
<text x="390" y="144" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">C3</text>
<line x1="266" y1="140" x2="362" y2="140" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M362,136 L370,140 L362,144 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<circle cx="540" cy="140" r="26" fill="#16281c" stroke="#67d9a0" stroke-width="1.8"/>
<text x="540" y="144" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">C4</text>
<line x1="416" y1="140" x2="512" y2="140" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M512,136 L520,140 L512,144 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<path d="M240,166 L240,254" fill="none" stroke="#e8b84b" stroke-width="1.4"/>
<path d="M236,254 L240,262 L244,254 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<circle cx="240" cy="280" r="26" fill="#14141e" stroke="#e8b84b" stroke-width="1.8"/>
<text x="240" y="284" fill="#e8b84b" font-size="9" text-anchor="middle" font-family="monospace">F1</text>
<circle cx="390" cy="280" r="26" fill="#14141e" stroke="#e8b84b" stroke-width="1.8"/>
<text x="390" y="284" fill="#e8b84b" font-size="9" text-anchor="middle" font-family="monospace">F2</text>
<line x1="266" y1="280" x2="362" y2="280" stroke="#6a5a2a" stroke-width="1.4"/>
<path d="M362,276 L370,280 L362,284 Z" fill="#6a5a2a" stroke="#6a5a2a" stroke-width="1"/>
<rect x="600" y="120" width="96" height="30" rx="3" fill="#16281c" stroke="#67d9a0" stroke-width="1.3"/>
<text x="648" y="140" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="monospace">main</text>
<line x1="600" y1="135" x2="572" y2="135" stroke="#67d9a0" stroke-width="1.4"/>
<path d="M572,131 L564,135 L572,139 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<rect x="440" y="264" width="110" height="30" rx="3" fill="#2a2410" stroke="#e8b84b" stroke-width="1.3"/>
<text x="495" y="284" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="monospace">feature</text>
<line x1="440" y1="279" x2="422" y2="279" stroke="#e8b84b" stroke-width="1.4"/>
<path d="M422,275 L414,279 L422,283 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<rect x="600" y="60" width="96" height="30" rx="3" fill="#201a2e" stroke="#b58ae8" stroke-width="1.3"/>
<text x="648" y="80" fill="#b58ae8" font-size="10.5" text-anchor="middle" font-family="monospace">HEAD</text>
<line x1="648" y1="90" x2="648" y2="116" stroke="#b58ae8" stroke-width="1.4"/>
<path d="M644,116 L648,124 L652,116 Z" fill="#b58ae8" stroke="#b58ae8" stroke-width="1"/>
<text x="712" y="80" fill="#8a8aa2" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你在哪，看它</text>
<text x="600" y="190" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">「切分支」做了什么</text>
<text x="600" y="214" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">.git/refs/heads/main 里只有一行：</text>
<text x="600" y="232" fill="#6f8f7a" font-size="8.2" text-anchor="start" font-family="monospace">3f7a2b1c9d0e...（40 位十六进制）</text>
<text x="600" y="254" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换分支 = 改写这一行 +</text>
<text x="600" y="270" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把工作区文件换成那个快照的样子。</text>
<text x="30" y="360" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「建分支」不是「复制一份代码」。它只是写一个 41 字节的文件 —— 这就是建分支能瞬间完成、还能建几百个的原因。</text>
<text x="30" y="382" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">反过来，删分支就是删这个文件：commit 还在，只是没有名字指着它了（这时候叫「游离」）。</text>
<text x="30" y="408" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">「合并」也不是「把两个文件夹合起来」，是「造一个新的 commit，它的父提交有两个」—— 下一节细说。</text>
</svg>
