<svg width="760" height="510" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#67b5ef"/>
    </marker>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4ec9a3"/>
    </marker>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e08a4b"/>
    </marker>
    <marker id="a4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6b6b85"/>
    </marker>
  </defs>

  <rect width="760" height="510" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">主板不是一张平铺的网：所有设备分成两档，直连 CPU 的和挤在芯片组后面的</text>

  <!-- 分区标注 -->
  <rect x="24" y="42" width="712" height="248" rx="8" fill="#12121c" stroke="#2a2a44" stroke-dasharray="6 4"/>
  <text x="36" y="58" fill="#5f5f7a" font-size="10" font-family="monospace">上半区：CPU 直连 · 每条通道独享</text>
  <rect x="24" y="300" width="712" height="166" rx="8" fill="#161320" stroke="#3a2a44" stroke-dasharray="6 4"/>
  <text x="36" y="316" fill="#8a6a4a" font-size="10" font-family="monospace">下半区：经 PCH 中转 · 所有设备共享同一条上行</text>

  <!-- 内存 -->
  <rect x="52" y="86" width="126" height="84" rx="6" fill="#12242e" stroke="#67b5ef" stroke-width="1.5"/>
  <text x="115" y="112" fill="#9fd0f5" font-size="12" text-anchor="middle" font-weight="bold">内存</text>
  <text x="115" y="130" fill="#5a8aa8" font-size="9.5" text-anchor="middle" font-family="monospace">DDR5 双通道</text>
  <text x="115" y="148" fill="#5a8aa8" font-size="9.5" text-anchor="middle" font-family="monospace">≈ 90 GB/s</text>

  <line x1="178" y1="128" x2="286" y2="118" stroke="#67b5ef" stroke-width="2" marker-end="url(#a1)"/>
  <text x="232" y="112" fill="#4a6a86" font-size="9" text-anchor="middle" font-family="monospace">独占</text>

  <!-- CPU -->
  <rect x="290" y="62" width="182" height="112" rx="8" fill="#1d1d30" stroke="#9b4df0" stroke-width="2"/>
  <text x="381" y="92" fill="#d8c0ff" font-size="15" text-anchor="middle" font-weight="bold">CPU</text>
  <text x="381" y="112" fill="#8a6ab8" font-size="9.5" text-anchor="middle" font-family="monospace">内存控制器</text>
  <text x="381" y="128" fill="#8a6ab8" font-size="9.5" text-anchor="middle" font-family="monospace">PCIe 控制器</text>
  <text x="381" y="150" fill="#6b4a9e" font-size="9" text-anchor="middle" font-family="monospace">这些以前在北桥里</text>

  <!-- 显卡 -->
  <rect x="566" y="62" width="150" height="80" rx="6" fill="#2b2412" stroke="#e8b84b" stroke-width="1.5"/>
  <text x="641" y="88" fill="#f0d08a" font-size="12" text-anchor="middle" font-weight="bold">显卡</text>
  <text x="641" y="106" fill="#8a7440" font-size="9.5" text-anchor="middle" font-family="monospace">PCIe ×16 直连</text>
  <text x="641" y="122" fill="#8a7440" font-size="9.5" text-anchor="middle" font-family="monospace">×16 独占</text>

  <line x1="472" y1="100" x2="562" y2="100" stroke="#67b5ef" stroke-width="2" marker-end="url(#a1)"/>

  <!-- M.2 #1 -->
  <rect x="566" y="168" width="150" height="72" rx="6" fill="#122a22" stroke="#4ec9a3" stroke-width="1.5"/>
  <text x="641" y="192" fill="#8fe0c0" font-size="12" text-anchor="middle" font-weight="bold">M.2 固态 #1</text>
  <text x="641" y="210" fill="#4a7f68" font-size="9.5" text-anchor="middle" font-family="monospace">PCIe ×4 直连</text>
  <text x="641" y="226" fill="#4a7f68" font-size="9.5" text-anchor="middle" font-family="monospace">≈ 7.9 GB/s</text>

  <line x1="472" y1="150" x2="562" y2="192" stroke="#4ec9a3" stroke-width="2" marker-end="url(#a2)"/>

  <!-- DMI -->
  <line x1="381" y1="176" x2="381" y2="328" stroke="#6b6b85" stroke-width="2.4" marker-end="url(#a4)"/>
  <rect x="390" y="214" width="150" height="34" rx="4" fill="#0e0e16" stroke="#33334d"/>
  <text x="465" y="229" fill="#b8b8cc" font-size="10" text-anchor="middle" font-family="monospace">DMI 4.0 ×8</text>
  <text x="465" y="242" fill="#6b6b85" font-size="9" text-anchor="middle" font-family="monospace">≈ 16 GB/s，唯一的上行</text>

  <!-- PCH -->
  <rect x="300" y="332" width="162" height="76" rx="8" fill="#2a1f14" stroke="#e08a4b" stroke-width="2"/>
  <text x="381" y="360" fill="#f0b878" font-size="13" text-anchor="middle" font-weight="bold">PCH 芯片组</text>
  <text x="381" y="380" fill="#a06a3a" font-size="9.5" text-anchor="middle" font-family="monospace">下行扇出，不参与计算</text>
  <text x="381" y="396" fill="#a06a3a" font-size="9" text-anchor="middle" font-family="monospace">以前的南桥</text>

  <!-- PCH 下游 -->
  <g fill="#1a1a28" stroke="#4a4a66" stroke-width="1.3">
    <rect x="34" y="430" width="112" height="36" rx="5"/>
    <rect x="160" y="430" width="112" height="36" rx="5"/>
    <rect x="286" y="430" width="112" height="36" rx="5"/>
    <rect x="412" y="430" width="112" height="36" rx="5"/>
    <rect x="538" y="430" width="112" height="36" rx="5"/>
    <rect x="664" y="430" width="72" height="36" rx="5"/>
  </g>
  <g font-size="10.5" fill="#9a9ab4" text-anchor="middle">
    <text x="90" y="446">SATA</text><text x="90" y="461" fill="#5f5f7a" font-size="9">4～6 个口</text>
    <text x="216" y="446">USB</text><text x="216" y="461" fill="#5f5f7a" font-size="9">后置 + 前置</text>
    <text x="342" y="446">网卡</text><text x="342" y="461" fill="#5f5f7a" font-size="9">2.5G / Wi-Fi</text>
    <text x="468" y="446">音频</text><text x="468" y="461" fill="#5f5f7a" font-size="9">Codec</text>
    <text x="594" y="446">额外 PCIe</text><text x="594" y="461" fill="#5f5f7a" font-size="9">×1 / ×4</text>
    <text x="700" y="446">M.2 #2</text><text x="700" y="461" fill="#5f5f7a" font-size="9">共享</text>
  </g>

  <!-- 扇形连线 -->
  <g stroke="#e08a4b" stroke-width="1.4" stroke-opacity="0.7" marker-end="url(#a3)">
    <line x1="320" y1="408" x2="100" y2="428"/>
    <line x1="345" y1="408" x2="216" y2="428"/>
    <line x1="370" y1="408" x2="342" y2="428"/>
    <line x1="395" y1="408" x2="468" y2="428"/>
    <line x1="420" y1="408" x2="594" y2="428"/>
    <line x1="445" y1="408" x2="700" y2="428"/>
  </g>

  <!-- 结论 -->
  <text x="24" y="490" fill="#c8c8d8" font-size="10.5">这六个设备同时满速跑，加起来会撞到那条 16 GB/s 的 DMI。这就是为什么插满 M.2 和 SATA 时，说明书会让你「二选一」。</text>
</svg>
