<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">8.5.7-3 / 域名过期之后会发生什么</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你损失的不是一个域名，是所有账号的找回入口</text>
<rect x="40" y="210" width="140" height="52" rx="4" fill="#16161f" stroke="#67d9a0" stroke-width="1.2"/>
<rect x="40" y="210" width="140" height="3" rx="0" fill="#67d9a0" stroke="none" stroke-width="1.5"/>
<text x="110.0" y="230" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">正常使用</text>
<text x="110.0" y="250" fill="#6a6a84" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">续费价 $10</text>
<text x="110.0" y="194" fill="#5e5e78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">到期前 30 天开始提醒</text>
<rect x="180" y="210" width="180" height="52" rx="4" fill="#16161f" stroke="#e8b84b" stroke-width="1.2"/>
<rect x="180" y="210" width="180" height="3" rx="0" fill="#e8b84b" stroke="none" stroke-width="1.5"/>
<text x="270.0" y="230" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">宽限期 0~45 天</text>
<text x="270.0" y="250" fill="#6a6a84" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">正常续费价</text>
<text x="270.0" y="194" fill="#5e5e78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">网站和邮箱已停，可正常续费</text>
<rect x="360" y="210" width="140" height="52" rx="4" fill="#16161f" stroke="#e8965a" stroke-width="1.2"/>
<rect x="360" y="210" width="140" height="3" rx="0" fill="#e8965a" stroke="none" stroke-width="1.5"/>
<text x="430.0" y="230" fill="#e8965a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">赎回期 30 天</text>
<text x="430.0" y="250" fill="#6a6a84" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">赎回费 $80 起</text>
<text x="430.0" y="194" fill="#5e5e78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">解析已删，付赎回费</text>
<rect x="500" y="210" width="160" height="52" rx="4" fill="#16161f" stroke="#e87a8a" stroke-width="1.2"/>
<rect x="500" y="210" width="160" height="3" rx="0" fill="#e87a8a" stroke="none" stroke-width="1.5"/>
<text x="580.0" y="230" fill="#e87a8a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">释放</text>
<text x="580.0" y="250" fill="#6a6a84" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你无权再要回</text>
<text x="580.0" y="194" fill="#5e5e78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">任何人可注册</text>
<line x1="40" y1="262" x2="40" y2="276" stroke="#3a3a52" stroke-width="1"/>
<text x="45" y="293" fill="#5e5e78" font-size="9" text-anchor="start" font-family="monospace">D-30</text>
<line x1="180" y1="262" x2="180" y2="276" stroke="#3a3a52" stroke-width="1"/>
<text x="185" y="293" fill="#5e5e78" font-size="9" text-anchor="start" font-family="monospace">D0 到期</text>
<line x1="360" y1="262" x2="360" y2="276" stroke="#3a3a52" stroke-width="1"/>
<text x="365" y="293" fill="#5e5e78" font-size="9" text-anchor="start" font-family="monospace">D45</text>
<line x1="500" y1="262" x2="500" y2="276" stroke="#3a3a52" stroke-width="1"/>
<text x="505" y="293" fill="#5e5e78" font-size="9" text-anchor="start" font-family="monospace">D75</text>
<line x1="640" y1="262" x2="640" y2="276" stroke="#3a3a52" stroke-width="1"/>
<line x1="40" y1="276" x2="640" y2="276" stroke="#2e2e44" stroke-width="1.2"/>
<text x="24" y="116" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">风险不在“忘了续费”，在“过期后被人抢注”。</text>
<text x="24" y="138" fill="#6a6a84" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">新主人拿到域名，就能重建同一个邮箱地址，然后用“忘记密码”一路收走你的账号。</text>
<rect x="40" y="330" width="290" height="54" rx="5" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="54" y="352" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">现在就做</text>
<text x="54" y="370" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开自动续费 + 绑一张不会过期的卡</text>
<rect x="350" y="330" width="290" height="54" rx="5" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="364" y="352" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">再加一层</text>
<text x="364" y="370" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注册商开双重验证，别用这个域名下的邮箱收验证码</text>
<text x="24" y="414" fill="#6a6a84" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第二条最容易被忽略：邮箱验证码发到“同一个域名下的邮箱”，域名一失守就是死锁。</text>
</svg>
