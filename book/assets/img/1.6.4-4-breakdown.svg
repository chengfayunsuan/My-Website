<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" width="880" height="456" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="456" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.4-4  那 800 毫秒到底花在哪儿</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">拆开看：真正算的只占 7.5%，其余都在等。CPU 火焰图只能照亮最左边那一小段</text>
<rect x="60.0" y="100" width="57.0" height="52" rx="0" fill="#67d9a0" stroke="#0e0e16" stroke-width="1"/>
<rect x="117.0" y="100" width="494.0" height="52" rx="0" fill="#67b5ef" stroke="#0e0e16" stroke-width="1"/>
<text x="364.0" y="122" fill="#0e0e16" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">等数据库</text>
<text x="364.0" y="140" fill="#0e0e16" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">520 ms</text>
<rect x="611.0" y="100" width="114.0" height="52" rx="0" fill="#e8b84b" stroke="#0e0e16" stroke-width="1"/>
<text x="668.0" y="122" fill="#0e0e16" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">等锁</text>
<text x="668.0" y="140" fill="#0e0e16" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">120 ms</text>
<rect x="725.0" y="100" width="38.0" height="52" rx="0" fill="#b58ae8" stroke="#0e0e16" stroke-width="1"/>
<rect x="763.0" y="100" width="57.0" height="52" rx="0" fill="#e8965a" stroke="#0e0e16" stroke-width="1"/>
<text x="757.0" y="92" fill="#b58ae8" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">GC 40</text>
<text x="814.0" y="92" fill="#e8965a" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">网络 60</text>
<line x1="60" y1="158" x2="820" y2="158" stroke="#3a3a52" stroke-width="1"/>
<line x1="60.0" y1="158" x2="60.0" y2="164" stroke="#3a3a52" stroke-width="1"/>
<text x="60.0" y="178" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">0</text>
<line x1="250.0" y1="158" x2="250.0" y2="164" stroke="#3a3a52" stroke-width="1"/>
<text x="250.0" y="178" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">200</text>
<line x1="440.0" y1="158" x2="440.0" y2="164" stroke="#3a3a52" stroke-width="1"/>
<text x="440.0" y="178" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">400</text>
<line x1="630.0" y1="158" x2="630.0" y2="164" stroke="#3a3a52" stroke-width="1"/>
<text x="630.0" y="178" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">600</text>
<line x1="820.0" y1="158" x2="820.0" y2="164" stroke="#3a3a52" stroke-width="1"/>
<text x="820.0" y="178" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="monospace">800</text>
<text x="820" y="196" fill="#6f6f88" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">毫秒</text>
<text x="121.0" y="214" fill="#67d9a0" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ CPU 火焰图只覆盖这一段（7.5%）</text>
<text x="30" y="260" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">为什么会等这么久</text>
<circle cx="38" cy="284.5" r="3" fill="#67b5ef"/>
<text x="50" y="288" fill="#67b5ef" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">等数据库 520 ms</text>
<text x="190" y="288" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一次没走索引的查询，扫了两百万行</text>
<circle cx="38" cy="314.5" r="3" fill="#e8b84b"/>
<text x="50" y="318" fill="#e8b84b" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">等锁 120 ms</text>
<text x="190" y="318" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">另一个请求正占着这行记录</text>
<circle cx="38" cy="344.5" r="3" fill="#b58ae8"/>
<text x="50" y="348" fill="#b58ae8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">GC 40 ms</text>
<text x="190" y="348" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内存回收，整个进程暂停</text>
<circle cx="38" cy="374.5" r="3" fill="#e8965a"/>
<text x="50" y="378" fill="#e8965a" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">网络 60 ms</text>
<text x="190" y="378" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三次跨机房往返，每次 20 ms</text>
<line x1="30" y1="412" x2="850" y2="412" stroke="#2a2a3e" stroke-width="1"/>
<text x="30" y="438" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这四类「等」在 CPU 火焰图上全是空白。要看到它们，得用 wall clock 采样、系统调用追踪、锁分析、GC 日志 —— 各有一把专门的尺子。</text>
</svg>
