<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="424" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.4-3  代理行：钱没出国，只是换了个账户</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">跨境汇款没有「把钱从 A 搬到 B」这回事，只有「在同一个账本上改两个数字」</text>
<rect x="40" y="128" width="168" height="132" rx="4" fill="#1a2434" stroke="#67b5ef" stroke-width="1.4"/>
<text x="124" y="160" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">中国银行</text>
<text x="124" y="182" fill="#7f7f98" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">付款方</text>
<text x="124" y="210" fill="#8a8aa2" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在花旗有账户</text>
<text x="124" y="228" fill="#8a8aa2" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">余额 100 万</text>
<rect x="288" y="84" width="320" height="244" rx="5" fill="#2a2018" stroke="#e8965a" stroke-width="1.5"/>
<text x="448" y="112" fill="#e8965a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">花旗银行的账本</text>
<line x1="308" y1="126" x2="588" y2="126" stroke="#4a3a28" stroke-width="1"/>
<text x="310" y="158" fill="#a89878" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中国银行的账户（nostro）</text>
<text x="310" y="184" fill="#8a8a9c" font-size="10.5" text-anchor="start" font-family="monospace">1,000,000</text>
<text x="420" y="184" fill="#6f6f88" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<text x="452" y="184" fill="#e8965a" font-size="10.5" text-anchor="start" font-family="monospace">900,000</text>
<text x="310" y="238" fill="#a89878" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收款行的账户</text>
<text x="310" y="264" fill="#8a8a9c" font-size="10.5" text-anchor="start" font-family="monospace">500,000</text>
<text x="420" y="264" fill="#6f6f88" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<text x="452" y="264" fill="#e8965a" font-size="10.5" text-anchor="start" font-family="monospace">600,000</text>
<text x="448" y="306" fill="#8a7a62" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两个数字一减一加，总额不变</text>
<rect x="660" y="128" width="168" height="132" rx="4" fill="#16281c" stroke="#67d9a0" stroke-width="1.4"/>
<text x="744" y="160" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">收款行</text>
<text x="744" y="182" fill="#7f7f98" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收款方</text>
<text x="744" y="210" fill="#8a8aa2" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在花旗有账户</text>
<text x="744" y="228" fill="#8a8aa2" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">余额 50 万</text>
<line x1="212" y1="190" x2="278" y2="190" stroke="#67b5ef" stroke-width="1.5"/>
<path d="M278,190 L288,190 L278,185 L278,195 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<text x="248" y="176" fill="#67b5ef" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">指令</text>
<text x="248" y="210" fill="#7f8fa4" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扣 100 万</text>
<line x1="618" y1="200" x2="650" y2="200" stroke="#67d9a0" stroke-width="1.5"/>
<path d="M650,200 L660,200 L650,195 L650,205 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<text x="636" y="188" fill="#67d9a0" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">入账</text>
<text x="40" y="368" fill="#a0a0b8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">整个过程里，钱从来没有离开过花旗的账本。所谓「跨境」，跨的是指令和账户，不是钞票。</text>
<text x="40" y="392" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这也是为什么跨境汇款要经过代理行：两家银行如果没有互相开户，就没法在同一个账本上改数字，只能找一家都开了户的中间人。</text>
</svg>
