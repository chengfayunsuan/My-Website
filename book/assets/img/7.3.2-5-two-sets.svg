<svg width="880" height="368" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="368" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">两套 I、II、III，字母一样，意思不一样</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行账户有 I/II/III 类，支付账户（微信、支付宝）也有 I/II/III 类。这是两套并列的分类。</text>
<rect x="40" y="78" width="384" height="34" rx="5" fill="#1c1c2b" stroke="#67b5ef" stroke-width="1.3"/>
<rect x="40" y="100" width="384" height="12" rx="0" fill="#1c1c2b" stroke="none" stroke-width="0"/>
<text x="54" y="101" fill="#67b5ef" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">银行账户</text>
<text x="54" y="132" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在银行柜面或手机银行开的结算账户</text>
<rect x="40" y="156" width="384" height="60" rx="4" fill="#15151f" stroke="#33334a" stroke-width="1.1"/>
<text x="54" y="180" fill="#67b5ef" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">I 类</text>
<text x="114" y="180" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">柜面当面核身</text>
<text x="54" y="202" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">限额：没有</text>
<rect x="40" y="224" width="384" height="60" rx="4" fill="#15151f" stroke="#33334a" stroke-width="1.1"/>
<text x="54" y="248" fill="#67b5ef" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">II 类</text>
<text x="114" y="248" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">绑一张本人 I 类卡</text>
<text x="54" y="270" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">日 1 万 / 年 20 万</text>
<rect x="40" y="292" width="384" height="60" rx="4" fill="#15151f" stroke="#33334a" stroke-width="1.1"/>
<text x="54" y="316" fill="#67b5ef" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">III 类</text>
<text x="114" y="316" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">手机号 + 身份证</text>
<text x="54" y="338" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">余额不超过 2000</text>
<rect x="456" y="78" width="384" height="34" rx="5" fill="#1c1c2b" stroke="#b58ae8" stroke-width="1.3"/>
<rect x="456" y="100" width="384" height="12" rx="0" fill="#1c1c2b" stroke="none" stroke-width="0"/>
<text x="470" y="101" fill="#b58ae8" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">支付账户</text>
<text x="470" y="132" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在微信、支付宝这类机构开的账户</text>
<rect x="456" y="156" width="384" height="60" rx="4" fill="#15151f" stroke="#33334a" stroke-width="1.1"/>
<text x="470" y="180" fill="#b58ae8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">I 类</text>
<text x="530" y="180" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个外部渠道验证身份</text>
<text x="470" y="202" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">累计只能用 1000 元</text>
<rect x="456" y="224" width="384" height="60" rx="4" fill="#15151f" stroke="#33334a" stroke-width="1.1"/>
<text x="470" y="248" fill="#b58ae8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">II 类</text>
<text x="530" y="248" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两个以上渠道交叉验证</text>
<text x="470" y="270" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">年累计 10 万</text>
<rect x="456" y="292" width="384" height="60" rx="4" fill="#15151f" stroke="#33334a" stroke-width="1.1"/>
<text x="470" y="316" fill="#b58ae8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">III 类</text>
<text x="530" y="316" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">五个以上渠道验证</text>
<text x="470" y="338" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">年累计 20 万</text>
</svg>
