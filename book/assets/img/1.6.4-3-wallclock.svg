<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="420" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.4-3  「慢」有两种：CPU 忙，和 CPU 在等</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个接口，墙上时钟 800 毫秒，CPU 真正干活只有 60 毫秒 —— 这两个数字差 13 倍</text>
<text x="120" y="106" fill="#c8c8dc" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">墙上时钟</text>
<text x="120" y="124" fill="#5f5f78" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">wall clock</text>
<rect x="130" y="92" width="680" height="40" rx="3" fill="#2a2a3e" stroke="#4a4a66" stroke-width="1.2"/>
<text x="470.0" y="117" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">800 ms —— 用户等了这么久</text>
<text x="120" y="176" fill="#c8c8dc" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">CPU 时间</text>
<text x="120" y="194" fill="#5f5f78" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">cpu time</text>
<rect x="130" y="162" width="680" height="40" rx="3" fill="#12121c" stroke="#2a2a3e" stroke-width="1.2"/>
<rect x="130" y="162" width="51.0" height="40" rx="3" fill="#1e3a2a" stroke="#67d9a0" stroke-width="1.2"/>
<text x="191.0" y="187" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">60 ms —— 真正在算的</text>
<text x="191.0" y="214" fill="#6f6f88" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">剩下 740 毫秒都在等：等数据库、等锁、等网络</text>
<line x1="181.0" y1="132" x2="181.0" y2="162" stroke="#4a4a66" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="30" y1="250" x2="850" y2="250" stroke="#2a2a3e" stroke-width="1"/>
<text x="30" y="278" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">这就是为什么「CPU 占用只有 5%，所以没问题」是一句危险的话。</text>
<text x="30" y="306" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CPU profiler 采的是「CPU 正在执行哪条指令」。CPU 在等 IO 的时候，它没东西可采 —— 在你眼里就是一片空白。</text>
<text x="30" y="328" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以拿 CPU profiler 去查一个 IO 密集的接口，结论会是「哪儿都不慢」，可用户明明等了 800 毫秒。</text>
<text x="30" y="362" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两把不同的尺子：</text>
<text x="30" y="384" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CPU profile 回答「算得累不累」，wall clock profile 回答「等了多久」。用错尺子，会得出完全相反的结论。</text>
</svg>
