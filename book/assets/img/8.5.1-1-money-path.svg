<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">"你收到钱了吗"——其实是在问五站</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从用户付款到对公账户到账，中间隔着的每一站</text>
<rect x="24" y="168" width="104" height="64" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="24" y="168" width="104" height="3" rx="1" fill="#67b5ef" stroke="none" stroke-width="0"/>
<text x="76.0" y="198" fill="#c8c8dc" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">用户</text>
<text x="76.0" y="218" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的买家</text>
<rect x="156" y="168" width="104" height="64" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="156" y="168" width="104" height="3" rx="1" fill="#b58ae8" stroke="none" stroke-width="0"/>
<text x="208.0" y="198" fill="#c8c8dc" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">支付通道</text>
<text x="208.0" y="218" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">微信 / 支付宝</text>
<rect x="288" y="168" width="104" height="64" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="288" y="168" width="104" height="3" rx="1" fill="#8a8aa0" stroke="none" stroke-width="0"/>
<text x="340.0" y="198" fill="#c8c8dc" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">清算系统</text>
<text x="340.0" y="218" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">网联 / 银联</text>
<rect x="420" y="168" width="104" height="64" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="420" y="168" width="104" height="3" rx="1" fill="#e8b84b" stroke="none" stroke-width="0"/>
<text x="472.0" y="198" fill="#c8c8dc" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你的商户号</text>
<text x="472.0" y="218" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">平台给你开的户</text>
<rect x="552" y="168" width="104" height="64" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="552" y="168" width="104" height="3" rx="1" fill="#67d9a0" stroke="none" stroke-width="0"/>
<text x="604.0" y="198" fill="#c8c8dc" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">对公账户</text>
<text x="604.0" y="218" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱最后落地</text>
<line x1="128" y1="200.0" x2="156" y2="200.0" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M150,196.0 L156,200.0 L150,204.0" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<text x="142" y="154" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">付款 · 3 秒</text>
<line x1="260" y1="200.0" x2="288" y2="200.0" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M282,196.0 L288,200.0 L282,204.0" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<text x="274" y="154" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记录交易</text>
<line x1="392" y1="200.0" x2="420" y2="200.0" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M414,196.0 L420,200.0 L414,204.0" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<text x="406" y="154" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">清算 · 当晚</text>
<line x1="524" y1="200.0" x2="552" y2="200.0" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M546,196.0 L552,200.0 L546,204.0" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<text x="538" y="154" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结算 · T+1</text>
<text x="24" y="80" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱不是"扫一下就到你账上"——它每一站都有身份核验、费率和规则。</text>
<text x="24" y="284" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">T+1 不是通道故意压你的钱，是清算体系的工作节拍：当晚批量清分，次日入账。</text>
<text x="24" y="304" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以"收款慢一天"不是谁在坑你，是钱在走它必须走的路。</text>
</svg>
