<text x="208" y="240" fill="#67d9a0" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能</text>
<text x="40" y="274" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">域名声誉</text>
<text x="208" y="274" fill="#e87a8a" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">共享</text>
<text x="40" y="308" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">迁移成本</text>
