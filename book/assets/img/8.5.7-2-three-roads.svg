<text x="256" y="362" fill="#6a6a84" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只收不发，够用作登录凭证</text>
<rect x="456" y="92" width="200" height="300" rx="6" fill="#15151f" stroke="#2e2e44" stroke-width="1.2"/>
<rect x="456" y="92" width="200" height="3" rx="0" fill="#67d9a0" stroke="none" stroke-width="1.5"/>
<text x="472" y="120" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">域名 + 企业邮</text>
<text x="472" y="138" fill="#5e5e78" font-size="8.5" text-anchor="start" font-family="monospace">Zoho Mail / Fastmail</text>
<text x="472" y="168" fill="#67d9a0" font-size="13" text-anchor="start" font-family="monospace">$12~84 / 年</text>
<line x1="472" y1="182" x2="640" y2="182" stroke="#2a2a3e" stroke-width="1"/>
<text x="472" y="206" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所有权</text>
<text x="640" y="206" fill="#67d9a0" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的</text>
<text x="472" y="240" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能否自主发信</text>
<text x="640" y="240" fill="#67d9a0" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能</text>
<text x="472" y="274" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">域名声誉</text>
<text x="640" y="274" fill="#67d9a0" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">独立</text>
<text x="472" y="308" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">迁移成本</text>
<text x="640" y="308" fill="#67d9a0" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换服务商即可</text>
<text x="472" y="362" fill="#6a6a84" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要和客户通信就选这条</text>
<text x="24" y="428" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">域名是一年十美元的锚点。它不贵，但它是这套体系里唯一真正写着你名字的东西。</text>
<text x="24" y="448" fill="#6a6a84" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">邮箱服务商可以随时换，域名换了，所有账号都要重绑——所以钱要花在域名上，不是邮箱上。</text>
</svg>
