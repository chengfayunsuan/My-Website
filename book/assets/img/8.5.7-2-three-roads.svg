<text x="40" y="138" fill="#5e5e78" font-size="8.5" text-anchor="start" font-family="monospace">Gmail / Outlook</text>
<text x="40" y="168" fill="#8a8aa0" font-size="13" text-anchor="start" font-family="monospace">$0</text>
