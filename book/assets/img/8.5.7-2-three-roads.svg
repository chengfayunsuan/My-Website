<text x="256" y="138" fill="#5e5e78" font-size="8.5" text-anchor="start" font-family="monospace">Cloudflare Email Routing</text>
<text x="256" y="168" fill="#e8b84b" font-size="13" text-anchor="start" font-family="monospace">$10 / 年</text>
