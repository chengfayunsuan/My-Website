<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="300" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.1 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">确认「你是你」，靠三道验证</text>
<rect x="26" y="92" width="266" height="132" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="159" y="122" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">证件真伪</text>
<text x="159" y="158" fill="#cfcfe0" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">身份证号送公安库</text>
<text x="159" y="184" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查这个号存不存在</text>
<rect x="308" y="92" width="266" height="132" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="441" y="122" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人证一致</text>
<text x="441" y="158" fill="#cfcfe0" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">现场人脸与证件照比对</text>
<text x="441" y="184" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">确认来的人就是本人</text>
<rect x="590" y="92" width="266" height="132" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="723" y="122" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">号码实名</text>
<text x="723" y="158" fill="#cfcfe0" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">预留手机号要实名</text>
<text x="723" y="184" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">出事了能找到人</text>
<text x="26" y="262" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三样都过，才叫「实名开户」。少一样，就只能开功能受限的账户。</text>
<text x="26" y="288" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这套流程的目的是让每个账户背后都有一个能被找到的真人——这是后面反洗钱的基础。</text>
</svg>
