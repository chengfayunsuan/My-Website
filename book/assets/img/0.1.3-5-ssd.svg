<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="#0e0e16"/>
  <text x="24" y="28" fill="#9a9ab4" font-size="12.5" font-family="monospace">固态硬盘其实是一台小电脑：主控跑固件，闪存只是它的硬盘</text>

  <!-- ============ 左：内部框图 ============ -->
  <rect x="22" y="46" width="398" height="398" rx="10" fill="#12121c" stroke="#2a2a44"/>
  <text x="42" y="74" fill="#d8d8e4" font-size="13">一块 M.2 固态里有什么</text>

  <!-- 主机 -->
  <rect x="44" y="96" width="88" height="40" rx="6" fill="#171725" stroke="#2a2a44"/>
  <text x="88" y="121" fill="#9a9ab4" font-size="10" text-anchor="middle">主板</text>

  <!-- PCIe -->
  <line x1="132" y1="116" x2="176" y2="116" stroke="#67b5ef" stroke-width="2" marker-end="url(#a4)"/>
  <text x="154" y="108" fill="#67b5ef" font-size="9" text-anchor="middle">PCIe</text>

  <!-- 主控 -->
  <rect x="176" y="96" width="112" height="40" rx="6" fill="#3a2b52" stroke="#9b4df0" stroke-width="1.6"/>
  <text x="232" y="115" fill="#cfc6ff" font-size="10.5" text-anchor="middle">主控</text>
  <text x="232" y="129" fill="#6b6b85" font-size="9" text-anchor="middle">一颗 ARM 核在跑固件</text>

  <!-- 闪存 -->
  <g fill="#1f3a4a" stroke="#67b5ef">
    <rect x="330" y="88" width="72" height="18" rx="3"/><rect x="330" y="110" width="72" height="18" rx="3"/>
    <rect x="330" y="132" width="72" height="18" rx="3"/><rect x="330" y="154" width="72" height="18" rx="3"/>
  </g>
  <g fill="#9fd4f5" font-size="8.5" text-anchor="middle">
    <text x="366" y="101">闪存 die 0</text><text x="366" y="123">闪存 die 1</text>
    <text x="366" y="145">闪存 die 2</text><text x="366" y="167">闪存 die 3</text>
  </g>
  <line x1="288" y1="116" x2="326" y2="116" stroke="#67b5ef" stroke-width="1.6" marker-end="url(#a4)"/>
  <text x="307" y="108" fill="#6b6b85" font-size="8.5" text-anchor="middle">8 通道</text>

  <!-- DRAM 缓存 -->
  <rect x="176" y="176" width="112" height="40" rx="6" fill="#1a1a2a" stroke="#2a2a44"/>
  <text x="232" y="195" fill="#9a9ab4" font-size="10" text-anchor="middle">DRAM 缓存</text>
  <text x="232" y="208" fill="#6b6b85" font-size="9" text-anchor="middle">存映射表</text>
  <line x1="232" y1="136" x2="232" y2="172" stroke="#2a2a44" stroke-width="1.6" marker-end="url(#a5)"/>

  <!-- FTL -->
  <text x="42" y="248" fill="#e8b84b" font-size="10.5">固件在这里做三件磁盘不用做的事：</text>
  <text x="42" y="270" fill="#9a9ab4" font-size="10">① 映射：逻辑块号 → 物理页号（所以「零碎文件」不用整理）</text>
  <text x="42" y="290" fill="#9a9ab4" font-size="10">② 磨损均衡：把擦写摊平到每个块，别让某块先死</text>
  <text x="42" y="310" fill="#9a9ab4" font-size="10">③ 垃圾回收：把有效页搬走，整块擦掉再用</text>

  <rect x="42" y="328" width="358" height="96" rx="8" fill="#171725" stroke="#2a2a44"/>
  <text x="56" y="348" fill="#e8b84b" font-size="10.5">这就是为什么 SSD 写久了会掉速：</text>
  <text x="56" y="368" fill="#9a9ab4" font-size="10">空闲块多的时候，直接写到空白页，很快。</text>
  <text x="56" y="386" fill="#9a9ab4" font-size="10">空闲块用完，每次写都要先搬、再擦、再写，慢好几倍。</text>
  <text x="56" y="406" fill="#6b6b85" font-size="9.5">TRIM 就是告诉它「这些页我不要了」，让它提前清理。</text>

  <!-- ============ 右：写放大 ============ -->
  <rect x="440" y="46" width="298" height="398" rx="10" fill="#12121c" stroke="#2a2a44"/>
  <text x="460" y="74" fill="#d8d8e4" font-size="13">改 1 个页，可能写 4 个页</text>

  <text x="460" y="100" fill="#6b6b85" font-size="9.5">一个块 = 8 个页（每页 4~16 KB）</text>

  <!-- 块内 8 页 -->
  <g stroke="#2a2a44">
    <rect x="460" y="112" width="30" height="30" rx="3" fill="#16281f" stroke="#4ec9a3"/>
    <rect x="494" y="112" width="30" height="30" rx="3" fill="#16281f" stroke="#4ec9a3"/>
    <rect x="528" y="112" width="30" height="30" rx="3" fill="#1a1a2a"/>
    <rect x="562" y="112" width="30" height="30" rx="3" fill="#3a3020" stroke="#e8b84b" stroke-width="1.6"/>
    <rect x="596" y="112" width="30" height="30" rx="3" fill="#16281f" stroke="#4ec9a3"/>
    <rect x="630" y="112" width="30" height="30" rx="3" fill="#1a1a2a"/>
    <rect x="664" y="112" width="30" height="30" rx="3" fill="#1a1a2a"/>
    <rect x="698" y="112" width="30" height="30" rx="3" fill="#1a1a2a"/>
  </g>
  <text x="475" y="132" fill="#4ec9a3" font-size="8.5" text-anchor="middle">有效</text>
  <text x="509" y="132" fill="#4ec9a3" font-size="8.5" text-anchor="middle">有效</text>
  <text x="577" y="132" fill="#e8b84b" font-size="8.5" text-anchor="middle">要改</text>
  <text x="611" y="132" fill="#4ec9a3" font-size="8.5" text-anchor="middle">有效</text>

  <!-- 步骤 -->
  <text x="460" y="176" fill="#9a9ab4" font-size="10.5">① 把 3 个有效页搬到新块</text>
  <text x="460" y="196" fill="#9a9ab4" font-size="10.5">② 把旧块整块擦掉（只能整块擦）</text>
  <text x="460" y="216" fill="#9a9ab4" font-size="10.5">③ 把改好的 1 页写进去</text>

  <!-- 结果 -->
  <text x="460" y="248" fill="#f0606a" font-size="10.5">用户写 1 页，闪存写 4 页 → 放大 4 倍</text>

  <!-- 条形对比 -->
  <rect x="460" y="262" width="36" height="18" rx="2" fill="#3a4a5c" stroke="#67b5ef"/>
  <text x="504" y="276" fill="#9fd4f5" font-size="9.5">你要求写的</text>

  <rect x="460" y="290" width="144" height="18" rx="2" fill="#382830" stroke="#f0606a"/>
  <text x="612" y="304" fill="#f0b8bc" font-size="9.5">闪存实际写的</text>

  <text x="460" y="338" fill="#9a9ab4" font-size="10">写放大越高，寿命消耗越快、速度越慢。</text>
  <text x="460" y="356" fill="#6b6b85" font-size="9.5">机械硬盘没有这个问题：它可以直接改那 4KB，</text>
  <text x="460" y="371" fill="#6b6b85" font-size="9.5">磁头飞过去、把那一小段重写就行。</text>

  <rect x="452" y="388" width="278" height="42" rx="8" fill="#171725" stroke="#2a2a44"/>
  <text x="466" y="406" fill="#e8b84b" font-size="9.5">「SSD 越用越慢」不是错觉：</text>
  <text x="466" y="421" fill="#6b6b85" font-size="9">写得越满、空闲块越少，垃圾回收越频繁。</text>

  <defs>
    <marker id="a4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#67b5ef"/>
    </marker>
    <marker id="a5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#2a2a44"/>
    </marker>
  </defs>
</svg>
