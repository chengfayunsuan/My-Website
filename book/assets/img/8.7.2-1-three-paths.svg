<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">数据要出国，先看自己落在哪一档</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">门槛按"主体类型 + 人数"算，不是按数据重不重要算</text>
<rect x="30" y="84" width="620" height="112" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="30" y="84" width="5" height="112" rx="2" fill="#67d9a0" stroke="none" stroke-width="0"/>
<text x="52" y="110" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">豁免</text>
<text x="52" y="130" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不需要任何手续</text>
<text x="206" y="106" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 为订立、履行个人作为一方的合同所必需</text>
<text x="206" y="128" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 按依法制定的劳动规章实施跨境人力资源管理</text>
<text x="206" y="150" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 紧急情况下为保护自然人生命健康财产</text>
<text x="206" y="172" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 自然年内累计出境不满 10 万人（不含敏感）</text>
<rect x="30" y="206" width="620" height="112" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="30" y="206" width="5" height="112" rx="2" fill="#67b5ef" stroke="none" stroke-width="0"/>
<text x="52" y="232" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">标准合同 / 保护认证</text>
<text x="52" y="252" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">签合同并备案，或做认证</text>
<text x="206" y="228" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 非关键信息基础设施运营者</text>
<text x="206" y="250" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 处理个人信息不满 100 万人</text>
<text x="206" y="272" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 累计出境 10 万人以下个人信息</text>
<text x="206" y="294" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 且敏感个人信息不满 1 万人</text>
<rect x="30" y="328" width="620" height="112" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="30" y="328" width="5" height="112" rx="2" fill="#e8965a" stroke="none" stroke-width="0"/>
<text x="52" y="354" fill="#e8965a" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">安全评估</text>
<text x="52" y="374" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">报网信部门评估，周期最长</text>
<text x="206" y="350" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 关键信息基础设施运营者（CIIO）</text>
<text x="206" y="372" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 处理 100 万人以上个人信息</text>
<text x="206" y="394" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 累计出境 10 万人以上个人信息</text>
<text x="206" y="416" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 或敏感个人信息 1 万人以上</text>
<text x="340" y="448" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三档可以叠加：满足豁免就不用走后面两档；不足评估门槛就走标准合同。</text>
</svg>
