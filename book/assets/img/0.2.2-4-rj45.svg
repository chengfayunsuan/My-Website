<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="450" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">RJ45：八根线，百兆只用四根</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">千兆要让四对线同时收发——靠「减掉自己发的声音」分清楚谁在说话</text>

  <!-- 八针 -->
  <text x="40" y="76" fill="#9a9ab4" font-size="9">按 T568B 线序</text>

  <g>
    <rect x="40" y="88" width="36" height="72" rx="2" fill="#3a2a18" stroke="#e8b84b"/><text x="58" y="120" fill="#e8b84b" font-size="9" text-anchor="middle">1</text>
    <rect x="82" y="88" width="36" height="72" rx="2" fill="#3a2a18" stroke="#e8b84b"/><text x="100" y="120" fill="#e8b84b" font-size="9" text-anchor="middle">2</text>
    <rect x="124" y="88" width="36" height="72" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="142" y="120" fill="#4ec9a3" font-size="9" text-anchor="middle">3</text>
    <rect x="166" y="88" width="36" height="72" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="184" y="120" fill="#9fd4f5" font-size="9" text-anchor="middle">4</text>
    <rect x="208" y="88" width="36" height="72" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="226" y="120" fill="#9fd4f5" font-size="9" text-anchor="middle">5</text>
    <rect x="250" y="88" width="36" height="72" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="268" y="120" fill="#4ec9a3" font-size="9" text-anchor="middle">6</text>
    <rect x="292" y="88" width="36" height="72" rx="2" fill="#3a2430" stroke="#c98a8a"/><text x="310" y="120" fill="#c98a8a" font-size="9" text-anchor="middle">7</text>
    <rect x="334" y="88" width="36" height="72" rx="2" fill="#3a2430" stroke="#c98a8a"/><text x="352" y="120" fill="#c98a8a" font-size="9" text-anchor="middle">8</text>
  </g>

  <g fill="#6b6b85" font-size="7.5" text-anchor="middle">
    <text x="58" y="176">橙白</text><text x="100" y="176">橙</text>
    <text x="142" y="176">绿白</text><text x="184" y="176">蓝</text>
    <text x="226" y="176">蓝白</text><text x="268" y="176">绿</text>
    <text x="310" y="176">棕白</text><text x="352" y="176">棕</text>
  </g>

  <text x="40" y="200" fill="#e8b84b" font-size="8.5">1-2 一对（橙）、3-6 一对（绿）、4-5（蓝）、7-8（棕）</text>
  <text x="40" y="216" fill="#6b6b85" font-size="8">3 和 6 中间隔着 4、5——为了兼容老电话线的接线</text>

  <!-- 右侧对比 -->
  <line x1="400" y1="70" x2="400" y2="330" stroke="#2a2a44"/>

  <text x="424" y="88" fill="#d8d8e4" font-size="10">百兆：只用 1-2、3-6</text>
  <g>
    <rect x="424" y="98" width="24" height="24" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="436" y="114" fill="#4ec9a3" font-size="8" text-anchor="middle">1</text>
    <rect x="452" y="98" width="24" height="24" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="464" y="114" fill="#4ec9a3" font-size="8" text-anchor="middle">2</text>
    <rect x="480" y="98" width="24" height="24" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="492" y="114" fill="#4ec9a3" font-size="8" text-anchor="middle">3</text>
    <rect x="508" y="98" width="24" height="24" rx="2" fill="#171725" stroke="#33334d"/><text x="520" y="114" fill="#4a4a68" font-size="8" text-anchor="middle">4</text>
    <rect x="536" y="98" width="24" height="24" rx="2" fill="#171725" stroke="#33334d"/><text x="548" y="114" fill="#4a4a68" font-size="8" text-anchor="middle">5</text>
    <rect x="564" y="98" width="24" height="24" rx="2" fill="#183028" stroke="#4ec9a3"/><text x="576" y="114" fill="#4ec9a3" font-size="8" text-anchor="middle">6</text>
    <rect x="592" y="98" width="24" height="24" rx="2" fill="#171725" stroke="#33334d"/><text x="604" y="114" fill="#4a4a68" font-size="8" text-anchor="middle">7</text>
    <rect x="620" y="98" width="24" height="24" rx="2" fill="#171725" stroke="#33334d"/><text x="632" y="114" fill="#4a4a68" font-size="8" text-anchor="middle">8</text>
  </g>
  <text x="424" y="142" fill="#6b6b85" font-size="8">一对发（1-2）、一对收（3-6），各 100 Mbps</text>
  <text x="424" y="158" fill="#6b6b85" font-size="8">空闲四根接不接都行——「百兆能通千兆不通」就出在这</text>

  <text x="424" y="188" fill="#d8d8e4" font-size="10">千兆：四对全用，每对双向</text>
  <g>
    <rect x="424" y="198" width="24" height="24" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="436" y="214" fill="#9fd4f5" font-size="8" text-anchor="middle">1</text>
    <rect x="452" y="198" width="24" height="24" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="464" y="214" fill="#9fd4f5" font-size="8" text-anchor="middle">2</text>
    <rect x="480" y="198" width="24" height="24" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="492" y="214" fill="#9fd4f5" font-size="8" text-anchor="middle">3</text>
    <rect x="508" y="198" width="24" height="24" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="520" y="214" fill="#9fd4f5" font-size="8" text-anchor="middle">4</text>
    <rect x="536" y="198" width="24" height="24" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="548" y="214" fill="#9fd4f5" font-size="8" text-anchor="middle">5</text>
    <rect x="564" y="198" width="24" height="24" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="576" y="214" fill="#9fd4f5" font-size="8" text-anchor="middle">6</text>
    <rect x="592" y="198" width="24" height="24" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="604" y="214" fill="#9fd4f5" font-size="8" text-anchor="middle">7</text>
    <rect x="620" y="198" width="24" height="24" rx="2" fill="#1b2740" stroke="#67b5ef"/><text x="632" y="214" fill="#9fd4f5" font-size="8" text-anchor="middle">8</text>
  </g>
  <text x="424" y="242" fill="#6b6b85" font-size="8">每对 250 Mbps × 2 个方向 = 4 × 500 = 1000 Mbps</text>

  <!-- 回波消除小示意 -->
  <rect x="40" y="244" width="330" height="84" rx="5" fill="#171725" stroke="#2a2a44"/>
  <text x="56" y="266" fill="#cfc6ff" font-size="9.5">回波消除：同一对线同时收发</text>
  <text x="56" y="286" fill="#9a9ab4" font-size="9">收到的混合信号 − 自己刚发出的 = 对方的信号</text>
  <text x="56" y="304" fill="#6b6b85" font-size="8.5">这需要相当强的运算能力，是千兆网卡比百兆贵的原因</text>
  <text x="56" y="320" fill="#6b6b85" font-size="8.5">四对线各算一遍，就是「千兆」这个名字的由来</text>

  <!-- 底部 -->
  <line x1="24" y1="348" x2="736" y2="348" stroke="#2a2a44"/>
  <text x="24" y="370" fill="#e8b84b" font-size="9">100 米是怎么来的：双绞线跑 100 米后信号衰减到快认不出，这是物理极限，不是协议规定</text>
  <text x="24" y="392" fill="#9a9ab4" font-size="9">线序两头做得不一样（一端 A 一端 B）是老的「交叉线」做法；现代网卡的 Auto-MDIX 会自动纠正</text>
  <text x="24" y="414" fill="#9a9ab4" font-size="9">Cat5e 支持千兆到 100 米，万兆只到 55 米（Cat6）/100 米（Cat6a）——数字全写在类别里</text>
  <text x="24" y="436" fill="#6b6b85" font-size="8.5">买一个几十块的测线仪，能省下几小时「到底是线还是网卡坏了」的排查</text>
</svg>
