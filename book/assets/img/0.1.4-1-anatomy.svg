<svg width="760" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#67b5ef"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#9b4df0"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">一块显卡 = 三层夹心 + 板上的七样东西</text>

  <!-- ================= 左：侧视三层 ================= -->
  <text x="24" y="56" fill="#d8d8e4" font-size="12.5">侧着看：三层</text>

  <rect x="24" y="70" width="286" height="58" rx="6" fill="#1b2740" stroke="#67b5ef"/>
  <text x="167" y="94" fill="#9fd4f5" font-size="11" text-anchor="middle">散热器</text>
  <text x="167" y="112" fill="#6b6b85" font-size="9.5" text-anchor="middle">风扇 + 鳍片 + 均热板 + 热管</text>

  <rect x="24" y="148" width="286" height="34" rx="5" fill="#20303a" stroke="#4ec9a3"/>
  <text x="167" y="170" fill="#9fe0c9" font-size="11" text-anchor="middle">PCB · 12～14 层</text>

  <rect x="24" y="202" width="286" height="26" rx="5" fill="#232338" stroke="#2a2a44"/>
  <text x="167" y="219" fill="#9a9ab4" font-size="10.5" text-anchor="middle">背板 · 防 PCB 被自己压弯</text>

  <line x1="167" y1="128" x2="167" y2="146" stroke="#67b5ef" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="167" y1="182" x2="167" y2="200" stroke="#67b5ef" stroke-width="1.4" marker-end="url(#a1)"/>

  <text x="24" y="258" fill="#e8b84b" font-size="10.5">为什么非这么叠：</text>
  <text x="24" y="278" fill="#9a9ab4" font-size="10">① 显存必须贴着 GPU，信号只能跑几厘米</text>
  <text x="24" y="296" fill="#9a9ab4" font-size="10">② 供电要接外接口，还得离芯片近</text>
  <text x="24" y="314" fill="#9a9ab4" font-size="10">③ 输出口只能在挡板那头，板长就被定死了</text>

  <rect x="24" y="332" width="286" height="72" rx="8" fill="#171725" stroke="#2a2a44"/>
  <text x="38" y="352" fill="#cfc6ff" font-size="10.5">整卡 450 瓦的去向：</text>
  <text x="38" y="370" fill="#9a9ab4" font-size="10">芯片 350 瓦 + 显存 60 瓦 + 转换损耗 40 瓦</text>
  <text x="38" y="390" fill="#6b6b85" font-size="9.5">这些数决定了散热器得多大、线得多粗</text>

  <!-- ================= 右：俯视布局 ================= -->
  <text x="336" y="56" fill="#d8d8e4" font-size="12.5">平着看：PCB 上的排布</text>


  <!-- PCB -->
  <rect x="355" y="90" width="375" height="310" rx="8" fill="#16232a" stroke="#3d6b5a"/>

  <!-- GPU -->
  <rect x="492" y="182" width="96" height="96" rx="6" fill="#3a2b52" stroke="#9b4df0" stroke-width="1.8"/>
  <text x="540" y="222" fill="#cfc6ff" font-size="11.5" text-anchor="middle">GPU</text>
  <text x="540" y="238" fill="#9a9ab4" font-size="9" text-anchor="middle">608 mm²</text>
  <text x="540" y="254" fill="#6b6b85" font-size="8.5" text-anchor="middle">16384 单元</text>
  <text x="540" y="166" fill="#9b4df0" font-size="9" text-anchor="middle">GPU 居中，显存环绕</text>

  <!-- 显存 12 颗：上4 下4 左2 右2 -->
  <g fill="#1f3a4a" stroke="#67b5ef" stroke-width="1">
    <rect x="390" y="100" width="52" height="26" rx="2"/>
    <rect x="450" y="100" width="52" height="26" rx="2"/>
    <rect x="510" y="100" width="52" height="26" rx="2"/>
    <rect x="570" y="100" width="52" height="26" rx="2"/>
    <rect x="390" y="352" width="52" height="26" rx="2"/>
    <rect x="450" y="352" width="52" height="26" rx="2"/>
    <rect x="510" y="352" width="52" height="26" rx="2"/>
    <rect x="570" y="352" width="52" height="26" rx="2"/>
    <rect x="412" y="160" width="28" height="52" rx="2"/>
    <rect x="412" y="228" width="28" height="52" rx="2"/>
    <rect x="640" y="160" width="28" height="52" rx="2"/>
    <rect x="640" y="228" width="28" height="52" rx="2"/>
  </g>

  <!-- VRM -->
  <g fill="#2b2036" stroke="#9b4df0" stroke-width="1">
    <rect x="676" y="140" width="40" height="14" rx="2"/>
    <rect x="676" y="162" width="40" height="14" rx="2"/>
    <rect x="676" y="184" width="40" height="14" rx="2"/>
    <rect x="676" y="206" width="40" height="14" rx="2"/>
    <rect x="676" y="228" width="40" height="14" rx="2"/>
    <rect x="676" y="250" width="40" height="14" rx="2"/>
    <rect x="676" y="272" width="40" height="14" rx="2"/>
    <rect x="676" y="294" width="40" height="14" rx="2"/>
  </g>
  <text x="696" y="332" fill="#cfc6ff" font-size="9" text-anchor="middle">供电 VRM</text>
  <text x="696" y="346" fill="#6b6b85" font-size="8.5" text-anchor="middle">12V→1V</text>

  <!-- BIOS 芯片 -->
  <rect x="366" y="294" width="46" height="28" rx="2" fill="#1a1a2a" stroke="#4a4a68"/>
  <text x="389" y="308" fill="#9a9ab4" font-size="8.5" text-anchor="middle">BIOS</text>
  <text x="389" y="318" fill="#6b6b85" font-size="7.5" text-anchor="middle">固件</text>

  <!-- 外接供电口 -->
  <rect x="600" y="62" width="76" height="20" rx="3" fill="#2b2036" stroke="#9b4df0"/>
  <text x="638" y="76" fill="#cfc6ff" font-size="8.5" text-anchor="middle">12VHPWR</text>
  <line x1="638" y1="82" x2="638" y2="138" stroke="#9b4df0" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- PCIe 金手指 -->
  <rect x="400" y="400" width="240" height="16" rx="2" fill="#3a3320" stroke="#e8b84b"/>
  <g stroke="#e8b84b" stroke-width="1.2">
    <line x1="410" y1="402" x2="410" y2="414"/><line x1="422" y1="402" x2="422" y2="414"/>
    <line x1="434" y1="402" x2="434" y2="414"/><line x1="446" y1="402" x2="446" y2="414"/>
    <line x1="458" y1="402" x2="458" y2="414"/><line x1="470" y1="402" x2="470" y2="414"/>
    <line x1="482" y1="402" x2="482" y2="414"/><line x1="494" y1="402" x2="494" y2="414"/>
  </g>
  <text x="520" y="436" fill="#e8b84b" font-size="9.5">PCIe ×16 金手指 · 槽只给 75 瓦</text>
  <!-- 挡板（画在 PCB 之后，避免被底色盖住） -->
  <rect x="730" y="120" width="14" height="240" rx="3" fill="#2a2a44" stroke="#4a4a68"/>
  <g fill="#0e0e16" stroke="#67b5ef" stroke-width="1">
    <rect x="732" y="150" width="10" height="26"/><rect x="732" y="192" width="10" height="26"/>
    <rect x="732" y="234" width="10" height="26"/>
  </g>
  <text x="726" y="112" fill="#6b6b85" font-size="9" text-anchor="end">输出口 →</text>

  <!-- 七样东西编号 -->
  <text x="392" y="394" fill="#9fd4f5" font-size="9">显存 12 颗 × 32 位 = 384 位</text>

  <text x="24" y="470" fill="#e8b84b" font-size="10.5">七样东西：GPU、显存、VRM、金手指、外接供电口、输出口、BIOS 芯片</text>
  <text x="24" y="490" fill="#9a9ab4" font-size="10">它们的相对位置不是设计品味——每一处都卡在「信号能跑多远」和「热往哪走」上。</text>
</svg>
