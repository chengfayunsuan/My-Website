<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.3-4  红-绿-重构：每一步都很小</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">先写一个必然失败的测试，再写刚好让它通过的代码，最后在不改行为的前提下收拾干净</text>
<rect x="40" y="86" width="280" height="64" rx="5" fill="#2a1a20" stroke="#e87a8a" stroke-width="1.5"/>
<text x="180" y="112" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">① 写一个失败的测试</text>
<text x="180" y="134" fill="#7a7a92" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">红：跑一下，确认它真的失败</text>
<rect x="560" y="86" width="280" height="64" rx="5" fill="#16281c" stroke="#67d9a0" stroke-width="1.5"/>
<text x="700" y="112" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">② 写刚好够的代码</text>
<text x="700" y="134" fill="#7a7a92" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">绿：不许多写一行，先让它过</text>
<rect x="300" y="264" width="280" height="64" rx="5" fill="#16202c" stroke="#67b5ef" stroke-width="1.5"/>
<text x="440" y="290" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">③ 重构</text>
<text x="440" y="312" fill="#7a7a92" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还是绿：改结构，每改一步跑一次</text>
<line x1="324" y1="118" x2="552" y2="118" stroke="#4a4a66" stroke-width="1.5"/>
<path d="M552,113 L564,118 L552,123 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="438" y="108" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">测试红了，说明它测到了东西</text>
<path d="M700,150 L700,250 L500,250 L500,264" fill="none" stroke="#4a4a66" stroke-width="1.5"/>
<path d="M495,264 L500,276 L505,264 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="610" y="242" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">跑一次，全绿</text>
<path d="M300,296 L180,296 L180,156" fill="none" stroke="#4a4a66" stroke-width="1.5"/>
<path d="M175,156 L180,144 L185,156 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="240" y="288" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">下一个需求，再走一圈</text>
<rect x="360" y="168" width="160" height="56" rx="4" fill="#14141e" stroke="#3a3a52" stroke-width="1"/>
<text x="440" y="190" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一圈几分钟</text>
<text x="440" y="210" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是几小时</text>
<text x="30" y="372" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这套循环真正逼出来的东西，不是测试本身，是「先想清楚接口再写实现」。</text>
<text x="30" y="394" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">因为测试必须调用你的函数——函数叫什么、收什么参数、返回什么，都得先定下来。定不下来，说明设计还没想明白。</text>
<text x="30" y="418" fill="#7a7a92" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它不适合所有场景：探索性的原型、UI 布局、算法调参，都是「先跑起来看看」更快。工具要分场合用。</text>
</svg>
