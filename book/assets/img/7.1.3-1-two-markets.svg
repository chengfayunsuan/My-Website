<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.3 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一种人民币，两个市场，两个价格</text>
<rect x="30" y="92" width="350" height="148" rx="10" fill="#16161f" stroke="#67b5ef" stroke-width="1.6"/>
<text x="205" y="122" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在岸人民币 CNY</text>
<text x="205" y="150" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">境内银行间市场</text>
<text x="205" y="174" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有管理，有额度</text>
<text x="205" y="198" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你换汇走的就是这边</text>
<rect x="500" y="92" width="350" height="148" rx="10" fill="#16161f" stroke="#67d9a0" stroke-width="1.6"/>
<text x="675" y="122" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">离岸人民币 CNH</text>
<text x="675" y="150" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">香港、新加坡等境外市场</text>
<text x="675" y="174" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">自由买卖，自由定价</text>
<text x="675" y="198" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">外资机构看的就是这个价</text>
<line x1="440" y1="100" x2="440" y2="232" stroke="#4a4a62" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="430" y="152" width="20" height="30" rx="3" fill="#0e0e16" stroke="#8a8aa0" stroke-width="1.4"/>
<text x="440" y="256" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资本管制</text>
<text x="24" y="296" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">平时两个价差很小；一旦市场紧张（2015、2022），价差会拉开，那道理就是「钱想出去」。</text>
</svg>
