<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.3-3  覆盖率 100%，照样有 bug</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">覆盖率只统计「这行代码跑过没有」，它不问「这个值对不对」，更不问「别的值会怎样」</text>
<text x="30" y="88" fill="#8a8aa2" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">被测函数</text>
<rect x="30" y="104" width="400" height="26" rx="2" fill="#16281c" stroke="#2a4a36" stroke-width="1"/>
<circle cx="44" cy="117" r="3.5" fill="#67d9a0"/>
<text x="60" y="122" fill="#4a6a54" font-size="9" text-anchor="start" font-family="monospace">1</text>
<text x="78" y="122" fill="#a8c8b4" font-size="9.5" text-anchor="start" font-family="monospace">def average(nums):</text>
<rect x="30" y="134" width="400" height="26" rx="2" fill="#16281c" stroke="#2a4a36" stroke-width="1"/>
<circle cx="44" cy="147" r="3.5" fill="#67d9a0"/>
<text x="60" y="152" fill="#4a6a54" font-size="9" text-anchor="start" font-family="monospace">2</text>
<text x="78" y="152" fill="#a8c8b4" font-size="9.5" text-anchor="start" font-family="monospace">    total = 0</text>
<rect x="30" y="164" width="400" height="26" rx="2" fill="#16281c" stroke="#2a4a36" stroke-width="1"/>
<circle cx="44" cy="177" r="3.5" fill="#67d9a0"/>
<text x="60" y="182" fill="#4a6a54" font-size="9" text-anchor="start" font-family="monospace">3</text>
<text x="78" y="182" fill="#a8c8b4" font-size="9.5" text-anchor="start" font-family="monospace">    for n in nums:</text>
<rect x="30" y="194" width="400" height="26" rx="2" fill="#16281c" stroke="#2a4a36" stroke-width="1"/>
<circle cx="44" cy="207" r="3.5" fill="#67d9a0"/>
<text x="60" y="212" fill="#4a6a54" font-size="9" text-anchor="start" font-family="monospace">4</text>
<text x="78" y="212" fill="#a8c8b4" font-size="9.5" text-anchor="start" font-family="monospace">        total += n</text>
<rect x="30" y="224" width="400" height="26" rx="2" fill="#16281c" stroke="#2a4a36" stroke-width="1"/>
<circle cx="44" cy="237" r="3.5" fill="#67d9a0"/>
<text x="60" y="242" fill="#4a6a54" font-size="9" text-anchor="start" font-family="monospace">5</text>
<text x="78" y="242" fill="#a8c8b4" font-size="9.5" text-anchor="start" font-family="monospace">    return total / len(nums)</text>
<text x="30" y="280" fill="#67d9a0" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">五行全部被执行过 —— 行覆盖率 100%，分支也只有一个，分支覆盖率 100%。</text>
<text x="470" y="88" fill="#8a8aa2" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">写了的测试</text>
<rect x="470" y="104" width="376" height="84" rx="3" fill="#14141e" stroke="#2e4a3a" stroke-width="1.2"/>
<text x="488" y="130" fill="#a8c8b4" font-size="10" text-anchor="start" font-family="monospace">assert average([1, 2, 3]) == 2</text>
<text x="488" y="152" fill="#a8c8b4" font-size="10" text-anchor="start" font-family="monospace">assert average([10, 20]) == 15</text>
<text x="488" y="176" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">✓ 两个都过</text>
<text x="470" y="224" fill="#8a8aa2" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">没想到的输入</text>
<rect x="470" y="240" width="376" height="84" rx="3" fill="#2a1a20" stroke="#e87a8a" stroke-width="1.4"/>
<text x="488" y="266" fill="#e8a8b4" font-size="10" text-anchor="start" font-family="monospace">average([])</text>
<text x="488" y="288" fill="#e87a8a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ ZeroDivisionError: division by zero</text>
<text x="488" y="310" fill="#a8707c" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个用户没数据的页面，直接把服务打成 500</text>
<line x1="30" y1="330" x2="850" y2="330" stroke="#2a2a3e" stroke-width="1"/>
<text x="30" y="356" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">覆盖率能告诉你的：哪些代码从来没被执行过（那些是纯浪费，或者死代码）。</text>
<text x="30" y="378" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">覆盖率不能告诉你的：测过的那些执行，断言写得对不对；以及你没写的那些输入，会发生什么。</text>
<text x="30" y="406" fill="#7a7a92" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以覆盖率的正确用法是「找没盖到的地方」，不是「把数字刷到 100」。刷数字最省事的办法是删断言。</text>
</svg>
