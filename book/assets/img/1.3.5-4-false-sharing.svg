<svg width="900" height="524" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="524" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">伪共享：两个线程共享的不是变量，是缓存行</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">a 和 b 是两个独立的 long，逻辑上毫不相干；但它们在内存里挨着，落在同一个 64 字节里</text>
<text x="700" y="130" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">缓存行（64 字节）</text>
<rect x="200.0" y="140" width="62.5" height="62" rx="0" fill="#122018" stroke="#67d9a0" stroke-width="1.6"/>
<text x="231.25" y="170" fill="#67d9a0" font-size="17" text-anchor="middle" font-family="monospace" font-weight="bold">a</text>
<text x="231.25" y="188" fill="#6a6a82" font-size="7.5" text-anchor="middle" font-family="monospace">long</text>
<rect x="262.5" y="140" width="62.5" height="62" rx="0" fill="#241a12" stroke="#e8965a" stroke-width="1.6"/>
<text x="293.75" y="170" fill="#e8965a" font-size="17" text-anchor="middle" font-family="monospace" font-weight="bold">b</text>
<text x="293.75" y="188" fill="#6a6a82" font-size="7.5" text-anchor="middle" font-family="monospace">long</text>
<rect x="325.0" y="140" width="62.5" height="62" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<rect x="387.5" y="140" width="62.5" height="62" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<rect x="450.0" y="140" width="62.5" height="62" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<rect x="512.5" y="140" width="62.5" height="62" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<rect x="575.0" y="140" width="62.5" height="62" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<rect x="637.5" y="140" width="62.5" height="62" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<text x="675.0" y="174" fill="#3a3a52" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">…</text>
<text x="575.0" y="216" fill="#4a4a62" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">48 字节全是空的，但也要一起搬</text>
<rect x="40" y="88" width="130" height="48" rx="3" fill="#141420" stroke="#67d9a0" stroke-width="1.4"/>
<text x="105" y="107" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">线程 0</text>
<text x="105" y="125" fill="#8a8aa2" font-size="9" text-anchor="middle" font-family="monospace">只写 c.a</text>
<path d="M170,112 L231.25,112 L231.25,140" fill="none" stroke="#67d9a0" stroke-width="1.6"/>
<path d="M231,140 L227,132 L235,132 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<rect x="740" y="208" width="130" height="48" rx="3" fill="#141420" stroke="#e8965a" stroke-width="1.4"/>
<text x="805" y="227" fill="#e8965a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">线程 1</text>
<text x="805" y="245" fill="#8a8aa2" font-size="9" text-anchor="middle" font-family="monospace">只写 c.b</text>
<path d="M740,232 L293.75,232 L293.75,202" fill="none" stroke="#e8965a" stroke-width="1.6"/>
<path d="M293,202 L289,210 L297,210 Z" fill="#e8965a" stroke="#e8965a" stroke-width="0"/>
<line x1="200" y1="262" x2="700" y2="262" stroke="#e87a8a" stroke-width="1.6" stroke-dasharray="6 4"/>
<path d="M200,262 L209,257 L209,266 Z" fill="#e87a8a" stroke="#e87a8a" stroke-width="0"/>
<path d="M700,262 L691,257 L691,266 Z" fill="#e87a8a" stroke="#e87a8a" stroke-width="0"/>
<text x="450" y="254" fill="#e87a8a" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">独占权在这两个核之间来回搬</text>
<text x="450" y="279" fill="#7a7a92" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一次搬都要 40～70 拍，而真正有用的工作只有一条 inc</text>
<text x="24" y="312" fill="#67d9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">alignas(64) 之后：两个变量各占一行，互不相干</text>
<rect x="24" y="320" width="44" height="40" rx="0" fill="#122018" stroke="#67d9a0" stroke-width="1.5"/>
<rect x="68" y="320" width="44" height="40" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<rect x="112" y="320" width="44" height="40" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<text x="46" y="346" fill="#67d9a0" font-size="14" text-anchor="middle" font-family="monospace" font-weight="bold">a</text>
<text x="180" y="378" fill="#4a4a62" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">隔 64 字节</text>
<rect x="218" y="320" width="44" height="40" rx="0" fill="#241a12" stroke="#e8965a" stroke-width="1.5"/>
<rect x="262" y="320" width="44" height="40" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<rect x="306" y="320" width="44" height="40" rx="0" fill="#131320" stroke="#33334a" stroke-width="1.0"/>
<text x="240" y="346" fill="#e8965a" font-size="14" text-anchor="middle" font-family="monospace" font-weight="bold">b</text>
<text x="24" y="378" fill="#4a4a62" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">行 A</text>
<text x="218" y="378" fill="#4a4a62" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">行 B</text>
<text x="430" y="346" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">线程 0 只碰行 A，线程 1 只碰行 B。</text>
<text x="430" y="366" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">各自拿到独占权之后就不用再让出来，乒乓消失。</text>
<text x="24" y="442" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">实测：</text>
<text x="30" y="444" fill="#e87a8a" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">相邻，同一行</text>
<rect x="140" y="434" width="403.20000000000005" height="11" rx="2" fill="#1a1a26" stroke="#e87a8a" stroke-width="1"/>
<text x="551.2" y="444" fill="#e87a8a" font-size="9" text-anchor="start" font-family="monospace">4.2 s</text>
<text x="30" y="464" fill="#67d9a0" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">各占一行</text>
<rect x="140" y="454" width="57.599999999999994" height="11" rx="2" fill="#1a1a26" stroke="#67d9a0" stroke-width="1"/>
<text x="205.6" y="464" fill="#67d9a0" font-size="9" text-anchor="start" font-family="monospace">0.6 s</text>
<text x="30" y="484" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">单线程干两倍活</text>
<rect x="140" y="474" width="52.800000000000004" height="11" rx="2" fill="#1a1a26" stroke="#6a6a82" stroke-width="1"/>
<text x="200.8" y="484" fill="#6a6a82" font-size="9" text-anchor="start" font-family="monospace">0.55 s</text>
<text x="24" y="516" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">并行反而慢七倍：不是没有并行，是并行在互相拆台。三条横条是同一台机器、同样的工作量（两亿次自增）。</text>
</svg>
