<svg width="900" height="424" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="424" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">call 与 ret：返回地址是怎么进栈、又怎么出栈的</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">栈从高地址往低地址长；一格 8 字节</text>
<text x="24" y="106" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">高</text>
<line x1="32" y1="112" x2="32" y2="192" stroke="#4a4a62" stroke-width="1" stroke-dasharray="3 3"/>
<text x="24" y="208" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">低</text>
<text x="110" y="86" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">① 调用前</text>
<text x="390" y="86" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">② call 之后</text>
<text x="670" y="86" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">③ ret 之后</text>
<rect x="110" y="100" width="170" height="46" rx="3" fill="#191924" stroke="#4a4a62" stroke-width="1.4"/>
<text x="195.0" y="128" fill="#b0b0c8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">调用者的帧</text>
<line x1="110" y1="146" x2="280" y2="146" stroke="#67d9a0" stroke-width="2"/>
<text x="100" y="150" fill="#67d9a0" font-size="10.5" text-anchor="end" font-family="monospace">rsp</text>
<text x="195.0" y="172" fill="#5a5a72" font-size="9" text-anchor="middle" font-family="monospace">0x7ffc1000</text>
<rect x="390" y="100" width="170" height="46" rx="3" fill="#191924" stroke="#4a4a62" stroke-width="1.4"/>
<text x="475.0" y="128" fill="#b0b0c8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">调用者的帧</text>
<rect x="390" y="146" width="170" height="38" rx="3" fill="#2a2016" stroke="#e8965a" stroke-width="1.6"/>
<text x="475.0" y="170" fill="#e8965a" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">返回地址</text>
<line x1="390" y1="184" x2="560" y2="184" stroke="#67d9a0" stroke-width="2"/>
<text x="380" y="188" fill="#67d9a0" font-size="10.5" text-anchor="end" font-family="monospace">rsp−8</text>
<text x="475.0" y="210" fill="#5a5a72" font-size="9" text-anchor="middle" font-family="monospace">0x7ffc0ff8</text>
<rect x="670" y="100" width="170" height="46" rx="3" fill="#191924" stroke="#4a4a62" stroke-width="1.4"/>
<text x="755.0" y="128" fill="#b0b0c8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">调用者的帧</text>
<rect x="670" y="146" width="170" height="38" rx="3" fill="#141420" stroke="#5f5f78" stroke-width="1.2"/>
<rect x="670" y="146" width="170" height="38" rx="3" fill="none" stroke="#5f5f78" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="755.0" y="170" fill="#6f6f88" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">旧返回地址（还在）</text>
<line x1="670" y1="146" x2="840" y2="146" stroke="#67d9a0" stroke-width="2"/>
<text x="848" y="150" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="monospace">rsp</text>
<text x="755.0" y="210" fill="#5a5a72" font-size="9" text-anchor="middle" font-family="monospace">0x7ffc1000</text>
<line x1="284" y1="162" x2="376" y2="162" stroke="#e8965a" stroke-width="2"/>
<path d="M378,162 L366,156 L366,168 Z" fill="#e8965a"/>
<text x="335.0" y="150" fill="#e8965a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">call</text>
<line x1="564" y1="162" x2="656" y2="162" stroke="#67d9a0" stroke-width="2"/>
<path d="M658,162 L646,156 L646,168 Z" fill="#67d9a0"/>
<text x="615.0" y="150" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ret</text>
<text x="40" y="268" fill="#9a9ab4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">call  ≡  push 返回地址 + jmp 目标</text>
<text x="40" y="290" fill="#9a9ab4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ret   ≡  pop 到 rip</text>
<text x="420" y="268" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键：ret 只动 rsp，不清内存。</text>
<text x="420" y="290" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">旧返回地址一直留在原处，直到被下一次调用覆盖。</text>
<text x="40" y="334" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么不把返回地址放在某个专门寄存器里？那样只支持一层调用。递归要同时记住 N 个「该回到哪」，</text>
<text x="40" y="356" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只有会往下长的栈做得到。代价是栈是可写内存——于是有人想改它。这是第 10 节的话题。</text>
<text x="40" y="386" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么不用 push + jmp 两条代替：call 是单条指令，中断不会看到半截状态；处理器还能把返回地址记进 RSB 供 ret 预测。</text>
</svg>
