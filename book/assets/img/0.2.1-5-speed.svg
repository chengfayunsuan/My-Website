<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="440" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">速率涨了五万倍，线从 4 根变成 24 根</text>

  <!-- 坐标 -->
  <g stroke="#232338" stroke-dasharray="3 4">
    <line x1="64" y1="248" x2="736" y2="248"/>
    <line x1="64" y1="196" x2="736" y2="196"/>
    <line x1="64" y1="144" x2="736" y2="144"/>
    <line x1="64" y1="92" x2="736" y2="92"/>
    <line x1="64" y1="40" x2="736" y2="40"/>
  </g>
  <line x1="64" y1="300" x2="736" y2="300" stroke="#4a4a68"/>

  <g fill="#6b6b85" font-size="8.5" text-anchor="end">
    <text x="56" y="304">1 M</text>
    <text x="56" y="252">10 M</text>
    <text x="56" y="200">100 M</text>
    <text x="56" y="148">1 G</text>
    <text x="56" y="96">10 G</text>
    <text x="56" y="44">100 G</text>
  </g>
  <text x="22" y="170" fill="#9a9ab4" font-size="8.5" transform="rotate(-90 22 170)" text-anchor="middle">速率（对数）</text>

  <!-- 柱 -->
  <rect x="70" y="244" width="58" height="56" fill="#1b2740" stroke="#67b5ef"/>
  <text x="99" y="238" fill="#9fd4f5" font-size="8.5" text-anchor="middle">12 M</text>

  <rect x="165" y="161" width="58" height="139" fill="#1b2740" stroke="#67b5ef"/>
  <text x="194" y="155" fill="#9fd4f5" font-size="8.5" text-anchor="middle">480 M</text>

  <rect x="260" y="108" width="58" height="192" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="289" y="102" fill="#cfc6ff" font-size="8.5" text-anchor="middle">5 G</text>

  <rect x="355" y="92" width="58" height="208" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="384" y="86" fill="#cfc6ff" font-size="8.5" text-anchor="middle">10 G</text>

  <rect x="450" y="76" width="58" height="224" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="479" y="70" fill="#cfc6ff" font-size="8.5" text-anchor="middle">20 G</text>

  <rect x="545" y="61" width="58" height="239" fill="#20303a" stroke="#4ec9a3"/>
  <text x="574" y="55" fill="#9fe0c9" font-size="8.5" text-anchor="middle">40 G</text>

  <rect x="640" y="45" width="58" height="255" fill="#20303a" stroke="#4ec9a3"/>
  <text x="669" y="39" fill="#9fe0c9" font-size="8.5" text-anchor="middle">80 G</text>

  <!-- 版本 -->
  <g fill="#d8d8e4" font-size="9.5" text-anchor="middle">
    <text x="99" y="320">USB 1.1</text>
    <text x="194" y="320">USB 2.0</text>
    <text x="289" y="320">3.0</text>
    <text x="384" y="320">3.1</text>
    <text x="479" y="320">3.2</text>
    <text x="574" y="320">USB4</text>
    <text x="669" y="320">USB4 v2</text>
  </g>

  <!-- 线芯 -->
  <g text-anchor="middle" font-size="8.5">
    <text x="99" y="318" fill="#0e0e16">.</text>
  </g>
  <g fill="#9a9ab4" font-size="8.5" text-anchor="middle">
    <text x="99" y="338">4 根线</text>
    <text x="194" y="338">4 根线</text>
    <text x="289" y="338" fill="#e8b84b">9 根线</text>
    <text x="384" y="338" fill="#e8b84b">9 根线</text>
    <text x="479" y="338" fill="#e8b84b">24 针</text>
    <text x="574" y="338" fill="#e8b84b">24 针</text>
    <text x="669" y="338" fill="#e8b84b">24 针</text>
  </g>

  <!-- 分段标注 -->
  <line x1="64" y1="358" x2="230" y2="358" stroke="#67b5ef" stroke-width="1.4"/>
  <text x="147" y="374" fill="#9fd4f5" font-size="9" text-anchor="middle">同一对线，靠提频和编码</text>

  <line x1="240" y1="358" x2="736" y2="358" stroke="#9b4df0" stroke-width="1.4"/>
  <text x="488" y="374" fill="#cfc6ff" font-size="9" text-anchor="middle">加线：两对超速线，改全双工；后期再靠更好的编码</text>

  <!-- 底部 -->
  <line x1="24" y1="392" x2="736" y2="392" stroke="#2a2a44"/>
  <text x="24" y="412" fill="#e8b84b" font-size="9">5 Gbps 实际只跑 500 MB/s：8b/10b 编码吃掉 20%，再扣协议开销。</text>
  <text x="24" y="432" fill="#9a9ab4" font-size="9">3.1 换成 128b/132b，开销从 20% 降到 3%——同样的线，多出 17% 的有效带宽。</text>
</svg>
