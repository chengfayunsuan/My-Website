<svg width="880" height="296" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="296" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">「余额」不是一个数，是三个数</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">手机银行给你看的是第三个。前两个只在对账单和风控系统里出现。</text>
<rect x="56" y="84" width="244" height="132" rx="6" fill="#15151f" stroke="#8a8aa0" stroke-width="1.4"/>
<text x="76" y="112" fill="#8a8aa0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">账面余额</text>
<text x="76" y="154" fill="#c8c8dc" font-size="24" text-anchor="start" font-family="monospace" font-weight="600">5,000.00</text>
<text x="76" y="186" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记在账本上的那个数，最原始的</text>
<rect x="318" y="84" width="244" height="132" rx="6" fill="#15151f" stroke="#e8965a" stroke-width="1.4"/>
<text x="338" y="112" fill="#e8965a" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">冻结金额</text>
<text x="338" y="154" fill="#c8c8dc" font-size="24" text-anchor="start" font-family="monospace" font-weight="600">1,473.00</text>
<text x="338" y="186" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">被占住、暂时不能动的部分</text>
<rect x="580" y="84" width="244" height="132" rx="6" fill="#15151f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="600" y="112" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">可用余额</text>
<text x="600" y="154" fill="#c8c8dc" font-size="24" text-anchor="start" font-family="monospace" font-weight="600">3,527.18</text>
<text x="600" y="186" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">账面 − 冻结，你能花的就是这个</text>
<text x="56" y="250" fill="#a0a0b8" font-size="13" text-anchor="start" font-family="monospace">5,000.00 − 1,473.00 = 3,527.18</text>
</svg>
