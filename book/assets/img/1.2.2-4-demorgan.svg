<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">德摩根定律的两种画法：同一堵墙，两幅面孔</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">气泡推过门体，「与」变「或」，「或」变「与」——电路本身一根线都没动</text>
<line x1="46" y1="128" x2="70" y2="128" stroke="#c8c8dc" stroke-width="2"/>
<line x1="46" y1="152" x2="70" y2="152" stroke="#c8c8dc" stroke-width="2"/>
<path d="M70,110 L98,110 A30,30 0 0 1 98,170 L70,170 Z" fill="#1e1e30" stroke="#e8b84b" stroke-width="2"/>
<circle cx="134" cy="140" r="6" fill="#0e0e16" stroke="#e8b84b" stroke-width="1.8"/>
<line x1="140" y1="140" x2="162" y2="140" stroke="#c8c8dc" stroke-width="2"/>
<text x="96" y="96" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">NAND</text>
<text x="180" y="144" fill="#e8b84b" font-size="17" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¬(A · B)</text>
<text x="180" y="166" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">与门带输出泡</text>
<text x="340" y="148" fill="#c8c8dc" font-size="26" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">≡</text>
<circle cx="404" cy="128" r="5" fill="#0e0e16" stroke="#67b5ef" stroke-width="1.8"/>
<circle cx="404" cy="152" r="5" fill="#0e0e16" stroke="#67b5ef" stroke-width="1.8"/>
<line x1="386" y1="128" x2="399" y2="128" stroke="#c8c8dc" stroke-width="2"/>
<line x1="386" y1="152" x2="399" y2="152" stroke="#c8c8dc" stroke-width="2"/>
<path d="M408,110 Q442,110 462,140 Q442,170 408,170 Q426,140 408,110 Z" fill="#1e1e30" stroke="#67b5ef" stroke-width="2"/>
<line x1="462" y1="140" x2="502" y2="140" stroke="#c8c8dc" stroke-width="2"/>
<text x="434" y="96" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">负输入或门</text>
<text x="520" y="144" fill="#67b5ef" font-size="17" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¬A + ¬B</text>
<text x="520" y="166" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">或门带两个输入泡</text>
<line x1="40" y1="200" x2="720" y2="200" stroke="#26263a" stroke-width="1"/>
<line x1="46" y1="268" x2="68" y2="268" stroke="#c8c8dc" stroke-width="2"/>
<line x1="46" y1="292" x2="68" y2="292" stroke="#c8c8dc" stroke-width="2"/>
<path d="M68,250 Q102,250 122,280 Q102,310 68,310 Q86,280 68,250 Z" fill="#1e1e30" stroke="#e8b84b" stroke-width="2"/>
<circle cx="128" cy="280" r="6" fill="#0e0e16" stroke="#e8b84b" stroke-width="1.8"/>
<line x1="134" y1="280" x2="162" y2="280" stroke="#c8c8dc" stroke-width="2"/>
<text x="94" y="236" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">NOR</text>
<text x="180" y="284" fill="#e8b84b" font-size="17" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¬(A + B)</text>
<text x="180" y="306" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">或门带输出泡</text>
<text x="340" y="288" fill="#c8c8dc" font-size="26" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">≡</text>
<circle cx="404" cy="268" r="5" fill="#0e0e16" stroke="#67b5ef" stroke-width="1.8"/>
<circle cx="404" cy="292" r="5" fill="#0e0e16" stroke="#67b5ef" stroke-width="1.8"/>
<line x1="386" y1="268" x2="399" y2="268" stroke="#c8c8dc" stroke-width="2"/>
<line x1="386" y1="292" x2="399" y2="292" stroke="#c8c8dc" stroke-width="2"/>
<path d="M410,250 L438,250 A30,30 0 0 1 438,310 L410,310 Z" fill="#1e1e30" stroke="#67b5ef" stroke-width="2"/>
<line x1="468" y1="280" x2="502" y2="280" stroke="#c8c8dc" stroke-width="2"/>
<text x="436" y="236" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">负输入与门</text>
<text x="520" y="284" fill="#67b5ef" font-size="17" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¬A · ¬B</text>
<text x="520" y="306" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">与门带两个输入泡</text>
<line x1="24" y1="360" x2="736" y2="360" stroke="#26263a" stroke-width="1"/>
<text x="24" y="388" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">怎么用：读图时先把气泡往自己顺手的一侧推，把「与」和「或」统一，再顺线路读逻辑。</text>
<text x="24" y="412" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">推不动就想这两句：不是「都到齐」=「至少一人缺席」；不是「有一个」=「全都没有」。</text>
<text x="24" y="440" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这两句记牢，一张满是气泡的图，十分钟能读成一句人话。</text>
</svg>
