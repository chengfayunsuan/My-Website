<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.5.4-5  递归的复杂度怎么算：把树按层加起来</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">归并排序 T(n) = 2T(n/2) + n。每层不管切成几块，合并的总代价都是 n</text>
