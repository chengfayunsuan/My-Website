<text x="742" y="116" fill="#e8b84b" font-size="11" text-anchor="start" font-family="monospace">= n</text>
<text x="742" y="190" fill="#e8b84b" font-size="11" text-anchor="start" font-family="monospace">= n</text>
<text x="742" y="264" fill="#e8b84b" font-size="11" text-anchor="start" font-family="monospace">= n</text>
<text x="742" y="338" fill="#e8b84b" font-size="11" text-anchor="start" font-family="monospace">= n</text>
<line x1="730" y1="110" x2="730" y2="334" stroke="#4a4a66" stroke-width="1.2"/>
<text x="742" y="322" fill="#6f6f88" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每层的和</text>
<text x="742" y="338" fill="#6f6f88" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">都一样</text>
<text x="96" y="380" fill="#6f6f88" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">拆到底：n/8 那一层有 8 个节点，每个的代价是 n/8，8 × n/8 = n</text>
<text x="96" y="402" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一共拆了 log₂n 层（100 万条拆 20 次到底），所以总代价 n·log₂n</text>
<text x="34" y="436" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">递归的复杂度不用猜：画一棵树，看它有多少层、每层加起来多大，乘一乘就是答案。</text>
<text x="34" y="458" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">二分查找是这棵树的极端情形 —— 每层只有一半的节点活下来，所以是 O(log n) 而不是 O(n log n)。</text>
</svg>
