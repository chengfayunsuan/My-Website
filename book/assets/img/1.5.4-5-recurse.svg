<text x="135.75" y="338" fill="#a8a8c0" font-size="10.5" text-anchor="middle" font-family="monospace">n/8</text>
<rect x="183.5" y="318" width="63.5" height="30" rx="3" fill="#16161f" stroke="#4a4a66" stroke-width="1.3"/>
