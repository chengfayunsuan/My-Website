<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">8.5.4-2 / 被拒的八个原因</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">横条长度是遇到的比例，颜色区分"你能改"和"你改不了"</text>
<text x="214" y="112" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">地址证明超过三个月</text>
<rect x="232" y="101" width="360.0" height="16" rx="3" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="602.0" y="113" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">22%</text>
<text x="214" y="150" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">证件照反光或被裁切</text>
<rect x="232" y="139" width="294.54545454545456" height="16" rx="3" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="536.5454545454545" y="151" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">18%</text>
<text x="214" y="188" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">姓名顺序、拼写不符</text>
<rect x="232" y="177" width="245.45454545454547" height="16" rx="3" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="487.4545454545455" y="189" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">15%</text>
<text x="214" y="226" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">地址与注册地不一致</text>
<rect x="232" y="215" width="196.36363636363637" height="16" rx="3" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="438.3636363636364" y="227" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">12%</text>
<text x="214" y="264" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">名单同名命中</text>
<rect x="232" y="253" width="163.63636363636363" height="16" rx="3" fill="#e8b84b" stroke="none" stroke-width="1.5"/>
<text x="405.6363636363636" y="265" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">10%</text>
<text x="214" y="302" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">IP 与设备异常</text>
<rect x="232" y="291" width="147.27272727272728" height="16" rx="3" fill="#e8b84b" stroke="none" stroke-width="1.5"/>
<text x="389.27272727272725" y="303" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">9%</text>
<text x="214" y="340" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">业务描述说不清</text>
<rect x="232" y="329" width="130.9090909090909" height="16" rx="3" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="372.9090909090909" y="341" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">8%</text>
<text x="214" y="378" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">网站打不开或空白</text>
<rect x="232" y="367" width="98.18181818181819" height="16" rx="3" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="340.1818181818182" y="379" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">6%</text>
<rect x="24" y="410" width="632" height="1" rx="0" fill="none" stroke="none" stroke-width="1.5"/>
<circle cx="34" cy="424" r="5" fill="#67b5ef"/>
<text x="46" y="428" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你能改：材料本身的问题</text>
<circle cx="214" cy="424" r="5" fill="#e8b84b"/>
<text x="226" y="428" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你改不了：不是你做错了什么</text>
<text x="24" y="454" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">蓝色六项占了八成以上。也就是说，大部分被拒其实是"照片没拍好"这种级别的问题。</text>
</svg>
