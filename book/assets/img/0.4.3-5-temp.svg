<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="400" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">四类芯片，四种「能活多久」</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">工作环境温度范围。手机这一格最窄——它其实是被照顾得最好的一类</text>

  <!-- 轴 -->
  <line x1="110" y1="352" x2="700" y2="352" stroke="#4a4a68"/>
  <g fill="#6b6b85" font-size="7" text-anchor="middle">
    <text x="110" y="368">-60</text>
    <text x="166" y="368">-40</text>
    <text x="279" y="368">0</text>
    <text x="349" y="368">25</text>
    <text x="475" y="368">70</text>
    <text x="574" y="368">105</text>
    <text x="630" y="368">125</text>
    <text x="700" y="368">150</text>
  </g>
  <g stroke="#232338">
    <line x1="166" y1="348" x2="166" y2="356"/>
    <line x1="279" y1="348" x2="279" y2="356"/>
    <line x1="349" y1="348" x2="349" y2="356"/>
    <line x1="475" y1="348" x2="475" y2="356"/>
    <line x1="574" y1="348" x2="574" y2="356"/>
    <line x1="630" y1="348" x2="630" y2="356"/>
  </g>

  <text x="24" y="112" fill="#9a9ab4" font-size="8.5">消费级（手机 / PC）</text>
  <rect x="279" y="96" width="197" height="22" rx="2" fill="#67b5ef" fill-opacity="0.30" stroke="#67b5ef"/>
  <text x="273" y="111" fill="#67b5ef" font-size="7.5" text-anchor="end">0</text>
  <text x="481" y="111" fill="#67b5ef" font-size="7.5">70 °C</text>
  <text x="24" y="128" fill="#6b6b85" font-size="7">结温上限另有 100 °C，那是芯片内部</text>
  <text x="24" y="176" fill="#9a9ab4" font-size="8.5">工业级</text>
  <rect x="166" y="160" width="351" height="22" rx="2" fill="#4ec9a3" fill-opacity="0.30" stroke="#4ec9a3"/>
  <text x="160" y="175" fill="#4ec9a3" font-size="7.5" text-anchor="end">-40</text>
  <text x="523" y="175" fill="#4ec9a3" font-size="7.5">85 °C</text>
  <text x="24" y="192" fill="#6b6b85" font-size="7">工厂、户外设备</text>
  <text x="24" y="240" fill="#9a9ab4" font-size="8.5">车规 AEC-Q100</text>
  <rect x="166" y="224" width="464" height="22" rx="2" fill="#e8b84b" fill-opacity="0.30" stroke="#e8b84b"/>
  <text x="160" y="239" fill="#e8b84b" font-size="7.5" text-anchor="end">-40</text>
  <text x="636" y="239" fill="#e8b84b" font-size="7.5">125 °C</text>
  <text x="24" y="256" fill="#6b6b85" font-size="7">发动机舱另算，可以到 150</text>
  <text x="24" y="304" fill="#9a9ab4" font-size="8.5">军用 / 航天</text>
  <rect x="124" y="288" width="506" height="22" rx="2" fill="#9b4df0" fill-opacity="0.30" stroke="#9b4df0"/>
  <text x="118" y="303" fill="#9b4df0" font-size="7.5" text-anchor="end">-55</text>
  <text x="636" y="303" fill="#9b4df0" font-size="7.5">125 °C</text>
  <text x="24" y="320" fill="#6b6b85" font-size="7">还要叠加辐照、振动</text>

  <line x1="24" y1="378" x2="736" y2="378" stroke="#2a2a44"/>
  <text x="24" y="396" fill="#e8b84b" font-size="9">范围越宽，成本越高：每一档多出来的温度，都要靠材料、封装、测试去保证——所以车规芯片比手机芯片贵十倍。</text>
</svg>