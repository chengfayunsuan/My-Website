<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="450" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">转错账为什么追不回来：银行没有权力动别人的钱</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款受法律保护，银行不能因为你说「我转错了」就去扣对方的账户</text>
<rect x="24" y="66" width="712" height="46" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="48" y="95" fill="#e8b84b" font-size="13" text-anchor="start" font-family="monospace" font-weight="bold">1</text>
<text x="76" y="95" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你转错 5 万</text>
<text x="230" y="95" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">填错一位账号，钱进了陌生人的账户</text>
<rect x="24" y="118" width="712" height="46" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="48" y="147" fill="#e8b84b" font-size="13" text-anchor="start" font-family="monospace" font-weight="bold">2</text>
<text x="76" y="147" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">找自己的银行</text>
<text x="230" y="147" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它只能「帮忙联系对方」，没有权力把钱划回来</text>
<rect x="24" y="170" width="712" height="46" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="48" y="199" fill="#e87a8a" font-size="13" text-anchor="start" font-family="monospace" font-weight="bold">3</text>
<text x="76" y="199" fill="#e87a8a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">联系对方</text>
<text x="230" y="199" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">多数人不接电话，或者明确拒绝——这是关键卡点</text>
<rect x="24" y="222" width="712" height="46" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="48" y="251" fill="#e87a8a" font-size="13" text-anchor="start" font-family="monospace" font-weight="bold">4</text>
<text x="76" y="251" fill="#e87a8a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">报警</text>
<text x="230" y="251" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只有涉嫌诈骗才立案；转错属于民事纠纷</text>
<rect x="24" y="274" width="712" height="46" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="48" y="303" fill="#e87a8a" font-size="13" text-anchor="start" font-family="monospace" font-weight="bold">5</text>
<text x="76" y="303" fill="#e87a8a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">起诉不当得利</text>
<text x="230" y="303" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要起诉得先知道对方是谁，需要申请法院调查令</text>
<rect x="24" y="332" width="712" height="120" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="44" y="358" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">卡点在第三步：只有对方点头，钱才能回来</text>
<text x="44" y="384" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 钱进了对方账户就是他的存款，只有他本人同意或法院判决，才能动</text>
<text x="44" y="406" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 这也是「实时到账」不可撤回的原因——撤销的权力不在银行手上</text>
<text x="44" y="428" fill="#e8965a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 唯一有效的办法：第一次转账先试 1 元，大额打开延时到账</text>
</svg>
