<text x="376" y="220" fill="#e87a8a" font-size="15" text-anchor="start" font-family="monospace">C</text>
<text x="392" y="220" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">进位</text>
<text x="470" y="72" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">四种情况，只有最后一行会进位</text>
