<text x="470" y="232" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">S 列 = 异或真值表　　C 列 = 与门真值表</text>
<text x="24" y="300" fill="#67d9a0" font-size="14" text-anchor="start" font-family="monospace">S = A ⊕ B</text>
<text x="120" y="300" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（异或：两个不同才出 1）</text>
<text x="24" y="326" fill="#e87a8a" font-size="14" text-anchor="start" font-family="monospace">C = A · B</text>
<text x="120" y="326" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（与门：两个都是 1 才出 1）</text>
<text x="24" y="374" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么叫「半」：它只认自己这两个输入，</text>
<text x="24" y="396" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">完全不知道低位可能已经送来一个进位。</text>
<text x="24" y="430" fill="#9a9ab4" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">真实加法里每一位要加的是三个数：A、B、低位进位。</text>
<text x="24" y="452" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">补上第三个输入，就是下一页的全加器。</text>
</svg>
