<svg width="760" height="474" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="474" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">半加器：一只异或管本位，一只与门管进位</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一对输入分两路：异或问「两个一样吗」，与门问「两个都是 1 吗」</text>
