<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">带宽阶梯：每退一层，慢一个数量级</text>

  <text x="20" y="66" fill="#6b6b85" font-size="9">← 慢</text>
  <text x="200" y="66" fill="#d8d8e4" font-size="9.5">带宽（GB/s，对数刻度）</text>
  <text x="596" y="66" fill="#d8d8e4" font-size="9.5">同样 1GB，搬一次要多久</text>

  <!-- 刻度线 -->
  <g stroke="#2a2a44" stroke-width="1">
    <line x1="200" y1="78" x2="200" y2="340"/>
    <line x1="275" y1="78" x2="275" y2="340"/>
    <line x1="350" y1="78" x2="350" y2="340"/>
    <line x1="425" y1="78" x2="425" y2="340"/>
    <line x1="500" y1="78" x2="500" y2="340"/>
  </g>
  <g fill="#6b6b85" font-size="8" text-anchor="middle" font-family="monospace">
    <text x="200" y="354">0.1</text><text x="275" y="354">1</text><text x="350" y="354">10</text>
    <text x="425" y="354">100</text><text x="500" y="354">1000</text>
  </g>

  <!-- 1 显存 -->
  <text x="20" y="104" fill="#cfc6ff" font-size="9.5">显存 GDDR6X</text>
  <text x="20" y="117" fill="#6b6b85" font-size="8">384 位 · 21 Gbps</text>
  <rect x="200" y="92" width="300" height="22" rx="3" fill="#3a2b52" stroke="#9b4df0"/>
  <text x="492" y="107" fill="#cfc6ff" font-size="9.5" text-anchor="end">1008 GB/s</text>
  <rect x="596" y="92" width="140" height="22" rx="4" fill="#1f4a3c" stroke="#4ec9a3"/>
  <text x="666" y="107" fill="#9fe0c9" font-size="10" text-anchor="middle">1 毫秒</text>

  <!-- 2 内存 -->
  <text x="20" y="159" fill="#9fd4f5" font-size="9.5">内存 DDR5-5600</text>
  <text x="20" y="172" fill="#6b6b85" font-size="8">双通道 128 位</text>
  <rect x="200" y="147" width="221" height="22" rx="3" fill="#1f3a4a" stroke="#67b5ef"/>
  <text x="413" y="162" fill="#9fd4f5" font-size="9.5" text-anchor="end">89.6 GB/s</text>
  <rect x="596" y="147" width="140" height="22" rx="4" fill="#171725" stroke="#2a2a44"/>
  <text x="666" y="162" fill="#d8d8e4" font-size="10" text-anchor="middle">11 毫秒</text>

  <!-- 3 PCIe -->
  <text x="20" y="214" fill="#9fe0c9" font-size="9.5">PCIe 4.0 ×16</text>
  <text x="20" y="227" fill="#6b6b85" font-size="8">显卡插槽</text>
  <rect x="200" y="202" width="187" height="22" rx="3" fill="#1f4a3c" stroke="#4ec9a3"/>
  <text x="379" y="217" fill="#9fe0c9" font-size="9.5" text-anchor="end">31.5 GB/s</text>
  <rect x="596" y="202" width="140" height="22" rx="4" fill="#171725" stroke="#2a2a44"/>
  <text x="666" y="217" fill="#d8d8e4" font-size="10" text-anchor="middle">32 毫秒</text>

  <!-- 4 SATA SSD -->
  <text x="20" y="269" fill="#e8b84b" font-size="9.5">SATA 固态</text>
  <text x="20" y="282" fill="#6b6b85" font-size="8">SATA 3.0 · 6 Gbps</text>
  <rect x="200" y="257" width="56" height="22" rx="3" fill="#3a3320" stroke="#e8b84b"/>
  <text x="264" y="272" fill="#e8b84b" font-size="9.5">0.55 GB/s</text>
  <rect x="596" y="257" width="140" height="22" rx="4" fill="#171725" stroke="#2a2a44"/>
  <text x="666" y="272" fill="#d8d8e4" font-size="10" text-anchor="middle">1.8 秒</text>

  <!-- 5 HDD -->
  <text x="20" y="324" fill="#9a9ab4" font-size="9.5">机械硬盘</text>
  <text x="20" y="337" fill="#6b6b85" font-size="8">连续读写</text>
  <rect x="200" y="312" width="13" height="22" rx="2" fill="#2a2a44" stroke="#6b6b85"/>
  <text x="221" y="327" fill="#9a9ab4" font-size="9.5">0.2 GB/s</text>
  <rect x="596" y="312" width="140" height="22" rx="4" fill="#171725" stroke="#2a2a44"/>
  <text x="666" y="327" fill="#d8d8e4" font-size="10" text-anchor="middle">5 秒</text>

  <!-- 关键对比括号 -->
  <path d="M512,103 L528,103 L528,213 L512,213" fill="none" stroke="#f0606a" stroke-width="1.3"/>
  <text x="534" y="163" fill="#f0606a" font-size="9">差 32 倍</text>

  <text x="20" y="386" fill="#cfc6ff" font-size="10.5">所以所有 GPU 程序的第一原则是同一句话：让数据待在显存里，别来回搬。</text>
  <text x="20" y="406" fill="#9a9ab4" font-size="9.5">大模型推理就是活例子：70 亿参数、半精度 14GB，每秒读 30 遍就要 420 GB/s——</text>
  <text x="20" y="424" fill="#9a9ab4" font-size="9.5">参数放主机内存、每步过 PCIe，算得再快也只能等数据。</text>
  <text x="20" y="448" fill="#6b6b85" font-size="8.5">注：条形长度按对数刻度画，否则前两条会把后三条压成一条线。</text>
</svg>
