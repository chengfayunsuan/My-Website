<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.4 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一份个人信用报告，分六块</text>
<rect x="24" y="88" width="266" height="88" rx="8" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="157" y="120" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">基本信息</text>
<text x="157" y="148" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你是谁、住哪、在哪工作</text>
<rect x="306" y="88" width="266" height="88" rx="8" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="439" y="120" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">信息概要</text>
<text x="439" y="148" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">几张卡、几笔贷款、总额度</text>
<rect x="588" y="88" width="266" height="88" rx="8" fill="#16161f" stroke="#e8b84b" stroke-width="1.4"/>
<text x="721" y="120" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">信贷交易明细</text>
<text x="721" y="148" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一笔的还款记录（最重要）</text>
<rect x="24" y="192" width="266" height="88" rx="8" fill="#16161f" stroke="#e8965a" stroke-width="1.4"/>
<text x="157" y="224" fill="#e8965a" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">公共信息</text>
<text x="157" y="252" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欠税、执行、行政处罚</text>
<rect x="306" y="192" width="266" height="88" rx="8" fill="#16161f" stroke="#b58ae8" stroke-width="1.4"/>
<text x="439" y="224" fill="#b58ae8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">异议标注</text>
<text x="439" y="252" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你觉得记错了，可以标注</text>
<rect x="588" y="192" width="266" height="88" rx="8" fill="#16161f" stroke="#8a8aa0" stroke-width="1.4"/>
<text x="721" y="224" fill="#8a8aa0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查询记录</text>
<text x="721" y="252" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">谁在什么时候查过你</text>
<text x="24" y="306" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行审批主要看第二、三块：你现在欠多少、过去还得怎么样。</text>
</svg>
