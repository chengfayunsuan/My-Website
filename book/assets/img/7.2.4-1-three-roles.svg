<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="306" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.4 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行干三件事，一件都不直接对你</text>
<rect x="24" y="92" width="266" height="130" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="157" y="122" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发行的银行</text>
<text x="157" y="156" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">印钞、管现金</text>
<text x="157" y="182" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">决定市面上有多少 M0</text>
<rect x="306" y="92" width="266" height="130" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="439" y="122" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行的银行</text>
<text x="439" y="156" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收准备金、放贷款</text>
<text x="439" y="182" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行缺钱时找它</text>
<rect x="588" y="92" width="266" height="130" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="721" y="122" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">政府的银行</text>
<text x="721" y="156" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管国库、管外储</text>
<text x="721" y="182" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代表国家对外</text>
<text x="24" y="262" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它不给你开户，也不给你发信用卡。它只管两件事：钱的总量、钱的价格。</text>
<text x="24" y="288" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">总量靠准备金率和公开市场操作，价格靠政策利率。</text>
</svg>
