<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="390" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">付款码的 18 位数字：不是账号，是一张「一次性门票」</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它只在 60 秒内有效，用过即废，所以截图发给别人等于把钱给对方</text>
<rect x="30" y="68" width="330" height="270" rx="10" fill="#1a1a26" stroke="#3a3a52" stroke-width="1.5"/>
<text x="52" y="96" fill="#c8c8dc" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">付款码</text>
<text x="340" y="96" fill="#67d9a0" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">‹ 更换 ›</text>
<text x="195" y="142" fill="#ffffff" font-size="17" text-anchor="middle" font-family="monospace">2847 5613 9025 4187 62</text>
<rect x="52" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="57" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="63" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="67" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="72" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="76" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="81" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="87" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="91" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="97" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="101" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="106" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="110" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="114" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="120" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="124" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="129" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="133" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="138" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="142" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="147" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="154" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="161" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="167" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="171" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="175" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="181" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="187" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="192" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="197" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="202" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="207" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="213" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="218" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="224" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="231" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="235" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="241" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="245" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="251" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="257" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="262" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="269" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="273" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="279" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="284" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="288" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="295" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="301" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="306" y="164" width="4" height="56" fill="#e8e8f0"/><rect x="313" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="318" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="324" y="164" width="3" height="56" fill="#e8e8f0"/><rect x="330" y="164" width="2" height="56" fill="#e8e8f0"/><rect x="334" y="164" width="2" height="56" fill="#e8e8f0"/><text x="195" y="242" fill="#6a6a80" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">▦ 二维码区域（略）</text>
<line x1="52" y1="258" x2="338" y2="258" stroke="#3a3a52" stroke-width="1"/>
<text x="52" y="282" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有效期 60 秒</text>
<text x="52" y="304" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">到期自动换成新的一串</text>
<text x="52" y="326" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一串被扫第二次 → 直接拒绝</text>
<rect x="384" y="68" width="346" height="270" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="404" y="96" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">这串数字到底怎么用</text>
<text x="404" y="126" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">① 支付机构生成</text>
<text x="404" y="144" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用一个只有它自己懂的算法，把你的账户映射成一串数字</text>
<text x="404" y="180" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">② 商户扫码上传</text>
<text x="404" y="198" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扫码枪读到的就是一串数字，没有姓名、没有卡号</text>
<text x="404" y="234" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">③ 支付机构反查</text>
<text x="404" y="252" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">库里查这串码对应谁的账户，同时校验是否过期/用过</text>
<text x="404" y="288" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">④ 扣款</text>
<text x="404" y="306" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小额免密，直接从你的余额或绑定卡里扣</text>
<text x="380" y="362" fill="#e8965a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以付款码不能截图、不能发人、不能放在相册里——它跟现金一样，谁拿到谁能花</text>
</svg>
