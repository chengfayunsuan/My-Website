<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.1-2  同一行代码，两种着色方式</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">上面是按语法树着色的结果，下面是「只看这一行」的正则着色。错在字符串里的那两个斜杠</text>
<text x="30" y="86" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">按语法树着色</text>
<text x="128" y="86" fill="#6f6f88" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">先解析，知道哪一段是字符串，字符串里的内容一律不解释</text>
<rect x="30" y="96" width="46" height="30" rx="0" fill="#15151f" stroke="#67b5ef" stroke-width="1"/>
<text x="53.0" y="116" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="monospace">char</text>
<rect x="76" y="96" width="42" height="30" rx="0" fill="#15151f" stroke="#b8b8cc" stroke-width="1"/>
<text x="97.0" y="116" fill="#b8b8cc" font-size="11" text-anchor="middle" font-family="monospace"> *s </text>
<rect x="118" y="96" width="30" height="30" rx="0" fill="#15151f" stroke="#e8965a" stroke-width="1"/>
<text x="133.0" y="116" fill="#e8965a" font-size="11" text-anchor="middle" font-family="monospace">= </text>
<rect x="148" y="96" width="116" height="30" rx="0" fill="#15151f" stroke="#67d9a0" stroke-width="1"/>
<text x="206.0" y="116" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="monospace">"// 不是注释"</text>
<rect x="264" y="96" width="16" height="30" rx="0" fill="#15151f" stroke="#8a8aa2" stroke-width="1"/>
<text x="272.0" y="116" fill="#8a8aa2" font-size="11" text-anchor="middle" font-family="monospace">;</text>
<text x="53.0" y="146" fill="#67b5ef" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键字</text>
<text x="97.0" y="146" fill="#b8b8cc" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">变量</text>
<text x="133.0" y="146" fill="#e8965a" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">赋值</text>
<text x="206.0" y="146" fill="#67d9a0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">字符串</text>
<text x="272.0" y="146" fill="#8a8aa2" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结束</text>
<text x="30" y="176" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果：整段 "// 不是注释" 是绿色，正确</text>
<text x="30" y="214" fill="#e87a8a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">逐行正则着色</text>
<text x="128" y="214" fill="#6f6f88" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不解析，只在每一行里找 // ，找到就把后面涂成注释色</text>
<rect x="30" y="224" width="46" height="30" rx="0" fill="#15151f" stroke="#67b5ef" stroke-width="1"/>
<text x="53.0" y="244" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="monospace">char</text>
<rect x="76" y="224" width="42" height="30" rx="0" fill="#15151f" stroke="#b8b8cc" stroke-width="1"/>
<text x="97.0" y="244" fill="#b8b8cc" font-size="11" text-anchor="middle" font-family="monospace"> *s </text>
<rect x="118" y="224" width="30" height="30" rx="0" fill="#15151f" stroke="#e8965a" stroke-width="1"/>
<text x="133.0" y="244" fill="#e8965a" font-size="11" text-anchor="middle" font-family="monospace">= </text>
<rect x="148" y="224" width="12" height="30" rx="0" fill="#15151f" stroke="#67d9a0" stroke-width="1"/>
<text x="154.0" y="244" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="monospace">"</text>
<rect x="160" y="224" width="104" height="30" rx="0" fill="#15151f" stroke="#8a6a3a" stroke-width="1"/>
<text x="212.0" y="244" fill="#8a6a3a" font-size="11" text-anchor="middle" font-family="monospace">// 不是注释</text>
<rect x="264" y="224" width="12" height="30" rx="0" fill="#15151f" stroke="#67d9a0" stroke-width="1"/>
<text x="270.0" y="244" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="monospace">"</text>
<rect x="276" y="224" width="16" height="30" rx="0" fill="#15151f" stroke="#8a8aa2" stroke-width="1"/>
<text x="284.0" y="244" fill="#8a8aa2" font-size="11" text-anchor="middle" font-family="monospace">;</text>
<rect x="156" y="220" width="128" height="38" rx="2" fill="none" stroke="#e87a8a" stroke-width="1.6"/>
<text x="156" y="214" fill="#e87a8a" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 被当成注释</text>
<text x="30" y="290" fill="#e87a8a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果：字符串的后半截变成注释色，后面的代码也常常跟着一起错</text>
<line x1="430" y1="90" x2="430" y2="330" stroke="#2a2a3e" stroke-width="1" stroke-dasharray="4 4"/>
<text x="456" y="104" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">为什么正则一定会错</text>
<text x="456" y="128" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">因为正则的工作单位是「一行」，它没有跨行的状态记忆。</text>
<text x="456" y="148" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">看到 " 它不知道这引号是开还是闭，看到 // 它分不清</text>
<text x="456" y="168" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">是在字符串里还是在注释里 —— 这两件事都需要「上文」。</text>
<text x="456" y="202" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">那为什么大多数编辑器还是用正则</text>
<text x="456" y="226" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">因为快，而且够用。VS Code 用的 TextMate 语法就是一套</text>
<text x="456" y="246" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">正则规则，打开一个 50 MB 的日志文件也能瞬间上色；</text>
<text x="456" y="266" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换成完整解析，光解析就要几十秒。</text>
<text x="456" y="286" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价就是你偶尔会看到这种地方颜色错了。</text>
<text x="30" y="356" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">折中办法是分层：先用正则铺底色（保证任何文件都能秒开），</text>
<text x="30" y="378" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">再把屏幕上可见的那几十行交给真正的解析器重算一遍（保证看得见的地方是对的）。</text>
<text x="30" y="402" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你在编辑器里看到的「越滚动颜色越准」，就是这么来的。</text>
</svg>
