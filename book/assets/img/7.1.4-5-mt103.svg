<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.4-5  一条 MT103 报文里有什么</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全是文本字段。它描述一笔付款，本身不是钱，也不能当钱用</text>
<rect x="56" y="90" width="768" height="300" rx="5" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<text x="80" y="120" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="monospace">MT103  Single Customer Credit Transfer</text>
<line x1="80" y1="132" x2="800" y2="132" stroke="#2a2a40" stroke-width="1"/>
<text x="80" y="162" fill="#67b5ef" font-size="9.2" text-anchor="start" font-family="monospace">:20:</text>
<text x="150" y="162" fill="#7f7f98" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">交易参考号</text>
<text x="420" y="162" fill="#b8bccd" font-size="9" text-anchor="start" font-family="monospace">20241108ABC123</text>
<text x="80" y="192" fill="#e8b84b" font-size="9.2" text-anchor="start" font-family="monospace">:32A:</text>
<text x="150" y="192" fill="#7f7f98" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">起息日 / 币种 / 金额</text>
<text x="420" y="192" fill="#b8bccd" font-size="9" text-anchor="start" font-family="monospace">241108USD1000000,00</text>
<text x="80" y="222" fill="#67d9a0" font-size="9.2" text-anchor="start" font-family="monospace">:50K:</text>
<text x="150" y="222" fill="#7f7f98" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">汇款人</text>
<text x="420" y="222" fill="#b8bccd" font-size="9" text-anchor="start" font-family="monospace">CHINA NATIONAL MACHINERY</text>
<text x="80" y="252" fill="#b58ae8" font-size="9.2" text-anchor="start" font-family="monospace">:57A:</text>
<text x="150" y="252" fill="#7f7f98" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收款行（SWIFT 代码）</text>
<text x="420" y="252" fill="#b8bccd" font-size="9" text-anchor="start" font-family="monospace">CITIUS33XXX</text>
<text x="80" y="282" fill="#e8965a" font-size="9.2" text-anchor="start" font-family="monospace">:59:</text>
<text x="150" y="282" fill="#7f7f98" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收款人</text>
<text x="420" y="282" fill="#b8bccd" font-size="9" text-anchor="start" font-family="monospace">ACME CORP / ACCT 12345678</text>
<text x="80" y="312" fill="#67b5ef" font-size="9.2" text-anchor="start" font-family="monospace">:70:</text>
<text x="150" y="312" fill="#7f7f98" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">汇款用途</text>
<text x="420" y="312" fill="#b8bccd" font-size="9" text-anchor="start" font-family="monospace">INVOICE 2024-001</text>
<text x="80" y="342" fill="#e87a8a" font-size="9.2" text-anchor="start" font-family="monospace">:71A:</text>
<text x="150" y="342" fill="#7f7f98" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费用承担方式</text>
<text x="420" y="342" fill="#b8bccd" font-size="9" text-anchor="start" font-family="monospace">SHA（各付各的）</text>
<text x="40" y="416" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">真正跨境时，报文可能经手三四个中间行，每层都会加自己的费用代码。所以同一笔钱，走不同路径到账金额会不一样。</text>
</svg>
