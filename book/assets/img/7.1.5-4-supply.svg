<text x="816" y="88" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2100 万</text>
<line x1="180" y1="250" x2="180" y2="240" stroke="#4a4a62" stroke-width="1.2"/>
<text x="180" y="270" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2012</text>
<line x1="290" y1="250" x2="290" y2="240" stroke="#4a4a62" stroke-width="1.2"/>
<text x="290" y="270" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2016</text>
<line x1="400" y1="250" x2="400" y2="240" stroke="#4a4a62" stroke-width="1.2"/>
<text x="400" y="270" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2020</text>
<line x1="510" y1="250" x2="510" y2="240" stroke="#4a4a62" stroke-width="1.2"/>
<text x="510" y="270" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2024</text>
<text x="70" y="270" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2009</text>
<text x="24" y="76" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存量</text>
<text x="430" y="200" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每四年「减半」一次：新币产出速度砍一半</text>
<text x="430" y="224" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">越接近上限，新增越少，这就是它说的「稀缺」</text>
