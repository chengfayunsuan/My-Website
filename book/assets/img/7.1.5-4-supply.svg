<svg xmlns="http://www.w3.org/2000/svg" width="880" height="312" viewBox="0 0 880 312" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="312" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.5 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">总量 2100 万：每四年新产出的数量减半，越往后越少</text>
<line x1="70" y1="250" x2="820" y2="250" stroke="#4a4a62" stroke-width="1.4"/>
