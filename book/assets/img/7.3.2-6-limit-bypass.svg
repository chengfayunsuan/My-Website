<svg width="880" height="314" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 314" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="314" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">限额管的是「系统里的一次动作」</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个人、同样的 3 万块，走两条路：一条被挡住，一条根本没人看。</text>
<text x="40" y="84" fill="#e8965a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">路线一：留在系统里</text>
<rect x="40" y="100" width="170" height="60" rx="5" fill="#2a2118" stroke="#e8965a" stroke-width="1.2"/>
<text x="54" y="125" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的 II 类户</text>
<text x="54" y="145" fill="#e8965a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">余额 3 万，够</text>
<line x1="214" y1="130" x2="238" y2="130" stroke="#e8965a" stroke-width="1.8"/>
<path d="M246,130 L236,125 L236,135 Z" fill="#e8965a" stroke="#e8965a" stroke-width="1"/>
<rect x="250" y="100" width="170" height="60" rx="5" fill="#2a2118" stroke="#e8965a" stroke-width="1.2"/>
<text x="264" y="125" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">转账 3 万给房东</text>
<text x="264" y="145" fill="#e8965a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个系统内动作</text>
<line x1="424" y1="130" x2="448" y2="130" stroke="#e8965a" stroke-width="1.8"/>
<path d="M456,130 L446,125 L446,135 Z" fill="#e8965a" stroke="#e8965a" stroke-width="1"/>
<rect x="460" y="100" width="170" height="60" rx="5" fill="#2a2118" stroke="#e8965a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="474" y="125" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">限额检查</text>
<text x="474" y="145" fill="#e8965a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">日累计 1 万</text>
<line x1="634" y1="130" x2="658" y2="130" stroke="#e87a8a" stroke-width="1.8" stroke-dasharray="3 4"/>
<path d="M666,130 L656,125 L656,135 Z" fill="#e87a8a" stroke="#e87a8a" stroke-width="1"/>
<text x="690" y="132" fill="#e87a8a" font-size="20" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">✕</text>
<text x="716" y="131" fill="#e87a8a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">过不去</text>
<text x="690" y="154" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">剩下 2 万今天走不了</text>
<text x="40" y="216" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">路线二：变成现金，出了系统</text>
<rect x="40" y="232" width="170" height="60" rx="5" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="54" y="257" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的 I 类户</text>
<text x="54" y="277" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有限额</text>
<line x1="214" y1="262" x2="238" y2="262" stroke="#67d9a0" stroke-width="1.8"/>
<path d="M246,262 L236,257 L236,267 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<rect x="250" y="232" width="170" height="60" rx="5" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="264" y="257" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">取现 3 万</text>
<text x="264" y="277" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">柜台或 ATM</text>
<line x1="424" y1="262" x2="448" y2="262" stroke="#67d9a0" stroke-width="1.8"/>
<path d="M456,262 L446,257 L446,267 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<rect x="460" y="232" width="170" height="60" rx="5" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="474" y="257" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">现金</text>
<text x="474" y="277" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一沓纸，脱链了</text>
<line x1="634" y1="262" x2="658" y2="262" stroke="#67d9a0" stroke-width="1.8"/>
<path d="M666,262 L656,257 L656,267 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<text x="690" y="264" fill="#67d9a0" font-size="18" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">✓</text>
<text x="716" y="263" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没人拦</text>
<text x="690" y="286" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存进对方卡就走完了</text>
</svg>
