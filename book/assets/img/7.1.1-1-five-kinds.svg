<svg xmlns="http://www.w3.org/2000/svg" width="880" height="316" viewBox="0 0 880 316" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="316" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.1 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个手机屏幕，五个数字，五种完全不同的身份</text>
<rect x="22" y="92" width="152" height="124" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="98" y="116" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">现金</text>
<text x="98" y="160" fill="#e8e8f2" font-size="19" text-anchor="middle" font-family="monospace">200</text>
<text x="98" y="194" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行欠你</text>
<rect x="192" y="92" width="152" height="124" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="268" y="116" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">活期存款</text>
<text x="268" y="160" fill="#e8e8f2" font-size="19" text-anchor="middle" font-family="monospace">12,000</text>
<text x="268" y="194" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行欠你</text>
<rect x="362" y="92" width="152" height="124" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="438" y="116" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">支付余额</text>
<text x="438" y="160" fill="#e8e8f2" font-size="19" text-anchor="middle" font-family="monospace">328.50</text>
<text x="438" y="194" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">支付机构欠你</text>
<rect x="532" y="92" width="152" height="124" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="608" y="116" fill="#b58ae8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">货币基金</text>
<text x="608" y="160" fill="#e8e8f2" font-size="19" text-anchor="middle" font-family="monospace">50,000</text>
<text x="608" y="194" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">基金公司管着</text>
<rect x="702" y="92" width="152" height="124" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="778" y="116" fill="#e87a8a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">信用额度</text>
<text x="778" y="160" fill="#e8e8f2" font-size="19" text-anchor="middle" font-family="monospace">30,000</text>
<text x="778" y="194" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行答应借你</text>
<text x="22" y="258" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前四种是你已经拥有的钱，第五种是银行答应借你、你还没借的上限。</text>
<text x="22" y="286" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前三种能直接付出去，第四种要先赎回，第五种只能刷、刷完得还。</text>
</svg>
