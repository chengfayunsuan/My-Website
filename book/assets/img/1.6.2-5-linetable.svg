<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="450" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.2-5  你点的是「第 42 行」，机器里没有「行」这个东西</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中间靠一张表翻译：DWARF 的行号表，把源码行映射到指令地址。优化会把这层映射搅乱</text>
<text x="30" y="84" fill="#8a8aa2" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">源码（你看到的）</text>
<rect x="30" y="100" width="262" height="26" rx="2" fill="#15151f" stroke="#2a2a3e" stroke-width="1"/>
<text x="52" y="118" fill="#5f5f78" font-size="9.5" text-anchor="end" font-family="monospace">41</text>
<text x="66" y="118" fill="#a8a8c0" font-size="9.5" text-anchor="start" font-family="monospace">  int total = 0;</text>
<rect x="30" y="130" width="262" height="26" rx="2" fill="#2a2410" stroke="#2a2a3e" stroke-width="1"/>
<text x="52" y="148" fill="#5f5f78" font-size="9.5" text-anchor="end" font-family="monospace">42</text>
<text x="66" y="148" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="monospace">  for (int i = 0; i &lt; n; i++) {</text>
<rect x="30" y="160" width="262" height="26" rx="2" fill="#15151f" stroke="#2a2a3e" stroke-width="1"/>
<text x="52" y="178" fill="#5f5f78" font-size="9.5" text-anchor="end" font-family="monospace">43</text>
<text x="66" y="178" fill="#a8a8c0" font-size="9.5" text-anchor="start" font-family="monospace">    total += a[i];</text>
<rect x="30" y="190" width="262" height="26" rx="2" fill="#15151f" stroke="#2a2a3e" stroke-width="1"/>
<text x="52" y="208" fill="#5f5f78" font-size="9.5" text-anchor="end" font-family="monospace">44</text>
<text x="66" y="208" fill="#a8a8c0" font-size="9.5" text-anchor="start" font-family="monospace">  }</text>
<circle cx="40" cy="143" r="4" fill="#e8b84b"/>
<text x="30" y="230" fill="#e8b84b" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 你在这里点了一下</text>
<text x="330" y="84" fill="#8a8aa2" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">行号表（调试信息里的）</text>
<rect x="330" y="96" width="250" height="176" rx="3" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="348" y="122" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="monospace">第 41 行</text>
<text x="470" y="122" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="monospace">0x401130</text>
<text x="348" y="154" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="monospace">第 42 行</text>
<text x="470" y="154" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="monospace">0x40113a</text>
<text x="348" y="186" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="monospace">第 42 行</text>
<text x="470" y="186" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="monospace">0x401145</text>
<text x="348" y="218" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="monospace">第 43 行</text>
<text x="470" y="218" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="monospace">0x401150</text>
<text x="348" y="250" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="monospace">第 44 行</text>
<text x="470" y="250" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="monospace">0x401158</text>
<text x="330" y="292" fill="#6f6f88" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 42 行对应两个地址：循环头和循环尾各算一次</text>
<text x="608" y="92" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">为什么会有两个地址</text>
<text x="608" y="114" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">因为第 42 行是循环头。编译之后，</text>
<text x="608" y="130" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">「第一次进来」和「每轮跳回来」</text>
<text x="608" y="146" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">是两个不同的地址。断点只下在第一个，</text>
<text x="608" y="162" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以断点只在第一次命中——</text>
<text x="608" y="178" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">想每轮都停，得用条件断点。</text>
<text x="608" y="212" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">优化之后更乱</text>
<text x="608" y="234" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">编译器会把循环展开、把几行合并、</text>
<text x="608" y="250" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把变量放进寄存器。行号表跟着重排，</text>
<text x="608" y="266" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">于是你在第 43 行下的断点，</text>
<text x="608" y="282" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可能跳到第 41 行去停。</text>
<path d="M292,143 L318,143 L318,168 L330,168" fill="none" stroke="#5a5a76" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="30" y="340" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「断点乱跳」不是调试器坏了，是它守着一张和你的直觉不匹配的表。</text>
<text x="30" y="362" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关掉优化（-O0）之后这张表就一一对应了，这也是为什么调试版本一定要关优化。</text>
<text x="30" y="392" fill="#7a7a92" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意：-O0 不是「更正确」，只是「更好对」——它把编译器的聪明关掉了，程序的行为可能和发布版不同。</text>
</svg>
