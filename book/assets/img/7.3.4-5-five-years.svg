<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="270" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.4 fig5 · 五年从哪天起算</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是从逾期那天算，是从还清那天算</text>
<line x1="60" y1="150" x2="820" y2="150" stroke="#c8c8dc" stroke-width="2"/>
<path d="M820,144 L832,150 L820,156 Z" fill="#c8c8dc" stroke="#8a8aa0" stroke-width="2"/>
<circle cx="140" cy="150" r="6" fill="#e87a8a"/>
<text x="140" y="128" fill="#e87a8a" font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold">2024-03</text>
<text x="140" y="186" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">逾期发生</text>
<circle cx="400" cy="150" r="7" fill="#e8b84b"/>
<text x="400" y="128" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold">2024-06</text>
<text x="400" y="186" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还清全部欠款</text>
<text x="400" y="208" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">不良行为终止——五年从这天起算</text>
<circle cx="700" cy="150" r="6" fill="#67d9a0"/>
<text x="700" y="128" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold">2029-06</text>
<text x="700" y="186" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记录从报告里删除</text>
<line x1="400" y1="172" x2="700" y2="172" stroke="#e8b84b" stroke-width="1.5"/>
<text x="550" y="164" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5 年</text>
<text x="24" y="238" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">拖着不还，污点不过期：5 年的钟从「还清」那一刻才开始走。</text>
</svg>
