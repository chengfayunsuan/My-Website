<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'PingFang SC','Microsoft YaHei',monospace">
  <rect width="640" height="400" fill="#0e0e16"/>

  <text x="20" y="26" fill="#9a9ab4" font-size="12.5">一个 24 位的颜色值，用移位 + 掩码拆成三个分量</text>
  <text x="20" y="46" fill="#6b6b85" font-size="11">记忆办法：想取哪一段，就先把它挪到最右边，再用 FF 盖住其余位</text>

  <!-- 24 位位串 -->
  <text x="20" y="82" fill="#6b6b85" font-size="10.5">0x3A7BD5</text>

  <!-- 红 8 位 -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="96" y="66" width="20" height="24" rx="2" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.7"/><text x="106" y="82" fill="#f7a3a8">0</text>
    <rect x="118" y="66" width="20" height="24" rx="2" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.7"/><text x="128" y="82" fill="#f7a3a8">0</text>
    <rect x="140" y="66" width="20" height="24" rx="2" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.7"/><text x="150" y="82" fill="#f7a3a8">1</text>
    <rect x="162" y="66" width="20" height="24" rx="2" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.7"/><text x="172" y="82" fill="#f7a3a8">1</text>
    <rect x="184" y="66" width="20" height="24" rx="2" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.7"/><text x="194" y="82" fill="#f7a3a8">1</text>
    <rect x="206" y="66" width="20" height="24" rx="2" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.7"/><text x="216" y="82" fill="#f7a3a8">0</text>
    <rect x="228" y="66" width="20" height="24" rx="2" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.7"/><text x="238" y="82" fill="#f7a3a8">1</text>
    <rect x="250" y="66" width="20" height="24" rx="2" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.7"/><text x="260" y="82" fill="#f7a3a8">0</text>

    <!-- 绿 -->
    <rect x="280" y="66" width="20" height="24" rx="2" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="290" y="82" fill="#7fe0c2">0</text>
    <rect x="302" y="66" width="20" height="24" rx="2" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="312" y="82" fill="#7fe0c2">1</text>
    <rect x="324" y="66" width="20" height="24" rx="2" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="334" y="82" fill="#7fe0c2">1</text>
    <rect x="346" y="66" width="20" height="24" rx="2" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="356" y="82" fill="#7fe0c2">1</text>
    <rect x="368" y="66" width="20" height="24" rx="2" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="378" y="82" fill="#7fe0c2">1</text>
    <rect x="390" y="66" width="20" height="24" rx="2" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="400" y="82" fill="#7fe0c2">0</text>
    <rect x="412" y="66" width="20" height="24" rx="2" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="422" y="82" fill="#7fe0c2">1</text>
    <rect x="434" y="66" width="20" height="24" rx="2" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/><text x="444" y="82" fill="#7fe0c2">1</text>

    <!-- 蓝 -->
    <rect x="464" y="66" width="20" height="24" rx="2" fill="#182231" stroke="#67b5ef" stroke-opacity="0.7"/><text x="474" y="82" fill="#a8d8f7">1</text>
    <rect x="486" y="66" width="20" height="24" rx="2" fill="#182231" stroke="#67b5ef" stroke-opacity="0.7"/><text x="496" y="82" fill="#a8d8f7">1</text>
    <rect x="508" y="66" width="20" height="24" rx="2" fill="#182231" stroke="#67b5ef" stroke-opacity="0.7"/><text x="518" y="82" fill="#a8d8f7">0</text>
    <rect x="530" y="66" width="20" height="24" rx="2" fill="#182231" stroke="#67b5ef" stroke-opacity="0.7"/><text x="540" y="82" fill="#a8d8f7">1</text>
    <rect x="552" y="66" width="20" height="24" rx="2" fill="#182231" stroke="#67b5ef" stroke-opacity="0.7"/><text x="562" y="82" fill="#a8d8f7">0</text>
    <rect x="574" y="66" width="20" height="24" rx="2" fill="#182231" stroke="#67b5ef" stroke-opacity="0.7"/><text x="584" y="82" fill="#a8d8f7">1</text>
  </g>

  <text x="175" y="58" fill="#f0606a" font-size="10.5" text-anchor="middle">红 3A</text>
  <text x="367" y="58" fill="#4ec9a3" font-size="10.5" text-anchor="middle">绿 7B</text>
  <text x="529" y="58" fill="#67b5ef" font-size="10.5" text-anchor="middle">蓝 D5</text>

  <!-- 分隔线 -->
  <line x1="20" y1="112" x2="616" y2="112" stroke="#2a2a44"/>

  <!-- 第 1 行：红 -->
  <text x="20" y="146" fill="#f0606a" font-size="12" font-weight="700">红色</text>
  <text x="20" y="164" fill="#9a9ab4" font-size="11">(c &gt;&gt; 16) &amp; 0xFF</text>
  <rect x="150" y="132" width="240" height="34" rx="6" fill="#171725" stroke="#f0606a" stroke-opacity="0.4"/>
  <text x="162" y="154" fill="#d8d8e4" font-size="11">右移 16 位 → 红跑到最低位</text>
  <text x="404" y="154" fill="#6b6b85" font-size="10.5">再与 FF → 只留低 8 位</text>
  <rect x="556" y="132" width="34" height="34" rx="4" fill="#3A0000" stroke="#f0606a" stroke-opacity="0.6"/>
  <text x="596" y="154" fill="#f7a3a8" font-size="12" font-weight="700">58</text>

  <!-- 第 2 行：绿 -->
  <text x="20" y="212" fill="#4ec9a3" font-size="12" font-weight="700">绿色</text>
  <text x="20" y="230" fill="#9a9ab4" font-size="11">(c &gt;&gt; 8) &amp; 0xFF</text>
  <rect x="150" y="198" width="240" height="34" rx="6" fill="#171725" stroke="#4ec9a3" stroke-opacity="0.4"/>
  <text x="162" y="220" fill="#d8d8e4" font-size="11">右移 8 位 → 绿跑到最低位</text>
  <text x="404" y="220" fill="#6b6b85" font-size="10.5">再与 FF → 只留低 8 位</text>
  <rect x="556" y="198" width="34" height="34" rx="4" fill="#007B00" stroke="#4ec9a3" stroke-opacity="0.6"/>
  <text x="596" y="220" fill="#7fe0c2" font-size="12" font-weight="700">123</text>

  <!-- 第 3 行：蓝 -->
  <text x="20" y="278" fill="#67b5ef" font-size="12" font-weight="700">蓝色</text>
  <text x="20" y="296" fill="#9a9ab4" font-size="11">c &amp; 0xFF</text>
  <rect x="150" y="264" width="240" height="34" rx="6" fill="#171725" stroke="#67b5ef" stroke-opacity="0.4"/>
  <text x="162" y="286" fill="#d8d8e4" font-size="11">已经在最低位，不用移</text>
  <text x="404" y="286" fill="#6b6b85" font-size="10.5">直接与 FF 取低 8 位</text>
  <rect x="556" y="264" width="34" height="34" rx="4" fill="#0000D5" stroke="#67b5ef" stroke-opacity="0.6"/>
  <text x="596" y="286" fill="#a8d8f7" font-size="12" font-weight="700">213</text>

  <!-- 合成 -->
  <line x1="20" y1="316" x2="616" y2="316" stroke="#2a2a44"/>
  <text x="20" y="344" fill="#9a9ab4" font-size="11.5">反过来把三个分量拼回去：</text>
  <text x="20" y="368" fill="#9a9ab4" font-size="11.5">(r &lt;&lt; 16) | (g &lt;&lt; 8) | b  =  0x3A7BD5</text>
  <rect x="330" y="332" width="120" height="40" rx="6" fill="#3A7BD5" stroke="#2a2a44"/>
  <text x="460" y="358" fill="#6b6b85" font-size="10.5">← 就是你看到的那个蓝色</text>
</svg>
