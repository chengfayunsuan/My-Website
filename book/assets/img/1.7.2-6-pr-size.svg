<text x="162.15310612873094" y="142.88" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小 PR</text>
<text x="162.15310612873094" y="158.88" fill="#5f8a72" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">逐行看，能挑出设计问题</text>
<text x="646.7096051892602" y="318.76" fill="#8a6a5a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大 PR</text>
<text x="646.7096051892602" y="334.76" fill="#7a6a62" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只能看到「大概没问题」</text>
<text x="30" y="388" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一份代码，拆成十个 40 行的 PR，每个都会被认真读；合成一个 400 行的，reviewer 划到底就点了通过。</text>
<text x="30" y="410" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「写小 PR」不是为了管流程，是为了让 review 这件事真的发生。</text>
<text x="30" y="432" fill="#7a7a92" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">经验值：一个 PR 控制在 200 到 400 行以内（含测试）。超过就得拆 —— 拆不动，往往说明这次改动本身耦合太重。</text>
</svg>
