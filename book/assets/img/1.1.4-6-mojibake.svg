<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="424" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">乱码诊断：先看它长什么样，再决定救不救</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">四种典型长相，对应四种完全不同的成因——只有前一种和最后一种还能救</text>

  <rect x="280" y="64" width="200" height="40" rx="6" fill="#1b2740" stroke="#67b5ef"/>
  <text x="380" y="89" fill="#9fd4f5" font-size="10" text-anchor="middle">屏幕上的那串乱码</text>

  <line x1="380" y1="104" x2="380" y2="120" stroke="#3a4a66" stroke-width="1.2"/>
  <line x1="108" y1="120" x2="636" y2="120" stroke="#3a4a66" stroke-width="1.2"/>
  <line x1="108" y1="120" x2="108" y2="136" stroke="#3a4a66" stroke-width="1.2"/>
  <line x1="284" y1="120" x2="284" y2="136" stroke="#3a4a66" stroke-width="1.2"/>
  <line x1="460" y1="120" x2="460" y2="136" stroke="#3a4a66" stroke-width="1.2"/>
  <line x1="636" y1="120" x2="636" y2="136" stroke="#3a4a66" stroke-width="1.2"/>

  <!-- 列 1 -->
  <rect x="24" y="136" width="168" height="184" rx="6" fill="#171725" stroke="#4ec9a3"/>
  <text x="108" y="160" fill="#9fe0c9" font-size="9.5" text-anchor="middle">出现 Ã Â 这类符号</text>
  <text x="40" y="184" fill="#8a8aa0" font-size="8">本来是 UTF-8 的多字节序列，</text>
  <text x="40" y="199" fill="#8a8aa0" font-size="8">被当成 Latin-1 一个字节一个</text>
  <text x="40" y="214" fill="#8a8aa0" font-size="8">字符地读了出来。</text>
  <text x="40" y="238" fill="#6b6b85" font-size="8">例：é 变成 Ã©，一个字节变两个</text>
  <rect x="40" y="250" width="52" height="20" rx="3" fill="#20303a"/>
  <text x="66" y="264" fill="#9fe0c9" font-size="8.5" text-anchor="middle">能救</text>
  <text x="40" y="290" fill="#6f8a80" font-size="7.5">按 Latin-1 编回去，再按 UTF-8 解</text>

  <!-- 列 2 -->
  <rect x="200" y="136" width="168" height="184" rx="6" fill="#171725" stroke="#ef6b6b"/>
  <text x="284" y="160" fill="#f0a0a8" font-size="9.5" text-anchor="middle">锟斤拷 · 烫烫烫 · 一片 ��</text>
  <text x="216" y="184" fill="#8a8aa0" font-size="8">这些是「替换字符」被别的编码</text>
  <text x="216" y="199" fill="#8a8aa0" font-size="8">重新解读后的产物，原始字节在</text>
  <text x="216" y="214" fill="#8a8aa0" font-size="8">更早的一步就已经被丢弃了。</text>
  <text x="216" y="238" fill="#6b6b85" font-size="8">它已经不是文字，是一块补丁。</text>
  <rect x="216" y="250" width="60" height="20" rx="3" fill="#3a2226"/>
  <text x="246" y="264" fill="#f0a0a8" font-size="8.5" text-anchor="middle">救不回</text>
  <text x="216" y="290" fill="#a06060" font-size="7.5">原始字节在更早一步就丢了</text>

  <!-- 列 3 -->
  <rect x="376" y="136" width="168" height="184" rx="6" fill="#171725" stroke="#ef6b6b"/>
  <text x="460" y="160" fill="#f0a0a8" font-size="9.5" text-anchor="middle">满屏的问号 ?????</text>
  <text x="392" y="184" fill="#8a8aa0" font-size="8">转码时目标编码表示不了这些</text>
  <text x="392" y="199" fill="#8a8aa0" font-size="8">字，被统一换成了 0x3F，也就</text>
  <text x="392" y="214" fill="#8a8aa0" font-size="8">是问号本身。</text>
  <text x="392" y="238" fill="#6b6b85" font-size="8">问号是真的问号，不是显示问题。</text>
  <rect x="392" y="250" width="60" height="20" rx="3" fill="#3a2226"/>
  <text x="422" y="264" fill="#f0a0a8" font-size="8.5" text-anchor="middle">救不回</text>
  <text x="392" y="290" fill="#a06060" font-size="7.5">信息被彻底抹掉，无法还原</text>

  <!-- 列 4 -->
  <rect x="552" y="136" width="168" height="184" rx="6" fill="#171725" stroke="#e8b84b"/>
  <text x="636" y="160" fill="#e8c47a" font-size="9.5" text-anchor="middle">前面都好，最后几个字坏</text>
  <text x="568" y="184" fill="#8a8aa0" font-size="8">多字节字符被从中间切断了，</text>
  <text x="568" y="199" fill="#8a8aa0" font-size="8">剩下的半个序列解不出来，就</text>
  <text x="568" y="214" fill="#8a8aa0" font-size="8">变成一两个怪符号。</text>
  <text x="568" y="238" fill="#6b6b85" font-size="8">常见于按字节截断的旧代码。</text>
  <rect x="568" y="250" width="52" height="20" rx="3" fill="#3a2f24"/>
  <text x="594" y="264" fill="#e8c47a" font-size="8.5" text-anchor="middle">能救</text>
  <text x="568" y="290" fill="#a89070" font-size="7.5">把截断处缺的字节补回来</text>

  <line x1="30" y1="340" x2="730" y2="340" stroke="#2a2a3c"/>
  <text x="30" y="360" fill="#d8d8e4" font-size="9">判断口诀：有「Ã」就还有救，有「锟斤拷」就没救了，有问号就一个都没了。</text>
  <text x="30" y="380" fill="#9a9ab4" font-size="8.5">这三种长相的区别，本质上是「在哪一步丢的信息」：编码错位只是读错，替换字符是改写，问号是彻底抹掉。</text>
  <text x="30" y="398" fill="#6b6b85" font-size="8.5">所以修乱码的第一件事不是猜编码，而是判断「原始字节还在不在」。在，就有得救；不在，只能重来。</text>
</svg>
