<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="560" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.3.1-3  七种寻址方式：操作数到底从哪来</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左边是「地址怎么算出来」，右边是「算出来之后去哪里拿」</text>
<rect x="24" y="90" width="424" height="100" rx="4" fill="#14141e" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="38" y="112" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">立即数</text>
<text x="82" y="112" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">常数、掩码</text>
<text x="38" y="130" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="monospace">mov eax, 42</text>
<rect x="38" y="142" width="158" height="32" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.1"/>
<text x="117" y="163" fill="#c8c8dc" font-size="9.2" text-anchor="middle" font-family="monospace">指令里的 42</text>
<line x1="200" y1="158" x2="228" y2="158" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M228,158 l-6,-3.6 l0,7.2 z" fill="#5a5a72"/>
<rect x="236" y="142" width="68" height="32" rx="3" fill="#20302a" stroke="#67d9a0" stroke-width="1.3"/>
<text x="270" y="163" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="monospace">EAX</text>
<text x="316" y="163" fill="#8a8aa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不碰内存</text>
<rect x="460" y="90" width="424" height="100" rx="4" fill="#14141e" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="474" y="112" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">寄存器</text>
<text x="518" y="112" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">临时变量</text>
<text x="474" y="130" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="monospace">mov eax, ebx</text>
<rect x="474" y="142" width="158" height="32" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.1"/>
<text x="553" y="163" fill="#c8c8dc" font-size="9.2" text-anchor="middle" font-family="monospace">EBX 的值</text>
<line x1="636" y1="158" x2="664" y2="158" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M664,158 l-6,-3.6 l0,7.2 z" fill="#5a5a72"/>
<rect x="672" y="142" width="68" height="32" rx="3" fill="#20302a" stroke="#67d9a0" stroke-width="1.3"/>
<text x="706" y="163" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="monospace">EAX</text>
<text x="752" y="163" fill="#8a8aa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不碰内存</text>
<rect x="24" y="200" width="424" height="100" rx="4" fill="#14141e" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="38" y="222" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">直接</text>
<text x="70" y="222" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全局变量</text>
<text x="38" y="240" fill="#b58ae8" font-size="9.5" text-anchor="start" font-family="monospace">mov eax, [0x404000]</text>
<rect x="38" y="252" width="158" height="32" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.1"/>
<text x="117" y="273" fill="#c8c8dc" font-size="9.2" text-anchor="middle" font-family="monospace">指令里的 0x404000</text>
<line x1="200" y1="268" x2="228" y2="268" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M228,268 l-6,-3.6 l0,7.2 z" fill="#5a5a72"/>
<rect x="236" y="252" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="254" y="273" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<rect x="276" y="252" width="36" height="32" rx="2" fill="#2a2038" stroke="#b58ae8" stroke-width="1.4"/>
<text x="294" y="273" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">值</text>
<rect x="316" y="252" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="334" y="273" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<text x="360" y="273" fill="#8a8aa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内存</text>
<rect x="460" y="200" width="424" height="100" rx="4" fill="#14141e" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="474" y="222" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">寄存器间接</text>
<text x="542" y="222" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">指针解引用</text>
<text x="474" y="240" fill="#b58ae8" font-size="9.5" text-anchor="start" font-family="monospace">mov eax, [rbx]</text>
<rect x="474" y="252" width="158" height="32" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.1"/>
<text x="553" y="273" fill="#c8c8dc" font-size="9.2" text-anchor="middle" font-family="monospace">RBX 里存的地址</text>
<line x1="636" y1="268" x2="664" y2="268" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M664,268 l-6,-3.6 l0,7.2 z" fill="#5a5a72"/>
<rect x="672" y="252" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="690" y="273" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<rect x="712" y="252" width="36" height="32" rx="2" fill="#2a2038" stroke="#b58ae8" stroke-width="1.4"/>
<text x="730" y="273" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">值</text>
<rect x="752" y="252" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="770" y="273" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<text x="796" y="273" fill="#8a8aa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内存</text>
<rect x="24" y="310" width="424" height="100" rx="4" fill="#14141e" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="38" y="332" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">基址 + 偏移</text>
<text x="130" y="332" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">局部变量、成员</text>
<text x="38" y="350" fill="#b58ae8" font-size="9.5" text-anchor="start" font-family="monospace">mov eax, [rbp-8]</text>
<rect x="38" y="362" width="158" height="32" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.1"/>
<text x="117" y="383" fill="#c8c8dc" font-size="9.2" text-anchor="middle" font-family="monospace">RBP − 8</text>
<line x1="200" y1="378" x2="228" y2="378" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M228,378 l-6,-3.6 l0,7.2 z" fill="#5a5a72"/>
<rect x="236" y="362" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="254" y="383" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<rect x="276" y="362" width="36" height="32" rx="2" fill="#2a2038" stroke="#b58ae8" stroke-width="1.4"/>
<text x="294" y="383" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">值</text>
<rect x="316" y="362" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="334" y="383" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<text x="360" y="383" fill="#8a8aa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内存</text>
<rect x="460" y="310" width="424" height="100" rx="4" fill="#14141e" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="474" y="332" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">基址 + 变址×比例</text>
<text x="602" y="332" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数组元素</text>
<text x="474" y="350" fill="#b58ae8" font-size="9.5" text-anchor="start" font-family="monospace">mov eax, [rbx+rcx*4+8]</text>
<rect x="474" y="362" width="158" height="32" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.1"/>
<text x="553" y="383" fill="#c8c8dc" font-size="9.2" text-anchor="middle" font-family="monospace">RBX + RCX×4 + 8</text>
<line x1="636" y1="378" x2="664" y2="378" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M664,378 l-6,-3.6 l0,7.2 z" fill="#5a5a72"/>
<rect x="672" y="362" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="690" y="383" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<rect x="712" y="362" width="36" height="32" rx="2" fill="#2a2038" stroke="#b58ae8" stroke-width="1.4"/>
<text x="730" y="383" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">值</text>
<rect x="752" y="362" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="770" y="383" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<text x="796" y="383" fill="#8a8aa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内存</text>
<rect x="24" y="420" width="424" height="100" rx="4" fill="#14141e" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="38" y="442" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">PC 相对</text>
<text x="106" y="442" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全局变量（PIE）</text>
<text x="38" y="460" fill="#b58ae8" font-size="9.5" text-anchor="start" font-family="monospace">mov eax, [rip+0x2a4c]</text>
<rect x="38" y="472" width="158" height="32" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.1"/>
<text x="117" y="493" fill="#c8c8dc" font-size="9.2" text-anchor="middle" font-family="monospace">RIP + 0x2A4C</text>
<line x1="200" y1="488" x2="228" y2="488" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M228,488 l-6,-3.6 l0,7.2 z" fill="#5a5a72"/>
<rect x="236" y="472" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="254" y="493" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<rect x="276" y="472" width="36" height="32" rx="2" fill="#2a2038" stroke="#b58ae8" stroke-width="1.4"/>
<text x="294" y="493" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">值</text>
<rect x="316" y="472" width="36" height="32" rx="2" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<text x="334" y="493" fill="#d8c8f4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<text x="360" y="493" fill="#8a8aa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内存</text>
<rect x="460" y="420" width="424" height="100" rx="4" fill="#101018" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="474" y="444" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">三种来源，七种组合</text>
<text x="474" y="466" fill="#8a8aa0" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">值的来源只有三种：指令里带着、寄存器里、内存里。</text>
<text x="474" y="484" fill="#8a8aa0" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前两种不用算地址；第三种要先算出地址，而算地址的三样东西</text>
<text x="474" y="502" fill="#8a8aa0" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（基址、变址、偏移）各有各的来源，组合起来就是这七种。</text>
<text x="24" y="542" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意最后一格：PC 相对的「基址」是当前指令自己的位置。这让程序可以整体搬走而不用改任何一条指令。</text>
</svg>
