<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.2-5  利率怎么从央行传到你的月供</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据取 2024 年底。每一环都有一个「谁决定」和一段时滞</text>
<rect x="40" y="106" width="170" height="66" rx="5" fill="#16161f" stroke="#b58ae8" stroke-width="1.4"/>
<text x="125" y="130" fill="#b58ae8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">7 天逆回购</text>
<text x="125" y="156" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1.5%</text>
<text x="125" y="196" fill="#7a7a94" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行每天操作</text>
<line x1="210" y1="139" x2="234" y2="139" stroke="#6a6a86" stroke-width="2"/>
<path d="M234,133 L244,139 L234,145 Z" fill="#6a6a86" stroke="#6a6a86" stroke-width="1"/>
<rect x="240" y="106" width="170" height="66" rx="5" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="325" y="130" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">DR007</text>
<text x="325" y="156" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">围绕政策利率</text>
<text x="325" y="196" fill="#7a7a94" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行间市场成交</text>
<line x1="410" y1="139" x2="434" y2="139" stroke="#6a6a86" stroke-width="2"/>
<path d="M434,133 L444,139 L434,145 Z" fill="#6a6a86" stroke="#6a6a86" stroke-width="1"/>
<rect x="440" y="106" width="170" height="66" rx="5" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="525" y="130" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">LPR</text>
<text x="525" y="156" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3.1% / 3.6%</text>
<text x="525" y="196" fill="#7a7a94" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">20 家报价行报出</text>
<line x1="610" y1="139" x2="634" y2="139" stroke="#6a6a86" stroke-width="2"/>
<path d="M634,133 L644,139 L634,145 Z" fill="#6a6a86" stroke="#6a6a86" stroke-width="1"/>
<rect x="640" y="106" width="170" height="66" rx="5" fill="#16161f" stroke="#e8965a" stroke-width="1.4"/>
<text x="725" y="130" fill="#e8965a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">你的房贷</text>
<text x="725" y="156" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3.1% 上下</text>
<text x="725" y="196" fill="#7a7a94" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">LPR + 加点</text>
<path d="M592,172 L592,260 L660,260" fill="none" stroke="#5a5a76" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M660,254 L670,260 L660,266 Z" fill="#5a5a76" stroke="#5a5a76" stroke-width="1"/>
<rect x="672" y="232" width="168" height="56" rx="5" fill="#1f1a24" stroke="#b58ae8" stroke-width="1.3"/>
<text x="756" y="254" fill="#b58ae8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款利率</text>
<text x="756" y="274" fill="#9a8ab4" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一年期 1.1% 左右</text>
<text x="40" y="312" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「央行降息」和「你的月供变少」之间，正常也会隔三到六个月。这不是银行拖着不办，是合同里写着一年调一次。</text>
<text x="40" y="340" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款利率是另一条链，方向相反：央行降政策利率，银行资金成本降，存款利率跟着降，但通常比贷款降得慢——这是银行保住净息差的办法。</text>
<text x="40" y="368" fill="#6f7f92" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">看新闻时分清三件事：降的是政策利率还是 LPR、影响新贷款还是存量、你的重定价日是哪天。三个都答完，才知道月供会不会变。</text>
</svg>
