<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.5.3-4  一个 B 树节点里装了什么：一页 16 KB</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">指针和 key 交替排开，一个节点就能挂一千多个孩子</text>
<text x="440" y="118" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">16 KB = 一页 = 一次 IO</text>
<path d="M44,124 L44,132 L836,132 L836,124" fill="none" stroke="#4a4a68" stroke-width="1.2"/>
<rect x="44" y="140" width="792" height="58" rx="0" fill="#12121a" stroke="#4a4a68" stroke-width="1.4"/>
<rect x="44" y="140" width="52" height="58" rx="0" fill="#182634" stroke="#3a5a7a" stroke-width="1.1"/>
<text x="70" y="174" fill="#8fb8d8" font-size="11" text-anchor="middle" font-family="monospace">p0</text>
<rect x="96" y="140" width="52" height="58" rx="0" fill="#2a2214" stroke="#8a6a2a" stroke-width="1.1"/>
<text x="122" y="174" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="monospace">k1</text>
<rect x="148" y="140" width="52" height="58" rx="0" fill="#182634" stroke="#3a5a7a" stroke-width="1.1"/>
<text x="174" y="174" fill="#8fb8d8" font-size="11" text-anchor="middle" font-family="monospace">p1</text>
<rect x="200" y="140" width="52" height="58" rx="0" fill="#2a2214" stroke="#8a6a2a" stroke-width="1.1"/>
<text x="226" y="174" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="monospace">k2</text>
<rect x="252" y="140" width="52" height="58" rx="0" fill="#182634" stroke="#3a5a7a" stroke-width="1.1"/>
<text x="278" y="174" fill="#8fb8d8" font-size="11" text-anchor="middle" font-family="monospace">p2</text>
<rect x="304" y="140" width="52" height="58" rx="0" fill="#2a2214" stroke="#8a6a2a" stroke-width="1.1"/>
<text x="330" y="174" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="monospace">k3</text>
<rect x="356" y="140" width="52" height="58" rx="0" fill="#182634" stroke="#3a5a7a" stroke-width="1.1"/>
<text x="382" y="174" fill="#8fb8d8" font-size="11" text-anchor="middle" font-family="monospace">p3</text>
<rect x="408" y="140" width="52" height="58" rx="0" fill="#2a2214" stroke="#8a6a2a" stroke-width="1.1"/>
<text x="434" y="174" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="monospace">k4</text>
<rect x="460" y="140" width="52" height="58" rx="0" fill="#182634" stroke="#3a5a7a" stroke-width="1.1"/>
<text x="486" y="174" fill="#8fb8d8" font-size="11" text-anchor="middle" font-family="monospace">p4</text>
<rect x="512" y="140" width="52" height="58" rx="0" fill="#2a2214" stroke="#8a6a2a" stroke-width="1.1"/>
<text x="538" y="174" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="monospace">k5</text>
<rect x="564" y="140" width="52" height="58" rx="0" fill="#182634" stroke="#3a5a7a" stroke-width="1.1"/>
<text x="590" y="174" fill="#8fb8d8" font-size="11" text-anchor="middle" font-family="monospace">p5</text>
<rect x="616" y="140" width="52" height="58" rx="0" fill="#2a2214" stroke="#8a6a2a" stroke-width="1.1"/>
<text x="642" y="174" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="monospace">k6</text>
<text x="752" y="176" fill="#5f5f78" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">…… 还剩 1150 多对</text>
<text x="44" y="226" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">p = 子节点的页号（4~6 字节）　　　k = 用来分流的 key（8 字节）</text>
<text x="44" y="250" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一对「指针 + key」≈ 14 字节　→　16 × 1024 ÷ 14 ≈ 1170</text>
<text x="44" y="274" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">二叉树一个节点只挂 2 个孩子；这里挂 1170 个 —— 「胖」就是这个意思。</text>
<rect x="44" y="296" width="210" height="54" rx="3" fill="#161f2a" stroke="#3a5a7a" stroke-width="1.2"/>
<text x="60" y="318" fill="#7f8fa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 1 层</text>
<text x="60" y="340" fill="#8fb8d8" font-size="12" text-anchor="start" font-family="monospace">1170 个孩子</text>
<rect x="270" y="296" width="210" height="54" rx="3" fill="#161f2a" stroke="#3a5a7a" stroke-width="1.2"/>
<text x="286" y="318" fill="#7f8fa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 2 层</text>
<text x="286" y="340" fill="#8fb8d8" font-size="12" text-anchor="start" font-family="monospace">≈ 137 万</text>
<rect x="496" y="296" width="210" height="54" rx="3" fill="#161f2a" stroke="#3a5a7a" stroke-width="1.2"/>
<text x="512" y="318" fill="#7f8fa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 3 层</text>
<text x="512" y="340" fill="#8fb8d8" font-size="12" text-anchor="start" font-family="monospace">≈ 16 亿</text>
<rect x="722" y="296" width="114" height="54" rx="3" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="779" y="318" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">100 万条</text>
<text x="779" y="338" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三层就够</text>
<text x="44" y="380" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按 BIGINT 主键估。换成二级索引（key 和主键各存一份）会少一些，量级不变。真实引擎还会留填充因子给后续插入用。</text>
</svg>
