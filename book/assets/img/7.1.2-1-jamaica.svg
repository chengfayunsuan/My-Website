<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="452" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.2-1  牙买加协定改了什么：从「有规则」到「没规则」</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左边是 1944 年的设计，右边是 1976 年的追认。注意右边每一行都比左边松</text>
<rect x="40" y="84" width="350" height="280" rx="5" fill="#2a2410" stroke="#e8b84b" stroke-width="1.5"/>
<text x="62" y="118" fill="#e8b84b" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">布雷顿森林</text>
<text x="62" y="140" fill="#7f7f98" font-size="9" text-anchor="start" font-family="monospace">1944 — 1971</text>
<line x1="62" y1="154" x2="368" y2="154" stroke="#33334a" stroke-width="1"/>
<text x="62" y="184" fill="#7f7f98" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">黄金</text>
<text x="62" y="202" fill="#b8bccd" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">35 美元/盎司，各国央行可兑</text>
<text x="62" y="228" fill="#7f7f98" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">汇率</text>
<text x="62" y="246" fill="#b8bccd" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钉住美元，波动不超过 ±1%</text>
<text x="62" y="272" fill="#7f7f98" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">调整</text>
<text x="62" y="290" fill="#b8bccd" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要报 IMF 批准</text>
<text x="62" y="316" fill="#7f7f98" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">本位</text>
<text x="62" y="334" fill="#b8bccd" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美元，背后是黄金</text>
<rect x="490" y="84" width="350" height="280" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.5"/>
<text x="512" y="118" fill="#67b5ef" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">牙买加体系</text>
<text x="512" y="140" fill="#7f7f98" font-size="9" text-anchor="start" font-family="monospace">1976 — 现在</text>
<line x1="512" y1="154" x2="818" y2="154" stroke="#33334a" stroke-width="1"/>
<text x="512" y="184" fill="#7f7f98" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">黄金</text>
<text x="512" y="202" fill="#b8bccd" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不再是货币，价格由市场定</text>
<text x="512" y="228" fill="#7f7f98" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">汇率</text>
<text x="512" y="246" fill="#b8bccd" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">固定或浮动，各国自己选</text>
<text x="512" y="272" fill="#7f7f98" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">调整</text>
<text x="512" y="290" fill="#b8bccd" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不需批准，但不能操纵</text>
<text x="512" y="316" fill="#7f7f98" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">本位</text>
<text x="512" y="334" fill="#b8bccd" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有本位，全靠信用</text>
<line x1="396" y1="224" x2="472" y2="224" stroke="#55557a" stroke-width="1.8"/>
<path d="M472,224 L482,224 L472,218 L472,230 Z" fill="#55557a" stroke="#55557a" stroke-width="1"/>
<text x="439" y="204" fill="#8a8aa2" font-size="9" text-anchor="middle" font-family="monospace">1976</text>
<text x="439" y="252" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">追认</text>
<text x="40" y="398" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键差别不在条款，在性质：布雷顿森林是一份「合约」，签字国承诺遵守；牙买加是一份「许可」，告诉各国「你想怎么定就怎么定」。</text>
<text x="40" y="422" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以它常被叫作「没有体系的体系」（non-system）——不是因为混乱，是因为它主动放弃了统一规则。</text>
</svg>
