<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="420" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">从查名到拿照：五个环节，最快当天</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">线上提交是主流，跑窗口是例外；时间差在材料准备上</text>
<defs><marker id="r1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#8a8aa0"/></marker></defs><rect x="12" y="86" width="140" height="96" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="82.0" y="112" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">① 查名</text>
<text x="82.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">自主申报</text>
<text x="82.0" y="150" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">系统查重</text>
<text x="82.0" y="172" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当场出结果</text>
<line x1="153" y1="134" x2="163" y2="134" stroke="#8a8aa0" stroke-width="2" marker-end="url(#r1)"/><rect x="166" y="86" width="140" height="96" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="236.0" y="112" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">② 备材料</text>
<text x="236.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">章程、股东身份证、住所证明</text>
<text x="236.0" y="172" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1~3 天（自己慢）</text>
<line x1="307" y1="134" x2="317" y2="134" stroke="#8a8aa0" stroke-width="2" marker-end="url(#r1)"/><rect x="320" y="86" width="140" height="96" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="390.0" y="112" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">③ 提交申请</text>
<text x="390.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一网通办</text>
<text x="390.0" y="150" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全体股东实名签字</text>
<text x="390.0" y="172" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">线上 30 分钟</text>
<line x1="461" y1="134" x2="471" y2="134" stroke="#8a8aa0" stroke-width="2" marker-end="url(#r1)"/><rect x="474" y="86" width="140" height="96" rx="6" fill="#16161f" stroke="#e8965a" stroke-width="1.5"/>
<text x="544.0" y="112" fill="#e8965a" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">④ 审核</text>
<text x="544.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">形式审查</text>
<text x="544.0" y="150" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不看实质</text>
<text x="544.0" y="172" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1~3 个工作日</text>
<line x1="615" y1="134" x2="625" y2="134" stroke="#8a8aa0" stroke-width="2" marker-end="url(#r1)"/><rect x="628" y="86" width="140" height="96" rx="6" fill="#16161f" stroke="#b58ae8" stroke-width="1.5"/>
<text x="698.0" y="112" fill="#b58ae8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">⑤ 领照</text>
<text x="698.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">电子执照即时</text>
<text x="698.0" y="150" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">纸质可邮寄</text>
<text x="698.0" y="172" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当场 / 次日</text>
<rect x="30" y="206" width="720" height="86" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="50" y="232" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">「形式审查」是什么意思</text>
<text x="50" y="256" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">登记机关只看材料齐不齐、格式对不对、签字是不是本人，不核实你说的是不是真的</text>
<text x="50" y="278" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以虚假地址、代签、假股东能过审——但责任在你，事后被查要罚款、撤销登记</text>
<rect x="30" y="304" width="720" height="96" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="50" y="330" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">拿照不等于能开业</text>
<text x="50" y="354" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">后面还有：刻章 → 税务登记（30 日内）→ 银行开户 → 社保开户</text>
<text x="50" y="376" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这些都不做，执照就是一张纸：开不了票、收不了款、报不了税</text>
</svg>
