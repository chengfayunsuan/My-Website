<text x="24" y="534" fill="#6a6a84" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">28 nm 工艺、1 GHz 下，t_su 约 50～100 ps，t_h 约 20～50 ps。一个周期 1000 ps，窗口只占不到一成。</text>
