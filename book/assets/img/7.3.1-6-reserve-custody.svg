<svg width="880" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">微信钱包里的 200 块，存在哪家银行</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">既不在腾讯的保险柜，也不在你的银行卡上。它在一条专门的清算通道里。</text>
<rect x="48" y="150" width="150" height="70" rx="6" fill="#16281c" stroke="#67d9a0" stroke-width="1.4"/>
<text x="123" y="178" fill="#67d9a0" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">你</text>
<text x="123" y="200" fill="#a0a0b8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱包余额 200</text>
<line x1="200" y1="185" x2="296" y2="185" stroke="#8a8aa0" stroke-width="1.8"/>
<path d="M296,178 L310,185 L296,192 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="1"/>
<text x="254" y="170" fill="#a0a0b8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">充值</text>
<rect x="310" y="120" width="234" height="130" rx="6" fill="#1c2333" stroke="#67b5ef" stroke-width="1.4"/>
<text x="427" y="148" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">财付通备付金账户</text>
<text x="427" y="172" fill="#a0a0b8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你在微信里的余额</text>
<text x="427" y="194" fill="#a0a0b8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全部记在这一本账上</text>
<text x="427" y="224" fill="#e8965a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">100% 集中存管，不得挪用</text>
<rect x="592" y="108" width="236" height="90" rx="6" fill="#241f14" stroke="#e8b84b" stroke-width="1.4"/>
<text x="710" y="136" fill="#e8b84b" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">央行</text>
<text x="710" y="160" fill="#a0a0b8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">备付金集中存管专户</text>
<text x="710" y="182" fill="#a0a0b8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这笔钱只能躺在央行</text>
<line x1="546" y1="160" x2="590" y2="150" stroke="#e8b84b" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M590,144 L602,147 L592,155 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<line x1="427" y1="252" x2="427" y2="300" stroke="#8a8aa0" stroke-width="1.8"/>
<path d="M420,300 L427,314 L434,300 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="1"/>
<text x="440" y="272" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">买奶茶 15 块</text>
<rect x="310" y="316" width="234" height="62" rx="6" fill="#161624" stroke="#3a3a52" stroke-width="1.2"/>
<text x="427" y="342" fill="#c8c8dc" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商户的收单行</text>
<text x="427" y="364" fill="#8a8aa0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">备付金账户 → 商户账户</text>
</svg>
