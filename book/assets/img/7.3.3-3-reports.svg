<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="356" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.3 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行要报两种报告，逻辑完全不同</text>
<rect x="30" y="88" width="400" height="226" rx="10" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="230" y="116" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大额交易报告</text>
<text x="230" y="140" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">系统自动报，不看可不可疑</text>
<text x="54" y="164" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 现金收支</text>
<text x="200" y="164" fill="#8a8aa0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5 万元以上</text>
<text x="54" y="190" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 境内转账</text>
<text x="200" y="190" fill="#8a8aa0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">50 万元以上</text>
<text x="54" y="216" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 跨境转账</text>
<text x="200" y="216" fill="#8a8aa0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">20 万元以上</text>
<text x="54" y="254" fill="#7a7a94" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（以上为自然人标准，企业更高）</text>
<text x="54" y="286" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">目的是留痕，不是定罪</text>
<rect x="450" y="88" width="400" height="226" rx="10" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="650" y="116" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可疑交易报告</text>
<text x="650" y="140" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人工判断，没有金额门槛</text>
<text x="474" y="168" fill="#cfcfe0" font-size="10.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 突然频繁进出、金额整齐</text>
<text x="474" y="196" fill="#cfcfe0" font-size="10.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 账户给陌生人过账</text>
<text x="474" y="224" fill="#cfcfe0" font-size="10.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 与身份、职业明显不符</text>
<text x="474" y="252" fill="#cfcfe0" font-size="10.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 夜间大额、快进快出</text>
<text x="474" y="286" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">报了不一定有事，不报要担责</text>
<text x="24" y="340" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大额报告是「例行留档」，可疑报告是「我觉得不对劲」。前者靠系统，后者靠人。</text>
</svg>
