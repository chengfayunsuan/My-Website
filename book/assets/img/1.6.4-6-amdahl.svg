<text x="30" y="392" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两条推论：一是「只优化热点」这句话有上限——热点占 50%，你把它优化到零也只有 2 倍；</text>
<text x="30" y="414" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">二是想让整体快一倍，得先弄清楚「剩下那一半时间在哪儿」。这就是为什么第一步永远是测量，不是改代码。</text>
