<svg width="640" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bandHigh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ec9a3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4ec9a3" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bandLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67b5ef" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#67b5ef" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bandGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0606a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f0606a" stop-opacity="0.04"/>
    </linearGradient>
    <marker id="arrowX" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6b6b85"/>
    </marker>
    <marker id="arrowT" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#9b4df0"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#0e0e16"/>

  <!-- 标题 -->
  <text x="24" y="28" fill="#9a9ab4" font-size="12.5" font-family="monospace">同一根导线上的电压：左＝真实曲线，右＝被阈值切出来的结果</text>

  <!-- ===== 电压分区底色 ===== -->
  <rect x="60" y="60" width="300" height="95" fill="url(#bandHigh)"/>
  <rect x="60" y="155" width="300" height="87" fill="url(#bandGrey)"/>
  <rect x="60" y="242" width="300" height="58" fill="url(#bandLow)"/>

  <!-- ===== 坐标轴 ===== -->
  <line x1="60" y1="300" x2="360" y2="300" stroke="#3a3a5c" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="60" y2="60" stroke="#3a3a5c" stroke-width="1.5"/>
  <text x="360" y="322" fill="#6b6b85" font-size="11" text-anchor="end">时间 →</text>
  <text x="52" y="66" fill="#6b6b85" font-size="11" text-anchor="end">V</text>

  <!-- 刻度与阈值线 -->
  <line x1="60" y1="60" x2="360" y2="60" stroke="#4ec9a3" stroke-width="1" stroke-dasharray="5 4" stroke-opacity="0.6"/>
  <text x="366" y="64" fill="#4ec9a3" font-size="10.5" font-family="monospace">3.3V</text>

  <line x1="60" y1="155" x2="360" y2="155" stroke="#f0606a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="366" y="159" fill="#f0606a" font-size="10.5" font-family="monospace">2.0V  V(IH)</text>

  <line x1="60" y1="242" x2="360" y2="242" stroke="#f0606a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="366" y="246" fill="#f0606a" font-size="10.5" font-family="monospace">0.8V  V(IL)</text>

  <line x1="60" y1="300" x2="360" y2="300" stroke="#67b5ef" stroke-width="1" stroke-opacity="0.6"/>
  <text x="366" y="304" fill="#67b5ef" font-size="10.5" font-family="monospace">0V</text>

  <!-- ===== 模拟电压曲线（带过冲与抖动） ===== -->
  <path d="M60,300 L96,300
           C104,300 106,296 110,292
           C118,282 122,120 130,86
           C136,66 146,74 152,80
           C160,84 166,88 172,88
           L214,88
           C220,88 222,94 224,102
           C230,130 236,286 244,296
           C250,302 258,300 264,300
           L296,300
           C302,300 304,292 308,280
           C314,258 318,110 326,84
           C332,66 344,76 350,86
           L360,88"
        fill="none" stroke="#c9b0ff" stroke-width="2" stroke-linejoin="round"/>

  <!-- 抖动小毛刺 -->
  <path d="M152,80 L156,74 L160,86 L164,80" fill="none" stroke="#c9b0ff" stroke-width="1.2" opacity="0.7"/>
  <path d="M290,300 L294,306 L298,298" fill="none" stroke="#c9b0ff" stroke-width="1.2" opacity="0.7"/>

  <!-- 曲线上的采样点 -->
  <circle cx="130" cy="86" r="3" fill="#f0606a"/>
  <circle cx="200" cy="88" r="3" fill="#f0606a"/>
  <circle cx="244" cy="296" r="3" fill="#f0606a"/>
  <circle cx="320" cy="92" r="3" fill="#f0606a"/>

  <!-- 分区标注 -->
  <rect x="62" y="68" width="106" height="15" rx="3" fill="#0e0e16" opacity="0.82"/>
  <text x="66" y="80" fill="#4ec9a3" font-size="10">保证读成 1 的区域</text>
  <rect x="62" y="184" width="146" height="15" rx="3" fill="#0e0e16" opacity="0.82"/>
  <text x="66" y="196" fill="#f0606a" font-size="10">禁区：读成什么都有可能</text>
  <rect x="62" y="276" width="106" height="15" rx="3" fill="#0e0e16" opacity="0.82"/>
  <text x="66" y="288" fill="#67b5ef" font-size="10">保证读成 0 的区域</text>

  <!-- ===== 中间箭头 ===== -->
  <line x1="392" y1="180" x2="424" y2="180" stroke="#9b4df0" stroke-width="2" marker-end="url(#arrowT)"/>
  <text x="408" y="170" fill="#9b4df0" font-size="10.5" text-anchor="middle" font-family="monospace">阈值</text>
  <text x="408" y="202" fill="#9b4df0" font-size="10.5" text-anchor="middle" font-family="monospace">判决</text>

  <!-- ===== 右侧：数字化后的方波 ===== -->
  <line x1="430" y1="300" x2="612" y2="300" stroke="#3a3a5c" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="430" y2="70" stroke="#3a3a5c" stroke-width="1.5"/>

  <path d="M430,290 L470,290 L470,90 L520,90 L520,290 L556,290 L556,90 L600,90"
        fill="none" stroke="#4ec9a3" stroke-width="2.4" stroke-linejoin="miter"/>

  <!-- 方波上的读数 -->
  <text x="478" y="82" fill="#4ec9a3" font-size="14" font-family="monospace" font-weight="700">1</text>
  <text x="490" y="284" fill="#67b5ef" font-size="14" font-family="monospace" font-weight="700">0</text>
  <text x="562" y="82" fill="#4ec9a3" font-size="14" font-family="monospace" font-weight="700">1</text>

  <text x="430" y="62" fill="#4ec9a3" font-size="11" font-family="monospace">结果：1 0 1</text>

  <!-- ===== 底部说明 ===== -->
  <line x1="24" y1="340" x2="616" y2="340" stroke="#2a2a44" stroke-width="1"/>
  <text x="24" y="362" fill="#9a9ab4" font-size="11">左边那条曲线是"真实发生的事"，它永远在抖；右边那条方波是"机器相信的事"，只有两种取值。</text>
  <text x="24" y="382" fill="#6b6b85" font-size="11">所谓数字化，就是一次性扔掉曲线的全部细节，只保留"过线了没有"这一个判断。</text>
</svg>
