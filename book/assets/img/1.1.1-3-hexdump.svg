<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'PingFang SC','Microsoft YaHei',monospace">
  <rect width="640" height="420" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5">「你」在 UTF-8 里的三个字节，逐位摊开</text>
  <text x="24" y="46" fill="#6b6b85" font-size="11">十六进制只是给人看的缩写；机器里存的是下面这些 0 和 1</text>

  <!-- ============ 第一行 E4 ============ -->
  <text x="24" y="96" fill="#e8b84b" font-size="13" font-weight="700">E4</text>
  <text x="24" y="114" fill="#6b6b85" font-size="9.5">= 228</text>

  <!-- 前缀 1110 -->
  <g>
    <rect x="90" y="78" width="26" height="32" rx="3" fill="#2a1b4d" stroke="#9b4df0"/>
    <text x="103" y="99" fill="#c9b0ff" font-size="12" text-anchor="middle">1</text>
    <rect x="118" y="78" width="26" height="32" rx="3" fill="#2a1b4d" stroke="#9b4df0"/>
    <text x="131" y="99" fill="#c9b0ff" font-size="12" text-anchor="middle">1</text>
    <rect x="146" y="78" width="26" height="32" rx="3" fill="#2a1b4d" stroke="#9b4df0"/>
    <text x="159" y="99" fill="#c9b0ff" font-size="12" text-anchor="middle">1</text>
    <rect x="174" y="78" width="26" height="32" rx="3" fill="#2a1b4d" stroke="#9b4df0"/>
    <text x="187" y="99" fill="#c9b0ff" font-size="12" text-anchor="middle">0</text>
  </g>
  <!-- 数据 0100 -->
  <g>
    <rect x="208" y="78" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="221" y="99" fill="#7fe0c2" font-size="12" text-anchor="middle">0</text>
    <rect x="236" y="78" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="249" y="99" fill="#7fe0c2" font-size="12" text-anchor="middle">1</text>
    <rect x="264" y="78" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="277" y="99" fill="#7fe0c2" font-size="12" text-anchor="middle">0</text>
    <rect x="292" y="78" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="305" y="99" fill="#7fe0c2" font-size="12" text-anchor="middle">0</text>
  </g>
  <text x="336" y="99" fill="#6b6b85" font-size="10.5">← 前缀 1110 表示「这个字占 3 字节」</text>

  <!-- ============ 第二行 BD ============ -->
  <text x="24" y="166" fill="#e8b84b" font-size="13" font-weight="700">BD</text>
  <text x="24" y="184" fill="#6b6b85" font-size="9.5">= 189</text>

  <g>
    <rect x="90" y="148" width="26" height="32" rx="3" fill="#2a1b4d" stroke="#9b4df0"/>
    <text x="103" y="169" fill="#c9b0ff" font-size="12" text-anchor="middle">1</text>
    <rect x="118" y="148" width="26" height="32" rx="3" fill="#2a1b4d" stroke="#9b4df0"/>
    <text x="131" y="169" fill="#c9b0ff" font-size="12" text-anchor="middle">0</text>
  </g>
  <g>
    <rect x="152" y="148" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="165" y="169" fill="#7fe0c2" font-size="12" text-anchor="middle">1</text>
    <rect x="180" y="148" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="193" y="169" fill="#7fe0c2" font-size="12" text-anchor="middle">1</text>
    <rect x="208" y="148" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="221" y="169" fill="#7fe0c2" font-size="12" text-anchor="middle">1</text>
    <rect x="236" y="148" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="249" y="169" fill="#7fe0c2" font-size="12" text-anchor="middle">1</text>
    <rect x="264" y="148" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="277" y="169" fill="#7fe0c2" font-size="12" text-anchor="middle">0</text>
    <rect x="292" y="148" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="305" y="169" fill="#7fe0c2" font-size="12" text-anchor="middle">1</text>
  </g>
  <text x="336" y="169" fill="#6b6b85" font-size="10.5">← 前缀 10 表示「我是续字节」</text>

  <!-- ============ 第三行 A0 ============ -->
  <text x="24" y="236" fill="#e8b84b" font-size="13" font-weight="700">A0</text>
  <text x="24" y="254" fill="#6b6b85" font-size="9.5">= 160</text>

  <g>
    <rect x="90" y="218" width="26" height="32" rx="3" fill="#2a1b4d" stroke="#9b4df0"/>
    <text x="103" y="239" fill="#c9b0ff" font-size="12" text-anchor="middle">1</text>
    <rect x="118" y="218" width="26" height="32" rx="3" fill="#2a1b4d" stroke="#9b4df0"/>
    <text x="131" y="239" fill="#c9b0ff" font-size="12" text-anchor="middle">0</text>
  </g>
  <g>
    <rect x="152" y="218" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="165" y="239" fill="#7fe0c2" font-size="12" text-anchor="middle">1</text>
    <rect x="180" y="218" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="193" y="239" fill="#7fe0c2" font-size="12" text-anchor="middle">0</text>
    <rect x="208" y="218" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="221" y="239" fill="#7fe0c2" font-size="12" text-anchor="middle">0</text>
    <rect x="236" y="218" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="249" y="239" fill="#7fe0c2" font-size="12" text-anchor="middle">0</text>
    <rect x="264" y="218" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="277" y="239" fill="#7fe0c2" font-size="12" text-anchor="middle">0</text>
    <rect x="292" y="218" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.7"/>
    <text x="305" y="239" fill="#7fe0c2" font-size="12" text-anchor="middle">0</text>
  </g>
  <text x="336" y="239" fill="#6b6b85" font-size="10.5">← 同样是前缀 10 + 6 个有效位</text>

  <!-- ============ 拼接 ============ -->
  <line x1="24" y1="272" x2="616" y2="272" stroke="#2a2a44"/>

  <text x="24" y="296" fill="#9a9ab4" font-size="11.5">把三行里「有效位」抽出来拼在一起：</text>

  <g font-size="11.5">
    <!-- 16 个数据位 -->
    <rect x="24" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="36" y="327" fill="#7fe0c2" text-anchor="middle">0</text>
    <rect x="50" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="62" y="327" fill="#7fe0c2" text-anchor="middle">1</text>
    <rect x="76" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="88" y="327" fill="#7fe0c2" text-anchor="middle">0</text>
    <rect x="102" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="114" y="327" fill="#7fe0c2" text-anchor="middle">0</text>

    <rect x="132" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="144" y="327" fill="#7fe0c2" text-anchor="middle">1</text>
    <rect x="158" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="170" y="327" fill="#7fe0c2" text-anchor="middle">1</text>
    <rect x="184" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="196" y="327" fill="#7fe0c2" text-anchor="middle">1</text>
    <rect x="210" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="222" y="327" fill="#7fe0c2" text-anchor="middle">1</text>

    <rect x="240" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="252" y="327" fill="#7fe0c2" text-anchor="middle">0</text>
    <rect x="266" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="278" y="327" fill="#7fe0c2" text-anchor="middle">1</text>
    <rect x="292" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="304" y="327" fill="#7fe0c2" text-anchor="middle">1</text>
    <rect x="318" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="330" y="327" fill="#7fe0c2" text-anchor="middle">0</text>

    <rect x="348" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="360" y="327" fill="#7fe0c2" text-anchor="middle">0</text>
    <rect x="374" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="386" y="327" fill="#7fe0c2" text-anchor="middle">0</text>
    <rect x="400" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="412" y="327" fill="#7fe0c2" text-anchor="middle">0</text>
    <rect x="426" y="308" width="24" height="28" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="438" y="327" fill="#7fe0c2" text-anchor="middle">0</text>
  </g>

  <text x="462" y="327" fill="#e8b84b" font-size="12.5">= 0x4F60 = U+4F60</text>
  <text x="462" y="345" fill="#6b6b85" font-size="10.5">= 「你」</text>

  <!-- 注释 -->
  <line x1="24" y1="368" x2="616" y2="368" stroke="#2a2a44"/>
  <text x="24" y="390" fill="#9a9ab4" font-size="11">UTF-8 的巧妙之处：每个字节自己就说明了身份。首字节告诉你「总共几字节」，续字节一律以 10 开头。</text>
  <text x="24" y="410" fill="#6b6b85" font-size="11">所以即使从一个字节流的中间开始读，也能很快找准边界——不需要从头解析。</text>
</svg>
