<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="390" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">延时到账不是为了慢，是为了给你一个反悔窗口</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">被诈骗的人，平均在转账后 20 分钟内才开始怀疑</text>
<defs><marker id="d1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#67b5ef"/></marker><marker id="d2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#e87a8a"/></marker></defs><text x="30" y="74" fill="#67b5ef" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">实时到账：钱一出去就不归你管了</text>
<rect x="30" y="86" width="150" height="52" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="105" y="118" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">确认转账</text>
<line x1="182" y1="112" x2="206" y2="112" stroke="#67b5ef" stroke-width="2" marker-end="url(#d1)"/><rect x="210" y="86" width="150" height="52" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="285" y="118" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">扣款</text>
<line x1="362" y1="112" x2="386" y2="112" stroke="#67b5ef" stroke-width="2" marker-end="url(#d1)"/><rect x="390" y="86" width="150" height="52" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="465" y="118" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">立刻入账</text>
<line x1="542" y1="112" x2="566" y2="112" stroke="#67b5ef" stroke-width="2" marker-end="url(#d1)"/><rect x="570" y="86" width="150" height="52" rx="6" fill="#16161f" stroke="#e87a8a" stroke-width="1.5"/>
<text x="645" y="118" fill="#e87a8a" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">不可撤回</text>
<text x="30" y="182" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">延时到账：钱先挂在中间，到点才落地</text>
<rect x="30" y="194" width="150" height="52" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="105" y="226" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">确认转账</text>
<line x1="182" y1="220" x2="206" y2="220" stroke="#67b5ef" stroke-width="2" marker-end="url(#d1)"/><rect x="210" y="194" width="150" height="52" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="285" y="226" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">扣款</text>
<line x1="362" y1="220" x2="386" y2="220" stroke="#67b5ef" stroke-width="2" marker-end="url(#d1)"/><rect x="390" y="194" width="180" height="52" rx="6" fill="#12121a" stroke="#8a8aa0" stroke-width="1.5"/>
<text x="480" y="218" fill="#8a8aa0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">挂起 2 小时 / 24 小时</text>
<text x="480" y="236" fill="#7a7a94" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱已扣，但还没到对方账上</text>
<line x1="572" y1="220" x2="596" y2="220" stroke="#67b5ef" stroke-width="2" marker-end="url(#d1)"/><rect x="600" y="194" width="140" height="52" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="670" y="226" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">到点入账</text>
<path d="M480,248 L480,278 L105,278 L105,250" fill="none" stroke="#e87a8a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#d2)"/><text x="300" y="298" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这段时间里可以撤回、可以报警、可以让银行冻结</text>
<rect x="30" y="316" width="700" height="56" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="50" y="340" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以银行 App 里那个「延时到账」选项，不是限制你，是给你留了一条退路</text>
<text x="50" y="360" fill="#e8965a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">骗子最怕的就是这个窗口——他们会催你「选实时」「快一点」，这不是巧合</text>
</svg>
