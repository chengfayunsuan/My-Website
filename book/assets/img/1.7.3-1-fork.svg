<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="450" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.7.3-1  fork 是在服务端复制一份，clone 是下载到本地</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你没有别人仓库的写权限，所以要先在自己名下复制一份，改完再请求他拉过去</text>
<rect x="60" y="92" width="240" height="96" rx="5" fill="#14141e" stroke="#b58ae8" stroke-width="1.4"/>
<text x="180" y="118" fill="#b58ae8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">原仓库</text>
<text x="180" y="138" fill="#7a7a92" font-size="8" text-anchor="middle" font-family="monospace">github.com/torvalds/linux</text>
<text x="180" y="160" fill="#8a6aa0" font-size="8.5" text-anchor="middle" font-family="monospace">upstream</text>
<text x="180" y="178" fill="#a8707c" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你没有写权限</text>
<rect x="580" y="92" width="240" height="96" rx="5" fill="#14141e" stroke="#67d9a0" stroke-width="1.4"/>
<text x="700" y="118" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">你 fork 的仓库</text>
<text x="700" y="138" fill="#7a7a92" font-size="8" text-anchor="middle" font-family="monospace">github.com/you/linux</text>
<text x="700" y="160" fill="#5f8a72" font-size="8.5" text-anchor="middle" font-family="monospace">origin</text>
<text x="700" y="178" fill="#6f8a7a" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你有全部权限</text>
<line x1="306" y1="128" x2="570" y2="128" stroke="#67d9a0" stroke-width="1.6"/>
<path d="M570,123 L582,128 L570,133 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<text x="438" y="118" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="monospace">fork</text>
<text x="438" y="146" fill="#6f8f7a" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">服务端复制，所有权归你</text>
<rect x="320" y="268" width="240" height="96" rx="5" fill="#14141e" stroke="#67b5ef" stroke-width="1.4"/>
<text x="440" y="294" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">你本地</text>
<text x="440" y="314" fill="#7a7a92" font-size="8" text-anchor="middle" font-family="monospace">git clone ...</text>
<text x="440" y="336" fill="#6a8090" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">origin → 你 fork 的那份</text>
<text x="440" y="354" fill="#6a8090" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">upstream → 原仓库</text>
<line x1="676" y1="194" x2="512" y2="264" stroke="#67b5ef" stroke-width="1.4"/>
<path d="M508,258 L496,270 L514,270 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<text x="614" y="236" fill="#67b5ef" font-size="9.5" text-anchor="start" font-family="monospace">clone</text>
<line x1="196" y1="194" x2="380" y2="264" stroke="#e8965a" stroke-width="1.4"/>
<path d="M376,258 L364,268 L384,272 Z" fill="#e8965a" stroke="#e8965a" stroke-width="1"/>
<text x="246" y="236" fill="#e8965a" font-size="9" text-anchor="start" font-family="monospace">fetch upstream</text>
<path d="M320,300 L40,300 L40,140 L52,140" fill="none" stroke="#e8b84b" stroke-width="1.4"/>
<path d="M52,135 L64,140 L52,145 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<text x="56" y="316" fill="#e8b84b" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">PR：请求把改动合进去</text>
<text x="30" y="388" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两个名字记一下：origin 是「你自己的那份」，upstream 是「人家的那份」。</text>
<text x="30" y="410" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「同步最新代码」不是从 origin 拉，而是 git fetch upstream 再合并 —— 拉自己那份永远拉不到别人的新提交。</text>
<text x="30" y="434" fill="#7a7a92" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">fork 出来的仓库和原仓库没有任何自动同步关系。这也是为什么长期不更新的 fork 会越差越远。</text>
</svg>
