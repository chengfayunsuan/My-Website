<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.1 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">微信零钱不是存款：你的钱躺在央行，微信只记了一笔账</text>
<rect x="24" y="96" width="176" height="104" rx="8" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="112" y="124" fill="#e8e8f2" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你</text>
<text x="112" y="152" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">零钱 100 元</text>
<text x="112" y="176" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扫码付出去</text>
<path d="M200,148 L250,148" fill="none" stroke="#8a8aa0" stroke-width="1.8"/>
<path d="M250,142 L260,148 L250,154 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="262" y="96" width="250" height="104" rx="8" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="387" y="124" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">微信支付</text>
<text x="387" y="152" fill="#cfcfe0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记一笔：欠你 100 元</text>
<text x="387" y="176" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这叫「预付价值」，不是存款</text>
<path d="M512,148 L562,148" fill="none" stroke="#8a8aa0" stroke-width="1.8"/>
<path d="M562,142 L572,148 L562,154 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="574" y="96" width="282" height="104" rx="8" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="715" y="124" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行 · 备付金账户</text>
<text x="715" y="152" fill="#cfcfe0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">真金白银 100 元，100% 存着</text>
<text x="715" y="176" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">微信不能拿它放贷、不能挪用</text>
<text x="24" y="246" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以：微信倒闭，你零钱里的钱还在；但零钱没有利息，也不受 50 万存款保险保护。</text>
<text x="24" y="274" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2017 年起，这笔钱被要求 100% 交存央行，就是为了防止支付机构拿用户的钱去冒险。</text>
</svg>
