<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">一笔跨行转账的五步：钱先出去，再进来</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中间那段「在途」是真实存在的时间，不是界面在转圈</text>
<defs><marker id="r1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#67b5ef"/></marker><marker id="r2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#e87a8a"/></marker></defs><rect x="20" y="86" width="132" height="74" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="86" y="114" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你</text>
<text x="86" y="138" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按确认，输入密码</text>
<line x1="154" y1="123" x2="168" y2="123" stroke="#67b5ef" stroke-width="2" marker-end="url(#r1)"/><rect x="170" y="86" width="132" height="74" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="236" y="114" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">付款行</text>
<text x="236" y="138" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扣你 500，记「在途」</text>
<line x1="304" y1="123" x2="318" y2="123" stroke="#67b5ef" stroke-width="2" marker-end="url(#r1)"/><rect x="320" y="86" width="132" height="74" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="386" y="114" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">清算系统</text>
<text x="386" y="138" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">清分 + 结算</text>
<line x1="454" y1="123" x2="468" y2="123" stroke="#67b5ef" stroke-width="2" marker-end="url(#r1)"/><rect x="470" y="86" width="132" height="74" rx="6" fill="#16161f" stroke="#b58ae8" stroke-width="1.5"/>
<text x="536" y="114" fill="#b58ae8" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">收款行</text>
<text x="536" y="138" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收到，准备入账</text>
<line x1="604" y1="123" x2="618" y2="123" stroke="#67b5ef" stroke-width="2" marker-end="url(#r1)"/><rect x="620" y="86" width="132" height="74" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="686" y="114" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">同学</text>
<text x="686" y="138" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">余额 +500</text>
<text x="380" y="186" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键：此时你的钱已经扣了，同学的账户还没加——这段时间它「在途」</text>
<path d="M676,164 L676,206 L86,206 L86,166" fill="none" stroke="#e87a8a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#r2)"/><text x="380" y="226" fill="#e87a8a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">如果收款账户已销户、账号填错、被风控拦下：钱原路退回，通常 1~3 个工作日</text>
<rect x="20" y="244" width="720" height="124" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="40" y="270" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">为什么会有「在途」这个状态</text>
<text x="40" y="294" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 两边是两套独立的账本，改账不能原子完成，只能先扣后加</text>
<text x="40" y="316" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 先扣是为了防止你在这几百毫秒里把钱花两次（双花）</text>
<text x="40" y="338" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 加不上就退回，所以任何跨行系统都必须有「冲正」这一手</text>
<text x="40" y="360" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 你看到的「处理中」，是真的在处理，不是装样子</text>
</svg>
