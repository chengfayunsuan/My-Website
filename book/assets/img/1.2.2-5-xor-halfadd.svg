<text x="360" y="330" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个 A、B 分两路：一路算「和」，一路算「进位」。</text>
<text x="360" y="350" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">A、B 都是 1 时，S=0、C=1 —— 正好是二进制 10。</text>
