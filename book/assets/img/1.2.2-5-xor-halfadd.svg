<text x="24" y="381" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">相同为 0，不同为 1 —— 所以叫「不等门」</text>
<text x="24" y="403" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">异或 = 1 位加法扔掉进位</text>
<text x="360" y="52" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">半加器：两只门，一次加法</text>
