<svg width="760" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="560" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">异或门与半加器：一个门管本位，一个门管进位</text>
