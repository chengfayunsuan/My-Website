<text x="74" y="68" fill="#b58ae8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">XOR</text>
<text x="160" y="115" fill="#b58ae8" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Y = A ⊕ B</text>
<text x="24" y="176" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">输入端那条额外的弧线，就是「异或」和「或」的唯一区别：</text>
<text x="24" y="194" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">多这一道，含义从「至少一个」变成「恰好一个」。</text>
