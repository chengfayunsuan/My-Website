<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 448" width="880" height="448" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="448" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.5-4  人民币中间价是怎么算出来的</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它不是「市场供求的自由价格」，也不是「央行拍脑袋定的数字」，是三个输入的加权结果</text>
<rect x="50" y="88" width="220" height="84" rx="4" fill="#1a2434" stroke="#67b5ef" stroke-width="1.3"/>
<text x="160" y="112" fill="#67b5ef" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">昨日收盘价</text>
<text x="160" y="136" fill="#8a8aa2" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">市场供求的结果</text>
<text x="160" y="154" fill="#8a8aa2" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前一天 16:30 的成交价</text>
<line x1="160" y1="174" x2="160" y2="206" stroke="#67b5ef" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="330" y="88" width="220" height="84" rx="4" fill="#2a2410" stroke="#e8b84b" stroke-width="1.3"/>
<text x="440" y="112" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">一篮子货币变动</text>
<text x="440" y="136" fill="#8a8aa2" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欧元、日元涨了，</text>
<text x="440" y="154" fill="#8a8aa2" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人民币不该跟着跌</text>
<line x1="440" y1="174" x2="440" y2="206" stroke="#e8b84b" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="610" y="88" width="220" height="84" rx="4" fill="#201a2e" stroke="#b58ae8" stroke-width="1.3"/>
<text x="720" y="112" fill="#b58ae8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">逆周期因子</text>
<text x="720" y="136" fill="#8a8aa2" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">抑制「越跌越卖」的</text>
<text x="720" y="154" fill="#8a8aa2" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">顺周期情绪</text>
<line x1="720" y1="174" x2="720" y2="206" stroke="#b58ae8" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="160" y1="206" x2="720" y2="206" stroke="#4a4a66" stroke-width="1.2"/>
<line x1="440" y1="206" x2="440" y2="226" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M435,226 L440,236 L445,226 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<rect x="280" y="236" width="320" height="72" rx="5" fill="#1e1e30" stroke="#e8965a" stroke-width="1.5"/>
<text x="440" y="262" fill="#e8965a" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">中间价</text>
<text x="440" y="284" fill="#8a7a62" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每天 9:15 公布，全天不变</text>
<line x1="440" y1="308" x2="440" y2="330" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M435,330 L440,340 L445,330 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<rect x="280" y="340" width="320" height="68" rx="5" fill="#16281c" stroke="#67d9a0" stroke-width="1.5"/>
<text x="440" y="366" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">市场价：中间价 ±2%</text>
<text x="440" y="388" fill="#7a9a8a" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">超出这个范围，央行就要出手</text>
<text x="40" y="428" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以人民币汇率是「有管理的浮动」：方向由市场定，速度由央行控。这套机制 2015 年之后又加了逆周期因子，用来对冲恐慌性抛售。</text>
</svg>
