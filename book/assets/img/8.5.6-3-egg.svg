<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">8.5.6-3 / 个人层面是个死结，公司层面不是</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个地址，换个身份去证明，难度完全不同</text>
<text x="24" y="84" fill="#8a6a72" font-size="10.5" text-anchor="start" font-family="monospace">个人层面</text>
<rect x="60" y="96" width="224" height="70" rx="6" fill="#1d1519" stroke="#e87a8a" stroke-width="1.2"/>
<text x="172.0" y="122" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开美国银行账户</text>
<text x="172.0" y="142" fill="#8a6a72" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要：美国地址 + 地址证明</text>
<rect x="396" y="96" width="224" height="70" rx="6" fill="#1d1519" stroke="#e87a8a" stroke-width="1.2"/>
<text x="508.0" y="122" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">拿到美国地址证明</text>
<text x="508.0" y="142" fill="#8a6a72" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最方便：美国银行对账单</text>
<line x1="284" y1="122" x2="394" y2="122" stroke="#e87a8a" stroke-width="1.6"/>
<path d="M 386 116 L 395 122 L 386 128 Z" fill="#e87a8a" stroke="#e87a8a" stroke-width="1"/>
<line x1="396" y1="144" x2="286" y2="144" stroke="#5a3a44" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M 294 138 L 285 144 L 294 150 Z" fill="#5a3a44" stroke="#5a3a44" stroke-width="1"/>
<line x1="24" y1="200" x2="656" y2="200" stroke="#2e2e44" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="238" y="188" width="204" height="24" rx="12" fill="#12121a" stroke="#2e2e44" stroke-width="1"/>
<text x="340" y="204" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换一层：公司不用这个地址</text>
<rect x="24" y="234" width="196" height="88" rx="6" fill="#16241c" stroke="#2f4a3c" stroke-width="1.2"/>
<text x="38" y="258" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">① 代理地址注册</text>
<text x="38" y="280" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">州政府档案里记的就是它</text>
<text x="38" y="300" fill="#6a6a84" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代收法院传票是法定义务</text>
<line x1="220" y1="278.0" x2="236" y2="278.0" stroke="#3a3a52" stroke-width="1.6"/>
<path d="M 229 273 L 237 278 L 229 283 Z" fill="#3a3a52" stroke="#3a3a52" stroke-width="1"/>
<rect x="240" y="234" width="196" height="88" rx="6" fill="#16241c" stroke="#2f4a3c" stroke-width="1.2"/>
<text x="254" y="258" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">② 州政府出文件</text>
<text x="254" y="280" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">成立证明 / 年报回执</text>
<text x="254" y="300" fill="#6a6a84" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">上面写着完整地址</text>
<line x1="436" y1="278.0" x2="452" y2="278.0" stroke="#3a3a52" stroke-width="1.6"/>
<path d="M 445 273 L 453 278 L 445 283 Z" fill="#3a3a52" stroke="#3a3a52" stroke-width="1"/>
<rect x="456" y="234" width="196" height="88" rx="6" fill="#16241c" stroke="#2f4a3c" stroke-width="1.2"/>
<text x="470" y="258" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">③ 这份就是证明</text>
<text x="470" y="280" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开户、支付、年检全认</text>
<text x="470" y="300" fill="#6a6a84" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不需要任何账单</text>
<text x="24" y="356" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两层的区别在于“谁来证明”：个人要靠机构出的账单，公司靠政府出的档案。</text>
<text x="24" y="378" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以公司地址能自己做主，个人地址不能——个人那条路上，标准答案是别硬追美国地址，</text>
<text x="24" y="398" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用真实住址加护照，多数机构接受，只是要翻译或公证。</text>
<text x="24" y="428" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">顺序排对了，每一步都是拿上一步的产物去换；排错了，每条路都卡在同一个地方。</text>
</svg>
