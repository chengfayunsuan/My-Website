<svg width="880" height="386" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 386" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="386" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">系统盯的是什么：五条典型监测规则</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不看金额只看「像不像坏人」的交易形态。</text>
<rect x="40" y="90" width="320" height="40" rx="5" fill="#15151f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="56" y="115" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">分散转入、集中转出</text>
<text x="388" y="115" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一天收到几十笔小额，几小时内归集转走</text>
<text x="688" y="115" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 典型跑分特征</text>
<rect x="40" y="140" width="320" height="40" rx="5" fill="#15151f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="56" y="165" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">快进快出</text>
<text x="388" y="165" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱到账几分钟内转走，账户日均余额趋近于零</text>
<text x="688" y="165" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 过渡账户特征</text>
<rect x="40" y="190" width="320" height="40" rx="5" fill="#15151f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="56" y="215" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">夜间占比突增</text>
<text x="388" y="215" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">深夜 0–5 点交易量超过全天的六成</text>
<text x="688" y="215" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 正常生意很少这样</text>
<rect x="40" y="240" width="320" height="40" rx="5" fill="#15151f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="56" y="265" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">对手方暴增</text>
<text x="388" y="265" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个月新增上百个无关联交易对手</text>
<text x="688" y="265" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 账户被外部利用</text>
<rect x="40" y="290" width="320" height="40" rx="5" fill="#15151f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="56" y="315" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">睡眠户突醒</text>
<text x="388" y="315" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两年不动的卡突然大额进出</text>
<text x="688" y="315" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 风控模型最高危形态</text>
<text x="40" y="356" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">命中不等于定罪。大多数情况下只是触发人工复核，先降限额、缓结算；确认异常才升级到报告和冻结。</text>
</svg>
