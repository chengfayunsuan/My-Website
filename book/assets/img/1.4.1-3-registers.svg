<svg width="780" height="430" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">同一个寄存器的五个名字：rax / eax / ax / ah / al</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是别名，是同一块物理存储上不同宽度的窗口；宽度按位等比画，右边是出现年代</text>
<line x1="148.0" y1="88" x2="148.0" y2="330" stroke="#1e1e2e" stroke-width="1"/>
<line x1="212.0" y1="88" x2="212.0" y2="330" stroke="#1e1e2e" stroke-width="1"/>
<line x1="276.0" y1="88" x2="276.0" y2="330" stroke="#1e1e2e" stroke-width="1"/>
<line x1="340.0" y1="88" x2="340.0" y2="330" stroke="#1e1e2e" stroke-width="1"/>
<line x1="404.0" y1="88" x2="404.0" y2="330" stroke="#1e1e2e" stroke-width="1"/>
<line x1="468.0" y1="88" x2="468.0" y2="330" stroke="#1e1e2e" stroke-width="1"/>
<line x1="532.0" y1="88" x2="532.0" y2="330" stroke="#1e1e2e" stroke-width="1"/>
<line x1="596.0" y1="88" x2="596.0" y2="330" stroke="#1e1e2e" stroke-width="1"/>
<line x1="660.0" y1="88" x2="660.0" y2="330" stroke="#1e1e2e" stroke-width="1"/>
<rect x="148" y="96" width="512.0" height="42" rx="3" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="404.0" y="123" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">rax</text>
<text x="134" y="117" fill="#67b5ef" font-size="12" text-anchor="end" font-family="monospace">rax</text>
<text x="134" y="132" fill="#5f5f78" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">64 位</text>
<text x="756" y="123" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2003　x86-64</text>
<rect x="148" y="158" width="256.0" height="42" rx="3" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="276.0" y="185" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">eax</text>
<text x="134" y="179" fill="#67d9a0" font-size="12" text-anchor="end" font-family="monospace">eax</text>
<text x="134" y="194" fill="#5f5f78" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">32 位</text>
<text x="756" y="185" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1985　80386</text>
<rect x="148" y="220" width="128.0" height="42" rx="3" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="212.0" y="247" fill="#e8b84b" font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">ax</text>
<text x="134" y="241" fill="#e8b84b" font-size="12" text-anchor="end" font-family="monospace">ax</text>
<text x="134" y="256" fill="#5f5f78" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">16 位</text>
<text x="756" y="247" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1978　8086</text>
<rect x="148" y="282" width="64.0" height="42" rx="3" fill="#16161f" stroke="#e8965a" stroke-width="1.5"/>
<text x="180.0" y="309" fill="#e8965a" font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">al</text>
<text x="134" y="303" fill="#e8965a" font-size="12" text-anchor="end" font-family="monospace">al</text>
<text x="134" y="318" fill="#5f5f78" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">8 位</text>
<text x="756" y="309" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1978　8086</text>
<rect x="212.0" y="282" width="64.0" height="42" rx="3" fill="#16161f" stroke="#b58ae8" stroke-width="1.5"/>
<text x="244.0" y="309" fill="#b58ae8" font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">ah</text>
<text x="756" y="309" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1978　8086</text>
<line x1="404.0" y1="88" x2="404.0" y2="200" stroke="#e87a8a" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="412.0" y="84" fill="#e87a8a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">写 eax 时，这条线以右被强制清零</text>
<text x="148" y="350" fill="#4e4e66" font-size="9" text-anchor="middle" font-family="monospace">0</text>
<text x="276.0" y="350" fill="#4e4e66" font-size="9" text-anchor="middle" font-family="monospace">15</text>
<text x="404.0" y="350" fill="#4e4e66" font-size="9" text-anchor="middle" font-family="monospace">31</text>
<text x="660.0" y="350" fill="#4e4e66" font-size="9" text-anchor="middle" font-family="monospace">63</text>
<line x1="148" y1="340" x2="660.0" y2="340" stroke="#2a2a3e" stroke-width="1"/>
<rect x="36" y="368" width="708" height="46" rx="4" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="52" y="388" fill="#b0b0c8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">写 eax 会清零高 32 位（64 位模式的新规则）；写 ax、al、ah 只改自己那几位（8086 的老语义，不能改）。</text>
<text x="52" y="406" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以 xor eax, eax 是清零整个 rax 的最短写法：2 字节，而 mov eax, 0 要 5 字节。</text>
</svg>
