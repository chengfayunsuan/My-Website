  <text x="40" y="308" fill="#6b6b85" font-size="8.5">每秒取多少个点，叫采样率</text>
  <text x="416" y="308" fill="#6b6b85" font-size="8.5">每级多高，叫位深。8 级 = 3 位；65536 级 = 16 位</text>
  <line x1="30" y1="330" x2="730" y2="330" stroke="#2a2a3c"/>
  <text x="30" y="350" fill="#d8d8e4" font-size="9">切得越细，越接近原曲线，也越占空间。整个数字音频和图像，都是在这两刀上做取舍。</text>
  <text x="30" y="368" fill="#9a9ab4" font-size="8.5">注意：两刀缺一不可。只采样不量化，得到的是无限精度的小数；只量化不采样，得到的是无限长的一串数。</text>
  <text x="30" y="386" fill="#6b6b85" font-size="8.5">采样出问题会产生「混叠」（假频率），量化出问题会产生「噪声」（沙沙声）。两类故障，两套治法。</text>
  <text x="40" y="404" fill="#e8c47a" font-size="8.5">圆点是采样点；注意它并不总落在波峰上</text>
  <text x="416" y="404" fill="#e8c47a" font-size="8.5">阶梯与原曲线的差，就是量化误差</text>
