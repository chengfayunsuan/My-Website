<text x="355" y="124" fill="#c8c8dc" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">SR</text>
<text x="355" y="144" fill="#8a8aa4" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">锁存器</text>
<text x="355" y="172" fill="#4a4a62" font-size="9" text-anchor="middle" font-family="monospace">1.2.4-2</text>
<text x="355" y="188" fill="#4a4a62" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">那个电路</text>
<line x1="410" y1="121" x2="520" y2="121" stroke="#67d9a0" stroke-width="2"/>
<text x="528" y="126" fill="#67d9a0" font-size="15" text-anchor="start" font-family="monospace" font-weight="bold">Q</text>
<line x1="410" y1="222" x2="470" y2="222" stroke="#67b5ef" stroke-width="2"/>
<text x="478" y="227" fill="#67b5ef" font-size="13" text-anchor="start" font-family="monospace">Q̄</text>
<text x="572" y="116" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">EN=1：两个与门都开门，</text>
<text x="572" y="134" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">D 的值直接改写状态，</text>
<text x="572" y="152" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Q 跟着 D 走 → 透明</text>
<text x="572" y="196" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">EN=0：两个与门都封死，</text>
<text x="572" y="214" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">S=R=0，环自己维持，</text>
<text x="572" y="232" fill="#67b5ef" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Q 停在原地 → 锁存</text>
<text x="24" y="300" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">同样的输入，两种命运</text>
<rect x="72" y="354" width="356.16" height="160" rx="0" fill="#1a2a22" stroke="none" stroke-width="0"/>
<rect x="428.16" y="354" width="279.84" height="160" rx="0" fill="#1a1a26" stroke="none" stroke-width="0"/>
<line x1="428.16" y1="350" x2="428.16" y2="514" stroke="#4a4a66" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="250.08" y="338" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">透明期：Q 跟着 D 变</text>
<text x="568.08" y="338" fill="#8a8aa4" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">锁存期：Q 冻住，D 怎么变都没用</text>
<text x="24" y="377" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="monospace">EN</text>
