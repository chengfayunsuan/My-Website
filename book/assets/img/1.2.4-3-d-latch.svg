<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.2.4-3  门控 D 锁存器：一根线就够了</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">EN 是闸门：开着的时候它像根导线（透明），关上的时候它是个存储器（锁存）</text>
