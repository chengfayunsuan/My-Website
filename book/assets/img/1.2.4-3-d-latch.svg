<text x="24" y="429" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="monospace">D</text>
<line x1="72" y1="424" x2="708" y2="424" stroke="#26263a" stroke-width="1"/>
<path d="M72,424 L161.04000000000002,424 L161.04000000000002,424 L161.04000000000002,424 L161.04000000000002,398 L262.79999999999995,398 L262.79999999999995,398 L262.79999999999995,398 L262.79999999999995,424 L364.56,424 L364.56,424 L364.56,424 L364.56,398 L453.59999999999997,398 L453.59999999999997,398 L453.59999999999997,398 L453.59999999999997,424 L529.92,424 L529.92,424 L529.92,424 L529.92,398 L708,398 L708,398" fill="none" stroke="#e8b84b" stroke-width="2.4"/>
<text x="24" y="481" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="monospace">Q</text>
