<path d="M72,476 L161.04000000000002,476 L161.04000000000002,476 L161.04000000000002,476 L161.04000000000002,450 L262.79999999999995,450 L262.79999999999995,450 L262.79999999999995,450 L262.79999999999995,476 L364.56,476 L364.56,476 L364.56,476 L364.56,450 L708,450 L708,450" fill="none" stroke="#67d9a0" stroke-width="2.4"/>
<line x1="453.59999999999997" y1="424" x2="453.59999999999997" y2="398" stroke="#e87a8a" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="529.92" y1="424" x2="529.92" y2="398" stroke="#e87a8a" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="491.76000000000005" y="390" fill="#e87a8a" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">D 在这里又变了</text>
<text x="491.76000000000005" y="442" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Q 一动不动</text>
<line x1="24" y1="536" x2="736" y2="536" stroke="#2a2a3e" stroke-width="1"/>
<text x="24" y="556" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">问题也在这里：透明期里 D 翻几次，Q 就跟着翻几次。它不是「记录一个瞬间」，而是「记录一整段」。</text>
</svg>
