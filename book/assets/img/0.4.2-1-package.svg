<svg width="760" height="440" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="440" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">数据走多远，决定它有多快、多费电</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">左边：内存和显卡各在板子一头。右边：全在一个封装里</text>

  <!-- ============ 左：传统 ============ -->
  <text x="40" y="80" fill="#9fd4f5" font-size="10">传统笔记本主板</text>
  <rect x="40" y="90" width="330" height="220" rx="5" fill="#12121c" stroke="#2a2a44"/>

  <!-- CPU -->
  <rect x="70" y="110" width="76" height="60" rx="3" fill="#1b2740" stroke="#67b5ef"/>
  <text x="108" y="135" fill="#9fd4f5" font-size="9" text-anchor="middle">CPU</text>
  <text x="108" y="150" fill="#6b6b85" font-size="7.5" text-anchor="middle">SoC</text>

  <!-- 内存条 -->
  <rect x="196" y="106" width="20" height="70" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
  <rect x="228" y="106" width="20" height="70" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="222" y="99" fill="#cfc6ff" font-size="8" text-anchor="middle">内存条（插槽 · 走线 5–10 cm）</text>

  <!-- PCIe + GPU -->
  <rect x="70" y="230" width="280" height="46" rx="3" fill="#3a1e26" stroke="#f0606a"/>
  <text x="210" y="250" fill="#f0a0aa" font-size="9" text-anchor="middle">独立显卡（自带显存）</text>
  <text x="210" y="266" fill="#6b6b85" font-size="7.5" text-anchor="middle">GDDR6 · 焊在显卡上</text>

  <!-- PCIe 线 -->
  <path d="M108,172 L108,228" stroke="#e8b84b" stroke-width="2"/>
  <text x="120" y="198" fill="#e8b84b" font-size="8">PCIe 4.0 ×16 · 32 GB/s</text>
  <text x="120" y="214" fill="#6b6b85" font-size="7">数据要在这里来回两趟</text>

  <!-- ============ 中间 ============ -->
  <path d="M382,198 L410,198" stroke="#e8b84b" stroke-width="1.4" marker-end="url(#g1)"/>
  <defs>
    <marker id="g1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1,0.5 L6,3.5 L1,6.5 z" fill="#e8b84b"/>
    </marker>
  </defs>
  <text x="396" y="188" fill="#e8b84b" font-size="8" text-anchor="middle">收进</text>
  <text x="396" y="212" fill="#e8b84b" font-size="8" text-anchor="middle">封装</text>

  <!-- ============ 右：M1 ============ -->
  <text x="428" y="80" fill="#9fe0c9" font-size="10">M1 的封装</text>
  <rect x="428" y="90" width="308" height="220" rx="5" fill="#12121c" stroke="#4ec9a3"/>

  <!-- 基板 -->
  <rect x="444" y="112" width="276" height="144" rx="4" fill="#171725" stroke="#33334a"/>
  <text x="582" y="104" fill="#6b6b85" font-size="7.5" text-anchor="middle">封装基板（走线几毫米）</text>

  <!-- 内存颗粒 -->
  <rect x="456" y="126" width="34" height="92" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
  <rect x="496" y="126" width="34" height="92" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="493" y="176" fill="#cfc6ff" font-size="7.5" text-anchor="middle">LPDDR</text>

  <!-- SoC die -->
  <rect x="552" y="126" width="152" height="92" rx="3" fill="#1b2740" stroke="#67b5ef"/>
  <text x="628" y="146" fill="#9fd4f5" font-size="9" text-anchor="middle">SoC</text>

  <g fill="#232338" stroke="#6b8fd4">
    <rect x="564" y="156" width="42" height="22" rx="1"/>
    <rect x="612" y="156" width="42" height="22" rx="1"/>
    <rect x="660" y="156" width="32" height="22" rx="1"/>
  </g>
  <g fill="#9a9ab4" font-size="6.5" text-anchor="middle">
    <text x="585" y="170">CPU</text>
    <text x="633" y="170">GPU</text>
    <text x="676" y="170">NPU</text>
  </g>
  <rect x="564" y="186" width="128" height="20" rx="1" fill="#20303a" stroke="#4ec9a3"/>
  <text x="628" y="200" fill="#9fe0c9" font-size="7" text-anchor="middle">内存控制器 + 统一缓存</text>

  <!-- 连线 -->
  <g stroke="#4ec9a3" stroke-width="1.4">
    <line x1="490" y1="160" x2="552" y2="160"/>
    <line x1="490" y1="186" x2="552" y2="186"/>
  </g>
  <text x="582" y="244" fill="#4ec9a3" font-size="8" text-anchor="middle">没有 PCIe，没有显存，没有第二块内存</text>

  <!-- 下方说明 -->
  <line x1="24" y1="330" x2="736" y2="330" stroke="#2a2a44"/>

  <text x="24" y="352" fill="#d8d8e4" font-size="10.5">省掉的不只是距离</text>

  <text x="24" y="374" fill="#e8b84b" font-size="9">左边一次「GPU 处理」= 读内存 → 写缓冲 → 过 PCIe → 写显存 → 算 → 原路返回。两次跨总线，两次写入。</text>
  <text x="24" y="394" fill="#9a9ab4" font-size="9">右边：GPU 直接读同一块内存，算完写回。没有搬运，没有第二份拷贝。</text>

  <rect x="24" y="404" width="712" height="26" rx="4" fill="#171725" stroke="#2a2a44"/>
  <text x="38" y="421" fill="#cfc6ff" font-size="8.5">代价：内存焊死在封装里，买多少就是多少；坏一个件要换整块主板。</text>
</svg>
