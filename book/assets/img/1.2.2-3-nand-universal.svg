<line x1="616" y1="322" x2="624" y2="322" stroke="#c8c8dc" stroke-width="2"/>
<rect x="624" y="288" width="56" height="44" fill="#232338" stroke="#67d9a0" stroke-width="2" rx="6"/>
<text x="652.0" y="315.0" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">NAND</text>
<line x1="680" y1="310" x2="698" y2="310" stroke="#c8c8dc" stroke-width="2"/>
<text x="698" y="315" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">A+B</text>
<text x="612" y="392" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¬A、¬B 再与非：</text>
<text x="612" y="410" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¬(¬A·¬B) = A+B</text>
<text x="624" y="442" fill="#67d9a0" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">= 或门（OR）</text>
<text x="624" y="466" fill="#7a7a94" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">德摩根定律出手</text>
<text x="24" y="556" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结论：与非门是「完备」的——任何真值表都能只靠它搭出来，包括整台 CPU。</text>
<text x="24" y="578" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价是每种门都要多花几只管子；所以真实芯片是「NAND 为主，复合门打配合」。</text>
</svg>
