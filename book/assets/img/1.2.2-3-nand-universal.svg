<text x="574.0" y="276.0" fill="#b58ae8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">NAND</text>
<line x1="598" y1="271" x2="608" y2="271" stroke="#c8c8dc" stroke-width="2"/>
