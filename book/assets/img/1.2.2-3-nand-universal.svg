<rect x="550" y="334" width="48" height="34" fill="#232338" stroke="#b58ae8" stroke-width="2" rx="6"/>
<text x="574.0" y="356.0" fill="#b58ae8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">NAND</text>
<line x1="598" y1="351" x2="608" y2="351" stroke="#c8c8dc" stroke-width="2"/>
<line x1="608" y1="271" x2="616" y2="271" stroke="#c8c8dc" stroke-width="2"/>
