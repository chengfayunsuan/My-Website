<line x1="58" y1="314" x2="80" y2="314" stroke="#c8c8dc" stroke-width="2"/>
<rect x="80" y="272" width="70" height="52" fill="#232338" stroke="#e8b84b" stroke-width="2" rx="6"/>
<text x="115.0" y="303.0" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">NAND</text>
<line x1="150" y1="300" x2="174" y2="300" stroke="#c8c8dc" stroke-width="2"/>
<text x="180" y="305" fill="#67d9a0" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">¬A</text>
<text x="136" y="352" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两个输入接同一个信号：</text>
<text x="136" y="372" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">A·A = A，再取反 = ¬A</text>
<text x="136" y="420" fill="#e87a8a" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">= 非门（NOT）</text>
<text x="136" y="446" fill="#7a7a94" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一只门就是一个非门</text>
<line x1="282" y1="300" x2="298" y2="300" stroke="#c8c8dc" stroke-width="2"/>
<text x="276" y="296" fill="#67d9a0" font-size="13" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">A</text>
<line x1="282" y1="318" x2="296" y2="318" stroke="#c8c8dc" stroke-width="2"/>
<text x="276" y="322" fill="#67d9a0" font-size="13" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">B</text>
<line x1="298" y1="300" x2="298" y2="318" stroke="#c8c8dc" stroke-width="2"/>
<line x1="298" y1="300" x2="306" y2="300" stroke="#c8c8dc" stroke-width="2"/>
<line x1="298" y1="318" x2="306" y2="318" stroke="#c8c8dc" stroke-width="2"/>
<rect x="306" y="296" width="62" height="44" fill="#232338" stroke="#67b5ef" stroke-width="2" rx="6"/>
<text x="337.0" y="323.0" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">NAND</text>
<line x1="368" y1="318" x2="380" y2="318" stroke="#c8c8dc" stroke-width="2"/>
<circle cx="380" cy="318" r="2.5" fill="#8a8aa0"/>
<line x1="380" y1="318" x2="380" y2="306" stroke="#c8c8dc" stroke-width="2"/>
<line x1="380" y1="306" x2="394" y2="306" stroke="#c8c8dc" stroke-width="2"/>
<line x1="380" y1="318" x2="380" y2="330" stroke="#c8c8dc" stroke-width="2"/>
<line x1="380" y1="330" x2="394" y2="330" stroke="#c8c8dc" stroke-width="2"/>
<rect x="394" y="296" width="58" height="44" fill="#232338" stroke="#67b5ef" stroke-width="2" rx="6"/>
<text x="423.0" y="323.0" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">NAND</text>
<line x1="452" y1="318" x2="468" y2="318" stroke="#c8c8dc" stroke-width="2"/>
<text x="460" y="323" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">A·B</text>
<text x="380" y="372" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一只算 ¬(A·B)，</text>
<text x="380" y="390" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第二只把它反回来</text>
<text x="380" y="420" fill="#67b5ef" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">= 与门（AND）</text>
<text x="380" y="446" fill="#7a7a94" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">共 8 只管，比直接做贵</text>
<line x1="526" y1="270" x2="538" y2="270" stroke="#c8c8dc" stroke-width="2"/>
<text x="520" y="266" fill="#67d9a0" font-size="12" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">A</text>
