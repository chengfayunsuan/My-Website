<text x="461.0" y="151" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">1</text>
<rect x="492" y="135" width="62" height="23" fill="#14141e" stroke="#2f2f45" stroke-width="0.8"/>
<text x="523.0" y="151" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">0</text>
<rect x="554" y="135" width="62" height="23" fill="#14141e" stroke="#2f2f45" stroke-width="0.8"/>
<text x="585.0" y="151" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">1</text>
