<text x="585.0" y="174" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="monospace">0</text>
<rect x="24" y="206" width="224" height="296" fill="#12121c" stroke="#2f2f45" stroke-width="1.2" rx="6"/>
<text x="38" y="230" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">① 短接两个输入</text>
<rect x="268" y="206" width="224" height="296" fill="#12121c" stroke="#2f2f45" stroke-width="1.2" rx="6"/>
<text x="282" y="230" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">② NAND 后面再串一只</text>
<rect x="512" y="206" width="224" height="296" fill="#12121c" stroke="#2f2f45" stroke-width="1.2" rx="6"/>
<text x="526" y="230" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">③ 三只拼出或门</text>
<line x1="38" y1="300" x2="58" y2="300" stroke="#c8c8dc" stroke-width="2"/>
<text x="32" y="296" fill="#67d9a0" font-size="13" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">A</text>
