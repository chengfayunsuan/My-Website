<svg width="760" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="600" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">一种与非门，搭出所有门</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每块方框是一只二输入 NAND：4 只管（2 只 NMOS 串联 + 2 只 PMOS 并联）</text>
<line x1="30" y1="108" x2="60" y2="108" stroke="#c8c8dc" stroke-width="2"/>
<line x1="30" y1="132" x2="60" y2="132" stroke="#c8c8dc" stroke-width="2"/>
<path d="M60,90 L88,90 A30,30 0 0 1 88,150 L60,150 Z" fill="#1e1e30" stroke="#8a8aa0" stroke-width="2"/>
<circle cx="123" cy="120" r="6" fill="#14141e" stroke="#8a8aa0" stroke-width="2"/>
<line x1="129" y1="120" x2="160" y2="120" stroke="#c8c8dc" stroke-width="2"/>
<text x="56" y="80" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">NAND</text>
<text x="180" y="112" fill="#e8b84b" font-size="15" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Y = ¬(A · B)</text>
<text x="180" y="136" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只有 A、B 全 1 时，输出才是 0</text>
