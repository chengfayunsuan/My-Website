<svg width="760" height="486" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="486" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">两种降压办法，效率差十七倍</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">一个把多余的电压烧掉，一个把电压切成小段再拼回去</text>

  <!-- ============ 左：线性 ============ -->
  <rect x="24" y="64" width="344" height="204" rx="8" fill="#171725" stroke="#3a2430"/>
  <text x="42" y="88" fill="#f0606a" font-size="11.5">线性稳压：多余的电压全烧在电阻上</text>

  <text x="42" y="122" fill="#9a9ab4" font-size="11">220 V</text>
  <line x1="84" y1="118" x2="102" y2="118" stroke="#9a9ab4" stroke-width="1.2"/>
  <rect x="102" y="104" width="48" height="28" rx="2" fill="#232338" stroke="#f0606a"/>
  <text x="126" y="122" fill="#f0606a" font-size="10" text-anchor="middle">R</text>
  <line x1="150" y1="118" x2="196" y2="118" stroke="#9a9ab4" stroke-width="1.2"/>
  <text x="202" y="114" fill="#9fd4f5" font-size="11">12 V</text>
  <text x="202" y="128" fill="#6b6b85" font-size="9">120 W</text>

  <text x="42" y="152" fill="#6b6b85" font-size="9">压差 208 V，电流 10 A，电阻上要烧掉 2080 W</text>

  <line x1="42" y1="166" x2="350" y2="166" stroke="#2a2a44"/>
  <text x="42" y="186" fill="#9a9ab4" font-size="9.5">送出去 120 W，先烧掉 2080 W</text>
  <text x="42" y="204" fill="#9a9ab4" font-size="9.5">效率上限 = 12 ÷ 232 ≈ 5.5%</text>
  <text x="42" y="222" fill="#6b6b85" font-size="9">所以它只能用在压差很小的地方：5V→3.3V、1.25V→1.2V</text>

  <rect x="42" y="234" width="300" height="14" rx="2" fill="#232338"/>
  <rect x="42" y="234" width="17" height="14" rx="2" fill="#f0606a"/>
  <text x="66" y="245" fill="#f0606a" font-size="9">5.5%</text>
  <text x="300" y="245" fill="#6b6b85" font-size="8.5" text-anchor="end">剩下的 94.5% 全是热</text>

  <!-- ============ 右：开关 ============ -->
  <rect x="392" y="64" width="344" height="204" rx="8" fill="#171725" stroke="#22384a"/>
  <text x="410" y="88" fill="#4ec9a3" font-size="11.5">开关稳压：只用「全通」和「全断」</text>

  <text x="410" y="122" fill="#9a9ab4" font-size="11">400 V</text>
  <line x1="452" y1="118" x2="468" y2="118" stroke="#9a9ab4" stroke-width="1.2"/>
  <rect x="468" y="104" width="32" height="28" rx="2" fill="#20303a" stroke="#4ec9a3"/>
  <text x="484" y="122" fill="#9fe0c9" font-size="9" text-anchor="middle">MOS</text>
  <line x1="500" y1="118" x2="518" y2="118" stroke="#9a9ab4" stroke-width="1.2"/>
  <path d="M518,118 a7,7 0 0 1 14,0 a7,7 0 0 1 14,0 a7,7 0 0 1 14,0" fill="none" stroke="#e8b84b" stroke-width="1.4"/>
  <line x1="560" y1="118" x2="596" y2="118" stroke="#9a9ab4" stroke-width="1.2"/>
  <line x1="596" y1="104" x2="596" y2="132" stroke="#9a9ab4" stroke-width="1.6"/>
  <line x1="604" y1="104" x2="604" y2="132" stroke="#9a9ab4" stroke-width="1.6"/>
  <line x1="604" y1="118" x2="634" y2="118" stroke="#9a9ab4" stroke-width="1.2"/>
  <text x="640" y="114" fill="#9fd4f5" font-size="11">12 V</text>
  <text x="640" y="128" fill="#6b6b85" font-size="9">425 W</text>

  <text x="410" y="152" fill="#6b6b85" font-size="9">导通时管子内阻 2 毫欧，10 A 下只损耗 0.2 W</text>

  <line x1="410" y1="166" x2="718" y2="166" stroke="#2a2a44"/>
  <text x="410" y="186" fill="#9a9ab4" font-size="9.5">导通：I²R = 100 × 0.002 = 0.2 W</text>
  <text x="410" y="204" fill="#9a9ab4" font-size="9.5">关断：电流为零，损耗 = U × 0 = 0 W</text>
  <text x="410" y="222" fill="#6b6b85" font-size="9">只有切换的那一瞬间，电压和电流同时存在，才疼一下</text>

  <rect x="410" y="234" width="300" height="14" rx="2" fill="#232338"/>
  <rect x="410" y="234" width="276" height="14" rx="2" fill="#4ec9a3"/>
  <text x="418" y="245" fill="#0e0e16" font-size="9">损失 8%　·　其余 92% 送到负载</text>

  <!-- ============ 下：占空比 ============ -->
  <line x1="24" y1="292" x2="736" y2="292" stroke="#2a2a44"/>
  <text x="24" y="314" fill="#d8d8e4" font-size="11.5">占空比 D：一个周期里「开」占多大比例，就输出多少电压</text>

  <g>
    <text x="60" y="328" fill="#9fd4f5" font-size="10">D = 25%</text>
    <polyline points="60,378 60,338 97,338 97,378 210,378" fill="none" stroke="#67b5ef" stroke-width="1.8"/>
    <line x1="60" y1="378" x2="210" y2="378" stroke="#4a4a68" stroke-width="1"/>
    <text x="60" y="394" fill="#6b6b85" font-size="9">Vout ≈ 12 × 0.25 = 3 V</text>
  </g>

  <g>
    <text x="300" y="328" fill="#9fd4f5" font-size="10">D = 50%</text>
    <polyline points="300,378 300,338 375,338 375,378 450,378" fill="none" stroke="#67b5ef" stroke-width="1.8"/>
    <line x1="300" y1="378" x2="450" y2="378" stroke="#4a4a68" stroke-width="1"/>
    <text x="300" y="394" fill="#6b6b85" font-size="9">Vout ≈ 12 × 0.50 = 6 V</text>
  </g>

  <g>
    <text x="540" y="328" fill="#9fd4f5" font-size="10">D = 75%</text>
    <polyline points="540,378 540,338 652,338 652,378 690,378" fill="none" stroke="#67b5ef" stroke-width="1.8"/>
    <line x1="540" y1="378" x2="690" y2="378" stroke="#4a4a68" stroke-width="1"/>
    <text x="540" y="394" fill="#6b6b85" font-size="9">Vout ≈ 12 × 0.75 = 9 V</text>
  </g>

  <text x="60" y="424" fill="#e8b84b" font-size="10">真实电源里：400 V → 12 V 用 D = 3%；12 V → 1.2 V 用 D = 10%</text>
  <text x="60" y="444" fill="#9a9ab4" font-size="9.5">占空比越小，导通窗口越窄，控制器精度要求越高——这是高压差、大电流电源难做的原因</text>
  <text x="60" y="466" fill="#6b6b85" font-size="9">关断的那段时间，负载靠电感里存的能量续命，所以输出是一点带锯齿的直流</text>
</svg>
