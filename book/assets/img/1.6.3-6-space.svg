<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.3-6  测试能覆盖的，只是输入空间里的一小块</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是「测了很多」就接近完整 —— 输入的组合是爆炸的，你测的永远是样本</text>
<rect x="60" y="100" width="420" height="250" rx="4" fill="#12121c" stroke="#3a3a52" stroke-width="1.4"/>
<text x="270.0" y="88" fill="#8a8aa2" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所有可能的输入</text>
<path d="M150,180 Q200,140 260,165 Q320,190 330,240 Q336,290 280,305 Q220,320 175,290 Q135,255 150,180 Z" fill="#1e2f24" stroke="#67d9a0" stroke-width="1.6"/>
<text x="240" y="235" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">测过的</text>
<text x="240" y="254" fill="#5f7f6a" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">几百个用例</text>
<text x="360" y="150" fill="#6f6f88" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没测过的</text>
<text x="360" y="168" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">占绝大多数</text>
<circle cx="400" cy="280" r="4" fill="#e87a8a"/>
<circle cx="110" cy="300" r="4" fill="#e87a8a"/>
<circle cx="420" cy="130" r="4" fill="#e87a8a"/>
<text x="408" y="306" fill="#a8707c" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">空列表</text>
<text x="96" y="320" fill="#a8707c" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">超大数</text>
<text x="428" y="126" fill="#a8707c" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">负数</text>
<text x="530" y="112" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">为什么测不完</text>
<text x="530" y="138" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个收两个 32 位整数的函数，</text>
<text x="530" y="156" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">输入组合是 2⁶⁴ 种。</text>
<text x="530" y="174" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每秒测一百万种，要测 58 万年。</text>
<text x="530" y="208" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">所以测试只能做三件事</text>
<circle cx="536" cy="230.5" r="3" fill="#67d9a0"/>
<text x="548" y="234" fill="#67d9a0" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">挑代表</text>
<text x="548" y="252" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按等价类划分：0、正数、负数各测一个</text>
<circle cx="536" cy="276.5" r="3" fill="#e8b84b"/>
<text x="548" y="280" fill="#e8b84b" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">挑边界</text>
<text x="548" y="298" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0、1、最大值、空集合 —— bug 最爱躲这儿</text>
<circle cx="536" cy="322.5" r="3" fill="#67b5ef"/>
<text x="548" y="326" fill="#67b5ef" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">挑曾经出过错的</text>
<text x="548" y="344" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每修一个 bug，就补一个用例，永不复发</text>
<text x="30" y="382" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Dijkstra 那句话的确切意思是：测试只能证明「有 bug」，不能证明「没有 bug」。</text>
<text x="30" y="404" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以测试的目标不是「证明正确」，是「把已知的错都钉死，让新的错无处可藏」。</text>
</svg>
