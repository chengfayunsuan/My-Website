<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每天早上的中间价，是当天汇率的「锚」</text>
<rect x="190" y="82" width="360" height="164" rx="4" fill="#15151f" stroke="#3a3a52" stroke-width="1.2"/>
<line x1="190" y1="108" x2="550" y2="108" stroke="#4a4a62" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="190" y1="218" x2="550" y2="218" stroke="#4a4a62" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="190" y1="163" x2="550" y2="163" stroke="#67b5ef" stroke-width="2.4"/>
<text x="24" y="112" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中间价 +2%</text>
<text x="24" y="167" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中间价</text>
<text x="24" y="222" fill="#e87a8a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中间价 −2%</text>
<text x="566" y="112" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当天最多涨到这里</text>
<text x="566" y="167" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每天早上 9:15 公布</text>
