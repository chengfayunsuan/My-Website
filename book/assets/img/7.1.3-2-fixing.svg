<text x="24" y="282" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中间价由央行授权外汇交易中心公布，参考上一日收盘价和一篮子货币的变动。</text>
