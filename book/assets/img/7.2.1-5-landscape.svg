<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="396" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.1-5  中国银行业的分层：四千多家，但前六家占了一半</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按总资产占比画。数量最多的是小银行，但钱集中在头部</text>
<text x="204" y="108" fill="#67b5ef" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">6 家大型银行</text>
<text x="204" y="125" fill="#6f6f88" font-size="7.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">工、农、中、建、交、邮储</text>
<rect x="220" y="92" width="460.0" height="30" rx="3" fill="#16161f" stroke="#67b5ef" stroke-width="1.2"/>
<text x="670.0" y="112" fill="#67b5ef" font-size="9.4" text-anchor="end" font-family="monospace">45%</text>
<text x="204" y="162" fill="#b58ae8" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">12 家股份行</text>
<text x="204" y="179" fill="#6f6f88" font-size="7.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">招商、浦发、中信、兴业等</text>
<rect x="220" y="146" width="184.0" height="30" rx="3" fill="#16161f" stroke="#b58ae8" stroke-width="1.2"/>
<text x="394.0" y="166" fill="#b58ae8" font-size="9.4" text-anchor="end" font-family="monospace">18%</text>
<text x="204" y="216" fill="#e8b84b" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">城商行</text>
<text x="204" y="233" fill="#6f6f88" font-size="7.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一百多家，按城市设</text>
<rect x="220" y="200" width="132.88888888888889" height="30" rx="3" fill="#16161f" stroke="#e8b84b" stroke-width="1.2"/>
<text x="342.8888888888889" y="220" fill="#e8b84b" font-size="9.4" text-anchor="end" font-family="monospace">13%</text>
<text x="204" y="270" fill="#67d9a0" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">农商行 / 农信社</text>
<text x="204" y="287" fill="#6f6f88" font-size="7.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两千多家，县域为主</text>
<rect x="220" y="254" width="132.88888888888889" height="30" rx="3" fill="#16161f" stroke="#67d9a0" stroke-width="1.2"/>
<text x="342.8888888888889" y="274" fill="#67d9a0" font-size="9.4" text-anchor="end" font-family="monospace">13%</text>
<text x="204" y="324" fill="#e8965a" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">村镇银行、民营银行等</text>
<text x="204" y="341" fill="#6f6f88" font-size="7.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一千多家，规模小</text>
<rect x="220" y="308" width="112.44444444444444" height="30" rx="3" fill="#16161f" stroke="#e8965a" stroke-width="1.2"/>
<text x="322.44444444444446" y="328" fill="#e8965a" font-size="9.4" text-anchor="end" font-family="monospace">11%</text>
<text x="40" y="368" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意这个结构：政策上希望「多层次、广覆盖」，但资产集中在头部六家。所以一提「支持小微企业」，真正干活的是城商行和农商行 —— 它们拿到的资金却最少。</text>
</svg>
