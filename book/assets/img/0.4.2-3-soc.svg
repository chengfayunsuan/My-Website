<svg width="760" height="462" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="462" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">一颗 M1 上有什么</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">所有单元在同一块硅片上，共享一片缓存和一条内存</text>

  <!-- 封装基板 -->
  <rect x="66" y="64" width="628" height="348" rx="6" fill="#171725" stroke="#33334a"/>
  <text x="380" y="80" fill="#6b6b85" font-size="7.5" text-anchor="middle">封装基板</text>

  <!-- die -->
  <rect x="80" y="84" width="600" height="252" rx="4" fill="#12121c" stroke="#4a4a68"/>
  <text x="88" y="330" fill="#4a4a68" font-size="7">同一块 die（示意，不按比例）</text>

  <rect x="96" y="92" width="52" height="86" rx="2" fill="#1b2740" stroke="#67b5ef"/>
