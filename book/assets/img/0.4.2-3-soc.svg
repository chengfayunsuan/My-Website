  <text x="192" y="223" fill="#a8c0ee" font-size="7" text-anchor="middle">小</text>
  <rect x="216" y="196" width="32" height="46" rx="2" fill="#1a2438" stroke="#6b8fd4"/>
  <text x="232" y="223" fill="#a8c0ee" font-size="7" text-anchor="middle">小</text>
  <rect x="346" y="92" width="70" height="150" rx="2" fill="#232338" stroke="#9a9ab4"/>
  <text x="381" y="150" fill="#c8c8d4" font-size="8" text-anchor="middle">统一</text>
  <text x="381" y="164" fill="#c8c8d4" font-size="8" text-anchor="middle">缓存</text>
  <text x="381" y="182" fill="#6b6b85" font-size="7" text-anchor="middle">16 MB</text>
  <rect x="432" y="92" width="46" height="36" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
