  <text x="563" y="159" fill="#cfc6ff" font-size="7" text-anchor="middle">GPU</text>
  <rect x="594" y="136" width="46" height="36" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="617" y="159" fill="#cfc6ff" font-size="7" text-anchor="middle">GPU</text>
  <rect x="344" y="256" width="94" height="34" rx="2" fill="#183028" stroke="#4ec9a3"/>
  <text x="391" y="277" fill="#4ec9a3" font-size="7.5" text-anchor="middle">NPU 16 核</text>
  <rect x="446" y="256" width="94" height="34" rx="2" fill="#332a18" stroke="#e8b84b"/>
  <text x="493" y="277" fill="#e8b84b" font-size="7.5" text-anchor="middle">媒体引擎</text>
  <rect x="548" y="256" width="94" height="34" rx="2" fill="#232338" stroke="#9a9ab4"/>
  <text x="595" y="277" fill="#9a9ab4" font-size="7.5" text-anchor="middle">显示控制器</text>
  <rect x="96" y="256" width="232" height="34" rx="2" fill="#2e2a3a" stroke="#cfc6ff"/>
  <text x="212" y="277" fill="#cfc6ff" font-size="8" text-anchor="middle">内存控制器 · 128 位</text>

  <!-- 内存颗粒 -->
  <rect x="80" y="352" width="180" height="38" rx="3" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="170" y="375" fill="#cfc6ff" font-size="8" text-anchor="middle">LPDDR 颗粒</text>
  <rect x="272" y="352" width="180" height="38" rx="3" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="362" y="375" fill="#cfc6ff" font-size="8" text-anchor="middle">LPDDR 颗粒</text>
  <text x="470" y="368" fill="#6b6b85" font-size="8">也在基板上，紧挨着 die</text>
  <text x="470" y="384" fill="#6b6b85" font-size="8">走线几毫米 —— 这就是「统一内存」的物理形态</text>

  <line x1="24" y1="426" x2="736" y2="426" stroke="#2a2a44"/>
  <text x="24" y="446" fill="#e8b84b" font-size="9">注意下面那块：内存控制器在 die 上，颗粒在基板上。中间没有插槽、没有 PCB 走线、没有连接器。</text>
</svg>