<text x="404" y="312" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">周期在 333 ps 上下随机摆动 —— 高速接口最怕这个</text>
<text x="24" y="338" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">偏斜是「这根线和那根线不一样长」，固定、可测、可以用工具修；抖动是「这一拍和下一拍不一样长」，随机，只能靠设计和电源去压。</text>
<text x="24" y="360" fill="#6a6a84" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两者都在吃时序余量：偏斜吃的是空间，抖动吃的是时间。</text>
</svg>
