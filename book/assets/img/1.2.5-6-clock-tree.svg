<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左：H 树用几何对称换时间一致　右：偏斜是空间差，抖动是时间差</text>
