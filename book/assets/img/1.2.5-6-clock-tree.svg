<text x="34" y="236" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每级分叉都等长，所以到每个末端的时间几乎相同</text>
<text x="34" y="254" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价：这棵树上每个周期要翻两次，占全芯片 20%~30% 的功耗</text>
<text x="404" y="94" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">偏斜 skew：不同触发器的时钟到的时刻不同</text>
