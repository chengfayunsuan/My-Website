<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.5-5  SDR 篮子里有五种货币，人民币占 12.28%</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2022 年 8 月生效的权重。看起来是「五种货币的组合」，实际用起来完全不是</text>
<text x="164" y="120" fill="#67b5ef" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">美元</text>
