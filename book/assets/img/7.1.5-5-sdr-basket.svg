<text x="40" y="360" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">权重每五年调整一次，按「出口额」和「储备占比」算。人民币 2016 年进入篮子，权重从 10.92% 升到 12.28%。</text>
