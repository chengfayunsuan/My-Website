<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">五枚章，各管一件事，盖错等于白盖</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">公章的效力最高，但也最不该随便盖</text>
<rect x="30" y="74" width="240" height="52" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="150" y="106" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对外证明、公文、投标</text>
<line x1="274" y1="100" x2="298" y2="100" stroke="#4a4a62" stroke-width="1.5"/><rect x="302" y="74" width="220" height="52" rx="6" fill="#12121a" stroke="#e87a8a" stroke-width="1.4"/>
<text x="412" y="105" fill="#e87a8a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">公章</text>
<text x="536" y="98" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个公司只有一枚</text>
<text x="536" y="116" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代表公司意志</text>
<rect x="30" y="134" width="240" height="52" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="150" y="166" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行付款、税务报表</text>
<line x1="274" y1="160" x2="298" y2="160" stroke="#4a4a62" stroke-width="1.5"/><rect x="302" y="134" width="220" height="52" rx="6" fill="#12121a" stroke="#e8b84b" stroke-width="1.4"/>
<text x="412" y="165" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">财务专用章 + 法人章</text>
<text x="536" y="158" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两枚一起用</text>
<text x="536" y="176" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">缺一不可</text>
<rect x="30" y="194" width="240" height="52" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="150" y="226" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开发票</text>
<line x1="274" y1="220" x2="298" y2="220" stroke="#4a4a62" stroke-width="1.5"/><rect x="302" y="194" width="220" height="52" rx="6" fill="#12121a" stroke="#67d9a0" stroke-width="1.4"/>
<text x="412" y="225" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">发票专用章</text>
<text x="536" y="218" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全电发票普及后</text>
<text x="536" y="236" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">很多场景已不再需要</text>
<rect x="30" y="254" width="240" height="52" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="150" y="286" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">签合同</text>
<line x1="274" y1="280" x2="298" y2="280" stroke="#4a4a62" stroke-width="1.5"/><rect x="302" y="254" width="220" height="52" rx="6" fill="#12121a" stroke="#67b5ef" stroke-width="1.4"/>
<text x="412" y="285" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">公章 或 合同专用章</text>
<text x="536" y="278" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两者效力相同</text>
<text x="536" y="296" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">看对方要求</text>
<rect x="30" y="314" width="240" height="52" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="150" y="346" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内部文件、员工手册</text>
<line x1="274" y1="340" x2="298" y2="340" stroke="#4a4a62" stroke-width="1.5"/><rect x="302" y="314" width="220" height="52" rx="6" fill="#12121a" stroke="#a0a0b8" stroke-width="1.4"/>
<text x="412" y="345" fill="#a0a0b8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">不用章，签字即可</text>
<text x="536" y="338" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">盖章反而给自己加责任</text>
<text x="390" y="392" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">盖章前先问一句「这份文件要对外承担什么后果」，比记清哪枚章更重要</text>
</svg>
