<svg width="900" height="442" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="442" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.3.4-2  旁路：把结果抄近道送回 ALU 的入口</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不加旁路要等结果写回寄存器堆；加了旁路，ALU 一算完就能被下一条用</text>
<rect x="96" y="119.0" width="74" height="74" rx="3" fill="#171722" stroke="#b78ef0" stroke-width="1.4"/>
<text x="133.0" y="154" fill="#b78ef0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ID/EX</text>
<text x="133.0" y="172" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">流水寄存器</text>
<rect x="214" y="119.0" width="42" height="74" rx="3" fill="#171722" stroke="#f0a44a" stroke-width="1.4"/>
<text x="235.0" y="154" fill="#f0a44a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">MUX</text>
<rect x="300" y="119.0" width="66" height="74" rx="3" fill="#171722" stroke="#f0a44a" stroke-width="1.4"/>
<text x="333.0" y="154" fill="#f0a44a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ALU</text>
<text x="333.0" y="172" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">加 / 逻辑</text>
<rect x="410" y="119.0" width="70" height="74" rx="3" fill="#171722" stroke="#b78ef0" stroke-width="1.4"/>
<text x="445.0" y="154" fill="#b78ef0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">EX/MEM</text>
<text x="445.0" y="172" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">流水寄存器</text>
<rect x="524" y="119.0" width="88" height="74" rx="3" fill="#171722" stroke="#5aa9e6" stroke-width="1.4"/>
<text x="568.0" y="154" fill="#5aa9e6" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据缓存</text>
<text x="568.0" y="172" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">load / store</text>
<rect x="656" y="119.0" width="66" height="74" rx="3" fill="#171722" stroke="#b78ef0" stroke-width="1.4"/>
<text x="689.0" y="154" fill="#b78ef0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">MEM/WB</text>
<text x="689.0" y="172" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">流水寄存器</text>
<rect x="772" y="119.0" width="92" height="74" rx="3" fill="#171722" stroke="#67d9a0" stroke-width="1.4"/>
<text x="818.0" y="154" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">寄存器堆</text>
<text x="818.0" y="172" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">WB 写入</text>
<line x1="170" y1="156" x2="214" y2="156" stroke="#8a8aa0" stroke-width="2"/>
<line x1="256" y1="156" x2="300" y2="156" stroke="#8a8aa0" stroke-width="2"/>
<line x1="366" y1="156" x2="410" y2="156" stroke="#8a8aa0" stroke-width="2"/>
<line x1="480" y1="156" x2="524" y2="156" stroke="#8a8aa0" stroke-width="2"/>
<line x1="612" y1="156" x2="656" y2="156" stroke="#8a8aa0" stroke-width="2"/>
<line x1="722" y1="156" x2="772" y2="156" stroke="#8a8aa0" stroke-width="2"/>
<line x1="30" y1="156" x2="96" y2="156" stroke="#67d9a0" stroke-width="2"/>
<text x="30" y="148" fill="#67d9a0" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从寄存器堆读</text>
<path d="M366,164 L366,268 L228,268 L228,193.0" fill="none" stroke="#67d9a0" stroke-width="1.8"/>
<text x="380" y="262" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">EX→EX：相邻两条，ALU 一算完直接接过来</text>
<path d="M690,193.0 L690,302 L246,302 L246,193.0" fill="none" stroke="#5aa9e6" stroke-width="1.8"/>
<text x="258" y="320" fill="#5aa9e6" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">MEM→EX：隔一条，从 MEM/WB 的输出绕回来</text>
<path d="M690,119.0 L690,104 L568,104 L568,119.0" fill="none" stroke="#b78ef0" stroke-width="1.8"/>
<text x="560" y="86" fill="#b78ef0" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">store 的数据也能旁路</text>
<circle cx="634" cy="156" r="9" fill="none" stroke="#f06a7a" stroke-width="1.8"/>
<line x1="628" y1="150" x2="640" y2="162" stroke="#f06a7a" stroke-width="1.8"/>
<line x1="640" y1="150" x2="628" y2="162" stroke="#f06a7a" stroke-width="1.8"/>
<text x="634" y="214" fill="#f06a7a" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">load 值在这一拍末尾才出</text>
<text x="24" y="372" fill="#f0a44a" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">RAW（真依赖）</text>
<text x="168" y="372" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">后一条读前一条刚写的值</text>
<text x="430" y="372" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只能靠旁路或停顿</text>
<text x="24" y="398" fill="#5f5f78" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">WAR（假依赖）</text>
<text x="168" y="398" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">后一条写前一条还在读的值</text>
<text x="430" y="398" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">重命名即可消除</text>
<text x="24" y="424" fill="#5f5f78" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">WAW（假依赖）</text>
<text x="168" y="424" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两条都写同一个架构寄存器</text>
<text x="430" y="424" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">重命名即可消除</text>
</svg>
