<svg width="880" height="396" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="396" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.5.1-5  栈只动一个指针</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">push 写一格、指针上移；pop 指针下移、读一格</text>
<rect x="150" y="64" width="190" height="40" rx="0" fill="#14141e" stroke="#3a3a52" stroke-width="1"/>
<rect x="150" y="110" width="190" height="40" rx="0" fill="#14141e" stroke="#3a3a52" stroke-width="1"/>
<rect x="150" y="156" width="190" height="40" rx="0" fill="#14141e" stroke="#3a3a52" stroke-width="1"/>
<rect x="150" y="202" width="190" height="40" rx="0" fill="#12261e" stroke="#67d9a0" stroke-width="1.3"/>
<text x="245.0" y="228" fill="#8fe0b8" font-size="13" text-anchor="middle" font-family="monospace">30</text>
<rect x="150" y="248" width="190" height="40" rx="0" fill="#12261e" stroke="#67d9a0" stroke-width="1.3"/>
<text x="245.0" y="274" fill="#8fe0b8" font-size="13" text-anchor="middle" font-family="monospace">20</text>
<rect x="150" y="294" width="190" height="40" rx="0" fill="#12261e" stroke="#67d9a0" stroke-width="1.3"/>
<text x="245.0" y="320" fill="#8fe0b8" font-size="13" text-anchor="middle" font-family="monospace">10</text>
<line x1="140" y1="338" x2="350" y2="338" stroke="#5a5a72" stroke-width="2"/>
<text x="358" y="342" fill="#5a5a72" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">栈底</text>
<text x="136" y="182" fill="#e8b84b" font-size="10.5" text-anchor="end" font-family="monospace">top</text>
<line x1="140" y1="178" x2="148" y2="178" stroke="#e8b84b" stroke-width="1.4"/>
<path d="M149,178 l-8,-4 l0,8 Z" fill="#e8b84b"/>
<text x="136" y="164" fill="#8a7a4a" font-size="8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">下一个空位</text>
<text x="350" y="225.0" fill="#6a8a76" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">栈顶</text>
<path d="M410,58 L410,160" fill="none" stroke="#67d9a0" stroke-width="1.8"/>
<path d="M410,168 l-5,-9 l10,0 Z" fill="#67d9a0"/>
<text x="422" y="74" fill="#67d9a0" font-size="10" text-anchor="start" font-family="monospace">push(v)</text>
<text x="422" y="92" fill="#6a8a76" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">写进 top 指的那格</text>
<text x="422" y="106" fill="#6a8a76" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">top 上移一格</text>
<path d="M560,222.0 L560,58" fill="none" stroke="#e87a8a" stroke-width="1.8"/>
<path d="M560,50 l-5,9 l10,0 Z" fill="#e87a8a"/>
<text x="572" y="74" fill="#e87a8a" font-size="10" text-anchor="start" font-family="monospace">pop()</text>
<text x="572" y="92" fill="#a06a78" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">top 下移一格</text>
<text x="572" y="106" fill="#a06a78" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">读出来的就是它</text>
<rect x="600" y="150" width="244" height="92" rx="4" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="616" y="172" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">pop 并没有「删掉」数据</text>
<text x="616" y="192" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">值还躺在那块内存里，</text>
<text x="616" y="208" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只是 top 不再指它。</text>
<text x="616" y="228" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">下次 push 会直接覆盖。</text>
<text x="36" y="356" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">四行代码：push 是 buf[top++] = v，pop 是 return buf[--top]。全是 O(1)，一次内存分配都没有。</text>
<text x="36" y="376" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">栈满再 push 就是栈溢出 —— 不是内存不够，是那块区域本身只有这么大（线程默认 8 MB）。</text>
</svg>
