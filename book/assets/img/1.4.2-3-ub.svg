<svg width="830" height="420" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="830" height="420" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">判空为什么会被删掉：一条三段论</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">解引用先于判空发生，这个事实本身就构成「p 非空」的证据；编译器只是把标准里的规则执行了一遍</text>
<rect x="28" y="84" width="236" height="214" rx="5" fill="#141420" stroke="#2e2e44" stroke-width="1.1"/>
<text x="40" y="104" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">源码</text>
<text x="40" y="130" fill="#b0b0c8" font-size="9.4" text-anchor="start" font-family="monospace">int get(struct S *p) {</text>
<text x="40" y="156" fill="#e87a8a" font-size="9.4" text-anchor="start" font-family="monospace">    int v = p-&gt;field;</text>
<text x="40" y="182" fill="#e8b84b" font-size="9.4" text-anchor="start" font-family="monospace">    if (p == NULL)</text>
<text x="40" y="208" fill="#e8b84b" font-size="9.4" text-anchor="start" font-family="monospace">        return -1;</text>
<text x="40" y="234" fill="#b0b0c8" font-size="9.4" text-anchor="start" font-family="monospace">    return v;</text>
<text x="40" y="260" fill="#6a6a82" font-size="9.4" text-anchor="start" font-family="monospace">}</text>
<rect x="316" y="84" width="244" height="214" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.1"/>
<text x="328" y="104" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">编译器的推理</text>
<text x="332" y="136" fill="#67b5ef" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">①</text>
<text x="354" y="136" fill="#b0b0c8" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 2 行解引用了 p</text>
<line x1="336" y1="145" x2="336" y2="172" stroke="#2e2e44" stroke-width="1" stroke-dasharray="3 3"/>
<text x="332" y="182" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">②</text>
<text x="354" y="182" fill="#b0b0c8" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">若 p 为空，这一行已是 UB</text>
<line x1="336" y1="191" x2="336" y2="218" stroke="#2e2e44" stroke-width="1" stroke-dasharray="3 3"/>
<text x="332" y="228" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">③</text>
<text x="354" y="228" fill="#b0b0c8" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">合法程序不会执行到 UB</text>
<line x1="336" y1="237" x2="336" y2="264" stroke="#2e2e44" stroke-width="1" stroke-dasharray="3 3"/>
<text x="332" y="274" fill="#e87a8a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">∴</text>
<text x="354" y="274" fill="#b0b0c8" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">p 必非空，判空可删</text>
<rect x="600" y="84" width="202" height="214" rx="5" fill="#141420" stroke="#2e2e44" stroke-width="1.1"/>
<text x="612" y="104" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">实际生成的代码</text>
<text x="612" y="140" fill="#67d9a0" font-size="9.6" text-anchor="start" font-family="monospace">get:</text>
<text x="612" y="166" fill="#b0b0c8" font-size="9.6" text-anchor="start" font-family="monospace">    mov eax, [rdi]</text>
<text x="612" y="192" fill="#b0b0c8" font-size="9.6" text-anchor="start" font-family="monospace">    ret</text>
<text x="612" y="240" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有比较，没有分支</text>
<text x="612" y="258" fill="#e87a8a" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">传 NULL 进来 = 直接崩</text>
<line x1="268" y1="191" x2="303.0" y2="191.0" stroke="#8a8aa4" stroke-width="1.4"/>
<polygon points="312,191 303.0,195.5 303.0,186.5" fill="#8a8aa4"/>
<line x1="564" y1="191" x2="587.0" y2="191.0" stroke="#8a8aa4" stroke-width="1.4"/>
<polygon points="596,191 587.0,195.5 587.0,186.5" fill="#8a8aa4"/>
<text x="28" y="336" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这不是编译器「太激进」。第一行解引用是作者写的，从那一刻起，p 为空就已经是未定义行为——后面的判空救不回来。</text>
<text x="28" y="358" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">正确写法是把判空放到解引用之前。这类 bug 的共同特征是：-O0 下完全正常，-O2 一开就崩。</text>
</svg>
