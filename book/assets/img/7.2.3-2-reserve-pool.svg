<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="306" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.3 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">准备金率是水闸：收进来 100 元，只能贷出 90 元</text>
<rect x="60" y="100" width="640" height="60" rx="6" fill="#1a1a28" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="60" y="100" width="64" height="60" rx="6" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<rect x="124" y="100" width="576" height="60" rx="6" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<text x="92" y="136" fill="#101018" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">10</text>
<text x="412" y="136" fill="#101018" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">90 元可以贷出去</text>
<text x="92" y="186" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">准备金</text>
<text x="92" y="210" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（存央行，不能动）</text>
<text x="412" y="186" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷款</text>
<text x="720" y="136" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">← 准备金率 10%</text>
<text x="40" y="248" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这 90 元贷出去，会变成别人的存款；那家银行再留 9 元，贷出 81 元……</text>
<text x="40" y="274" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以准备金率越低，同样的原始存款能撑起的贷款越多。降准之所以能“放水”，就是这个道理。</text>
</svg>
