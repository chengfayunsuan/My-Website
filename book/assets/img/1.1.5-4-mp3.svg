<svg width="760" height="356" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="m1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#8a8aa0"/></marker>
    <marker id="m2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#9b4df0"/></marker>
  </defs>
  <rect width="760" height="356" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">MP3 的五步：把「听不见的部分」扔掉</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">关键不在压缩算法，在下面那个紫色框——它决定哪些数据可以不存</text>
  <rect x="20" y="80" width="128" height="64" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="84" y="102" fill="#d8d8e4" font-size="10" text-anchor="middle">分频带</text>
  <text x="84" y="120" fill="#6b6b85" font-size="7.5" text-anchor="middle">32 个子带</text>
  <text x="84" y="135" fill="#55556e" font-size="7.5" text-anchor="middle">把频谱切开</text>
  <rect x="168" y="80" width="128" height="64" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="232" y="102" fill="#d8d8e4" font-size="10" text-anchor="middle">MDCT</text>
  <text x="232" y="120" fill="#6b6b85" font-size="7.5" text-anchor="middle">1152 点 → 576 系数</text>
  <text x="232" y="135" fill="#55556e" font-size="7.5" text-anchor="middle">换到频域</text>
  <rect x="316" y="80" width="128" height="64" rx="6" fill="#171725" stroke="#9b4df0"/>
  <text x="380" y="102" fill="#cfc6ff" font-size="10" text-anchor="middle">量化</text>
  <text x="380" y="120" fill="#6b6b85" font-size="7.5" text-anchor="middle">按掩蔽阈值分位</text>
  <text x="380" y="135" fill="#55556e" font-size="7.5" text-anchor="middle">这里才开始丢东西</text>
  <rect x="464" y="80" width="128" height="64" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="528" y="102" fill="#d8d8e4" font-size="10" text-anchor="middle">霍夫曼</text>
  <text x="528" y="120" fill="#6b6b85" font-size="7.5" text-anchor="middle">变长编码</text>
  <text x="528" y="135" fill="#55556e" font-size="7.5" text-anchor="middle">无损再压一道</text>
  <rect x="612" y="80" width="128" height="64" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="676" y="102" fill="#d8d8e4" font-size="10" text-anchor="middle">帧打包</text>
  <text x="676" y="120" fill="#6b6b85" font-size="7.5" text-anchor="middle">加帧头，576 采样/帧</text>
  <text x="676" y="135" fill="#55556e" font-size="7.5" text-anchor="middle">输出码流</text>
  <line x1="151" y1="112" x2="163" y2="112" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#m1)"/>
  <line x1="299" y1="112" x2="311" y2="112" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#m1)"/>
  <line x1="447" y1="112" x2="459" y2="112" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#m1)"/>
  <line x1="595" y1="112" x2="607" y2="112" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#m1)"/>
  <rect x="300" y="206" width="160" height="56" rx="6" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="380" y="228" fill="#cfc6ff" font-size="10" text-anchor="middle">心理声学模型</text>
  <text x="380" y="245" fill="#8f88a8" font-size="7.5" text-anchor="middle">算出每个频段的掩蔽阈值</text>
  <line x1="380" y1="206" x2="380" y2="150" stroke="#9b4df0" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#m2)"/>
  <text x="392" y="180" fill="#cfc6ff" font-size="7.5">「这些位可以省」</text>
  <text x="24" y="290" fill="#9a9ab4" font-size="9">掩蔽效应：一个强音附近，弱音听不见。所以弱音那一段可以只留很少的位，甚至直接丢掉，耳朵分辨不出来。</text>
  <text x="24" y="310" fill="#9a9ab4" font-size="8.5">这就是「有损」的全部逻辑：不是压缩得不好，是主动放弃人耳本来就不接收的信息。128 kbps 的 MP3 相当于原文件的 1/11。</text>
  <text x="24" y="330" fill="#6b6b85" font-size="8.5">代价：这种「放弃」是不可逆的。转成 MP3 之后再转回 WAV，丢掉的细节不会回来，只是文件变大了——这是很多人误以为「转格式能提音质」的来源。</text>
</svg>