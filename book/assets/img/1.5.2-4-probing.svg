<text x="56" y="82" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="monospace">k1：h = 5 —— 5~8 全被占，一路退到 9</text>
<text x="56" y="106" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="monospace">k2：h = 7 —— 7~9 全被占，再退一格到 10</text>
<path d="M296,224 Q296,230 304,230 L574,230 Q582,230 582,224" fill="none" stroke="#e87a8a" stroke-width="1.4"/><text x="439.0" y="247" fill="#e87a8a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">原始聚集：一段连续占用的槽，哈希落进来谁都得排队走到队尾</text>
<text x="36" y="300" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">k1 本来只跟槽 5 有关，现在跟整段 5~9 都纠缠在一起；k2 更冤 —— 它只想用槽 7，却在队尾多排了三步。</text>
<text x="36" y="318" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">聚集会自我加强：段越长，周围落进来的 key 越要走到队尾，队尾继续外延。</text>
<text x="36" y="340" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">改进：二次探测（h+1²、h+2²……，跳得远但会「二次聚集」）；双重散列（第二个哈希决定步长）—— 更均匀，贵一点。</text>
<text x="36" y="364" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开放寻址删元素不能把槽清空：探测链会断。留下「墓碑」标记 —— 查找时当有人、插入时当空位。</text>
