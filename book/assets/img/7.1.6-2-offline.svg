<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="310" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.6 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两个人都没网，也能把钱付出去</text>
<rect x="40" y="110" width="150" height="100" rx="12" fill="#16161f" stroke="#67b5ef" stroke-width="1.6"/>
<text x="115" y="145" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的手机</text>
<text x="115" y="172" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数字人民币钱包</text>
<rect x="690" y="110" width="150" height="100" rx="12" fill="#16161f" stroke="#67d9a0" stroke-width="1.6"/>
<text x="765" y="145" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对方手机</text>
<text x="765" y="172" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">或 POS 机</text>
<path d="M198,160 L682,160" fill="none" stroke="#e8b84b" stroke-width="2"/>
<path d="M682,153 L694,160 L682,167 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="0"/>
<text x="440" y="146" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">碰一碰 / 扫码</text>
<circle cx="440" cy="74" r="24" fill="#1c1c2a" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="426" y1="60" x2="454" y2="88" stroke="#e87a8a" stroke-width="1.8"/>
<line x1="454" y1="60" x2="426" y2="88" stroke="#e87a8a" stroke-width="1.8"/>
<text x="440" y="108" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有网络</text>
<text x="24" y="254" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">原理是：钱存在手机的安全芯片里，像一张电子现金。碰一下，两个设备各改各的余额，事后再补传。</text>
<text x="24" y="280" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价是：离线时无法查这笔钱是不是重复花了，所以离线额度很小，也只在特定场景开放。</text>
</svg>
