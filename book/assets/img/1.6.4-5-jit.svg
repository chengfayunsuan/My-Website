<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一段代码刚启动时慢 40 倍，跑一会儿才降到真实速度。这就是微基准测试最容易踩的坑</text>
