<text x="180" y="96" fill="#e8965a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">解释执行</text>
<text x="180" y="112" fill="#a07040" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 200 微秒，慢 40 倍</text>
<text x="391.1731075636848" y="208.85714285714286" fill="#e8b84b" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">JIT 开始编译热点</text>
<line x1="594.0" y1="106" x2="594.0" y2="346" stroke="#5a3a44" stroke-width="1" stroke-dasharray="4 4"/>
<text x="594.0" y="98" fill="#a8707c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前 1000 次</text>
<text x="30" y="384" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三个让微基准失效的东西：一是 JIT 预热（上图）；二是死代码消除（算出来的值没人用，编译器直接把整个循环删了）；</text>
<text x="30" y="406" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三是缓存预热（第一次读内存慢，之后都快）。所以正经的基准测试框架要跑几千轮、丢弃预热段、还要防止结果被优化掉。</text>
</svg>
