<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">怎么选：按「你要干什么」倒推，不按「哪个高级」选</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">选主体不是为了显得正规，是为了解决具体问题</text>
<defs><marker id="d2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#8a8aa0"/></marker></defs><rect x="24" y="176" width="150" height="62" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="99" y="202" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你要干什么</text>
<text x="99" y="224" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">先问这一句</text>
<path d="M176,207 C 198,207 198,106 212,106" fill="none" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#d2)"/><rect x="216" y="64" width="330" height="58" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="232" y="86" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">摆摊、小店、先试试水</text>
<text x="232" y="106" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">成本最低，能核定征收，注销快</text>
<rect x="554" y="64" width="202" height="58" rx="6" fill="#12121a" stroke="#67b5ef" stroke-width="1.3"/>
<text x="566" y="86" fill="#67b5ef" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">个体工商户</text>
<text x="566" y="106" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注册一天，几百块</text>
<path d="M176,207 C 198,207 198,190 212,190" fill="none" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#d2)"/><rect x="216" y="148" width="330" height="58" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="232" y="170" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">接企业单、要开专票、签合同</text>
<text x="232" y="190" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对方要走公对公，个体户常常过不了审</text>
<rect x="554" y="148" width="202" height="58" rx="6" fill="#12121a" stroke="#67d9a0" stroke-width="1.3"/>
<text x="566" y="170" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">有限责任公司</text>
<text x="566" y="190" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记账报税每月两三百</text>
<path d="M176,207 C 198,207 198,274 212,274" fill="none" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#d2)"/><rect x="216" y="232" width="330" height="58" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="232" y="254" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">和朋友一起做</text>
<text x="232" y="274" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">口头「一人一半」是最容易翻车的</text>
<rect x="554" y="232" width="202" height="58" rx="6" fill="#12121a" stroke="#b58ae8" stroke-width="1.3"/>
<text x="566" y="254" fill="#b58ae8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">有限公司 + 股权协议</text>
<text x="566" y="274" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">比例写进章程</text>
<path d="M176,207 C 198,207 198,358 212,358" fill="none" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#d2)"/><rect x="216" y="316" width="330" height="58" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="232" y="338" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个人做，但想留个壳</text>
<text x="232" y="358" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">公私账户混同会击穿那堵墙</text>
<rect x="554" y="316" width="202" height="58" rx="6" fill="#12121a" stroke="#e8965a" stroke-width="1.3"/>
<text x="566" y="338" fill="#e8965a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">一人有限公司</text>
<text x="566" y="358" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">年度审计有额外要求</text>
<text x="390" y="404" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这张图不是法律意见。真要做，找当地代理记账问一句「我这种情况办哪种」，通常免费</text>
<text x="390" y="428" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">他们天天办，比任何攻略都清楚当地的实际口径</text>
</svg>
