<svg width="640" height="380" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'PingFang SC','Microsoft YaHei',monospace">
  <rect width="640" height="380" fill="#0e0e16"/>

  <text x="20" y="26" fill="#9a9ab4" font-size="12.5">IEEE 754 单精度：32 位被切成 1 + 8 + 23 三段</text>
  <text x="20" y="46" fill="#6b6b85" font-size="11">它不是"存了一个小数"，而是存了一个公式的三个参数：±1.xxx × 2^e</text>

  <!-- 三段标注 -->
  <text x="70" y="86" fill="#f0606a" font-size="11" text-anchor="middle">符号</text>
  <text x="70" y="102" fill="#6b6b85" font-size="9.5" text-anchor="middle">1 位</text>

  <text x="224" y="86" fill="#e8b84b" font-size="11" text-anchor="middle">指数</text>
  <text x="224" y="102" fill="#6b6b85" font-size="9.5" text-anchor="middle">8 位（偏移 127）</text>

  <text x="420" y="86" fill="#4ec9a3" font-size="11" text-anchor="middle">尾数</text>
  <text x="420" y="102" fill="#6b6b85" font-size="9.5" text-anchor="middle">23 位（隐含开头的 1）</text>

  <!-- 符号位 -->
  <rect x="46" y="112" width="48" height="42" rx="4" fill="#2a1a1f" stroke="#f0606a" stroke-opacity="0.7"/>
  <text x="70" y="140" fill="#f7a3a8" font-size="16" text-anchor="middle">0</text>

  <!-- 指数 8 位 -->
  <g font-size="13" text-anchor="middle">
    <rect x="100" y="112" width="31" height="42" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="115" y="140" fill="#f0cd7a">0</text>
    <rect x="133" y="112" width="31" height="42" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="148" y="140" fill="#f0cd7a">1</text>
    <rect x="166" y="112" width="31" height="42" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="181" y="140" fill="#f0cd7a">1</text>
    <rect x="199" y="112" width="31" height="42" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="214" y="140" fill="#f0cd7a">1</text>
    <rect x="232" y="112" width="31" height="42" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="247" y="140" fill="#f0cd7a">1</text>
    <rect x="265" y="112" width="31" height="42" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="280" y="140" fill="#f0cd7a">1</text>
    <rect x="298" y="112" width="31" height="42" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="313" y="140" fill="#f0cd7a">0</text>
    <rect x="331" y="112" width="31" height="42" rx="3" fill="#2b2618" stroke="#e8b84b" stroke-opacity="0.6"/><text x="346" y="140" fill="#f0cd7a">0</text>
  </g>

  <!-- 尾数：前 6 格 -->
  <g font-size="13" text-anchor="middle">
    <rect x="370" y="112" width="26" height="42" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/><text x="383" y="140" fill="#7fe0c2">0</text>
    <rect x="398" y="112" width="26" height="42" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/><text x="411" y="140" fill="#7fe0c2">1</text>
    <rect x="426" y="112" width="26" height="42" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/><text x="439" y="140" fill="#7fe0c2">0</text>
    <rect x="454" y="112" width="26" height="42" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/><text x="467" y="140" fill="#7fe0c2">0</text>
    <rect x="482" y="112" width="26" height="42" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/><text x="495" y="140" fill="#7fe0c2">0</text>
    <rect x="510" y="112" width="26" height="42" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/><text x="523" y="140" fill="#7fe0c2">0</text>
  </g>
  <text x="546" y="140" fill="#4a4a66" font-size="14">…</text>
  <rect x="566" y="112" width="26" height="42" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.35"/>
  <text x="579" y="140" fill="#7fe0c2" font-size="11" text-anchor="middle">0</text>

  <!-- 下方说明 -->
  <line x1="20" y1="176" x2="620" y2="176" stroke="#2a2a44"/>

  <text x="20" y="202" fill="#9a9ab4" font-size="11.5">以 0.15625 为例：</text>

  <text x="20" y="228" fill="#d8d8e4" font-size="11.5">0.15625 = 1.01 × 2⁻³</text>

  <text x="20" y="256" fill="#f0606a" font-size="11">符号 0（正）</text>
  <text x="160" y="256" fill="#e8b84b" font-size="11">指数 −3 + 127 = 124 = 0111 1100</text>
  <text x="440" y="256" fill="#4ec9a3" font-size="11">尾数 01 后补零</text>

  <text x="20" y="284" fill="#d8d8e4" font-size="12">拼起来：0 01111100 01000000000000000000000</text>
  <text x="20" y="308" fill="#c9b0ff" font-size="12">十六进制：0x3E200000</text>

  <rect x="20" y="324" width="600" height="44" rx="8" fill="#131320" stroke="#2a2a44"/>
  <text x="34" y="344" fill="#9a9ab4" font-size="10.5">两个设计细节值得记住：① 尾数省掉了开头的 1，凭空多一位精度；② 指数用「加 127」的偏移而不是补码，</text>
  <text x="34" y="362" fill="#9a9ab4" font-size="10.5">这样两个正浮点数可以直接按整数的规则比大小 —— 硬件实现更省事。</text>
</svg>
