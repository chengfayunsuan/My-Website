<svg width="760" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="400" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">三种用途，三种钱法</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">同一笔预算，重点完全不同——配错方向，钱就白花了</text>
  <text x="24" y="118" fill="#d8d8e4" font-size="10">办公 / 上网</text>
  <rect x="90.0" y="96" width="30.0" height="36" fill="#9b4df0" fill-opacity="0.35" stroke="#9b4df0"/>
  <rect x="120.0" y="96" width="108.0" height="36" fill="#67b5ef" fill-opacity="0.35" stroke="#67b5ef"/>
  <text x="174.0" y="118" fill="#67b5ef" font-size="8.5" text-anchor="middle">18%</text>
  <rect x="228.0" y="96" width="60.0" height="36" fill="#6b8fd4" fill-opacity="0.35" stroke="#6b8fd4"/>
  <text x="258.0" y="118" fill="#6b8fd4" font-size="8.5" text-anchor="middle">10%</text>
  <rect x="288.0" y="96" width="102.0" height="36" fill="#4ec9a3" fill-opacity="0.35" stroke="#4ec9a3"/>
  <text x="339.0" y="118" fill="#4ec9a3" font-size="8.5" text-anchor="middle">17%</text>
  <rect x="390.0" y="96" width="30.0" height="36" fill="#6b6b85" fill-opacity="0.35" stroke="#6b6b85"/>
  <rect x="420.0" y="96" width="150.0" height="36" fill="#e8b84b" fill-opacity="0.35" stroke="#e8b84b"/>
  <text x="495.0" y="118" fill="#e8b84b" font-size="8.5" text-anchor="middle">25%</text>
  <rect x="570.0" y="96" width="120.0" height="36" fill="#f0606a" fill-opacity="0.35" stroke="#f0606a"/>
  <text x="630.0" y="118" fill="#f0606a" font-size="8.5" text-anchor="middle">20%</text>
  <text x="24" y="188" fill="#d8d8e4" font-size="10">游戏</text>
  <rect x="90.0" y="166" width="210.0" height="36" fill="#9b4df0" fill-opacity="0.35" stroke="#9b4df0"/>
  <text x="195.0" y="188" fill="#9b4df0" font-size="8.5" text-anchor="middle">35%</text>
  <rect x="300.0" y="166" width="108.0" height="36" fill="#67b5ef" fill-opacity="0.35" stroke="#67b5ef"/>
  <text x="354.0" y="188" fill="#67b5ef" font-size="8.5" text-anchor="middle">18%</text>
  <rect x="408.0" y="166" width="54.0" height="36" fill="#6b8fd4" fill-opacity="0.35" stroke="#6b8fd4"/>
  <text x="435.0" y="188" fill="#6b8fd4" font-size="8.5" text-anchor="middle">9%</text>
  <rect x="462.0" y="166" width="72.0" height="36" fill="#4ec9a3" fill-opacity="0.35" stroke="#4ec9a3"/>
  <text x="498.0" y="188" fill="#4ec9a3" font-size="8.5" text-anchor="middle">12%</text>
  <rect x="534.0" y="166" width="36.0" height="36" fill="#6b6b85" fill-opacity="0.35" stroke="#6b6b85"/>
  <rect x="570.0" y="166" width="90.0" height="36" fill="#e8b84b" fill-opacity="0.35" stroke="#e8b84b"/>
  <text x="615.0" y="188" fill="#e8b84b" font-size="8.5" text-anchor="middle">15%</text>
  <rect x="660.0" y="166" width="30.0" height="36" fill="#f0606a" fill-opacity="0.35" stroke="#f0606a"/>
  <text x="24" y="258" fill="#d8d8e4" font-size="10">视频 / 渲染</text>
  <rect x="90.0" y="236" width="108.0" height="36" fill="#9b4df0" fill-opacity="0.35" stroke="#9b4df0"/>
  <text x="144.0" y="258" fill="#9b4df0" font-size="8.5" text-anchor="middle">18%</text>
  <rect x="198.0" y="236" width="180.0" height="36" fill="#67b5ef" fill-opacity="0.35" stroke="#67b5ef"/>
  <text x="288.0" y="258" fill="#67b5ef" font-size="8.5" text-anchor="middle">30%</text>
  <rect x="378.0" y="236" width="48.0" height="36" fill="#6b8fd4" fill-opacity="0.35" stroke="#6b8fd4"/>
  <rect x="426.0" y="236" width="156.0" height="36" fill="#4ec9a3" fill-opacity="0.35" stroke="#4ec9a3"/>
  <text x="504.0" y="258" fill="#4ec9a3" font-size="8.5" text-anchor="middle">26%</text>
  <rect x="582.0" y="236" width="24.0" height="36" fill="#6b6b85" fill-opacity="0.35" stroke="#6b6b85"/>
  <rect x="606.0" y="236" width="72.0" height="36" fill="#e8b84b" fill-opacity="0.35" stroke="#e8b84b"/>
  <text x="642.0" y="258" fill="#e8b84b" font-size="8.5" text-anchor="middle">12%</text>
  <rect x="678.0" y="236" width="12.0" height="36" fill="#f0606a" fill-opacity="0.35" stroke="#f0606a"/>

  <line x1="24" y1="296" x2="736" y2="296" stroke="#2a2a44"/>
  <rect x="90" y="312" width="10" height="10" rx="2" fill="#9b4df0" fill-opacity="0.45" stroke="#9b4df0"/>
  <text x="105" y="321" fill="#9a9ab4" font-size="8.5">显卡</text>
  <rect x="182" y="312" width="10" height="10" rx="2" fill="#67b5ef" fill-opacity="0.45" stroke="#67b5ef"/>
  <text x="197" y="321" fill="#9a9ab4" font-size="8.5">CPU</text>
  <rect x="274" y="312" width="10" height="10" rx="2" fill="#6b8fd4" fill-opacity="0.45" stroke="#6b8fd4"/>
  <text x="289" y="321" fill="#9a9ab4" font-size="8.5">主板</text>
  <rect x="366" y="312" width="10" height="10" rx="2" fill="#4ec9a3" fill-opacity="0.45" stroke="#4ec9a3"/>
  <text x="381" y="321" fill="#9a9ab4" font-size="8.5">内存硬盘</text>
  <rect x="458" y="312" width="10" height="10" rx="2" fill="#6b6b85" fill-opacity="0.45" stroke="#6b6b85"/>
  <text x="473" y="321" fill="#9a9ab4" font-size="8.5">电源机箱</text>
  <rect x="550" y="312" width="10" height="10" rx="2" fill="#e8b84b" fill-opacity="0.45" stroke="#e8b84b"/>
  <text x="565" y="321" fill="#9a9ab4" font-size="8.5">显示器</text>
  <rect x="642" y="312" width="10" height="10" rx="2" fill="#f0606a" fill-opacity="0.45" stroke="#f0606a"/>
  <text x="657" y="321" fill="#9a9ab4" font-size="8.5">外设</text>

  <text x="24" y="352" fill="#e8b84b" font-size="9">注意每一行的「大块」在哪：办公压在显示器，游戏压在显卡，渲染压在 CPU 和内存。</text>
  <text x="24" y="374" fill="#9a9ab4" font-size="9">这不是「哪个件更重要」，是「哪个件决定你的体验上限」。</text>
  <text x="24" y="394" fill="#6b6b85" font-size="8.5">比例可以浮动，但某一项超过一半时，往往意味着其他项被牺牲了——那正是瓶颈要出现的地方。</text>
</svg>
