<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">「出资加速到期」：公司还不上钱，股东就躲不掉了</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这条规则是有限责任那道墙上，最常被撞开的一个口子</text>
<defs><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#8a8aa0"/></marker></defs><rect x="30" y="74" width="700" height="54" rx="6" fill="#16161f" stroke="#e8965a" stroke-width="1.4"/>
<text x="50" y="96" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">① 公司欠债</text>
<text x="50" y="116" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">供应商、房东、员工工资，加起来 500 万</text>
<line x1="380" y1="128" x2="380" y2="138" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#a1)"/><rect x="30" y="136" width="700" height="54" rx="6" fill="#16161f" stroke="#e8965a" stroke-width="1.4"/>
<text x="50" y="158" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">② 公司资产只剩</text>
<text x="50" y="178" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">账上 100 万，设备卖了 0，缺口 400 万</text>
<line x1="380" y1="190" x2="380" y2="200" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#a1)"/><rect x="30" y="198" width="700" height="54" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.4"/>
<text x="50" y="220" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">③ 债权人起诉</text>
<text x="50" y="240" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">胜诉后申请执行，发现公司没钱</text>
<line x1="380" y1="252" x2="380" y2="262" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#a1)"/><rect x="30" y="260" width="700" height="54" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.4"/>
<text x="50" y="282" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">④ 法院查工商登记</text>
<text x="50" y="302" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注册资本 1000 万，实缴 100 万，未缴 900 万</text>
<line x1="380" y1="314" x2="380" y2="324" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#a1)"/><rect x="30" y="322" width="700" height="54" rx="6" fill="#16161f" stroke="#e87a8a" stroke-width="1.4"/>
<text x="50" y="344" fill="#e87a8a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">⑤ 出资加速到期</text>
<text x="50" y="364" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">股东要在未缴的 900 万里，补足这 400 万</text>
<text x="380" y="392" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意：补的是「欠债缺口 400 万」，不是全部 900 万——但只要公司还不上，这个口子就会打开</text>
</svg>
