<svg xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="476" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">该自己做还是该买，看两个维度</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">是不是核心能力，以及一年要做多少次</text>
<rect x="120" y="92" width="250" height="140" rx="4" fill="#67b5ef14" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="370" y="92" width="250" height="140" rx="4" fill="#e8b84b14" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="120" y="232" width="250" height="140" rx="4" fill="#67d9a014" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="370" y="232" width="250" height="140" rx="4" fill="#e87a8a14" stroke="#3a3a52" stroke-width="1.2"/>
<text x="245" y="116" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">高频 · 核心</text>
<text x="495" y="116" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">高频 · 非核心</text>
<text x="245" y="256" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">低频 · 核心</text>
<text x="495" y="256" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">低频 · 非核心</text>
<text x="245" y="140" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">产品决策、核心代码</text>
<text x="245" y="162" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">客户沟通、定价</text>
<text x="495" y="140" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">客服、运维</text>
<text x="495" y="162" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">常规内容更新</text>
<text x="245" y="280" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">架构设计、关键合同</text>
<text x="245" y="302" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">选技术方向</text>
<text x="495" y="280" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记账报税、法务</text>
<text x="495" y="302" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">设计、测试、备案</text>
<text x="245" y="398" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">自己做，或招人</text>
<text x="495" y="398" fill="#e8b84b" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">先外包，稳定后招人</text>
<text x="245" y="418" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">自己做 + 买工具</text>
<text x="495" y="418" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">直接买，别学</text>
<text x="340" y="78" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">横轴：一年发生的次数 —— 左边少，右边多</text>
<text x="60" y="160" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">核心</text>
<text x="60" y="300" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">非核心</text>
<text x="340" y="454" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">右下角是最该花钱的：不常发生、不重要、但一旦做错代价很高。</text>
</svg>
