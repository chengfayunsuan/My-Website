<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.2-4  M0、M1、M2：钱的三种口径</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">层层包含，按「能不能马上花」排序。面积不按真实比例，只看层级</text>
<rect x="56" y="92" width="486" height="212" rx="6" fill="#141824" stroke="#3a4a5e" stroke-width="1.3"/>
<rect x="120" y="132" width="358" height="132" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.3"/>
<rect x="204" y="166" width="190" height="64" rx="4" fill="#16281c" stroke="#67d9a0" stroke-width="1.3"/>
<text x="72" y="116" fill="#a8c0d8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">M2</text>
<text x="104" y="116" fill="#8fa8c0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 313 万亿</text>
<text x="136" y="154" fill="#67b5ef" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">M1</text>
<text x="168" y="154" fill="#8fb0cc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">六十多万亿</text>
<text x="220" y="196" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">M0</text>
<text x="252" y="196" fill="#8fc8a8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 12 万亿</text>
<text x="220" y="218" fill="#6f9a80" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">流通中现金</text>
<text x="572" y="118" fill="#a8c0d8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">M2</text>
<text x="604" y="118" fill="#8fa8c0" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">M1 + 定期、储蓄、其他存款</text>
<text x="572" y="136" fill="#6f8296" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">潜在购买力，锁了一段时间</text>
<text x="572" y="172" fill="#67b5ef" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">M1</text>
<text x="604" y="172" fill="#8fb0cc" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">M0 + 单位活期存款</text>
<text x="572" y="190" fill="#6f8296" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">随时能付，是经济活跃度的先行指标</text>
<text x="572" y="226" fill="#67d9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">M0</text>
<text x="604" y="226" fill="#8fc8a8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">流通中的钞票和硬币</text>
<text x="572" y="244" fill="#6f9a80" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">唯一不依赖银行账户的钱</text>
<text x="572" y="280" fill="#7a7a94" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2025 年起 M1 口径调整，</text>
<text x="572" y="296" fill="#7a7a94" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">纳入个人活期和支付备付金，</text>
<text x="572" y="312" fill="#7a7a94" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数字会跳一档，含义不变。</text>
<text x="40" y="344" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三个数放一起看，能判断钱是「活的」还是「睡着的」：M1 增速快于 M2，说明钱在往活期搬，准备花或准备投资。</text>
<text x="40" y="368" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">反过来，M2 涨而 M1 不涨，说明钱存成了定期，大家在观望。这个组合在 2022 年之后出现过很多次。</text>
<text x="40" y="398" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">别拿「M2 是 GDP 两倍多」说货币超发：中国以银行间接融资为主，贷款一放就造出存款，M2 自然高；美国以直接融资为主，发债发股票不经过银行。</text>
<text x="40" y="422" fill="#6f7f92" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">M2/GDP 高，说明的是融资结构，不是印了多少钞票。</text>
</svg>
