<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="452" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.2-6  三次保卫战：同一种打法，三种结局</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">都是「用利率和储备去顶一个价格」。区别只在于，对手的钱比你多多少</text>
<rect x="40" y="84" width="260" height="300" rx="5" fill="#2a1a20" stroke="#e87a8a" stroke-width="1.4"/>
<text x="58" y="122" fill="#e87a8a" font-size="13.5" text-anchor="start" font-family="monospace" font-weight="600">1992.09.16</text>
<text x="58" y="152" fill="#dfe4f0" font-size="12.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">英镑保卫战</text>
<line x1="58" y1="166" x2="282" y2="166" stroke="#33334a" stroke-width="1"/>
<text x="58" y="196" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">做法</text>
<text x="58" y="214" fill="#b0b4c6" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一天内两次加息，10% → 12% → 15%</text>
<text x="58" y="258" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果</text>
<text x="58" y="276" fill="#b0b4c6" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还是被踢出欧洲汇率机制，英镑贬值</text>
<text x="58" y="320" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">教训</text>
<text x="58" y="338" fill="#b0b4c6" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">利率提到 15%，也留不住要跑的钱</text>
<rect x="320" y="84" width="260" height="300" rx="5" fill="#2a2410" stroke="#e8b84b" stroke-width="1.4"/>
<text x="338" y="122" fill="#e8b84b" font-size="13.5" text-anchor="start" font-family="monospace" font-weight="600">1997.07.02</text>
<text x="338" y="152" fill="#dfe4f0" font-size="12.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">泰铢保卫战</text>
<line x1="338" y1="166" x2="562" y2="166" stroke="#33334a" stroke-width="1"/>
<text x="338" y="196" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">做法</text>
<text x="338" y="214" fill="#b0b4c6" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">动用外汇储备接盘，同时把利率拉高</text>
<text x="338" y="258" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果</text>
<text x="338" y="276" fill="#b0b4c6" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">储备见底，放弃钉住，当天贬 15%</text>
<text x="338" y="320" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">教训</text>
<text x="338" y="338" fill="#b0b4c6" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">储备再多，也扛不住所有人一起跑</text>
<rect x="600" y="84" width="260" height="300" rx="5" fill="#2a2018" stroke="#e8965a" stroke-width="1.4"/>
<text x="618" y="122" fill="#e8965a" font-size="13.5" text-anchor="start" font-family="monospace" font-weight="600">2015.01.15</text>
<text x="618" y="152" fill="#dfe4f0" font-size="12.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">瑞郎脱钩</text>
<line x1="618" y1="166" x2="842" y2="166" stroke="#33334a" stroke-width="1"/>
<text x="618" y="196" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">做法</text>
<text x="618" y="214" fill="#b0b4c6" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">突然宣布取消 1.20 的汇率下限</text>
<text x="618" y="258" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果</text>
<text x="618" y="276" fill="#b0b4c6" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">瑞郎当天暴涨 30%，一批券商爆仓</text>
<text x="618" y="320" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">教训</text>
<text x="618" y="338" fill="#b0b4c6" font-size="8.9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钉了三年半，取消只用了一秒</text>
<text x="40" y="414" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三次的共同点：价格是公开承诺的，而对手的钱是无限的。只要市场相信你会守，守的成本就低；一旦市场相信你守不住，成本会瞬间变成天文数字。</text>
<text x="40" y="438" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以真正决定成败的不是储备多少，是「别人信不信你还有储备」。这就是为什么央行从来不肯公布干预的细节。</text>
</svg>
