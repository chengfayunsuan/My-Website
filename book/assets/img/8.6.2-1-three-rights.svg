<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">同一家公司里，三种保护管三件不同的事</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">著作权管表达，商标管标识，专利管技术方案</text>
<rect x="36" y="84" width="194" height="346" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="36" y="84" width="194" height="40" rx="6" fill="#67b5ef2a" stroke="none" stroke-width="0"/>
<text x="133" y="110" fill="#67b5ef" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">著作权</text>
<text x="52" y="152" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保护什么</text>
<text x="52" y="172" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代码、文章、图片、UI——「表达」</text>
<text x="52" y="224" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">怎么取得</text>
<text x="52" y="244" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">写完就有，不用登记</text>
<text x="52" y="296" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保护多久</text>
<text x="52" y="316" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">财产权至作者死后 50 年</text>
<text x="52" y="368" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个提醒</text>
<text x="52" y="388" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不保护功能和算法</text>
<rect x="242" y="84" width="194" height="346" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="242" y="84" width="194" height="40" rx="6" fill="#e8b84b2a" stroke="none" stroke-width="0"/>
<text x="339" y="110" fill="#e8b84b" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">商标</text>
<text x="258" y="152" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保护什么</text>
<text x="258" y="172" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">名字、Logo、口号——「标识」</text>
<text x="258" y="224" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">怎么取得</text>
<text x="258" y="244" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">必须申请注册，约 8~12 个月</text>
<text x="258" y="296" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保护多久</text>
<text x="258" y="316" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">10 年，可无限续展</text>
<text x="258" y="368" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个提醒</text>
<text x="258" y="388" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不注册就无权禁止他人用</text>
<rect x="448" y="84" width="194" height="346" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="448" y="84" width="194" height="40" rx="6" fill="#67d9a02a" stroke="none" stroke-width="0"/>
<text x="545" y="110" fill="#67d9a0" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">专利</text>
<text x="464" y="152" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保护什么</text>
<text x="464" y="172" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">技术方案、产品外观——「点子」</text>
<text x="464" y="224" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">怎么取得</text>
<text x="464" y="244" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">申请并经审查，发明约 1~3 年</text>
<text x="464" y="296" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保护多久</text>
<text x="464" y="316" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发明 20 年 · 实用新型 10 年</text>
<text x="464" y="368" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个提醒</text>
<text x="464" y="388" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">以公开技术方案为代价</text>
<text x="340" y="456" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三张卡是三种并列的权利，一个产品往往三种都需要。</text>
</svg>
