<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.2-1  调试器凭什么能控制别人的程序</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">靠操作系统的 ptrace：调试器是父，被调试的是子，所有读写都走系统调用</text>
<rect x="40" y="100" width="236" height="180" rx="5" fill="#14141e" stroke="#4a4a66" stroke-width="1.4"/>
<text x="158" y="126" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">调试器</text>
<text x="158" y="144" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">gdb / lldb / VS Code</text>
<text x="58" y="172" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 显示源码和变量</text>
<text x="58" y="196" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 把行号翻译成地址</text>
<text x="58" y="220" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 决定「停 / 继续 / 走一步」</text>
<text x="58" y="244" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 读写对方的内存和寄存器</text>
<rect x="604" y="100" width="236" height="180" rx="5" fill="#14141e" stroke="#4a4a66" stroke-width="1.4"/>
<text x="722" y="126" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">被调试的进程</text>
<text x="722" y="144" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的程序，原样运行</text>
<text x="622" y="172" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 不知道自己在被观察</text>
<text x="622" y="196" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 该算的照算</text>
<text x="622" y="220" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 碰到 int3 就停住</text>
<text x="622" y="244" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 停下来等指令</text>
<line x1="288" y1="152" x2="592" y2="152" stroke="#67b5ef" stroke-width="1.6"/>
<path d="M592,147 L604,152 L592,157 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<text x="440" y="142" fill="#67b5ef" font-size="9" text-anchor="middle" font-family="monospace">PTRACE_ATTACH / PEEKDATA / POKEDATA</text>
<text x="440" y="128" fill="#5f7f9a" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">读内存、写内存、改寄存器</text>
<text x="440" y="170" fill="#5f7f9a" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">继续跑 / 走一步 / 下一个断点</text>
<line x1="592" y1="228" x2="288" y2="228" stroke="#67d9a0" stroke-width="1.6"/>
<path d="M288,223 L276,228 L288,233 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<text x="440" y="214" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">SIGTRAP</text>
<text x="440" y="250" fill="#4a7a62" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">「我停了，你来看」</text>
<line x1="40" y1="306" x2="840" y2="306" stroke="#2a2a3e" stroke-width="1"/>
<text x="40" y="332" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">这套机制有三条硬限制</text>
<circle cx="48" cy="354.5" r="3" fill="#e8b84b"/>
<text x="60" y="358" fill="#c8c8dc" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">必须有权限</text>
<text x="166" y="358" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你要么是同一个用户，要么是 root。否则任何程序都能被任意人读写内存。</text>
<circle cx="48" cy="378.5" r="3" fill="#e8b84b"/>
<text x="60" y="382" fill="#c8c8dc" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">一个只能被一个盯</text>
<text x="166" y="382" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个进程同时只能被一个调试器 attach，第二个会被拒绝。</text>
<circle cx="48" cy="402.5" r="3" fill="#e8b84b"/>
<text x="60" y="406" fill="#c8c8dc" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">只能父盯子</text>
<text x="166" y="406" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">被调试进程必须由调试器 fork 出来，或者显式允许被 attach。</text>
</svg>
