<svg xmlns="http://www.w3.org/2000/svg" width="880" height="316" viewBox="0 0 880 316" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="316" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.6 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小额像现金，大额要留痕</text>
<rect x="40" y="100" width="800" height="34" rx="4" fill="#1a1a28" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="40" y="100" width="300" height="34" rx="4" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<rect x="340" y="100" width="240" height="34" rx="4" fill="#e8b84b" stroke="#e8b84b" stroke-width="0"/>
<rect x="580" y="100" width="260" height="34" rx="4" fill="#e87a8a" stroke="#e87a8a" stroke-width="0"/>
<text x="190" y="122" fill="#101018" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小额：匿名</text>
<text x="460" y="122" fill="#101018" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中额：实名钱包</text>
<text x="710" y="122" fill="#101018" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大额：可追溯</text>
<text x="40" y="76" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">匿名程度</text>
<text x="40" y="168" fill="#b8b8cc" font-size="11.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小额钱包可以只绑手机号，不绑银行卡，付早餐、坐公交，跟用现金差不多。</text>
<text x="40" y="194" fill="#b8b8cc" font-size="11.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱包分四类，额度越高，需要的实名信息越多。大额钱包要绑身份证、银行卡，流水可查。</text>
<text x="40" y="232" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以官方的说法是「可控匿名」：对商家匿名，对央行可控。</text>
<text x="40" y="268" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这跟比特币的「完全匿名」不是一回事——比特币是可追踪的，只是地址后面是谁不好查。</text>
</svg>
