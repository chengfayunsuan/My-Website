<svg width="900" height="384" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="384" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">缓冲区溢出：写超长字符串会盖掉什么</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左边的栈从高地址往低地址排；红色是攻击者想要够到的东西</text>
<text x="40" y="92" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">① 正常布局</text>
<text x="300" y="92" fill="#e87a8a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">② strcpy 溢出之后</text>
<rect x="40" y="104" width="190" height="40" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.5"/>
<text x="135.0" y="123" fill="#e8965a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">返回地址</text>
<text x="135.0" y="137" fill="#8a8aa2" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ret 会跳到这</text>
<rect x="40" y="146" width="190" height="40" rx="3" fill="#191924" stroke="#3a3a52" stroke-width="1.5"/>
<text x="135.0" y="165" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保存的 rbp</text>
<rect x="40" y="188" width="190" height="40" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.5"/>
<text x="135.0" y="207" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">canary</text>
<text x="135.0" y="221" fill="#8a8aa2" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">%fs:0x28</text>
<rect x="40" y="230" width="190" height="40" rx="3" fill="#191924" stroke="#3a3a52" stroke-width="1.5"/>
<text x="135.0" y="249" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">char buf[16]</text>
<text x="135.0" y="263" fill="#8a8aa2" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">局部数组</text>
<rect x="300" y="104" width="190" height="40" rx="3" fill="#2e1620" stroke="#e87a8a" stroke-width="1.5"/>
<text x="395.0" y="123" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">返回地址</text>
<text x="395.0" y="137" fill="#8a8aa2" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">已被改成 0xdeadbeef</text>
<rect x="300" y="146" width="190" height="40" rx="3" fill="#2e1620" stroke="#e87a8a" stroke-width="1.5"/>
<text x="395.0" y="165" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保存的 rbp</text>
<text x="395.0" y="179" fill="#8a8aa2" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">已被覆盖</text>
<rect x="300" y="188" width="190" height="40" rx="3" fill="#33240f" stroke="#e8965a" stroke-width="1.5"/>
<text x="395.0" y="207" fill="#e8965a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">canary</text>
<text x="395.0" y="221" fill="#8a8aa2" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">已被覆盖</text>
<rect x="300" y="230" width="190" height="40" rx="3" fill="#191924" stroke="#3a3a52" stroke-width="1.5"/>
<text x="395.0" y="249" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">char buf[16]</text>
<text x="395.0" y="263" fill="#8a8aa2" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">超长输入从这里开始写</text>
<line x1="468" y1="264" x2="468" y2="110" stroke="#e87a8a" stroke-width="2"/>
<path d="M468,106 L462,116 L474,116 Z" fill="#e87a8a"/>
<line x1="234" y1="196" x2="294" y2="196" stroke="#e87a8a" stroke-width="2"/>
<path d="M296,196 L286,191 L286,201 Z" fill="#e87a8a"/>
<text x="265.0" y="186" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">写</text>
<text x="265.0" y="214" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">溢出</text>
<text x="560" y="92" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">③ 三道防线</text>
<rect x="560" y="104" width="300" height="58" rx="3" fill="#171722" stroke="#e8b84b" stroke-width="1.3"/>
<text x="572" y="124" fill="#e8b84b" font-size="12" text-anchor="start" font-family="monospace">canary</text>
<text x="572" y="142" fill="#a8a8c0" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">序言存一个随机值，返回前比对。</text>
<text x="572" y="156" fill="#a8a8c0" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不对就 __stack_chk_fail 终止。</text>
<rect x="560" y="170" width="300" height="58" rx="3" fill="#171722" stroke="#67d9a0" stroke-width="1.3"/>
<text x="572" y="190" fill="#67d9a0" font-size="12" text-anchor="start" font-family="monospace">NX</text>
<text x="572" y="208" fill="#a8a8c0" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">栈所在的内存页标记为不可执行，</text>
<text x="572" y="222" fill="#a8a8c0" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">跳上去也跑不了代码。</text>
<rect x="560" y="236" width="300" height="58" rx="3" fill="#171722" stroke="#67b5ef" stroke-width="1.3"/>
<text x="572" y="256" fill="#67b5ef" font-size="12" text-anchor="start" font-family="monospace">ASLR</text>
<text x="572" y="274" fill="#a8a8c0" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每次运行栈地址都不一样，</text>
<text x="572" y="288" fill="#a8a8c0" font-size="10.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">就算能跳也猜不准跳哪。</text>
<text x="40" y="304" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还有第四道：影子栈（CET）。把返回地址存两份，一份在栈上、一份在硬件保护的地方，ret 时比对——栈上那份改了没用。</text>
<text x="40" y="328" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意 canary 的低字节固定是 0x00：字符串函数写到那里会截断，攻击者想覆盖它就写不到后面的返回地址。</text>
<text x="40" y="350" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这套东西从 1988 年（Morris 蠕虫）打到现在，每一层都是被绕过之后加上去的。</text>
</svg>
