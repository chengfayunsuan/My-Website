<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" width="880" height="486" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="486" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.1-6  1971 年 8 月 15 日，那扇窗关上之后</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从「暂时关闭」到浮动汇率合法化，用了四年半</text>
<line x1="158" y1="92" x2="158" y2="436" stroke="#3a3a52" stroke-width="1.4"/>
<circle cx="158" cy="106" r="6" fill="#e87a8a"/>
<text x="142" y="111" fill="#e87a8a" font-size="9.6" text-anchor="end" font-family="monospace">1971.8.15</text>
<text x="180" y="104" fill="#dfe4f0" font-size="11.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">尼克松电视讲话：关闭黄金窗口</text>
<text x="180" y="124" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">说是「暂时」，同时冻结工资物价 90 天、加征 10% 进口附加税</text>
<text x="180" y="141" fill="#5f5f78" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">二十一点整，全国直播。措辞是「暂时中止」，但没人说得出什么时候恢复</text>
<circle cx="158" cy="180" r="6" fill="#e8b84b"/>
<text x="142" y="185" fill="#e8b84b" font-size="9.6" text-anchor="end" font-family="monospace">1971.12</text>
<text x="180" y="178" fill="#dfe4f0" font-size="11.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">史密森协定：把金价抬到 38 美元</text>
<text x="180" y="198" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">各国勉强同意，波动幅度放宽到 ±2.25%</text>
<text x="180" y="215" fill="#5f5f78" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这是一次官方贬值，也是最后一次试图把体系修回去</text>
<circle cx="158" cy="254" r="6" fill="#e8965a"/>
<text x="142" y="259" fill="#e8965a" font-size="9.6" text-anchor="end" font-family="monospace">1973.2</text>
<text x="180" y="252" fill="#dfe4f0" font-size="11.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">美元第二次贬值：42.22 美元</text>
<text x="180" y="272" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还是守不住，市场用脚投票</text>
<text x="180" y="289" fill="#5f5f78" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两个月内第二次。固定平价已经没人信了</text>
<circle cx="158" cy="328" r="6" fill="#67d9a0"/>
<text x="142" y="333" fill="#67d9a0" font-size="9.6" text-anchor="end" font-family="monospace">1973.3</text>
<text x="180" y="326" fill="#dfe4f0" font-size="11.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">主要货币集体浮动</text>
<text x="180" y="346" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不再钉美元，汇率交给市场</text>
<text x="180" y="363" fill="#5f5f78" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">固定汇率时代正式结束。往后的汇率是「价格」，不是「规定」</text>
<circle cx="158" cy="402" r="6" fill="#67b5ef"/>
<text x="142" y="407" fill="#67b5ef" font-size="9.6" text-anchor="end" font-family="monospace">1976.1</text>
<text x="180" y="400" fill="#dfe4f0" font-size="11.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">牙买加协定：浮动合法化</text>
<text x="180" y="420" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">黄金不再是货币的锚，IMF 删掉相关条款</text>
<text x="180" y="437" fill="#5f5f78" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">到这一步，「钱」和「黄金」在制度上彻底脱钩</text>
<text x="40" y="462" fill="#a0a0b8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意 1976 年这一格：不是「美元不再值钱」，而是「货币的价值从此由发行者的信用决定」—— 这就是第三代货币。</text>
</svg>
