<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.7.2-4  改不同文件，Git 说没问题，合起来照样崩</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">文本冲突只是「同一块区域被两边改了」。语义冲突 Git 完全看不见</text>
<text x="30" y="84" fill="#8a8aa2" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">两个 PR，各改一个文件</text>
<rect x="30" y="96" width="400" height="108" rx="4" fill="#16202c" stroke="#67b5ef" stroke-width="1.2"/>
<text x="46" y="118" fill="#67b5ef" font-size="9.5" text-anchor="start" font-family="monospace" font-weight="600">PR A：user.h</text>
<text x="46" y="140" fill="#a8707c" font-size="8.4" text-anchor="start" font-family="monospace">- int getUser(int id);</text>
<text x="46" y="160" fill="#67d9a0" font-size="8.4" text-anchor="start" font-family="monospace">+ int getUser(int id, bool cache);</text>
<text x="46" y="184" fill="#6f6f88" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">加了个参数</text>
<rect x="452" y="96" width="400" height="108" rx="4" fill="#2a2410" stroke="#e8b84b" stroke-width="1.2"/>
<text x="468" y="118" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="monospace" font-weight="600">PR B：order.c</text>
<text x="468" y="140" fill="#67d9a0" font-size="8.4" text-anchor="start" font-family="monospace">+ User u = getUser(123);</text>
<text x="468" y="160" fill="#67d9a0" font-size="8.4" text-anchor="start" font-family="monospace">+ charge(u);</text>
<text x="468" y="184" fill="#6f6f88" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">新增了一处调用</text>
<text x="30" y="236" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">Git 的判断：</text>
<text x="120" y="236" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两个文件不同，没有重叠的行 → 自动合并成功 ✓</text>
<line x1="30" y1="258" x2="850" y2="258" stroke="#2a2a3e" stroke-width="1"/>
<text x="30" y="284" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">合并之后编译：</text>
<rect x="30" y="296" width="560" height="44" rx="3" fill="#2a1a20" stroke="#e87a8a" stroke-width="1.2"/>
<text x="46" y="323" fill="#e87a8a" font-size="8.6" text-anchor="start" font-family="monospace">error: too few arguments to function 'getUser(int, bool)'</text>
<text x="30" y="372" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">更麻烦的情况：类型对得上，但行为变了</text>
<text x="30" y="396" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">他改的是「这个函数现在会写缓存」，你加的是「每次下单都调一次」。</text>
<text x="30" y="416" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">编译通过、测试可能也过，但高并发下缓存被写爆 —— 这种 bug 要等线上才炸。</text>
<text x="30" y="452" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「我的 PR 没冲突」不等于「我的 PR 是安全的」。冲突只是文本层面的提示，语义要人自己看。</text>
</svg>
