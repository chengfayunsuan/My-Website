<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">注册资本 1000 万，账上可能只有 100 万</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">执照上写的是「承诺」，对公户里躺的才是「真钱」</text>
<defs><pattern id="hatch3" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#4a4a62" stroke-width="2"/></pattern></defs><text x="74" y="88" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">实缴 100 万</text>
<text x="74" y="104" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">已经在账上</text>
<rect x="40" y="114" width="68" height="94" rx="4" fill="#12241a" stroke="#67d9a0" stroke-width="1.5"/>
<text x="380" y="88" fill="#e8965a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">认缴未缴 900 万</text>
<text x="380" y="104" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只是一句承诺</text>
<rect x="108" y="114" width="612" height="94" rx="4" fill="url(#hatch3)" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="40" y="114" width="680" height="94" rx="4" fill="none" stroke="#e8b84b" stroke-width="1.5"/>
<text x="74" y="228" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">↑ 真钱</text>
<text x="400" y="228" fill="#e8965a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">↑ 你的负债，五年内要补齐</text>
<line x1="40" y1="240" x2="720" y2="240" stroke="#3a3a52" stroke-width="1"/>
<text x="380" y="262" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这个长条 = 营业执照上的「注册资本 1000 万」</text>
<rect x="30" y="282" width="700" height="124" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="50" y="308" fill="#e87a8a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">写大了会怎样</text>
<text x="50" y="332" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 五年内必须真金白银交进去（2024 年新《公司法》），交不出就是违约</text>
<text x="50" y="354" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 公司还不上债时，未缴的出资「加速到期」，债主可以直接找你要</text>
<text x="50" y="376" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 想改小？减资要通知债权人并公告 30 天，对方有权要求你先还钱</text>
<text x="50" y="398" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 按实收资本交印花税，万分之二点五（目前减半），1000 万就是 1250 元</text>
</svg>
