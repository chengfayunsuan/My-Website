<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.4.4 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个小盒子，装的不是同一种钱</text>
<text x="40" y="78" fill="#67b5ef" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">借记卡</text>
<rect x="40" y="90" width="170" height="70" rx="6" fill="#15151f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="125" y="118" fill="#dcdcea" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的存款</text>
<text x="125" y="140" fill="#8a8aa0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在银行账上</text>
<path d="M214,125 L254,125" fill="none" stroke="#8a8aa0" stroke-width="1.4"/>
<path d="M254,120 L262,125 L254,130 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="266" y="90" width="170" height="70" rx="6" fill="#15151f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="351" y="118" fill="#dcdcea" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商户</text>
<text x="351" y="140" fill="#8a8aa0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱当场就少了</text>
<text x="40" y="196" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">花的是已经有的钱，余额不够就刷不过去。</text>
<text x="40" y="240" fill="#e8965a" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">信用卡</text>
<rect x="40" y="252" width="170" height="60" rx="6" fill="#15151f" stroke="#e8965a" stroke-width="1.4"/>
<text x="125" y="278" fill="#dcdcea" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行给的额度</text>
<text x="125" y="298" fill="#8a8aa0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还没借的钱</text>
<path d="M214,282 L254,282" fill="none" stroke="#8a8aa0" stroke-width="1.4"/>
<path d="M254,277 L262,282 L254,287 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="266" y="252" width="170" height="60" rx="6" fill="#15151f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="351" y="278" fill="#dcdcea" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商户</text>
<text x="351" y="298" fill="#8a8aa0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱当场到账</text>
<rect x="480" y="80" width="360" height="232" rx="8" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="500" y="108" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">差别只有一条：</text>
<text x="500" y="136" fill="#67b5ef" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">借记卡花的是"你的钱"</text>
<text x="500" y="164" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">信用卡花的是"银行的钱"</text>
<text x="500" y="200" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以信用卡刷的时候不心疼，</text>
<text x="500" y="222" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">到还款日才疼。</text>
<text x="500" y="258" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这也是它赚钱的地方。</text>
<text x="500" y="292" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">额度不是你的资产，是银行愿意借给你的上限。</text>
</svg>
