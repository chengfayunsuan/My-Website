<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="380" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.4 fig4 · 谁能查你的征信</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两类查法：左列要你的书面授权，右列不用</text>
<rect x="30" y="90" width="400" height="200" rx="8" fill="#16161f" stroke="#67b5ef" stroke-width="2"/>
<text x="50" y="124" fill="wht" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">需要你的授权</text>
<text x="50" y="156" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 贷款审批：办房贷、车贷、消费贷</text>
<text x="50" y="186" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 信用卡审批：申卡一次查一次</text>
<text x="50" y="216" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 担保资格审查：你替别人担保</text>
<text x="50" y="246" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 贷后管理：放款后的例行复查</text>
<rect x="450" y="90" width="400" height="200" rx="8" fill="#16161f" stroke="#67d9a0" stroke-width="2"/>
<text x="470" y="124" fill="#67d9a0" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不需要你的授权</text>
<text x="470" y="156" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 本人查询：每年 2 次免费，柜台、自助机、官网都能查</text>
<text x="470" y="186" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 司法机关办案：法院、检察院依法定程序</text>
<text x="470" y="216" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· （除此之外的「免授权查询」，都是违规）</text>
<text x="24" y="330" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意最后一条：放款之后银行还会定期复查你的报告（贷后管理），</text>
<text x="24" y="350" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它在合同里就概括授权了。所以你的报告末尾每年都会多几条查询记录，正常。</text>
</svg>
