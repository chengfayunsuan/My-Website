<svg xmlns="http://www.w3.org/2000/svg" width="680" height="486" viewBox="0 0 680 486" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="486" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">同样是"找人干活"，三种形态的责任差很远</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">签什么合同不算数，实际怎么用工才算数</text>
<text x="128" y="88" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">劳动关系</text>
<rect x="30" y="98" width="196" height="290" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="30" y="98" width="196" height="30" rx="6" fill="#67b5ef26" stroke="none" stroke-width="0"/>
<text x="128" y="118" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">签劳动合同</text>
<text x="46" y="146" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">怎么付</text>
<text x="46" y="164" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按月发工资</text>
<text x="46" y="204" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">社保</text>
<text x="46" y="222" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">必须缴五险</text>
<text x="46" y="262" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管理</text>
<text x="46" y="280" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">考勤、考核</text>
<text x="46" y="297" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">听安排</text>
<text x="46" y="320" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最大风险</text>
<text x="46" y="338" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">解除要给</text>
<text x="46" y="355" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">经济补偿</text>
<text x="128" y="372" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">形态 1</text>
<text x="340" y="88" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">劳务关系</text>
<rect x="242" y="98" width="196" height="290" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="242" y="98" width="196" height="30" rx="6" fill="#e8b84b26" stroke="none" stroke-width="0"/>
<text x="340" y="118" fill="#e8b84b" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">签劳务/服务协议</text>
<text x="258" y="146" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">怎么付</text>
<text x="258" y="164" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按次、按项目</text>
<text x="258" y="204" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">社保</text>
<text x="258" y="222" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不缴，但代扣个税</text>
<text x="258" y="262" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管理</text>
<text x="258" y="280" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只看结果</text>
<text x="258" y="297" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不看过程</text>
<text x="258" y="320" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最大风险</text>
<text x="258" y="338" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">被认定为</text>
<text x="258" y="355" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">事实劳动关系</text>
<text x="340" y="372" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">形态 2</text>
<text x="552" y="88" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">合作关系</text>
<rect x="454" y="98" width="196" height="290" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="454" y="98" width="196" height="30" rx="6" fill="#67d9a026" stroke="none" stroke-width="0"/>
<text x="552" y="118" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">和个体户/公司签</text>
<text x="470" y="146" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">怎么付</text>
<text x="470" y="164" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对公转账</text>
<text x="470" y="181" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开发票</text>
<text x="470" y="204" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">社保</text>
<text x="470" y="222" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对方自己解决</text>
<text x="470" y="262" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管理</text>
<text x="470" y="280" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">自负盈亏</text>
<text x="470" y="320" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最大风险</text>
<text x="470" y="338" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没发票不能</text>
<text x="470" y="355" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">税前扣除</text>
<text x="552" y="372" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">形态 3</text>
<text x="340" y="424" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">判断标准不是合同名字，是"有没有管理从属"——考勤、排班、固定月薪，都是在往劳动关系靠。</text>
<text x="340" y="448" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没签书面劳动合同超过一个月，要付双倍工资。</text>
<text x="340" y="472" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以"用兼职的名义全职用工"，省下的社保会在仲裁时全部补回来。</text>
</svg>
