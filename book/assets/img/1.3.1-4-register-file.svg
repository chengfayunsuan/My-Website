<rect x="788" y="206" width="44" height="24" rx="2" fill="#20202e" stroke="#4a4a62" stroke-width="1.0"/>
<text x="810" y="223" fill="#c8c8dc" font-size="9" text-anchor="middle" font-family="monospace">x30</text>
<rect x="836" y="206" width="44" height="24" rx="2" fill="#2a2432" stroke="#e8965a" stroke-width="1.0"/>
<text x="858" y="223" fill="#e8965a" font-size="9" text-anchor="middle" font-family="monospace">sp</text>
<text x="500" y="254" fill="#8a8aa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">x0～x30 三十一个通用寄存器；sp 单列；xzr 恒为零（读出来永远是 0）。</text>
<text x="500" y="272" fill="#8a8aa0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">w0 就是 x0 的低 32 位：写 w0 会同时把 x0 的高 32 位清零。</text>
<text x="500" y="290" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有「部分更新」，所以没有合并等待。</text>
<rect x="24" y="392" width="852" height="60" rx="4" fill="#14141e" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="40" y="414" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么不是 1000 个寄存器：编码空间。x86 用 3 位编码寄存器，只有 8 个；加一个 REX 位扩到 16 个。</text>
<text x="40" y="436" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ARM64 用 5 位，32 个。寄存器越多，每条指令要留的位越多，代码就越大——这是笔此消彼长的交易。</text>
</svg>
