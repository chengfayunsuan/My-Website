<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.3.1-4  寄存器：两套命名哲学</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">x86 的名字是四层套娃，ARM64 是平铺的 31 个</text>
<text x="24" y="84" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">x86-64：一根柱子，四个名字</text>
<text x="24" y="102" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一块物理存储，切片越切越细</text>
<rect x="60" y="116" width="380" height="42" rx="3" fill="#1a1a28" stroke="#e8965a" stroke-width="1.5"/>
<text x="250.0" y="141.0" fill="#e8965a" font-size="13" text-anchor="middle" font-family="monospace" font-weight="600">RAX</text>
<text x="70" y="133" fill="#6a6a82" font-size="8.5" text-anchor="start" font-family="monospace">64 位 / 8 字节</text>
<rect x="60" y="178" width="190" height="40" rx="3" fill="#1a1a28" stroke="#67d9a0" stroke-width="1.5"/>
<text x="155.0" y="202.0" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="monospace" font-weight="600">EAX</text>
<text x="258" y="202" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">32 位：低半截</text>
<rect x="60" y="238" width="95" height="38" rx="3" fill="#1a1a28" stroke="#67b5ef" stroke-width="1.5"/>
<text x="107.5" y="261.0" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="monospace" font-weight="600">AX</text>
<text x="163" y="261" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">16 位</text>
<rect x="60" y="296" width="47" height="38" rx="3" fill="#1a1a28" stroke="#b58ae8" stroke-width="1.5"/>
<text x="83.5" y="319.0" fill="#b58ae8" font-size="11" text-anchor="middle" font-family="monospace" font-weight="600">AL</text>
<rect x="108" y="296" width="47" height="38" rx="3" fill="#1a1a28" stroke="#e87a8a" stroke-width="1.5"/>
<text x="131.5" y="319.0" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="monospace" font-weight="600">AH</text>
<text x="163" y="312" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">AL、AH 各 8 位，并排挤在低 16 位里</text>
<text x="163" y="328" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">写 AL 只改低 8 位，高 56 位不动</text>
<line x1="60" y1="158" x2="60" y2="168" stroke="#4a4a62" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="440" y1="158" x2="440" y2="168" stroke="#4a4a62" stroke-width="1" stroke-dasharray="3 3"/>
<text x="24" y="350" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">名字的来历：A 累加器 / B 基址 / C 计数 / D 数据，</text>
<text x="24" y="366" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">都是 1970 年代专职寄存器的分工，如今只剩名字。</text>
<text x="500" y="84" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">ARM64：平铺 31 个，加一个零寄存器</text>
<text x="500" y="102" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有 ah/al 这种半截名字</text>
<rect x="500" y="116" width="44" height="24" rx="2" fill="#20202e" stroke="#4a4a62" stroke-width="1.0"/>
<text x="522" y="133" fill="#c8c8dc" font-size="9" text-anchor="middle" font-family="monospace">x0</text>
