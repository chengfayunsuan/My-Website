<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">一份合同要有八块，缺哪块哪块就是坑</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是格式问题，是出事时你手里有没有依据</text>
<rect x="30" y="96" width="150" height="118" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="30" y="96" width="150" height="3" rx="1" fill="#67b5ef" stroke="none" stroke-width="0"/>
<text x="44" y="126" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">01 主体</text>
<text x="44" y="154" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">跟谁签、谁有权签</text>
<rect x="190" y="96" width="150" height="118" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="190" y="96" width="150" height="3" rx="1" fill="#b58ae8" stroke="none" stroke-width="0"/>
<text x="204" y="126" fill="#b58ae8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">02 范围</text>
<text x="204" y="154" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">做什么，也写不做什么</text>
<rect x="350" y="96" width="150" height="118" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="350" y="96" width="150" height="3" rx="1" fill="#e8b84b" stroke="none" stroke-width="0"/>
<text x="364" y="126" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">03 价款</text>
<text x="364" y="154" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">多少钱、按什么节点付</text>
<rect x="510" y="96" width="150" height="118" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="510" y="96" width="150" height="3" rx="1" fill="#67d9a0" stroke="none" stroke-width="0"/>
<text x="524" y="126" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">04 验收</text>
<text x="524" y="154" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">什么样算交付完成</text>
<rect x="30" y="236" width="150" height="118" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="30" y="236" width="150" height="3" rx="1" fill="#e8965a" stroke="none" stroke-width="0"/>
<text x="44" y="266" fill="#e8965a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">05 知识产权</text>
<text x="44" y="294" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">成果归谁，能不能复用</text>
<rect x="190" y="236" width="150" height="118" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="190" y="236" width="150" height="3" rx="1" fill="#e87a8a" stroke="none" stroke-width="0"/>
<text x="204" y="266" fill="#e87a8a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">06 违约</text>
<text x="204" y="294" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">晚了、坏了怎么赔</text>
<rect x="350" y="236" width="150" height="118" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="350" y="236" width="150" height="3" rx="1" fill="#67b5ef" stroke="none" stroke-width="0"/>
<text x="364" y="266" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">07 终止</text>
<text x="364" y="294" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">怎么退出、怎么交接</text>
<rect x="510" y="236" width="150" height="118" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="510" y="236" width="150" height="3" rx="1" fill="#a0a0b8" stroke="none" stroke-width="0"/>
<text x="524" y="266" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">08 争议</text>
<text x="524" y="294" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">去哪解决、怎么送达</text>
<text x="30" y="404" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">八块里最容易被跳过的是 04 和 05——它们不写，出事时默认规则都站在对方那边。</text>
</svg>
