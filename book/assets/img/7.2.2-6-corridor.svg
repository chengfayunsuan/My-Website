<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="412" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.2-6  利率走廊：上下两条线都不是规定，是套利边界</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行绝不会用比上限更贵的价格借钱，也绝不会用比下限更低的利率往外借</text>
<line x1="100" y1="80" x2="100" y2="306" stroke="#4a4a66" stroke-width="1.2"/>
<line x1="100" y1="306" x2="700" y2="306" stroke="#4a4a66" stroke-width="1.2"/>
<line x1="95" y1="300" x2="100" y2="300" stroke="#4a4a66" stroke-width="1"/>
<text x="90" y="304" fill="#6f7f92" font-size="8.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0%</text>
<line x1="100" y1="300" x2="690" y2="300" stroke="#22222f" stroke-width="1"/>
<line x1="95" y1="230" x2="100" y2="230" stroke="#4a4a66" stroke-width="1"/>
<text x="90" y="234" fill="#6f7f92" font-size="8.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1%</text>
<line x1="100" y1="230" x2="690" y2="230" stroke="#22222f" stroke-width="1"/>
<line x1="95" y1="160" x2="100" y2="160" stroke="#4a4a66" stroke-width="1"/>
<text x="90" y="164" fill="#6f7f92" font-size="8.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2%</text>
<line x1="100" y1="160" x2="690" y2="160" stroke="#22222f" stroke-width="1"/>
<line x1="95" y1="90" x2="100" y2="90" stroke="#4a4a66" stroke-width="1"/>
<text x="90" y="94" fill="#6f7f92" font-size="8.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3%</text>
<line x1="100" y1="90" x2="690" y2="90" stroke="#22222f" stroke-width="1"/>
<line x1="100" y1="125.0" x2="690" y2="125.0" stroke="#e87a8a" stroke-width="1.6" stroke-dasharray="7 4"/>
<line x1="100" y1="195.0" x2="690" y2="195.0" stroke="#b58ae8" stroke-width="1.8"/>
<line x1="100" y1="275.5" x2="690" y2="275.5" stroke="#67d9a0" stroke-width="1.6" stroke-dasharray="7 4"/>
<text x="704" y="129.0" fill="#e87a8a" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">SLF 利率　2.5% 上下</text>
<text x="704" y="199.0" fill="#b58ae8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">7 天逆回购　1.5%</text>
<text x="704" y="279.5" fill="#67d9a0" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">超额准备金　0.35%</text>
<path d="M120,186 L160,196 L200,178 L240,190 L280,201 L320,183 L360,176 L400,188 L440,199 L480,181 L520,190 L560,200 L600,184 L640,178 L680,192" fill="none" stroke="#e8b84b" stroke-width="2"/>
<text x="120" y="172" fill="#e8b84b" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">DR007 在这条窄带里波动</text>
<text x="100" y="332" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两条线一画，市场利率就被自动框住了。央行想让它往哪走，不必下命令，只要挪中间那条线、或者调整走廊的宽度。</text>
<text x="100" y="358" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">走廊有个尽头：0%。名义利率低于零，大家会把钱取出来放保险柜，所以常规货币政策在零附近就失效了。</text>
<text x="100" y="384" fill="#6f7f92" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">日本 1999 年降到零、2016 年负利率；欧洲 2014 年负利率。钱便宜到极致，企业还是不借——问题不在价格，在预期。</text>
</svg>
