<text x="370" y="332" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">起点</text>
<line x1="370" y1="298" x2="370" y2="318" stroke="#67d9a0" stroke-width="1" stroke-dasharray="3 3"/>
<text x="440" y="374" fill="#7fd8a8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">叶子之间用双向链表串起来：定位到起点之后顺着链读，不必再回根节点</text>
<text x="40" y="404" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这就是 B+ 树和 B 树的分水岭：B 树的内部节点也存数据，B+ 树把数据全部推到叶子，内部节点只留「指路用的 key」。</text>
<text x="40" y="426" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">好处有三：内部节点更瘦 → 分叉更多 → 树更矮；所有查询都走到同一层 → 耗时可预测；叶子有链 → 范围查询变成顺序读。</text>
</svg>
