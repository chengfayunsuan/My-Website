<svg xmlns="http://www.w3.org/2000/svg" width="680" height="468" viewBox="0 0 680 468" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="468" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">不想干了，注销和吊销是两条完全不同的路</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个是主动退出，一个是被强制，终点差三年</text>
<rect x="30" y="92" width="296" height="250" rx="6" fill="#14141e" stroke="#67d9a0" stroke-width="1.6"/>
<text x="178" y="120" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">主动注销</text>
<text x="52" y="152" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1. 清算（债权债务、税务）</text>
<text x="52" y="180" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2. 税务注销 · 拿到清税证明</text>
<text x="52" y="208" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3. 工商注销 · 营业执照作废</text>
<text x="52" y="236" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4. 银行账户、社保、公章注销</text>
<text x="178" y="286" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">周期：简易 1 个月，一般 2~6 个月</text>
<text x="178" y="310" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果：干净退出，法人不受限</text>
<text x="178" y="330" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">以后还能再开公司</text>
<rect x="354" y="92" width="296" height="250" rx="6" fill="#14141e" stroke="#e87a8a" stroke-width="1.6"/>
<text x="502" y="120" fill="#e87a8a" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">被吊销</text>
<text x="376" y="152" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1. 违法被市场监管处罚</text>
<text x="376" y="180" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2. 执照被收缴，主体还在</text>
<text x="376" y="208" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3. 不注销 → 进黑名单</text>
<text x="376" y="236" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4. 法人 3 年内不得任董事、监事、高管</text>
<text x="502" y="286" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">周期：处罚即时生效，清理可能拖几年</text>
<text x="502" y="310" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果：债务仍在，法人受限</text>
<text x="502" y="330" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">征信、出行、投标都受影响</text>
<text x="340" y="378" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">吊销不等于注销：执照没了，公司还在，债还在。</text>
<rect x="30" y="398" width="620" height="50" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="50" y="418" fill="#e8b84b" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">想停就尽早注销。拖着不办，省下的是几千块代办费，赔上的是三年的资格。</text>
<text x="50" y="434" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">简易注销适用于没开业、没债权债务的；有经营过的一般要走一般注销。</text>
</svg>
