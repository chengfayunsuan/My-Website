<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">写了验收期和没写，是两种命运</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个项目，第 0 天交付，第 60 天还没收到钱</text>
<line x1="100" y1="330" x2="614" y2="330" stroke="#4a4a62" stroke-width="1.5"/>
<line x1="100.0" y1="326" x2="100.0" y2="334" stroke="#4a4a62" stroke-width="1.2"/>
<text x="100.0" y="350" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 0 天</text>
<line x1="158.33333333333334" y1="326" x2="158.33333333333334" y2="334" stroke="#4a4a62" stroke-width="1.2"/>
<text x="158.33333333333334" y="350" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 7 天</text>
<line x1="225.0" y1="326" x2="225.0" y2="334" stroke="#4a4a62" stroke-width="1.2"/>
<text x="225.0" y="350" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 15 天</text>
<line x1="350.0" y1="326" x2="350.0" y2="334" stroke="#4a4a62" stroke-width="1.2"/>
<text x="350.0" y="350" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 30 天</text>
<line x1="600.0" y1="326" x2="600.0" y2="334" stroke="#4a4a62" stroke-width="1.2"/>
<text x="600.0" y="350" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 60 天</text>
<text x="92" y="116" fill="#67d9a0" font-size="12" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">写了验收期</text>
<rect x="100" y="96" width="58.33333333333334" height="38" rx="3" fill="#67d9a033" stroke="#67d9a0" stroke-width="1.3"/>
<text x="100" y="88" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">交付 · 第 0 天</text>
<text x="166.33333333333334" y="120" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">7 天内不提异议 → 视为验收</text>
<line x1="158.33333333333334" y1="134" x2="158.33333333333334" y2="168" stroke="#67d9a0" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="166.33333333333334" y="182" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 10 天尾款到账</text>
<rect x="162.33333333333334" y="190" width="60" height="26" rx="4" fill="#16161f" stroke="#67d9a0" stroke-width="1.2"/>
<text x="192.33333333333334" y="208" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">￥尾款</text>
<text x="92" y="246" fill="#e87a8a" font-size="12" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">没写验收期</text>
<rect x="100" y="226" width="486.0" height="38" rx="3" fill="#e87a8a26" stroke="#e87a8a" stroke-width="1.3"/>
<text x="106" y="250" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">交付 · 第 0 天</text>
<text x="316.66666666666663" y="250" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">"我再看看，最近忙"</text>
<path d="M350,265 L583,265" stroke="#e87a8a" stroke-width="1.3" stroke-dasharray="3 4"/>
<text x="500.0" y="284" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 钱没有终点，只有"再看看"</text>
<text x="30" y="392" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">验收期是唯一能把"客户不满意"变成"客观事实"的条款——它是时间的边界，不是态度。</text>
</svg>
