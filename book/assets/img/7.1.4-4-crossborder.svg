<svg xmlns="http://www.w3.org/2000/svg" width="880" height="316" viewBox="0 0 880 316" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="316" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.4 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同样汇 1 万美元到国外，两条路的时间和成本</text>
<text x="24" y="92" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行电汇</text>
<rect x="150" y="76" width="610" height="26" rx="4" fill="#1a1a28" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="150" y="76" width="500" height="26" rx="4" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<text x="660" y="94" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1 到 3 个工作日</text>
<text x="150" y="130" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">手续费 150～300 元，中间行还要再扣一笔，到账金额可能少 20～50 美元</text>
<text x="24" y="186" fill="#e8965a" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">USDT 转账</text>
<rect x="150" y="170" width="610" height="26" rx="4" fill="#1a1a28" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="150" y="170" width="60" height="26" rx="4" fill="#e8965a" stroke="#e8965a" stroke-width="0"/>
<text x="220" y="188" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">几分钟到半小时</text>
<text x="150" y="224" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">链上手续费几美元，但换进换出还有价差，且对方要愿意收</text>
<text x="24" y="268" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">快是真的快。风险也是真的：发行方冻结地址、平台跑路、汇率波动、境内不受法律保护。</text>
<text x="24" y="294" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以它主要活在跨境贸易、灰色地带和币圈之间，而不是日常消费里。</text>
</svg>
