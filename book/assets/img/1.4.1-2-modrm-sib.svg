<text x="204.0" y="230" fill="#8a8aa4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">REX.W</text>
<rect x="264.0" y="162" width="96" height="50" rx="4" fill="#16161f" stroke="#e8b84b" stroke-width="1.4"/>
<text x="312.0" y="192" fill="#e8b84b" font-size="17" text-anchor="middle" font-family="monospace" font-weight="bold">8b</text>
<text x="312.0" y="230" fill="#8a8aa4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">MOV</text>
<rect x="372.0" y="162" width="96" height="50" rx="4" fill="#16161f" stroke="#b58ae8" stroke-width="1.4"/>
<text x="420.0" y="192" fill="#b58ae8" font-size="17" text-anchor="middle" font-family="monospace" font-weight="bold">44</text>
<text x="420.0" y="230" fill="#8a8aa4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ModR/M</text>
<rect x="480.0" y="162" width="96" height="50" rx="4" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="528.0" y="192" fill="#67d9a0" font-size="17" text-anchor="middle" font-family="monospace" font-weight="bold">8b</text>
<text x="528.0" y="230" fill="#8a8aa4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">SIB</text>
<rect x="588.0" y="162" width="96" height="50" rx="4" fill="#16161f" stroke="#e8965a" stroke-width="1.4"/>
<text x="636.0" y="192" fill="#e8965a" font-size="17" text-anchor="middle" font-family="monospace" font-weight="bold">08</text>
