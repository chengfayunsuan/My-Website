<svg width="840" height="486" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 486" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="840" height="486" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">mov rax, [rbx+rcx*4+8] —— 五字节里的三段地址算术</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">基址、索引乘比例、位移各占一段；ModR/M 的 r/m=100 是打开 SIB 的钥匙</text>
<text x="60" y="110" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">地址</text>
<rect x="122" y="86" width="96" height="38" rx="4" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="170.0" y="111" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="monospace">rbx</text>
<text x="170.0" y="78" fill="#6a6a82" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">基址</text>
<text x="232" y="110" fill="#7a7a92" font-size="15" text-anchor="middle" font-family="monospace">+</text>
<rect x="246" y="86" width="128" height="38" rx="4" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="310.0" y="111" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="monospace">rcx × 4</text>
<text x="310.0" y="78" fill="#6a6a82" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">索引乘比例</text>
<text x="388" y="110" fill="#7a7a92" font-size="15" text-anchor="middle" font-family="monospace">+</text>
<rect x="402" y="86" width="74" height="38" rx="4" fill="#16161f" stroke="#e8965a" stroke-width="1.4"/>
<text x="439.0" y="111" fill="#e8965a" font-size="13" text-anchor="middle" font-family="monospace">8</text>
<text x="439.0" y="78" fill="#6a6a82" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">位移</text>
<text x="490" y="110" fill="#7a7a92" font-size="15" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">]</text>
<text x="100" y="110" fill="#7a7a92" font-size="15" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">[</text>
