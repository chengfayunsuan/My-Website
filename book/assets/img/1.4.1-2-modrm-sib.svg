<text x="222.5" y="337" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">r/m=100</text>
<text x="60" y="358" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">mod=01 → 后面跟 8 位位移</text>
<text x="60" y="375" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">reg=000 → rax　　r/m=100 → 不是 rsp，是「还有 SIB」</text>
<text x="460" y="270" fill="#67d9a0" font-size="11" text-anchor="start" font-family="monospace" font-weight="bold">SIB  =  0x8b  =  10 001 011</text>
