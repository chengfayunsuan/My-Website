<text x="806.0" y="145.6923076923077" fill="#7a7a94" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">海外美元（示意）</text>
<text x="40" y="386" fill="#a0a0b8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">黄金从 246 亿掉到 102 亿，而海外流通的美元翻了不止一倍。法国人看得很清楚，从 1965 年起持续拿美元换黄金。</text>
<text x="40" y="410" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">剩下的选择只有两个：要么承认金价该涨（等于让美元贬值），要么关掉兑换窗口（等于不认账）。1971 年 8 月，美国选了后者。</text>
