<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 0 680 478" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="478" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">微信、支付宝、Stripe：同一件事，三种门槛</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">申请要什么 · 抽多少 · 钱什么时候到 · 面向谁</text>
<rect x="30" y="96" width="196" height="292" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="30" y="96" width="196" height="34" rx="6" fill="#67b5ef26" stroke="none" stroke-width="0"/>
<text x="48" y="119" fill="#67b5ef" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">微信支付</text>
<text x="48" y="140" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">申请门槛</text>
<text x="48" y="158" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">营业执照 +</text>
<text x="48" y="174" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对公或法人账户</text>
<text x="48" y="206" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费率</text>
<text x="48" y="224" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 0.6% / 笔</text>
<text x="48" y="256" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结算</text>
<text x="48" y="274" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">T+1 到商户号</text>
<text x="48" y="306" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">适合</text>
<text x="48" y="324" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小程序、公众号、</text>
<text x="48" y="340" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扫码收款</text>
<rect x="242" y="96" width="196" height="292" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="242" y="96" width="196" height="34" rx="6" fill="#67b5ef26" stroke="none" stroke-width="0"/>
<text x="260" y="119" fill="#67b5ef" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">支付宝</text>
<text x="260" y="140" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">申请门槛</text>
<text x="260" y="158" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">营业执照 +</text>
<text x="260" y="174" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对公或法人账户</text>
<text x="260" y="206" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费率</text>
<text x="260" y="224" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 0.55% ~ 0.6%</text>
<text x="260" y="256" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结算</text>
<text x="260" y="274" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">T+1 到商户号</text>
<text x="260" y="306" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">适合</text>
<text x="260" y="324" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">网站、电商、</text>
<text x="260" y="340" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">线下门店</text>
<rect x="454" y="96" width="196" height="292" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="454" y="96" width="196" height="34" rx="6" fill="#e8965a26" stroke="none" stroke-width="0"/>
<text x="472" y="119" fill="#e8965a" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">Stripe</text>
<text x="472" y="140" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">申请门槛</text>
<text x="472" y="158" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">海外主体（港 / 美公司），</text>
<text x="472" y="174" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大陆主体不能直接注册</text>
<text x="472" y="206" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费率</text>
<text x="472" y="224" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 2.9% + 0.3 美元 / 笔</text>
<text x="472" y="256" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结算</text>
<text x="472" y="274" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">滚动结算（新户约 7 天）</text>
<text x="472" y="306" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">适合</text>
<text x="472" y="324" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">海外信用卡用户、</text>
<text x="472" y="340" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">多币种收款</text>
<text x="30" y="462" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费率差五倍，买的东西不一样：0.6% 买的是国内收单；2.9% 买的是跨境收单、货币转换和拒付处理。</text>
</svg>
