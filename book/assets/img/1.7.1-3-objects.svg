<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="460" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.7.1-3  Git 里只有三种东西：文件内容、目录、提交</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它们全部按内容算哈希命名，所以同样的内容永远只存一份</text>
<rect x="60" y="84" width="340" height="78" rx="4" fill="#201a2e" stroke="#b58ae8" stroke-width="1.4"/>
<text x="76" y="108" fill="#b58ae8" font-size="11" text-anchor="start" font-family="monospace" font-weight="600">commit  a1b2c3d</text>
<text x="76" y="128" fill="#8a8aa2" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">作者、时间、提交信息</text>
<text x="76" y="146" fill="#8a8aa2" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">parent: 上一张快照的哈希</text>
<rect x="60" y="190" width="300" height="56" rx="4" fill="#16202c" stroke="#67b5ef" stroke-width="1.3"/>
<text x="76" y="212" fill="#67b5ef" font-size="10.5" text-anchor="start" font-family="monospace" font-weight="600">tree  (根目录)</text>
<text x="76" y="232" fill="#7a8a9a" font-size="8.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">README.md → blob，src/ → tree</text>
<line x1="230" y1="162" x2="230" y2="190" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M226,190 L230,198 L234,190 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<rect x="60" y="286" width="150" height="50" rx="3" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="74" y="306" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="monospace">blob  e5f6a7b</text>
<text x="74" y="324" fill="#6f8a78" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">README.md 的内容</text>
<rect x="240" y="286" width="150" height="50" rx="3" fill="#16202c" stroke="#67b5ef" stroke-width="1.2"/>
<text x="254" y="306" fill="#67b5ef" font-size="9.5" text-anchor="start" font-family="monospace">tree  c9d0e1f</text>
<text x="254" y="324" fill="#6a8090" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">src/ 目录</text>
<path d="M110,246 L110,286" fill="none" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M106,286 L110,294 L114,286 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<path d="M290,246 L290,286" fill="none" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M286,286 L290,294 L294,286 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<rect x="240" y="372" width="150" height="44" rx="3" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="254" y="390" fill="#67d9a0" font-size="9" text-anchor="start" font-family="monospace">blob  1a2b3c4</text>
<text x="254" y="406" fill="#6f8a78" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">main.c</text>
<rect x="404" y="372" width="150" height="44" rx="3" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="418" y="390" fill="#67d9a0" font-size="9" text-anchor="start" font-family="monospace">blob  5d6e7f8</text>
<text x="418" y="406" fill="#6f8a78" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">util.c</text>
<path d="M290,336 L290,372" fill="none" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M286,372 L290,380 L294,372 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<path d="M340,336 L460,336 L460,372" fill="none" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M456,372 L460,380 L464,372 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="600" y="100" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">三种对象，各管一件事</text>
<text x="600" y="132" fill="#67d9a0" font-size="10" text-anchor="start" font-family="monospace" font-weight="600">blob</text>
<text x="600" y="150" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一段文件内容。不含文件名，</text>
<text x="600" y="166" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">也不含权限 —— 只有字节。</text>
<text x="600" y="208" fill="#67b5ef" font-size="10" text-anchor="start" font-family="monospace" font-weight="600">tree</text>
<text x="600" y="226" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一层目录。记着「哪个名字</text>
<text x="600" y="242" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">指向哪个 blob / tree」。</text>
<text x="600" y="284" fill="#b58ae8" font-size="10" text-anchor="start" font-family="monospace" font-weight="600">commit</text>
<text x="600" y="302" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一张快照的入口：一个根 tree、</text>
<text x="600" y="318" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个父 commit、作者和信息。</text>
<text x="600" y="380" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">名字是哈希，不是自增编号</text>
<text x="600" y="400" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内容一样 → 哈希一样 → 只存一份。</text>
<text x="600" y="416" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以复制一个一模一样的大文件，</text>
<text x="600" y="432" fill="#8a8aa2" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不会让仓库翻倍。</text>
</svg>
