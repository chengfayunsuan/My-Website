<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.5.2-3  链地址法：每个桶挂一条链</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">冲突的 key 全部串在同一个桶下面，槽位数组本身不动</text>
<rect x="70" y="80" width="150" height="30" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="86" y="100" fill="#5f5f78" font-size="10" text-anchor="start" font-family="monospace">槽 0</text>
<line x1="142" y1="95.0" x2="194" y2="95.0" stroke="#33334a" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="70" y="114" width="150" height="30" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
