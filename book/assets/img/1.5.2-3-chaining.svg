<text x="86" y="202" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="monospace">槽 3</text>
<circle cx="204" cy="197.0" r="4.5" fill="#67b5ef"/>
<rect x="70" y="216" width="150" height="30" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="86" y="236" fill="#5f5f78" font-size="10" text-anchor="start" font-family="monospace">槽 4</text>
<line x1="142" y1="231.0" x2="194" y2="231.0" stroke="#33334a" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="70" y="250" width="150" height="30" rx="3" fill="#14141e" stroke="#b58ae8" stroke-width="1.3"/>
<text x="86" y="270" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="monospace">槽 5</text>
<circle cx="204" cy="265.0" r="4.5" fill="#b58ae8"/>
<rect x="70" y="284" width="150" height="30" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="86" y="304" fill="#5f5f78" font-size="10" text-anchor="start" font-family="monospace">槽 6</text>
<line x1="142" y1="299.0" x2="194" y2="299.0" stroke="#33334a" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="70" y="318" width="150" height="30" rx="3" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="86" y="338" fill="#5f5f78" font-size="10" text-anchor="start" font-family="monospace">槽 7</text>
<line x1="142" y1="333.0" x2="194" y2="333.0" stroke="#33334a" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="220" y1="163.0" x2="248" y2="163.0" stroke="#67d9a0" stroke-width="1.4"/>
<polygon points="248,163.0 242.5,165.4 242.5,160.6" fill="#67d9a0"/>
<rect x="250" y="148" width="170" height="30" rx="3" fill="#16161f" stroke="#67d9a0" stroke-width="1.1"/>
<text x="335.0" y="167.0" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="monospace">zhao 13722…</text>
<line x1="220" y1="197.0" x2="248" y2="197.0" stroke="#67b5ef" stroke-width="1.4"/>
<polygon points="248,197.0 242.5,199.4 242.5,194.6" fill="#67b5ef"/>
<rect x="250" y="182" width="170" height="30" rx="3" fill="#16161f" stroke="#67b5ef" stroke-width="1.1"/>
<text x="335.0" y="201.0" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="monospace">li lei 13811…</text>
<line x1="420" y1="197.0" x2="442" y2="197.0" stroke="#e8b84b" stroke-width="1.4"/>
<polygon points="442,197.0 436.5,199.4 436.5,194.6" fill="#e8b84b"/>
<rect x="444" y="182" width="170" height="30" rx="3" fill="#2a2214" stroke="#e8b84b" stroke-width="1.4"/>
<text x="529.0" y="201.0" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="monospace">wang wu 15933…</text>
<line x1="220" y1="265.0" x2="248" y2="265.0" stroke="#b58ae8" stroke-width="1.4"/>
<polygon points="248,265.0 242.5,267.4 242.5,262.6" fill="#b58ae8"/>
<rect x="250" y="250" width="170" height="30" rx="3" fill="#16161f" stroke="#b58ae8" stroke-width="1.1"/>
<text x="335.0" y="269.0" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="monospace">sun 18600…</text>
<line x1="420" y1="265.0" x2="442" y2="265.0" stroke="#b58ae8" stroke-width="1.4"/>
<polygon points="442,265.0 436.5,267.4 436.5,262.6" fill="#b58ae8"/>
<rect x="444" y="250" width="170" height="30" rx="3" fill="#16161f" stroke="#b58ae8" stroke-width="1.1"/>
<text x="529.0" y="269.0" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="monospace">zhou 13100…</text>
<text x="626" y="202" fill="#e8b84b" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">← 新插入：h → 槽 3，接在链尾</text>
<text x="36" y="378" fill="#a8a8c0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查询「wang wu」：算 h → 槽 3 → 顺着链比第一个节点（key 不等）→ 比第二个节点（相等，命中）。</text>
<text x="36" y="396" fill="#e8965a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">哈希只负责「缩小到一个桶」，最后一步必须真的比较 key —— 哈希值相同 ≠ 键相同。</text>
<text x="36" y="418" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">优点：实现简单；负载因子可以大于 1（链变长而已）；删除就是摘链；扩容点可以放得比较晚。</text>
<text x="36" y="436" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价：节点散落在堆上，链上每跳一个节点多一次 cache miss；每个节点还多一个指针的内存。</text>
<text x="36" y="456" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Java 8 的 HashMap 在单链长度 ≥ 8 时改挂红黑树（树化），把最坏 O(n) 压到 O(log n) —— 树是 1.5.3 的主角。</text>
</svg>
