<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="392" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.1-4  政策性银行和商业银行，根本不是一类机构</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个按国家意志办事，一个按利润办事。把它们混着看，很多新闻就读不懂</text>
<text x="90" y="100" fill="#6f6f88" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对比项</text>
<text x="300" y="100" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">商业银行</text>
<text x="560" y="100" fill="#e8965a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">政策性银行</text>
<line x1="70" y1="114" x2="810" y2="114" stroke="#3a3a52" stroke-width="1"/>
<text x="90" y="146" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">目标</text>
<text x="300" y="146" fill="#9aa8bc" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">利润最大化</text>
<text x="560" y="146" fill="#b0a090" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">执行国家战略</text>
<line x1="70" y1="162" x2="810" y2="162" stroke="#242434" stroke-width="1"/>
<text x="90" y="192" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱从哪来</text>
<text x="300" y="192" fill="#9aa8bc" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">吸收存款</text>
<text x="560" y="192" fill="#b0a090" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发行金融债，不吸收公众存款</text>
<line x1="70" y1="208" x2="810" y2="208" stroke="#242434" stroke-width="1"/>
<text x="90" y="238" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">客户是谁</text>
<text x="300" y="238" fill="#9aa8bc" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所有合格客户</text>
<text x="560" y="238" fill="#b0a090" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">国家重大项目、三农、进出口</text>
<line x1="70" y1="254" x2="810" y2="254" stroke="#242434" stroke-width="1"/>
<text x="90" y="284" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">利率</text>
<text x="300" y="284" fill="#9aa8bc" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">市场化定价</text>
<text x="560" y="284" fill="#b0a090" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">常低于市场，甚至贴息</text>
<line x1="70" y1="300" x2="810" y2="300" stroke="#242434" stroke-width="1"/>
<text x="90" y="330" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不良率</text>
<text x="300" y="330" fill="#9aa8bc" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">市场化暴露</text>
<text x="560" y="330" fill="#b0a090" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">低，但项目周期长、金额大</text>
<line x1="70" y1="346" x2="810" y2="346" stroke="#242434" stroke-width="1"/>
<text x="40" y="366" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三家政策性银行：国开行（基建）、进出口行（外贸）、农发行（粮棉收购）。它们不发零售存款，靠发债筹钱，所以不受「挤兑」威胁 —— 这是设计上的差别。</text>
</svg>
