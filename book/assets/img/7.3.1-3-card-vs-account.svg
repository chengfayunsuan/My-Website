<svg width="880" height="356" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="356" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">卡号、账号、户名，是三个不同的东西</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">日常说的「我的账号」其实混了三样：卡片的号、账户的号、人的号。</text>
<rect x="56" y="84" width="768" height="82" rx="6" fill="#15151f" stroke="#33334a" stroke-width="1.2"/>
<rect x="56" y="84" width="92" height="82" rx="6" fill="#1c1c2b" stroke="#33334a" stroke-width="1.2"/>
<text x="102" y="130" fill="#67b5ef" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">卡号</text>
<text x="170" y="118" fill="#c8c8dc" font-size="15" text-anchor="start" font-family="monospace" font-weight="600">6222 0202 0000 1234 567</text>
<text x="170" y="142" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">印在卡面上的 19 位</text>
<text x="568" y="118" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡的编号。挂失补卡就换一个，</text>
<text x="568" y="142" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一人可以同时有好几张。</text>
<rect x="56" y="176" width="768" height="82" rx="6" fill="#15151f" stroke="#33334a" stroke-width="1.2"/>
<rect x="56" y="176" width="92" height="82" rx="6" fill="#1c1c2b" stroke="#33334a" stroke-width="1.2"/>
<text x="102" y="222" fill="#67d9a0" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">账号</text>
<text x="170" y="210" fill="#c8c8dc" font-size="15" text-anchor="start" font-family="monospace" font-weight="600">1100 6023 0000 8812</text>
<text x="170" y="234" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行系统里的账户主键</text>
<text x="568" y="210" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">账户的编号。换卡不换号，</text>
<text x="568" y="234" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只有销户才消失。</text>
<rect x="56" y="268" width="768" height="82" rx="6" fill="#15151f" stroke="#33334a" stroke-width="1.2"/>
<rect x="56" y="268" width="92" height="82" rx="6" fill="#1c1c2b" stroke="#33334a" stroke-width="1.2"/>
<text x="102" y="314" fill="#e8b84b" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">客户号</text>
<text x="170" y="302" fill="#c8c8dc" font-size="15" text-anchor="start" font-family="monospace" font-weight="600">身份证号 11010119900307xxxx</text>
<text x="170" y="326" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个自然人的唯一标识</text>
<text x="568" y="302" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人的编号。一个客户号下可以挂</text>
<text x="568" y="326" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">储蓄卡、信用卡、理财账户。</text>
</svg>
