<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="300" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.4 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">四个目标，经常互相打架</text>
<rect x="40" y="92" width="250" height="70" rx="8" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="165" y="122" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">物价稳定</text>
<text x="165" y="146" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">别通胀，也别通缩</text>
<rect x="590" y="92" width="250" height="70" rx="8" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="715" y="122" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">充分就业</text>
<text x="715" y="146" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">经济得有人干活</text>
<rect x="40" y="196" width="250" height="70" rx="8" fill="#16161f" stroke="#e8b84b" stroke-width="1.4"/>
<text x="165" y="226" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">汇率稳定</text>
<text x="165" y="250" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">别大起大落</text>
<rect x="590" y="196" width="250" height="70" rx="8" fill="#16161f" stroke="#b58ae8" stroke-width="1.4"/>
<text x="715" y="226" fill="#b58ae8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">金融稳定</text>
<text x="715" y="250" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">别出系统性风险</text>
<path d="M294,127 L586,127" fill="none" stroke="#5a5a74" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="440" y="116" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要就业就得放水，放了水物价涨</text>
<path d="M294,231 L586,231" fill="none" stroke="#5a5a74" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="440" y="220" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要稳汇率就不能随便降息</text>
<text x="40" y="288" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以央行永远在做取舍。你看到的每一次「降息」或「不降」，背后都是这四个目标在拉扯。</text>
</svg>
