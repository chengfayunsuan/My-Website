<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">四种把核连起来的办法：形状不同，代价都是「几跳」</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一段多线程代码在这四种拓扑上跑，扩展性可以差好几倍——差别全在任意两点之间要走多远</text>
