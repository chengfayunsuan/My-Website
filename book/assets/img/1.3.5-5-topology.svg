<text x="24" y="536" fill="#8a8aa4" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">看这四张图不用记形状，只记一件事：任意两点之间要走几跳。同 CCX 20 拍、同 socket 跨 CCX 60 拍、跨 socket 200 拍以上——</text>
<text x="24" y="552" fill="#7a7a92" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这个跳数就是同步的单价。每做 100 条指令同步一次的算法，在 8 核时的同步开销就能吃掉全部收益。</text>
