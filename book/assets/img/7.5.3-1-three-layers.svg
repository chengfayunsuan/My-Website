<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="420" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">一笔刷卡手续费的三个抽屉</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0.6% 不是一家拿走的，它被拆成三份，分别归发卡行、卡组织、收单机构</text>
<rect x="30" y="76" width="700" height="86" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="48" y="102" fill="#e8b84b" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">交换费（interchange）</text>
<text x="48" y="126" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">给发卡行</text>
<text x="300" y="102" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">借记卡 ≤0.35%，单笔封顶 13 元</text>
<text x="300" y="126" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">信用卡 ≤0.45%，不封顶</text>
<text x="700" y="120" fill="#e8b84b" font-size="12" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">约占七成</text>
<rect x="30" y="174" width="700" height="86" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="48" y="200" fill="#67d9a0" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">网络服务费</text>
<text x="48" y="224" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">给卡组织</text>
<text x="300" y="200" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0.065%，单笔封顶 6.5 元</text>
<text x="300" y="224" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发卡、收单各承担一半</text>
<text x="700" y="218" fill="#67d9a0" font-size="12" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">约占一成</text>
<rect x="30" y="272" width="700" height="86" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="48" y="298" fill="#67b5ef" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">收单服务费</text>
<text x="48" y="322" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">给收单机构</text>
<text x="300" y="298" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">市场调节价，常见 0.1%~0.2%</text>
<text x="300" y="322" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大商户可以谈到极低</text>
<text x="700" y="316" fill="#67b5ef" font-size="12" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">约占两成</text>
<text x="380" y="376" fill="#a0a0b8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费率是「上限管制 + 市场调节」的混合体：前两项有政府定的天花板，最后一项自己谈</text>
<text x="380" y="400" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以商户实际承担的费率，主要看它跟收单机构谈成了什么价</text>
</svg>
