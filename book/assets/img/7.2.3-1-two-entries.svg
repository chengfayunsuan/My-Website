<svg xmlns="http://www.w3.org/2000/svg" width="880" height="342" viewBox="0 0 880 342" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="342" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.3 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">放一笔 100 万的贷款，账上同时多出两笔</text>
<text x="70" y="84" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产</text>
<text x="510" y="84" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">负债</text>
<line x1="440" y1="96" x2="440" y2="280" stroke="#3a3a52" stroke-width="1.2"/>
<text x="70" y="130" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发放前</text>
<text x="70" y="158" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷款 1000 万</text>
<text x="70" y="186" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">准备金 100 万</text>
<text x="510" y="130" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发放前</text>
<text x="510" y="158" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款 1000 万</text>
<line x1="70" y1="208" x2="810" y2="208" stroke="#2a2a3e" stroke-width="1"/>
<text x="70" y="240" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发放后</text>
<text x="70" y="268" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷款 1100 万</text>
<text x="510" y="240" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发放后</text>
<text x="510" y="268" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款 1100 万</text>
<text x="510" y="292" fill="#8a8aa0" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（借款人账上多了 100 万）</text>
<text x="40" y="324" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有运钞车，没有多印一张纸。银行只是在两边各写了一个数字，钱就出现了。</text>
</svg>
