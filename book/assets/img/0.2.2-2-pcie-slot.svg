<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="460" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">×16 插槽：164 根针，64 根在传数据</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">每条 lane 是两对差分——一对发、一对收，全双工</text>

  <!-- 16 lane × 4 根 -->
  <g stroke="#67b5ef" stroke-width="1.6">
      <line x1="44" y1="88" x2="44" y2="152"/>
      <line x1="49" y1="88" x2="49" y2="152"/>
      <line x1="54" y1="88" x2="54" y2="152"/>
      <line x1="59" y1="88" x2="59" y2="152"/>
      <line x1="87" y1="88" x2="87" y2="152"/>
      <line x1="92" y1="88" x2="92" y2="152"/>
      <line x1="97" y1="88" x2="97" y2="152"/>
      <line x1="102" y1="88" x2="102" y2="152"/>
      <line x1="130" y1="88" x2="130" y2="152"/>
      <line x1="135" y1="88" x2="135" y2="152"/>
      <line x1="140" y1="88" x2="140" y2="152"/>
      <line x1="145" y1="88" x2="145" y2="152"/>
      <line x1="173" y1="88" x2="173" y2="152"/>
      <line x1="178" y1="88" x2="178" y2="152"/>
      <line x1="183" y1="88" x2="183" y2="152"/>
      <line x1="188" y1="88" x2="188" y2="152"/>
      <line x1="216" y1="88" x2="216" y2="152"/>
      <line x1="221" y1="88" x2="221" y2="152"/>
      <line x1="226" y1="88" x2="226" y2="152"/>
      <line x1="231" y1="88" x2="231" y2="152"/>
      <line x1="259" y1="88" x2="259" y2="152"/>
      <line x1="264" y1="88" x2="264" y2="152"/>
      <line x1="269" y1="88" x2="269" y2="152"/>
      <line x1="274" y1="88" x2="274" y2="152"/>
      <line x1="302" y1="88" x2="302" y2="152"/>
      <line x1="307" y1="88" x2="307" y2="152"/>
      <line x1="312" y1="88" x2="312" y2="152"/>
      <line x1="317" y1="88" x2="317" y2="152"/>
      <line x1="345" y1="88" x2="345" y2="152"/>
      <line x1="350" y1="88" x2="350" y2="152"/>
      <line x1="355" y1="88" x2="355" y2="152"/>
      <line x1="360" y1="88" x2="360" y2="152"/>
  </g>
  <g stroke="#9b4df0" stroke-width="1.6">
      <line x1="388" y1="88" x2="388" y2="152"/>
      <line x1="393" y1="88" x2="393" y2="152"/>
      <line x1="398" y1="88" x2="398" y2="152"/>
      <line x1="403" y1="88" x2="403" y2="152"/>
      <line x1="431" y1="88" x2="431" y2="152"/>
      <line x1="436" y1="88" x2="436" y2="152"/>
      <line x1="441" y1="88" x2="441" y2="152"/>
      <line x1="446" y1="88" x2="446" y2="152"/>
      <line x1="474" y1="88" x2="474" y2="152"/>
      <line x1="479" y1="88" x2="479" y2="152"/>
      <line x1="484" y1="88" x2="484" y2="152"/>
      <line x1="489" y1="88" x2="489" y2="152"/>
      <line x1="517" y1="88" x2="517" y2="152"/>
      <line x1="522" y1="88" x2="522" y2="152"/>
      <line x1="527" y1="88" x2="527" y2="152"/>
      <line x1="532" y1="88" x2="532" y2="152"/>
      <line x1="560" y1="88" x2="560" y2="152"/>
      <line x1="565" y1="88" x2="565" y2="152"/>
      <line x1="570" y1="88" x2="570" y2="152"/>
      <line x1="575" y1="88" x2="575" y2="152"/>
      <line x1="603" y1="88" x2="603" y2="152"/>
      <line x1="608" y1="88" x2="608" y2="152"/>
      <line x1="613" y1="88" x2="613" y2="152"/>
      <line x1="618" y1="88" x2="618" y2="152"/>
      <line x1="646" y1="88" x2="646" y2="152"/>
      <line x1="651" y1="88" x2="651" y2="152"/>
      <line x1="656" y1="88" x2="656" y2="152"/>
      <line x1="661" y1="88" x2="661" y2="152"/>
      <line x1="689" y1="88" x2="689" y2="152"/>
      <line x1="694" y1="88" x2="694" y2="152"/>
      <line x1="699" y1="88" x2="699" y2="152"/>
      <line x1="704" y1="88" x2="704" y2="152"/>
  </g>

  <g fill="#6b6b85" font-size="8" text-anchor="middle">
    <text x="47" y="170">0</text><text x="133" y="170">2</text>
    <text x="219" y="170">4</text><text x="305" y="170">6</text>
    <text x="391" y="170">8</text><text x="477" y="170">10</text>
    <text x="563" y="170">12</text><text x="649" y="170">14</text>
  </g>
  <text x="47" y="74" fill="#9fd4f5" font-size="8">TX 对</text>
  <text x="57" y="84" fill="#9fd4f5" font-size="8">RX 对</text>
  <text x="388" y="74" fill="#cfc6ff" font-size="8">（8 到 15 号 lane 画法相同）</text>

  <text x="24" y="196" fill="#9a9ab4" font-size="9">每条 lane 四根线：TX+、TX−、RX+、RX−。16 条就是 64 根（图中每条竖线是一根）。</text>

  <!-- 堆叠条 -->
  <line x1="24" y1="214" x2="736" y2="214" stroke="#2a2a44"/>
  <text x="24" y="238" fill="#d8d8e4" font-size="10.5">164 根针的分类（按比例）</text>

  <rect x="40" y="252" width="258" height="42" fill="#1b2740" stroke="#67b5ef"/>
  <text x="169" y="272" fill="#9fd4f5" font-size="9.5" text-anchor="middle">数据 64 根</text>
  <text x="169" y="287" fill="#6b6b85" font-size="8" text-anchor="middle">39%</text>

  <rect x="298" y="252" width="169" height="42" fill="#2a2a30" stroke="#9a9ab4"/>
  <text x="382" y="272" fill="#c8c8d4" font-size="9.5" text-anchor="middle">地 42 根</text>
  <text x="382" y="287" fill="#6b6b85" font-size="8" text-anchor="middle">26%</text>

  <rect x="467" y="252" width="52" height="42" fill="#3a1e26" stroke="#f0606a"/>
  <text x="493" y="272" fill="#f0606a" font-size="8.5" text-anchor="middle">供电</text>
  <text x="493" y="287" fill="#6b6b85" font-size="7.5" text-anchor="middle">12 根</text>

  <rect x="519" y="252" width="22" height="42" fill="#332a18" stroke="#e8b84b"/>
  <text x="530" y="277" fill="#e8b84b" font-size="6.5" text-anchor="middle">时钟</text>

  <rect x="541" y="252" width="76" height="42" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="579" y="272" fill="#cfc6ff" font-size="8.5" text-anchor="middle">边带 14</text>
  <text x="579" y="287" fill="#6b6b85" font-size="7.5" text-anchor="middle">复位/唤醒</text>

  <rect x="617" y="252" width="80" height="42" fill="#171725" stroke="#4a4a68"/>
  <text x="657" y="272" fill="#9a9ab4" font-size="8.5" text-anchor="middle">其他 30</text>
  <text x="657" y="287" fill="#6b6b85" font-size="7.5" text-anchor="middle">保留/键位</text>

  <!-- 三行说明 -->
  <line x1="24" y1="318" x2="736" y2="318" stroke="#2a2a44"/>

  <text x="24" y="340" fill="#e8b84b" font-size="9.5">地比数据少一点，但已经 42 根了——每条 lane 之间都要隔地，否则会互相串扰</text>
  <text x="24" y="362" fill="#9a9ab4" font-size="9">参考时钟只有一对 100 MHz，所有 lane 共用；边带里有复位、唤醒、存在检测、调试</text>
  <text x="24" y="384" fill="#9a9ab4" font-size="9">「存在检测」是两根短接的针：卡一插进去就导通，主板立刻知道这个槽里有东西</text>
  <text x="24" y="410" fill="#6b6b85" font-size="8.5">PCIe 4.0 之后，这 64 根线在主板上的长度误差要控制在毫米级，否则采样就会错位</text>
  <text x="24" y="434" fill="#6b6b85" font-size="8.5">所以「支持 PCIe 5.0 的主板」贵在板材和走线，不在插槽本身</text>
</svg>
