<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">8.5.5-1 / 四条路，四种代价</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">看最后一列：能不能长期持有，比能不能收到一条短信重要得多</text>
<text x="34" y="96" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="monospace">哪条路</text>
<text x="186" y="96" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="monospace">到手</text>
<text x="294" y="96" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="monospace">月成本</text>
<text x="406" y="96" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="monospace">收银行验证码</text>
<text x="544" y="96" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="monospace">长期持有</text>
<rect x="24" y="108" width="640" height="56" rx="5" fill="#14141e" stroke="#262638" stroke-width="1"/>
<text x="36" y="142" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">giffgaff（英国）</text>
<text x="186" y="142" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2~4 周</text>
<text x="294" y="142" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">£0 ~ £1</text>
<text x="406" y="142" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">部分</text>
<text x="544" y="142" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能</text>
<rect x="24" y="172" width="640" height="56" rx="5" fill="#111119" stroke="#262638" stroke-width="1"/>
<text x="36" y="206" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Ultra Mobile（美国）</text>
<text x="186" y="206" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2~4 周</text>
<text x="294" y="206" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">$3</text>
<text x="406" y="206" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能</text>
<text x="544" y="206" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能</text>
<rect x="24" y="236" width="640" height="56" rx="5" fill="#14141e" stroke="#262638" stroke-width="1"/>
<text x="36" y="270" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">eSIM 数据卡</text>
<text x="186" y="270" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当天</text>
<text x="294" y="270" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">$5 ~ $30</text>
<text x="406" y="270" fill="#e87a8a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不能</text>
<text x="544" y="270" fill="#e87a8a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不能</text>
<rect x="24" y="300" width="640" height="56" rx="5" fill="#111119" stroke="#262638" stroke-width="1"/>
<text x="36" y="334" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">接码平台</text>
<text x="186" y="334" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当天</text>
<text x="294" y="334" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">按条计费</text>
<text x="406" y="334" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">部分</text>
<text x="544" y="334" fill="#e87a8a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不能</text>
<text x="24" y="388" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">“收银行验证码”这一列才是分水岭：数据卡和接码平台看起来最方便，</text>
<text x="24" y="408" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">但它们收不到短代码短信，而银行验证码几乎全走短代码。</text>
<text x="24" y="430" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">实体 SIM 慢，但慢的那两周换来的是一个能长期用的号码。</text>
</svg>
