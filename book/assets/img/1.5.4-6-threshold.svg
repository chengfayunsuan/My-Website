<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="480" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.5.4-6  O(n²) 什么时候开始死人：看 n 有多大</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每格 10 倍数据量。同一段双重循环，n 从一千涨到一亿，从「感觉不到」变成「按天算」</text>
<rect x="56" y="104" width="112" height="152" rx="4" fill="#14141e" stroke="#67d9a0" stroke-width="1.4"/>
<text x="112.0" y="130" fill="#9a9ab4" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1 千</text>
<line x1="70" y1="142" x2="154" y2="142" stroke="#26263a" stroke-width="1"/>
<text x="112.0" y="168" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="monospace">10⁶ 步</text>
<text x="112.0" y="208" fill="#67d9a0" font-size="17" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1 毫秒</text>
<text x="112.0" y="236" fill="#6f6f88" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">感觉不到</text>
<rect x="184" y="104" width="112" height="152" rx="4" fill="#14141e" stroke="#67d9a0" stroke-width="1.4"/>
<text x="240.0" y="130" fill="#9a9ab4" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1 万</text>
<line x1="198" y1="142" x2="282" y2="142" stroke="#26263a" stroke-width="1"/>
<text x="240.0" y="168" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="monospace">10⁸ 步</text>
<text x="240.0" y="208" fill="#67d9a0" font-size="17" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">0.1 秒</text>
<text x="240.0" y="236" fill="#6f6f88" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">勉强能用</text>
<rect x="312" y="104" width="112" height="152" rx="4" fill="#14141e" stroke="#e8b84b" stroke-width="1.4"/>
<text x="368.0" y="130" fill="#9a9ab4" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">10 万</text>
<line x1="326" y1="142" x2="410" y2="142" stroke="#26263a" stroke-width="1"/>
<text x="368.0" y="168" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="monospace">10¹⁰ 步</text>
<text x="368.0" y="208" fill="#e8b84b" font-size="17" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">10 秒</text>
<text x="368.0" y="236" fill="#6f6f88" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用户开始骂</text>
<rect x="440" y="104" width="112" height="152" rx="4" fill="#14141e" stroke="#e8965a" stroke-width="1.4"/>
<text x="496.0" y="130" fill="#9a9ab4" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">100 万</text>
<line x1="454" y1="142" x2="538" y2="142" stroke="#26263a" stroke-width="1"/>
<text x="496.0" y="168" fill="#e8965a" font-size="11.5" text-anchor="middle" font-family="monospace">10¹² 步</text>
<text x="496.0" y="208" fill="#e8965a" font-size="17" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">17 分钟</text>
<text x="496.0" y="236" fill="#6f6f88" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">得改算法了</text>
<rect x="568" y="104" width="112" height="152" rx="4" fill="#14141e" stroke="#e87a8a" stroke-width="1.4"/>
<text x="624.0" y="130" fill="#9a9ab4" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1000 万</text>
<line x1="582" y1="142" x2="666" y2="142" stroke="#26263a" stroke-width="1"/>
<text x="624.0" y="168" fill="#e87a8a" font-size="11.5" text-anchor="middle" font-family="monospace">10¹⁴ 步</text>
<text x="624.0" y="208" fill="#e87a8a" font-size="17" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">28 小时</text>
<text x="624.0" y="236" fill="#6f6f88" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">通宵也跑不完</text>
<rect x="696" y="104" width="112" height="152" rx="4" fill="#14141e" stroke="#e87a8a" stroke-width="1.4"/>
<text x="752.0" y="130" fill="#9a9ab4" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1 亿</text>
<line x1="710" y1="142" x2="794" y2="142" stroke="#26263a" stroke-width="1"/>
<text x="752.0" y="168" fill="#e87a8a" font-size="11.5" text-anchor="middle" font-family="monospace">10¹⁶ 步</text>
<text x="752.0" y="208" fill="#e87a8a" font-size="17" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">116 天</text>
<text x="752.0" y="236" fill="#6f6f88" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这不是时间问题</text>
<line x1="112.0" y1="84" x2="752.0" y2="84" stroke="#3a3a52" stroke-width="1"/>
<line x1="112.0" y1="84" x2="112.0" y2="90" stroke="#3a3a52" stroke-width="1"/>
<line x1="240.0" y1="84" x2="240.0" y2="90" stroke="#3a3a52" stroke-width="1"/>
<line x1="368.0" y1="84" x2="368.0" y2="90" stroke="#3a3a52" stroke-width="1"/>
<line x1="496.0" y1="84" x2="496.0" y2="90" stroke="#3a3a52" stroke-width="1"/>
<line x1="624.0" y1="84" x2="624.0" y2="90" stroke="#3a3a52" stroke-width="1"/>
<line x1="752.0" y1="84" x2="752.0" y2="90" stroke="#3a3a52" stroke-width="1"/>
<text x="104.0" y="88" fill="#5f5f78" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据量 n：</text>
<text x="762.0" y="88" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每次 ×10</text>
<text x="34" y="300" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">「O(n²) 太慢」这句话本身没有意义 —— 快慢要看 n。一万条的时候双重循环完全够用，</text>
<text x="34" y="322" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一千万条的时候，你把代码优化十倍也还是跑不完，必须换算法。</text>
<text x="34" y="352" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">先问「n 会有多大」，再决定值不值得上复杂的数据结构 —— 这是工程里最省事的判断。</text>
<text x="34" y="400" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注：按每秒 10 亿次简单操作折算，不含常数、缓存、并行。真实机器上这些数字上下会浮动几倍，</text>
<text x="34" y="420" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">但「毫秒 / 秒 / 小时 / 天」这四个档的分界不会变。这也是大 O 唯一承诺的东西：量级。</text>
</svg>
