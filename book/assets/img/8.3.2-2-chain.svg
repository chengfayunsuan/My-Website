<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">同一笔生意，两个身份的链条：一个通，一个断</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小规模的进项票抵不了，那笔税就变成了成本的一部分</text>
<defs><marker id="c1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#8a8aa0"/></marker></defs><text x="30" y="72" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">一般纳税人：链条连通，只交差额</text>
<rect x="40" y="86" width="190" height="64" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="135" y="112" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">供应商</text>
<text x="135" y="134" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开 13% 专票</text>
<line x1="232" y1="118" x2="282" y2="118" stroke="#8a8aa0" stroke-width="2" marker-end="url(#c1)"/><rect x="290" y="86" width="190" height="64" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.4"/>
<text x="385" y="112" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你</text>
<text x="385" y="134" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">销项 6% − 进项 13%</text>
<line x1="482" y1="118" x2="532" y2="118" stroke="#8a8aa0" stroke-width="2" marker-end="url(#c1)"/><rect x="540" y="86" width="190" height="64" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="635" y="112" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">客户</text>
<text x="635" y="134" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收到 6% 专票可抵</text>
<text x="390" y="168" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">进项能抵，所以只对「加价部分」交税</text>
<text x="30" y="206" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">小规模：链条断开，进项抵不了</text>
<rect x="40" y="220" width="190" height="64" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="135" y="246" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">供应商</text>
<text x="135" y="268" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开 13% 专票，但你用不上</text>
<line x1="232" y1="252" x2="282" y2="252" stroke="#8a8aa0" stroke-width="2" marker-end="url(#c1)"/><rect x="290" y="220" width="190" height="64" rx="6" fill="#16161f" stroke="#e8965a" stroke-width="1.4"/>
<text x="385" y="246" fill="#e8965a" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你</text>
<text x="385" y="268" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1% 征收率，按全额交</text>
<line x1="482" y1="252" x2="532" y2="252" stroke="#8a8aa0" stroke-width="2" marker-end="url(#c1)"/><rect x="540" y="220" width="190" height="64" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="635" y="246" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">客户</text>
<text x="635" y="268" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收到 1% 专票</text>
<text x="390" y="302" fill="#e8965a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">那 13% 抵不掉，直接进成本——所以小规模的「税率低」，不等于「划算」</text>
<rect x="30" y="320" width="720" height="60" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="50" y="346" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">判断标准很简单：你的成本里，有多少是能拿到专票的？</text>
<text x="50" y="368" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人力为主（写代码、做设计）→ 进项少 → 小规模；货物为主（贸易、集成）→ 进项多 → 一般纳税人</text>
</svg>
