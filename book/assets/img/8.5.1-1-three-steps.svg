<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="450" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">出海是三级台阶，不是一件事</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一级要的东西完全不同，跳级的人大多卡在第二级</text>
<rect x="60" y="280" width="180" height="110" rx="6" fill="#67d9a01c" stroke="#67d9a0" stroke-width="1.6"/>
<text x="150.0" y="310" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="monospace">第一级</text>
<text x="150.0" y="338" fill="#67d9a0" font-size="16" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">用服务</text>
<text x="150.0" y="360" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">付钱给境外</text>
<rect x="250" y="230" width="180" height="160" rx="6" fill="#67b5ef1c" stroke="#67b5ef" stroke-width="1.6"/>
<text x="340.0" y="260" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="monospace">第二级</text>
<text x="340.0" y="288" fill="#67b5ef" font-size="16" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">收钱</text>
<text x="340.0" y="310" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">境外付给你</text>
<rect x="440" y="160" width="180" height="230" rx="6" fill="#b58ae81c" stroke="#b58ae8" stroke-width="1.6"/>
<text x="530.0" y="190" fill="#b58ae8" font-size="10" text-anchor="middle" font-family="monospace">第三级</text>
<text x="530.0" y="218" fill="#b58ae8" font-size="16" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">持有资产</text>
<text x="530.0" y="240" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱留在境外生钱</text>
<text x="150" y="412" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一张能付外币的卡</text>
<text x="340" y="412" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">主体 + 银行账户 + 收款通道</text>
<text x="530" y="412" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">税务身份 + 券商账户</text>
<line x1="150" y1="392" x2="150" y2="404" stroke="#3a3a52" stroke-width="1"/>
<line x1="340" y1="392" x2="340" y2="404" stroke="#3a3a52" stroke-width="1"/>
<line x1="530" y1="392" x2="530" y2="404" stroke="#3a3a52" stroke-width="1"/>
<text x="340" y="96" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">难度和风险从左往右递增</text>
</svg>
