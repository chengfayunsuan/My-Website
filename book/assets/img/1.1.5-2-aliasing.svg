  <text x="70" y="78" fill="#e8c47a" font-size="9.5">信号 A：7 Hz，一秒跳七次</text>
  <text x="70" y="232" fill="#9fd4f5" font-size="9.5">信号 B：1 Hz 反向，一秒只动一次</text>
  <line x1="30" y1="370" x2="730" y2="370" stroke="#2a2a3c"/>
  <text x="30" y="390" fill="#d8d8e4" font-size="9">8 Hz 采样能正确表示的上限是 4 Hz。7 Hz 越了界，被折叠成 |8 − 7| = 1 Hz，所以它俩的采样值完全相同。</text>
  <text x="30" y="408" fill="#9a9ab4" font-size="8.5">这就是为什么录音设备在采样前必须过一道「抗混叠滤波器」：把 4 Hz 以上的成分先砍掉，否则它们会伪装成低频混进来。</text>
  <text x="30" y="426" fill="#6b6b85" font-size="8.5">视觉上同理：摄像机拍转动的车轮，转速超过帧率一半时，轮子看起来在倒转。同一个数学，同一个病。</text>
</svg>