<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.4 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行调一个利率，怎么传到你身上</text>
<rect x="30" y="96" width="180" height="96" rx="8" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="120" y="124" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">7 天逆回购</text>
<text x="120" y="150" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行每天操作的</text>
<text x="120" y="172" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">短端政策利率</text>
<path d="M214,144 L256,144" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M256,138 L266,144 L256,150 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="240" y="96" width="180" height="96" rx="8" fill="#16161f" stroke="#b58ae8" stroke-width="1.5"/>
<text x="330" y="124" fill="#b58ae8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">MLF</text>
<text x="330" y="150" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行借给银行的</text>
<text x="330" y="172" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中期资金价格</text>
<path d="M424,144 L466,144" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M466,138 L476,144 L466,150 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="450" y="96" width="180" height="96" rx="8" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="540" y="124" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">LPR</text>
<text x="540" y="150" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行报出的</text>
<text x="540" y="172" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷款基准报价</text>
<path d="M634,144 L676,144" fill="none" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M676,138 L686,144 L676,150 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="660" y="96" width="180" height="96" rx="8" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="750" y="124" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的房贷</text>
<text x="750" y="150" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">合同里写的</text>
<text x="750" y="172" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">LPR + 加点</text>
<text x="30" y="234" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一段都不是自动的：MLF 变了，LPR 可能跟；LPR 变了，你的房贷要等到重定价日才变。</text>
<text x="30" y="260" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">而且房贷还有一个“加点”，那个加点是你当年办贷款时定的，可能一辈子不变。</text>
<text x="30" y="294" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「央行降息」和「你的月供减少」之间，隔着好几道门。</text>
</svg>
