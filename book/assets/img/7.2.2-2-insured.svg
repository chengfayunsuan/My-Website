<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.2 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个柜台卖给你的东西，命不一样</text>
<rect x="30" y="88" width="400" height="190" rx="10" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="230" y="116" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">受存款保险保护</text>
<text x="60" y="148" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 活期存款</text>
<text x="60" y="178" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 定期存款、大额存单</text>
<text x="60" y="208" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 通知存款</text>
<text x="60" y="238" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 外币存款（等值 50 万内）</text>
<rect x="450" y="88" width="400" height="190" rx="10" fill="#16161f" stroke="#e87a8a" stroke-width="1.5"/>
<text x="650" y="116" fill="#e87a8a" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不受保护</text>
<text x="480" y="148" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 银行理财（不保本）</text>
<text x="480" y="178" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 代销的基金、保险、信托</text>
<text x="480" y="208" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 贵金属、外汇买卖</text>
<text x="480" y="238" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 结构性存款的衍生部分</text>
<text x="30" y="310" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">柜台上那句「理财非存款、产品有风险」，不是免责套话，是在告诉你它不在这个圈里。</text>
</svg>
