<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.1-4  LSP：编辑器和「懂这门语言的那部分」分居两个进程</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中间只走 JSON-RPC。编辑器不用懂 C++，语言服务器不用懂怎么画光标</text>
<rect x="30" y="96" width="232" height="190" rx="5" fill="#14141e" stroke="#4a4a66" stroke-width="1.4"/>
<text x="146" y="122" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">编辑器</text>
<text x="146" y="140" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">VS Code / Neovim / Emacs</text>
<text x="48" y="168" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 接按键、管光标</text>
<text x="48" y="192" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 滚动、折行、选区</text>
<text x="48" y="216" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 画补全列表</text>
<text x="48" y="240" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 决定什么时候发请求</text>
<rect x="618" y="96" width="232" height="190" rx="5" fill="#14141e" stroke="#4a4a66" stroke-width="1.4"/>
<text x="734" y="122" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">语言服务器</text>
<text x="734" y="140" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">clangd / tsserver / pylsp</text>
<text x="636" y="168" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 词法、语法、类型</text>
<text x="636" y="192" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 维护符号表</text>
<text x="636" y="216" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 建项目索引</text>
<text x="636" y="240" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 算「这个符号在哪儿」</text>
<line x1="280" y1="150" x2="600" y2="150" stroke="#67b5ef" stroke-width="1.6"/>
<path d="M600,145 L612,150 L600,155 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<line x1="600" y1="236" x2="280" y2="236" stroke="#67d9a0" stroke-width="1.6"/>
<path d="M280,231 L268,236 L280,241 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<text x="440" y="142" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">请求 →</text>
<text x="440" y="128" fill="#5f7f9a" font-size="8.5" text-anchor="middle" font-family="monospace">completion / definition / hover</text>
<text x="440" y="254" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">响应</text>
<text x="440" y="268" fill="#4a7a62" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">候选列表 / 文件与行号 / 提示文本</text>
<text x="440" y="196" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">JSON-RPC</text>
<text x="440" y="214" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还能反向通知：</text>
<text x="440" y="226" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="monospace">didChange → 服务器更新索引</text>
<line x1="30" y1="308" x2="850" y2="308" stroke="#2a2a3e" stroke-width="1"/>
<text x="30" y="334" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">为什么一定要分成两个进程</text>
<circle cx="38" cy="358.5" r="3" fill="#e8b84b"/>
<text x="50" y="362" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">崩了不拖累</text>
<text x="128" y="362" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">语言服务器解析到一半遇到畸形代码崩掉，编辑器还在，改完保存再拉起即可。</text>
<circle cx="38" cy="384.5" r="3" fill="#e8b84b"/>
<text x="50" y="388" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">语言无关</text>
<text x="128" y="388" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个编辑器接 clangd 就是 C++ IDE，接 tsserver 就是 TS IDE，编辑器一行不用改。</text>
<circle cx="38" cy="410.5" r="3" fill="#e8b84b"/>
<text x="50" y="414" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">可以换实现</text>
<text x="128" y="414" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">嫌官方服务器慢，换一个同样说 LSP 的实现就行，编辑器那边完全无感。</text>
</svg>
