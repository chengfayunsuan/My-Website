<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1.2 L8,4.5 L0,7.8 z" fill="#e8b84b"/>
    </marker>
    <marker id="c2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1.2 L8,4.5 L0,7.8 z" fill="#8a8aa0"/>
    </marker>
  </defs>
  <rect width="760" height="424" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">字符、码点、字节：三层，两次转换</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">「编码」这两个字被用在了两个完全不同的地方，混淆都从这里开始</text>

  <!-- 字符 -->
  <text x="140" y="76" fill="#cfc6ff" font-size="10" text-anchor="middle">字符（字形）</text>
  <rect x="50" y="86" width="180" height="76" rx="7" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="140" y="134" fill="#e8dfff" font-size="34" text-anchor="middle">中</text>

  <line x1="232" y1="124" x2="286" y2="124" stroke="#e8b84b" stroke-width="1.6" marker-end="url(#c1)"/>
  <line x1="286" y1="146" x2="232" y2="146" stroke="#6b6b85" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#c2)"/>
  <text x="259" y="118" fill="#e8c47a" font-size="8.5" text-anchor="middle">查表</text>
  <text x="259" y="160" fill="#6b6b85" font-size="8" text-anchor="middle">反向查表</text>

  <!-- 码点 -->
  <text x="380" y="76" fill="#9fd4f5" font-size="10" text-anchor="middle">码点（编号）</text>
  <rect x="290" y="86" width="180" height="76" rx="7" fill="#1b2740" stroke="#67b5ef"/>
  <text x="380" y="120" fill="#cde6f8" font-size="20" text-anchor="middle" font-family="monospace">U+4E2D</text>
  <text x="380" y="142" fill="#7f9bb8" font-size="9" text-anchor="middle">十进制 20013</text>

  <line x1="472" y1="124" x2="526" y2="124" stroke="#e8b84b" stroke-width="1.6" marker-end="url(#c1)"/>
  <line x1="526" y1="146" x2="472" y2="146" stroke="#6b6b85" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#c2)"/>
  <text x="499" y="118" fill="#e8c47a" font-size="8.5" text-anchor="middle">编码</text>
  <text x="499" y="160" fill="#6b6b85" font-size="8" text-anchor="middle">解码</text>

  <!-- 字节 -->
  <text x="620" y="76" fill="#9fe0c9" font-size="10" text-anchor="middle">字节（存储）</text>
  <rect x="530" y="86" width="180" height="76" rx="7" fill="#20303a" stroke="#4ec9a3"/>
  <text x="620" y="120" fill="#c9f0e2" font-size="20" text-anchor="middle" font-family="monospace">E4 B8 AD</text>
  <text x="620" y="142" fill="#7f9e94" font-size="9" text-anchor="middle">三个字节</text>

  <line x1="30" y1="186" x2="730" y2="186" stroke="#2a2a3c"/>

  <text x="30" y="208" fill="#d8d8e4" font-size="10">同一个字符，码点是唯一的，字节不是——这是所有乱码问题的源头</text>

  <text x="30" y="240" fill="#6b6b85" font-size="9">编码格式</text>
  <text x="150" y="240" fill="#6b6b85" font-size="9">字节序列</text>
  <text x="400" y="240" fill="#6b6b85" font-size="9">长度</text>

  <rect x="24" y="250" width="712" height="30" rx="4" fill="#171725"/>
  <text x="30" y="270" fill="#9fe0c9" font-size="10">UTF-8</text>
  <text x="150" y="270" fill="#c9f0e2" font-size="10" font-family="monospace">E4  B8  AD</text>
  <text x="400" y="270" fill="#7f9e94" font-size="9">3 字节</text>

  <rect x="24" y="284" width="712" height="30" rx="4" fill="#171725"/>
  <text x="30" y="304" fill="#e8c47a" font-size="10">GBK</text>
  <text x="150" y="304" fill="#ffe8b0" font-size="10" font-family="monospace">D6  D0</text>
  <text x="400" y="304" fill="#a89070" font-size="9">2 字节</text>

  <rect x="24" y="318" width="712" height="30" rx="4" fill="#171725"/>
  <text x="30" y="338" fill="#9fd4f5" font-size="10">UTF-16LE</text>
  <text x="150" y="338" fill="#cde6f8" font-size="10" font-family="monospace">2D  4E</text>
  <text x="400" y="338" fill="#7f9bb8" font-size="9">2 字节</text>

  <rect x="24" y="352" width="712" height="30" rx="4" fill="#171725"/>
  <text x="30" y="372" fill="#cfc6ff" font-size="10">UTF-32LE</text>
  <text x="150" y="372" fill="#e8dfff" font-size="10" font-family="monospace">2D  4E  00  00</text>
  <text x="400" y="372" fill="#8f88a8" font-size="9">4 字节</text>

  <text x="30" y="404" fill="#6b6b85" font-size="9">所以「这个文件是几个字」这个问题，不问编码就没法回答。字节数、字符数、显示宽度，是三件事。</text>
</svg>
