<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="400" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">峰值三分钟，之后靠温控活着</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">左边是时间轴上的性能，右边是温度决定的频率上限</text>

  <!-- 左图 -->
  <text x="64" y="80" fill="#9fd4f5" font-size="9">跑五分钟，性能怎么变</text>
  <line x1="64" y1="280" x2="372" y2="280" stroke="#4a4a68"/>
  <line x1="64" y1="120" x2="64" y2="280" stroke="#4a4a68"/>
  <g fill="#6b6b85" font-size="7" text-anchor="end">
    <text x="58" y="124">100%</text>
    <text x="58" y="204">50%</text>
    <text x="58" y="284">0</text>
  </g>

