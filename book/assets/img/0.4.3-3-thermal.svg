  <line x1="95" y1="120" x2="95" y2="280" stroke="#33334a" stroke-dasharray="3 3"/>
  <line x1="126" y1="120" x2="126" y2="280" stroke="#33334a" stroke-dasharray="3 3"/>
  <text x="79" y="112" fill="#f0606a" font-size="7.5" text-anchor="middle">峰值 100%</text>
  <text x="156" y="200" fill="#e8b84b" font-size="7.5">掉到 62% 左右并稳住</text>
  <text x="64" y="300" fill="#6b6b85" font-size="7">0 s</text>
  <text x="372" y="300" fill="#6b6b85" font-size="7" text-anchor="end">300 s</text>

  <!-- 右图 -->
  <text x="470" y="80" fill="#9fe0c9" font-size="9">温度决定频率上限</text>
  <line x1="470" y1="280" x2="720" y2="280" stroke="#4a4a68"/>
  <line x1="470" y1="120" x2="470" y2="280" stroke="#4a4a68"/>
  <g fill="#6b6b85" font-size="7" text-anchor="end">
    <text x="464" y="124">100%</text>
    <text x="464" y="204">50%</text>
  </g>
  <polyline points="470.0,120.0 483.9,120.0 497.8,120.0 511.7,120.0 525.6,120.0 539.4,120.0 553.3,120.0 567.2,120.0 581.1,120.0 595.0,128.8 608.9,137.6 622.8,146.4 636.7,155.2 650.6,164.0 664.4,172.8 678.3,181.6 692.2,190.4 706.1,199.2 720.0,200.0" fill="none" stroke="#4ec9a3" stroke-width="2.2"/>

  <line x1="581" y1="120" x2="581" y2="280" stroke="#33334a" stroke-dasharray="3 3"/>
  <text x="581" y="112" fill="#9fe0c9" font-size="7.5" text-anchor="middle">38 °C 开始降</text>
  <text x="720" y="238" fill="#f0606a" font-size="7.5" text-anchor="end">45 °C：外壳的底线</text>

  <g fill="#6b6b85" font-size="7" text-anchor="middle">
    <text x="470" y="298">30</text>
    <text x="581" y="298">38</text>
    <text x="678" y="298">45</text>
    <text x="720" y="298">48 °C</text>
  </g>

  <line x1="24" y1="318" x2="736" y2="318" stroke="#2a2a44"/>

  <text x="24" y="340" fill="#e8b84b" font-size="9">芯片本身能到 100 度，但手机的底线是「外壳 45 度」——所以它的温控曲线比芯片的温度墙严得多。</text>
  <text x="24" y="360" fill="#9a9ab4" font-size="9">这也是为什么「跑分」和「玩一小时游戏」是两件事：前者在峰值区，后者在稳定区。</text>
  <text x="24" y="382" fill="#6b6b85" font-size="8.5">厂商的调校空间就在这里：把曲线调陡还是调平，决定了「跑分高」还是「体验稳」。</text>
</svg>