<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="510" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.7.2-5  PR 上那三个按钮，合并出来的历史不一样</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同样的三个提交，Merge 原样保留、Squash 压成一个、Rebase 逐个重放</text>
<text x="30" y="76" fill="#67d9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">① Create a merge commit</text>
<text x="240" y="76" fill="#6f6f88" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保留分支上的三个提交，另加一个合并提交</text>
<circle cx="80" cy="112" r="17" fill="#14141e" stroke="#67d9a0" stroke-width="1.5"/>
<text x="80" y="115.5" fill="#67d9a0" font-size="7.5" text-anchor="middle" font-family="monospace">M1</text>
<circle cx="200" cy="112" r="17" fill="#14141e" stroke="#67d9a0" stroke-width="1.5"/>
<text x="200" y="115.5" fill="#67d9a0" font-size="7.5" text-anchor="middle" font-family="monospace">M2</text>
<line x1="97" y1="112" x2="177" y2="112" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M177,109 L183,112 L177,115 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<circle cx="260" cy="168" r="17" fill="#14141e" stroke="#e8b84b" stroke-width="1.5"/>
<text x="260" y="171.5" fill="#e8b84b" font-size="7.5" text-anchor="middle" font-family="monospace">F1</text>
<circle cx="350" cy="168" r="17" fill="#14141e" stroke="#e8b84b" stroke-width="1.5"/>
<text x="350" y="171.5" fill="#e8b84b" font-size="7.5" text-anchor="middle" font-family="monospace">F2</text>
<circle cx="440" cy="168" r="17" fill="#14141e" stroke="#e8b84b" stroke-width="1.5"/>
<text x="440" y="171.5" fill="#e8b84b" font-size="7.5" text-anchor="middle" font-family="monospace">F3</text>
<line x1="277" y1="168" x2="327" y2="168" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M327,165 L333,168 L327,171 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="367" y1="168" x2="417" y2="168" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M417,165 L423,168 L417,171 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<path d="M200,129 L200,151" fill="none" stroke="#6a5a2a" stroke-width="1"/>
<path d="M196,150 L200,158 L204,150 Z" fill="#6a5a2a" stroke="#6a5a2a" stroke-width="1"/>
<circle cx="560" cy="140.0" r="20" fill="#14141e" stroke="#b58ae8" stroke-width="1.5"/>
<text x="560" y="143.5" fill="#b58ae8" font-size="7.5" text-anchor="middle" font-family="monospace">M3</text>
<line x1="457" y1="168" x2="534" y2="168" stroke="#6a5a2a" stroke-width="1.2"/>
<path d="M534,165 L540,168 L534,171 Z" fill="#6a5a2a" stroke="#6a5a2a" stroke-width="1"/>
<path d="M217,112 L535,137" fill="none" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M535,137 L543,142 L538,130 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="600" y="144.0" fill="#9a7ab0" font-size="8.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">合并提交，两个父</text>
<text x="30" y="232" fill="#67b5ef" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">② Squash and merge</text>
<text x="200" y="232" fill="#6f6f88" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三个提交压成一个，细节全丢</text>
<circle cx="80" cy="268" r="17" fill="#14141e" stroke="#67d9a0" stroke-width="1.5"/>
<text x="80" y="271.5" fill="#67d9a0" font-size="7.5" text-anchor="middle" font-family="monospace">M1</text>
<circle cx="200" cy="268" r="17" fill="#14141e" stroke="#67d9a0" stroke-width="1.5"/>
<text x="200" y="271.5" fill="#67d9a0" font-size="7.5" text-anchor="middle" font-family="monospace">M2</text>
<line x1="97" y1="268" x2="177" y2="268" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M177,265 L183,268 L177,271 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<rect x="235" y="246" width="230" height="44" rx="5" fill="none" stroke="#e8b84b" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="255" cy="268" r="15" fill="#14141e" stroke="#6a5a2a" stroke-width="1.5"/>
<text x="255" y="271.5" fill="#6a5a2a" font-size="7.5" text-anchor="middle" font-family="monospace">F1</text>
<circle cx="330" cy="268" r="15" fill="#14141e" stroke="#6a5a2a" stroke-width="1.5"/>
<text x="330" y="271.5" fill="#6a5a2a" font-size="7.5" text-anchor="middle" font-family="monospace">F2</text>
<circle cx="405" cy="268" r="15" fill="#14141e" stroke="#6a5a2a" stroke-width="1.5"/>
<text x="405" y="271.5" fill="#6a5a2a" font-size="7.5" text-anchor="middle" font-family="monospace">F3</text>
<text x="350" y="306" fill="#8a7a4a" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这三个被压成一个</text>
<line x1="467" y1="268" x2="476" y2="268" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M476,265 L482,268 L476,271 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<circle cx="500" cy="268" r="18" fill="#14141e" stroke="#67b5ef" stroke-width="1.5"/>
<text x="500" y="271.5" fill="#67b5ef" font-size="7.5" text-anchor="middle" font-family="monospace">S</text>
<text x="530" y="272" fill="#5f7f9a" font-size="8.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个提交，包含三份改动</text>
<text x="30" y="360" fill="#b58ae8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">③ Rebase and merge</text>
<text x="200" y="360" fill="#6f6f88" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三个提交逐个重放，历史是一条直线</text>
<circle cx="80" cy="396" r="17" fill="#14141e" stroke="#67d9a0" stroke-width="1.5"/>
<text x="80" y="399.5" fill="#67d9a0" font-size="7.5" text-anchor="middle" font-family="monospace">M1</text>
<circle cx="180" cy="396" r="17" fill="#14141e" stroke="#67d9a0" stroke-width="1.5"/>
<text x="180" y="399.5" fill="#67d9a0" font-size="7.5" text-anchor="middle" font-family="monospace">M2</text>
<circle cx="300" cy="396" r="17" fill="#14141e" stroke="#b58ae8" stroke-width="1.5"/>
<text x="300" y="399.5" fill="#b58ae8" font-size="7.5" text-anchor="middle" font-family="monospace">F1'</text>
<circle cx="400" cy="396" r="17" fill="#14141e" stroke="#b58ae8" stroke-width="1.5"/>
<text x="400" y="399.5" fill="#b58ae8" font-size="7.5" text-anchor="middle" font-family="monospace">F2'</text>
<circle cx="500" cy="396" r="17" fill="#14141e" stroke="#b58ae8" stroke-width="1.5"/>
<text x="500" y="399.5" fill="#b58ae8" font-size="7.5" text-anchor="middle" font-family="monospace">F3'</text>
<line x1="97" y1="396" x2="157" y2="396" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M157,393 L163,396 L157,399 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="197" y1="396" x2="277" y2="396" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M277,393 L283,396 L277,399 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="317" y1="396" x2="377" y2="396" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M377,393 L383,396 L377,399 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="417" y1="396" x2="477" y2="396" stroke="#4a4a66" stroke-width="1.2"/>
<path d="M477,393 L483,396 L477,399 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="30" y="470" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第三种里 F1 F2 F3 的哈希全变了（加撇表示），所以只适合「还没被别人拉走」的分支。</text>
<text x="30" y="492" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">选哪种是团队约定：想保留完整脉络用 merge，想让 main 干净用 squash，想保持每个提交独立用 rebase。</text>
</svg>
