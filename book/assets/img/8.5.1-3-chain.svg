<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">组件的依赖是单向的，不能跳</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一个框都要求左边那个框已经成立</text>
<rect x="18" y="150" width="92" height="76" rx="6" fill="#67d9a01c" stroke="#67d9a0" stroke-width="1.4"/>
<text x="64.0" y="176" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">支付工具</text>
<text x="64.0" y="202" fill="#a0a0b8" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能付第一笔</text>
<text x="115" y="192" fill="#5a5a72" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<rect x="120" y="150" width="92" height="76" rx="6" fill="#67d9a01c" stroke="#67d9a0" stroke-width="1.4"/>
<text x="166.0" y="176" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">邮箱 / 电话</text>
<text x="166.0" y="202" fill="#a0a0b8" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能收验证码</text>
<text x="217" y="192" fill="#5a5a72" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<rect x="222" y="150" width="92" height="76" rx="6" fill="#67b5ef1c" stroke="#67b5ef" stroke-width="1.4"/>
<text x="268.0" y="176" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">主体</text>
<text x="268.0" y="202" fill="#a0a0b8" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">公司或个体</text>
<text x="319" y="192" fill="#5a5a72" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<rect x="324" y="150" width="92" height="76" rx="6" fill="#67b5ef1c" stroke="#67b5ef" stroke-width="1.4"/>
<text x="370.0" y="176" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">银行账户</text>
<text x="370.0" y="202" fill="#a0a0b8" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能收美元</text>
<text x="421" y="192" fill="#5a5a72" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<rect x="426" y="150" width="92" height="76" rx="6" fill="#67b5ef1c" stroke="#67b5ef" stroke-width="1.4"/>
<text x="472.0" y="176" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">收款通道</text>
<text x="472.0" y="202" fill="#a0a0b8" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能对外收款</text>
<text x="523" y="192" fill="#5a5a72" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<rect x="528" y="150" width="92" height="76" rx="6" fill="#b58ae81c" stroke="#b58ae8" stroke-width="1.4"/>
<text x="574.0" y="176" fill="#b58ae8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">券商账户</text>
<text x="574.0" y="202" fill="#a0a0b8" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能买资产</text>
<line x1="319" y1="118" x2="319" y2="248" stroke="#4a4a62" stroke-width="1" stroke-dasharray="4 5"/>
<text x="151.0" y="106" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一级</text>
<text x="467.0" y="106" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第二级 → 第三级</text>
<text x="340" y="282" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前三个可以自己搞定；从"主体"开始，每一步都要别人点头。</text>
<text x="340" y="306" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前一个没通，后一个连申请页面都填不完。</text>
<rect x="40" y="332" width="600" height="66" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="40" y="332" width="4" height="66" rx="2" fill="#e87a8a" stroke="none" stroke-width="0"/>
<text x="60" y="356" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">最常见的断点：还没有网站，就去申请银行账户。</text>
<text x="60" y="378" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行要看的不是注册证书，是"卖什么、卖给谁、钱从哪来"——网站是唯一能一次答完这三问的东西。</text>
</svg>
