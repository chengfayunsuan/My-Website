<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="428" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.5-6  SDR 为什么推不动：三个卡点</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它不是「世界货币的雏形」，是一个设计得很聪明、但用不起来的东西</text>
<rect x="40" y="88" width="260" height="270" rx="5" fill="#2a1a20" stroke="#e87a8a" stroke-width="1.4"/>
<text x="58" y="122" fill="#e87a8a" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">不能用于交易</text>
<line x1="58" y1="136" x2="282" y2="136" stroke="#33334a" stroke-width="1"/>
<text x="58" y="170" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">谁能用</text>
<text x="58" y="189" fill="#b0b4c6" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只有央行和 IMF</text>
<text x="58" y="232" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用它干吗</text>
<text x="58" y="251" fill="#b0b4c6" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">互相转账、还 IMF 的账</text>
<text x="58" y="294" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">问题</text>
<text x="58" y="313" fill="#b0b4c6" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">企业和个人完全用不上</text>
<rect x="320" y="88" width="260" height="270" rx="5" fill="#2a2410" stroke="#e8b84b" stroke-width="1.4"/>
<text x="338" y="122" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">扩容要美国点头</text>
<line x1="338" y1="136" x2="562" y2="136" stroke="#33334a" stroke-width="1"/>
<text x="338" y="170" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">规则</text>
<text x="338" y="189" fill="#b0b4c6" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">重大事项需 85% 投票权</text>
<text x="338" y="232" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美国</text>
<text x="338" y="251" fill="#b0b4c6" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">持有 16.5%，一票否决</text>
<text x="338" y="294" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">问题</text>
<text x="338" y="313" fill="#b0b4c6" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每次扩容都要谈几年</text>
<rect x="600" y="88" width="260" height="270" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.4"/>
<text x="618" y="122" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">规模太小</text>
<line x1="618" y1="136" x2="842" y2="136" stroke="#33334a" stroke-width="1"/>
<text x="618" y="170" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">总量</text>
<text x="618" y="189" fill="#b0b4c6" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 6600 亿 SDR</text>
<text x="618" y="232" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">折合</text>
<text x="618" y="251" fill="#b0b4c6" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 9000 亿美元</text>
<text x="618" y="294" fill="#7f7f98" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">问题</text>
<text x="618" y="313" fill="#b0b4c6" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不到全球储备的一成</text>
<text x="40" y="388" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以 SDR 的命运很尴尬：设计上它确实能解决特里芬难题（不依赖任何一国货币），但用不上，因为没有人愿意接受一个「只能记账、不能买东西」的东西。</text>
<text x="40" y="412" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它最后变成了一个「央行之间的应急额度」，而不是「世界货币」。凯恩斯 1944 年的想法，八十年后还是没实现。</text>
</svg>
