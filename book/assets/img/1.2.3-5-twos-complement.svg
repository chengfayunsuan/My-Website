<circle cx="353.8207252018059" cy="188.77065082158563" r="3.6" fill="#67d9a0"/>
<circle cx="281.7581216659255" cy="218.61995854606263" r="3.6" fill="#ff9aa8"/>
<text x="206" y="244" fill="#9a9ab4" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4 位 · 16 格</text>
<text x="206" y="266" fill="#5a5a72" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">模 16</text>
<text x="436" y="84" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两条走得通的路</text>
<line x1="436" y1="100" x2="470" y2="100" stroke="#67d9a0" stroke-width="2.2" stroke-dasharray="6 5"/>
<text x="480" y="104" fill="#67d9a0" font-size="11" text-anchor="start" font-family="monospace">3 → 顺时针 13 格 → 0</text>
<text x="480" y="124" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">也就是 3 + 13 = 16 ≡ 0</text>
<line x1="436" y1="146" x2="470" y2="146" stroke="#ff9aa8" stroke-width="2.2"/>
<text x="480" y="150" fill="#ff9aa8" font-size="11" text-anchor="start" font-family="monospace">3 → 逆时针 3 格 → 0</text>
<text x="480" y="170" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">也就是普通的 3 − 3 = 0</text>
<text x="436" y="208" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">四条读法</text>
<text x="436" y="232" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">① 1101 读 13 还是 −3，看它是不是「有符号」。</text>
<text x="436" y="256" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">② 正数从 0 顺时针走到 7，再往前一步掉进 −8。</text>
<text x="436" y="280" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">③ 负数不是「加负号」，是「走到对面」。</text>
<text x="436" y="304" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">④ 0 只有一个，没有 −0——补码赢过原码的关键。</text>
<text x="436" y="336" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">−8 在正对面：取反加一还是 −8，</text>
<text x="436" y="356" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它是唯一「自己的负数等于自己」的数。</text>
<text x="24" y="442" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">位数用完就回到零。这个「绕圈」的行为，就是补码能用加法做减法的全部原因。</text>
</svg>
