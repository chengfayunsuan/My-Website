<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数字在固定位宽里是绕圈的：走过尽头就回到起点，所以「减 3」和「加 13」是同一条路</text>
