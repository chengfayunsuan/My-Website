<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="300" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.3 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">降准 0.5 个百分点，就是把锁住的那部分松开一点</text>
<rect x="40" y="96" width="300" height="96" rx="10" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="190" y="126" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">降准前</text>
<text x="190" y="154" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每 100 元存款</text>
<text x="190" y="178" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有 7.5 元锁在央行</text>
<rect x="540" y="96" width="300" height="96" rx="10" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="690" y="126" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">降准后</text>
<text x="690" y="154" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">锁住的部分变成 7.0 元</text>
<text x="690" y="178" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">多出 0.5 元可以放贷</text>
<path d="M352,144 L528,144" fill="none" stroke="#8a8aa0" stroke-width="1.7"/>
<path d="M528,138 L538,144 L528,150 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<text x="440" y="124" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">松开一格</text>
<text x="40" y="232" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全国存款上百万亿，0.5 个百分点对应的就是几千亿资金。这就是新闻里“降准释放万亿流动性”的算法。</text>
<text x="40" y="258" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">但它只是“可以贷”，不是“已经贷”。有没有人借，还得看企业和居民愿不愿意加杠杆。</text>
</svg>
