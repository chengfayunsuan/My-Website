<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">账面赚钱的那 90 天，公司在垫钱</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一笔 3 万的赊销生意，从发货到回款</text>
<line x1="60" y1="190" x2="620" y2="190" stroke="#4a4a62" stroke-width="1.5"/>
<line x1="60" y1="186" x2="60" y2="194" stroke="#4a4a62" stroke-width="1.2"/>
<text x="66" y="212" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3 月</text>
<line x1="200" y1="186" x2="200" y2="194" stroke="#4a4a62" stroke-width="1.2"/>
<text x="206" y="212" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4 月</text>
<line x1="340" y1="186" x2="340" y2="194" stroke="#4a4a62" stroke-width="1.2"/>
<text x="346" y="212" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5 月</text>
<line x1="480" y1="186" x2="480" y2="194" stroke="#4a4a62" stroke-width="1.2"/>
<text x="486" y="212" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">6 月</text>
<line x1="66" y1="190" x2="66" y2="148" stroke="#67d9a0" stroke-width="1.4" stroke-dasharray="3 4"/>
<text x="66" y="140" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发货 · 账面记 +3 万</text>
<line x1="486" y1="190" x2="486" y2="148" stroke="#67d9a0" stroke-width="1.4" stroke-dasharray="3 4"/>
<text x="486" y="140" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">回款 · 现金到 +3 万</text>
<rect x="66" y="238" width="420" height="6" rx="3" fill="#e87a8a55" stroke="none" stroke-width="0"/>
<line x1="66" y1="232" x2="66" y2="250" stroke="#e87a8a" stroke-width="1.4"/>
<line x1="486" y1="232" x2="486" y2="250" stroke="#e87a8a" stroke-width="1.4"/>
<text x="276" y="232" fill="#e87a8a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">90 天：工资、房租、服务器照付</text>
<text x="276" y="272" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">钱没到，账已经记上了。</text>
<text x="340" y="306" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">多数小公司的死法：不是亏，是垫。</text>
</svg>
