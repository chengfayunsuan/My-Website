<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="420" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">三种权利的取得速度差得离谱</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从「完成」到「能维权」，三条路的天数完全不同</text>
<line x1="100" y1="284" x2="540" y2="284" stroke="#4a4a62" stroke-width="1.5"/>
<line x1="100.0" y1="280" x2="100.0" y2="288" stroke="#4a4a62" stroke-width="1.2"/>
<text x="100.0" y="306" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 0 月</text>
<line x1="210.0" y1="280" x2="210.0" y2="288" stroke="#4a4a62" stroke-width="1.2"/>
<text x="210.0" y="306" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 10 月</text>
<line x1="320.0" y1="280" x2="320.0" y2="288" stroke="#4a4a62" stroke-width="1.2"/>
<text x="320.0" y="306" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 20 月</text>
<line x1="430.0" y1="280" x2="430.0" y2="288" stroke="#4a4a62" stroke-width="1.2"/>
<text x="430.0" y="306" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 30 月</text>
<line x1="540.0" y1="280" x2="540.0" y2="288" stroke="#4a4a62" stroke-width="1.2"/>
<text x="540.0" y="306" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 40 月</text>
<text x="86" y="117" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">著作权</text>
<line x1="100" y1="112" x2="100.0" y2="112" stroke="#67d9a0" stroke-width="2.5"/>
<circle cx="100.0" cy="112" r="5" fill="#67d9a0"/>
<text x="112.0" y="117" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">完成即取得，可立即维权</text>
<text x="86" y="181" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商标注册</text>
<line x1="100" y1="176" x2="210.0" y2="176" stroke="#67b5ef" stroke-width="2.5"/>
<circle cx="210.0" cy="176" r="5" fill="#67b5ef"/>
<text x="222.0" y="181" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">审查 + 初审公告 3 个月，约 8~12 个月</text>
<text x="86" y="245" fill="#c8c8dc" font-size="11.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发明专利</text>
<line x1="100" y1="240" x2="430.0" y2="240" stroke="#e8965a" stroke-width="2.5"/>
<circle cx="430.0" cy="240" r="5" fill="#e8965a"/>
<text x="442.0" y="245" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">申请到授权常需 1~3 年</text>
<text x="340" y="352" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同样一个名字，今天开始用，商标要一年后才能挡住别人仿冒。</text>
<text x="340" y="382" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以商标要趁早——先用着，不代表先用着就有权利。</text>
</svg>
