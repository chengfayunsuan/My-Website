<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><marker id="j1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#8a8aa0"/></marker></defs>
  <rect width="760" height="352" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">JPEG 的八步：两次「砍掉不重要的部分」</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">第一次砍颜色（4:2:0），第二次砍高频（量化）——剩下的用无损编码打包</text>
  <rect x="30" y="80" width="160" height="62" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="110" y="102" fill="#d8d8e4" font-size="10" text-anchor="middle">RGB</text>
  <text x="110" y="119" fill="#6b6b85" font-size="7.5" text-anchor="middle">每像素 3 字节</text>
  <text x="110" y="133" fill="#55556e" font-size="7.5" text-anchor="middle">原始数据</text>
  <rect x="210" y="80" width="160" height="62" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="290" y="102" fill="#d8d8e4" font-size="10" text-anchor="middle">YCbCr</text>
  <text x="290" y="119" fill="#6b6b85" font-size="7.5" text-anchor="middle">亮度 + 两个色度</text>
  <text x="290" y="133" fill="#55556e" font-size="7.5" text-anchor="middle">换成人的感知模型</text>
  <rect x="390" y="80" width="160" height="62" rx="6" fill="#171725" stroke="#4ec9a3"/>
  <text x="470" y="102" fill="#9fe0c9" font-size="10" text-anchor="middle">4:2:0</text>
  <text x="470" y="119" fill="#6b6b85" font-size="7.5" text-anchor="middle">色度减半</text>
  <text x="470" y="133" fill="#55556e" font-size="7.5" text-anchor="middle">数据量降到 2/3</text>
  <rect x="570" y="80" width="160" height="62" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="650" y="102" fill="#d8d8e4" font-size="10" text-anchor="middle">8 × 8 分块</text>
  <text x="650" y="119" fill="#6b6b85" font-size="7.5" text-anchor="middle">每块 64 个值</text>
  <text x="650" y="133" fill="#55556e" font-size="7.5" text-anchor="middle">DCT 的输入单位</text>
  <line x1="193" y1="111" x2="207" y2="111" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#j1)"/>
  <line x1="373" y1="111" x2="387" y2="111" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#j1)"/>
  <line x1="553" y1="111" x2="567" y2="111" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#j1)"/>
  <line x1="650" y1="142" x2="650" y2="196" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#j1)"/>
  <rect x="570" y="200" width="160" height="62" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="650" y="222" fill="#d8d8e4" font-size="10" text-anchor="middle">DCT</text>
  <text x="650" y="239" fill="#6b6b85" font-size="7.5" text-anchor="middle">空间 → 频率</text>
  <text x="650" y="253" fill="#55556e" font-size="7.5" text-anchor="middle">左上低频，右下高频</text>
  <rect x="390" y="200" width="160" height="62" rx="6" fill="#171725" stroke="#ef6b6b"/>
  <text x="470" y="222" fill="#f0a0a8" font-size="10" text-anchor="middle">量化</text>
  <text x="470" y="239" fill="#6b6b85" font-size="7.5" text-anchor="middle">除以量化表</text>
  <text x="470" y="253" fill="#55556e" font-size="7.5" text-anchor="middle">高频大量变 0</text>
  <rect x="210" y="200" width="160" height="62" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="290" y="222" fill="#d8d8e4" font-size="10" text-anchor="middle">之字形</text>
  <text x="290" y="239" fill="#6b6b85" font-size="7.5" text-anchor="middle">按频率排序</text>
  <text x="290" y="253" fill="#55556e" font-size="7.5" text-anchor="middle">把 0 串到末尾</text>
  <rect x="30" y="200" width="160" height="62" rx="6" fill="#171725" stroke="#3a3a52"/>
  <text x="110" y="222" fill="#d8d8e4" font-size="10" text-anchor="middle">霍夫曼</text>
  <text x="110" y="239" fill="#6b6b85" font-size="7.5" text-anchor="middle">变长编码</text>
  <text x="110" y="253" fill="#55556e" font-size="7.5" text-anchor="middle">真正的压缩</text>
  <line x1="567" y1="231" x2="553" y2="231" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#j1)"/>
  <line x1="387" y1="231" x2="373" y2="231" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#j1)"/>
  <line x1="207" y1="231" x2="193" y2="231" stroke="#8a8aa0" stroke-width="1.3" marker-end="url(#j1)"/>
  <text x="30" y="292" fill="#9a9ab4" font-size="9">两次「砍」的性质不同：4:2:0 砍的是颜色分辨率（人眼对色度不敏感），量化砍的是高频细节（人眼对细纹理不敏感）。</text>
  <text x="30" y="312" fill="#9a9ab4" font-size="8.5">质量参数 Q 只影响量化表：Q 高，量化表里的除数小，高频留得多，文件大；Q 低，除数大，一片一片的 8×8 马赛克就出来了。</text>
  <text x="30" y="332" fill="#6b6b85" font-size="8.5">所以 JPEG 的「块效应」不是压缩算法粗糙，是 8×8 分块这个前提决定的：块内可以任意变，块与块之间只能各算各的。</text>
</svg>