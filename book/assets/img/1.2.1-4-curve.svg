  <text x="392.6" y="92" fill="#9fe0c9" font-size="8.5" text-anchor="middle">放大区：模拟电路在这里工作</text>
  <text x="100" y="327.5" fill="#7a7a90" font-size="8" text-anchor="start">截止区（I_B = 0）</text>
  <line x1="30" y1="386" x2="730" y2="386" stroke="#2a2a3c"/>
  <text x="30" y="406" fill="#d8d8e4" font-size="9">模拟电路让工作点停在中间那段斜线上，输入微微一动，输出就跟着连续变化——这是放大。</text>
  <text x="30" y="424" fill="#9a9ab4" font-size="8.5">数字电路只把工作点甩到两端：截止时电流为零、输出接近电源电压；饱和时电压降到 0.2 伏、输出接近地。</text>
  <text x="30" y="442" fill="#6b6b85" font-size="8.5">两端离得越远越抗噪：标称 0.2 伏，噪声加到 1 伏还是判为「低」。这就是数字信号比模拟信号耐干扰的根本原因。</text>
</svg>