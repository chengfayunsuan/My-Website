<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.4 fig1 · 一次房贷审批中的征信查询</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">授权在先，查询在后：顺序反了就是违规</text>
<rect x="30" y="110" width="150" height="80" rx="8" fill="#16161f" stroke="#67b5ef" stroke-width="2"/>
<text x="105" y="140" fill="wht" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你</text>
<text x="105" y="160" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">借款申请人</text>
<text x="105" y="178" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">签字：查询授权书</text>
<rect x="250" y="110" width="180" height="80" rx="8" fill="#16161f" stroke="#8a8aa0" stroke-width="2"/>
<text x="340" y="140" fill="wht" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商业银行</text>
<text x="340" y="160" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷款审批岗</text>
<text x="340" y="178" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">需要看你的借贷历史</text>
<rect x="520" y="110" width="330" height="80" rx="8" fill="#16161f" stroke="#67d9a0" stroke-width="2"/>
<text x="685" y="140" fill="wht" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人民银行征信中心</text>
<text x="685" y="160" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">金融信用信息基础数据库</text>
<text x="685" y="178" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全国一张表，T+1 更新</text>
<line x1="180" y1="150" x2="242" y2="150" stroke="#c8c8dc" stroke-width="2"/>
<path d="M242,144 L254,150 L242,156 Z" fill="#c8c8dc" stroke="#8a8aa0" stroke-width="2"/>
<text x="215" y="136" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">① 签授权</text>
<line x1="430" y1="130" x2="512" y2="130" stroke="#67b5ef" stroke-width="2"/>
<path d="M512,124 L524,130 L512,136 Z" fill="#67b5ef" stroke="#8a8aa0" stroke-width="2"/>
<text x="472" y="100" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">② 查询请求（附授权编号）</text>
<line x1="520" y1="172" x2="442" y2="172" stroke="#67d9a0" stroke-width="2"/>
<path d="M442,166 L430,172 L442,178 Z" fill="#67d9a0" stroke="#8a8aa0" stroke-width="2"/>
<text x="472" y="208" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">③ 信用报告返回，秒级</text>
<text x="24" y="262" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有这纸授权，银行无权查你。违规查询被投诉查实，机构会被处罚，</text>
<text x="24" y="282" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的每次被查也都留痕——在报告最后一节，一条不落。</text>
</svg>
