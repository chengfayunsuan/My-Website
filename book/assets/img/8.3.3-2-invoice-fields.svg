<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">一张发票上有哪些格子，哪些填错会作废</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最重要的是「税收分类编码」——它决定税率，也决定税局怎么看你</text>
<rect x="40" y="66" width="680" height="150" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="60" y="90" fill="#67b5ef" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">购买方</text>
<text x="60" y="110" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">名称、纳税人识别号、地址电话、开户行及账号</text>
<text x="60" y="130" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（专票四项都要；普票一般只要名称和税号）</text>
<line x1="60" y1="142" x2="700" y2="142" stroke="#2a2a3e" stroke-width="1"/>
<text x="60" y="166" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">货物或应税劳务名称：技术服务费</text>
<text x="60" y="186" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 这个名字背后挂着一个「税收分类编码」，税率由它带出</text>
<text x="60" y="206" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数量 1 · 单价 10000 · 金额 10000 · 税率 6% · 税额 600</text>
<rect x="40" y="236" width="300" height="40" rx="5" fill="#16161f" stroke="#e87a8a" stroke-width="1"/>
<text x="54" y="261" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">抬头写错</text>
<rect x="356" y="236" width="364" height="40" rx="5" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="370" y="261" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对方不能抵扣，要红冲重开</text>
<rect x="40" y="282" width="300" height="40" rx="5" fill="#16161f" stroke="#e87a8a" stroke-width="1"/>
<text x="54" y="307" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">税号错一位</text>
<rect x="356" y="282" width="364" height="40" rx="5" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="370" y="307" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">系统直接校验不通过</text>
<rect x="40" y="328" width="300" height="40" rx="5" fill="#16161f" stroke="#e87a8a" stroke-width="1"/>
<text x="54" y="353" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商品编码选错</text>
<rect x="356" y="328" width="364" height="40" rx="5" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="370" y="353" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">税率错、可能被风控预警</text>
<rect x="40" y="374" width="300" height="40" rx="5" fill="#16161f" stroke="#e87a8a" stroke-width="1"/>
<text x="54" y="399" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">金额与合同不符</text>
<rect x="356" y="374" width="364" height="40" rx="5" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="370" y="399" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三流不一致，稽查重点</text>
</svg>
