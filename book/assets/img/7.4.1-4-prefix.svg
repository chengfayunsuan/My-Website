<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="356" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.4.1 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">看开头几位，就知道是哪家的卡</text>
<text x="60" y="88" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开头</text>
<text x="230" y="88" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡组织</text>
<text x="470" y="88" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">常见位数</text>
<text x="640" y="88" fill="#7a7a94" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">主要在哪儿用</text>
<line x1="60" y1="98" x2="820" y2="98" stroke="#3a3a52" stroke-width="1"/>
<text x="60" y="132" fill="#67b5ef" font-size="14" text-anchor="start" font-family="monospace">62</text>
<text x="230" y="132" fill="#dcdcea" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银联 UnionPay</text>
<text x="470" y="132" fill="#a8a8c0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">19 位（部分 16 位）</text>
<text x="640" y="132" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">国内最常见</text>
<text x="60" y="176" fill="#b58ae8" font-size="14" text-anchor="start" font-family="monospace">4</text>
<text x="230" y="176" fill="#dcdcea" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Visa</text>
<text x="470" y="176" fill="#a8a8c0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">16 位</text>
<text x="640" y="176" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全球受理最广</text>
<text x="60" y="220" fill="#e8965a" font-size="14" text-anchor="start" font-family="monospace">51–55 / 2221–2720</text>
<text x="230" y="220" fill="#dcdcea" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Mastercard</text>
<text x="470" y="220" fill="#a8a8c0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">16 位</text>
<text x="640" y="220" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欧洲、拉美多</text>
<text x="60" y="264" fill="#67d9a0" font-size="14" text-anchor="start" font-family="monospace">35</text>
<text x="230" y="264" fill="#dcdcea" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">JCB</text>
<text x="470" y="264" fill="#a8a8c0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">16 位</text>
<text x="640" y="264" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">日本、东南亚</text>
<text x="60" y="308" fill="#e87a8a" font-size="14" text-anchor="start" font-family="monospace">34 / 37</text>
<text x="230" y="308" fill="#dcdcea" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">American Express</text>
<text x="470" y="308" fill="#a8a8c0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">15 位</text>
<text x="640" y="308" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商户费率最高</text>
<line x1="60" y1="338" x2="820" y2="338" stroke="#3a3a52" stroke-width="1"/>
<text x="60" y="336" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡号前缀只说明"这张卡归谁管"，不说明钱在哪家银行；同一家银行可以同时发银联和 Visa 卡。</text>
</svg>
