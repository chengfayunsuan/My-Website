<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="420" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">抽屉的数量，和标签的位置</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">左边决定编译器要不要「腾地方」，右边决定译码器要不要「读说明书」</text>

  <!-- ============ 左：寄存器数量 ============ -->
  <text x="24" y="82" fill="#d8d8e4" font-size="10.5">通用寄存器数量</text>

  <text x="24" y="112" fill="#6b6b85" font-size="8.5">x86-32</text>
  <rect x="90" y="102" width="60" height="16" rx="2" fill="#3a1e26" stroke="#f0606a"/>
  <text x="158" y="114" fill="#f0606a" font-size="9">8 个</text>
  <text x="192" y="114" fill="#6b6b85" font-size="7.5">其中 esp、ebp 常被占用</text>

  <text x="24" y="146" fill="#6b6b85" font-size="8.5">x86-64</text>
  <rect x="90" y="136" width="120" height="16" rx="2" fill="#3a1e26" stroke="#f0606a"/>
  <text x="218" y="148" fill="#f0606a" font-size="9">16 个</text>

  <text x="24" y="180" fill="#6b6b85" font-size="8.5">ARM64</text>
  <rect x="90" y="170" width="232" height="16" rx="2" fill="#183028" stroke="#4ec9a3"/>
  <text x="330" y="182" fill="#4ec9a3" font-size="9">31 个</text>

  <text x="24" y="214" fill="#6b6b85" font-size="8.5">RISC-V</text>
  <rect x="90" y="204" width="240" height="16" rx="2" fill="#183028" stroke="#4ec9a3"/>
  <text x="338" y="216" fill="#4ec9a3" font-size="9">32 个</text>

  <text x="90" y="240" fill="#6b6b85" font-size="8">条长与数量成正比</text>

  <text x="24" y="268" fill="#9a9ab4" font-size="8.5">寄存器少 → 变量装不下 → 往栈上「溢出」→ 指令条数变多</text>
  <text x="24" y="286" fill="#6b6b85" font-size="8">一个稍复杂的循环，x86 可能要多出十几条存取指令</text>

  <!-- ============ 右：指令格式 ============ -->
  <line x1="388" y1="72" x2="388" y2="300" stroke="#2a2a44"/>

  <text x="408" y="82" fill="#d8d8e4" font-size="10.5">同一条「加 1」的编码</text>

  <!-- x86 变长 -->
  <text x="408" y="112" fill="#f0606a" font-size="9">x86：长度不定，位段复用</text>
  <g>
    <rect x="408" y="120" width="42" height="26" fill="#3a1e26" stroke="#f0606a"/>
    <text x="429" y="137" fill="#f0a0aa" font-size="7" text-anchor="middle">前缀</text>
    <rect x="450" y="120" width="50" height="26" fill="#4a2530" stroke="#f0606a"/>
    <text x="475" y="137" fill="#f0a0aa" font-size="7" text-anchor="middle">操作码</text>
    <rect x="500" y="120" width="56" height="26" fill="#3a1e26" stroke="#f0606a"/>
    <text x="528" y="137" fill="#f0a0aa" font-size="7" text-anchor="middle">ModR/M</text>
    <rect x="556" y="120" width="50" height="26" fill="#4a2530" stroke="#f0606a"/>
    <text x="581" y="137" fill="#f0a0aa" font-size="7" text-anchor="middle">SIB</text>
    <rect x="606" y="120" width="46" height="26" fill="#3a1e26" stroke="#f0606a"/>
    <text x="629" y="137" fill="#f0a0aa" font-size="7" text-anchor="middle">位移</text>
    <rect x="652" y="120" width="60" height="26" fill="#4a2530" stroke="#f0606a"/>
    <text x="682" y="137" fill="#f0a0aa" font-size="7" text-anchor="middle">立即数</text>
  </g>
  <text x="408" y="162" fill="#6b6b85" font-size="7.5">每段长度都不固定：前缀 0–4 字节，操作码 1–3，位移 0/1/2/4，立即数 0/1/2/4</text>
  <text x="408" y="178" fill="#f0606a" font-size="8">译码器必须先「读一遍」才知道这条多长</text>

  <!-- ARM 定长 -->
  <text x="408" y="208" fill="#4ec9a3" font-size="9">ARM64：固定四字节，位段写死</text>
  <g>
    <rect x="408" y="216" width="54" height="26" fill="#183028" stroke="#4ec9a3"/>
    <text x="435" y="233" fill="#9fe0c9" font-size="7" text-anchor="middle">操作码</text>
    <rect x="462" y="216" width="54" height="26" fill="#1e3d33" stroke="#4ec9a3"/>
    <text x="489" y="233" fill="#9fe0c9" font-size="7" text-anchor="middle">sf / 类型</text>
    <rect x="516" y="216" width="54" height="26" fill="#183028" stroke="#4ec9a3"/>
    <text x="543" y="233" fill="#9fe0c9" font-size="7" text-anchor="middle">Rn</text>
    <rect x="570" y="216" width="54" height="26" fill="#1e3d33" stroke="#4ec9a3"/>
    <text x="597" y="233" fill="#9fe0c9" font-size="7" text-anchor="middle">Rd</text>
    <rect x="624" y="216" width="88" height="26" fill="#183028" stroke="#4ec9a3"/>
    <text x="668" y="233" fill="#9fe0c9" font-size="7" text-anchor="middle">立即数 / Rm</text>
  </g>
  <text x="408" y="258" fill="#6b6b85" font-size="7.5">每个字段的位置和宽度由规范写死，译码时同时切出来</text>
  <text x="408" y="274" fill="#4ec9a3" font-size="8">读 4 个字节，所有字段一次到位</text>

  <line x1="24" y1="312" x2="736" y2="312" stroke="#2a2a44"/>

  <text x="24" y="334" fill="#e8b84b" font-size="9">左边那个差五倍的抽屉数，直接决定了程序里「存取内存」的次数；右边那个位段布局，决定了译码器的复杂度。</text>
  <text x="24" y="354" fill="#9a9ab4" font-size="9">两件事都指向同一个结论：x86 把复杂度放在了硬件这一侧，ARM 把它推给了编译器。</text>
  <text x="24" y="376" fill="#6b6b85" font-size="8.5">但编译器早就变强了——这是 RISC 在九十年代之后翻盘的根本原因。</text>

  <rect x="24" y="388" width="712" height="24" rx="4" fill="#171725" stroke="#2a2a44"/>
  <text x="38" y="404" fill="#cfc6ff" font-size="8.5">反过来说：寄存器多也有成本——函数调用和中断时要保存的状态更多，所以 ARM 把它们分成「调用者保存」和「被调用者保存」两类。</text>
</svg>
