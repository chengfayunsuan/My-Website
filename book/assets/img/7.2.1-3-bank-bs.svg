<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="428" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.1-3  商业银行的资产负债表：存款是负债</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这一张图能纠正一个最常见的误解 —— 大多数人以为存款是「银行欠你的钱」，其实是「你借给银行的钱」</text>
<rect x="56" y="92" width="356" height="232" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.5"/>
<text x="80" y="122" fill="#67b5ef" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">资产</text>
<text x="80" y="142" fill="#7a8aa2" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱去哪儿了</text>
<line x1="80" y1="154" x2="388" y2="154" stroke="#2a3a4a" stroke-width="1"/>
<text x="80" y="186" fill="#9aa8bc" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发放的贷款</text>
<text x="340" y="186" fill="#6f7f92" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最大的那块</text>
<text x="80" y="220" fill="#9aa8bc" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">债券投资</text>
<text x="340" y="220" fill="#6f7f92" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">国债、金融债</text>
<text x="80" y="254" fill="#9aa8bc" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">现金与准备金</text>
<text x="340" y="254" fill="#6f7f92" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">应付提现</text>
<text x="80" y="288" fill="#9aa8bc" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">其他资产</text>
<text x="340" y="288" fill="#6f7f92" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">固定资产等</text>
<rect x="468" y="92" width="356" height="232" rx="5" fill="#2a1a20" stroke="#e87a8a" stroke-width="1.5"/>
<text x="492" y="122" fill="#e87a8a" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">负债与所有者权益</text>
<text x="492" y="142" fill="#a88a92" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱从哪儿来</text>
<line x1="492" y1="154" x2="800" y2="154" stroke="#3a2a30" stroke-width="1"/>
<text x="492" y="186" fill="#b8a0a8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">吸收的存款</text>
<text x="784" y="186" fill="#8a6a72" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<text x="492" y="220" fill="#b8a0a8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同业负债</text>
<text x="784" y="220" fill="#8a6a72" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行之间借的</text>
<text x="492" y="254" fill="#b8a0a8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所有者权益</text>
<text x="784" y="254" fill="#8a6a72" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">股东的钱，不用还</text>
<line x1="640" y1="186" x2="700" y2="186" stroke="#ff8a9a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="700" y="172" fill="#ff8a9a" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这是负债，</text>
<text x="700" y="190" fill="#ff8a9a" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行要还的</text>
<text x="440" y="356" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">资产 = 负债 + 所有者权益</text>
<text x="440" y="378" fill="#7f7f98" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷款是银行的权利，存款是银行的义务</text>
<text x="40" y="408" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「银行拿我的存款去放贷」这句话，方向是对的，但性质说反了：银行不是「替你保管钱」，是「借你的钱去赚钱」，付给你的利息就是借钱的成本。</text>
</svg>
