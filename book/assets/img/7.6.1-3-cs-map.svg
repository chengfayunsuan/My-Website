<svg xmlns="http://www.w3.org/2000/svg" width="780" height="510" viewBox="0 0 780 510" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="510" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">这套系统其实全是计算机课上的老熟人</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">金融叫法和计算机叫法不同，解决的是同一类问题</text>
<text x="40" y="80" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">金融里的说法</text>
<text x="300" y="80" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="monospace">计算机里的对应概念</text>
<defs><marker id="v3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#8a8aa0"/></marker></defs><rect x="24" y="96" width="732" height="46" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="40" y="125" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">唯一流水号</text>
<line x1="228" y1="119" x2="262" y2="119" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#v3)"/><text x="276" y="118" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">幂等键（idempotency key）</text>
<text x="276" y="135" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一请求重发也不会扣两次</text>
<rect x="24" y="148" width="732" height="46" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="40" y="177" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">预授权冻结</text>
<line x1="228" y1="171" x2="262" y2="171" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#v3)"/><text x="276" y="170" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">预留资源 / 两阶段提交</text>
<text x="276" y="187" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">先占住，成功再落账</text>
<rect x="24" y="200" width="732" height="46" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="40" y="229" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">冲正</text>
<line x1="228" y1="223" x2="262" y2="223" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#v3)"/><text x="276" y="222" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">补偿事务（Saga）</text>
<text x="276" y="239" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">失败就反向做一次，抵消影响</text>
<rect x="24" y="252" width="732" height="46" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="40" y="281" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">日切批处理</text>
<line x1="228" y1="275" x2="262" y2="275" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#v3)"/><text x="276" y="274" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">批处理 + 削峰填谷</text>
<text x="276" y="291" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">攒够一批再算，摊薄单笔成本</text>
<rect x="24" y="304" width="732" height="46" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="40" y="333" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">轧差</text>
<line x1="228" y1="327" x2="262" y2="327" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#v3)"/><text x="276" y="326" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">合并事务 / 净额结算</text>
<text x="276" y="343" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把 N 笔合成 1 笔</text>
<rect x="24" y="356" width="732" height="46" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="40" y="385" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">对账</text>
<line x1="228" y1="379" x2="262" y2="379" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#v3)"/><text x="276" y="378" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">最终一致性校验</text>
<text x="276" y="395" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">允许短暂不一致，最终必须相等</text>
<rect x="24" y="408" width="732" height="46" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="40" y="437" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">状态机</text>
<line x1="228" y1="431" x2="262" y2="431" stroke="#8a8aa0" stroke-width="1.5" marker-end="url(#v3)"/><text x="276" y="430" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">有限状态机 + 幂等流转</text>
<text x="276" y="447" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只许沿固定顺序前进，不许跳步</text>
<text x="390" y="492" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">看懂这张表就明白：金融系统难的不是业务，是「在不可靠的网络上做不可错的事」</text>
</svg>
