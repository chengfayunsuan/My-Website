<text x="624" y="234" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">计数值</text>
<rect x="584" y="86" width="152" height="58" rx="4" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="596" y="106" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">行波结构</text>
<text x="596" y="124" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">延迟随位数累积</text>
<text x="596" y="140" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">输出有中间假值</text>
<rect x="584" y="152" width="152" height="58" rx="4" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<text x="596" y="172" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同步结构</text>
<text x="596" y="190" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">延迟与位数无关</text>
<text x="596" y="206" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">输出一次跳变到位</text>
<text x="24" y="320" fill="#9a9ab4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价：第 n 位的与门要 n 个输入。位数一多就得分层 —— 和 1.2.3 里超前进位的做法一模一样。</text>
<text x="24" y="340" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">付出的是每个时钟周期都要等进位链算完 —— 但这条链可以分层，延迟是对数级的。</text>
</svg>
