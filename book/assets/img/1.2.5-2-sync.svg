<rect x="455" y="196" width="76" height="64" rx="3" fill="#191926" stroke="#5a5a7e" stroke-width="1.6"/>
<text x="493.0" y="222" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">T 触发器</text>
<text x="493.0" y="240" fill="#7a7a94" font-size="9.5" text-anchor="middle" font-family="monospace">FF3</text>
<line x1="493.0" y1="144" x2="493.0" y2="195" stroke="#8a8aa0" stroke-width="1.6"/>
<path d="M493.0,195 l-3.5,-7 l7,0 z" fill="#8a8aa0"/>
