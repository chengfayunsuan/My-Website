<text x="368.0" y="222" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">T 触发器</text>
<text x="368.0" y="240" fill="#7a7a94" font-size="9.5" text-anchor="middle" font-family="monospace">FF2</text>
