<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="352" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.2.5-2  四位同步计数器：所有位一起翻</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每级的翻转条件在时钟沿之前就算好，全体共用同一根时钟</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a8aa0"/></marker></defs>
<rect x="68" y="86" width="472" height="58" rx="5" fill="#1b1b2a" stroke="#5a5a7e" stroke-width="1.6"/>
<text x="88" y="110" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">T 条件逻辑（进位链）</text>
<text x="88" y="130" fill="#9a9ab4" font-size="11" text-anchor="start" font-family="monospace">Ti = Q0 · Q1 · … · Q(i−1)</text>
<text x="276" y="130" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">低位全 1 才允许进位</text>
<rect x="80" y="196" width="76" height="64" rx="3" fill="#191926" stroke="#5a5a7e" stroke-width="1.6"/>
