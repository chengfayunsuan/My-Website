<text x="24" y="300" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有哪一份是"正本"。改一笔账，得让大多数人手里的副本一起接受，否则改不动。</text>
