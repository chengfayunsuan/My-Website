<svg width="880" height="372" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="372" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">同一个数字，在两层账本上身份不同</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三个主体，六栏科目。看的是同一笔钱在不同层级的名字。</text>
<rect x="56" y="76" width="768" height="78" rx="6" fill="#14141f" stroke="#33334a" stroke-width="1.2"/>
<text x="72" y="100" fill="#e8b84b" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">央行</text>
<text x="72" y="120" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中国人民银行的资产负债表</text>
<text x="236" y="100" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产</text>
<text x="236" y="122" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">国债、外汇储备</text>
<text x="236" y="142" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对商业银行的贷款</text>
<text x="520" y="100" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">负债　（下一层的资产）</text>
<text x="520" y="122" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商业银行的准备金存款</text>
<text x="520" y="142" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发行的现金</text>
<line x1="492" y1="88" x2="492" y2="142" stroke="#2c3040" stroke-width="1"/>
<rect x="56" y="176" width="768" height="78" rx="6" fill="#14141f" stroke="#33334a" stroke-width="1.2"/>
<text x="72" y="200" fill="#67b5ef" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">商业银行</text>
<text x="72" y="220" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">工商银行的资产负债表</text>
<text x="236" y="200" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产</text>
<text x="236" y="222" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在央行的准备金</text>
<text x="236" y="242" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">放出去的贷款</text>
<text x="520" y="200" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">负债　（下一层的资产）</text>
<text x="520" y="222" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的存款 3,527.18</text>
<text x="520" y="242" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">企业的存款</text>
<line x1="492" y1="188" x2="492" y2="242" stroke="#2c3040" stroke-width="1"/>
<rect x="56" y="276" width="768" height="78" rx="6" fill="#14141f" stroke="#33334a" stroke-width="1.2"/>
<text x="72" y="300" fill="#67d9a0" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">你</text>
<text x="72" y="320" fill="#8a8aa0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个自然人的「资产负债表」</text>
<text x="236" y="300" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产</text>
<text x="236" y="322" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">工行的存款 3,527.18</text>
<text x="236" y="342" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">余额宝、股票</text>
<text x="520" y="300" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">负债</text>
<text x="520" y="322" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">房贷 80 万</text>
<text x="520" y="342" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">信用卡欠款</text>
<line x1="492" y1="288" x2="492" y2="342" stroke="#2c3040" stroke-width="1"/>
</svg>
