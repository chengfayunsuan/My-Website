<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="306" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.2 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分类的目的是让不同的需求，走不同的门槛</text>
<rect x="40" y="92" width="240" height="110" rx="10" fill="#16161f" stroke="#e87a8a" stroke-width="1.5"/>
<text x="160" y="122" fill="#e87a8a" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不管，全放开</text>
<text x="160" y="150" fill="#cfcfe0" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开户方便</text>
<text x="160" y="174" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">但卡会被大规模买卖</text>
<rect x="320" y="92" width="240" height="110" rx="10" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="440" y="122" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分三类</text>
<text x="440" y="150" fill="#cfcfe0" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小额需求线上解决</text>
<text x="440" y="174" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大额需求必须面签</text>
<rect x="600" y="92" width="240" height="110" rx="10" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="720" y="122" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果</text>
<text x="720" y="150" fill="#cfcfe0" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">绝大多数人够用</text>
<text x="720" y="174" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">黑产拿不到全功能卡</text>
<path d="M284,147 L312,147" fill="none" stroke="#8a8aa0" stroke-width="1.5"/>
<path d="M312,142 L320,147 L312,152 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<path d="M564,147 L592,147" fill="none" stroke="#8a8aa0" stroke-width="1.5"/>
<path d="M592,142 L600,147 L592,152 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<text x="40" y="250" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你可以把它理解成三档「额度套餐」：额度越大，要做的核验越多。</text>
<text x="40" y="276" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以二类卡一天只能转一万，不是银行小气，是它当初只让你在手机上验了一次身份。</text>
</svg>
