<svg width="880" height="390" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="390" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.4.4-2  一个虚拟机里到底有什么</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左边只读、可共享；右边每个线程私有一份</text>
<text x="36" y="92" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">字节码数组（只读）</text>
<rect x="36" y="102" width="218" height="178" rx="3" fill="#12121b" stroke="#2e2e44" stroke-width="1.2"/>
<rect x="38" y="106" width="214" height="24" rx="0" fill="#1e1e2c" stroke="none" stroke-width="1.5"/>
<text x="48" y="122" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">0</text>
<text x="78" y="122" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">load_local 1</text>
<rect x="38" y="130" width="214" height="24" rx="0" fill="#16161f" stroke="none" stroke-width="1.5"/>
<text x="48" y="146" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">2</text>
<text x="78" y="146" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">load_local n</text>
<text x="48" y="170" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">4</text>
<text x="78" y="170" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">lt</text>
<rect x="38" y="178" width="214" height="24" rx="0" fill="#16161f" stroke="none" stroke-width="1.5"/>
<text x="48" y="194" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">5</text>
<text x="78" y="194" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">jump_if_false 30</text>
<text x="48" y="218" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">8</text>
<text x="78" y="218" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">load_local s</text>
<rect x="38" y="226" width="214" height="24" rx="0" fill="#16161f" stroke="none" stroke-width="1.5"/>
<text x="48" y="242" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">10</text>
<text x="78" y="242" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">load_local a</text>
<text x="240" y="122" fill="#e8b84b" font-size="8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">pc 在此</text>
<text x="48" y="266" fill="#4e4e66" font-size="9.5" text-anchor="start" font-family="monospace">…</text>
<text x="78" y="266" fill="#4e4e66" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">共 20 余条</text>
<text x="290" y="92" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">解释循环</text>
<rect x="290" y="102" width="206" height="150" rx="3" fill="#12121b" stroke="#2e2e44" stroke-width="1.2"/>
<rect x="304" y="114" width="168" height="36" rx="3" fill="#16161f" stroke="#67b5ef" stroke-width="1.2"/>
<text x="314" y="129" fill="#67b5ef" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">取指</text>
<text x="314" y="143" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">op = code[pc++]</text>
<rect x="304" y="160" width="168" height="36" rx="3" fill="#16161f" stroke="#e8b84b" stroke-width="1.2"/>
<text x="314" y="175" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分派</text>
<text x="314" y="189" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">switch (op)</text>
<rect x="304" y="206" width="168" height="36" rx="3" fill="#16161f" stroke="#67d9a0" stroke-width="1.2"/>
<text x="314" y="221" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">执行</text>
<text x="314" y="235" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">case OP_ADD: …</text>
<path d="M388,150 l-4,-7 l8,0 Z" fill="#3a3a52"/>
<path d="M388,196 l-4,-7 l8,0 Z" fill="#3a3a52"/>
<path d="M474,224 L486,224 L486,120 L474,120" fill="none" stroke="#4e4e66" stroke-width="1.2"/>
<path d="M474,120 l8,-4 l0,8 Z" fill="#4e4e66"/>
<text x="290" y="272" fill="#6a6a82" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每条字节码 ≈ 10 ~ 15 条机器指令</text>
<text x="546" y="92" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">执行状态（每线程私有）</text>
<text x="546" y="112" fill="#7a7a94" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">操作数栈</text>
<rect x="546" y="120" width="132" height="26" rx="0" fill="#1c1c28" stroke="#2e2e44" stroke-width="1"/>
<text x="556" y="137" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">s + a[i]</text>
<rect x="546" y="146" width="132" height="26" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="556" y="163" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">a[i]</text>
<rect x="546" y="172" width="132" height="26" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="556" y="189" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">i</text>
<rect x="546" y="198" width="132" height="26" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="700" y="112" fill="#7a7a94" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">局部变量区</text>
<rect x="700" y="120" width="144" height="26" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="710" y="137" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">#0</text>
<text x="736" y="137" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">s</text>
<text x="834" y="137" fill="#5a5a72" font-size="8.5" text-anchor="end" font-family="monospace">5</text>
<rect x="700" y="146" width="144" height="26" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="710" y="163" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">#1</text>
<text x="736" y="163" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">i</text>
<text x="834" y="163" fill="#5a5a72" font-size="8.5" text-anchor="end" font-family="monospace">7</text>
<rect x="700" y="172" width="144" height="26" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="710" y="189" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">#2</text>
<text x="736" y="189" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">n</text>
<text x="834" y="189" fill="#5a5a72" font-size="8.5" text-anchor="end" font-family="monospace">7</text>
<rect x="700" y="198" width="144" height="26" rx="0" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="710" y="215" fill="#3e3e56" font-size="8.5" text-anchor="start" font-family="monospace">#3</text>
<text x="736" y="215" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="monospace">a</text>
<text x="834" y="215" fill="#5a5a72" font-size="8.5" text-anchor="end" font-family="monospace">ptr</text>
<text x="546" y="246" fill="#7a7a94" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">常量池</text>
<rect x="546" y="254" width="298" height="44" rx="2" fill="#16161f" stroke="#2e2e44" stroke-width="1"/>
<text x="558" y="273" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">1</text>
<text x="590" y="273" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">2</text>
<text x="622" y="273" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">30</text>
<text x="664" y="273" fill="#8a8aa4" font-size="8.5" text-anchor="start" font-family="monospace">"hello"</text>
<text x="558" y="291" fill="#7a7a94" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">字节码里只存下标编号</text>
<path d="M258,190 l20,0" stroke="#3a3a52" stroke-width="1.2"/>
<path d="M282,190 l-8,-4 l0,8 Z" fill="#3a3a52"/>
<text x="269" y="183" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">读</text>
<path d="M500,168 l38,0" stroke="#3a3a52" stroke-width="1.2"/>
<path d="M542,168 l-8,-4 l0,8 Z" fill="#3a3a52"/>
<text x="36" y="354" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">「虚拟机」听着玄，实质就是这四样东西：一个 pc、一段指令数组、一个栈、一张常量表。</text>
<text x="36" y="374" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所谓跨平台，就是这四样东西每个平台各实现一遍，字节码本身一个字节都不用改。</text>
</svg>
