<svg xmlns="http://www.w3.org/2000/svg" width="880" height="368" viewBox="0 0 880 368" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="368" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.2 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行真倒了，钱按这个顺序分</text>
<rect x="40" y="88" width="500" height="42" rx="6" fill="#16161f" stroke="#8a8aa0" stroke-width="1.3"/>
<text x="60" y="115" fill="#8a8aa0" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1</text>
<text x="90" y="115" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">破产费用、共益债务</text>
<text x="300" y="115" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">清算本身的开销</text>
<rect x="40" y="136" width="500" height="42" rx="6" fill="#16161f" stroke="#e8965a" stroke-width="1.3"/>
<text x="60" y="163" fill="#e8965a" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2</text>
<text x="90" y="163" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">职工工资、社保</text>
<text x="300" y="163" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">员工先拿</text>
<rect x="40" y="184" width="500" height="42" rx="6" fill="#16161f" stroke="#b58ae8" stroke-width="1.3"/>
<text x="60" y="211" fill="#b58ae8" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3</text>
<text x="90" y="211" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">税款</text>
<text x="300" y="211" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">国家</text>
<rect x="40" y="232" width="500" height="42" rx="6" fill="#16161f" stroke="#e87a8a" stroke-width="1.3"/>
<text x="60" y="259" fill="#e87a8a" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4</text>
<text x="90" y="259" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">普通债权</text>
<text x="300" y="259" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">包括超过 50 万的存款</text>
<rect x="40" y="280" width="500" height="42" rx="6" fill="#16161f" stroke="#6a6a82" stroke-width="1.3"/>
<text x="60" y="307" fill="#6a6a82" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5</text>
<text x="90" y="307" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">股东权益</text>
<text x="300" y="307" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最后，通常归零</text>
<rect x="570" y="88" width="270" height="234" rx="8" fill="#15151f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="705" y="116" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">50 万以内</text>
<text x="705" y="146" fill="#cfcfe0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不走这个队</text>
<text x="705" y="176" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">由存款保险基金</text>
<text x="705" y="198" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">直接赔付</text>
<text x="705" y="236" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">7 个工作日内</text>
<text x="705" y="258" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把钱打到手上</text>
<text x="40" y="352" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">超过 50 万的部分才需要排队，能拿回多少看银行还剩什么。</text>
</svg>
