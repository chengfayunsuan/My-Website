<text x="24" y="336" fill="#9a9ab4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每条箭头上的数字是「这一拍输入的比特」。绿色 = 输入 1，红色 = 输入 0。</text>
<text x="24" y="358" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两条反直觉的箭头：S2 收到 1 留在原地（111 末尾仍是 11）；S4 收到 1 退到 S2（1101 末尾的 11 正好是新匹配的开头）。</text>
<text x="24" y="380" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">S4 时输出 1 —— 这是 Moore 型的输出：只看状态，一根线。</text>
