<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="720" height="380" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">「叮」的那一秒钱没有走：冻结 ≠ 划款</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">授权只是把你账户里这部分钱「圈起来」，真正转账发生在第二天</text>
<line x1="60" y1="150" x2="660" y2="150" stroke="#8a8aa0" stroke-width="2"/>
<circle cx="120" cy="150" r="4" fill="#e8b84b"/>
<text x="120" y="176" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">现在 20:00</text>
<circle cx="400" cy="150" r="4" fill="#67d9a0"/>
<text x="400" y="176" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当晚（日切）</text>
<circle cx="600" cy="150" r="4" fill="#67b5ef"/>
<text x="600" y="176" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">T+1 凌晨</text>
<line x1="120" y1="150" x2="120" y2="110" stroke="#e8b84b" stroke-width="2"/>
<rect x="60" y="62" width="170" height="48" rx="6" fill="#2a1f12" stroke="#e8b84b" stroke-width="1.5"/>
<text x="145" y="82" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">授权成功</text>
<text x="145" y="100" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">冻结 100 元额度</text>
<line x1="400" y1="150" x2="400" y2="110" stroke="#67d9a0" stroke-width="2"/>
<rect x="310" y="62" width="180" height="48" rx="6" fill="#12241a" stroke="#67d9a0" stroke-width="1.5"/>
<text x="400" y="82" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">商户提交清算</text>
<text x="400" y="100" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">「把今天的账结给我」</text>
<line x1="600" y1="150" x2="600" y2="110" stroke="#67b5ef" stroke-width="2"/>
<rect x="510" y="62" width="180" height="48" rx="6" fill="#121a2a" stroke="#67b5ef" stroke-width="1.5"/>
<text x="600" y="82" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">真正划款</text>
<text x="600" y="100" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">冻结转成实际转账</text>
<rect x="60" y="210" width="600" height="100" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="80" y="236" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">为什么要这么绕？</text>
<text x="80" y="260" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 几千万笔交易攒一批，夜里集中处理，便宜得多</text>
<text x="80" y="282" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 冻结保证「你赖不了账」：额度被占住，别处刷不出去</text>
<text x="80" y="304" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 停车场刷 100 元真付款 0.01 元验证卡——多冻的部分 T+1 解冻退回</text>
</svg>
