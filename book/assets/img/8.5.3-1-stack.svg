<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">8.5.3-1 / 一个人的出海技术栈</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">越往下越贵、越慢、越难改；越往上越便宜、越频繁</text>
<rect x="40" y="76" width="600" height="100" rx="8" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="40" y="76" width="6" height="100" rx="0" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="62" y="110" fill="#67b5ef" font-size="15" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">每天</text>
<text x="62" y="132" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">15 分钟</text>
<rect x="150" y="98" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="162" y="118" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查收注册邮箱与业务邮箱</text>
<rect x="400" y="98" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="412" y="118" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">出口地区保持同一个</text>
<rect x="150" y="138" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="162" y="158" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">系统时区不要漂回来</text>
<rect x="400" y="138" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="412" y="158" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">网站与证书是否还活着</text>
<rect x="40" y="190" width="600" height="100" rx="8" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="40" y="190" width="6" height="100" rx="0" fill="#67d9a0" stroke="none" stroke-width="1.5"/>
<text x="62" y="224" fill="#67d9a0" font-size="15" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">每月</text>
<text x="62" y="246" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">半天</text>
<rect x="150" y="212" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="162" y="232" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对账：通道 → 银行 → 记账</text>
<rect x="400" y="212" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="412" y="232" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">账单与订阅：别让卡过期</text>
<rect x="150" y="252" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="162" y="272" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">合规邮件：年报与税表提醒</text>
<rect x="400" y="252" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="412" y="272" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">余额与预留：留够下一年</text>
<rect x="40" y="304" width="600" height="100" rx="8" fill="#14141e" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="40" y="304" width="6" height="100" rx="0" fill="#e8b84b" stroke="none" stroke-width="1.5"/>
<text x="62" y="338" fill="#e8b84b" font-size="15" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">一次性</text>
<text x="62" y="360" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">6 ~ 10 周</text>
<rect x="150" y="326" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="162" y="346" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">护照、地址证明、人脸</text>
<rect x="400" y="326" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="412" y="346" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">手机号、邮箱、出口、时区</text>
<rect x="150" y="366" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="162" y="386" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">主体、EIN、注册代理</text>
<rect x="400" y="366" width="226" height="30" rx="5" fill="#191926" stroke="#2e2e44" stroke-width="1"/>
<text x="412" y="386" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行、收款通道、券商</text>
<text x="24" y="434" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从下往上搭，从上往下用。搭的时候最下面那层占了九成时间，跑起来之后你几乎只碰上面两层。</text>
<text x="24" y="454" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最下面那层展开就是上一节的十二个组件，上面两层只是把它们维持住。</text>
</svg>
