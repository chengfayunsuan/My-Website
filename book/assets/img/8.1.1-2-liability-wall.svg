<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">那堵墙：有限责任到底挡的是什么</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">公司欠的钱原则上追不到你家的房子；个体户欠的钱直接追到你身上</text>
<defs><marker id="w3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#e87a8a"/></marker></defs><text x="30" y="74" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">个体工商户：没有墙</text>
<rect x="30" y="88" width="340" height="246" rx="6" fill="#16161f" stroke="#e8965a" stroke-width="1.5"/>
<rect x="52" y="108" width="132" height="56" rx="5" fill="#1a1a26" stroke="#e8965a" stroke-width="1.2"/>
<text x="118" y="132" fill="#e8965a" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你</text>
<text x="118" y="152" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">自然人</text>
<text x="200" y="140" fill="#c8c8dc" font-size="14" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">＝</text>
<rect x="216" y="108" width="132" height="56" rx="5" fill="#1a1a26" stroke="#e8965a" stroke-width="1.2"/>
<text x="282" y="132" fill="#e8965a" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">生意</text>
<text x="282" y="152" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欠债 80 万</text>
<text x="200" y="184" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">法律上不分你我</text>
<line x1="106" y1="196" x2="106" y2="226" stroke="#e87a8a" stroke-width="1.5" marker-end="url(#w3)"/><rect x="60" y="230" width="92" height="42" rx="5" fill="#2a1618" stroke="#e87a8a" stroke-width="1.2"/>
<text x="106" y="257" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">房子</text>
<line x1="210" y1="196" x2="210" y2="226" stroke="#e87a8a" stroke-width="1.5" marker-end="url(#w3)"/><rect x="164" y="230" width="92" height="42" rx="5" fill="#2a1618" stroke="#e87a8a" stroke-width="1.2"/>
<text x="210" y="257" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">车</text>
<line x1="314" y1="196" x2="314" y2="226" stroke="#e87a8a" stroke-width="1.5" marker-end="url(#w3)"/><rect x="268" y="230" width="92" height="42" rx="5" fill="#2a1618" stroke="#e87a8a" stroke-width="1.2"/>
<text x="314" y="257" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款</text>
<text x="200" y="302" fill="#e87a8a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">债主可以申请执行这些</text>
<text x="410" y="74" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">有限责任公司：有一道墙</text>
<rect x="410" y="88" width="340" height="246" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<rect x="430" y="108" width="104" height="56" rx="5" fill="#1a1a26" stroke="#67d9a0" stroke-width="1.2"/>
<text x="482" y="132" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">股东</text>
<text x="482" y="152" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的房子车</text>
<rect x="556" y="100" width="10" height="190" rx="2" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<text x="561" y="306" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">墙</text>
<rect x="590" y="108" width="138" height="56" rx="5" fill="#1a1a26" stroke="#67d9a0" stroke-width="1.2"/>
<text x="659" y="132" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">公司</text>
<text x="659" y="152" fill="#c8c8dc" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产 20 万</text>
<text x="659" y="190" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欠债 80 万</text>
<line x1="659" y1="198" x2="659" y2="222" stroke="#e87a8a" stroke-width="1.5" marker-end="url(#w3)"/><path d="M659,222 L610,222 L574,222" fill="none" stroke="#e87a8a" stroke-width="1.5" marker-end="url(#w3)"/><text x="600" y="244" fill="#e87a8a" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">撞墙为止</text>
<rect x="430" y="258" width="104" height="50" rx="5" fill="#12121a" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="482" y="280" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">公司清算</text>
<text x="482" y="298" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">赔完就结束</text>
<text x="620" y="290" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">股东最多损失认缴的出资</text>
</svg>
