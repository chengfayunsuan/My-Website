<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">热阻链：一条从硅片通到房间的串联电路</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">250 瓦的热，要走完五段路，每段都要留下一点温差</text>

  <text x="50" y="70" fill="#f0606a" font-size="10">热流 250 W →</text>

  <!-- 热流带 -->
  <rect x="50" y="80" width="211" height="56" fill="#3a1e26" stroke="#f0606a"/>
  <text x="156" y="102" fill="#f0a0a8" font-size="10.5" text-anchor="middle">硅片 → 顶盖</text>
  <text x="156" y="120" fill="#f0606a" font-size="10" text-anchor="middle">0.08 K/W</text>

  <rect x="261" y="80" width="53" height="56" fill="#332a18" stroke="#e8b84b"/>
  <text x="287" y="102" fill="#e8b84b" font-size="9" text-anchor="middle">硅脂</text>
  <text x="287" y="118" fill="#e8b84b" font-size="9" text-anchor="middle">0.02</text>

  <rect x="314" y="80" width="132" height="56" fill="#1b2740" stroke="#67b5ef"/>
  <text x="380" y="102" fill="#9fd4f5" font-size="10.5" text-anchor="middle">底座 → 鳍片</text>
  <text x="380" y="120" fill="#67b5ef" font-size="10" text-anchor="middle">0.05 K/W</text>

  <rect x="446" y="80" width="158" height="56" fill="#20303a" stroke="#4ec9a3"/>
  <text x="525" y="102" fill="#9fe0c9" font-size="10.5" text-anchor="middle">鳍片 → 空气</text>
  <text x="525" y="120" fill="#4ec9a3" font-size="10" text-anchor="middle">0.06 K/W</text>

  <rect x="604" y="80" width="106" height="56" fill="#1a2338" stroke="#6b8fd4"/>
  <text x="657" y="102" fill="#a8c0ee" font-size="10.5" text-anchor="middle">机箱 → 房间</text>
  <text x="657" y="120" fill="#6b8fd4" font-size="10" text-anchor="middle">0.04 K/W</text>

  <!-- 分段刻度与温度 -->
  <g stroke="#4a4a68">
    <line x1="50" y1="136" x2="50" y2="146"/>
    <line x1="261" y1="136" x2="261" y2="146"/>
    <line x1="314" y1="136" x2="314" y2="146"/>
    <line x1="446" y1="136" x2="446" y2="146"/>
    <line x1="604" y1="136" x2="604" y2="146"/>
    <line x1="710" y1="136" x2="710" y2="146"/>
  </g>

  <g font-size="10" text-anchor="middle">
    <text x="50" y="162" fill="#f0606a">87.5°C</text>
    <text x="261" y="162" fill="#f0a0a8">67.5</text>
    <text x="314" y="162" fill="#e8b84b">62.5</text>
    <text x="446" y="162" fill="#9fd4f5">50</text>
    <text x="604" y="162" fill="#9fe0c9">35</text>
    <text x="710" y="162" fill="#a8c0ee">25</text>
  </g>

  <g font-size="9" text-anchor="middle" fill="#6b6b85">
    <text x="156" y="178">−20 K</text>
    <text x="287" y="178">−5</text>
    <text x="380" y="178">−12.5</text>
    <text x="525" y="178">−15</text>
    <text x="657" y="178">−10</text>
  </g>

  <text x="50" y="196" fill="#6b6b85" font-size="9">左边是芯片结温，右边是房间温度</text>

  <!-- 分隔 -->
  <line x1="24" y1="212" x2="736" y2="212" stroke="#2a2a44"/>

  <!-- 总式 -->
  <text x="50" y="240" fill="#e8b84b" font-size="13">0.08 + 0.02 + 0.05 + 0.06 + 0.04 = 0.25 K/W</text>
  <text x="50" y="264" fill="#d8d8e4" font-size="11.5">250 W × 0.25 K/W = 62.5 K　→　房间 25°C + 62.5 = <tspan fill="#f0606a">87.5°C</tspan></text>

  <!-- 三段要点 -->
  <g>
    <text x="50" y="298" fill="#f0606a" font-size="10">改不了</text>
    <text x="50" y="316" fill="#9a9ab4" font-size="9">第 1 段在封装里面</text>
    <text x="50" y="332" fill="#6b6b85" font-size="9">开盖能绕过它，降十几度</text>
  </g>
  <g>
    <text x="290" y="298" fill="#e8b84b" font-size="10">最容易做坏</text>
    <text x="290" y="316" fill="#9a9ab4" font-size="9">硅脂涂厚、有气泡、干裂</text>
    <text x="290" y="332" fill="#6b6b85" font-size="9">0.02 可以变成 0.08</text>
  </g>
  <g>
    <text x="540" y="298" fill="#4ec9a3" font-size="10">靠维护</text>
    <text x="540" y="316" fill="#9a9ab4" font-size="9">鳍片积灰、风扇老化</text>
    <text x="540" y="332" fill="#6b6b85" font-size="9">占「用久了变热」原因的九成</text>
  </g>

  <!-- 算例 -->
  <rect x="50" y="350" width="660" height="110" rx="7" fill="#171725" stroke="#2a2a44"/>
  <text x="68" y="372" fill="#cfc6ff" font-size="10.5">一个算例：硅脂干了会怎样</text>
  <text x="68" y="390" fill="#9a9ab4" font-size="9">0.02 变成 0.08，总热阻从 0.25 涨到 0.31，结温多 15 度——正好撞上温度墙</text>

  <text x="68" y="414" fill="#6b6b85" font-size="9">正常 0.25</text>
  <rect x="148" y="404" width="150" height="12" rx="2" fill="#4ec9a3"/>
  <text x="306" y="414" fill="#9fe0c9" font-size="9">87.5°C</text>

  <text x="68" y="440" fill="#6b6b85" font-size="9">干裂 0.31</text>
  <rect x="148" y="430" width="186" height="12" rx="2" fill="#3a1e26" stroke="#f0606a"/>
  <text x="342" y="440" fill="#f0606a" font-size="9">102.5°C</text>

  <text x="420" y="440" fill="#6b6b85" font-size="8.5">条形长度按总热阻等比绘制</text>
</svg>
