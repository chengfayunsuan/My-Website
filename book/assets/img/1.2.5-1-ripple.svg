<text x="24" y="490" fill="#9a9ab4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最终值是对的，中间过程是错的 —— 只要有人在这段时间读它，读到的就是假值。</text>
<text x="24" y="510" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以行波结构只能用来分频（只取最高位），或者驱动「没人看那么快」的显示。</text>
