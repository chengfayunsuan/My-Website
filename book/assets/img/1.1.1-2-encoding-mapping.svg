<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#6b6b85"/>
    </marker>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L8,4 L0,7 Z" fill="#9b4df0"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#0e0e16"/>

  <text x="24" y="28" fill="#9a9ab4" font-size="12.5" font-family="monospace">编码的全部工作：在「东西」和「编号」之间建立一张双方都认的表</text>

  <!-- 列标题 -->
  <text x="24" y="58" fill="#67b5ef" font-size="11" font-family="monospace">现实里的东西</text>
  <text x="212" y="58" fill="#e8b84b" font-size="11" font-family="monospace">编码表（约定）</text>
  <text x="440" y="58" fill="#4ec9a3" font-size="11" font-family="monospace">存下来的比特</text>

  <!-- ========== 第一行：文字 ========== -->
  <rect x="24" y="72" width="150" height="64" rx="8" fill="#171725" stroke="#67b5ef" stroke-opacity="0.4"/>
  <text x="99" y="100" fill="#ffffff" font-size="22" text-anchor="middle">你</text>
  <text x="99" y="122" fill="#6b6b85" font-size="10" text-anchor="middle">一个汉字</text>

  <line x1="178" y1="104" x2="206" y2="104" stroke="#6b6b85" stroke-width="1.6" marker-end="url(#ar2)"/>

  <rect x="212" y="72" width="200" height="64" rx="8" fill="#1a1826" stroke="#e8b84b" stroke-opacity="0.4"/>
  <text x="224" y="96" fill="#9a9ab4" font-size="10.5" font-family="monospace">符号        编号（码点）</text>
  <text x="224" y="120" fill="#e8b84b" font-size="13" font-family="monospace">你    →    U+4F60</text>

  <line x1="416" y1="104" x2="436" y2="104" stroke="#6b6b85" stroke-width="1.6" marker-end="url(#ar2)"/>

  <g>
    <rect x="440" y="88" width="20" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="450" y="108" fill="#4ec9a3" font-size="10" text-anchor="middle" font-family="monospace">E4</text>
    <rect x="464" y="88" width="20" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="474" y="108" fill="#4ec9a3" font-size="10" text-anchor="middle" font-family="monospace">BD</text>
    <rect x="488" y="88" width="20" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="498" y="108" fill="#4ec9a3" font-size="10" text-anchor="middle" font-family="monospace">A0</text>
    <text x="516" y="108" fill="#6b6b85" font-size="10.5">= 3 字节（UTF-8）</text>
  </g>

  <!-- ========== 第二行：图像 ========== -->
  <rect x="24" y="152" width="150" height="64" rx="8" fill="#171725" stroke="#67b5ef" stroke-opacity="0.4"/>
  <g>
    <rect x="46" y="166" width="12" height="12" fill="#f0606a"/>
    <rect x="58" y="166" width="12" height="12" fill="#e8b84b"/>
    <rect x="70" y="166" width="12" height="12" fill="#4ec9a3"/>
    <rect x="46" y="178" width="12" height="12" fill="#67b5ef"/>
    <rect x="58" y="178" width="12" height="12" fill="#9b4df0"/>
    <rect x="70" y="178" width="12" height="12" fill="#f0606a"/>
    <rect x="46" y="190" width="12" height="12" fill="#e8b84b"/>
    <rect x="58" y="190" width="12" height="12" fill="#67b5ef"/>
    <rect x="70" y="190" width="12" height="12" fill="#4ec9a3"/>
  </g>
  <text x="96" y="176" fill="#9a9ab4" font-size="10.5">一个 3×3</text>
  <text x="96" y="192" fill="#9a9ab4" font-size="10.5">的小图</text>
  <text x="96" y="208" fill="#6b6b85" font-size="9.5">每格一个颜色</text>

  <line x1="178" y1="184" x2="206" y2="184" stroke="#6b6b85" stroke-width="1.6" marker-end="url(#ar2)"/>

  <rect x="212" y="152" width="200" height="64" rx="8" fill="#1a1826" stroke="#e8b84b" stroke-opacity="0.4"/>
  <text x="224" y="176" fill="#9a9ab4" font-size="10.5" font-family="monospace">颜色        三元组（R,G,B）</text>
  <text x="224" y="200" fill="#e8b84b" font-size="13" font-family="monospace">纯红  →  (255, 0, 0)</text>

  <line x1="416" y1="184" x2="436" y2="184" stroke="#6b6b85" stroke-width="1.6" marker-end="url(#ar2)"/>

  <g>
    <rect x="440" y="168" width="20" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="450" y="188" fill="#4ec9a3" font-size="10" text-anchor="middle" font-family="monospace">FF</text>
    <rect x="464" y="168" width="20" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="474" y="188" fill="#4ec9a3" font-size="10" text-anchor="middle" font-family="monospace">00</text>
    <rect x="488" y="168" width="20" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="498" y="188" fill="#4ec9a3" font-size="10" text-anchor="middle" font-family="monospace">00</text>
    <text x="516" y="188" fill="#6b6b85" font-size="10.5">= 3 字节</text>
  </g>

  <!-- ========== 第三行：声音 ========== -->
  <rect x="24" y="232" width="150" height="64" rx="8" fill="#171725" stroke="#67b5ef" stroke-opacity="0.4"/>
  <path d="M38,264 Q46,244 54,264 T70,264 T86,264 T102,264 T118,264 T134,264 T150,264 T162,264"
        fill="none" stroke="#c9b0ff" stroke-width="1.6"/>
  <text x="99" y="288" fill="#6b6b85" font-size="9.5" text-anchor="middle">一段空气压力变化</text>

  <line x1="178" y1="264" x2="206" y2="264" stroke="#6b6b85" stroke-width="1.6" marker-end="url(#ar2)"/>

  <rect x="212" y="232" width="200" height="64" rx="8" fill="#1a1826" stroke="#e8b84b" stroke-opacity="0.4"/>
  <text x="224" y="256" fill="#9a9ab4" font-size="10.5" font-family="monospace">每秒切 44100 刀</text>
  <text x="224" y="280" fill="#e8b84b" font-size="13" font-family="monospace">每刀记一个 16 位数</text>

  <line x1="416" y1="264" x2="436" y2="264" stroke="#6b6b85" stroke-width="1.6" marker-end="url(#ar2)"/>

  <g>
    <rect x="440" y="248" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="453" y="268" fill="#4ec9a3" font-size="9.5" text-anchor="middle" font-family="monospace">0x1F</text>
    <rect x="470" y="248" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="483" y="268" fill="#4ec9a3" font-size="9.5" text-anchor="middle" font-family="monospace">0x2A</text>
    <rect x="500" y="248" width="26" height="32" rx="3" fill="#1b2b22" stroke="#4ec9a3" stroke-opacity="0.6"/>
    <text x="513" y="268" fill="#4ec9a3" font-size="9.5" text-anchor="middle" font-family="monospace">0x08</text>
    <text x="532" y="268" fill="#6b6b85" font-size="10.5">…每秒四万个</text>
  </g>

  <!-- 结论 -->
  <line x1="24" y1="320" x2="616" y2="320" stroke="#2a2a44" stroke-width="1"/>
  <text x="24" y="344" fill="#9a9ab4" font-size="11">三种东西，三张完全不同的表：文字用「码点表」，图像用「像素坐标 + 颜色值」，声音用「时间 + 采样值」。</text>
  <text x="24" y="366" fill="#9a9ab4" font-size="11">但它们右边的产物是同一种东西——字节。所以同一套硬件、同一条网线，能装下文字、图片和声音。</text>
  <text x="24" y="388" fill="#6b6b85" font-size="11">解码时用错表，就是乱码 / 花屏 / 噪音。三种「坏了」的现象，本质是同一个原因。</text>
</svg>
