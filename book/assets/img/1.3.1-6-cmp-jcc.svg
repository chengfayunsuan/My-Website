<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="410" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.3.1-6  一次比较的完整链路</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">cmp 算完就扔，只留四个标志位；jcc 什么也不算，只看别人留下的结论</text>
<text x="24" y="84" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">① cmp 走加法器</text>
<rect x="30" y="100" width="96" height="34" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.2"/>
<text x="78" y="122" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="monospace">EAX = 5</text>
<rect x="30" y="146" width="96" height="34" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.2"/>
<text x="78" y="168" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="monospace">EBX = 7</text>
<line x1="126" y1="117" x2="152" y2="132" stroke="#5a5a72" stroke-width="1.3"/>
<line x1="126" y1="163" x2="152" y2="148" stroke="#5a5a72" stroke-width="1.3"/>
<rect x="152" y="108" width="96" height="64" rx="3" fill="#20202e" stroke="#8a8aa0" stroke-width="1.4"/>
<text x="200" y="134" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">减法器</text>
<text x="200" y="152" fill="#8a8aa0" font-size="9.5" text-anchor="middle" font-family="monospace">5 − 7</text>
<line x1="248" y1="140" x2="276" y2="140" stroke="#5a5a72" stroke-width="1.3"/>
<path d="M276,140 l-7,-4 l0,8 z" fill="#5a5a72"/>
<rect x="276" y="122" width="62" height="36" rx="3" fill="#241c1c" stroke="#e87a8a" stroke-width="1.3"/>
<text x="307" y="145" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="monospace">−2</text>
<path d="M290,120 L324,158 M324,120 L290,158" stroke="#e87a8a" stroke-width="1.2" opacity="0.7"/>
<text x="276" y="184" fill="#e87a8a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果扔掉</text>
<line x1="200" y1="172" x2="200" y2="208" stroke="#e8b84b" stroke-width="1.5"/>
<path d="M200,208 l-4,-7 l8,0 z" fill="#e8b84b"/>
<text x="210" y="196" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只写标志</text>
<text x="30" y="232" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">② rflags 的低 16 位（只画关键位）</text>
<rect x="30" y="246" width="30" height="40" rx="2" fill="#20202e" stroke="#67d9a0" stroke-width="1.4"/>
<text x="45.0" y="262" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="monospace">CF</text>
<text x="45.0" y="278" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="monospace">1</text>
<rect x="62" y="246" width="30" height="40" rx="2" fill="#181820" stroke="#3a3a52" stroke-width="0.8"/>
<rect x="94" y="246" width="30" height="40" rx="2" fill="#181820" stroke="#3a3a52" stroke-width="0.8"/>
<text x="109.0" y="262" fill="#3a3a52" font-size="9.5" text-anchor="middle" font-family="monospace">PF</text>
<text x="109.0" y="278" fill="#3a3a52" font-size="10" text-anchor="middle" font-family="monospace"></text>
<rect x="126" y="246" width="30" height="40" rx="2" fill="#181820" stroke="#3a3a52" stroke-width="0.8"/>
<rect x="158" y="246" width="30" height="40" rx="2" fill="#181820" stroke="#3a3a52" stroke-width="0.8"/>
<text x="173.0" y="262" fill="#3a3a52" font-size="9.5" text-anchor="middle" font-family="monospace">AF</text>
<text x="173.0" y="278" fill="#3a3a52" font-size="10" text-anchor="middle" font-family="monospace"></text>
<rect x="190" y="246" width="30" height="40" rx="2" fill="#181820" stroke="#3a3a52" stroke-width="0.8"/>
<rect x="222" y="246" width="30" height="40" rx="2" fill="#20202e" stroke="#e8b84b" stroke-width="1.4"/>
<text x="237.0" y="262" fill="#e8b84b" font-size="9.5" text-anchor="middle" font-family="monospace">ZF</text>
<text x="237.0" y="278" fill="#e8b84b" font-size="10" text-anchor="middle" font-family="monospace">0</text>
<rect x="254" y="246" width="30" height="40" rx="2" fill="#20202e" stroke="#67b5ef" stroke-width="1.4"/>
<text x="269.0" y="262" fill="#67b5ef" font-size="9.5" text-anchor="middle" font-family="monospace">SF</text>
<text x="269.0" y="278" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="monospace">1</text>
<rect x="286" y="246" width="30" height="40" rx="2" fill="#181820" stroke="#3a3a52" stroke-width="0.8"/>
<rect x="318" y="246" width="30" height="40" rx="2" fill="#181820" stroke="#3a3a52" stroke-width="0.8"/>
<rect x="350" y="246" width="30" height="40" rx="2" fill="#181820" stroke="#3a3a52" stroke-width="0.8"/>
<rect x="382" y="246" width="30" height="40" rx="2" fill="#20202e" stroke="#e87a8a" stroke-width="1.4"/>
<text x="397.0" y="262" fill="#e87a8a" font-size="9.5" text-anchor="middle" font-family="monospace">OF</text>
<text x="397.0" y="278" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="monospace">0</text>
<text x="30" y="306" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">本次 5 − 7 = −2：结果非零 → ZF=0；结果为负 → SF=1；</text>
<text x="30" y="324" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">无符号看 5−7 借了位 → CF=1；有符号没溢出 → OF=0。</text>
<text x="520" y="84" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">③ jcc 只看标志，不算数</text>
<rect x="520" y="108" width="356" height="36" rx="3" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<rect x="520" y="108" width="4" height="36" rx="0" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="536" y="131" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="monospace">jl  less</text>
<text x="668" y="131" fill="#67b5ef" font-size="10" text-anchor="start" font-family="monospace">SF ≠ OF</text>
<text x="756" y="131" fill="#7a7a94" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有符号：5 &lt; 7 → 跳</text>
<rect x="520" y="152" width="356" height="36" rx="3" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<rect x="520" y="152" width="4" height="36" rx="0" fill="#67d9a0" stroke="none" stroke-width="1.5"/>
<text x="536" y="175" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="monospace">jb  below</text>
<text x="668" y="175" fill="#67d9a0" font-size="10" text-anchor="start" font-family="monospace">CF = 1</text>
<text x="756" y="175" fill="#7a7a94" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">无符号：5 &lt; 7 → 跳</text>
<rect x="520" y="196" width="356" height="36" rx="3" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<rect x="520" y="196" width="4" height="36" rx="0" fill="#e8b84b" stroke="none" stroke-width="1.5"/>
<text x="536" y="219" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="monospace">je  equal</text>
<text x="668" y="219" fill="#e8b84b" font-size="10" text-anchor="start" font-family="monospace">ZF = 1</text>
<text x="756" y="219" fill="#7a7a94" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">相等才跳 → 不跳</text>
<rect x="520" y="240" width="356" height="36" rx="3" fill="#181822" stroke="#3a3a52" stroke-width="1.0"/>
<rect x="520" y="240" width="4" height="36" rx="0" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="536" y="263" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="monospace">jns  notsign</text>
<text x="668" y="263" fill="#67b5ef" font-size="10" text-anchor="start" font-family="monospace">SF = 0</text>
<text x="756" y="263" fill="#7a7a94" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结果非负才跳 → 不跳</text>
<text x="520" y="300" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">四条指令读同一组标志，得出各自不同的结论。</text>
<text x="520" y="318" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这就是为什么「比较」不需要单独的比较器。</text>
<path d="M414,266 L508,266 L508,126 L520,126" fill="none" stroke="#3a3a52" stroke-width="1.1" stroke-dasharray="4 4"/>
<text x="24" y="390" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">标志位是一种隐式的全局中间结果：任何一条算术指令都会覆盖它。所以编译器总把「比较」和「跳转」紧挨着放。</text>
</svg>
