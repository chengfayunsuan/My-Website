<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="432" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.1-2  金本位的自动调节：逆差会自己修好自己</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">休谟 1752 年提出的价格-铸币流动机制。金本位能撑一百年，全靠这个闭环</text>
<line x1="250" y1="128" x2="331" y2="128" stroke="#55557a" stroke-width="1.6"/>
<path d="M340,128 L329,123 L329,133 Z" fill="#55557a" stroke="#55557a" stroke-width="1"/>
<line x1="540" y1="128" x2="621" y2="128" stroke="#55557a" stroke-width="1.6"/>
<path d="M630,128 L619,123 L619,133 Z" fill="#55557a" stroke="#55557a" stroke-width="1"/>
<line x1="630" y1="292" x2="531" y2="292" stroke="#55557a" stroke-width="1.6"/>
<path d="M540,292 L551,287 L551,297 Z" fill="#55557a" stroke="#55557a" stroke-width="1"/>
<line x1="340" y1="292" x2="241" y2="292" stroke="#55557a" stroke-width="1.6"/>
<path d="M250,292 L261,287 L261,297 Z" fill="#55557a" stroke="#55557a" stroke-width="1"/>
<line x1="150" y1="263" x2="150" y2="168" stroke="#55557a" stroke-width="1.6"/>
<path d="M150,159 L145,170 L155,170 Z" fill="#55557a" stroke="#55557a" stroke-width="1"/>
<rect x="50.0" y="99.0" width="200" height="58" rx="4" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="150" y="124" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">贸易逆差</text>
<text x="150" y="143" fill="#7f7f98" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">进口 > 出口，黄金要付出去</text>
<rect x="340.0" y="99.0" width="200" height="58" rx="4" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="440" y="124" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">黄金外流</text>
<text x="440" y="143" fill="#7f7f98" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">本国的金币和黄金减少</text>
<rect x="630.0" y="99.0" width="200" height="58" rx="4" fill="#16161f" stroke="#e8965a" stroke-width="1.5"/>
<text x="730" y="124" fill="#e8965a" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">货币变少</text>
<text x="730" y="143" fill="#7f7f98" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能花的钱少了</text>
<rect x="630.0" y="263.0" width="200" height="58" rx="4" fill="#16161f" stroke="#e87a8a" stroke-width="1.5"/>
<text x="730" y="288" fill="#e87a8a" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">物价下跌</text>
<text x="730" y="307" fill="#7f7f98" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">东西卖不上价</text>
<rect x="340.0" y="263.0" width="200" height="58" rx="4" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="440" y="288" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">出口回升</text>
<text x="440" y="307" fill="#7f7f98" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">外国人来买，逆差收窄</text>
<rect x="50.0" y="263.0" width="200" height="58" rx="4" fill="#16161f" stroke="#b58ae8" stroke-width="1.5"/>
<text x="150" y="288" fill="#b58ae8" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">回到平衡</text>
<text x="150" y="307" fill="#7f7f98" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">金子慢慢流回来</text>
<text x="440" y="204" fill="#b8bccd" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱少了，东西就得便宜</text>
<text x="440" y="224" fill="#6f6f88" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这一环是整套机制的枢纽</text>
<text x="40" y="366" fill="#a0a0b8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键在那一步「物价下跌」：钱少了，东西就得降价；降价之后本国货在国际上更有竞争力，逆差自动收窄。</text>
<text x="40" y="390" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以金本位时代没有「货币政策」这个概念 —— 汇率和物价都是黄金说了算，政府能做的事情很少。</text>
<text x="40" y="414" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这也是它后来撑不住的原因：经济要增长，黄金不会跟着长。</text>
</svg>
