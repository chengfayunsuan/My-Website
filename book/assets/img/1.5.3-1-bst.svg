<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.5.3-1  二叉搜索树：同一批 7 个 key，两种形状</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每个节点只比一次：比它小往左、比它大往右。但树长成什么样，全由插入顺序决定</text>
<line x1="200" y1="112" x2="132" y2="190" stroke="#3a3a52" stroke-width="1.4"/>
<line x1="200" y1="112" x2="268" y2="190" stroke="#e8b84b" stroke-width="2.2"/>
<line x1="132" y1="190" x2="92" y2="268" stroke="#3a3a52" stroke-width="1.4"/>
<line x1="132" y1="190" x2="172" y2="268" stroke="#3a3a52" stroke-width="1.4"/>
<line x1="268" y1="190" x2="228" y2="268" stroke="#3a3a52" stroke-width="1.4"/>
<line x1="268" y1="190" x2="308" y2="268" stroke="#e8b84b" stroke-width="2.2"/>
<circle cx="200" cy="112" r="18" fill="#2a2214" stroke="#e8b84b" stroke-width="1.6"/>
<text x="200" y="117" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="monospace">4</text>
<circle cx="132" cy="190" r="18" fill="#1a1a26" stroke="#8a8aa0" stroke-width="1.6"/>
<text x="132" y="195" fill="#d8d8e4" font-size="12.5" text-anchor="middle" font-family="monospace">2</text>
<circle cx="268" cy="190" r="18" fill="#2a2214" stroke="#e8b84b" stroke-width="1.6"/>
<text x="268" y="195" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="monospace">6</text>
<circle cx="92" cy="268" r="18" fill="#1a1a26" stroke="#8a8aa0" stroke-width="1.6"/>
<text x="92" y="273" fill="#d8d8e4" font-size="12.5" text-anchor="middle" font-family="monospace">1</text>
<circle cx="172" cy="268" r="18" fill="#1a1a26" stroke="#8a8aa0" stroke-width="1.6"/>
<text x="172" y="273" fill="#d8d8e4" font-size="12.5" text-anchor="middle" font-family="monospace">3</text>
<circle cx="228" cy="268" r="18" fill="#1a1a26" stroke="#8a8aa0" stroke-width="1.6"/>
<text x="228" y="273" fill="#d8d8e4" font-size="12.5" text-anchor="middle" font-family="monospace">5</text>
<circle cx="308" cy="268" r="18" fill="#2a2214" stroke="#e8b84b" stroke-width="1.6"/>
<text x="308" y="273" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="monospace">7</text>
<line x1="452" y1="92" x2="452" y2="340" stroke="#2a2a3e" stroke-width="1" stroke-dasharray="4 6"/>
<text x="200" y="330" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">随机插入 4 2 6 1 3 5 7</text>
<text x="200" y="354" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">找 7：4 → 6 → 7，3 次比较</text>
<line x1="650" y1="111" x2="650" y2="115" stroke="#3a3a52" stroke-width="1.3"/>
<line x1="650" y1="145" x2="650" y2="149" stroke="#3a3a52" stroke-width="1.3"/>
<line x1="650" y1="179" x2="650" y2="183" stroke="#3a3a52" stroke-width="1.3"/>
<line x1="650" y1="213" x2="650" y2="217" stroke="#3a3a52" stroke-width="1.3"/>
<line x1="650" y1="247" x2="650" y2="251" stroke="#3a3a52" stroke-width="1.3"/>
<line x1="650" y1="281" x2="650" y2="285" stroke="#3a3a52" stroke-width="1.3"/>
<line x1="650" y1="315" x2="650" y2="319" stroke="#3a3a52" stroke-width="1.3"/>
<circle cx="650" cy="96" r="15" fill="#2a1418" stroke="#8a4a56" stroke-width="1.6"/>
<text x="650" y="101" fill="#e0a0aa" font-size="12.5" text-anchor="middle" font-family="monospace">1</text>
<circle cx="650" cy="130" r="15" fill="#2a1418" stroke="#8a4a56" stroke-width="1.6"/>
<text x="650" y="135" fill="#e0a0aa" font-size="12.5" text-anchor="middle" font-family="monospace">2</text>
<circle cx="650" cy="164" r="15" fill="#2a1418" stroke="#8a4a56" stroke-width="1.6"/>
<text x="650" y="169" fill="#e0a0aa" font-size="12.5" text-anchor="middle" font-family="monospace">3</text>
<circle cx="650" cy="198" r="15" fill="#2a1418" stroke="#8a4a56" stroke-width="1.6"/>
<text x="650" y="203" fill="#e0a0aa" font-size="12.5" text-anchor="middle" font-family="monospace">4</text>
<circle cx="650" cy="232" r="15" fill="#2a1418" stroke="#8a4a56" stroke-width="1.6"/>
<text x="650" y="237" fill="#e0a0aa" font-size="12.5" text-anchor="middle" font-family="monospace">5</text>
<circle cx="650" cy="266" r="15" fill="#2a1418" stroke="#8a4a56" stroke-width="1.6"/>
<text x="650" y="271" fill="#e0a0aa" font-size="12.5" text-anchor="middle" font-family="monospace">6</text>
<circle cx="650" cy="300" r="15" fill="#2a1418" stroke="#8a4a56" stroke-width="1.6"/>
<text x="650" y="305" fill="#e0a0aa" font-size="12.5" text-anchor="middle" font-family="monospace">7</text>
<text x="650" y="330" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">顺序插入 1 → 7</text>
<text x="650" y="354" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">高度 7，退化成一条链</text>
<text x="40" y="384" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">100 万条本来就有序的数据插进二叉搜索树，高度就是 100 万：查最末一个要比较 100 万次，和链表没区别。</text>
<text x="40" y="406" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">随机数据下平均高度约 1.39 log₂n（100 万条约 20 层）—— 但「平均」靠不住：一次批量导入、一个自增主键，就足以让它退化。</text>
<text x="40" y="428" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">平衡树（AVL、红黑树）用旋转把高度锁死在 O(log n)：代价是每次插入多花几次指针改写，读多写少时这笔账很划算。</text>
</svg>
