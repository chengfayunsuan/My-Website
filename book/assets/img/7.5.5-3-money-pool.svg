<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">扫码之后，钱在三个池子里过了一手</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的钱没有直接进商户的口袋，它先进了支付机构的备付金账户</text>
<defs><marker id="f1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#67b5ef"/></marker></defs><rect x="24" y="112" width="180" height="80" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="114" y="140" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你的账户</text>
<text x="114" y="162" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">余额 1000 → 900</text>
<text x="114" y="182" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">瞬间扣减，不可撤回</text>
<rect x="250" y="92" width="262" height="120" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="381" y="120" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">支付机构备付金账户</text>
<text x="381" y="144" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+100（全额集中存管在央行）</text>
<text x="381" y="166" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不能拿去放贷、投资、挪用</text>
<text x="381" y="188" fill="#e87a8a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这是监管划的红线</text>
<rect x="556" y="112" width="180" height="80" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="646" y="140" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">商户账户</text>
<text x="646" y="162" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+99.62（扣完手续费）</text>
<text x="646" y="182" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">到账后才是它的钱</text>
<line x1="206" y1="152" x2="246" y2="152" stroke="#67b5ef" stroke-width="2" marker-end="url(#f1)"/><line x1="514" y1="152" x2="552" y2="152" stroke="#67b5ef" stroke-width="2" marker-end="url(#f1)"/><text x="381" y="232" fill="#a0a0b8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 这一跳由网联/银联做转接清算，钱不会直接在你的银行和商户银行之间跑</text>
<rect x="24" y="252" width="712" height="120" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="44" y="278" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">为什么必须经过备付金这一层</text>
<text x="44" y="302" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 支付机构不是银行，不能直接开账户吸收存款，只能把钱托管在央行</text>
<text x="44" y="324" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 一百万用户各放 100 块，池子里就是一个亿——这笔钱必须看得见、动不了</text>
<text x="44" y="346" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 2017 年成立网联，就是要切断支付机构与银行直连，让每笔都有清算记录</text>
</svg>
