<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 362" width="880" height="362" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="362" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.2-1  放贷让资产和负债同时变大</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一笔 100 万的贷款，两栏各加 100 万。准备金那一格，一分没动</text>
<rect x="40" y="84" width="336" height="246" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="56" y="110" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">放贷前</text>
<text x="56" y="134" fill="#67b5ef" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">资产</text>
<text x="220" y="134" fill="#e87a8a" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">负债与权益</text>
<line x1="56" y1="142" x2="360" y2="142" stroke="#2f2f45" stroke-width="1"/>
<text x="56" y="168" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷款</text>
<text x="208" y="168" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">900 亿</text>
<text x="220" y="168" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款</text>
<text x="360" y="168" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">950 亿</text>
<text x="56" y="198" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">准备金</text>
<text x="208" y="198" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">60 亿</text>
<text x="220" y="198" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所有者权益</text>
<text x="360" y="198" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">50 亿</text>
<text x="56" y="228" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">债券及其他</text>
<text x="208" y="228" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">40 亿</text>
<text x="220" y="228" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<text x="56" y="258" fill="#e6e6f0" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">合计</text>
<text x="208" y="258" fill="#e6e6f0" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1000 亿</text>
<text x="220" y="258" fill="#e6e6f0" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600"></text>
<text x="360" y="258" fill="#e6e6f0" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1000 亿</text>
<text x="56" y="308" fill="#6f7f92" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产 1000 亿 = 负债 950 亿 + 权益 50 亿</text>
<rect x="504" y="84" width="336" height="246" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="520" y="110" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">放出一笔 100 万房贷后</text>
<text x="520" y="134" fill="#67b5ef" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">资产</text>
<text x="684" y="134" fill="#e87a8a" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">负债与权益</text>
<line x1="520" y1="142" x2="824" y2="142" stroke="#2f2f45" stroke-width="1"/>
<text x="520" y="168" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷款</text>
<text x="672" y="168" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">900.01 亿</text>
<text x="684" y="168" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款</text>
<text x="824" y="168" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">950.01 亿</text>
<text x="520" y="198" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">准备金</text>
<text x="672" y="198" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">60 亿</text>
<text x="684" y="198" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所有者权益</text>
<text x="824" y="198" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">50 亿</text>
<text x="520" y="228" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">债券及其他</text>
<text x="672" y="228" fill="#9aa8bc" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">40 亿</text>
<text x="684" y="228" fill="#9aa8bc" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<text x="520" y="258" fill="#e6e6f0" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">合计</text>
<text x="672" y="258" fill="#e6e6f0" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">1000.01 亿</text>
<text x="684" y="258" fill="#e6e6f0" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600"></text>
<text x="824" y="258" fill="#e6e6f0" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1000.01 亿</text>
<text x="520" y="308" fill="#6f7f92" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两边都变成 1000.01 亿，账还是平的</text>
<line x1="392" y1="176" x2="488" y2="176" stroke="#e8965a" stroke-width="1.8"/>
<path d="M488,170 L498,176 L488,182 Z" fill="#e8965a" stroke="#e8965a" stroke-width="1"/>
<text x="440" y="166" fill="#e8965a" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产 +100 万</text>
<line x1="392" y1="232" x2="488" y2="232" stroke="#e8965a" stroke-width="1.8"/>
<path d="M488,226 L498,232 L488,238 Z" fill="#e8965a" stroke="#e8965a" stroke-width="1"/>
<text x="440" y="222" fill="#e8965a" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">负债 +100 万</text>
<text x="440" y="206" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同时</text>
</svg>
