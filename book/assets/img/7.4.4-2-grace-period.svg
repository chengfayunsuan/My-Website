<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="300" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.4.4 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">免息期不是 30 天，最长可以到 50 天</text>
<line x1="70" y1="140" x2="810" y2="140" stroke="#3a3a52" stroke-width="2"/>
<line x1="200" y1="112" x2="200" y2="168" stroke="#67d9a0" stroke-width="2"/>
<text x="200" y="104" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">账单日 每月 5 日</text>
<line x1="660" y1="112" x2="660" y2="168" stroke="#e87a8a" stroke-width="2"/>
<text x="660" y="104" fill="#e87a8a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还款日 每月 25 日</text>
<rect x="200" y="124" width="460" height="32" rx="4" fill="#1b2430" stroke="#67d9a0" stroke-width="1.2"/>
<text x="430" y="145" fill="#a8e8c4" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这段是免息窗口：20 天</text>
<circle cx="240" cy="140" r="5" fill="#e8965a"/>
<text x="240" y="190" fill="#e8965a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">刚过账单日消费</text>
<text x="240" y="208" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 50 天后才还</text>
<circle cx="630" cy="140" r="5" fill="#b58ae8"/>
<text x="630" y="190" fill="#b58ae8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">账单日前一天消费</text>
<text x="630" y="208" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 20 天后就还</text>
<text x="40" y="250" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同样的卡、同样的额度，免息期长短只取决于你哪天刷。银行不提醒这件事，因为对它没好处。</text>
<text x="40" y="272" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">账单日之后那一天刷卡，是免息期最长的时候。</text>
</svg>
