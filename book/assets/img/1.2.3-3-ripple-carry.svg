<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="560" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">四位行波进位：进位像水波一样一格一格推过去</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">上：四个全加器串成链　下：进位信号不是同时到位，而是一个接一个爬起来</text>
<rect x="40" y="92" width="100" height="84" rx="5" fill="#16161f" stroke="#4a4a66" stroke-width="1.6"/>
<text x="90" y="126" fill="#c8c8dc" font-size="13" text-anchor="middle" font-family="monospace">FA0</text>
<text x="90" y="150" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="monospace">A0  B0</text>
