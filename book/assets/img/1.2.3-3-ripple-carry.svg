<text x="430" y="220" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="monospace">S2</text>
<rect x="550" y="92" width="100" height="84" rx="5" fill="#16161f" stroke="#4a4a66" stroke-width="1.6"/>
<text x="600" y="126" fill="#c8c8dc" font-size="13" text-anchor="middle" font-family="monospace">FA3</text>
<text x="600" y="150" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="monospace">A3  B3</text>
<path d="M578,74 L578,92" fill="none" stroke="#67b5ef" stroke-width="1.4"/>
<path d="M622,74 L622,92" fill="none" stroke="#e8b84b" stroke-width="1.4"/>
