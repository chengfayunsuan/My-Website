<path d="M8,134 L40,134" fill="none" stroke="#e87a8a" stroke-width="2"/>
<text x="8" y="124" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="monospace">C0</text>
<path d="M140,134 L210,134" fill="none" stroke="#e87a8a" stroke-width="2"/>
<text x="175" y="126" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="monospace">C1</text>
<path d="M310,134 L380,134" fill="none" stroke="#e87a8a" stroke-width="2"/>
<text x="345" y="126" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="monospace">C2</text>
<path d="M480,134 L550,134" fill="none" stroke="#e87a8a" stroke-width="2"/>
<text x="515" y="126" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="monospace">C3</text>
<path d="M650,134 L700,134" fill="none" stroke="#e87a8a" stroke-width="2"/>
