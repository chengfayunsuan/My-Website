<text x="260" y="150" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="monospace">A1  B1</text>
<path d="M238,74 L238,92" fill="none" stroke="#67b5ef" stroke-width="1.4"/>
<path d="M282,74 L282,92" fill="none" stroke="#e8b84b" stroke-width="1.4"/>
<path d="M260,176 L260,204" fill="none" stroke="#67d9a0" stroke-width="1.6"/>
<text x="260" y="220" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="monospace">S1</text>
<rect x="380" y="92" width="100" height="84" rx="5" fill="#16161f" stroke="#4a4a66" stroke-width="1.6"/>
<text x="430" y="126" fill="#c8c8dc" font-size="13" text-anchor="middle" font-family="monospace">FA2</text>
<text x="430" y="150" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="monospace">A2  B2</text>
<path d="M408,74 L408,92" fill="none" stroke="#67b5ef" stroke-width="1.4"/>
