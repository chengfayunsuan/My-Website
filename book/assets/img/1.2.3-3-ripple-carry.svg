<text x="700" y="150" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">溢出</text>
<text x="24" y="272" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">进位信号随时间爬升（横轴是时间，不是位置）</text>
<text x="44" y="329" fill="#e87a8a" font-size="11" text-anchor="start" font-family="monospace">C1</text>
<line x1="90" y1="338" x2="706" y2="338" stroke="#2a2a3e" stroke-width="1"/>
<path d="M90,338 L200,338 L200,304 L706,304" fill="none" stroke="#e8965a" stroke-width="2"/>
<text x="206" y="298" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">↑ 1 级</text>
<text x="44" y="377" fill="#e87a8a" font-size="11" text-anchor="start" font-family="monospace">C2</text>
<line x1="90" y1="386" x2="706" y2="386" stroke="#2a2a3e" stroke-width="1"/>
<path d="M90,386 L310,386 L310,352 L706,352" fill="none" stroke="#e8965a" stroke-width="2"/>
<text x="316" y="346" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">↑ 2 级</text>
<text x="44" y="425" fill="#e87a8a" font-size="11" text-anchor="start" font-family="monospace">C3</text>
<line x1="90" y1="434" x2="706" y2="434" stroke="#2a2a3e" stroke-width="1"/>
<path d="M90,434 L420,434 L420,400 L706,400" fill="none" stroke="#e8965a" stroke-width="2"/>
<text x="426" y="394" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">↑ 3 级</text>
<text x="44" y="473" fill="#e87a8a" font-size="11" text-anchor="start" font-family="monospace">C4</text>
<line x1="90" y1="482" x2="706" y2="482" stroke="#2a2a3e" stroke-width="1"/>
<path d="M90,482 L530,482 L530,448 L706,448" fill="none" stroke="#e8965a" stroke-width="2"/>
<text x="536" y="442" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">↑ 4 级</text>
<line x1="200" y1="308" x2="200" y2="482" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="310" y1="308" x2="310" y2="482" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="420" y1="308" x2="420" y2="482" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="530" y1="308" x2="530" y2="482" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="90" y1="506" x2="706" y2="506" stroke="#3a3a52" stroke-width="1"/>
<text x="90" y="522" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">t = 0</text>
<text x="706" y="522" fill="#7a7a94" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">时间 →</text>
<text x="24" y="548" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每级进位要穿过两道门；n 位最坏要 2n 级。32 位就是 64 级，远超一个时钟周期。</text>
</svg>
