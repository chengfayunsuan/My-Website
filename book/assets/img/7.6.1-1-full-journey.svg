<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="820" height="450" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">100 元走完全程：八个节点，串起整整一部</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从上到下依次是 7.1 钱有几种、7.4 卡、7.5 支付与清算</text>
<defs><marker id="g1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#8a8aa0"/></marker></defs><rect x="30" y="88" width="178" height="92" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="44" y="114" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">① 工资到账 8000</text>
<text x="44" y="138" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行账本上多了一行负债</text>
<text x="196" y="170" fill="#6a6a80" font-size="9.5" text-anchor="end" font-family="monospace">7.1 / 7.2</text>
<line x1="210" y1="134.0" x2="224" y2="134.0" stroke="#8a8aa0" stroke-width="2" marker-end="url(#g1)"/><rect x="228" y="88" width="178" height="92" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="242" y="114" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">② 刷卡 100</text>
<text x="242" y="138" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">POS 打包卡号、金额、动态码</text>
<text x="394" y="170" fill="#6a6a80" font-size="9.5" text-anchor="end" font-family="monospace">7.4</text>
<line x1="408" y1="134.0" x2="422" y2="134.0" stroke="#8a8aa0" stroke-width="2" marker-end="url(#g1)"/><rect x="426" y="88" width="178" height="92" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="440" y="114" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">③ 授权通过</text>
<text x="440" y="138" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">冻结 100，钱一动没动</text>
<text x="592" y="170" fill="#6a6a80" font-size="9.5" text-anchor="end" font-family="monospace">7.5.1</text>
<line x1="606" y1="134.0" x2="620" y2="134.0" stroke="#8a8aa0" stroke-width="2" marker-end="url(#g1)"/><rect x="624" y="88" width="178" height="92" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="638" y="114" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">④ 日切 23:00</text>
<text x="638" y="138" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当天账目封口，之后算第二天</text>
<text x="790" y="170" fill="#6a6a80" font-size="9.5" text-anchor="end" font-family="monospace">7.5.2</text>
<rect x="624" y="258" width="178" height="92" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="638" y="284" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">⑤ 生成清算文件</text>
<text x="638" y="308" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">几千万笔压成一张表</text>
<text x="790" y="340" fill="#6a6a80" font-size="9.5" text-anchor="end" font-family="monospace">7.5.2</text>
<line x1="620" y1="304.0" x2="606" y2="304.0" stroke="#8a8aa0" stroke-width="2" marker-end="url(#g1)"/><rect x="426" y="258" width="178" height="92" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="440" y="284" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">⑥ 轧差</text>
<text x="440" y="308" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">各家应收应付相抵，只结净额</text>
<text x="592" y="340" fill="#6a6a80" font-size="9.5" text-anchor="end" font-family="monospace">7.5.2</text>
<line x1="422" y1="304.0" x2="408" y2="304.0" stroke="#8a8aa0" stroke-width="2" marker-end="url(#g1)"/><rect x="228" y="258" width="178" height="92" rx="6" fill="#16161f" stroke="#b58ae8" stroke-width="1.5"/>
<text x="242" y="284" fill="#b58ae8" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">⑦ 央行改两个数</text>
<text x="242" y="308" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">准备金账户上加加减减</text>
<text x="394" y="340" fill="#6a6a80" font-size="9.5" text-anchor="end" font-family="monospace">7.5.2</text>
<line x1="224" y1="304.0" x2="210" y2="304.0" stroke="#8a8aa0" stroke-width="2" marker-end="url(#g1)"/><rect x="30" y="258" width="178" height="92" rx="6" fill="#16161f" stroke="#b58ae8" stroke-width="1.5"/>
<text x="44" y="284" fill="#b58ae8" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">⑧ 商户到账 99.34</text>
<text x="44" y="308" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扣掉 0.66 元手续费</text>
<text x="196" y="340" fill="#6a6a80" font-size="9.5" text-anchor="end" font-family="monospace">7.5.3</text>
<path d="M713.0,182 L713.0,246" fill="none" stroke="#8a8aa0" stroke-width="2" marker-end="url(#g1)"/><text x="700" y="232" fill="#a0a0b8" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一笔钱，从「你是谁」变成「谁欠你」</text>
<rect x="30" y="376" width="760" height="54" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="50" y="400" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">八个节点里，只有 ⑦ 那一下动了真钱——其余全是记账、核对、等批次</text>
<text x="50" y="420" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这就是整套系统的设计哲学：把「动钱」压到最少，把「记账」做到最准</text>
</svg>
