<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="428" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.3-1  1974 年那笔交易：石油换安全，美元换石油</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是一份文件，是一组默契。它没有正式名字，但管了五十年</text>
<rect x="56" y="96" width="300" height="208" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.5"/>
<text x="80" y="130" fill="#67b5ef" font-size="15" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">美国</text>
<line x1="80" y1="146" x2="332" y2="146" stroke="#33334a" stroke-width="1"/>
<text x="80" y="178" fill="#9aa8bc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要：石油继续用美元计价</text>
<text x="80" y="208" fill="#9aa8bc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">给：安全保证、军售、技术</text>
<text x="80" y="238" fill="#9aa8bc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换：石油收入回流买美债</text>
<rect x="524" y="96" width="300" height="208" rx="5" fill="#2a2410" stroke="#e8b84b" stroke-width="1.5"/>
<text x="548" y="130" fill="#e8b84b" font-size="15" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">沙特</text>
<line x1="548" y1="146" x2="800" y2="146" stroke="#33334a" stroke-width="1"/>
<text x="548" y="178" fill="#a89a70" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要：政权安全、武器、保护</text>
<text x="548" y="208" fill="#a89a70" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">给：石油只用美元卖</text>
<text x="548" y="238" fill="#a89a70" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换：收入有地方投资</text>
<line x1="360" y1="172" x2="512" y2="172" stroke="#e8b84b" stroke-width="1.8"/>
<path d="M512,172 L524,172 L512,166 L512,178 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<text x="440" y="160" fill="#e8b84b" font-size="9.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">石油，只收美元</text>
<line x1="524" y1="232" x2="372" y2="232" stroke="#67b5ef" stroke-width="1.8"/>
<path d="M372,232 L360,232 L372,226 L372,238 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<text x="440" y="254" fill="#67b5ef" font-size="9.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">安全承诺、武器、技术</text>
<text x="40" y="348" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1974 年 6 月尼克松访问沙特，与费萨尔国王会谈；8 月，沙特货币局开始把石油收入大量投入美国国债。</text>
<text x="40" y="372" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这笔交易的精妙之处：它同时解决了两个问题 —— 美国不用担心石油断供，沙特不用担心政权被推翻，而美元找到了一个刚性的需求。</text>
<text x="40" y="396" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价写在后面五十年里：美国制造业外流，沙特没有产业，而全世界的石油买家都必须先赚到美元。</text>
</svg>
