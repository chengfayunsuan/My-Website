<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.3.2-2  取指：PC 的两种走法</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">顺序执行时它一直加 4；一跳转，已经取进来的指令就全作废</text>
<text x="24" y="84" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">顺序执行：PC 每拍加上指令长度</text>
<rect x="40" y="96" width="96" height="52" rx="3" fill="#1a1a28" stroke="#4a4a62" stroke-width="1.4"/>
<text x="88.0" y="114" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="monospace">0x1000</text>
<text x="88.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="monospace">add eax,ebx</text>
<line x1="138" y1="122.0" x2="146" y2="122.0" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M146,122.0 l-6,-3 l0,6 z" fill="#5a5a72"/>
<rect x="148" y="96" width="96" height="52" rx="3" fill="#1a1a28" stroke="#4a4a62" stroke-width="1.4"/>
<text x="196.0" y="114" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="monospace">0x1004</text>
<text x="196.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="monospace">sub ecx,edx</text>
<line x1="246" y1="122.0" x2="254" y2="122.0" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M254,122.0 l-6,-3 l0,6 z" fill="#5a5a72"/>
<rect x="256" y="96" width="96" height="52" rx="3" fill="#1a1a28" stroke="#e87a8a" stroke-width="1.4"/>
<text x="304.0" y="114" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="monospace">0x1008</text>
<text x="304.0" y="134" fill="#e87a8a" font-size="9.5" text-anchor="middle" font-family="monospace">jmp 0x2000</text>
<line x1="354" y1="122.0" x2="362" y2="122.0" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M362,122.0 l-6,-3 l0,6 z" fill="#5a5a72"/>
<rect x="364" y="96" width="96" height="52" rx="3" fill="#1a1a28" stroke="#4a4a62" stroke-width="1.4"/>
<text x="412.0" y="114" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="monospace">0x100C</text>
<text x="412.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="monospace">mov esi,1</text>
<line x1="462" y1="122.0" x2="470" y2="122.0" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M470,122.0 l-6,-3 l0,6 z" fill="#5a5a72"/>
<rect x="472" y="96" width="96" height="52" rx="3" fill="#1a1a28" stroke="#4a4a62" stroke-width="1.4"/>
<text x="520.0" y="114" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="monospace">0x1010</text>
<text x="520.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="monospace">cmp esi,10</text>
<line x1="570" y1="122.0" x2="578" y2="122.0" stroke="#5a5a72" stroke-width="1.4"/>
<path d="M578,122.0 l-6,-3 l0,6 z" fill="#5a5a72"/>
<rect x="580" y="96" width="96" height="52" rx="3" fill="#1a1a28" stroke="#4a4a62" stroke-width="1.4"/>
<text x="628.0" y="114" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="monospace">0x1014</text>
<text x="628.0" y="134" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="monospace">ret</text>
<text x="40" y="172" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="monospace">PC 的值：0x1000 → 0x1004 → 0x1008 → 0x100C → 0x1010 → 0x1014</text>
<text x="24" y="238" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">遇到 jmp：取指单元早就按顺序取下去，跳转一成立全部作废</text>
<rect x="40" y="250" width="96" height="52" rx="3" fill="#1a1a28" stroke="#4a4a62" stroke-width="1.4"/>
<text x="88.0" y="268" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="monospace">0x1000</text>
<text x="88.0" y="288" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="monospace">add eax,ebx</text>
<rect x="148" y="250" width="96" height="52" rx="3" fill="#1a1a28" stroke="#4a4a62" stroke-width="1.4"/>
<text x="196.0" y="268" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="monospace">0x1004</text>
<text x="196.0" y="288" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="monospace">sub ecx,edx</text>
<rect x="256" y="250" width="96" height="52" rx="3" fill="#1a1a28" stroke="#e87a8a" stroke-width="1.4"/>
<text x="304.0" y="268" fill="#5a5a72" font-size="8.5" text-anchor="middle" font-family="monospace">0x1008</text>
<text x="304.0" y="288" fill="#e87a8a" font-size="9.5" text-anchor="middle" font-family="monospace">jmp 0x2000</text>
<rect x="364" y="250" width="96" height="52" rx="3" fill="#141420" stroke="#33334a" stroke-width="1.4"/>
<text x="412.0" y="268" fill="#3a3a50" font-size="8.5" text-anchor="middle" font-family="monospace">0x100C</text>
<text x="412.0" y="288" fill="#3a3a50" font-size="9.5" text-anchor="middle" font-family="monospace">mov esi,1</text>
<path d="M372,294 L452,258" stroke="#e87a8a" stroke-width="1.1" opacity="0.45"/>
<rect x="472" y="250" width="96" height="52" rx="3" fill="#141420" stroke="#33334a" stroke-width="1.4"/>
<text x="520.0" y="268" fill="#3a3a50" font-size="8.5" text-anchor="middle" font-family="monospace">0x1010</text>
<text x="520.0" y="288" fill="#3a3a50" font-size="9.5" text-anchor="middle" font-family="monospace">cmp esi,10</text>
<path d="M480,294 L560,258" stroke="#e87a8a" stroke-width="1.1" opacity="0.45"/>
<rect x="580" y="250" width="96" height="52" rx="3" fill="#141420" stroke="#33334a" stroke-width="1.4"/>
<text x="628.0" y="268" fill="#3a3a50" font-size="8.5" text-anchor="middle" font-family="monospace">0x1014</text>
<text x="628.0" y="288" fill="#3a3a50" font-size="9.5" text-anchor="middle" font-family="monospace">ret</text>
<path d="M588,294 L668,258" stroke="#e87a8a" stroke-width="1.1" opacity="0.45"/>
<text x="526.0" y="374" fill="#e87a8a" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这三条已预取，作废</text>
<rect x="700" y="244" width="120" height="64" rx="4" fill="#1f2418" stroke="#67d9a0" stroke-width="1.6"/>
<text x="760" y="256" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="monospace">0x2000</text>
<text x="760" y="282" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">目标指令</text>
<path d="M304.0,306 C304.0,360 760,360 760,314" fill="none" stroke="#67d9a0" stroke-width="1.8" stroke-dasharray="6 4"/>
<path d="M760,314 l-4,-8 l8,0 z" fill="#67d9a0"/>
<text x="24" y="412" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">被清掉的不是三条指令那么简单：流水线有几个工位，就要清几下，每清一次都是一个时钟周期的损失。</text>
</svg>
