<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.7.2-3  冲突标记长什么样，怎么解决</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Git 不会替你选，它把两个版本都留在文件里，让你自己决定</text>
<text x="30" y="84" fill="#8a8aa2" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">冲突时文件里会变成这样</text>
<rect x="30" y="98" width="380" height="28" rx="2" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="42" y="117" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="monospace">int count = 0;</text>
<rect x="30" y="132" width="380" height="28" rx="2" fill="#2a1a20" stroke="#2e2e44" stroke-width="1"/>
<text x="42" y="151" fill="#e87a8a" font-size="8.6" text-anchor="start" font-family="monospace">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
<text x="420" y="151" fill="#6f6f88" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">冲突开始：下面的属于你</text>
<rect x="30" y="166" width="380" height="28" rx="2" fill="#16281c" stroke="#2e2e44" stroke-width="1"/>
<text x="42" y="185" fill="#67d9a0" font-size="8.6" text-anchor="start" font-family="monospace">if (count >= 0) {</text>
<text x="420" y="185" fill="#6f6f88" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的版本</text>
<rect x="30" y="200" width="380" height="28" rx="2" fill="#2a2410" stroke="#2e2e44" stroke-width="1"/>
<text x="42" y="219" fill="#f5d76e" font-size="8.6" text-anchor="start" font-family="monospace">=======</text>
<text x="420" y="219" fill="#6f6f88" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分隔线</text>
<rect x="30" y="234" width="380" height="28" rx="2" fill="#16202c" stroke="#2e2e44" stroke-width="1"/>
<text x="42" y="253" fill="#67b5ef" font-size="8.6" text-anchor="start" font-family="monospace">if (count > 0) {</text>
<text x="420" y="253" fill="#6f6f88" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对方的版本</text>
<rect x="30" y="268" width="380" height="28" rx="2" fill="#2a1a20" stroke="#2e2e44" stroke-width="1"/>
<text x="42" y="287" fill="#e87a8a" font-size="8.6" text-anchor="start" font-family="monospace">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/login</text>
<text x="420" y="287" fill="#6f6f88" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">冲突结束：下面是共同的部分</text>
<rect x="30" y="302" width="380" height="28" rx="2" fill="#14141e" stroke="#2e2e44" stroke-width="1"/>
<text x="42" y="321" fill="#8a8aa2" font-size="8.6" text-anchor="start" font-family="monospace">}</text>
<text x="30" y="372" fill="#8a8aa2" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">三种处理方式，选哪个取决于业务意图</text>
<rect x="30" y="388" width="264" height="56" rx="3" fill="#14141e" stroke="#67d9a0" stroke-width="1.2"/>
<text x="42" y="410" fill="#67d9a0" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">只留我的</text>
<text x="42" y="430" fill="#8a8aa2" font-size="8.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">删掉 ======= 到 &gt;&gt;&gt;&gt;&gt;&gt;&gt; 之间的内容</text>
<rect x="316" y="388" width="264" height="56" rx="3" fill="#14141e" stroke="#67b5ef" stroke-width="1.2"/>
<text x="328" y="410" fill="#67b5ef" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">只留他的</text>
<text x="328" y="430" fill="#8a8aa2" font-size="8.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">删掉 &lt;&lt;&lt;&lt;&lt;&lt;&lt; 到 ======= 之间的内容</text>
<rect x="602" y="388" width="264" height="56" rx="3" fill="#14141e" stroke="#e8b84b" stroke-width="1.2"/>
<text x="614" y="410" fill="#e8b84b" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">写第三种</text>
<text x="614" y="430" fill="#8a8aa2" font-size="8.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两边都不对？自己写一版，把标记全删</text>
<text x="30" y="462" fill="#7a7a92" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记住：三个标记（&lt;&lt;&lt;&lt;&lt;&lt;&lt;、=======、&gt;&gt;&gt;&gt;&gt;&gt;&gt;）必须全部删干净。留一个，文件就是语法错误的。</text>
</svg>
