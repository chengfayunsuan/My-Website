<svg xmlns="http://www.w3.org/2000/svg" width="880" height="286" viewBox="0 0 880 286" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="286" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.2 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款保险不是财政拨款，是银行自己凑的</text>
<rect x="40" y="96" width="220" height="100" rx="10" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="150" y="128" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所有吸收存款的银行</text>
<text x="150" y="152" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按存款规模交保费</text>
<text x="150" y="174" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费率很低，按年缴</text>
<path d="M266,146 L330,146" fill="none" stroke="#8a8aa0" stroke-width="1.7"/>
<path d="M330,140 L340,146 L330,152 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="348" y="96" width="200" height="100" rx="10" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="448" y="128" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款保险基金</text>
<text x="448" y="152" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一笔专门的钱</text>
<text x="448" y="174" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">由央行管理</text>
<path d="M554,146 L618,146" fill="none" stroke="#8a8aa0" stroke-width="1.7"/>
<path d="M618,140 L628,146 L618,152 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="636" y="96" width="210" height="100" rx="10" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="741" y="128" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">出险时赔给储户</text>
<text x="741" y="152" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">50 万以内全额</text>
<text x="741" y="174" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不用你申请</text>
<text x="40" y="236" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以你交的不是保费，银行交的才是。你只需要确认：你买的东西在不在「存款」这个类别里。</text>
<text x="40" y="262" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一家银行、同一个人、本息合计 50 万——三个条件缺一不可。</text>
</svg>
