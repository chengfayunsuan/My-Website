<line x1="274" y1="338" x2="274" y2="380" stroke="#4a4a62" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="336" y1="278" x2="336" y2="380" stroke="#4a4a62" stroke-width="1" stroke-dasharray="2 3"/>
<text x="24" y="404" fill="#9a9ab4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Mealy 在第 2 个 1 到来时就拉高；Moore 要等状态进 S2，慢一个周期。</text>
<text x="24" y="424" fill="#6a6a84" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">但 Moore 的输出只在时钟沿变化，干净；Mealy 的高电平宽度取决于输入能维持多久，中间还带着输入的毛刺。</text>
