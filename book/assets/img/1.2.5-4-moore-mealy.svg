<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">检测「连续两个 1」就报警 —— Moore 等状态，Mealy 直接看输入</text>
<text x="24" y="156" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CLK</text>
