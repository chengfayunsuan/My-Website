<svg xmlns="http://www.w3.org/2000/svg" width="880" height="386" viewBox="0 0 880 386" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="386" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.4 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三种能在手机上付的钱，三套完全不同的底子</text>
<rect x="24" y="88" width="272" height="244" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="160" y="118" fill="#e8965a" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">USDT</text>
<line x1="48" y1="134" x2="272" y2="134" stroke="#2a2a3e" stroke-width="1"/>
<text x="48" y="160" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· Tether 公司发行</text>
<text x="48" y="190" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 储备是美债和现金</text>
<text x="48" y="220" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 商户可以拒收</text>
<text x="48" y="250" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 没有利息</text>
<text x="48" y="280" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 境内交易属非法</text>
<rect x="306" y="88" width="272" height="244" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="442" y="118" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数字人民币</text>
<line x1="330" y1="134" x2="554" y2="134" stroke="#2a2a3e" stroke-width="1"/>
<text x="330" y="160" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 中国人民银行发行</text>
<text x="330" y="190" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 本身就是现金</text>
<text x="330" y="220" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 不能拒收</text>
<text x="330" y="250" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 没有利息</text>
<text x="330" y="280" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 合法</text>
<rect x="588" y="88" width="272" height="244" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="724" y="118" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">支付宝余额</text>
<line x1="612" y1="134" x2="836" y2="134" stroke="#2a2a3e" stroke-width="1"/>
<text x="612" y="160" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 支付机构记的账</text>
<text x="612" y="190" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 真钱存在央行备付金</text>
<text x="612" y="220" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 商户可以拒收</text>
<text x="612" y="250" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 没有利息</text>
<text x="612" y="280" fill="#b8b8cc" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 合法</text>
<text x="24" y="362" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">相同点：都能扫码、都实时到账、都不生息。不同点：谁欠你、出事谁负责、法律认不认。</text>
