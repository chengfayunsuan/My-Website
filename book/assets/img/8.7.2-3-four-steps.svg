<svg xmlns="http://www.w3.org/2000/svg" width="680" height="466" viewBox="0 0 680 466" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="466" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">把这件事落地，只要四步</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">顺序不能换：先知道有什么，才谈得上分类和申报</text>
<rect x="28" y="90" width="148" height="196" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<text x="44" y="116" fill="#67b5ef" font-size="10" text-anchor="start" font-family="monospace">01</text>
<text x="44" y="142" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">画数据地图</text>
<text x="44" y="172" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">谁收集、收什么</text>
<text x="44" y="196" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存在哪、流向哪</text>
<text x="44" y="220" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">包括所有第三方</text>
<rect x="190" y="90" width="148" height="196" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<text x="206" y="116" fill="#67d9a0" font-size="10" text-anchor="start" font-family="monospace">02</text>
<text x="206" y="142" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">分类分级</text>
<text x="206" y="172" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">个人信息 / 敏感</text>
<text x="206" y="196" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">重要数据要看目录</text>
<text x="206" y="220" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不确定就按高的算</text>
<rect x="352" y="90" width="148" height="196" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<text x="368" y="116" fill="#e8b84b" font-size="10" text-anchor="start" font-family="monospace">03</text>
<text x="368" y="142" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">选路径</text>
<text x="368" y="172" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">豁免 / 标准合同</text>
<text x="368" y="196" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">认证 / 安全评估</text>
<text x="368" y="220" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按人数和主体判断</text>
<rect x="514" y="90" width="148" height="196" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<text x="530" y="116" fill="#b58ae8" font-size="10" text-anchor="start" font-family="monospace">04</text>
<text x="530" y="142" fill="#b58ae8" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">留证据</text>
<text x="530" y="172" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">清单、合同、报告</text>
<text x="530" y="196" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">评估记录存 3 年</text>
<text x="530" y="220" fill="#c8c8dc" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">变更时同步更新</text>
<line x1="28" y1="310" x2="652" y2="310" stroke="#3a3a52" stroke-width="1"/>
<text x="340" y="336" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一步最费时间，也最能省钱：多数人是在这一步才发现自己漏算了三个出口。</text>
<rect x="28" y="356" width="304" height="86" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="28" y="356" width="4" height="86" rx="2" fill="#67d9a0" stroke="none" stroke-width="0"/>
<text x="46" y="380" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">小团队的现实选择</text>
<text x="46" y="398" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能不跨境就不跨境</text>
<text x="46" y="415" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">境内服务器 + 境内服务商</text>
<text x="46" y="432" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">省掉的是整套申报流程</text>
<rect x="346" y="356" width="304" height="86" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="346" y="356" width="4" height="86" rx="2" fill="#e8965a" stroke="none" stroke-width="0"/>
<text x="364" y="380" fill="#e8965a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">必须跨境时</text>
<text x="364" y="398" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">先算人数，再选路径</text>
<text x="364" y="415" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">标准合同比评估快得多</text>
<text x="364" y="432" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">别等被问才补材料</text>
</svg>
