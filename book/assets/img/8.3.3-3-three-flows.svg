<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="420" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">三流一致：合同、资金、发票必须对得上</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">税务稽查最先看的就是这三样能不能互相对上</text>
<polygon points="380,74 270.38,263.0 489.62,263.0" fill="none" stroke="#4a4a62" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="380" cy="74" r="60" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="380" y="68" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">合同流</text>
<text x="380" y="90" fill="#a0a0b8" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">谁签的 / 多少钱</text>
<circle cx="270.38" cy="263.0" r="60" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="270.38" y="257.0" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">资金流</text>
<text x="270.38" y="279.0" fill="#a0a0b8" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">谁付的 / 付多少</text>
<circle cx="489.62" cy="263.0" r="60" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="489.62" y="257.0" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">发票流</text>
<text x="489.62" y="279.0" fill="#a0a0b8" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">谁开的 / 开多少</text>
<circle cx="380" cy="200" r="46" fill="#12121a" stroke="#67d9a0" stroke-width="1.5"/>
<text x="380" y="198" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">同一笔</text>
<text x="380" y="215" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">业务</text>
<text x="380" y="382" fill="#e8965a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三者对不上，轻则进项转出补税，重则被认定为虚开</text>
<text x="380" y="402" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以别为了「凑票」去改合同——那等于自己造了一个假的证据链</text>
</svg>
