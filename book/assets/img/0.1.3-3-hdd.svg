<svg width="760" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="#0e0e16"/>
  <text x="24" y="28" fill="#9a9ab4" font-size="12.5" font-family="monospace">机械硬盘是唯一还有「会动的零件」的部件，所以它慢在机械上</text>

  <!-- ============ 左：俯视 ============ -->
  <rect x="22" y="46" width="386" height="398" rx="10" fill="#12121c" stroke="#2a2a44"/>
  <text x="42" y="74" fill="#d8d8e4" font-size="13">打开盖子的样子</text>

  <rect x="46" y="92" width="338" height="316" rx="8" fill="#15151f" stroke="#2a2a44"/>

  <!-- 盘片 -->
  <circle cx="200" cy="250" r="122" fill="#1b1b28" stroke="#3a3a58"/>
  <circle cx="200" cy="250" r="110" fill="none" stroke="#4a4a6a" stroke-width="0.8"/>
  <circle cx="200" cy="250" r="96" fill="none" stroke="#4a4a6a" stroke-width="0.8"/>
  <circle cx="200" cy="250" r="82" fill="none" stroke="#4a4a6a" stroke-width="0.8"/>
  <circle cx="200" cy="250" r="68" fill="none" stroke="#4a4a6a" stroke-width="0.8"/>

  <!-- 扇区楔形 -->
  <path d="M200 250 L 200 128 A 122 122 0 0 1 286 165 Z" fill="#2a2340" stroke="#9b4df0" stroke-width="1.2"/>
  <text x="238" y="150" fill="#9b4df0" font-size="9.5" text-anchor="middle">一段扇区</text>

  <!-- 主轴 -->
  <circle cx="200" cy="250" r="26" fill="#101018" stroke="#67b5ef" stroke-width="1.4"/>
  <circle cx="200" cy="250" r="8" fill="#67b5ef" opacity="0.5"/>
  <text x="200" y="296" fill="#67b5ef" font-size="10" text-anchor="middle">主轴电机</text>
  <text x="200" y="310" fill="#6b6b85" font-size="9" text-anchor="middle">7200 转/分</text>

  <!-- 磁头臂 -->
  <circle cx="352" cy="112" r="12" fill="#171725" stroke="#e8b84b" stroke-width="1.4"/>
  <line x1="352" y1="112" x2="288" y2="166" stroke="#e8b84b" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="286" cy="168" r="5" fill="#f0606a"/>
  <text x="300" y="104" fill="#e8b84b" font-size="10" text-anchor="middle">音圈电机</text>
  <text x="330" y="196" fill="#f0606a" font-size="10">磁头</text>
  <text x="330" y="210" fill="#6b6b85" font-size="9">悬浮几纳米</text>

  <!-- 盘片标注 -->
  <text x="60" y="120" fill="#9a9ab4" font-size="10">盘片（两面都镀磁层）</text>
  <line x1="120" y1="126" x2="140" y2="140" stroke="#4a4a6a" stroke-width="1"/>

  <text x="42" y="430" fill="#6b6b85" font-size="10">磁头不接触盘片：靠盘片旋转带起的气流托住，间隙比细菌还小。</text>

  <!-- ============ 右：13 毫秒花在哪 ============ -->
  <rect x="424" y="46" width="314" height="398" rx="10" fill="#12121c" stroke="#2a2a44"/>
  <text x="444" y="74" fill="#d8d8e4" font-size="13">一次 4 KB 随机读：约 13 毫秒</text>

  <!-- 轴 -->
  <line x1="452" y1="108" x2="452" y2="236" stroke="#2a2a44"/>
  <text x="452" y="100" fill="#6b6b85" font-size="9" text-anchor="middle">0</text>
  <text x="716" y="100" fill="#6b6b85" font-size="9" text-anchor="end">13ms</text>

  <!-- 堆叠条 -->
  <rect x="452" y="120" width="167" height="34" fill="#3a2b52" stroke="#9b4df0"/>
  <rect x="619" y="120" width="82" height="34" fill="#1f3a4a" stroke="#67b5ef"/>
  <line x1="701" y1="120" x2="701" y2="154" stroke="#4ec9a3" stroke-width="2"/>
  <line x1="452" y1="120" x2="452" y2="154" stroke="#9b4df0" stroke-width="2"/>

  <text x="535" y="142" fill="#cfc6ff" font-size="10" text-anchor="middle">寻道 8.5ms</text>
  <text x="660" y="142" fill="#9fd4f5" font-size="9.5" text-anchor="middle">旋转 4.2ms</text>

  <text x="452" y="176" fill="#4ec9a3" font-size="9">传输 0.03ms（细线）</text>
  <text x="452" y="192" fill="#6b6b85" font-size="9">13 毫秒里，真正在读数据的时间不到 0.3%</text>

  <!-- 对比条 -->
  <text x="452" y="232" fill="#9a9ab4" font-size="10.5">同样一次 4 KB 随机读</text>

  <rect x="452" y="244" width="2" height="26" fill="#4ec9a3"/>
  <text x="462" y="262" fill="#4ec9a3" font-size="10">SSD：约 0.08ms（画出来只有 2 像素）</text>

  <rect x="452" y="282" width="249" height="20" fill="#382830" stroke="#f0606a"/>
  <text x="576" y="296" fill="#f0b8bc" font-size="9.5" text-anchor="middle">内存：约 0.00008ms（0.08 微秒）</text>

  <text x="452" y="330" fill="#9a9ab4" font-size="10.5">换算成倍数：内存比机械硬盘快约 16 万倍。</text>
  <text x="452" y="348" fill="#9a9ab4" font-size="10.5">这也是为什么「加内存」比「换硬盘」更立竿见影。</text>

  <rect x="444" y="364" width="278" height="58" rx="8" fill="#171725" stroke="#2a2a44"/>
  <text x="458" y="384" fill="#e8b84b" font-size="10">7200 转/分 = 每秒 120 圈 = 一圈 8.3ms</text>
  <text x="458" y="402" fill="#6b6b85" font-size="9.5">平均要等半圈，所以「旋转延迟」固定是 4.2ms。</text>
  <text x="458" y="416" fill="#6b6b85" font-size="9.5">这个数由转速决定，跟你买多贵的硬盘无关。</text>
</svg>
