<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.2.4-6  亚稳态：概率小，但架不住次数多</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左：一次采样「还没恢复」的概率随留给它的时间指数下降　右：同样的时间换成 MTBF，涨得离谱</text>
