<text x="665.0" y="120.22000000000003" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3600 亿年</text>
<text x="665.0" y="392" fill="#8a8aa4" font-size="9.5" text-anchor="middle" font-family="monospace">3 ns</text>
<text x="582.0" y="410" fill="#8a8aa4" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">串几级触发器（每级多给一个周期）</text>
<text x="458" y="134" fill="#5a5a76" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">MTBF（平均多久崩一次）</text>
<text x="414" y="246" fill="#4a4a66" font-size="18" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→</text>
<line x1="24" y1="428" x2="736" y2="428" stroke="#2a2a3e" stroke-width="1"/>
<text x="24" y="450" fill="#9a9ab4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键在于：概率是指数的，而采样次数是线性的。所以「多等一个周期」这种便宜的代价，能换来十几个数量级的可靠度。</text>
<text x="24" y="472" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这就是为什么跨时钟域的信号必须过两级同步器 —— 它不是保险，是算出来的。</text>
</svg>
