<text x="24" y="400" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">斜线表示同一条指令逐级推进；竖列表示同一拍里同时工作的五个工位。</text>
<text x="24" y="418" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">填满要 4 拍、排空又要 4 拍，所以短程序拿不到满额加速比。</text>
