<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="430" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">延迟是一段一段加起来的</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">鼠标那一段很显眼，但显示器那一段才是真正的大头</text>

  <!-- 60Hz -->
  <text x="24" y="96" fill="#9a9ab4" font-size="9.5">60 Hz</text>
  <rect x="70" y="78" width="149" height="36" fill="#1b2740" stroke="#67b5ef"/>
  <text x="144" y="101" fill="#9fd4f5" font-size="9" text-anchor="middle">键盘 6</text>

  <rect x="219" y="78" width="87" height="36" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="262" y="101" fill="#cfc6ff" font-size="8.5" text-anchor="middle">系统 3.5</text>

  <rect x="306" y="78" width="198" height="36" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="405" y="101" fill="#cfc6ff" font-size="9" text-anchor="middle">渲染 8</text>

  <rect x="504" y="78" width="206" height="36" fill="#20303a" stroke="#4ec9a3"/>
  <text x="607" y="101" fill="#9fe0c9" font-size="9" text-anchor="middle">等刷新 8.3</text>

  <text x="716" y="101" fill="#e8b84b" font-size="9">25.8 ms</text>

  <!-- 144Hz -->
  <text x="24" y="156" fill="#9a9ab4" font-size="9.5">144 Hz</text>
  <rect x="70" y="138" width="149" height="36" fill="#1b2740" stroke="#67b5ef"/>
  <text x="144" y="161" fill="#9fd4f5" font-size="9" text-anchor="middle">键盘 6</text>

  <rect x="219" y="138" width="87" height="36" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="262" y="161" fill="#cfc6ff" font-size="8.5" text-anchor="middle">系统 3.5</text>

  <rect x="306" y="138" width="198" height="36" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="405" y="161" fill="#cfc6ff" font-size="9" text-anchor="middle">渲染 8</text>

  <rect x="504" y="138" width="87" height="36" fill="#20303a" stroke="#4ec9a3"/>
  <text x="547" y="161" fill="#9fe0c9" font-size="9" text-anchor="middle">3.5</text>

  <text x="597" y="161" fill="#e8b84b" font-size="9">21.0 ms</text>

  <!-- 240Hz -->
  <text x="24" y="216" fill="#9a9ab4" font-size="9.5">240 Hz</text>
  <rect x="70" y="198" width="149" height="36" fill="#1b2740" stroke="#67b5ef"/>
  <text x="144" y="221" fill="#9fd4f5" font-size="9" text-anchor="middle">键盘 6</text>

  <rect x="219" y="198" width="87" height="36" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="262" y="221" fill="#cfc6ff" font-size="8.5" text-anchor="middle">系统 3.5</text>

  <rect x="306" y="198" width="198" height="36" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="405" y="221" fill="#cfc6ff" font-size="9" text-anchor="middle">渲染 8</text>

  <rect x="504" y="198" width="52" height="36" fill="#20303a" stroke="#4ec9a3"/>
  <text x="530" y="221" fill="#9fe0c9" font-size="9" text-anchor="middle">2.1</text>

  <text x="562" y="221" fill="#e8b84b" font-size="9">19.6 ms</text>

  <!-- 说明 -->
  <line x1="24" y1="258" x2="736" y2="258" stroke="#2a2a44"/>
  <text x="24" y="280" fill="#6b6b85" font-size="8.5">键盘那 6 ms = 扫描 1 + 去抖 5；「系统 3.5」= USB 等待 0.5 + 系统与应用处理 3。</text>

  <text x="24" y="304" fill="#e8b84b" font-size="9.5">换显示器的收益，是换鼠标高回报率的十倍</text>
  <text x="24" y="324" fill="#9a9ab4" font-size="9">鼠标 1000 Hz → 8000 Hz，平均省 0.44 ms；60 Hz → 144 Hz，平均省 4.8 ms。</text>
  <text x="24" y="344" fill="#9a9ab4" font-size="9">所以预算有限时的顺序：先换高刷屏，再考虑高回报率鼠标。</text>

  <!-- 底部 -->
  <line x1="24" y1="368" x2="736" y2="368" stroke="#2a2a44"/>
  <text x="24" y="388" fill="#6b6b85" font-size="8.5">「渲染」取决于帧率：60 帧是 16.7 ms，144 帧是 6.9 ms。这里按 120 帧估的 8 ms。</text>
  <text x="24" y="406" fill="#6b6b85" font-size="8.5">还没算应用自己的处理——有些游戏会攒一帧再处理，那就再多 8 到 16 ms。</text>
  <text x="24" y="426" fill="#e8b84b" font-size="9">所以「我的显示器 1 ms」和「我的操作延迟 1 ms」是两件完全不同的事。</text>
</svg>
