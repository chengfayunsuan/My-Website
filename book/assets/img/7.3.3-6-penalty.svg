<svg width="880" height="366" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="366" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">卖一张卡，惩戒从认定那天开始</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这个名单不进征信报告，但比征信记录更直接地锁住你的钱。</text>
<line x1="96" y1="96" x2="96" y2="326" stroke="#5a5a7a" stroke-width="2"/>
<circle cx="96" cy="103" r="5" fill="#0e0e16" stroke="#e87a8a" stroke-width="2"/>
<text x="116" y="106" fill="#e87a8a" font-size="13.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">名下卡涉案</text>
<text x="116" y="126" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">公安认定你出租、出借、出售了账户</text>
<circle cx="96" cy="175" r="5" fill="#0e0e16" stroke="#67b5ef" stroke-width="2"/>
<text x="116" y="178" fill="#67b5ef" font-size="13.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">全部账户受限</text>
<text x="116" y="198" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5 年内暂停名下所有账户的非柜面业务：</text>
<text x="116" y="217" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">手机银行、扫码、ATM 全停，只能去柜台</text>
<circle cx="96" cy="247" r="5" fill="#0e0e16" stroke="#e8b84b" stroke-width="2"/>
<text x="116" y="250" fill="#e8b84b" font-size="13.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">禁止新开户</text>
<text x="116" y="270" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3 年内所有银行不得为你新开账户</text>
<circle cx="96" cy="319" r="5" fill="#0e0e16" stroke="#b58ae8" stroke-width="2"/>
<text x="116" y="322" fill="#b58ae8" font-size="13.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">刑事风险</text>
<text x="116" y="342" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">明知他人利用信息网络犯罪仍提供账户，</text>
<text x="116" y="361" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可能构成帮信罪，最高三年有期徒刑</text>
<text x="560" y="176" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">惩戒名单由人民银行下发，</text>
<text x="560" y="198" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全行业共享——换一家银行没用。</text>
<text x="560" y="228" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">唯一出口：配合公安调查，</text>
<text x="560" y="250" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">确认无责才可能提前解除。</text>
</svg>
