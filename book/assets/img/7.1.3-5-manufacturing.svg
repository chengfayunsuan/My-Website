<text x="90" y="146.0" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">20%</text>
<line x1="100" y1="96.0" x2="806" y2="96.0" stroke="#242434" stroke-width="1"/>
<text x="90" y="100.0" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">25%</text>
<line x1="100.0" y1="326" x2="100.0" y2="331" stroke="#3a3a52" stroke-width="1"/>
<text x="100.0" y="346" fill="#6f6f88" font-size="9" text-anchor="middle" font-family="monospace">1970</text>
<line x1="230.74074074074073" y1="326" x2="230.74074074074073" y2="331" stroke="#3a3a52" stroke-width="1"/>
<text x="230.74074074074073" y="346" fill="#6f6f88" font-size="9" text-anchor="middle" font-family="monospace">1980</text>
