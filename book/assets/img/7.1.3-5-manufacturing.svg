<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.3-5  同一件事的另一面：美国制造业占 GDP 的比重</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从 1970 年的 22% 掉到 2024 年的 11% 左右。这条线和贸易逆差是同一枚硬币的两面</text>
