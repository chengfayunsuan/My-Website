<line x1="492.22222222222223" y1="326" x2="492.22222222222223" y2="331" stroke="#3a3a52" stroke-width="1"/>
<text x="492.22222222222223" y="346" fill="#6f6f88" font-size="9" text-anchor="middle" font-family="monospace">2000</text>
