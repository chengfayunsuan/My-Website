<text x="90" y="284.0" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">5%</text>
<line x1="100" y1="234.0" x2="806" y2="234.0" stroke="#242434" stroke-width="1"/>
<text x="90" y="238.0" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">10%</text>
<line x1="100" y1="188.0" x2="806" y2="188.0" stroke="#242434" stroke-width="1"/>
<text x="90" y="192.0" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">15%</text>
