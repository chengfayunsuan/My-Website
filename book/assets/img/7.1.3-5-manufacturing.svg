<circle cx="230.74074074074073" cy="142.0" r="3.6" fill="#e8965a"/>
<circle cx="361.48148148148147" cy="172.36" r="3.6" fill="#e8965a"/>
<circle cx="492.22222222222223" cy="195.36" r="3.6" fill="#e8965a"/>
<circle cx="622.9629629629629" cy="216.51999999999998" r="3.6" fill="#e8965a"/>
<circle cx="806.0" cy="226.64" r="3.6" fill="#e8965a"/>
<text x="110.0" y="106.84" fill="#e8965a" font-size="11" text-anchor="start" font-family="monospace">22%</text>
<text x="800.0" y="212.64" fill="#e8965a" font-size="11" text-anchor="end" font-family="monospace">11%</text>
<text x="439.9259259259259" y="137.4" fill="#a08868" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">去掉的这 11 个百分点</text>
<text x="439.9259259259259" y="154.4" fill="#8a7a68" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">去了金融、保险、房地产</text>
<text x="40" y="382" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这不是「美国不造东西了」，是「造东西的环节搬走了」：设计、品牌、金融留在国内，组装、零件、生产搬到了亚洲。</text>
<text x="40" y="406" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价是中西部城市空心化、蓝领工资停滞 —— 这部分人后来成了贸易战和「把工作拿回来」的政治基础。</text>
</svg>
