<line x1="200" y1="72" x2="226" y2="72" stroke="#5aa9e6" stroke-width="2.2"/>
<text x="234" y="76" fill="#5aa9e6" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">f = 10%</text>
<line x1="292" y1="72" x2="318" y2="72" stroke="#f0a44a" stroke-width="2.2"/>
<text x="326" y="76" fill="#f0a44a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">f = 20%</text>
<line x1="384" y1="72" x2="410" y2="72" stroke="#f06a7a" stroke-width="2.2"/>
<text x="418" y="76" fill="#f06a7a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">f = 30%</text>
<line x1="161.0" y1="96" x2="161.0" y2="336" stroke="#67d9a0" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="167.0" y="110" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">m = 5%：预测器 95% 准</text>
<circle cx="161.0" cy="310.2857142857143" r="3.5" fill="#f0a44a"/>
<text x="151.0" y="298.2857142857143" fill="#f0a44a" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0.15 拍</text>
<rect x="656" y="96" width="224" height="92" rx="4" fill="#171722" stroke="#3a3a52" stroke-width="1.2"/>
<text x="668" y="118" fill="#9a9ab4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CPI 增量</text>
<text x="668" y="140" fill="#e0d060" font-size="12" text-anchor="start" font-family="monospace">= f × m × p</text>
<text x="668" y="162" fill="#7a7a94" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">f 分支比例，m 猜错率</text>
<text x="668" y="178" fill="#7a7a94" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">p 猜错惩罚（本例 15 拍）</text>
<rect x="656" y="200" width="224" height="136" rx="4" fill="#171722" stroke="#3a3a52" stroke-width="1.2"/>
<text x="668" y="222" fill="#e0d060" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么这 0.15 拍很致命</text>
<text x="668" y="246" fill="#9a9ab4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">四发射的理想 CPI 是 0.25</text>
<text x="668" y="264" fill="#9a9ab4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">加上 0.15 变成 0.40</text>
<text x="668" y="282" fill="#f06a7a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">性能掉近四成</text>
<text x="668" y="308" fill="#9a9ab4" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">预测器只有 80% 准时：</text>
<text x="668" y="326" fill="#f06a7a" font-size="9.5" text-anchor="start" font-family="monospace">0.20 × 0.20 × 15 = 0.60 拍</text>
<text x="24" y="388" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">曲线越陡，说明预测器的准确率越值钱：f 越大、p 越深，同一个 m 的代价就成倍放大。</text>
<text x="24" y="406" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">深流水线（p = 20 拍以上）之所以对预测器要求极高，原因就在这个乘式里。</text>
</svg>
