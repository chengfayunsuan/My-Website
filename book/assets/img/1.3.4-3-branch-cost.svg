<line x1="486.00000000000006" y1="96" x2="486.00000000000006" y2="336" stroke="#242434" stroke-width="1" stroke-dasharray="2 4"/>
<text x="486.00000000000006" y="354" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">30%</text>
<line x1="616.0" y1="96" x2="616.0" y2="336" stroke="#242434" stroke-width="1" stroke-dasharray="2 4"/>
<text x="616.0" y="354" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">40%</text>
<line x1="96" y1="96" x2="96" y2="336" stroke="#8a8aa0" stroke-width="1.5"/>
<line x1="96" y1="336" x2="616" y2="336" stroke="#8a8aa0" stroke-width="1.5"/>
<text x="356.0" y="376" fill="#8a8aa4" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分支预测错误率 m</text>
<text x="50" y="80" fill="#8a8aa4" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CPI 增量（拍/指令）</text>
