<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.3.4-3  分支猜错要付多少：三条曲线看清代价</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CPI 增量 = 分支比例 f × 猜错率 m × 惩罚 p，这里固定 p = 15 拍</text>
