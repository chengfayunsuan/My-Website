<text x="86" y="134.28571428571425" fill="#5f5f78" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1.2</text>
<line x1="96" y1="95.99999999999994" x2="616" y2="95.99999999999994" stroke="#242434" stroke-width="1"/>
<text x="86" y="99.99999999999994" fill="#5f5f78" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1.4</text>
<line x1="96.0" y1="96" x2="96.0" y2="336" stroke="#242434" stroke-width="1" stroke-dasharray="2 4"/>
<text x="96.0" y="354" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0%</text>
<line x1="226.0" y1="96" x2="226.0" y2="336" stroke="#242434" stroke-width="1" stroke-dasharray="2 4"/>
