<svg width="760" height="430" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="l1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,1.2 L8,4.5 L0,7.8 z" fill="#e8b84b"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">三层编码：一个键，三个身份</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">分开的好处是：换布局、装输入法、写游戏，各管各的</text>

  <!-- 第一层 -->
  <rect x="40" y="76" width="666" height="74" rx="7" fill="#171725" stroke="#67b5ef"/>
  <text x="58" y="98" fill="#9fd4f5" font-size="10">物理层</text>
  <text x="58" y="116" fill="#6b6b85" font-size="8">键盘主控</text>
  <text x="58" y="134" fill="#6b6b85" font-size="8">「哪个位置的开关」</text>

  <rect x="160" y="90" width="150" height="46" rx="4" fill="#1b2740" stroke="#67b5ef"/>
  <text x="235" y="110" fill="#9fd4f5" font-size="9.5" text-anchor="middle">第 3 行 第 5 列</text>
  <text x="235" y="126" fill="#6b6b85" font-size="8" text-anchor="middle">矩阵交叉点</text>

  <line x1="314" y1="113" x2="386" y2="113" stroke="#e8b84b" stroke-width="1.6" marker-end="url(#l1)"/>

  <rect x="390" y="90" width="150" height="46" rx="4" fill="#1b2740" stroke="#67b5ef"/>
  <text x="465" y="110" fill="#9fd4f5" font-size="9.5" text-anchor="middle">扫描码 0x1C</text>
  <text x="465" y="126" fill="#6b6b85" font-size="8" text-anchor="middle">USB 里是 0x04</text>

  <!-- 第二层 -->
  <rect x="40" y="162" width="666" height="74" rx="7" fill="#171725" stroke="#9b4df0"/>
  <text x="58" y="184" fill="#cfc6ff" font-size="10">语义层</text>
  <text x="58" y="202" fill="#6b6b85" font-size="8">操作系统</text>
  <text x="58" y="220" fill="#6b6b85" font-size="8">「哪个键」</text>

  <rect x="160" y="176" width="150" height="46" rx="4" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="235" y="196" fill="#cfc6ff" font-size="9.5" text-anchor="middle">扫描码 0x1C</text>
  <text x="235" y="212" fill="#6b6b85" font-size="8" text-anchor="middle">查转换表</text>

  <line x1="314" y1="199" x2="386" y2="199" stroke="#e8b84b" stroke-width="1.6" marker-end="url(#l1)"/>

  <rect x="390" y="176" width="150" height="46" rx="4" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="465" y="196" fill="#cfc6ff" font-size="9.5" text-anchor="middle">VK_A / KeyA</text>
  <text x="465" y="212" fill="#6b6b85" font-size="8" text-anchor="middle">0x41</text>

  <!-- 第三层 -->
  <rect x="40" y="248" width="666" height="74" rx="7" fill="#171725" stroke="#4ec9a3"/>
  <text x="58" y="270" fill="#9fe0c9" font-size="10">字符层</text>
  <text x="58" y="288" fill="#6b6b85" font-size="8">布局 / 输入法</text>
  <text x="58" y="306" fill="#6b6b85" font-size="8">「产生什么字」</text>

  <rect x="160" y="262" width="150" height="46" rx="4" fill="#20303a" stroke="#4ec9a3"/>
  <text x="235" y="282" fill="#9fe0c9" font-size="9.5" text-anchor="middle">VK_A</text>
  <text x="235" y="298" fill="#6b6b85" font-size="8" text-anchor="middle">当前布局</text>

  <line x1="314" y1="285" x2="386" y2="285" stroke="#e8b84b" stroke-width="1.6" marker-end="url(#l1)"/>

  <rect x="390" y="262" width="150" height="46" rx="4" fill="#20303a" stroke="#4ec9a3"/>
  <text x="465" y="282" fill="#9fe0c9" font-size="9.5" text-anchor="middle">a</text>
  <text x="465" y="298" fill="#6b6b85" font-size="8" text-anchor="middle">或者 А / 中</text>

  <!-- 分支 -->
  <path d="M235,322 L235,342 L556,342" fill="none" stroke="#6b6b85" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="566" y="346" fill="#6b6b85" font-size="8.5">换 Dvorak：只这层变</text>

  <!-- 底部 -->
  <line x1="24" y1="360" x2="736" y2="360" stroke="#2a2a44"/>
  <text x="24" y="382" fill="#e8b84b" font-size="9">同一个键三个编号：0x1C（IBM AT，1984）、0x04（USB HID，1998）、0x41（Windows 虚拟键）。</text>
  <text x="24" y="404" fill="#9a9ab4" font-size="9">系统内部要做转换表——所以有些老键盘接 USB 转接头会丢键，是转换芯片里的表不全。</text>
  <text x="24" y="424" fill="#6b6b85" font-size="8.5">游戏监听语义层，所以不管当前是中文还是英文输入法，W 键都能走路。</text>
</svg>
