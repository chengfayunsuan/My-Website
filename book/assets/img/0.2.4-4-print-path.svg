<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 z" fill="#6b6b85"/>
    </marker>
  </defs>
  <rect width="760" height="456" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">打印一页纸，中间隔了六道手</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">每一步都可以是「打印机没反应」的原因，这就是它为什么比显示器难伺候</text>

  <!-- 上排六步 -->
  <rect x="22" y="72" width="112" height="56" rx="5" fill="#1b2740" stroke="#67b5ef"/>
  <text x="78" y="94" fill="#9fd4f5" font-size="9.5" text-anchor="middle">应用</text>
  <text x="78" y="110" fill="#8fa8c8" font-size="7.5" text-anchor="middle">Word / 浏览器</text>
  <text x="78" y="121" fill="#6b6b85" font-size="7.5" text-anchor="middle">「打印这一页」</text>

  <line x1="136" y1="100" x2="150" y2="100" stroke="#6b6b85" stroke-width="1.2" marker-end="url(#p1)"/>

  <rect x="152" y="72" width="112" height="56" rx="5" fill="#1b2740" stroke="#67b5ef"/>
  <text x="208" y="94" fill="#9fd4f5" font-size="9.5" text-anchor="middle">图形栈</text>
  <text x="208" y="110" fill="#8fa8c8" font-size="7.5" text-anchor="middle">GDI / Quartz</text>
  <text x="208" y="121" fill="#6b6b85" font-size="7.5" text-anchor="middle">排成页面</text>

  <line x1="266" y1="100" x2="280" y2="100" stroke="#6b6b85" stroke-width="1.2" marker-end="url(#p1)"/>

  <rect x="282" y="72" width="112" height="56" rx="5" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="338" y="94" fill="#cfc6ff" font-size="9.5" text-anchor="middle">打印驱动</text>
  <text x="338" y="110" fill="#a89ac8" font-size="7.5" text-anchor="middle">翻成打印机能懂的</text>
  <text x="338" y="121" fill="#6b6b85" font-size="7.5" text-anchor="middle">PCL / PS / 位图</text>

  <line x1="396" y1="100" x2="410" y2="100" stroke="#6b6b85" stroke-width="1.2" marker-end="url(#p1)"/>

  <rect x="412" y="72" width="112" height="56" rx="5" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="468" y="94" fill="#cfc6ff" font-size="9.5" text-anchor="middle">假脱机</text>
  <text x="468" y="110" fill="#a89ac8" font-size="7.5" text-anchor="middle">spooler 服务</text>
  <text x="468" y="121" fill="#6b6b85" font-size="7.5" text-anchor="middle">先落到硬盘排队</text>

  <line x1="526" y1="100" x2="540" y2="100" stroke="#6b6b85" stroke-width="1.2" marker-end="url(#p1)"/>

  <rect x="542" y="72" width="112" height="56" rx="5" fill="#20303a" stroke="#4ec9a3"/>
  <text x="598" y="94" fill="#9fe0c9" font-size="9.5" text-anchor="middle">传输</text>
  <text x="598" y="110" fill="#7f9e94" font-size="7.5" text-anchor="middle">USB / 网口 / Wi-Fi</text>
  <text x="598" y="121" fill="#6b6b85" font-size="7.5" text-anchor="middle">分包送进去</text>

  <line x1="656" y1="100" x2="670" y2="100" stroke="#6b6b85" stroke-width="1.2" marker-end="url(#p1)"/>

  <rect x="672" y="72" width="64" height="56" rx="5" fill="#3a2f24" stroke="#e8b84b"/>
  <text x="704" y="94" fill="#e8c47a" font-size="9.5" text-anchor="middle">解释</text>
  <text x="704" y="110" fill="#a89070" font-size="7.5" text-anchor="middle">打印机</text>
  <text x="704" y="121" fill="#6b6b85" font-size="7.5" text-anchor="middle">自己的 CPU</text>

  <!-- 分界 -->
  <line x1="30" y1="152" x2="730" y2="152" stroke="#2a2a3c"/>
  <text x="30" y="172" fill="#9a9ab4" font-size="9">前五步都在电脑里，最后一步才进打印机。所谓「打印机驱动」，就是把最后一门语言教给第三步。</text>

  <!-- 激光五步 -->
  <text x="30" y="202" fill="#d8d8e4" font-size="10">激光打印机内部：一页纸要走完五个物理步骤</text>

  <rect x="22" y="216" width="130" height="62" rx="5" fill="#171725" stroke="#3a3a52"/>
  <text x="87" y="236" fill="#9fd4f5" font-size="9" text-anchor="middle">① 充电</text>
  <text x="87" y="252" fill="#8a8aa0" font-size="7.5" text-anchor="middle">感光鼓表面铺满负电荷</text>
  <text x="87" y="266" fill="#6b6b85" font-size="7.5" text-anchor="middle">约 −600V，均匀一层</text>

  <line x1="154" y1="247" x2="166" y2="247" stroke="#6b6b85" stroke-width="1.2" marker-end="url(#p1)"/>

  <rect x="168" y="216" width="130" height="62" rx="5" fill="#171725" stroke="#3a3a52"/>
  <text x="233" y="236" fill="#9fd4f5" font-size="9" text-anchor="middle">② 曝光</text>
  <text x="233" y="252" fill="#8a8aa0" font-size="7.5" text-anchor="middle">激光扫过，被照到的地方</text>
  <text x="233" y="266" fill="#6b6b85" font-size="7.5" text-anchor="middle">电荷跑掉，形成潜影</text>

  <line x1="300" y1="247" x2="312" y2="247" stroke="#6b6b85" stroke-width="1.2" marker-end="url(#p1)"/>

  <rect x="314" y="216" width="130" height="62" rx="5" fill="#171725" stroke="#3a3a52"/>
  <text x="379" y="236" fill="#9fd4f5" font-size="9" text-anchor="middle">③ 显影</text>
  <text x="379" y="252" fill="#8a8aa0" font-size="7.5" text-anchor="middle">带负电的碳粉被静电吸到</text>
  <text x="379" y="266" fill="#6b6b85" font-size="7.5" text-anchor="middle">有电荷的地方，图就出来了</text>

  <line x1="446" y1="247" x2="458" y2="247" stroke="#6b6b85" stroke-width="1.2" marker-end="url(#p1)"/>

  <rect x="460" y="216" width="130" height="62" rx="5" fill="#171725" stroke="#3a3a52"/>
  <text x="525" y="236" fill="#9fd4f5" font-size="9" text-anchor="middle">④ 转印</text>
  <text x="525" y="252" fill="#8a8aa0" font-size="7.5" text-anchor="middle">纸背面加更强的正电，</text>
  <text x="525" y="266" fill="#6b6b85" font-size="7.5" text-anchor="middle">把碳粉「抢」到纸上</text>

  <line x1="592" y1="247" x2="604" y2="247" stroke="#6b6b85" stroke-width="1.2" marker-end="url(#p1)"/>

  <rect x="606" y="216" width="130" height="62" rx="5" fill="#171725" stroke="#3a3a52"/>
  <text x="671" y="236" fill="#9fd4f5" font-size="9" text-anchor="middle">⑤ 定影</text>
  <text x="671" y="252" fill="#8a8aa0" font-size="7.5" text-anchor="middle">两个热辊压过去，180°C 左右</text>
  <text x="671" y="266" fill="#6b6b85" font-size="7.5" text-anchor="middle">碳粉熔化，压进纸纤维</text>

  <!-- 下面三段说明 -->
  <line x1="30" y1="296" x2="730" y2="296" stroke="#2a2a3c"/>

  <text x="30" y="316" fill="#e8c47a" font-size="9">为什么有的打印机便宜、有的贵：</text>
  <text x="30" y="334" fill="#9a9ab4" font-size="8.5">便宜的（GDI 打印机）把第三步搬到电脑里做，机器里只有第五步的解释器和一套机械；</text>
  <text x="30" y="350" fill="#9a9ab4" font-size="8.5">贵的（PostScript / PCL 机型）自带更强的处理器和内存，电脑只管把页面描述发过去。</text>

  <text x="30" y="378" fill="#e8c47a" font-size="9">为什么「打印队列卡住」要重启服务：</text>
  <text x="30" y="396" fill="#9a9ab4" font-size="8.5">第四步那个假脱机是个后台服务，任务文件真的躺在硬盘上。它一卡，后面所有任务都堵着。</text>

  <text x="30" y="424" fill="#e8c47a" font-size="9">为什么无线打印机老掉线：</text>
  <text x="30" y="448" fill="#9a9ab4" font-size="8.5">它得同时维持「已连上 Wi-Fi」和「被主机发现」两件事，任何一头断了，队列里就全是「错误」。</text>
</svg>
