<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">同一笔 100 元，六个视角看的是六件不同的事</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">会计看分录，法律看债权，技术看报文，清算看净额，监管看流向</text>
<defs><marker id="v2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#3a3a52"/></marker></defs><line x1="242" y1="93" x2="380" y2="246" stroke="#3a3a52" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="518" y1="93" x2="380" y2="246" stroke="#3a3a52" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="242" y1="237" x2="380" y2="246" stroke="#3a3a52" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="518" y1="237" x2="380" y2="246" stroke="#3a3a52" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="242" y1="381" x2="380" y2="246" stroke="#3a3a52" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="518" y1="381" x2="380" y2="246" stroke="#3a3a52" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="30" y="52" width="212" height="82" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.3"/>
<text x="44" y="76" fill="#67b5ef" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">会计视角</text>
<text x="44" y="98" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一笔资产，一笔负债</text>
<text x="44" y="116" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">客户存款对银行是欠条</text>
<rect x="518" y="52" width="212" height="82" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.3"/>
<text x="532" y="76" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">法律视角</text>
<text x="532" y="98" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一笔债权债务关系</text>
<text x="532" y="116" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的存款是「银行欠你的钱」</text>
<rect x="30" y="196" width="212" height="82" rx="6" fill="#16161f" stroke="#e8965a" stroke-width="1.3"/>
<text x="44" y="220" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">监管视角</text>
<text x="44" y="242" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一笔可追溯的资金流</text>
<text x="44" y="260" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">备付金、反洗钱、名单筛查</text>
<rect x="518" y="196" width="212" height="82" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.3"/>
<text x="532" y="220" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">技术视角</text>
<text x="532" y="242" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一条 ISO 8583 报文</text>
<text x="532" y="260" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">加一个唯一流水号</text>
<rect x="30" y="340" width="212" height="82" rx="6" fill="#16161f" stroke="#a0a0b8" stroke-width="1.3"/>
<text x="44" y="364" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">时间视角</text>
<text x="44" y="386" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一次从冻结到入账的迁移</text>
<text x="44" y="404" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">授权几秒，清算一天</text>
<rect x="518" y="340" width="212" height="82" rx="6" fill="#16161f" stroke="#b58ae8" stroke-width="1.3"/>
<text x="532" y="364" fill="#b58ae8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">清算视角</text>
<text x="532" y="386" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一次轧差后的净额</text>
<text x="532" y="404" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">几万笔合并成几十笔</text>
<circle cx="380" cy="246" r="58" fill="#1a1a26" stroke="#e8b84b" stroke-width="2"/>
<text x="380" y="242" fill="#e8b84b" font-size="15" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">100 元</text>
<text x="380" y="264" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一笔钱</text>
</svg>
