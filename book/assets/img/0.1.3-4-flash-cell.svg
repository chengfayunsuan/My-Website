<svg width="760" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="#0e0e16"/>
  <text x="24" y="28" fill="#9a9ab4" font-size="12.5" font-family="monospace">闪存把电荷关进一个「四周都是绝缘体」的小房间，断电也跑不掉</text>

  <!-- ============ 左：单元剖面 ============ -->
  <rect x="22" y="46" width="430" height="398" rx="10" fill="#12121c" stroke="#2a2a44"/>
  <text x="42" y="74" fill="#d8d8e4" font-size="13">一个浮空栅单元（剖面）</text>

  <!-- 控制栅 -->
  <rect x="56" y="104" width="248" height="20" rx="3" fill="#3a2b52" stroke="#9b4df0"/>
  <text x="180" y="118" fill="#cfc6ff" font-size="10" text-anchor="middle">控制栅 Control Gate</text>
  <line x1="304" y1="114" x2="322" y2="114" stroke="#9b4df0" stroke-width="1"/>
  <text x="328" y="111" fill="#9b4df0" font-size="10">接字线</text>
  <text x="328" y="125" fill="#6b6b85" font-size="9">加电压才动作</text>

  <!-- 层间氧化层 -->
  <rect x="56" y="124" width="248" height="10" fill="#22222f" stroke="#2a2a44"/>
  <text x="328" y="148" fill="#6b6b85" font-size="9">氧化层</text>

  <!-- 浮空栅 + 电子 -->
  <rect x="56" y="134" width="248" height="22" rx="3" fill="#3a3020" stroke="#e8b84b"/>
  <g fill="#e8b84b">
    <circle cx="96" cy="145" r="2.6"/><circle cx="120" cy="141" r="2.6"/><circle cx="146" cy="146" r="2.6"/>
    <circle cx="172" cy="142" r="2.6"/><circle cx="198" cy="146" r="2.6"/><circle cx="226" cy="141" r="2.6"/>
    <circle cx="252" cy="145" r="2.6"/>
  </g>
  <text x="108" y="150" fill="#6b6b85" font-size="0">.</text>
  <line x1="304" y1="145" x2="322" y2="145" stroke="#e8b84b" stroke-width="1"/>
  <text x="328" y="142" fill="#e8b84b" font-size="10">浮空栅</text>
  <text x="328" y="156" fill="#6b6b85" font-size="9">电荷关在这里</text>

  <!-- 隧道氧化层 -->
  <rect x="56" y="156" width="248" height="7" fill="#22222f" stroke="#2a2a44"/>
  <line x1="304" y1="160" x2="322" y2="160" stroke="#2a2a44" stroke-width="1"/>
  <text x="328" y="180" fill="#6b6b85" font-size="9">隧道氧化层 8~10nm</text>

  <!-- 衬底 -->
  <rect x="56" y="163" width="248" height="58" rx="3" fill="#1b1b28" stroke="#3a3a58"/>
  <text x="180" y="196" fill="#6b6b85" font-size="9.5" text-anchor="middle">硅衬底</text>

  <!-- 源漏 -->
  <rect x="62" y="172" width="48" height="16" rx="2" fill="#1f3a4a" stroke="#67b5ef"/>
  <rect x="250" y="172" width="48" height="16" rx="2" fill="#1f3a4a" stroke="#67b5ef"/>
  <text x="86" y="184" fill="#9fd4f5" font-size="9" text-anchor="middle">源</text>
  <text x="274" y="184" fill="#9fd4f5" font-size="9" text-anchor="middle">漏</text>
  <text x="180" y="184" fill="#6b6b85" font-size="9" text-anchor="middle">沟道</text>

  <!-- 通道箭头 -->
  <line x1="120" y1="210" x2="240" y2="210" stroke="#4ec9a3" stroke-width="1.4" marker-end="url(#a3)"/>
  <text x="180" y="226" fill="#4ec9a3" font-size="9" text-anchor="middle">浮空栅里有电荷 → 沟道难导通</text>

  <text x="42" y="262" fill="#9a9ab4" font-size="11">写：控制栅加高压，电子穿过氧化层「隧穿」进浮空栅。</text>
  <text x="42" y="282" fill="#9a9ab4" font-size="11">擦：反向加电压，把电子抽走。这一来一回，氧化层被磨损一次。</text>
  <text x="42" y="306" fill="#f0606a" font-size="11">氧化层不是永远不会坏——擦写几千次后就会漏电，这就是寿命。</text>

  <rect x="42" y="322" width="392" height="66" rx="8" fill="#171725" stroke="#2a2a44"/>
  <text x="56" y="342" fill="#9a9ab4" font-size="10.5">读的时候不数电子，只看「这个单元多难导通」——导通所需的门限电压。</text>
  <text x="56" y="360" fill="#9a9ab4" font-size="10.5">电荷多 → 门限高 → 记作 0；电荷少 → 门限低 → 记作 1。</text>
  <text x="56" y="378" fill="#6b6b85" font-size="10">所以「存了多少电荷」本来是个连续量，能不能分得开，取决于你分几档。</text>

  <!-- ============ 右：阈值分布 ============ -->
  <rect x="470" y="46" width="268" height="398" rx="10" fill="#12121c" stroke="#2a2a44"/>
  <text x="490" y="74" fill="#d8d8e4" font-size="13">分档：1 档、2 档、8 档</text>

  <!-- SLC -->
  <text x="490" y="102" fill="#4ec9a3" font-size="10.5">SLC：每单元 1 比特（2 个峰）</text>
  <line x1="492" y1="176" x2="716" y2="176" stroke="#2a2a44"/>
  <path d="M505 176 C 520 176, 524 136, 538 136 C 552 136, 556 176, 571 176" fill="none" stroke="#4ec9a3" stroke-width="1.8"/>
  <path d="M600 176 C 615 176, 619 136, 633 136 C 647 136, 651 176, 666 176" fill="none" stroke="#4ec9a3" stroke-width="1.8"/>
  <text x="538" y="190" fill="#6b6b85" font-size="9" text-anchor="middle">1</text>
  <text x="633" y="190" fill="#6b6b85" font-size="9" text-anchor="middle">0</text>
  <line x1="585" y1="140" x2="585" y2="176" stroke="#f0606a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="585" y="132" fill="#f0606a" font-size="9" text-anchor="middle">判决线</text>

  <!-- 分隔 -->
  <line x1="490" y1="208" x2="716" y2="208" stroke="#22222f"/>

  <!-- TLC -->
  <text x="490" y="232" fill="#e8b84b" font-size="10.5">TLC：每单元 3 比特（8 个峰）</text>
  <line x1="492" y1="320" x2="716" y2="320" stroke="#2a2a44"/>
  <g fill="none" stroke="#e8b84b" stroke-width="1.3">
    <path d="M498 320 C 506 320, 508 292, 515 292 C 522 292, 524 320, 532 320"/>
    <path d="M536 320 C 544 320, 546 292, 553 292 C 560 292, 562 320, 570 320"/>
    <path d="M574 320 C 582 320, 584 292, 591 292 C 598 292, 600 320, 608 320"/>
    <path d="M612 320 C 620 320, 622 292, 629 292 C 636 292, 638 320, 646 320"/>
    <path d="M650 320 C 658 320, 660 292, 667 292 C 674 292, 676 320, 684 320"/>
    <path d="M688 320 C 696 320, 698 292, 705 292 C 712 292, 714 320, 722 320"/>
  </g>
  <text x="604" y="336" fill="#6b6b85" font-size="9" text-anchor="middle">（图上只画了 6 个，实际 8 个）</text>

  <text x="490" y="362" fill="#9a9ab4" font-size="10.5">峰挨得越近，越怕电荷跑掉一点点。</text>
  <text x="490" y="380" fill="#9a9ab4" font-size="10.5">所以要纠错、要反复重读、寿命也更短。</text>
  <text x="490" y="404" fill="#e8b84b" font-size="10">容量 ×3 的代价，全在这里。</text>

  <text x="490" y="428" fill="#6b6b85" font-size="9">SLC → MLC → TLC → QLC：每格塞 1、2、3、4 比特</text>

  <defs>
    <marker id="a3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4ec9a3"/>
    </marker>
  </defs>
</svg>
