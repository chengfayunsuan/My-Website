<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="450" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">同一台机器，四种连法</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">接口的形状，是被它的用途逼出来的</text>

  <!-- 1 点对点 -->
  <rect x="24" y="62" width="352" height="172" rx="8" fill="#12121c" stroke="#2a2a44"/>
  <text x="40" y="84" fill="#9fd4f5" font-size="11">点对点 · PCIe</text>
  <text x="40" y="100" fill="#6b6b85" font-size="8.5">每个设备一条专属通道，互不抢</text>

  <rect x="40" y="140" width="56" height="40" rx="4" fill="#1b2740" stroke="#67b5ef"/>
  <text x="68" y="165" fill="#9fd4f5" font-size="9" text-anchor="middle">CPU</text>

  <g stroke="#67b5ef" stroke-width="1.2" fill="none">
    <path d="M96,145 L200,115"/>
    <path d="M96,155 L200,143"/>
    <path d="M96,165 L200,171"/>
    <path d="M96,175 L200,199"/>
  </g>

  <rect x="200" y="104" width="90" height="22" rx="3" fill="#232338" stroke="#9b4df0"/>
  <text x="245" y="119" fill="#cfc6ff" font-size="8" text-anchor="middle">显卡 ×16</text>

  <rect x="200" y="132" width="90" height="22" rx="3" fill="#232338" stroke="#4ec9a3"/>
  <text x="245" y="147" fill="#9fe0c9" font-size="8" text-anchor="middle">固态 ×4</text>

  <rect x="200" y="160" width="90" height="22" rx="3" fill="#232338" stroke="#e8b84b"/>
  <text x="245" y="175" fill="#e8b84b" font-size="8" text-anchor="middle">网卡 ×1</text>

  <rect x="200" y="188" width="90" height="22" rx="3" fill="#232338" stroke="#6b6b85"/>
  <text x="245" y="203" fill="#9a9ab4" font-size="8" text-anchor="middle">声卡 ×1</text>

  <text x="40" y="222" fill="#6b6b85" font-size="8.5">显卡独占 16 条通道，而且不过中转</text>

  <!-- 2 主从 -->
  <rect x="384" y="62" width="352" height="172" rx="8" fill="#12121c" stroke="#2a2a44"/>
  <text x="400" y="84" fill="#9fe0c9" font-size="11">主从 · USB</text>
  <text x="400" y="100" fill="#6b6b85" font-size="8.5">一根总线挂一串，主机说了算</text>

  <rect x="400" y="120" width="56" height="40" rx="4" fill="#20303a" stroke="#4ec9a3"/>
  <text x="428" y="144" fill="#9fe0c9" font-size="9" text-anchor="middle">主机</text>

  <line x1="456" y1="140" x2="712" y2="140" stroke="#4ec9a3" stroke-width="2"/>

  <g>
    <line x1="490" y1="140" x2="490" y2="128" stroke="#4ec9a3"/>
    <rect x="476" y="112" width="28" height="16" rx="2" fill="#232338" stroke="#9a9ab4"/>
    <text x="490" y="124" fill="#d8d8e4" font-size="7" text-anchor="middle">键盘</text>

    <line x1="546" y1="140" x2="546" y2="128" stroke="#4ec9a3"/>
    <rect x="532" y="112" width="28" height="16" rx="2" fill="#232338" stroke="#9a9ab4"/>
    <text x="546" y="124" fill="#d8d8e4" font-size="7" text-anchor="middle">鼠标</text>

    <line x1="602" y1="140" x2="602" y2="152" stroke="#4ec9a3"/>
    <rect x="588" y="152" width="28" height="16" rx="2" fill="#232338" stroke="#9a9ab4"/>
    <text x="602" y="164" fill="#d8d8e4" font-size="7" text-anchor="middle">U 盘</text>

    <line x1="658" y1="140" x2="658" y2="152" stroke="#4ec9a3"/>
    <rect x="644" y="152" width="28" height="16" rx="2" fill="#232338" stroke="#9a9ab4"/>
    <text x="658" y="164" fill="#d8d8e4" font-size="7" text-anchor="middle">音箱</text>
  </g>

  <text x="400" y="196" fill="#6b6b85" font-size="8.5">四家共用一条带宽，设备不能主动说话</text>
  <text x="400" y="212" fill="#6b6b85" font-size="8.5">便宜、能随便插，代价是延迟有下限</text>

  <!-- 3 单向 -->
  <rect x="24" y="250" width="352" height="172" rx="8" fill="#12121c" stroke="#2a2a44"/>
  <text x="40" y="272" fill="#e8b84b" font-size="11">单向流 · HDMI / DP</text>
  <text x="40" y="288" fill="#6b6b85" font-size="8.5">一个源对一个屏，只往一个方向灌</text>

  <rect x="40" y="308" width="66" height="46" rx="4" fill="#332a18" stroke="#e8b84b"/>
  <text x="73" y="335" fill="#e8b84b" font-size="9" text-anchor="middle">播放器</text>

  <path d="M110,331 L262,331" stroke="#e8b84b" stroke-width="3" marker-end="url(#a1)"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#e8b84b"/>
    </marker>
  </defs>
  <text x="186" y="322" fill="#e8b84b" font-size="8.5" text-anchor="middle">三对数据 + 一对时钟</text>

  <rect x="266" y="308" width="66" height="46" rx="4" fill="#332a18" stroke="#e8b84b"/>
  <text x="299" y="335" fill="#e8b84b" font-size="9" text-anchor="middle">显示器</text>

  <text x="40" y="382" fill="#6b6b85" font-size="8.5">回传只有两根慢线：读型号（DDC）、发遥控（CEC）</text>
  <text x="40" y="400" fill="#6b6b85" font-size="8.5">所以只要 19 根针——省下的都是「不需要回话」</text>

  <!-- 4 网络 -->
  <rect x="384" y="250" width="352" height="172" rx="8" fill="#12121c" stroke="#2a2a44"/>
  <text x="400" y="272" fill="#a8c0ee" font-size="11">网络 · 以太网</text>
  <text x="400" y="288" fill="#6b6b85" font-size="8.5">很多点共享一个网段，谁都能跟谁说话</text>

  <rect x="540" y="304" width="60" height="34" rx="3" fill="#1a2338" stroke="#6b8fd4"/>
  <text x="570" y="325" fill="#a8c0ee" font-size="8.5" text-anchor="middle">交换机</text>

  <g stroke="#6b8fd4" stroke-width="1.2">
    <line x1="540" y1="314" x2="470" y2="314"/>
    <line x1="540" y1="328" x2="470" y2="328"/>
    <line x1="600" y1="314" x2="670" y2="314"/>
    <line x1="600" y1="328" x2="670" y2="328"/>
  </g>

  <rect x="432" y="302" width="38" height="18" rx="2" fill="#232338" stroke="#9a9ab4"/>
  <text x="451" y="315" fill="#d8d8e4" font-size="7" text-anchor="middle">电脑</text>
  <rect x="432" y="322" width="38" height="18" rx="2" fill="#232338" stroke="#9a9ab4"/>
  <text x="451" y="335" fill="#d8d8e4" font-size="7" text-anchor="middle">NAS</text>
  <rect x="670" y="302" width="38" height="18" rx="2" fill="#232338" stroke="#9a9ab4"/>
  <text x="689" y="315" fill="#d8d8e4" font-size="7" text-anchor="middle">打印机</text>
  <rect x="670" y="322" width="38" height="18" rx="2" fill="#232338" stroke="#9a9ab4"/>
  <text x="689" y="335" fill="#d8d8e4" font-size="7" text-anchor="middle">AP</text>

  <text x="400" y="364" fill="#6b6b85" font-size="8.5">跑得远（100 米），所以路上必须能扛干扰</text>
  <text x="400" y="382" fill="#6b6b85" font-size="8.5">靠变压器隔离、靠差分加屏蔽，带宽换距离</text>
  <text x="400" y="400" fill="#6b6b85" font-size="8.5">这是唯一一种「不认主机」的连法</text>
</svg>
