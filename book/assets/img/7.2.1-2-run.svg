<line x1="454" y1="170" x2="478" y2="170" stroke="#e87a8a" stroke-width="2"/>
<circle cx="542" cy="140" r="15" fill="#1c1c2a" stroke="#e87a8a" stroke-width="1.3"/>
<text x="542" y="145" fill="#e87a8a" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人</text>
<line x1="542" y1="155" x2="542" y2="196" stroke="#e87a8a" stroke-width="2.2"/>
