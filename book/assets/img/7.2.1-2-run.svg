<text x="618" y="145" fill="#e87a8a" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人</text>
<line x1="618" y1="155" x2="618" y2="196" stroke="#e87a8a" stroke-width="2.2"/>
<line x1="606" y1="170" x2="630" y2="170" stroke="#e87a8a" stroke-width="2"/>
<circle cx="694" cy="140" r="15" fill="#1c1c2a" stroke="#e87a8a" stroke-width="1.3"/>
<text x="694" y="145" fill="#e87a8a" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人</text>
<line x1="694" y1="155" x2="694" y2="196" stroke="#e87a8a" stroke-width="2.2"/>
<line x1="682" y1="170" x2="706" y2="170" stroke="#e87a8a" stroke-width="2"/>
<text x="600" y="226" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所有人都来取钱</text>
<text x="40" y="268" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有人挤兑时，这个池子够用；一旦所有人同时来取，谁都拿不到全额——不是因为银行亏了，是因为钱变成了房子和机器。</text>
<text x="40" y="294" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这就是为什么银行最怕谣言，也是为什么需要存款保险和央行兜底。</text>
