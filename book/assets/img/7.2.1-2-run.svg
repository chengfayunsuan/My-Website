<svg xmlns="http://www.w3.org/2000/svg" width="880" height="316" viewBox="0 0 880 316" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="316" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.1 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">挤兑：池子里的水，本来就不够所有人同时来舀</text>
<rect x="60" y="96" width="220" height="132" rx="10" fill="#16161f" stroke="#e87a8a" stroke-width="1.6"/>
<text x="170" y="130" fill="#e87a8a" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">某银行</text>
<text x="170" y="160" fill="#cfcfe0" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">库存现金 + 准备金</text>
<text x="170" y="186" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只占总存款的 10% 左右</text>
<text x="170" y="210" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">其余都放贷出去了</text>
<path d="M288,162 L340,162" fill="none" stroke="#8a8aa0" stroke-width="1.7"/>
<path d="M340,156 L350,162 L340,168 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
