<text x="610" y="316" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4096 项 × 2 位 = 8 KB，就能覆盖绝大多数热点分支。</text>
<text x="610" y="334" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不同地址撞进同一项叫「别名」，会互相污染。</text>
<text x="24" y="440" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">预测时看最高位：1 猜跳，0 猜不跳。为什么不用一位——一位计数器遇到「循环最后一次不跳」立刻翻面，</text>
<text x="24" y="458" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">下次进入循环第一条就猜错。两位要连续两次例外才翻面，于是这种例外被吸收掉了。</text>
<text x="24" y="476" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价只是每个分支多占一位存储——这是体系结构里最划算的一笔交易之一。</text>
</svg>
