<svg xmlns="http://www.w3.org/2000/svg" width="680" height="344" viewBox="0 0 680 344" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="344" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">8.4.1  一台 2 核 4G、5M 带宽的云服务器，钱花在哪</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按主流厂商包月价粗略折算，单位：元 / 月</text>
<rect x="40" y="86" width="300" height="54" rx="0" fill="#67b5ef22" stroke="#67b5ef" stroke-width="1.5"/>
<text x="190.0" y="108" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">计算</text>
<text x="190.0" y="128" fill="#67b5ef" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">50%</text>
<rect x="340" y="86" width="60" height="54" rx="0" fill="#8a8aa022" stroke="#8a8aa0" stroke-width="1.5"/>
<text x="370.0" y="108" fill="#8a8aa0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">云盘</text>
<text x="370.0" y="128" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">10%</text>
<rect x="400" y="86" width="240" height="54" rx="0" fill="#e8965a22" stroke="#e8965a" stroke-width="1.5"/>
<text x="520.0" y="108" fill="#e8965a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">带宽</text>
<text x="520.0" y="128" fill="#e8965a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">40%</text>
<rect x="40" y="170" width="186" height="130" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="40" y="170" width="4" height="130" rx="2" fill="#67b5ef" stroke="none" stroke-width="0"/>
<text x="58" y="198" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">计算</text>
<text x="58" y="230" fill="#67b5ef" font-size="23" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">¥130</text>
<text x="58" y="256" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2 vCPU + 4 GB 内存</text>
<text x="58" y="276" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">整台机器的"脑子"</text>
<rect x="246" y="170" width="186" height="130" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="246" y="170" width="4" height="130" rx="2" fill="#8a8aa0" stroke="none" stroke-width="0"/>
<text x="264" y="198" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">云盘</text>
<text x="264" y="230" fill="#8a8aa0" font-size="23" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">¥20</text>
<text x="264" y="256" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">40 GB 系统盘</text>
<text x="264" y="276" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最便宜的一块</text>
<rect x="452" y="170" width="186" height="130" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<rect x="452" y="170" width="4" height="130" rx="2" fill="#e8965a" stroke="none" stroke-width="0"/>
<text x="470" y="198" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">带宽</text>
<text x="470" y="230" fill="#e8965a" font-size="23" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">¥100</text>
<text x="470" y="256" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">固定 5 Mbps</text>
<text x="470" y="276" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你有一半钱在租管子</text>
<text x="40" y="326" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">合计 ¥250 / 月。带宽这一项占了 40%——它买不到任何算力。</text>
</svg>
