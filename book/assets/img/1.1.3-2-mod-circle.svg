<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'PingFang SC','Microsoft YaHei',monospace">
  <defs>
    <marker id="cw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f0606a"/>
    </marker>
    <marker id="ccw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#67b5ef"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#0e0e16"/>

  <text x="20" y="26" fill="#9a9ab4" font-size="12.5">8 位容器就是一个 256 格的圆环：加就是顺时针，减就是逆时针</text>

  <!-- 圆环 -->
  <circle cx="320" cy="205" r="120" fill="none" stroke="#2a2a44" stroke-width="2"/>
  <circle cx="320" cy="205" r="120" fill="none" stroke="#9b4df0" stroke-width="2" stroke-opacity="0.25"/>

  <!-- 中心 -->
  <text x="320" y="196" fill="#6b6b85" font-size="11" text-anchor="middle">模 256</text>
  <text x="320" y="218" fill="#6b6b85" font-size="10.5" text-anchor="middle">转一圈 = 256</text>

  <!-- 四个主刻度 -->
  <circle cx="320" cy="85" r="4" fill="#9b4df0"/>
  <text x="320" y="70" fill="#d8c8ff" font-size="12" text-anchor="middle" font-weight="700">0</text>

  <circle cx="440" cy="205" r="4" fill="#9b4df0"/>
  <text x="458" y="209" fill="#d8c8ff" font-size="12" font-weight="700">64</text>

  <circle cx="320" cy="325" r="4" fill="#9b4df0"/>
  <text x="320" y="348" fill="#d8c8ff" font-size="12" text-anchor="middle" font-weight="700">128</text>

  <circle cx="200" cy="205" r="4" fill="#9b4df0"/>
  <text x="176" y="209" fill="#d8c8ff" font-size="12" text-anchor="end" font-weight="700">192</text>

  <!-- 255 紧挨着 0 -->
  <circle cx="300" cy="86" r="4" fill="#f0606a"/>
  <text x="284" y="70" fill="#f7a3a8" font-size="12" text-anchor="end" font-weight="700">255</text>

  <!-- 方向说明（放在圆内，避免箭头画歪） -->
  <text x="320" y="170" fill="#67b5ef" font-size="12" text-anchor="middle">顺时针 → 加</text>
  <text x="320" y="248" fill="#f0606a" font-size="12" text-anchor="middle">逆时针 ← 减</text>

  <!-- 0 与 255 相邻，差 1 -->
  <text x="320" y="50" fill="#f0606a" font-size="10" text-anchor="middle">0 和 255 相邻，差 1</text>

  <!-- 说明 -->
  <line x1="20" y1="366" x2="620" y2="366" stroke="#2a2a44"/>
  <text x="20" y="388" fill="#9a9ab4" font-size="11">所以在 8 位里，−1 的编码就是 255（1111 1111）；−84 的编码就是 172（1010 1100）。</text>
  <text x="20" y="408" fill="#6b6b85" font-size="11">「补码」这个名字的意思就是：负数是「补满这个圆」所需的那部分。−84 补到 256 正好是 84。</text>
</svg>
