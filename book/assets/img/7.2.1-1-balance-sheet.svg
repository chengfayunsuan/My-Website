<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="380" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.1 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一家银行的钱，左边看是资产，右边看是负债</text>
<text x="40" y="78" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产：钱去哪了</text>
<text x="470" y="78" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">负债：钱从哪来</text>
<text x="40" y="116" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷款</text>
<rect x="140" y="103" width="180" height="18" rx="3" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<text x="328" y="117" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">60%</text>
<text x="40" y="164" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">债券投资</text>
<rect x="140" y="151" width="60" height="18" rx="3" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<text x="208" y="165" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">20%</text>
<text x="40" y="212" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行准备金</text>
<rect x="140" y="199" width="45" height="18" rx="3" fill="#b58ae8" stroke="#b58ae8" stroke-width="0"/>
<text x="193" y="213" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">15%</text>
<text x="40" y="260" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">库存现金</text>
<rect x="140" y="247" width="15" height="18" rx="3" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<text x="163" y="261" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5%</text>
<text x="470" y="116" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款</text>
<rect x="570" y="103" width="255" height="18" rx="3" fill="#e8b84b" stroke="#e8b84b" stroke-width="0"/>
<text x="833" y="117" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">85%</text>
<text x="470" y="164" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同业借款</text>
<rect x="570" y="151" width="24" height="18" rx="3" fill="#e8965a" stroke="#e8965a" stroke-width="0"/>
<text x="602" y="165" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">8%</text>
<text x="470" y="212" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">股东权益</text>
<rect x="570" y="199" width="21" height="18" rx="3" fill="#e87a8a" stroke="#e87a8a" stroke-width="0"/>
<text x="599" y="213" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">7%</text>
<text x="40" y="316" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两边的数永远相等。这不是巧合，是记账规则：你存进来的每一块，都同时记在两边。</text>
<text x="40" y="342" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">图上比例是示意，不同银行差别很大；但「存款是大头」这一点几乎所有银行都一样。</text>
</svg>
