<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.1-6  敲下 foo. 到弹出候选列表，这几十毫秒里发生了什么</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">横轴是时间。整条链走完约 69 毫秒，还在「人感觉不到卡顿」的 100 毫秒以内</text>
<text x="140" y="109" fill="#c8c8dc" font-size="9.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按键事件</text>
<rect x="150.0" y="92" width="4.599999999999994" height="24" rx="2" fill="#6a6a86" stroke="none" stroke-width="1.5"/>
<text x="161.6" y="108" fill="#6a6a86" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1 ms</text>
<text x="646" y="108" fill="#7a7a92" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记下光标位置</text>
<text x="140" y="149" fill="#c8c8dc" font-size="9.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">防抖等待</text>
<rect x="154.6" y="132" width="138.00000000000003" height="24" rx="2" fill="#3a3a52" stroke="none" stroke-width="1.5"/>
<text x="299.6" y="148" fill="#3a3a52" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">30 ms</text>
<text x="646" y="148" fill="#7a7a92" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">停下来才动手，否则每按一键都重算</text>
<text x="140" y="189" fill="#c8c8dc" font-size="9.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">增量解析</text>
<rect x="292.6" y="172" width="23.0" height="24" rx="2" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="322.6" y="188" fill="#67b5ef" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5 ms</text>
<text x="646" y="188" fill="#7a7a92" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只重算被改动的那一支</text>
<text x="140" y="229" fill="#c8c8dc" font-size="9.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查符号表</text>
<rect x="315.6" y="212" width="9.199999999999989" height="24" rx="2" fill="#b58ae8" stroke="none" stroke-width="1.5"/>
<text x="331.8" y="228" fill="#b58ae8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2 ms</text>
<text x="646" y="228" fill="#7a7a92" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">先弄清 foo 是什么</text>
<text x="140" y="269" fill="#c8c8dc" font-size="9.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">类型推导</text>
<rect x="324.8" y="252" width="82.80000000000001" height="24" rx="2" fill="#e8965a" stroke="none" stroke-width="1.5"/>
<text x="414.6" y="268" fill="#e8965a" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">18 ms</text>
<text x="646" y="268" fill="#7a7a92" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最贵的一步：算出它有哪些成员</text>
<text x="140" y="309" fill="#c8c8dc" font-size="9.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">过滤排序</text>
<rect x="407.6" y="292" width="13.799999999999955" height="24" rx="2" fill="#e8b84b" stroke="none" stroke-width="1.5"/>
<text x="428.4" y="308" fill="#e8b84b" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3 ms</text>
<text x="646" y="308" fill="#7a7a92" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前缀匹配，再按使用频率排</text>
<text x="140" y="349" fill="#c8c8dc" font-size="9.8" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">渲染列表</text>
<rect x="421.4" y="332" width="46.0" height="24" rx="2" fill="#67d9a0" stroke="none" stroke-width="1.5"/>
<text x="474.4" y="348" fill="#67d9a0" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">10 ms</text>
<text x="646" y="348" fill="#7a7a92" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">画出来，然后等下一次按键</text>
<line x1="150.0" y1="82" x2="150.0" y2="372" stroke="#26263a" stroke-width="1" stroke-dasharray="3 4"/>
<text x="150.0" y="388" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0 ms</text>
<line x1="265.0" y1="82" x2="265.0" y2="372" stroke="#26263a" stroke-width="1" stroke-dasharray="3 4"/>
<text x="265.0" y="388" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">25 ms</text>
<line x1="380.0" y1="82" x2="380.0" y2="372" stroke="#26263a" stroke-width="1" stroke-dasharray="3 4"/>
<text x="380.0" y="388" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">50 ms</text>
<line x1="495.0" y1="82" x2="495.0" y2="372" stroke="#26263a" stroke-width="1" stroke-dasharray="3 4"/>
<text x="495.0" y="388" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">75 ms</text>
<line x1="610.0" y1="82" x2="610.0" y2="372" stroke="#26263a" stroke-width="1" stroke-dasharray="3 4"/>
<text x="610.0" y="388" fill="#5f5f78" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">100 ms</text>
<line x1="610.0" y1="76" x2="610.0" y2="372" stroke="#e87a8a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="602.0" y="70" fill="#e87a8a" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">100 ms 卡顿线</text>
<text x="30" y="412" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意「防抖等待」占了四成多：它不是浪费，是用 30 毫秒的延迟换掉「每敲一个字母都跑一遍完整分析」。</text>
</svg>
