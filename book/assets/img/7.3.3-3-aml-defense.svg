<svg width="880" height="396" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="396" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">银行反洗钱的三道防线</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你被问、被限额、被冻卡，都是这台过滤器在工作。</text>
<rect x="40" y="88" width="128" height="74" rx="6" fill="#1c1c2b" stroke="#67b5ef" stroke-width="1.4"/>
<text x="104" y="132" fill="#67b5ef" font-size="16" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">事前</text>
<rect x="180" y="88" width="664" height="74" rx="6" fill="#15151f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="200" y="116" fill="#67b5ef" font-size="13.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">客户尽职调查（KYC / CDD）</text>
<text x="200" y="142" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开户问清你是谁、钱哪来、干什么用；高风险客户加深调查</text>
<rect x="40" y="174" width="128" height="74" rx="6" fill="#1c1c2b" stroke="#e8b84b" stroke-width="1.4"/>
<text x="104" y="218" fill="#e8b84b" font-size="16" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">事中</text>
<rect x="180" y="174" width="664" height="74" rx="6" fill="#15151f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="200" y="202" fill="#e8b84b" font-size="13.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">交易监测与报告</text>
<text x="200" y="228" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">大额交易自动报送：现金单日 5 万、境内转账 50 万、跨境 20 万</text>
<rect x="40" y="260" width="128" height="74" rx="6" fill="#1c1c2b" stroke="#e87a8a" stroke-width="1.4"/>
<text x="104" y="304" fill="#e87a8a" font-size="16" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">事后</text>
<rect x="180" y="260" width="664" height="74" rx="6" fill="#15151f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="200" y="288" fill="#e87a8a" font-size="13.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">可疑交易报告（STR）与处置</text>
<text x="200" y="314" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">模型或人工发现异常 → 上报反洗钱监测分析中心 → 可协查冻结</text>
<text x="40" y="356" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三道防线是一台过滤器的三级滤网：第一道拦身份，第二道拦模式，第三道留给还没被认出的新花样。</text>
</svg>
