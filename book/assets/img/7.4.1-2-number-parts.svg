<path d="M60,158 L60,166 L332,166 L332,158" fill="none" stroke="#67b5ef" stroke-width="1.6"/>
<text x="196.0" y="186" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前 6 位：发卡行</text>
<text x="196.0" y="204" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">BIN / IIN，认银行和卡种</text>
<path d="M336,158 L336,166 L746,166 L746,158" fill="none" stroke="#c8c8dc" stroke-width="1.6"/>
<text x="541.0" y="186" fill="#c8c8dc" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中间 9 位：你的账号</text>
<text x="541.0" y="204" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行自己编，不重复</text>
<path d="M750,158 L750,166 L792,166 L792,158" fill="none" stroke="#e8b84b" stroke-width="1.6"/>
<text x="771.0" y="186" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">末位：校验位</text>
<text x="771.0" y="204" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">算出来的，不是随机的</text>
<text x="60" y="250" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么按 4 位一组隔开？因为人眼抄 16 位数字必错，分成 4 组后每组的错误率降一个量级。</text>
<text x="60" y="270" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">国际标准 ISO/IEC 7812 规定了这个结构；2017 年后允许发卡行标识扩到 8 位，但国内卡基本还是 6 位。</text>
