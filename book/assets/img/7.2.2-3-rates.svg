<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="290" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.2.2 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">期限越长，利率越高，钱锁得越死</text>
<text x="40" y="110" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">活期</text>
<rect x="150" y="94" width="60" height="22" rx="3" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<text x="220" y="111" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0.2%</text>
<text x="40" y="154" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一年定期</text>
<rect x="150" y="138" width="240" height="22" rx="3" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<text x="400" y="155" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1.5%</text>
<text x="40" y="198" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三年定期</text>
<rect x="150" y="182" width="320" height="22" rx="3" fill="#e8b84b" stroke="#e8b84b" stroke-width="0"/>
<text x="480" y="199" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2.0%</text>
<text x="40" y="242" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">五年定期</text>
<rect x="150" y="226" width="328" height="22" rx="3" fill="#e8965a" stroke="#e8965a" stroke-width="0"/>
<text x="488" y="243" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2.05%</text>
<text x="40" y="272" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">利率是示意值，各行有差异；重点是形状：越长期限，补偿越高——因为你放弃了随时取用的自由。</text>
</svg>
