<svg width="900" height="462" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="462" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">存储层次：容量每翻十倍，延迟大致也翻十倍</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">横条宽度按容量（对数）递增；右侧三列是对应的延迟、换算成 3 GHz 的拍数、以及每字节能摊到多少带宽</text>
<rect x="24" y="88" width="58.21835908076402" height="34" rx="2" fill="#141420" stroke="#b58ae8" stroke-width="1.4"/>
<rect x="24" y="88" width="3.5" height="34" rx="2" fill="#b58ae8" stroke="none" stroke-width="0"/>
<text x="38" y="106" fill="#b58ae8" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">寄存器</text>
<text x="38" y="119" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">256 B</text>
<text x="600" y="111" fill="#b58ae8" font-size="12" text-anchor="end" font-family="monospace">0.3 ns</text>
<text x="660" y="111" fill="#8a8aa2" font-size="11" text-anchor="end" font-family="monospace">0.9 拍</text>
<text x="782" y="111" fill="#5f5f78" font-size="10" text-anchor="end" font-family="monospace">213 GB/s</text>
<rect x="24" y="132" width="118.72584164140808" height="34" rx="2" fill="#141420" stroke="#67d9a0" stroke-width="1.4"/>
<rect x="24" y="132" width="3.5" height="34" rx="2" fill="#67d9a0" stroke="none" stroke-width="0"/>
<text x="38" y="150" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">L1 缓存</text>
<text x="38" y="163" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">48 KB</text>
<text x="600" y="155" fill="#67d9a0" font-size="12" text-anchor="end" font-family="monospace">1.3 ns</text>
<text x="660" y="155" fill="#8a8aa2" font-size="11" text-anchor="end" font-family="monospace">4 拍</text>
<text x="782" y="155" fill="#5f5f78" font-size="10" text-anchor="end" font-family="monospace">49 GB/s</text>
<rect x="24" y="176" width="153.94589770191004" height="34" rx="2" fill="#141420" stroke="#67d9a0" stroke-width="1.4"/>
<rect x="24" y="176" width="3.5" height="34" rx="2" fill="#67d9a0" stroke="none" stroke-width="0"/>
<text x="38" y="194" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">L2 缓存</text>
<text x="38" y="207" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">1 MB</text>
<text x="600" y="199" fill="#67d9a0" font-size="12" text-anchor="end" font-family="monospace">4.5 ns</text>
<text x="660" y="199" fill="#8a8aa2" font-size="11" text-anchor="end" font-family="monospace">14 拍</text>
<text x="782" y="199" fill="#5f5f78" font-size="10" text-anchor="end" font-family="monospace">14 GB/s</text>
<rect x="24" y="220" width="193.83237212738752" height="34" rx="2" fill="#141420" stroke="#67b5ef" stroke-width="1.4"/>
<rect x="24" y="220" width="3.5" height="34" rx="2" fill="#67b5ef" stroke="none" stroke-width="0"/>
<text x="38" y="238" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">L3 缓存</text>
<text x="38" y="251" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">32 MB</text>
<text x="600" y="243" fill="#67b5ef" font-size="12" text-anchor="end" font-family="monospace">15 ns</text>
<text x="660" y="243" fill="#8a8aa2" font-size="11" text-anchor="end" font-family="monospace">45 拍</text>
<text x="782" y="243" fill="#5f5f78" font-size="10" text-anchor="end" font-family="monospace">4 GB/s</text>
<rect x="24" y="264" width="273.60532097834255" height="34" rx="2" fill="#141420" stroke="#e8965a" stroke-width="1.4"/>
<rect x="24" y="264" width="3.5" height="34" rx="2" fill="#e8965a" stroke="none" stroke-width="0"/>
<text x="38" y="282" fill="#e8965a" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内存</text>
<text x="38" y="295" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">32 GB</text>
<text x="600" y="287" fill="#e8965a" font-size="12" text-anchor="end" font-family="monospace">80 ns</text>
<text x="660" y="287" fill="#8a8aa2" font-size="11" text-anchor="end" font-family="monospace">240 拍</text>
<text x="782" y="287" fill="#5f5f78" font-size="10" text-anchor="end" font-family="monospace">0.80 GB/s</text>
<rect x="24" y="308" width="313.4917954038201" height="34" rx="2" fill="#141420" stroke="#e8b84b" stroke-width="1.4"/>
<rect x="24" y="308" width="3.5" height="34" rx="2" fill="#e8b84b" stroke="none" stroke-width="0"/>
<text x="38" y="326" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">SSD</text>
<text x="38" y="339" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">1 TB</text>
<text x="600" y="331" fill="#e8b84b" font-size="12" text-anchor="end" font-family="monospace">100 µs</text>
<text x="660" y="331" fill="#8a8aa2" font-size="11" text-anchor="end" font-family="monospace">30 万拍</text>
<text x="782" y="331" fill="#5f5f78" font-size="10" text-anchor="end" font-family="monospace">640.0 KB/s</text>
<rect x="24" y="352" width="337.4236800591066" height="34" rx="2" fill="#141420" stroke="#e87a8a" stroke-width="1.4"/>
<rect x="24" y="352" width="3.5" height="34" rx="2" fill="#e87a8a" stroke="none" stroke-width="0"/>
<text x="38" y="370" fill="#e87a8a" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">机械硬盘</text>
<text x="38" y="383" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="monospace">8 TB</text>
<text x="600" y="375" fill="#e87a8a" font-size="12" text-anchor="end" font-family="monospace">10 ms</text>
<text x="660" y="375" fill="#8a8aa2" font-size="11" text-anchor="end" font-family="monospace">3000 万拍</text>
<text x="782" y="375" fill="#5f5f78" font-size="10" text-anchor="end" font-family="monospace">6.4 KB/s</text>
<text x="782" y="78" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">单个流能拿到的带宽</text>
<text x="660" y="78" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">折成拍</text>
<text x="600" y="78" fill="#6a6a82" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">延迟</text>
<line x1="596" y1="86" x2="596" y2="384" stroke="#26263a" stroke-width="1"/>
<text x="24" y="418" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">带宽那一列是「只跑一个顺序流、没有预取、没有并发」的悲观值：64 字节 ÷ 延迟。</text>
<text x="24" y="436" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">真实处理器靠预取和多个并发未命中把这一列拉高十几倍——那正是 1.3.5-12 要讲的事。</text>
<text x="24" y="454" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意 SSD 与机械硬盘之间那道深沟：一个是微秒，一个是毫秒，差了两个数量级，中间没有缓存可以填。</text>
</svg>
