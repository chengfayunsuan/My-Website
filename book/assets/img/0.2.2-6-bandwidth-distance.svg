<svg width="760" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">带宽和距离，是一对天生的敌人</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">把常见接口按「跑多快」和「跑多远」画出来，会发现它们都贴着同一条斜线</text>

  <!-- 网格 -->
  <g stroke="#232338" stroke-dasharray="3 4">
    <line x1="80" y1="327" x2="720" y2="327"/>
    <line x1="80" y1="273" x2="720" y2="273"/>
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="80" y1="167" x2="720" y2="167"/>
    <line x1="80" y1="113" x2="720" y2="113"/>
    <line x1="80" y1="60" x2="720" y2="60"/>
    <line x1="240" y1="60" x2="240" y2="380"/>
    <line x1="400" y1="60" x2="400" y2="380"/>
    <line x1="560" y1="60" x2="560" y2="380"/>
  </g>

  <line x1="80" y1="380" x2="740" y2="380" stroke="#4a4a68"/>
  <line x1="80" y1="52" x2="80" y2="380" stroke="#4a4a68"/>

  <g fill="#6b6b85" font-size="8.5" text-anchor="end">
    <text x="72" y="384">1 M</text>
    <text x="72" y="331">10 M</text>
    <text x="72" y="277">100 M</text>
    <text x="72" y="224">1 G</text>
    <text x="72" y="171">10 G</text>
    <text x="72" y="117">100 G</text>
    <text x="72" y="64">1 T</text>
  </g>
  <text x="26" y="216" fill="#9a9ab4" font-size="8.5" transform="rotate(-90 26 216)" text-anchor="middle">带宽（对数）</text>

  <g fill="#6b6b85" font-size="8.5" text-anchor="middle">
    <text x="80" y="398">0.1 m</text>
    <text x="240" y="398">1 m</text>
    <text x="400" y="398">10 m</text>
    <text x="560" y="398">100 m</text>
    <text x="720" y="398">1 km</text>
  </g>
  <text x="400" y="418" fill="#9a9ab4" font-size="8.5" text-anchor="middle">距离（对数）</text>

  <!-- 趋势线 -->
  <line x1="84" y1="67" x2="716" y2="200" stroke="#6b6b85" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="712" y="222" fill="#6b6b85" font-size="8.5" text-anchor="end">虚线 = 经验边界</text>

  <!-- 点 -->
  <circle cx="128" cy="76" r="5" fill="#9b4df0"/>
  <text x="140" y="72" fill="#cfc6ff" font-size="9">PCIe 5.0 ×16　63 GB/s</text>

  <circle cx="240" cy="135" r="5" fill="#4ec9a3"/>
  <text x="252" y="150" fill="#9fe0c9" font-size="9">USB4　40 Gbps</text>

  <circle cx="316" cy="130" r="5" fill="#e8b84b"/>
  <text x="304" y="122" fill="#e8b84b" font-size="9" text-anchor="end">HDMI 2.1　48 G</text>

  <circle cx="352" cy="119" r="5" fill="#67b5ef"/>
  <text x="364" y="114" fill="#9fd4f5" font-size="9">DP 2.0　80 G</text>

  <circle cx="240" cy="178" r="5" fill="#9a9ab4"/>
  <text x="252" y="174" fill="#c8c8d4" font-size="9">SATA　6 G</text>

  <circle cx="288" cy="237" r="5" fill="#9a9ab4"/>
  <text x="300" y="233" fill="#c8c8d4" font-size="9">USB 2.0　480 M</text>

  <circle cx="560" cy="167" r="5" fill="#a8c0ee"/>
  <text x="560" y="186" fill="#a8c0ee" font-size="9" text-anchor="middle">万兆网口 · 100 m</text>

  <text x="400" y="300" fill="#6b6b85" font-size="9" text-anchor="middle">往右上走 = 更快 + 更远，但代价指数级上升</text>
  <text x="400" y="320" fill="#4a4a68" font-size="8.5" text-anchor="middle">光纤能同时做到又快又远，但贵、不能供电、接口复杂</text>

  <!-- 底部 -->
  <line x1="24" y1="432" x2="736" y2="432" stroke="#2a2a44"/>
  <text x="24" y="452" fill="#e8b84b" font-size="9">这张图里的每个点，都是「频率、线材、编码、成本」四件事折中的结果——没有一个能随便往上挪。</text>
</svg>
