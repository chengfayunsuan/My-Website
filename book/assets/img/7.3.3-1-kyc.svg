<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="310" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.3 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">KYC 只问三件事，但每一件都要证据</text>
<rect x="26" y="92" width="266" height="136" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="159" y="122" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你是谁</text>
<text x="159" y="158" fill="#cfcfe0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">身份证、人脸、手机号</text>
<text x="159" y="186" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">确认账户背后有真人</text>
<rect x="308" y="92" width="266" height="136" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="441" y="122" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱从哪来</text>
<text x="441" y="158" fill="#cfcfe0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">工资、经营、卖房、继承</text>
<text x="441" y="186" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">确认来源合法</text>
<rect x="590" y="92" width="266" height="136" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.4"/>
<text x="723" y="122" fill="#e8b84b" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱要去哪</text>
<text x="723" y="158" fill="#cfcfe0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">消费、还债、投资、汇款</text>
<text x="723" y="186" fill="#8a8aa0" font-size="10.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">确认用途合理</text>
<text x="26" y="268" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三个问题互相咬合：身份是假的，后两个就都是编的；来源说不清，用途再合理也可疑。</text>
<text x="26" y="294" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行不是警察，它只负责记录和报告；判断是不是犯罪，是公安和法院的事。</text>
</svg>
