<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="410" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">增值税是链条税：每个环节只交「自己加的那一段」</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一件商品被卖三次，税不是收三次，而是每一段分别交</text>
<rect x="24" y="70" width="732" height="34" rx="4" fill="#12121a" stroke="#3a3a52" stroke-width="1"/>
<text x="90" y="92" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">环节</text>
<text x="180" y="92" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卖价（不含税）</text>
<text x="340" y="92" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">销项税</text>
<text x="470" y="92" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">进项税</text>
<text x="600" y="92" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">本环节应缴</text>
<rect x="24" y="110" width="732" height="46" rx="4" fill="#16161f" stroke="#67b5ef" stroke-width="1.2"/>
<text x="44" y="138" fill="#67b5ef" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">A 卖原料给 B</text>
<text x="240" y="138" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">100</text>
<text x="400" y="138" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">13</text>
<text x="530" y="138" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">0</text>
<text x="666" y="138" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="monospace" font-weight="bold">13</text>
<rect x="24" y="164" width="732" height="46" rx="4" fill="#16161f" stroke="#e8b84b" stroke-width="1.2"/>
<text x="44" y="192" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">B 加工后卖给 C</text>
<text x="240" y="192" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">200</text>
<text x="400" y="192" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">26</text>
<text x="530" y="192" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">13</text>
<text x="666" y="192" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="monospace" font-weight="bold">13</text>
<rect x="24" y="218" width="732" height="46" rx="4" fill="#16161f" stroke="#b58ae8" stroke-width="1.2"/>
<text x="44" y="246" fill="#b58ae8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">C 零售给消费者</text>
<text x="240" y="246" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">300</text>
<text x="400" y="246" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">39</text>
<text x="530" y="246" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">26</text>
<text x="666" y="246" fill="#b58ae8" font-size="11" text-anchor="middle" font-family="monospace" font-weight="bold">13</text>
<rect x="24" y="272" width="732" height="46" rx="4" fill="#16161f" stroke="#67d9a0" stroke-width="1.2"/>
<text x="44" y="300" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">最终消费者</text>
<text x="240" y="300" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">339（含税）</text>
<text x="400" y="300" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">—</text>
<text x="530" y="300" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="monospace">—</text>
<text x="666" y="300" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="monospace" font-weight="bold">承担 39</text>
<rect x="24" y="332" width="732" height="60" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.3"/>
<text x="44" y="358" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">三个环节各缴 13，合计 39 —— 正好等于最终消费者承担的那 39</text>
<text x="44" y="380" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这就是抵扣的意义：重复征税被消掉了，税只落在「每一次加价」上</text>
</svg>
