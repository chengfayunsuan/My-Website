<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">付款结构就是风险分配</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同样一万块的项目，谁先垫钱决定了谁在裸奔</text>
<text x="140" y="132" fill="#e87a8a" font-size="12.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">纯后付</text>
<text x="140" y="150" fill="#a0a0b8" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最大垫资 100%</text>
<rect x="150" y="110" width="450.0" height="32" rx="2" fill="#8a8aa03a" stroke="#8a8aa0" stroke-width="1.2"/>
<text x="375.0" y="131" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">交付后 100%</text>
<text x="140" y="228" fill="#e8b84b" font-size="12.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">三段式</text>
<text x="140" y="246" fill="#a0a0b8" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最大垫资 30%</text>
<rect x="150" y="206" width="135.0" height="32" rx="2" fill="#67d9a03a" stroke="#67d9a0" stroke-width="1.2"/>
<text x="217.5" y="227" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">预付 30%</text>
<rect x="285.0" y="206" width="180.0" height="32" rx="2" fill="#e8b84b3a" stroke="#e8b84b" stroke-width="1.2"/>
<text x="375.0" y="227" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中期 40%</text>
<rect x="465.0" y="206" width="135.0" height="32" rx="2" fill="#67b5ef3a" stroke="#67b5ef" stroke-width="1.2"/>
<text x="532.5" y="227" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">验收 30%</text>
<text x="140" y="324" fill="#67d9a0" font-size="12.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">预付为主</text>
<text x="140" y="342" fill="#a0a0b8" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最大垫资 0</text>
<rect x="150" y="302" width="270.0" height="32" rx="2" fill="#67d9a03a" stroke="#67d9a0" stroke-width="1.2"/>
<text x="285.0" y="323" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">预付 60%</text>
<rect x="420.0" y="302" width="180.0" height="32" rx="2" fill="#67b5ef3a" stroke="#67b5ef" stroke-width="1.2"/>
<text x="510.0" y="323" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">验收 40%</text>
<line x1="150" y1="392" x2="600" y2="392" stroke="#4a4a62" stroke-width="1.2"/>
<text x="150" y="412" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">项目开始</text>
<text x="600" y="412" fill="#a0a0b8" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">项目结束</text>
<text x="30" y="86" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">颜色的顺序就是钱进来的顺序；条越长，你在替客户垫的越多。</text>
</svg>
