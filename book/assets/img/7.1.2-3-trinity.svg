<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="476" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.2-3  三元悖论：三个愿望，只能挑两个</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">蒙代尔-弗莱明模型的核心结论。每条边代表「选了这两样，就必须放弃对面那个顶点」</text>
<line x1="362" y1="132" x2="268" y2="328" stroke="#5a5a80" stroke-width="2.2"/>
<line x1="518" y1="132" x2="612" y2="328" stroke="#5a5a80" stroke-width="2.2"/>
<line x1="294" y1="358" x2="586" y2="358" stroke="#5a5a80" stroke-width="2.2"/>
<rect x="342.0" y="73.0" width="196" height="58" rx="6" fill="#16161f" stroke="#b58ae8" stroke-width="1.6"/>
<text x="440" y="100" fill="#b58ae8" font-size="12.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">货币政策独立</text>
<text x="440" y="119" fill="#7f7f98" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">利率自己定</text>
<rect x="98.0" y="329.0" width="196" height="58" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.6"/>
<text x="196" y="356" fill="#67b5ef" font-size="12.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">汇率稳定</text>
<text x="196" y="375" fill="#7f7f98" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">兑美元别乱跳</text>
<rect x="586.0" y="329.0" width="196" height="58" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.6"/>
<text x="684" y="356" fill="#67d9a0" font-size="12.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">资本自由流动</text>
<text x="684" y="375" fill="#7f7f98" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱进出不受限</text>
<text x="440" y="250" fill="#5f5f78" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只能选两个</text>
<text x="288" y="214" fill="#e8b84b" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">中国</text>
<text x="288" y="234" fill="#a08a50" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管制资本</text>
<text x="288" y="252" fill="#8a7a58" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保住汇率和利率</text>
<text x="592" y="214" fill="#e8965a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">美国</text>
<text x="592" y="234" fill="#a07550" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">放开资本</text>
<text x="592" y="252" fill="#8a6a58" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">汇率交给市场</text>
<text x="440" y="392" fill="#e87a8a" font-size="9.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">香港：钉住美元 + 资金自由进出，代价是利率必须跟着美联储走</text>
<text x="440" y="412" fill="#8a6a72" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（所以香港没有独立的货币政策，美联储加息它就跟着加）</text>
<text x="40" y="456" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记住这张图：后面所有关于「汇率保卫战」「资本管制」「央行加息」的新闻，本质都是在这三条边上做选择。</text>
</svg>
