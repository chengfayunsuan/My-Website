<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">月薪一万的员工，公司实际支出约一万四</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">工资只是账面数字，社保公积金才是隐藏的大头</text>
<rect x="110" y="110" width="378.5714285714286" height="44" rx="2" fill="#67b5ef33" stroke="#67b5ef" stroke-width="1.2"/>
<text x="299.28571428571433" y="138" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">到手工资</text>
<rect x="488.5714285714286" y="110" width="94.64285714285715" height="44" rx="2" fill="#e8965a33" stroke="#e8965a" stroke-width="1.2"/>
<text x="535.8928571428572" y="138" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">单位社保</text>
<rect x="583.2142857142858" y="110" width="18.92857142857143" height="44" rx="2" fill="#b58ae833" stroke="#b58ae8" stroke-width="1.2"/>
<rect x="602.1428571428572" y="110" width="37.85714285714286" height="44" rx="2" fill="#67d9a033" stroke="#67d9a0" stroke-width="1.2"/>
<circle cx="116" cy="192" r="4" fill="#67b5ef"/>
<text x="128" y="196" fill="#67b5ef" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">到手工资</text>
<text x="210" y="196" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¥10,000</text>
<text x="290" y="196" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">税前工资</text>
<circle cx="116" cy="222" r="4" fill="#e8965a"/>
<text x="128" y="226" fill="#e8965a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">单位社保</text>
<text x="210" y="226" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¥2,500</text>
<text x="290" y="226" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">养老 16% + 医疗 8% 等</text>
<circle cx="116" cy="252" r="4" fill="#b58ae8"/>
<text x="128" y="256" fill="#b58ae8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">公积金</text>
<text x="210" y="256" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¥500</text>
<text x="290" y="256" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按最低 5% 计</text>
<circle cx="116" cy="282" r="4" fill="#67d9a0"/>
<text x="128" y="286" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">办公分摊</text>
<text x="210" y="286" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">¥1,000</text>
<text x="290" y="286" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">工位、设备、软件</text>
<line x1="110" y1="330" x2="640" y2="330" stroke="#4a4a62" stroke-width="1.4"/>
<text x="110" y="356" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">合计 ¥14,000 / 月</text>
<text x="640" y="356" fill="#a0a0b8" font-size="10" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">是工资的 1.4 倍</text>
<text x="340" y="392" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这还没算招聘、培训、离职补偿和"招错了"的时间成本。</text>
<text x="340" y="416" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以一个人的公司，"先招个人再说"通常是最贵的决策。</text>
</svg>
