  <rect width="760" height="500" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">八相错开 45&#176;：让锯齿互相抵消</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">每一相都在剧烈起伏，八条叠起来几乎不动——这就是多相供电的全部意义</text>

