<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">隐私政策背后是五步，缺一步就是违法收集</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">《个人信息保护法》要求的不是"写一份文档"，是一套流程</text>
<rect x="30" y="96" width="116" height="150" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="30" y="96" width="116" height="32" rx="6" fill="#67b5ef28" stroke="none" stroke-width="0"/>
<text x="88" y="117" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">告知</text>
<text x="88" y="146" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">处理者是谁</text>
<text x="88" y="168" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收什么、为什么</text>
<text x="88" y="190" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存多久</text>
<text x="153" y="176" fill="#5a5a72" font-size="15" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">›</text>
<rect x="160" y="96" width="116" height="150" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="160" y="96" width="116" height="32" rx="6" fill="#67d9a028" stroke="none" stroke-width="0"/>
<text x="218" y="117" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">同意</text>
<text x="218" y="146" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一般：勾选</text>
<text x="218" y="168" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">敏感：单独同意</text>
<text x="218" y="190" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">未成年：监护人</text>
<text x="283" y="176" fill="#5a5a72" font-size="15" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">›</text>
<rect x="290" y="96" width="116" height="150" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="290" y="96" width="116" height="32" rx="6" fill="#e8b84b28" stroke="none" stroke-width="0"/>
<text x="348" y="117" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">最小必要</text>
<text x="348" y="146" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">和服务无关的</text>
<text x="348" y="168" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一律不收</text>
<text x="348" y="190" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">超范围即违规</text>
<text x="413" y="176" fill="#5a5a72" font-size="15" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">›</text>
<rect x="420" y="96" width="116" height="150" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="420" y="96" width="116" height="32" rx="6" fill="#b58ae828" stroke="none" stroke-width="0"/>
<text x="478" y="117" fill="#b58ae8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">保障权利</text>
<text x="478" y="146" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查阅、复制</text>
<text x="478" y="168" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">更正、删除</text>
<text x="478" y="190" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">撤回、可携带</text>
<text x="543" y="176" fill="#5a5a72" font-size="15" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">›</text>
<rect x="550" y="96" width="116" height="150" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="550" y="96" width="116" height="32" rx="6" fill="#e87a8a28" stroke="none" stroke-width="0"/>
<text x="608" y="117" fill="#e87a8a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">安全与评估</text>
<text x="608" y="146" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">加密、限权</text>
<text x="608" y="168" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">泄露要报告</text>
<text x="608" y="190" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">敏感场景做评估</text>
<line x1="30" y1="270" x2="650" y2="270" stroke="#3a3a52" stroke-width="1"/>
<text x="340" y="296" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">告知是"说清楚"，同意是"他点头"，最小必要是"别多要"。</text>
<text x="340" y="318" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">后两步是"他想走，你得让他走得掉"。</text>
<rect x="30" y="344" width="196" height="62" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="30" y="344" width="4" height="62" rx="2" fill="#e87a8a" stroke="none" stroke-width="0"/>
<text x="46" y="366" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只写"可能收集相关信息"</text>
<text x="46" y="388" fill="#e87a8a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">范围不明确，等于没告知</text>
<rect x="242" y="344" width="196" height="62" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="242" y="344" width="4" height="62" rx="2" fill="#e8965a" stroke="none" stroke-width="0"/>
<text x="258" y="366" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把同意藏在长文第 9 页</text>
<text x="258" y="388" fill="#e8965a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不算"充分知情下的自愿"</text>
<rect x="454" y="344" width="196" height="62" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="454" y="344" width="4" height="62" rx="2" fill="#b58ae8" stroke="none" stroke-width="0"/>
<text x="470" y="366" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有删除和注销入口</text>
<text x="470" y="388" fill="#b58ae8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">违反第 47 条，投诉高发</text>
</svg>
