<text x="440" y="286" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">8 位装不下 256，</text>
<text x="440" y="308" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">多出来的那个 1 跑去当标志位了。</text>
<rect x="440" y="330" width="300" height="78" rx="6" fill="#141c1e" stroke="#3a5a6a" stroke-width="1.4"/>
<text x="458" y="358" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="monospace">CF = 1</text>
<text x="534" y="358" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最高位往外套了一个 1</text>
<text x="458" y="388" fill="#8a8a9a" font-size="13" text-anchor="start" font-family="monospace">OF = 0</text>
<text x="534" y="388" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">−1 + 1 = 0，本来就对</text>
<line x1="24" y1="442" x2="736" y2="442" stroke="#2a2a3e" stroke-width="1"/>
<text x="24" y="468" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CF 看「最高位有没有往外套一个 1」，给无符号数用；</text>
<text x="24" y="488" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">OF 看「最高位收到的进位和送出的进位是否一致」，给有符号数用。</text>
<text x="24" y="518" fill="#e8b84b" font-size="12" text-anchor="start" font-family="monospace">判据：OF = C_in(最高位) ⊕ C_out(最高位)</text>
<text x="24" y="542" fill="#7a7a94" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一次加法，两个标志可以只有一个置位——所以比较大小必须分清有无符号。</text>
