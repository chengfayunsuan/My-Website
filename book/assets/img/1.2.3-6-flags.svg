<text x="52" y="286" fill="#e87a8a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">正 + 正 得到了负数。</text>
<text x="52" y="308" fill="#e87a8a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">符号位被顶翻了。</text>
<rect x="52" y="330" width="300" height="78" rx="6" fill="#1e1418" stroke="#6a3a44" stroke-width="1.4"/>
<text x="70" y="358" fill="#8a8a9a" font-size="12.5" text-anchor="start" font-family="monospace">CF = 0</text>
<text x="146" y="358" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最高位没有往外进位</text>
<text x="70" y="388" fill="#e87a8a" font-size="13" text-anchor="start" font-family="monospace" font-weight="bold">OF = 1</text>
<text x="146" y="388" fill="#e87a8a" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">正加正得负，符号位被顶翻</text>
<text x="440" y="108" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">255 + 1</text>
<text x="440" y="126" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当作无符号数看：装不下了</text>
<text x="462" y="154" fill="#4a4a62" font-size="8.5" text-anchor="middle" font-family="monospace">b7</text>
