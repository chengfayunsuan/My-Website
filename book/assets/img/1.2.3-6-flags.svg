<svg width="760" height="556" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="556" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">同一个电路，两个标志，说的是两件事</text>
