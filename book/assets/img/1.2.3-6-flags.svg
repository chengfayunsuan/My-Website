<text x="52" y="108" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">127 + 1</text>
<text x="52" y="126" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当作有符号数看：两个正数</text>
<text x="74" y="154" fill="#4a4a62" font-size="8.5" text-anchor="middle" font-family="monospace">b7</text>
