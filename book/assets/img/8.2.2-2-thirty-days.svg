<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">拿照之后的 30 天：四件事，有法定截止日</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">逾期不办，轻则无法开票，重则被列入异常</text>
<line x1="230" y1="88" x2="720" y2="88" stroke="#8a8aa0" stroke-width="1.5"/>
<line x1="230.0" y1="84" x2="230.0" y2="92" stroke="#4a4a62" stroke-width="1"/>
<text x="230.0" y="78" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">D0 拿照</text>
<line x1="344.3333333333333" y1="84" x2="344.3333333333333" y2="92" stroke="#4a4a62" stroke-width="1"/>
<text x="344.3333333333333" y="78" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">D7</text>
<line x1="475.0" y1="84" x2="475.0" y2="92" stroke="#4a4a62" stroke-width="1"/>
<text x="475.0" y="78" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">D15</text>
<line x1="720.0" y1="84" x2="720.0" y2="92" stroke="#4a4a62" stroke-width="1"/>
<text x="720.0" y="78" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">D30</text>
<text x="30" y="136" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">刻章</text>
<text x="30" y="154" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">公章、财务章、法人章、发票章</text>
<rect x="230" y="118" width="49.0" height="26" rx="4" fill="#12121a" stroke="#67d9a0" stroke-width="1.2"/>
<text x="254.5" y="136" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">3 天</text>
<line x1="279.0" y1="131" x2="720" y2="131" stroke="#67d9a0" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/><text x="716" y="136" fill="#a0a0b8" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">法定截止</text>
<text x="30" y="200" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">税务报到</text>
<text x="30" y="218" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">核定税种、领发票、签三方协议</text>
<rect x="230" y="182" width="114.33333333333331" height="26" rx="4" fill="#12121a" stroke="#e8b84b" stroke-width="1.2"/>
<text x="287.16666666666663" y="200" fill="#e8b84b" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">7 天</text>
<line x1="344.3333333333333" y1="195" x2="720" y2="195" stroke="#e8b84b" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/><text x="716" y="200" fill="#a0a0b8" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">法定截止</text>
<text x="30" y="264" fill="#67b5ef" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">银行开户</text>
<text x="30" y="282" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对公户，收款和扣税都要用</text>
<rect x="230" y="246" width="245.0" height="26" rx="4" fill="#12121a" stroke="#67b5ef" stroke-width="1.2"/>
<text x="352.5" y="264" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">15 天</text>
<line x1="475.0" y1="259" x2="720" y2="259" stroke="#67b5ef" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/><text x="716" y="264" fill="#a0a0b8" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">法定截止</text>
<text x="30" y="328" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">社保开户</text>
<text x="30" y="346" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有员工就必须开，没员工也要了解</text>
<rect x="230" y="310" width="490.0" height="26" rx="4" fill="#12121a" stroke="#e8965a" stroke-width="1.2"/>
<text x="475.0" y="328" fill="#e8965a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">30 日内</text>
<rect x="30" y="376" width="720" height="20" rx="4" fill="#16121f" stroke="#3a3a52" stroke-width="1"/>
<text x="390" y="390" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">实心条 = 建议完成时间，虚线到 D30 = 法定最后期限；早办早省事</text>
</svg>
