  <text x="20" y="334" fill="#6b6b85" font-size="8">−½ 级</text>
  <line x1="30" y1="374" x2="730" y2="374" stroke="#2a2a3c"/>
  <text x="30" y="394" fill="#d8d8e4" font-size="9">误差的形状是锯齿：信号每上升一级，误差从 +½ 级线性掉到 −½ 级，然后跳回去。它的平均值是零，但平方和不是零。</text>
  <text x="30" y="412" fill="#9a9ab4" font-size="8.5">这个「非零的平方和」就是量化噪声。位深每加 1 位，噪声功率降到四分之一，信噪比提高约 6 dB：SNR ≈ 6.02n + 1.76。</text>
  <text x="30" y="430" fill="#6b6b85" font-size="8.5">16 位 = 98 dB，24 位 = 146 dB。人耳的动态范围约 120 dB，所以 16 位对 playback 够用，24 位留给录音时的余量。</text>
