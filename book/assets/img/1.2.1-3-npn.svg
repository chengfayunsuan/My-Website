<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><marker id="t1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1.2 L8,4.5 L0,7.8 z" fill="#e8b84b"/></marker>
  <marker id="t2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1.2 L8,4.5 L0,7.8 z" fill="#67b5ef"/></marker></defs>
  <rect width="760" height="424" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">NPN 三极管：三块半导体，中间那块薄得离谱</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">发射极和集电极是同一种材料，基区夹在中间，厚度只有几微米——这是它和「两个二极管」的全部区别</text>
  <rect x="120" y="76" width="200" height="68" fill="#1e2a3e" stroke="#3a5a7a"/>
  <text x="220" y="102" fill="#9fd4f5" font-size="10" text-anchor="middle">集电极 C</text>
  <text x="220" y="120" fill="#6f8aa8" font-size="8" text-anchor="middle">N 型，中等掺杂</text>
  <text x="220" y="134" fill="#4a6a88" font-size="7.5" text-anchor="middle">面积大，好散热</text>
  <rect x="120" y="144" width="200" height="34" fill="#2e2030" stroke="#8a4a70"/>
  <text x="220" y="166" fill="#e8b0d0" font-size="9.5" text-anchor="middle">基区 B（很薄）</text>
  <rect x="120" y="178" width="200" height="68" fill="#1e2a3e" stroke="#3a5a7a"/>
  <text x="220" y="204" fill="#9fd4f5" font-size="10" text-anchor="middle">发射极 E</text>
  <text x="220" y="222" fill="#6f8aa8" font-size="8" text-anchor="middle">N 型，重掺杂</text>
  <text x="220" y="236" fill="#4a6a88" font-size="7.5" text-anchor="middle">载流子的源头</text>
  <line x1="88" y1="161" x2="116" y2="161" stroke="#e8b84b" stroke-width="1.5" marker-end="url(#t1)"/>
  <text x="72" y="150" fill="#e8c47a" font-size="9" text-anchor="middle">I<tspan font-size="6.5" dy="2">B</tspan></text>
  <text x="72" y="176" fill="#8a7a50" font-size="7" text-anchor="middle">很小</text>
  <line x1="352" y1="230" x2="352" y2="112" stroke="#67b5ef" stroke-width="2.4" marker-end="url(#t2)"/>
  <text x="366" y="176" fill="#9fd4f5" font-size="10">I<tspan font-size="7" dy="2">C</tspan></text>
  <text x="366" y="192" fill="#6f8aa8" font-size="7.5">被 β 倍放大</text>
  <text x="120" y="268" fill="#6b6b85" font-size="8">电子从发射极出发，穿过基区，被集电极收走</text>
  <circle cx="540" cy="176" r="56" fill="none" stroke="#5a5a7a" stroke-width="1.6"/>
  <line x1="512" y1="140" x2="512" y2="212" stroke="#d8d8e4" stroke-width="2.4"/>
  <line x1="512" y1="158" x2="572" y2="126" stroke="#d8d8e4" stroke-width="2"/>
  <line x1="512" y1="194" x2="570" y2="224" stroke="#d8d8e4" stroke-width="2"/>
  <path d="M556 218 L572 224 L556 226 z" fill="#d8d8e4"/>
  <line x1="480" y1="176" x2="512" y2="176" stroke="#d8d8e4" stroke-width="2"/>
  <line x1="572" y1="126" x2="572" y2="100" stroke="#d8d8e4" stroke-width="2"/>
  <line x1="570" y1="224" x2="570" y2="250" stroke="#d8d8e4" stroke-width="2"/>
  <text x="474" y="180" fill="#9a9ab4" font-size="9" text-anchor="end">B</text>
  <text x="572" y="94" fill="#9a9ab4" font-size="9" text-anchor="middle">C</text>
  <text x="570" y="266" fill="#9a9ab4" font-size="9" text-anchor="middle">E</text>
  <text x="540" y="300" fill="#6b6b85" font-size="7.5" text-anchor="middle">箭头朝外 = NPN</text>
  <line x1="30" y1="322" x2="730" y2="322" stroke="#2a2a3c"/>
  <text x="30" y="342" fill="#d8d8e4" font-size="9">基区做得很薄（早期几微米，现在几十纳米），是为了让电子来不及复合就穿过去——这是三极管能放大的物理前提。</text>
  <text x="30" y="360" fill="#9a9ab4" font-size="8.5">如果基区很厚，从发射极注入的电子会在路上和空穴复合掉，变成基极电流的一部分，集电极就收不到多少了。</text>
  <text x="30" y="378" fill="#9a9ab4" font-size="8.5">所以「两个二极管反接」不能当三极管用：那样基区是两块独立的材料，中间隔着耗尽层，电子过不去。</text>
  <text x="30" y="398" fill="#6b6b85" font-size="8.5">数字：β 的典型值 100 到 500。1 毫安的基极电流，能控制 100 到 500 毫安的集电极电流。</text>
  <text x="30" y="416" fill="#6b6b85" font-size="8.5">这个「小控大」的比例，就是放大的全部含义。它不是凭空产生能量，是用小能量控制大能量的流向。</text>
</svg>