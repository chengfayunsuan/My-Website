<circle cx="410" cy="266" r="4" fill="#b58ae8"/>
<circle cx="510" cy="236" r="4" fill="#b58ae8"/>
<circle cx="510" cy="266" r="4" fill="#b58ae8"/>
<circle cx="610" cy="236" r="4" fill="#b58ae8"/>
<circle cx="610" cy="266" r="4" fill="#b58ae8"/>
