<path d="M170,266 L170,298 L220,298 L220,266" fill="none" stroke="#67b5ef" stroke-width="1.2"/>
<path d="M270,266 L270,298 L320,298 L320,266" fill="none" stroke="#67b5ef" stroke-width="1.2"/>
<path d="M370,266 L370,298 L420,298 L420,266" fill="none" stroke="#67b5ef" stroke-width="1.2"/>
<text x="220" y="314" fill="#67b5ef" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">feature</text>
<path d="M470,266 L470,214 L560,214 L560,236" fill="none" stroke="#e8965a" stroke-width="1.2"/>
<text x="515" y="208" fill="#e8965a" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">release</text>
<path d="M660,236 L660,292 L730,292 L730,236" fill="none" stroke="#e87a8a" stroke-width="1.2"/>
<text x="695" y="308" fill="#e87a8a" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">hotfix</text>
<text x="30" y="340" fill="#67b5ef" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">GitHub Flow</text>
<text x="140" y="340" fill="#6f6f88" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">main 永远可发布，每个改动开一个短分支，走 PR</text>
<line x1="60" y1="386" x2="820" y2="386" stroke="#2a3a4a" stroke-width="2"/>
<circle cx="110" cy="386" r="5" fill="#67b5ef"/>
<circle cx="260" cy="386" r="5" fill="#67b5ef"/>
<circle cx="410" cy="386" r="5" fill="#67b5ef"/>
<circle cx="560" cy="386" r="5" fill="#67b5ef"/>
<circle cx="710" cy="386" r="5" fill="#67b5ef"/>
<path d="M170,386 L170,356 L230,356 L230,386" fill="none" stroke="#67d9a0" stroke-width="1.2"/>
<rect x="188" y="362" width="24" height="14" rx="2" fill="#16281c" stroke="#67d9a0" stroke-width="1"/>
<text x="200" y="372" fill="#67d9a0" font-size="6.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">PR</text>
<path d="M320,386 L320,356 L380,356 L380,386" fill="none" stroke="#67d9a0" stroke-width="1.2"/>
<rect x="338" y="362" width="24" height="14" rx="2" fill="#16281c" stroke="#67d9a0" stroke-width="1"/>
<text x="350" y="372" fill="#67d9a0" font-size="6.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">PR</text>
<path d="M470,386 L470,356 L530,356 L530,386" fill="none" stroke="#67d9a0" stroke-width="1.2"/>
<rect x="488" y="362" width="24" height="14" rx="2" fill="#16281c" stroke="#67d9a0" stroke-width="1"/>
<text x="500" y="372" fill="#67d9a0" font-size="6.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">PR</text>
<line x1="30" y1="424" x2="850" y2="424" stroke="#2a2a3e" stroke-width="1"/>
<text x="30" y="448" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">主干开发最快、最省事，但要靠特性开关和自动化测试兜底；Git Flow 最重，适合「同时维护 2.0 和 3.0 两个版本」的产品；</text>
<text x="30" y="470" fill="#8a8aa2" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">GitHub Flow 是中间路线，适合大多数持续交付的团队 —— 也是开源社区最常用的形态。</text>
</svg>
