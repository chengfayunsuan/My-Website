<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="500" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.7.2-1  三种分支模型，复杂度差一个量级</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">选哪个不看哪个「专业」，看团队多大、发布多频繁、需不需要同时维护几个版本</text>
<text x="30" y="84" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">主干开发（trunk-based）</text>
<text x="230" y="84" fill="#6f6f88" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所有人往 main 上合，分支活不过一两天</text>
<line x1="60" y1="116" x2="820" y2="116" stroke="#3a4a5a" stroke-width="2"/>
<circle cx="90" cy="116" r="5" fill="#67d9a0"/>
<text x="90" y="136" fill="#5f7f6a" font-size="7.5" text-anchor="middle" font-family="monospace">c1</text>
<circle cx="172" cy="116" r="5" fill="#67d9a0"/>
<text x="172" y="136" fill="#5f7f6a" font-size="7.5" text-anchor="middle" font-family="monospace">c2</text>
<circle cx="254" cy="116" r="5" fill="#67d9a0"/>
<text x="254" y="136" fill="#5f7f6a" font-size="7.5" text-anchor="middle" font-family="monospace">c3</text>
<circle cx="336" cy="116" r="5" fill="#67d9a0"/>
<text x="336" y="136" fill="#5f7f6a" font-size="7.5" text-anchor="middle" font-family="monospace">c4</text>
<circle cx="418" cy="116" r="5" fill="#67d9a0"/>
<text x="418" y="136" fill="#5f7f6a" font-size="7.5" text-anchor="middle" font-family="monospace">c5</text>
<circle cx="500" cy="116" r="5" fill="#67d9a0"/>
<text x="500" y="136" fill="#5f7f6a" font-size="7.5" text-anchor="middle" font-family="monospace">c6</text>
<circle cx="582" cy="116" r="5" fill="#67d9a0"/>
<text x="582" y="136" fill="#5f7f6a" font-size="7.5" text-anchor="middle" font-family="monospace">c7</text>
<circle cx="664" cy="116" r="5" fill="#67d9a0"/>
<text x="664" y="136" fill="#5f7f6a" font-size="7.5" text-anchor="middle" font-family="monospace">c8</text>
<circle cx="746" cy="116" r="5" fill="#67d9a0"/>
<text x="746" y="136" fill="#5f7f6a" font-size="7.5" text-anchor="middle" font-family="monospace">c9</text>
<path d="M336,116 L336,140 L400,140 L400,116" fill="none" stroke="#e8b84b" stroke-width="1.2"/>
<text x="368" y="154" fill="#e8b84b" font-size="7.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">活 1 天</text>
<text x="30" y="204" fill="#b58ae8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">Git Flow</text>
<text x="120" y="204" fill="#6f6f88" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">五条线并行：main、develop、feature、release、hotfix</text>
<line x1="60" y1="236" x2="820" y2="236" stroke="#4a3a5a" stroke-width="1.8"/>
<text x="34" y="239" fill="#8a7aa0" font-size="7.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">main</text>
<line x1="60" y1="266" x2="820" y2="266" stroke="#4a3a5a" stroke-width="1.8"/>
<text x="34" y="269" fill="#8a7aa0" font-size="7.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">develop</text>
