<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.5.3-2  取一次数据到底多贵：横轴是对数刻度</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一台机器上量出来的量级。每往下一行，慢一个数量级以上</text>
<text x="196" y="100" fill="#c8c8dc" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">L1 缓存</text>
<text x="196" y="116" fill="#6f6f88" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">比一次加法还便宜</text>
<rect x="210" y="88" width="8" height="32" rx="3" fill="#67d9a0" stroke="none" stroke-width="1.5"/>
<text x="228" y="109" fill="#67d9a0" font-size="11" text-anchor="start" font-family="monospace">1 ns</text>
<text x="196" y="156" fill="#c8c8dc" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内存</text>
<text x="196" y="172" fill="#6f6f88" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">缓存未命中的代价</text>
<rect x="210" y="144" width="148.57142857142856" height="32" rx="3" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="368.57142857142856" y="165" fill="#67b5ef" font-size="11" text-anchor="start" font-family="monospace">100 ns</text>
<text x="196" y="212" fill="#c8c8dc" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">NVMe SSD 随机读</text>
<text x="196" y="228" fill="#6f6f88" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">闪存页的读取</text>
<rect x="210" y="200" width="349.06634317924716" height="32" rx="3" fill="#e8965a" stroke="none" stroke-width="1.5"/>
<text x="569.0663431792472" y="221" fill="#e8965a" font-size="11" text-anchor="start" font-family="monospace">50 µs</text>
<text x="196" y="268" fill="#c8c8dc" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">机械硬盘随机读</text>
<text x="196" y="284" fill="#6f6f88" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">等磁头转到位</text>
<rect x="210" y="256" width="497.6377717506757" height="32" rx="3" fill="#e87a8a" stroke="none" stroke-width="1.5"/>
<text x="717.6377717506757" y="277" fill="#e87a8a" font-size="11" text-anchor="start" font-family="monospace">5 ms</text>
<text x="210" y="304" fill="#5f5f78" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">← 快　　　　　　对数值每格是 10 倍　　　　　　慢 →</text>
<line x1="210" y1="312" x2="730" y2="312" stroke="#2a2a3e" stroke-width="1"/>
<text x="40" y="340" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一次机械硬盘随机读 5 ms，在 3 GHz 的 CPU 眼里是 1500 万个时钟周期 —— 够算完一整个中等规模的排序。</text>
<text x="40" y="362" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「取了几次」比「算了几步」重要得多。算法在纸上比的是比较次数，在真机上比的是「几次没命中缓存」。</text>
<text x="40" y="384" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">SSD 把这个差距从 5 万倍压到 500 倍 —— 压小了，但没有消灭。改数据结构的形状，永远是省 IO 最划算的一招。</text>
</svg>
