<svg xmlns="http://www.w3.org/2000/svg" width="880" height="326" viewBox="0 0 880 326" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="326" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.4 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它说自己有多少储备（占储备总额的约数）</text>
<text x="30" y="104" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美国国债</text>
<rect x="190" y="88" width="521" height="22" rx="3" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<text x="721" y="104" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">79%</text>
<text x="30" y="144" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">现金和银行存款</text>
<rect x="190" y="128" width="52" height="22" rx="3" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<text x="252" y="144" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">8%</text>
<text x="30" y="184" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">担保贷款</text>
<rect x="190" y="168" width="33" height="22" rx="3" fill="#e8b84b" stroke="#e8b84b" stroke-width="0"/>
<text x="233" y="184" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5%</text>
<text x="30" y="224" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">公司债券等其他</text>
<rect x="190" y="208" width="26" height="22" rx="3" fill="#b58ae8" stroke="#b58ae8" stroke-width="0"/>
<text x="226" y="224" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4%</text>
<text x="30" y="264" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">其他资产</text>
<rect x="190" y="248" width="26" height="22" rx="3" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<text x="226" y="264" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4%</text>
<text x="24" y="306" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这是公司自己发布的储备报告口径，未经四大会计师事务所完整审计——这就是它最大的争议点。</text>
</svg>
