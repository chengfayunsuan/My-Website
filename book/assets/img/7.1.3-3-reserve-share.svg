<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="432" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.3-3  美元在全球外汇储备里的占比，2000—2024</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据来自 IMF 的 COFER 统计。注意它掉得很慢 —— 慢到「去美元化」说了二十年还是这个数</text>
<line x1="100" y1="326.0" x2="806" y2="326.0" stroke="#242434" stroke-width="1"/>
<text x="90" y="330.0" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">0%</text>
<line x1="100" y1="268.5" x2="806" y2="268.5" stroke="#242434" stroke-width="1"/>
<text x="90" y="272.5" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">20%</text>
<line x1="100" y1="211.0" x2="806" y2="211.0" stroke="#242434" stroke-width="1"/>
<text x="90" y="215.0" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">40%</text>
<line x1="100" y1="153.5" x2="806" y2="153.5" stroke="#242434" stroke-width="1"/>
<text x="90" y="157.5" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">60%</text>
<line x1="100" y1="96.0" x2="806" y2="96.0" stroke="#242434" stroke-width="1"/>
<text x="90" y="100.0" fill="#5f5f78" font-size="9" text-anchor="end" font-family="monospace">80%</text>
<line x1="100.0" y1="326" x2="100.0" y2="331" stroke="#3a3a52" stroke-width="1"/>
<text x="100.0" y="346" fill="#6f6f88" font-size="9" text-anchor="middle" font-family="monospace">2000</text>
<line x1="247.08333333333334" y1="326" x2="247.08333333333334" y2="331" stroke="#3a3a52" stroke-width="1"/>
<text x="247.08333333333334" y="346" fill="#6f6f88" font-size="9" text-anchor="middle" font-family="monospace">2005</text>
<line x1="394.1666666666667" y1="326" x2="394.1666666666667" y2="331" stroke="#3a3a52" stroke-width="1"/>
<text x="394.1666666666667" y="346" fill="#6f6f88" font-size="9" text-anchor="middle" font-family="monospace">2010</text>
<line x1="541.25" y1="326" x2="541.25" y2="331" stroke="#3a3a52" stroke-width="1"/>
<text x="541.25" y="346" fill="#6f6f88" font-size="9" text-anchor="middle" font-family="monospace">2015</text>
<line x1="688.3333333333334" y1="326" x2="688.3333333333334" y2="331" stroke="#3a3a52" stroke-width="1"/>
<text x="688.3333333333334" y="346" fill="#6f6f88" font-size="9" text-anchor="middle" font-family="monospace">2020</text>
<line x1="806.0" y1="326" x2="806.0" y2="331" stroke="#3a3a52" stroke-width="1"/>
<text x="806.0" y="346" fill="#6f6f88" font-size="9" text-anchor="middle" font-family="monospace">2024</text>
<path d="M100.0,121.6 L247.1,133.7 L394.2,147.5 L541.2,137.1 L688.3,156.7 L806.0,159.8" fill="none" stroke="#67b5ef" stroke-width="2.6"/>
<circle cx="100.0" cy="121.5875" r="3.6" fill="#67b5ef"/>
<circle cx="247.08333333333334" cy="133.6625" r="3.6" fill="#67b5ef"/>
<circle cx="394.1666666666667" cy="147.4625" r="3.6" fill="#67b5ef"/>
<circle cx="541.25" cy="137.11249999999998" r="3.6" fill="#67b5ef"/>
<circle cx="688.3333333333334" cy="156.66250000000002" r="3.6" fill="#67b5ef"/>
<circle cx="806.0" cy="159.82500000000002" r="3.6" fill="#67b5ef"/>
<text x="110.0" y="107.5875" fill="#67b5ef" font-size="11" text-anchor="start" font-family="monospace">71%</text>
<text x="800.0" y="145.82500000000002" fill="#67b5ef" font-size="11" text-anchor="end" font-family="monospace">58%</text>
<text x="570.6666666666666" y="104.625" fill="#7a7a94" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">二十四年</text>
<text x="570.6666666666666" y="121.625" fill="#7a7a94" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只掉了 13 个百分点</text>
<text x="40" y="382" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">掉得慢的原因不是美元太强，是替代品不够：欧元没有统一财政，人民币不能自由兑换，黄金装不下这么多钱。</text>
<text x="40" y="406" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「去美元化」在可预见的未来不是「美元崩了」，而是「美元占比再掉几个点」—— 这已经足够改变很多事。</text>
</svg>
