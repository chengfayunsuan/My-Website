<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="320" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.4.1 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一张借记卡的正面，能读出五样东西</text>
<rect x="46" y="78" width="400" height="214" rx="12" fill="#1b2438" stroke="#4a6a9a" stroke-width="1.6"/>
<rect x="64" y="172" width="296" height="32" rx="4" fill="none" stroke="#67b5ef" stroke-width="1.4"/>
<rect x="64" y="112" width="54" height="40" rx="4" fill="none" stroke="#e8b84b" stroke-width="1.4"/>
<rect x="280" y="212" width="72" height="26" rx="4" fill="none" stroke="#67d9a0" stroke-width="1.4"/>
<rect x="64" y="212" width="204" height="26" rx="4" fill="none" stroke="#b58ae8" stroke-width="1.4"/>
<rect x="324" y="88" width="106" height="34" rx="4" fill="none" stroke="#e8965a" stroke-width="1.4"/>
<text x="336" y="112" fill="#e8c58a" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">银 联</text>
<rect x="76" y="120" width="30" height="24" rx="2" fill="#c9a86a" stroke="#c9a86a" stroke-width="1"/>
<text x="70" y="196" fill="#e6e6f2" font-size="17" text-anchor="start" font-family="monospace">6222 0212 3456 7894</text>
<text x="72" y="232" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ZHOU ZIXIANG</text>
<text x="288" y="232" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">08/29</text>
<rect x="500" y="95" width="10" height="10" rx="2" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<text x="520" y="104" fill="#dcdcea" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡号 16 位</text>
<text x="520" y="121" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前 6 位认银行，最后 1 位防打错</text>
<rect x="500" y="139" width="10" height="10" rx="2" fill="#e8b84b" stroke="#e8b84b" stroke-width="0"/>
<text x="520" y="148" fill="#dcdcea" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">芯片</text>
<text x="520" y="165" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">插卡时读写的那块金属</text>
<rect x="500" y="183" width="10" height="10" rx="2" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<text x="520" y="192" fill="#dcdcea" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有效期</text>
<text x="520" y="209" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">月/年，网付时要用</text>
<rect x="500" y="227" width="10" height="10" rx="2" fill="#b58ae8" stroke="#b58ae8" stroke-width="0"/>
<text x="520" y="236" fill="#dcdcea" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">持卡人姓名</text>
<text x="520" y="253" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">拼音，转账对名用</text>
<rect x="500" y="271" width="10" height="10" rx="2" fill="#e8965a" stroke="#e8965a" stroke-width="0"/>
<text x="520" y="280" fill="#dcdcea" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡组织标志</text>
<text x="520" y="297" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">决定这张卡在哪能刷</text>
<text x="46" y="314" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡号凸印或平印都只是"印上去的"，真正记账靠的是磁条和芯片里存的数据。</text>
</svg>
