<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.3.2-1  最小 CPU 的数据通路</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">粗线是数据，细虚线是控制信号；下方那条回环让循环闭合</text>
<rect x="30" y="138" width="86" height="52" rx="4" fill="#181822" stroke="#e8965a" stroke-width="1.5"/>
<text x="73.0" y="161.0" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">PC</text>
<text x="73.0" y="178.0" fill="#8a8aa0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">程序计数器</text>
<rect x="158" y="138" width="112" height="52" rx="4" fill="#181822" stroke="#67b5ef" stroke-width="1.5"/>
<text x="214.0" y="161.0" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">指令存储器</text>
<text x="214.0" y="178.0" fill="#8a8aa0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">I-Cache</text>
<rect x="312" y="138" width="96" height="52" rx="4" fill="#181822" stroke="#b58ae8" stroke-width="1.5"/>
<text x="360.0" y="161.0" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">译码器</text>
<text x="360.0" y="178.0" fill="#8a8aa0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查表</text>
<rect x="450" y="118" width="92" height="92" rx="4" fill="#181822" stroke="#67d9a0" stroke-width="1.5"/>
<text x="496.0" y="161.0" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">寄存器堆</text>
<text x="496.0" y="178.0" fill="#8a8aa0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">16 个 × 64 位</text>
<rect x="582" y="138" width="92" height="62" rx="4" fill="#181822" stroke="#e8965a" stroke-width="1.5"/>
<text x="628.0" y="166.0" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">ALU</text>
<text x="628.0" y="183.0" fill="#8a8aa0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">加/逻辑/移位</text>
<rect x="714" y="118" width="106" height="92" rx="4" fill="#181822" stroke="#67b5ef" stroke-width="1.5"/>
<text x="767.0" y="161.0" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">数据存储器</text>
<text x="767.0" y="178.0" fill="#8a8aa0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">D-Cache</text>
<line x1="116" y1="164" x2="156" y2="164" stroke="#c8c8dc" stroke-width="2"/>
<path d="M156,164 L148.6,167.1 L148.6,160.9 Z" fill="#c8c8dc"/>
<line x1="270" y1="164" x2="310" y2="164" stroke="#c8c8dc" stroke-width="2"/>
<path d="M310,164 L302.6,167.1 L302.6,160.9 Z" fill="#c8c8dc"/>
<line x1="408" y1="164" x2="448" y2="164" stroke="#c8c8dc" stroke-width="2"/>
<path d="M448,164 L440.6,167.1 L440.6,160.9 Z" fill="#c8c8dc"/>
<line x1="542" y1="150" x2="580" y2="158" stroke="#c8c8dc" stroke-width="2"/>
<path d="M580,158 L572.1,159.5 L573.4,153.4 Z" fill="#c8c8dc"/>
<line x1="542" y1="186" x2="580" y2="178" stroke="#c8c8dc" stroke-width="2"/>
<path d="M580,178 L573.4,182.6 L572.1,176.5 Z" fill="#c8c8dc"/>
<line x1="674" y1="168" x2="712" y2="168" stroke="#c8c8dc" stroke-width="2"/>
<path d="M712,168 L704.6,171.1 L704.6,164.9 Z" fill="#c8c8dc"/>
<rect x="30" y="66" width="86" height="40" rx="3" fill="#1c1c2a" stroke="#4a4a62" stroke-width="1.2"/>
<text x="73" y="84" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="monospace">PC + 4</text>
<text x="73" y="99" fill="#8a8aa0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">或跳转目标</text>
<line x1="73" y1="138" x2="73" y2="108" stroke="#e8965a" stroke-width="1.8"/>
<path d="M73,108 L76.1,115.4 L69.9,115.4 Z" fill="#e8965a"/>
<line x1="30" y1="86" x2="14" y2="86" stroke="#e8965a" stroke-width="1.8"/>
<path d="M14,86 L21.4,82.9 L21.4,89.1 Z" fill="#e8965a"/>
<line x1="14" y1="86" x2="14" y2="164" stroke="#e8965a" stroke-width="1.8"/>
<line x1="14" y1="164" x2="28" y2="164" stroke="#e8965a" stroke-width="1.8"/>
<path d="M28,164 L20.6,167.1 L20.6,160.9 Z" fill="#e8965a"/>
<path d="M628,138 L628,92 L496,92 L496,116" fill="none" stroke="#e8b84b" stroke-width="1.8"/>
<path d="M496,116 L492.9,108.6 L499.1,108.6 Z" fill="#e8b84b"/>
<text x="650" y="86" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ALU 结果写回</text>
<path d="M767,210 L767,252 L496,252 L496,212" fill="none" stroke="#67d9a0" stroke-width="1.8"/>
<path d="M496,212 L499.1,219.4 L492.9,219.4 Z" fill="#67d9a0"/>
<text x="540" y="268" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">load 读到的数据写回（与上一路二选一）</text>
<line x1="360" y1="190" x2="360" y2="320" stroke="#b58ae8" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="52" y1="320" x2="800" y2="320" stroke="#b58ae8" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="364" y="340" fill="#b58ae8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">控制信号：写不写寄存器、ALU 做哪种运算、存储器读还是写、写回选哪一路</text>
<text x="24" y="386" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这张图里没有魔法：每一拍都是把某个值搬个地方，或者让 ALU 算一次。所谓「执行程序」，就是这张图重复几十亿次。</text>
</svg>
