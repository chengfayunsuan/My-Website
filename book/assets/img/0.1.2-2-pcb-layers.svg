<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">一块六层板的剖面：你看到的绿色只有 0.02 毫米厚，底下还压着五层</text>

  <!-- ===== 层叠 ===== -->
  <g font-family="monospace" font-size="10.5">
    <!-- L1 -->
    <rect x="120" y="58" width="420" height="24" fill="#12301f" stroke="#4ec9a3" stroke-width="1.2"/>
    <g stroke="#4ec9a3" stroke-width="2.4" stroke-linecap="round">
      <line x1="140" y1="70" x2="200" y2="70"/><line x1="200" y1="70" x2="215" y2="62"/>
      <line x1="215" y1="62" x2="260" y2="62"/><line x1="300" y1="70" x2="380" y2="70"/>
      <line x1="420" y1="70" x2="470" y2="70"/><line x1="470" y1="70" x2="485" y2="78"/>
      <line x1="485" y1="78" x2="520" y2="78"/>
    </g>
    <text x="106" y="73" fill="#4ec9a3" text-anchor="end">L1 信号</text>
    <text x="552" y="73" fill="#4a7f68" font-size="9.5">顶层走线 + 绿色阻焊</text>

    <!-- L2 -->
    <rect x="120" y="89" width="420" height="18" fill="#1a2436" stroke="#67b5ef" stroke-width="1.2"/>
    <line x1="130" y1="98" x2="530" y2="98" stroke="#67b5ef" stroke-opacity="0.4" stroke-width="1"/>
    <text x="106" y="102" fill="#67b5ef" text-anchor="end">L2 地</text>
    <text x="552" y="102" fill="#4a6a86" font-size="9.5">一整片铜，全板 0V 参考</text>

    <!-- L3 -->
    <rect x="120" y="114" width="420" height="24" fill="#12301f" stroke="#4ec9a3" stroke-width="1.2"/>
    <g stroke="#4ec9a3" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85">
      <line x1="150" y1="126" x2="240" y2="126"/><line x1="240" y1="126" x2="255" y2="134"/>
      <line x1="255" y1="134" x2="320" y2="134"/><line x1="360" y1="126" x2="440" y2="126"/>
      <line x1="440" y1="126" x2="455" y2="118"/><line x1="455" y1="118" x2="510" y2="118"/>
    </g>
    <text x="106" y="129" fill="#4ec9a3" text-anchor="end">L3 信号</text>
    <text x="552" y="129" fill="#4a7f68" font-size="9.5">看不见的内层，走线密度最高</text>

    <!-- L4 -->
    <rect x="120" y="145" width="420" height="18" fill="#2c1d12" stroke="#e8b84b" stroke-width="1.2"/>
    <line x1="130" y1="154" x2="530" y2="154" stroke="#e8b84b" stroke-opacity="0.4" stroke-width="1"/>
    <text x="106" y="158" fill="#e8b84b" text-anchor="end">L4 电源</text>
    <text x="552" y="158" fill="#8a7440" font-size="9.5">整片铜，被切成好几块不同电压</text>

    <!-- L5 -->
    <rect x="120" y="170" width="420" height="18" fill="#1a2436" stroke="#67b5ef" stroke-width="1.2"/>
    <line x1="130" y1="179" x2="530" y2="179" stroke="#67b5ef" stroke-opacity="0.4" stroke-width="1"/>
    <text x="106" y="183" fill="#67b5ef" text-anchor="end">L5 地</text>
    <text x="552" y="183" fill="#4a6a86" font-size="9.5">再一整片铜，把 L4 夹在中间</text>

    <!-- L6 -->
    <rect x="120" y="195" width="420" height="24" fill="#12301f" stroke="#4ec9a3" stroke-width="1.2"/>
    <g stroke="#4ec9a3" stroke-width="2.4" stroke-linecap="round">
      <line x1="140" y1="207" x2="210" y2="207"/><line x1="210" y1="207" x2="225" y2="215"/>
      <line x1="225" y1="215" x2="290" y2="215"/><line x1="330" y1="207" x2="410" y2="207"/>
      <line x1="450" y1="207" x2="500" y2="207"/>
    </g>
    <text x="106" y="210" fill="#4ec9a3" text-anchor="end">L6 信号</text>
    <text x="552" y="210" fill="#4a7f68" font-size="9.5">底层走线，插槽的针都焊在这面</text>
  </g>

  <!-- 总厚度（移到最左，避开标签） -->
  <g stroke="#5f5f7a" stroke-width="1">
    <line x1="44" y1="58" x2="44" y2="219"/>
    <line x1="39" y1="58" x2="49" y2="58"/><line x1="39" y1="219" x2="49" y2="219"/>
  </g>
  <text x="30" y="138" fill="#5f5f7a" font-size="9.5" text-anchor="middle" font-family="monospace" transform="rotate(-90 30 138)">整板 1.6 mm</text>

  <!-- ===== 左：过孔 ===== -->
  <text x="24" y="262" fill="#c8c8d8" font-size="11.5" font-weight="bold">过孔：一条线要换层，就得打个洞</text>

  <g>
    <rect x="24" y="300" width="252" height="18" fill="#12301f" stroke="#4ec9a3" stroke-width="1.1"/>
    <rect x="24" y="326" width="252" height="14" fill="#1a2436" stroke="#67b5ef" stroke-width="1.1"/>
    <rect x="24" y="348" width="252" height="18" fill="#12301f" stroke="#4ec9a3" stroke-width="1.1"/>
    <text x="18" y="313" fill="#4ec9a3" font-size="9.5" text-anchor="end" font-family="monospace">L1</text>
    <text x="18" y="337" fill="#67b5ef" font-size="9.5" text-anchor="end" font-family="monospace">L2</text>
    <text x="18" y="361" fill="#4ec9a3" font-size="9.5" text-anchor="end" font-family="monospace">L3</text>

    <!-- 焊盘 -->
    <rect x="128" y="296" width="44" height="8" rx="2" fill="#c8a060"/>
    <!-- 孔 -->
    <rect x="142" y="296" width="16" height="70" fill="#0e0e16"/>
    <rect x="140" y="296" width="4" height="70" fill="#c8a060"/>
    <rect x="156" y="296" width="4" height="70" fill="#c8a060"/>
    <!-- L2 反焊盘 -->
    <rect x="132" y="320" width="36" height="26" fill="#0e0e16"/>
    <ellipse cx="150" cy="333" rx="18" ry="5" fill="#0e0e16" stroke="#8a6a3a" stroke-width="0.8" stroke-dasharray="3 2"/>
    <!-- 底层焊盘 -->
    <rect x="128" y="358" width="44" height="8" rx="2" fill="#c8a060"/>

    <!-- 右侧标注 -->
    <text x="292" y="298" fill="#c8a060" font-size="9.5" font-family="monospace">焊盘 pad</text>
    <text x="292" y="333" fill="#e08a4b" font-size="9.5" font-family="monospace">反焊盘</text>
    <text x="292" y="348" fill="#8a6a3a" font-size="9" font-family="monospace">穿过地平面要挖空</text>
    <text x="292" y="368" fill="#c8a060" font-size="9.5" font-family="monospace">镀铜孔壁</text>
    <text x="292" y="382" fill="#8a6a3a" font-size="9" font-family="monospace">孔壁导电，两层才通</text>

    <text x="24" y="400" fill="#8a8aa4" font-size="9.8">孔壁要镀铜，所以过孔不是钻完就算。</text>
    <text x="24" y="416" fill="#8a8aa4" font-size="9.8">代价是：这个洞让高速信号的阻抗突然变了一下，</text>
    <text x="24" y="432" fill="#8a8aa4" font-size="9.8">所以高速线尽量少换层。一条 PCIe 走线换四次层，</text>
    <text x="24" y="448" fill="#8a8aa4" font-size="9.8">眼图就已经开始糊了。</text>
  </g>

  <!-- 分隔 -->
  <line x1="384" y1="248" x2="384" y2="458" stroke="#2a2a44" stroke-width="1"/>

  <!-- ===== 右：蛇形等长 ===== -->
  <text x="402" y="262" fill="#c8c8d8" font-size="11.5" font-weight="bold">蛇形线：为什么要故意绕远路</text>

  <path d="M402,300 H 706" stroke="#6b6b85" stroke-width="2" fill="none"/>
  <text x="402" y="292" fill="#8a8aa4" font-size="9.5" font-family="monospace">线 A（直着走）</text>

  <path d="M402,340 H 428 q 8,-14 16,0 q 8,14 16,0 q 8,-14 16,0 q 8,14 16,0 q 8,-14 16,0 q 8,14 16,0 q 8,-14 16,0 q 8,14 16,0 q 8,-14 16,0 q 8,14 16,0 H 706"
        stroke="#9b4df0" stroke-width="2" fill="none"/>
  <text x="402" y="366" fill="#9b4df0" font-size="9.5" font-family="monospace">线 B（绕了一串弯，长度补上）</text>

  <line x1="402" y1="378" x2="706" y2="378" stroke="#4ec9a3" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="402" y="396" fill="#4ec9a3" font-size="9.5" font-family="monospace">两线等长 → 前沿同时到达接收端</text>

  <text x="402" y="420" fill="#8a8aa4" font-size="9.8">并行总线的每一条都要这样配平，</text>
  <text x="402" y="436" fill="#8a8aa4" font-size="9.8">否则第 0 位和第 7 位会差几百皮秒，</text>
  <text x="402" y="452" fill="#8a8aa4" font-size="9.8">采样时就可能读到半新半旧的字节。</text>
</svg>
