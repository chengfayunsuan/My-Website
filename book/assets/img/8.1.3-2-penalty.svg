<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="400" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">无证经营被抓到，罚多少钱</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同样是「没证就干」，罚则差几十倍，看你的行业风险等级</text>
<rect x="24" y="70" width="712" height="78" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.3"/>
<text x="44" y="96" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">一般情形</text>
<text x="44" y="120" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">责令停止违法行为，没收违法所得，处 1 万元以下罚款</text>
<text x="44" y="138" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">适用于不涉及健康、安全、环境的一般经营项目</text>
<rect x="24" y="160" width="712" height="78" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.3"/>
<text x="44" y="186" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">危害健康、重大安全隐患、破坏环境</text>
<text x="44" y="210" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没收违法所得，处 5 万元以上 50 万元以下罚款</text>
<text x="44" y="228" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">食品、药品、危化品、特种设备，基本都在这档</text>
<rect x="24" y="250" width="712" height="78" rx="6" fill="#16161f" stroke="#e87a8a" stroke-width="1.3"/>
<text x="44" y="276" fill="#e87a8a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">情节严重或造成事故</text>
<text x="44" y="300" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">责令停业、吊销许可证；构成犯罪追刑责（非法经营罪等）</text>
<text x="44" y="318" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">而且「无证经营期间签的合同」可能被认定无效，钱也收不回来</text>
<text x="380" y="360" fill="#e8965a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">食品类的特别罚则：货值不足 1 万罚 5~10 万；货值 1 万以上罚货值 10~20 倍</text>
<text x="380" y="382" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">也就是说，卖 200 块钱没证的自制糕点，可能被罚 5 万</text>
</svg>
