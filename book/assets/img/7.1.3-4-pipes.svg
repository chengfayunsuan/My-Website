<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="396" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.3-4  石油美元去了哪儿：三条回流管道</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">比例是量级估计，不同年份、不同国家差别很大，但方向是稳定的</text>
<text x="302" y="136" fill="#e8b84b" font-size="10.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">买美国国债</text>
<text x="302" y="154" fill="#6f6f88" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最安全、最好卖，随时能变现</text>
<rect x="320" y="116" width="380.0" height="44" rx="3" fill="#2a2410" stroke="#e8b84b" stroke-width="1.2"/>
<text x="688.0" y="144" fill="#e8b84b" font-size="11" text-anchor="end" font-family="monospace">约 40%</text>
<text x="302" y="212" fill="#67b5ef" font-size="10.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">存进西方银行</text>
<text x="302" y="230" fill="#6f6f88" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欧洲美元市场，随时能调动</text>
<rect x="320" y="192" width="285.0" height="44" rx="3" fill="#1a2434" stroke="#67b5ef" stroke-width="1.2"/>
<text x="593.0" y="220" fill="#67b5ef" font-size="11" text-anchor="end" font-family="monospace">约 30%</text>
<text x="302" y="288" fill="#67d9a0" font-size="10.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">买股票、房地产、主权基金</text>
<text x="302" y="306" fill="#6f6f88" font-size="8.2" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收益高，但不好快速变现</text>
<rect x="320" y="268" width="285.0" height="44" rx="3" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="593.0" y="296" fill="#67d9a0" font-size="11" text-anchor="end" font-family="monospace">约 30%</text>
<text x="40" y="344" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三条管道的作用都一样：把出口国手里的美元送回美国金融市场。区别只在流动性 —— 国债随时能卖，房地产卖不掉。</text>
<text x="40" y="368" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以危机一来，钱会从第三条管道涌向第一条：股票和房子卖不掉，只能卖国债换现金。这就是「避险买美债」的机制。</text>
</svg>
