<svg width="880" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="480" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.4.3-2  静态与动态的内存账</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个 libc，装 50 份还是装 1 份</text>
<text x="56" y="92" fill="#cfc6ff" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">静态链接</text>
<text x="56" y="110" fill="#5f5f78" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每个程序自己带一份库</text>
<rect x="56" y="130" width="236" height="70" rx="4" fill="#14141f" stroke="#33334a" stroke-width="1.2"/>
<text x="68" y="150" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="monospace">prog_a</text>
<rect x="68" y="160" width="62" height="26" rx="2" fill="#1c1c2c" stroke="#3a3a52" stroke-width="1"/>
<text x="99" y="177" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">code</text>
<rect x="140" y="160" width="112" height="26" rx="2" fill="#2d4a66" stroke="#67b5ef" stroke-width="1"/>
<text x="196" y="177" fill="#b8d8f0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">libc 副本</text>
<rect x="56" y="216" width="236" height="70" rx="4" fill="#14141f" stroke="#33334a" stroke-width="1.2"/>
<text x="68" y="236" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="monospace">prog_b</text>
<rect x="68" y="246" width="62" height="26" rx="2" fill="#1c1c2c" stroke="#3a3a52" stroke-width="1"/>
<text x="99" y="263" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">code</text>
<rect x="140" y="246" width="112" height="26" rx="2" fill="#33526f" stroke="#67b5ef" stroke-width="1"/>
<text x="196" y="263" fill="#b8d8f0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">libc 副本</text>
<rect x="56" y="302" width="236" height="70" rx="4" fill="#14141f" stroke="#33334a" stroke-width="1.2"/>
<text x="68" y="322" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="monospace">prog_c</text>
<rect x="68" y="332" width="62" height="26" rx="2" fill="#1c1c2c" stroke="#3a3a52" stroke-width="1"/>
<text x="99" y="349" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">code</text>
<rect x="140" y="332" width="112" height="26" rx="2" fill="#2a4460" stroke="#67b5ef" stroke-width="1"/>
<text x="196" y="349" fill="#b8d8f0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">libc 副本</text>
<text x="56" y="392" fill="#e87a8a" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">磁盘 6 MB　内存 6 MB　三个不同的物理页</text>
<text x="56" y="409" fill="#4e4e66" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">改一个库，三个程序都得重编重发</text>
<line x1="420" y1="84" x2="420" y2="420" stroke="#26263a" stroke-width="1" stroke-dasharray="4 6"/>
<text x="470" y="92" fill="#cfc6ff" font-size="13" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">动态链接</text>
<text x="470" y="110" fill="#5f5f78" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">库只有一份，谁用谁映射</text>
<rect x="470" y="130" width="176" height="70" rx="4" fill="#14141f" stroke="#33334a" stroke-width="1.2"/>
<text x="482" y="150" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="monospace">prog_a</text>
<rect x="482" y="160" width="62" height="26" rx="2" fill="#1c1c2c" stroke="#3a3a52" stroke-width="1"/>
<text x="513" y="177" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">code</text>
<text x="640" y="177" fill="#67d9a0" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 页表</text>
<line x1="648" y1="173" x2="706" y2="240" stroke="#2e6a4e" stroke-width="1.1"/>
<rect x="470" y="216" width="176" height="70" rx="4" fill="#14141f" stroke="#33334a" stroke-width="1.2"/>
<text x="482" y="236" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="monospace">prog_b</text>
<rect x="482" y="246" width="62" height="26" rx="2" fill="#1c1c2c" stroke="#3a3a52" stroke-width="1"/>
<text x="513" y="263" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">code</text>
<text x="640" y="263" fill="#67d9a0" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 页表</text>
<line x1="648" y1="259" x2="706" y2="240" stroke="#2e6a4e" stroke-width="1.1"/>
<rect x="470" y="302" width="176" height="70" rx="4" fill="#14141f" stroke="#33334a" stroke-width="1.2"/>
<text x="482" y="322" fill="#9a9ab4" font-size="10" text-anchor="start" font-family="monospace">prog_c</text>
<rect x="482" y="332" width="62" height="26" rx="2" fill="#1c1c2c" stroke="#3a3a52" stroke-width="1"/>
<text x="513" y="349" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="monospace">code</text>
<text x="640" y="349" fill="#67d9a0" font-size="9" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">→ 页表</text>
<line x1="648" y1="345" x2="706" y2="240" stroke="#2e6a4e" stroke-width="1.1"/>
<rect x="710" y="176" width="132" height="128" rx="4" fill="#1a3a2c" stroke="#67d9a0" stroke-width="1.4"/>
<text x="776" y="200" fill="#9ae8c0" font-size="10" text-anchor="middle" font-family="monospace">libc.so.6</text>
<text x="776" y="218" fill="#6a8a7a" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个物理页</text>
<text x="776" y="240" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只读</text>
<text x="776" y="262" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">位置无关</text>
<text x="776" y="286" fill="#6a8a7a" font-size="9" text-anchor="middle" font-family="monospace">2 MB</text>
<text x="470" y="392" fill="#67d9a0" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">磁盘 2 MB　内存 2 MB（外加每进程私有的数据页）</text>
<text x="470" y="409" fill="#4e4e66" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换一个 .so，三个程序一起修好</text>
<rect x="36" y="428" width="808" height="34" rx="4" fill="#12121c" stroke="#26263a" stroke-width="1"/>
<text x="52" y="450" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">省下的是内存和磁盘，付出的是「运行时装配」——依赖、路径、版本，任何一环对不上就起不来。</text>
</svg>
