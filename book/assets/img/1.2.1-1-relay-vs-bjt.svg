<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs><marker id="r1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#8a8aa0"/></marker></defs>
  <rect width="760" height="352" fill="#0e0e16"/>
  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">继电器和晶体管：同一个想法，隔了七十年的两种实现</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">都是「用一个小信号，去控制一个大电流」，区别只在于中间那一步靠什么完成</text>
  <text x="24" y="86" fill="#e8c47a" font-size="10">继电器（1835）</text>
  <text x="24" y="196" fill="#9fe0c9" font-size="10">晶体管（1947）</text>
  <rect x="60" y="96" width="140" height="54" rx="5" fill="#241d14" stroke="#8a6a3a"/>
  <text x="130" y="120" fill="#d8d8e4" font-size="9" text-anchor="middle">小电流</text>
  <text x="130" y="137" fill="#7f7f95" font-size="7.5" text-anchor="middle">几毫安</text>
  <line x1="202" y1="123" x2="222" y2="123" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#r1)"/>
  <rect x="224" y="96" width="140" height="54" rx="5" fill="#241d14" stroke="#8a6a3a"/>
  <text x="294" y="120" fill="#d8d8e4" font-size="9" text-anchor="middle">线圈产生磁场</text>
  <text x="294" y="137" fill="#7f7f95" font-size="7.5" text-anchor="middle">电磁铁</text>
  <line x1="366" y1="123" x2="386" y2="123" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#r1)"/>
  <rect x="388" y="96" width="140" height="54" rx="5" fill="#241d14" stroke="#8a6a3a"/>
  <text x="458" y="120" fill="#d8d8e4" font-size="9" text-anchor="middle">衔铁被吸合</text>
  <text x="458" y="137" fill="#7f7f95" font-size="7.5" text-anchor="middle">机械动作</text>
  <line x1="530" y1="123" x2="550" y2="123" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#r1)"/>
  <rect x="552" y="96" width="140" height="54" rx="5" fill="#241d14" stroke="#8a6a3a"/>
  <text x="622" y="120" fill="#d8d8e4" font-size="9" text-anchor="middle">触点接通</text>
  <text x="622" y="137" fill="#7f7f95" font-size="7.5" text-anchor="middle">大电流通过</text>
  <rect x="60" y="206" width="140" height="54" rx="5" fill="#16241f" stroke="#3a6a5a"/>
  <text x="130" y="230" fill="#d8d8e4" font-size="9" text-anchor="middle">小电流</text>
  <text x="130" y="247" fill="#7f7f95" font-size="7.5" text-anchor="middle">几微安</text>
  <line x1="202" y1="233" x2="222" y2="233" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#r1)"/>
  <rect x="224" y="206" width="140" height="54" rx="5" fill="#16241f" stroke="#3a6a5a"/>
  <text x="294" y="230" fill="#d8d8e4" font-size="9" text-anchor="middle">基极注入载流子</text>
  <text x="294" y="247" fill="#7f7f95" font-size="7.5" text-anchor="middle">半导体</text>
  <line x1="366" y1="233" x2="386" y2="233" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#r1)"/>
  <rect x="388" y="206" width="140" height="54" rx="5" fill="#16241f" stroke="#3a6a5a"/>
  <text x="458" y="230" fill="#d8d8e4" font-size="9" text-anchor="middle">集电结导通</text>
  <text x="458" y="247" fill="#7f7f95" font-size="7.5" text-anchor="middle">电学动作</text>
  <line x1="530" y1="233" x2="550" y2="233" stroke="#8a8aa0" stroke-width="1.2" marker-end="url(#r1)"/>
  <rect x="552" y="206" width="140" height="54" rx="5" fill="#16241f" stroke="#3a6a5a"/>
  <text x="622" y="230" fill="#d8d8e4" font-size="9" text-anchor="middle">集电极流出</text>
  <text x="622" y="247" fill="#7f7f95" font-size="7.5" text-anchor="middle">大电流通过</text>
  <line x1="30" y1="164" x2="700" y2="164" stroke="#2a2a3c" stroke-dasharray="4 4"/>
  <line x1="30" y1="286" x2="730" y2="286" stroke="#2a2a3c"/>
  <text x="30" y="306" fill="#d8d8e4" font-size="9">区别在第三步：继电器靠「机械吸合」，每秒最多几万次；晶体管靠「载流子渡越」，每秒能上几十亿次。</text>
  <text x="30" y="324" fill="#9a9ab4" font-size="8.5">而且机械触点会磨损、会打火、会粘死——这三个毛病，注定了继电器只能做电报和电话交换机，做不了计算机。</text>
  <text x="30" y="342" fill="#6b6b85" font-size="8.5">顺带说：最早的计算机确实用过继电器（Zuse Z3，1941），每秒只能算几次，一台机器用掉两千多个继电器。</text>
</svg>