<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">8.5.5-2 / 为什么能收短信，却收不到验证码</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">短代码走的是另一条路，虚拟号段不在那张路由表里</text>
<rect x="40" y="96" width="110" height="56" rx="6" fill="#1a1a28" stroke="#3a3a52" stroke-width="1.2"/>
<text x="95.0" y="119" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行系统</text>
<text x="95.0" y="137" fill="#6a6a84" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发 5 位短代码</text>
<rect x="200" y="96" width="110" height="56" rx="6" fill="#1a1a28" stroke="#3a3a52" stroke-width="1.2"/>
<text x="255.0" y="119" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">A2P 网关</text>
<text x="255.0" y="137" fill="#6a6a84" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Twilio / Bandwidth</text>
<rect x="360" y="96" width="110" height="56" rx="6" fill="#1a1a28" stroke="#3a3a52" stroke-width="1.2"/>
<text x="415.0" y="119" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">运营商路由表</text>
<text x="415.0" y="137" fill="#6a6a84" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查号段归属</text>
<rect x="520" y="96" width="110" height="56" rx="6" fill="#16241c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="575.0" y="119" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的手机</text>
<line x1="150" y1="124" x2="200" y2="124" stroke="#67d9a0" stroke-width="2"/>
<line x1="310" y1="124" x2="360" y2="124" stroke="#67d9a0" stroke-width="2"/>
<line x1="470" y1="124" x2="520" y2="124" stroke="#67d9a0" stroke-width="2"/>
<rect x="40" y="224" width="110" height="56" rx="6" fill="#1a1a28" stroke="#3a3a52" stroke-width="1"/>
<text x="95.0" y="247" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一封短信</text>
<rect x="200" y="224" width="110" height="56" rx="6" fill="#1a1a28" stroke="#3a3a52" stroke-width="1"/>
<text x="255.0" y="247" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">A2P 网关</text>
<text x="255.0" y="265" fill="#6a6a84" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">照常投递</text>
<rect x="360" y="224" width="110" height="56" rx="6" fill="#1a1a28" stroke="#3a3a52" stroke-width="1"/>
<text x="415.0" y="247" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">运营商路由表</text>
<text x="415.0" y="265" fill="#6a6a84" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">VoIP 号段不在表里</text>
<line x1="150" y1="252" x2="200" y2="252" stroke="#e87a8a" stroke-width="2"/>
<line x1="310" y1="252" x2="360" y2="252" stroke="#e87a8a" stroke-width="2"/>
<line x1="470" y1="252" x2="500" y2="252" stroke="#e87a8a" stroke-width="2" stroke-dasharray="3 3"/>
<line x1="497" y1="237" x2="527" y2="267" stroke="#e87a8a" stroke-width="2.4"/>
<line x1="527" y1="237" x2="497" y2="267" stroke="#e87a8a" stroke-width="2.4"/>
<text x="536" y="248" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">丢弃</text>
<text x="536" y="266" fill="#8a6a72" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">无回执</text>
<text x="24" y="124" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="monospace">实号</text>
<text x="24" y="252" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="monospace">虚拟号</text>
<text x="24" y="330" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">短代码（5~6 位）只走运营商自己的 A2P 通道，投递前要查号段归属。</text>
<text x="24" y="352" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">VoIP 号段、虚拟号、部分 MVNO 号段不在那个表里，短信在运营商那里被丢掉——</text>
<text x="24" y="374" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不报错，不退回，发信方那边显示“已发送”。这是最难查的一种失败。</text>
<text x="24" y="404" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以判断一条号能不能用，不看“能不能收到我自己发的短信”，</text>
<text x="24" y="424" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要看它能不能收到银行或支付平台的验证码——那才是短代码。</text>
</svg>
