<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="404" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.2 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一类、二类、三类：同一张身份证，三种权限</text>
<rect x="24" y="76" width="832" height="38" rx="5" fill="#1c1c2a" stroke="#3a3a52" stroke-width="1.2"/>
<text x="40" y="100" fill="#9a9ab4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对比项</text>
<text x="250" y="100" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一类户</text>
<text x="480" y="100" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">二类户</text>
<text x="690" y="100" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三类户</text>
<line x1="24" y1="114" x2="856" y2="114" stroke="#26263a" stroke-width="1"/>
<text x="40" y="146" fill="#e0e0ec" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">怎么开</text>
<text x="250" y="146" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">必须去柜台</text>
<text x="480" y="146" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">手机银行可开</text>
<text x="690" y="146" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">手机银行可开</text>
<line x1="24" y1="156" x2="856" y2="156" stroke="#26263a" stroke-width="1"/>
<text x="40" y="188" fill="#e0e0ec" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">实体卡</text>
<text x="250" y="188" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有</text>
<text x="480" y="188" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可配</text>
<text x="690" y="188" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有</text>
<line x1="24" y1="198" x2="856" y2="198" stroke="#26263a" stroke-width="1"/>
<text x="40" y="230" fill="#e0e0ec" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">日累计</text>
<text x="250" y="230" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不限</text>
<text x="480" y="230" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1 万元</text>
<text x="690" y="230" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2000 元</text>
<line x1="24" y1="240" x2="856" y2="240" stroke="#26263a" stroke-width="1"/>
<text x="40" y="272" fill="#e0e0ec" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">年累计</text>
<text x="250" y="272" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不限</text>
<text x="480" y="272" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">20 万元</text>
<text x="690" y="272" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">—</text>
<line x1="24" y1="282" x2="856" y2="282" stroke="#26263a" stroke-width="1"/>
<text x="40" y="314" fill="#e0e0ec" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">余额上限</text>
<text x="250" y="314" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不限</text>
<text x="480" y="314" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不限</text>
<text x="690" y="314" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2000 元</text>
<line x1="24" y1="324" x2="856" y2="324" stroke="#26263a" stroke-width="1"/>
<text x="40" y="356" fill="#e0e0ec" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能干什么</text>
<text x="250" y="356" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全部功能</text>
<text x="480" y="356" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">消费、理财、缴费</text>
<text x="690" y="356" fill="#bfbfd2" font-size="10.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">小额消费、缴费</text>
<line x1="24" y1="366" x2="856" y2="366" stroke="#26263a" stroke-width="1"/>
<text x="24" y="392" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数字为现行规定的大致口径，各行执行细节可能略有差异；「—」表示不设该项。</text>
</svg>
