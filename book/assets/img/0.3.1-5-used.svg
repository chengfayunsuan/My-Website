<svg width="760" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="470" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">二手：哪些是捡漏，哪些是接盘</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">横轴是能省多少，纵轴是踩坑风险。左上角最划算，右下角最不划算</text>

  <!-- 轴 -->
  <line x1="80" y1="380" x2="712" y2="380" stroke="#4a4a68"/>
  <line x1="80" y1="90" x2="80" y2="380" stroke="#4a4a68"/>
  <text x="400" y="404" fill="#9a9ab4" font-size="9" text-anchor="middle">能省多少钱 →</text>
  <text x="86" y="82" fill="#9a9ab4" font-size="9">风险</text>

  <!-- 象限 -->
  <line x1="390" y1="90" x2="390" y2="380" stroke="#2a2a44" stroke-dasharray="5 4"/>
  <line x1="80" y1="235" x2="712" y2="235" stroke="#2a2a44" stroke-dasharray="5 4"/>
  <text x="96" y="110" fill="#f0606a" font-size="8.5">省不了多少，还要冒险</text>
  <text x="700" y="110" fill="#e8b84b" font-size="8.5" text-anchor="end">省得多，但赌一把</text>
  <text x="96" y="372" fill="#6b6b85" font-size="8.5">省钱少、风险也低，意义不大</text>
  <text x="700" y="372" fill="#4ec9a3" font-size="8.5" text-anchor="end">最划算的区域</text>

  <!-- 点 -->
  <g>
    <circle cx="514" cy="351" r="6" fill="#4ec9a3"/>
    <text x="526" y="355" fill="#9fe0c9" font-size="9">CPU</text>

    <circle cx="452" cy="351" r="6" fill="#4ec9a3"/>
    <text x="440" y="368" fill="#9fe0c9" font-size="9" text-anchor="end">内存</text>

    <circle cx="514" cy="366" r="6" fill="#4ec9a3"/>
    <text x="526" y="370" fill="#9fe0c9" font-size="9">机箱</text>

    <circle cx="356" cy="312" r="6" fill="#67b5ef"/>
    <text x="368" y="316" fill="#9fd4f5" font-size="9">显示器</text>

    <circle cx="246" cy="272" r="6" fill="#67b5ef"/>
    <text x="234" y="268" fill="#9fd4f5" font-size="9" text-anchor="end">显卡（非矿）</text>

    <circle cx="266" cy="235" r="6" fill="#e8b84b"/>
    <text x="278" y="232" fill="#e8b84b" font-size="9">固态</text>

    <circle cx="390" cy="221" r="6" fill="#e8b84b"/>
    <text x="402" y="218" fill="#e8b84b" font-size="9">主板</text>

    <circle cx="328" cy="206" r="6" fill="#e8b84b"/>
    <text x="340" y="202" fill="#e8b84b" font-size="9">电源</text>

    <circle cx="266" cy="192" r="6" fill="#e8b84b"/>
    <text x="278" y="188" fill="#e8b84b" font-size="9">水冷</text>

    <circle cx="607" cy="134" r="7" fill="#f0606a"/>
    <text x="619" y="130" fill="#f0606a" font-size="9.5">矿卡</text>
    <text x="619" y="146" fill="#6b6b85" font-size="8">只有三分之一价才值</text>
  </g>

  <!-- 说明 -->
  <line x1="24" y1="424" x2="736" y2="424" stroke="#2a2a44"/>
  <text x="24" y="444" fill="#e8b84b" font-size="9">判断标准只有一个：它是「几乎不会坏」，还是「老化后不稳」，还是「随时可能崩」。</text>
  <text x="24" y="464" fill="#6b6b85" font-size="8.5">风险越不可预测，越要压价——而不是「反正便宜，赌一把」。</text>
</svg>
