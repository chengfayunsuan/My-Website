<svg width="760" height="540" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6b6b85"/>
    </marker>
  </defs>

  <rect width="760" height="540" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">机箱侧板打开（俯视示意）：六件东西，位置固定，分工互不重叠</text>

  <!-- 机箱外框 -->
  <rect x="24" y="42" width="712" height="470" rx="10" fill="#0a0a11" stroke="#3a3a5c" stroke-width="1.4"/>
  <text x="38" y="60" fill="#4f4f6e" font-size="11" font-family="monospace">机箱内部</text>

  <!-- 前面板 -->
  <rect x="24" y="42" width="26" height="470" fill="#101018" stroke="#2a2a44"/>
  <text x="37" y="300" fill="#4f4f6e" font-size="10.5" text-anchor="middle" transform="rotate(-90 37 300)">机箱前面板</text>

  <!-- ============ 主板 ============ -->
  <rect x="268" y="66" width="446" height="352" rx="6" fill="#15151f" stroke="#3a3a5c" stroke-width="1.2"/>
  <text x="278" y="84" fill="#6b6b85" font-size="11.5" font-family="monospace">主板 MOTHERBOARD</text>

  <!-- CPU 插座 + 散热器 -->
  <rect x="322" y="108" width="118" height="118" rx="6" fill="#1d1d30" stroke="#9b4df0" stroke-width="1.4"/>
  <circle cx="381" cy="167" r="42" fill="none" stroke="#9b4df0" stroke-opacity="0.35"/>
  <circle cx="381" cy="167" r="30" fill="none" stroke="#9b4df0" stroke-opacity="0.22"/>
  <g stroke="#9b4df0" stroke-opacity="0.35">
    <line x1="381" y1="125" x2="381" y2="209"/>
    <line x1="339" y1="167" x2="423" y2="167"/>
    <line x1="351" y1="137" x2="411" y2="197"/>
    <line x1="411" y1="137" x2="351" y2="197"/>
  </g>
  <text x="381" y="240" fill="#cfc6ff" font-size="12.5" text-anchor="middle">CPU + 散热器</text>

  <!-- 内存条 4 根 -->
  <g>
    <rect x="540" y="96" width="26" height="176" rx="3" fill="#16202b" stroke="#67b5ef" stroke-width="1.2"/>
    <rect x="574" y="96" width="26" height="176" rx="3" fill="#16202b" stroke="#67b5ef" stroke-width="1.2"/>
    <rect x="608" y="96" width="26" height="176" rx="3" fill="#16202b" stroke="#67b5ef" stroke-opacity="0.45"/>
    <rect x="642" y="96" width="26" height="176" rx="3" fill="#16202b" stroke="#67b5ef" stroke-opacity="0.45"/>
  </g>
  <text x="604" y="290" fill="#a8d4f5" font-size="12.5" text-anchor="middle">内存条</text>

  <!-- 芯片组 PCH -->
  <rect x="330" y="300" width="86" height="70" rx="5" fill="#1a1a26" stroke="#6b6b85" stroke-width="1.1"/>
  <text x="373" y="330" fill="#9a9ab4" font-size="11.5" text-anchor="middle">芯片组</text>
  <text x="373" y="347" fill="#6b6b85" font-size="10" text-anchor="middle" font-family="monospace">PCH</text>

  <!-- 显卡 -->
  <rect x="470" y="330" width="228" height="56" rx="5" fill="#241f14" stroke="#e8b84b" stroke-width="1.3"/>
  <circle cx="512" cy="358" r="17" fill="none" stroke="#e8b84b" stroke-opacity="0.5"/>
  <circle cx="556" cy="358" r="17" fill="none" stroke="#e8b84b" stroke-opacity="0.5"/>
  <circle cx="600" cy="358" r="17" fill="none" stroke="#e8b84b" stroke-opacity="0.5"/>
  <text x="680" y="363" fill="#f0cd7a" font-size="12" text-anchor="middle">显卡</text>
  <text x="566" y="404" fill="#6b6b85" font-size="10.5" text-anchor="middle">插在 PCIe 插槽上，横着躺</text>

  <!-- ============ 硬盘 ============ -->
  <rect x="58" y="96" width="160" height="86" rx="5" fill="#152420" stroke="#4ec9a3" stroke-width="1.3"/>
  <circle cx="90" cy="139" r="15" fill="none" stroke="#4ec9a3" stroke-opacity="0.45"/>
  <circle cx="90" cy="139" r="4" fill="#4ec9a3" fill-opacity="0.5"/>
  <text x="142" y="135" fill="#7fe0c2" font-size="12" text-anchor="middle">硬盘</text>
  <text x="142" y="153" fill="#4ec9a3" font-size="10" text-anchor="middle" font-family="monospace">HDD / SSD</text>

  <!-- ============ 电源 ============ -->
  <rect x="58" y="360" width="160" height="112" rx="5" fill="#241618" stroke="#f0606a" stroke-width="1.3"/>
  <circle cx="92" cy="416" r="22" fill="none" stroke="#f0606a" stroke-opacity="0.4"/>
  <circle cx="92" cy="416" r="13" fill="none" stroke="#f0606a" stroke-opacity="0.25"/>
  <text x="160" y="410" fill="#f7a3a8" font-size="12" text-anchor="middle">电源</text>
  <text x="160" y="428" fill="#f0606a" font-size="10" text-anchor="middle" font-family="monospace">220V → 12V</text>

  <!-- 走线示意 -->
  <path d="M218 139 C240 139 246 150 268 150" stroke="#6b6b85" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <path d="M218 410 C240 410 248 396 268 390" stroke="#6b6b85" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="232" y="470" fill="#4f4f6e" font-size="10.5">电源线 / 数据线</text>

  <!-- 编号 -->
  <g font-size="12" font-family="monospace" text-anchor="middle">
    <circle cx="690" cy="86" r="11" fill="#171725" stroke="#6b6b85"/><text x="690" y="90" fill="#d8d8e4">1</text>
    <circle cx="340" cy="126" r="11" fill="#9b4df0"/><text x="340" y="130" fill="#0b0b10" font-weight="bold">2</text>
    <circle cx="553" cy="124" r="11" fill="#67b5ef"/><text x="553" y="128" fill="#0b0b10" font-weight="bold">3</text>
    <circle cx="78" cy="124" r="11" fill="#4ec9a3"/><text x="78" y="128" fill="#0b0b10" font-weight="bold">4</text>
    <circle cx="492" cy="352" r="11" fill="#e8b84b"/><text x="492" y="356" fill="#0b0b10" font-weight="bold">5</text>
    <circle cx="80" cy="384" r="11" fill="#f0606a"/><text x="80" y="388" fill="#0b0b10" font-weight="bold">6</text>
  </g>

  <!-- 底部注释 -->
  <text x="24" y="534" fill="#4f4f6e" font-size="11" font-family="monospace">　注：这是示意图，真实机箱里主板位置、硬盘仓、走线槽各家不同，但六件东西一定都在。</text>
</svg>
