<text x="66" y="214" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前 15 位：不翻倍的 7 个 = 26，翻倍后相加的 8 个 = 30，合计 56</text>
<text x="20" y="258" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">补齐</text>
<text x="66" y="258" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">56 不能被 10 整除。往上补到 60 需要 4 —— 这就是校验位。</text>
<rect x="66" y="284" width="748" height="50" rx="6" fill="#151520" stroke="#3a3a52" stroke-width="1.2"/>
<text x="84" y="306" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">验的时候反过来：把 16 位连校验位一起重算，结果能被 10 整除就是没抄错。</text>
<text x="84" y="324" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它只能挡住手滑打错一位，挡不住伪造——任何人换个数字都能重算一个合法校验位。</text>
