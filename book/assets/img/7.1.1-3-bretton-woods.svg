<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" width="880" height="456" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="456" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.1-3  布雷顿森林：美元站在黄金和其他货币中间</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1944 年定下的双挂钩。注意看：能拿美元换黄金的，只有各国央行</text>
<rect x="80" y="92" width="120" height="52" rx="3" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="140.0" y="116" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">英镑</text>
<text x="140.0" y="134" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="monospace">GBP</text>
<line x1="140.0" y1="144" x2="140.0" y2="178" stroke="#4a4a66" stroke-width="1.1"/>
<rect x="232" y="92" width="120" height="52" rx="3" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="292.0" y="116" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">法郎</text>
<text x="292.0" y="134" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="monospace">FRF</text>
<line x1="292.0" y1="144" x2="292.0" y2="178" stroke="#4a4a66" stroke-width="1.1"/>
<rect x="384" y="92" width="120" height="52" rx="3" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="444.0" y="116" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">马克</text>
<text x="444.0" y="134" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="monospace">DEM</text>
<line x1="444.0" y1="144" x2="444.0" y2="178" stroke="#4a4a66" stroke-width="1.1"/>
<rect x="536" y="92" width="120" height="52" rx="3" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="596.0" y="116" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">日元</text>
<text x="596.0" y="134" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="monospace">JPY</text>
<line x1="596.0" y1="144" x2="596.0" y2="178" stroke="#4a4a66" stroke-width="1.1"/>
<rect x="688" y="92" width="120" height="52" rx="3" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="748.0" y="116" fill="#c8c8dc" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">里拉</text>
<text x="748.0" y="134" fill="#6f6f88" font-size="8.5" text-anchor="middle" font-family="monospace">ITL</text>
<line x1="748.0" y1="144" x2="748.0" y2="178" stroke="#4a4a66" stroke-width="1.1"/>
<line x1="140.0" y1="178" x2="748.0" y2="178" stroke="#4a4a66" stroke-width="1.1"/>
<text x="60" y="182" fill="#6f6f88" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钉住</text>
<line x1="440" y1="178" x2="440" y2="214" stroke="#e8b84b" stroke-width="1.4"/>
<path d="M435,214 L440,224 L445,214 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<text x="452" y="200" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">±1% 波动</text>
<rect x="300" y="224" width="280" height="70" rx="4" fill="#2a2410" stroke="#e8b84b" stroke-width="1.5"/>
<text x="440" y="252" fill="#e8b84b" font-size="17" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">美　元</text>
<text x="440" y="276" fill="#a08a50" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">唯一的「跟黄金挂钩」的货币</text>
<line x1="440" y1="294" x2="440" y2="326" stroke="#e8b84b" stroke-width="1.4"/>
<path d="M435,326 L440,336 L445,326 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<text x="452" y="316" fill="#e8b84b" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">35 美元 / 盎司</text>
<rect x="330" y="336" width="220" height="60" rx="4" fill="#2a2018" stroke="#e8965a" stroke-width="1.5"/>
<text x="440" y="362" fill="#e8965a" font-size="15" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">黄　金</text>
<text x="440" y="382" fill="#9a7550" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美国国库里的那堆</text>
<line x1="556" y1="250" x2="640" y2="250" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 3"/>
<text x="648" y="220" fill="#7f7f98" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">个人和公司拿美元来换？</text>
<text x="648" y="237" fill="#7f7f98" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不行。只有各国央行</text>
<text x="648" y="254" fill="#7f7f98" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（和极少数官方机构）</text>
<text x="648" y="271" fill="#7f7f98" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">才能按 35 美元提货。</text>
<text x="40" y="424" fill="#a0a0b8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这套结构的意思是：全世界都用美元结算，因为美元「等价于黄金」；美国只要守住 35 美元一盎司这个价，体系就转得动。</text>
<text x="40" y="448" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它同时给了美国一个巨大的好处和一份巨大的责任 —— 好处是印纸就能买东西，责任是别人来换金子时你得真给。</text>
</svg>
