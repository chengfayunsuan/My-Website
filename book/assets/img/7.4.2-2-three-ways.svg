<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.4.2 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">刷、插、贴：三种动作，三套安全等级</text>
<rect x="40" y="76" width="258" height="206" rx="8" fill="#15151f" stroke="#8a8aa0" stroke-width="1.4"/>
<text x="169" y="104" fill="#8a8aa0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">刷（磁条）</text>
<text x="60" y="134" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 把卡在槽里划一下</text>
<text x="60" y="160" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 读磁条上的静态数据</text>
<text x="60" y="186" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 数据能被复制</text>
<text x="60" y="212" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 复制品照样能用</text>
<text x="60" y="268" fill="#7a7a94" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2000 年代主流，正在退场</text>
<rect x="330" y="76" width="258" height="206" rx="8" fill="#15151f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="459" y="104" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">插（芯片）</text>
<text x="350" y="134" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 卡插进槽里不拔</text>
<text x="350" y="160" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 芯片现场算一个密文</text>
<text x="350" y="186" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 密文一次性</text>
<text x="350" y="212" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 复制也没用</text>
<text x="350" y="268" fill="#7a7a94" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">现在的主力，最安全</text>
<rect x="620" y="76" width="258" height="206" rx="8" fill="#15151f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="749" y="104" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">贴（闪付）</text>
<text x="640" y="134" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 卡靠近读头 4 厘米</text>
<text x="640" y="160" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 芯片用无线方式供电</text>
<text x="640" y="186" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 同样生成动态密文</text>
<text x="640" y="212" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 小额免密</text>
<text x="640" y="268" fill="#7a7a94" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1000 元以下不用密码</text>
<text x="40" y="314" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键差别不在"怎么读"，而在"读出来的东西能不能被重复使用"。</text>
</svg>
