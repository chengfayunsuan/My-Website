<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="430" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">不是一块，是十三块</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">光刻机一次只能曝光 858 平方毫米，所以大芯片只能拼</text>

  <!-- 封装基板 -->
  <rect x="46" y="68" width="404" height="266" rx="5" fill="#171725" stroke="#33334a"/>
  <text x="248" y="84" fill="#6b6b85" font-size="7.5" text-anchor="middle">封装基板</text>

  <!-- 12 个 CCD -->
  <g fill="#2e2a3a" stroke="#9b4df0">
    <rect x="64" y="96" width="52" height="46" rx="2"/><rect x="124" y="96" width="52" height="46" rx="2"/>
    <rect x="184" y="96" width="52" height="46" rx="2"/><rect x="244" y="96" width="52" height="46" rx="2"/>
    <rect x="304" y="96" width="52" height="46" rx="2"/><rect x="364" y="96" width="52" height="46" rx="2"/>
    <rect x="64" y="150" width="52" height="46" rx="2"/><rect x="124" y="150" width="52" height="46" rx="2"/>
    <rect x="184" y="150" width="52" height="46" rx="2"/><rect x="244" y="150" width="52" height="46" rx="2"/>
    <rect x="304" y="150" width="52" height="46" rx="2"/><rect x="364" y="150" width="52" height="46" rx="2"/>
  </g>
  <g fill="#cfc6ff" font-size="7" text-anchor="middle">
    <text x="90" y="116">8 核</text><text x="150" y="116">8 核</text><text x="210" y="116">8 核</text>
    <text x="270" y="116">8 核</text><text x="330" y="116">8 核</text><text x="390" y="116">8 核</text>
    <text x="90" y="170">8 核</text><text x="150" y="170">8 核</text><text x="210" y="170">8 核</text>
    <text x="270" y="170">8 核</text><text x="330" y="170">8 核</text><text x="390" y="170">8 核</text>
  </g>
  <g fill="#6b6b85" font-size="6" text-anchor="middle">
    <text x="90" y="130">CCD</text><text x="150" y="130">CCD</text><text x="210" y="130">CCD</text>
    <text x="270" y="130">CCD</text><text x="330" y="130">CCD</text><text x="390" y="130">CCD</text>
    <text x="90" y="184">CCD</text><text x="150" y="184">CCD</text><text x="210" y="184">CCD</text>
    <text x="270" y="184">CCD</text><text x="330" y="184">CCD</text><text x="390" y="184">CCD</text>
  </g>

  <!-- 互连示意 -->
  <g stroke="#4ec9a3" stroke-width="1" stroke-opacity="0.55">
    <line x1="90" y1="196" x2="90" y2="216"/>
    <line x1="150" y1="196" x2="150" y2="216"/>
    <line x1="210" y1="196" x2="210" y2="216"/>
    <line x1="270" y1="196" x2="270" y2="216"/>
    <line x1="330" y1="196" x2="330" y2="216"/>
    <line x1="390" y1="196" x2="390" y2="216"/>
  </g>

  <!-- IOD -->
  <rect x="64" y="216" width="352" height="76" rx="3" fill="#232338" stroke="#9a9ab4"/>
  <text x="240" y="240" fill="#c8c8d4" font-size="9" text-anchor="middle">IO die</text>
  <text x="240" y="258" fill="#9a9ab4" font-size="7.5" text-anchor="middle">12 通道内存控制器 · 128 条 PCIe 5.0</text>
  <text x="240" y="274" fill="#6b6b85" font-size="7" text-anchor="middle">所有 CCD 都连到它，再由它连到内存和外部</text>

  <text x="46" y="306" fill="#e8b84b" font-size="7.5">合计：12 × 72 mm² + 400 mm² ≈ 1260 mm²　·　96 核 / 192 线程</text>

  <!-- 右侧说明 -->
  <line x1="472" y1="68" x2="472" y2="334" stroke="#2a2a44"/>

  <text x="492" y="86" fill="#d8d8e4" font-size="10">为什么不造一整块</text>

  <text x="492" y="110" fill="#f0606a" font-size="8.5">因为良率会崩</text>
  <text x="492" y="128" fill="#9a9ab4" font-size="8">硅片上有缺陷，面积越大越容易碰上。</text>

  <text x="492" y="152" fill="#9a9ab4" font-size="8">72 mm² 的 die</text>
  <text x="492" y="168" fill="#9fe0c9" font-size="8.5">良率约 93%</text>

  <text x="492" y="190" fill="#9a9ab4" font-size="8">858 mm² 的 die</text>
  <text x="492" y="206" fill="#f0606a" font-size="8.5">良率约 42%</text>

  <text x="492" y="228" fill="#6b6b85" font-size="7.5">面积差 12 倍，良率差一倍多。</text>
  <text x="492" y="242" fill="#6b6b85" font-size="7.5">而且坏一块是整块报废，不是坏几个核。</text>

  <rect x="492" y="256" width="248" height="70" rx="4" fill="#171725" stroke="#2a2a44"/>
  <text x="504" y="274" fill="#cfc6ff" font-size="8">代价：die 之间要通信</text>
  <text x="504" y="290" fill="#9a9ab4" font-size="7.5">走封装基板，延迟多 20–40 ns</text>
  <text x="504" y="306" fill="#9a9ab4" font-size="7.5">IO die 的功耗能占总量的两三成</text>
  <text x="504" y="320" fill="#6b6b85" font-size="7">切得越碎，良率越高，通信越贵</text>

  <line x1="24" y1="356" x2="736" y2="356" stroke="#2a2a44"/>

  <text x="24" y="378" fill="#e8b84b" font-size="9">chiplet 的本质是一笔交易：用「die 之间的通信开销」换「良率带来的成本下降」。</text>
  <text x="24" y="398" fill="#9a9ab4" font-size="9">切几刀是个优化问题——苹果只切两刀（M1 Ultra），服务器切十三刀，各有各的账。</text>
  <text x="24" y="418" fill="#6b6b85" font-size="8.5">这也是整个半导体行业的方向，只是服务器先走了一步。</text>
</svg>
