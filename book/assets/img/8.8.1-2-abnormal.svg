<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">进经营异常名录，只有四种原因</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">前三种是自己疏忽，第四种最常见也最冤</text>
<rect x="34" y="96" width="612" height="78" rx="5" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="34" y="96" width="5" height="78" rx="2" fill="#e87a8a" stroke="none" stroke-width="0"/>
<text x="56" y="122" fill="#e87a8a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">没报年报</text>
<text x="160" y="122" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1 月 1 日到 6 月 30 日，一次都没报</text>
<text x="56" y="148" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">移出方式：补报 + 申请移出，5 个工作日</text>
<rect x="34" y="182" width="612" height="78" rx="5" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="34" y="182" width="5" height="78" rx="2" fill="#e8965a" stroke="none" stroke-width="0"/>
<text x="56" y="208" fill="#e8965a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">没公示信息</text>
<text x="160" y="208" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">责令期限内仍未公示股东出资等</text>
<text x="56" y="234" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">移出方式：补公示后申请移出</text>
<rect x="34" y="268" width="612" height="78" rx="5" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="34" y="268" width="5" height="78" rx="2" fill="#b58ae8" stroke="none" stroke-width="0"/>
<text x="56" y="294" fill="#b58ae8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">公示造假</text>
<text x="160" y="294" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">隐瞒真实情况、弄虚作假</text>
<text x="56" y="320" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">移出方式：更正 + 可能罚款，移出更麻烦</text>
<rect x="34" y="354" width="612" height="78" rx="5" fill="#14141e" stroke="#3a3a52" stroke-width="1.3"/>
<rect x="34" y="354" width="5" height="78" rx="2" fill="#67b5ef" stroke="none" stroke-width="0"/>
<text x="56" y="380" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">住所失联</text>
<text x="160" y="380" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">登记地址查无此人、电话打不通</text>
<text x="56" y="406" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">移出方式：变更地址或接受核查后移出</text>
<text x="340" y="438" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">满三年不移出，会升级成"严重违法失信名单"——法人坐高铁、贷款、投标全受限。</text>
<text x="340" y="460" fill="#e8b84b" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这一条不是"提醒"，是很多人真正被卡住的地方。</text>
</svg>
