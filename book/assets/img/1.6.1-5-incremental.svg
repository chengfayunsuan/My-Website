<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.1-5  改一行，真的需要整个文件重解析吗</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不需要。语法树只重建「被改动的那一支」，旁边几支连碰都不用碰</text>
<text x="30" y="84" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个两千行的文件，切成五块（每块是一个函数）</text>
<rect x="30" y="98" width="158" height="44" rx="3" fill="#14141e" stroke="#3a4a5a" stroke-width="1.4"/>
<text x="109.0" y="125" fill="#8a8aa2" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">函数 1</text>
<rect x="194" y="98" width="158" height="44" rx="3" fill="#14141e" stroke="#3a4a5a" stroke-width="1.4"/>
<text x="273.0" y="125" fill="#8a8aa2" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">函数 2</text>
<rect x="358" y="98" width="158" height="44" rx="3" fill="#2a1a20" stroke="#e87a8a" stroke-width="1.4"/>
<text x="437.0" y="125" fill="#e87a8a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">函数 3</text>
<rect x="522" y="98" width="158" height="44" rx="3" fill="#14141e" stroke="#3a4a5a" stroke-width="1.4"/>
<text x="601.0" y="125" fill="#8a8aa2" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">函数 4</text>
<rect x="686" y="98" width="158" height="44" rx="3" fill="#14141e" stroke="#3a4a5a" stroke-width="1.4"/>
<text x="765.0" y="125" fill="#8a8aa2" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">函数 5</text>
<text x="437.0" y="160" fill="#e87a8a" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 改了这里面的一行</text>
<text x="30" y="200" fill="#8a8aa2" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">做法 A：全量重解析（五块全重算）</text>
<rect x="30" y="210" width="158" height="22" rx="2" fill="#3a2a2e" stroke="#e87a8a" stroke-width="1"/>
<rect x="194" y="210" width="158" height="22" rx="2" fill="#3a2a2e" stroke="#e87a8a" stroke-width="1"/>
<rect x="358" y="210" width="158" height="22" rx="2" fill="#3a2a2e" stroke="#e87a8a" stroke-width="1"/>
<rect x="522" y="210" width="158" height="22" rx="2" fill="#3a2a2e" stroke="#e87a8a" stroke-width="1"/>
<rect x="686" y="210" width="158" height="22" rx="2" fill="#3a2a2e" stroke="#e87a8a" stroke-width="1"/>
<text x="30" y="268" fill="#8a8aa2" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">做法 B：增量重解析</text>
<rect x="30" y="278" width="158" height="22" rx="2" fill="#16281c" stroke="#67d9a0" stroke-width="1"/>
<text x="109.0" y="293" fill="#67d9a0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">原样复用</text>
<rect x="194" y="278" width="158" height="22" rx="2" fill="#16281c" stroke="#67d9a0" stroke-width="1"/>
<text x="273.0" y="293" fill="#67d9a0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">原样复用</text>
<rect x="358" y="278" width="158" height="22" rx="2" fill="#2a1a20" stroke="#e87a8a" stroke-width="1"/>
<text x="437.0" y="293" fill="#e87a8a" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">重算</text>
<rect x="522" y="278" width="158" height="22" rx="2" fill="#16281c" stroke="#67d9a0" stroke-width="1"/>
<text x="601.0" y="293" fill="#67d9a0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">原样复用</text>
<rect x="686" y="278" width="158" height="22" rx="2" fill="#16281c" stroke="#67d9a0" stroke-width="1"/>
<text x="765.0" y="293" fill="#67d9a0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">原样复用</text>
<line x1="30" y1="330" x2="850" y2="330" stroke="#2a2a3e" stroke-width="1"/>
<text x="30" y="356" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">两千行文件的实测感受</text>
<text x="30" y="382" fill="#e87a8a" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全量：约 200 毫秒</text>
<rect x="180" y="372" width="380" height="12" rx="2" fill="#3a2a2e" stroke="#e87a8a" stroke-width="1"/>
<text x="30" y="406" fill="#67d9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">增量：约 3 毫秒</text>
<rect x="180" y="396" width="6" height="12" rx="1" fill="#1e3a2a" stroke="#67d9a0" stroke-width="1"/>
<text x="196" y="407" fill="#6f6f88" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（条子短到看不见 —— 这就是为什么打字时不会有延迟感）</text>
</svg>
