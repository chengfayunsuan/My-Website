<svg xmlns="http://www.w3.org/2000/svg" width="880" height="322" viewBox="0 0 880 322" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="322" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.2 / 图 1</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美元不只是美国的钱，它同时干着三份工作</text>
<rect x="24" y="92" width="266" height="132" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="157" y="122" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结算货币</text>
<text x="157" y="158" fill="#cfcfe0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">石油、铁矿石、大豆</text>
<text x="157" y="184" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">国际上报价和付款都用美元</text>
<rect x="306" y="92" width="266" height="132" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="439" y="122" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">储备货币</text>
<text x="439" y="158" fill="#cfcfe0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">各国央行的压箱底</text>
<text x="439" y="184" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存成美元、买成美国国债</text>
<rect x="588" y="92" width="266" height="132" rx="10" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="721" y="122" fill="#e8b84b" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">避险货币</text>
<text x="721" y="158" fill="#cfcfe0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一有风吹草动</text>
<text x="721" y="184" fill="#8a8aa0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全世界的钱往美元跑</text>
<text x="24" y="258" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三个角色互相加固：越多人拿它做生意，就越多人愿意存它；越多人存它，它就越稳。</text>
<text x="24" y="286" fill="#a0a0b8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这就是「网络效应」——不是因为它完美，是因为换掉它的成本太高。</text>
</svg>
