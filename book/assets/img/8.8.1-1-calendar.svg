<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">一年的合规日历：四个频率，一个都别漏</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">月度申报最频繁，年报只在 1~6 月，汇算清缴卡在 5 月底</text>
<rect x="120.0" y="96" width="40.666666666666664" height="22" rx="2" fill="#1a1a28" stroke="#3a3a52" stroke-width="1"/>
