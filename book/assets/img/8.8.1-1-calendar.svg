<rect x="418.66666666666663" y="96" width="40.666666666666664" height="22" rx="2" fill="#1a1a28" stroke="#3a3a52" stroke-width="1"/>
<text x="438.99999999999994" y="112" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">8</text>
<rect x="461.3333333333333" y="96" width="40.666666666666664" height="22" rx="2" fill="#1a1a28" stroke="#3a3a52" stroke-width="1"/>
<text x="481.66666666666663" y="112" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">9</text>
<rect x="504.0" y="96" width="40.666666666666664" height="22" rx="2" fill="#1a1a28" stroke="#3a3a52" stroke-width="1"/>
<text x="524.3333333333334" y="112" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">10</text>
<rect x="546.6666666666666" y="96" width="40.666666666666664" height="22" rx="2" fill="#1a1a28" stroke="#3a3a52" stroke-width="1"/>
<text x="567.0" y="112" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">11</text>
<rect x="589.3333333333333" y="96" width="40.666666666666664" height="22" rx="2" fill="#1a1a28" stroke="#3a3a52" stroke-width="1"/>
<text x="609.6666666666666" y="112" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">12</text>
<text x="636" y="112" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">月</text>
<text x="30" y="162" fill="#67b5ef" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">月度申报</text>
<rect x="120" y="148" width="512" height="20" rx="9" fill="#67b5ef2e" stroke="#67b5ef" stroke-width="1.4"/>
<text x="130" y="162" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每月 15 日前：增值税、附加税、个税</text>
<text x="30" y="214" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">季度申报</text>
<rect x="120" y="200" width="512" height="20" rx="9" fill="#67d9a02e" stroke="#67d9a0" stroke-width="1.4"/>
<text x="130" y="214" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1/4/7/10 月：企业所得税季度预缴</text>
<text x="30" y="266" fill="#e8965a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">汇算清缴</text>
<rect x="120.0" y="252" width="256.0" height="20" rx="9" fill="#e8965a2e" stroke="#e8965a" stroke-width="1.4"/>
<text x="130.0" y="266" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5 月 31 日前：企业所得税年度汇算</text>
<text x="30" y="318" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">工商年报</text>
<rect x="120.0" y="304" width="256.0" height="20" rx="9" fill="#e87a8a2e" stroke="#e87a8a" stroke-width="1.4"/>
<text x="130.0" y="318" fill="#c8c8dc" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">6 月 30 日前：上一年度年报</text>
<line x1="30" y1="388" x2="650" y2="388" stroke="#3a3a52" stroke-width="1"/>
<text x="340" y="414" fill="#c8c8dc" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">漏一次月度申报不算大事，连续三个月不申报就会被认定为非正常户。</text>
<text x="340" y="438" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">漏一次年报，会直接进经营异常名录——最容易被忽略、后果最直接的一项。</text>
<text x="340" y="462" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记账不是"记给自己看"，是"能在需要时拿出证据"。</text>
</svg>
