<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.2-4  单步一次，要绕地球一圈</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一条指令本身零点几纳秒，可「停下来报告一次」要走完整条内核路径，贵几千倍</text>
<rect x="60" y="150" width="168" height="82" rx="4" fill="#14141e" stroke="#67d9a0" stroke-width="1.3"/>
<text x="144.0" y="180" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">执行一条指令</text>
<text x="144.0" y="202" fill="#6f6f88" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CPU 干它最擅长的事</text>
<rect x="268" y="150" width="168" height="82" rx="4" fill="#14141e" stroke="#e87a8a" stroke-width="1.3"/>
<text x="352.0" y="180" fill="#e87a8a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">触发 trap</text>
<text x="352.0" y="202" fill="#6f6f88" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">EFLAGS 的 TF 位被置 1</text>
<rect x="476" y="150" width="168" height="82" rx="4" fill="#14141e" stroke="#e8965a" stroke-width="1.3"/>
<text x="560.0" y="180" fill="#e8965a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">内核接管</text>
<text x="560.0" y="202" fill="#6f6f88" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">保存现场，通知调试器</text>
<rect x="684" y="150" width="148" height="82" rx="4" fill="#14141e" stroke="#67b5ef" stroke-width="1.3"/>
<text x="758.0" y="180" fill="#67b5ef" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">调试器醒来</text>
<text x="758.0" y="202" fill="#6f6f88" font-size="8.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">读寄存器、刷新界面</text>
<line x1="232" y1="191" x2="260" y2="191" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M260,187 L267,191 L260,195 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="440" y1="191" x2="468" y2="191" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M468,187 L475,191 L468,195 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<line x1="648" y1="191" x2="676" y2="191" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M676,187 L683,191 L676,195 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<path d="M758,232 L758,290 L144,290 L144,236" fill="none" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M144,236 L139,246 L149,246 Z" fill="#4a4a66" stroke="#4a4a66" stroke-width="1"/>
<text x="451" y="282" fill="#c8c8dc" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你按一下「单步」，就再来一遍</text>
<text x="30" y="108" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一次往返：约 5 到 50 微秒（取决于系统调用和刷新界面的开销）</text>
<text x="30" y="128" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一条指令本身：约 0.3 纳秒</text>
<text x="30" y="330" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以单步「走一千行」在调试器里是几毫秒到几十毫秒——你感觉是「有点慢」，机器感觉是「慢了一万倍」。</text>
<text x="30" y="352" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这也解释了为什么「单步」绝不能用来定位性能问题：它把时间全花在报告上了，真实开销一点没测到。</text>
<text x="30" y="380" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要测性能得用采样（1.6.4）。调试器的工作是「看清楚」，不是「量准确」。</text>
</svg>
