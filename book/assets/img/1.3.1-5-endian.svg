<svg width="900" height="430" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.3.1-5  字节序：同一个数，两种排法</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内存里只有字节，没有「数」。谁在前谁在后，是人约定的</text>
<text x="24" y="92" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">内存里的一个 32 位数：0x12 34 56 78</text>
<text x="24" y="110" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">高有效字节 12，低有效字节 78</text>
<text x="120" y="188.0" fill="#67b5ef" font-size="12.5" text-anchor="end" font-family="monospace">大端 BE</text>
<rect x="210" y="160" width="62" height="46" rx="3" fill="#1a1a28" stroke="#67b5ef" stroke-width="1.4"/>
<text x="241.0" y="189.0" fill="#67b5ef" font-size="14" text-anchor="middle" font-family="monospace" font-weight="600">12</text>
<text x="241.0" y="152" fill="#6a6a82" font-size="9.5" text-anchor="middle" font-family="monospace">0x1000</text>
<rect x="276" y="160" width="62" height="46" rx="3" fill="#1a1a28" stroke="#67b5ef" stroke-width="1.4"/>
<text x="307.0" y="189.0" fill="#67b5ef" font-size="14" text-anchor="middle" font-family="monospace" font-weight="600">34</text>
<text x="307.0" y="152" fill="#6a6a82" font-size="9.5" text-anchor="middle" font-family="monospace">0x1001</text>
<rect x="342" y="160" width="62" height="46" rx="3" fill="#1a1a28" stroke="#67b5ef" stroke-width="1.4"/>
<text x="373.0" y="189.0" fill="#67b5ef" font-size="14" text-anchor="middle" font-family="monospace" font-weight="600">56</text>
<text x="373.0" y="152" fill="#6a6a82" font-size="9.5" text-anchor="middle" font-family="monospace">0x1002</text>
<rect x="408" y="160" width="62" height="46" rx="3" fill="#1a1a28" stroke="#67b5ef" stroke-width="1.4"/>
<text x="439.0" y="189.0" fill="#67b5ef" font-size="14" text-anchor="middle" font-family="monospace" font-weight="600">78</text>
<text x="439.0" y="152" fill="#6a6a82" font-size="9.5" text-anchor="middle" font-family="monospace">0x1003</text>
<text x="120" y="278.0" fill="#67d9a0" font-size="12.5" text-anchor="end" font-family="monospace">小端 LE</text>
<rect x="210" y="250" width="62" height="46" rx="3" fill="#1a1a28" stroke="#67d9a0" stroke-width="1.4"/>
<text x="241.0" y="279.0" fill="#67d9a0" font-size="14" text-anchor="middle" font-family="monospace" font-weight="600">78</text>
<text x="241.0" y="242" fill="#6a6a82" font-size="9.5" text-anchor="middle" font-family="monospace">0x1000</text>
<rect x="276" y="250" width="62" height="46" rx="3" fill="#1a1a28" stroke="#67d9a0" stroke-width="1.4"/>
<text x="307.0" y="279.0" fill="#67d9a0" font-size="14" text-anchor="middle" font-family="monospace" font-weight="600">56</text>
<text x="307.0" y="242" fill="#6a6a82" font-size="9.5" text-anchor="middle" font-family="monospace">0x1001</text>
<rect x="342" y="250" width="62" height="46" rx="3" fill="#1a1a28" stroke="#67d9a0" stroke-width="1.4"/>
<text x="373.0" y="279.0" fill="#67d9a0" font-size="14" text-anchor="middle" font-family="monospace" font-weight="600">34</text>
<text x="373.0" y="242" fill="#6a6a82" font-size="9.5" text-anchor="middle" font-family="monospace">0x1002</text>
<rect x="408" y="250" width="62" height="46" rx="3" fill="#1a1a28" stroke="#67d9a0" stroke-width="1.4"/>
<text x="439.0" y="279.0" fill="#67d9a0" font-size="14" text-anchor="middle" font-family="monospace" font-weight="600">12</text>
<text x="439.0" y="242" fill="#6a6a82" font-size="9.5" text-anchor="middle" font-family="monospace">0x1003</text>
<text x="482" y="186" fill="#67b5ef" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">← 读起来和书写顺序一致</text>
<text x="482" y="276" fill="#67d9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">← 低有效字节在低地址</text>
<line x1="210" y1="316" x2="470" y2="316" stroke="#4a4a62" stroke-width="1.2"/>
<path d="M210,316 l7,-4 l0,8 z" fill="#4a4a62"/>
<text x="210" y="334" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">低地址</text>
<text x="470" y="334" fill="#6a6a82" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">高地址</text>
<rect x="24" y="352" width="852" height="56" rx="4" fill="#14141e" stroke="#2a2a3e" stroke-width="1.2"/>
<text x="40" y="374" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把前两个字节当成一个 16 位整数来读：</text>
<text x="346" y="374" fill="#67b5ef" font-size="11" text-anchor="start" font-family="monospace">大端得到 0x1234</text>
<text x="532" y="374" fill="#67d9a0" font-size="11" text-anchor="start" font-family="monospace">小端得到 0x5678</text>
<text x="40" y="396" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一块内存，同一个读取动作，答案完全不同——这就是所有字节序 bug 的源头。</text>
</svg>
