<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="420" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">对公账户分四类，只有一类能取现金</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开户前先想清楚：你是要收款，还是要发工资，还是要管专项的钱</text>
<rect x="30" y="74" width="720" height="72" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="50" y="100" fill="#67d9a0" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">基本存款账户</text>
<text x="50" y="121" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个公司只能开一个</text>
<text x="300" y="100" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能取现、发工资、扣税、缴费</text>
<text x="300" y="121" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开业必开</text>
<rect x="30" y="154" width="720" height="72" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="50" y="180" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">一般存款账户</text>
<text x="50" y="201" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可以开多个</text>
<text x="300" y="180" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">能转账收款，不能取现</text>
<text x="300" y="201" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">借款、结算用</text>
<rect x="30" y="234" width="720" height="72" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.4"/>
<text x="50" y="260" fill="#e8b84b" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">专用存款账户</text>
<text x="50" y="281" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按用途专款专用</text>
<text x="300" y="260" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">农民工工资、验资、房改资金</text>
<text x="300" y="281" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有特定项目才开</text>
<rect x="30" y="314" width="720" height="72" rx="6" fill="#16161f" stroke="#b58ae8" stroke-width="1.4"/>
<text x="50" y="340" fill="#b58ae8" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">临时存款账户</text>
<text x="50" y="361" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">有期限，到期销户</text>
<text x="300" y="340" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">异地临时经营、注册验资</text>
<text x="300" y="361" fill="#7a7a94" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用完就销</text>
<text x="390" y="404" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">提现只能走基本户；工资、报销、货款、扣税都从基本户走，账最清楚</text>
</svg>
