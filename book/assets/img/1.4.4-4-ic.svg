<svg width="880" height="344" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="344" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.4.4-4  内联缓存的四个状态</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一个访问点 s.w，遇到过的形状越多，退得越深</text>
<text x="36" y="96" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个访问点（比如函数里的 s.w）在运行时是这样演化的：</text>
<rect x="36" y="130" width="160" height="112" rx="4" fill="#8a8aa012" stroke="#8a8aa0" stroke-width="1.3"/>
<text x="48" y="154" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">未初始化</text>
<text x="48" y="178" fill="#c8c8dc" font-size="8.5" text-anchor="start" font-family="monospace">?</text>
<text x="48" y="198" fill="#7a7a94" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还没见过任何形状</text>
<text x="48" y="222" fill="#8a8aa0" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全量查找 · ~100 周期</text>
<rect x="252" y="130" width="160" height="112" rx="4" fill="#67d9a012" stroke="#67d9a0" stroke-width="1.3"/>
<text x="264" y="154" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">单态</text>
<text x="264" y="178" fill="#c8c8dc" font-size="8.5" text-anchor="start" font-family="monospace">Map_A ✓</text>
<text x="264" y="198" fill="#7a7a94" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一次比较，命中即走</text>
<text x="264" y="222" fill="#67d9a0" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1 次比对 · ~4 周期</text>
<rect x="468" y="130" width="160" height="112" rx="4" fill="#e8b84b12" stroke="#e8b84b" stroke-width="1.3"/>
<text x="480" y="154" fill="#e8b84b" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">多态</text>
<text x="480" y="178" fill="#c8c8dc" font-size="8.5" text-anchor="start" font-family="monospace">Map_A｜Map_B｜…</text>
<text x="480" y="198" fill="#7a7a94" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">线性比对，最多 4 个</text>
<text x="480" y="222" fill="#e8b84b" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最多 4 次比对 · ~10 周期</text>
<rect x="684" y="130" width="160" height="112" rx="4" fill="#e87a8a12" stroke="#e87a8a" stroke-width="1.3"/>
<text x="696" y="154" fill="#e87a8a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">巨态</text>
<text x="696" y="178" fill="#c8c8dc" font-size="8.5" text-anchor="start" font-family="monospace">哈希表</text>
<text x="696" y="198" fill="#7a7a94" font-size="8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">放弃优化，按名查</text>
<text x="696" y="222" fill="#e87a8a" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">哈希查找 · ~90 周期</text>
<path d="M202,188 L242,188" stroke="#5a5a72" stroke-width="1.5"/>
<path d="M242,188 l-10,-4.5 l0,9 Z" fill="#5a5a72"/>
<text x="224.0" y="206" fill="#8a8aa4" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+1 种</text>
<path d="M418,188 L458,188" stroke="#5a5a72" stroke-width="1.5"/>
<path d="M458,188 l-10,-4.5 l0,9 Z" fill="#5a5a72"/>
<text x="440.0" y="206" fill="#8a8aa4" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+1 种</text>
<path d="M634,188 L674,188" stroke="#5a5a72" stroke-width="1.5"/>
<path d="M674,188 l-10,-4.5 l0,9 Z" fill="#5a5a72"/>
<text x="656.0" y="206" fill="#8a8aa4" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+1 种</text>
<text x="764.0" y="268" fill="#c07a86" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↓ 到此为止，回不去</text>
<text x="36" y="302" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">单态是一次比较，巨态是一次哈希——差二十倍。而它们之间只隔了「这个函数被喂了几种不同形状的对象」。</text>
<text x="36" y="320" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「写法影响性能」不是玄学：在构造函数之外给对象加属性，就是在把单态往多态推。</text>
</svg>
