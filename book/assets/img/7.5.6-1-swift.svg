<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="430" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">跨境汇款：报文走 SWIFT，钱走代理行</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这是两条不同的线，很多人以为 SWIFT 是「转账系统」，其实它只送消息</text>
<defs><marker id="s1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#b58ae8"/></marker><marker id="s2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#67d9a0"/></marker></defs><text x="30" y="74" fill="#b58ae8" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">① 报文线：SWIFT 只负责传话</text>
<rect x="60" y="86" width="180" height="54" rx="6" fill="#1e1630" stroke="#b58ae8" stroke-width="1.5"/>
<text x="150" y="110" fill="#b58ae8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你的银行</text>
<text x="150" y="130" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发出汇款指令</text>
<line x1="242" y1="113" x2="296" y2="113" stroke="#b58ae8" stroke-width="2" marker-end="url(#s1)"/><rect x="300" y="86" width="180" height="54" rx="6" fill="#1e1630" stroke="#b58ae8" stroke-width="1.5"/>
<text x="390" y="110" fill="#b58ae8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">中间行</text>
<text x="390" y="130" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代理行，有美元账户</text>
<line x1="482" y1="113" x2="536" y2="113" stroke="#b58ae8" stroke-width="2" marker-end="url(#s1)"/><rect x="540" y="86" width="180" height="54" rx="6" fill="#1e1630" stroke="#b58ae8" stroke-width="1.5"/>
<text x="630" y="110" fill="#b58ae8" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">收款银行</text>
<text x="630" y="130" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">解付，入收款人账</text>
<text x="390" y="160" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">报文里写着「我要给谁多少钱」，但它本身不带钱——像一封挂号信，不是快递包裹</text>
<text x="30" y="198" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">② 资金线：钱在代理行的账户上减一笔加一笔</text>
<rect x="60" y="210" width="180" height="54" rx="6" fill="#12241a" stroke="#67d9a0" stroke-width="1.5"/>
<text x="150" y="234" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">你的银行</text>
<text x="150" y="254" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美元账户 -100</text>
<line x1="242" y1="237" x2="296" y2="237" stroke="#67d9a0" stroke-width="2" marker-end="url(#s2)"/><rect x="300" y="210" width="180" height="54" rx="6" fill="#12241a" stroke="#67d9a0" stroke-width="1.5"/>
<text x="390" y="234" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">中间行</text>
<text x="390" y="254" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">过账，扣手续费</text>
<line x1="482" y1="237" x2="536" y2="237" stroke="#67d9a0" stroke-width="2" marker-end="url(#s2)"/><rect x="540" y="210" width="180" height="54" rx="6" fill="#12241a" stroke="#67d9a0" stroke-width="1.5"/>
<text x="630" y="234" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">收款银行</text>
<text x="630" y="254" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收款人 +85</text>
<text x="390" y="284" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所谓跨境汇款，就是在「你的银行在中间行的账户」上做一次减法，在「收款行在中间行的账户」上做一次加法</text>
<rect x="24" y="304" width="732" height="106" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.5"/>
<text x="44" y="330" fill="#e8b84b" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">为什么非要中间行</text>
<text x="44" y="354" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 你的银行没有美元清算能力，只能借助在美国有账户的大行</text>
<text x="44" y="376" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 一家银行不可能跟全世界所有银行都开账户，只能通过几家枢纽行中转</text>
<text x="44" y="398" fill="#e8965a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 中转一次就多一道手续、多一次扣费、多一段时间——这就是跨境慢的原因</text>
</svg>
