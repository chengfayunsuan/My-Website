<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="476" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">一个地址怎么变成一次命中：64 位地址切成三段</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">以 48 KB、8 路组相联、64 字节行的 L1 为例：512 行 ÷ 8 路 = 64 组，index 6 位，offset 6 位</text>
<rect x="24" y="92" width="400" height="46" rx="2" fill="#141420" stroke="#b58ae8" stroke-width="1.6"/>
<text x="34" y="109" fill="#b58ae8" font-size="10" text-anchor="start" font-family="monospace">tag</text>
<text x="224.0" y="129" fill="#d8d8e4" font-size="13" text-anchor="middle" font-family="monospace">0x1a3f2c8</text>
<rect x="424" y="92" width="120" height="46" rx="2" fill="#141420" stroke="#67b5ef" stroke-width="1.6"/>
<text x="434" y="109" fill="#67b5ef" font-size="10" text-anchor="start" font-family="monospace">index</text>
<text x="484.0" y="129" fill="#d8d8e4" font-size="13" text-anchor="middle" font-family="monospace">101001</text>
<rect x="544" y="92" width="120" height="46" rx="2" fill="#141420" stroke="#e8965a" stroke-width="1.6"/>
<text x="554" y="109" fill="#e8965a" font-size="10" text-anchor="start" font-family="monospace">offset</text>
<text x="604.0" y="129" fill="#d8d8e4" font-size="13" text-anchor="middle" font-family="monospace">010100</text>
<text x="676" y="106" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">6 位 + 6 位 = 12 位 = 4 KB 页内偏移</text>
<text x="676" y="124" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这正是 VIPT 能成立的条件：</text>
<text x="676" y="140" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">index 段在虚拟、物理地址里完全相同</text>
<path d="M484,138 L484,202" fill="none" stroke="#67b5ef" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M479,202 L484,210 L489,202 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<text x="472" y="196" fill="#67b5ef" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">index 直接选中一组，一步到位</text>
<text x="24" y="258" fill="#67b5ef" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 41 组</text>
<text x="24" y="274" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（index</text>
<text x="24" y="287" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif"> = 101001）</text>
<rect x="90" y="234" width="88" height="60" rx="2" fill="#141420" stroke="#3a3a52" stroke-width="1.2"/>
<text x="134.0" y="249" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 1 路</text>
<text x="134.0" y="270" fill="#8a8aa2" font-size="11" text-anchor="middle" font-family="monospace">0x3c81</text>
<text x="112.0" y="286" fill="#5f5f78" font-size="8" text-anchor="start" font-family="monospace">V</text>
<circle cx="126.0" cy="283" r="3.2" fill="#67d9a0"/>
<rect x="187" y="234" width="88" height="60" rx="2" fill="#141420" stroke="#3a3a52" stroke-width="1.2"/>
<text x="231.0" y="249" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 2 路</text>
<text x="231.0" y="270" fill="#8a8aa2" font-size="11" text-anchor="middle" font-family="monospace">0x07a2</text>
<text x="209.0" y="286" fill="#5f5f78" font-size="8" text-anchor="start" font-family="monospace">V</text>
<circle cx="223.0" cy="283" r="3.2" fill="#67d9a0"/>
<rect x="284" y="234" width="88" height="60" rx="2" fill="#141420" stroke="#3a3a52" stroke-width="1.2"/>
<text x="328.0" y="249" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 3 路</text>
<text x="328.0" y="270" fill="#8a8aa2" font-size="11" text-anchor="middle" font-family="monospace">0x2ed0</text>
<text x="306.0" y="286" fill="#5f5f78" font-size="8" text-anchor="start" font-family="monospace">V</text>
<circle cx="320.0" cy="283" r="3.2" fill="#67d9a0"/>
<rect x="381" y="234" width="88" height="60" rx="2" fill="#122018" stroke="#67d9a0" stroke-width="2.0"/>
<text x="425.0" y="249" fill="#67d9a0" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 4 路</text>
<text x="425.0" y="270" fill="#d8d8e4" font-size="11" text-anchor="middle" font-family="monospace">0x1a3f</text>
<text x="403.0" y="286" fill="#5f5f78" font-size="8" text-anchor="start" font-family="monospace">V</text>
<circle cx="417.0" cy="283" r="3.2" fill="#67d9a0"/>
<rect x="478" y="234" width="88" height="60" rx="2" fill="#141420" stroke="#3a3a52" stroke-width="1.2"/>
<text x="522.0" y="249" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 5 路</text>
<text x="522.0" y="270" fill="#8a8aa2" font-size="11" text-anchor="middle" font-family="monospace">0x5b19</text>
<text x="500.0" y="286" fill="#5f5f78" font-size="8" text-anchor="start" font-family="monospace">V</text>
<circle cx="514.0" cy="283" r="3.2" fill="#67d9a0"/>
<rect x="575" y="234" width="88" height="60" rx="2" fill="#141420" stroke="#3a3a52" stroke-width="1.2"/>
<text x="619.0" y="249" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 6 路</text>
<text x="619.0" y="270" fill="#8a8aa2" font-size="11" text-anchor="middle" font-family="monospace">0x64c7</text>
<text x="597.0" y="286" fill="#5f5f78" font-size="8" text-anchor="start" font-family="monospace">V</text>
<circle cx="611.0" cy="283" r="3.2" fill="#67d9a0"/>
<rect x="672" y="234" width="88" height="60" rx="2" fill="#141420" stroke="#3a3a52" stroke-width="1.2"/>
<text x="716.0" y="249" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 7 路</text>
<text x="716.0" y="270" fill="#8a8aa2" font-size="11" text-anchor="middle" font-family="monospace">0x1188</text>
<text x="694.0" y="286" fill="#5f5f78" font-size="8" text-anchor="start" font-family="monospace">V</text>
<circle cx="708.0" cy="283" r="3.2" fill="#67d9a0"/>
<rect x="769" y="234" width="88" height="60" rx="2" fill="#141420" stroke="#3a3a52" stroke-width="1.2"/>
<text x="813.0" y="249" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第 8 路</text>
<text x="813.0" y="270" fill="#8a8aa2" font-size="11" text-anchor="middle" font-family="monospace">0x2f60</text>
<text x="791.0" y="286" fill="#5f5f78" font-size="8" text-anchor="start" font-family="monospace">V</text>
<circle cx="805.0" cy="283" r="3.2" fill="#3a3a52"/>
<text x="425.0" y="227" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">tag 相等 → 命中</text>
<rect x="90" y="314" width="768" height="26" rx="2" fill="#101018" stroke="#3a3a52" stroke-width="1"/>
<text x="100" y="331" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">8 个 tag 同时比较（组合逻辑，不用逐个试）</text>
<line x1="134.0" y1="294" x2="134.0" y2="314" stroke="#2a2a3e" stroke-width="1"/>
<line x1="231.0" y1="294" x2="231.0" y2="314" stroke="#2a2a3e" stroke-width="1"/>
<line x1="328.0" y1="294" x2="328.0" y2="314" stroke="#2a2a3e" stroke-width="1"/>
<line x1="425.0" y1="294" x2="425.0" y2="314" stroke="#67d9a0" stroke-width="1.6"/>
<line x1="522.0" y1="294" x2="522.0" y2="314" stroke="#2a2a3e" stroke-width="1"/>
<line x1="619.0" y1="294" x2="619.0" y2="314" stroke="#2a2a3e" stroke-width="1"/>
<line x1="716.0" y1="294" x2="716.0" y2="314" stroke="#2a2a3e" stroke-width="1"/>
<line x1="813.0" y1="294" x2="813.0" y2="314" stroke="#2a2a3e" stroke-width="1"/>
<text x="24" y="370" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">命中第 4 路 → 取出这一行里偏移 0x14 处的字节 → 4 拍后交给 ALU。</text>
<text x="24" y="390" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">如果 8 个 tag 都不等，就是未命中：要么去 L2 拿（12 拍），要么走 RFO 连独占权一起拿（更贵）。</text>
<text x="24" y="434" fill="#8a8aa4" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么是 8 路不是 1 路：同一组里的 8 路可以装 8 个 index 相同的不同地址。</text>
<text x="24" y="452" fill="#7a7a92" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只有 1 路（直接映射）时，两个地址撞上同一个 index 就得互相踢，哪怕缓存里还有大半是空的。</text>
<text x="24" y="470" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么不是 64 路：每一路都要一套比较器和读出放大器，面积、功耗、命中时间全都上去，实测 8～16 路之后收益就很小了。</text>
</svg>
