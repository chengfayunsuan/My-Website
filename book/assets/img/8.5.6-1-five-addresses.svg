<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">8.5.6-1 / 一张表上有五个「地址」</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">名字都不一样，能填的东西也不一样</text>
<text x="24" y="86" fill="#5e5e78" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">地址</text>
<text x="240" y="86" fill="#5e5e78" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">谁要看它</text>
<text x="468" y="86" fill="#5e5e78" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代理地址行不行</text>
<rect x="24" y="100" width="632" height="50" rx="5" fill="#15151f" stroke="#26263a" stroke-width="1"/>
<text x="40" y="124" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">注册地址</text>
<text x="40" y="142" fill="#5e5e78" font-size="9.5" text-anchor="start" font-family="monospace">Registered address</text>
<text x="240" y="124" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">州政府档案、年报</text>
<text x="240" y="142" fill="#6a6a84" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代理的本职</text>
<rect x="468" y="114" width="168" height="24" rx="12" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="552" y="130" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">必须用</text>
<rect x="24" y="158" width="632" height="50" rx="5" fill="#15151f" stroke="#26263a" stroke-width="1"/>
<text x="40" y="182" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">营业地址</text>
<text x="40" y="200" fill="#5e5e78" font-size="9.5" text-anchor="start" font-family="monospace">Business address</text>
<text x="240" y="182" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Stripe / 银行 / 广告后台</text>
<text x="240" y="200" fill="#6a6a84" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要与注册地址一致</text>
<rect x="468" y="172" width="168" height="24" rx="12" fill="#12121a" stroke="#e8b84b" stroke-width="1"/>
<text x="552" y="188" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可以，但会被查</text>
<rect x="24" y="216" width="632" height="50" rx="5" fill="#15151f" stroke="#26263a" stroke-width="1"/>
<text x="40" y="240" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">账单地址</text>
<text x="40" y="258" fill="#5e5e78" font-size="9.5" text-anchor="start" font-family="monospace">Billing address</text>
<text x="240" y="240" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行卡、发票、税表</text>
<text x="240" y="258" fill="#6a6a84" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换一次要重新验证</text>
<rect x="468" y="230" width="168" height="24" rx="12" fill="#12121a" stroke="#e8b84b" stroke-width="1"/>
<text x="552" y="246" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要用同一个</text>
<rect x="24" y="274" width="632" height="50" rx="5" fill="#15151f" stroke="#26263a" stroke-width="1"/>
<text x="40" y="298" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">邮寄地址</text>
<text x="40" y="316" fill="#5e5e78" font-size="9.5" text-anchor="start" font-family="monospace">Mailing address</text>
<text x="240" y="298" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收卡、收信、收法院文件</text>
<text x="240" y="316" fill="#6a6a84" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">转运商就干这个</text>
<rect x="468" y="288" width="168" height="24" rx="12" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="552" y="304" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可以</text>
<rect x="24" y="332" width="632" height="50" rx="5" fill="#15151f" stroke="#26263a" stroke-width="1"/>
<text x="40" y="356" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">居住地址</text>
<text x="40" y="374" fill="#5e5e78" font-size="9.5" text-anchor="start" font-family="monospace">Residential address</text>
<text x="240" y="356" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">KYC、税务身份、券商</text>
<text x="240" y="374" fill="#6a6a84" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">必须是你真住的地方</text>
<rect x="468" y="346" width="168" height="24" rx="12" fill="#12121a" stroke="#e87a8a" stroke-width="1"/>
<text x="552" y="362" fill="#e87a8a" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不能用</text>
<text x="24" y="418" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">五个地址不必相同，但同一笔业务里出现的几个必须互相对得上——对不上就是“材料不一致”。</text>
</svg>
