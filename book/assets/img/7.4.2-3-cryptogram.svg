<rect x="40" y="306" width="800" height="0.8" rx="0" fill="#3a3a52" stroke="#3a3a52" stroke-width="0"/>
<text x="40" y="328" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">磁条卡发的是同一串固定数字，被抄一次就永久泄露；芯片每次都不一样，抄到的下一次就用不了了。</text>
