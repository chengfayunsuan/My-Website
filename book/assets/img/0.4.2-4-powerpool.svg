<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="400" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">同一条预算，能不能借</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">每条都是一整份功耗预算。灰色部分不是「省下来的」，是「锁在另一个部门手里、借不出来」</text>

  <text x="24" y="120" fill="#d8d8e4" font-size="9.5">剪视频</text>
  <rect x="150" y="86" width="560" height="22" rx="2" fill="#141420" stroke="#33334a"/>
  <rect x="150" y="86" width="364" height="22" rx="2" fill="#e8b84b" fill-opacity="0.30" stroke="#e8b84b"/>
  <text x="332" y="101" fill="#e8b84b" font-size="7.5" text-anchor="middle">传统 · 用掉 65%</text>
  <rect x="150" y="118" width="560" height="22" rx="2" fill="#141420" stroke="#33334a"/>
  <rect x="150" y="118" width="560" height="22" rx="2" fill="#4ec9a3" fill-opacity="0.30" stroke="#4ec9a3"/>
  <text x="430" y="133" fill="#4ec9a3" font-size="7.5" text-anchor="middle">M1 · 用掉 100%</text>
  <text x="24" y="196" fill="#d8d8e4" font-size="9.5">编译代码</text>
  <rect x="150" y="162" width="560" height="22" rx="2" fill="#141420" stroke="#33334a"/>
  <rect x="150" y="162" width="280" height="22" rx="2" fill="#e8b84b" fill-opacity="0.30" stroke="#e8b84b"/>
  <text x="290" y="177" fill="#e8b84b" font-size="7.5" text-anchor="middle">传统 · 用掉 50%</text>
  <rect x="150" y="194" width="560" height="22" rx="2" fill="#141420" stroke="#33334a"/>
  <rect x="150" y="194" width="560" height="22" rx="2" fill="#4ec9a3" fill-opacity="0.30" stroke="#4ec9a3"/>
  <text x="430" y="209" fill="#4ec9a3" font-size="7.5" text-anchor="middle">M1 · 用掉 100%</text>
  <text x="24" y="272" fill="#d8d8e4" font-size="9.5">待机</text>
  <rect x="150" y="238" width="560" height="22" rx="2" fill="#141420" stroke="#33334a"/>
  <rect x="150" y="238" width="28" height="22" rx="2" fill="#e8b84b" fill-opacity="0.30" stroke="#e8b84b"/>
  <text x="186" y="253" fill="#e8b84b" font-size="7.5">传统 · 用掉 5%</text>
  <rect x="150" y="270" width="560" height="22" rx="2" fill="#141420" stroke="#33334a"/>
  <rect x="150" y="270" width="34" height="22" rx="2" fill="#4ec9a3" fill-opacity="0.30" stroke="#4ec9a3"/>
  <text x="192" y="285" fill="#4ec9a3" font-size="7.5">M1 · 用掉 6%</text>

  <line x1="24" y1="318" x2="736" y2="318" stroke="#2a2a44"/>

  <g font-size="7.5">
    <rect x="24" y="330" width="10" height="10" fill="#e8b84b" fill-opacity="0.30" stroke="#e8b84b"/>
    <text x="40" y="339" fill="#9a9ab4">传统：用掉的部分</text>
    <rect x="160" y="330" width="10" height="10" fill="#4ec9a3" fill-opacity="0.30" stroke="#4ec9a3"/>
    <text x="176" y="339" fill="#9a9ab4">M1：用掉的部分</text>
    <rect x="290" y="330" width="10" height="10" fill="#141420" stroke="#33334a"/>
    <text x="306" y="339" fill="#9a9ab4">用不上（被上限锁住）</text>
  </g>

  <text x="24" y="366" fill="#e8b84b" font-size="9">「浪费」不是效率低，是「A 闲着的额度，B 不能借」——M1 的池子让这件事第一次成为可能。</text>
  <text x="24" y="386" fill="#6b6b85" font-size="8.5">注意最后一行：待机时两边的绝对功耗都很低，但传统结构里仍有大量电路在漏电与空转。</text>
</svg>