<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="396" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.2-4  汇率制度的光谱：没有「对不对」，只有「愿不愿意付代价」</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从左到右，政府的控制力递减、市场的决定权递增。每一个经济体都在某一段上</text>
<rect x="70" y="104" width="224" height="92" rx="4" fill="#2a1a20" stroke="#e87a8a" stroke-width="1.3"/>
<text x="185.0" y="136" fill="#e87a8a" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">硬钉住</text>
<text x="185.0" y="160" fill="#8a8aa2" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美元化、货币局</text>
<rect x="300" y="104" width="224" height="92" rx="4" fill="#2a2410" stroke="#e8b84b" stroke-width="1.3"/>
<text x="415.0" y="136" fill="#e8b84b" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">软钉住</text>
<text x="415.0" y="160" fill="#8a8aa2" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">传统钉住、爬行钉住、目标区</text>
<rect x="530" y="104" width="274" height="92" rx="4" fill="#16281c" stroke="#67d9a0" stroke-width="1.3"/>
<text x="670.0" y="136" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">浮动</text>
<text x="670.0" y="160" fill="#8a8aa2" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管理浮动、自由浮动</text>
<text x="185.0" y="234" fill="#9a7a82" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">厄瓜多尔（用美元）</text>
<text x="185.0" y="252" fill="#9a7a82" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">香港（货币局）</text>
<text x="415" y="234" fill="#a08a50" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">沙特（钉美元）</text>
<text x="415" y="252" fill="#a08a50" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">越南（爬行）</text>
<text x="670" y="234" fill="#7a9a8a" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中国、印度（管理）</text>
<text x="670" y="252" fill="#7a9a8a" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美国、欧元区（自由）</text>
<line x1="70" y1="278" x2="800" y2="316" stroke="#4a4a66" stroke-width="1.4"/>
<path d="M810,278 L798,273 L798,283 Z" fill="#8a8aa2" stroke="#8a8aa2" stroke-width="1"/>
<text x="70" y="300" fill="#6f6f88" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">政府控制力强</text>
<text x="810" y="300" fill="#6f6f88" font-size="8.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">市场决定</text>
<text x="40" y="344" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">硬钉住的代价是放弃货币政策，软钉住的代价是随时可能被投机资金冲击，浮动的代价是汇率本身会变成风险。</text>
<text x="40" y="368" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没有哪一段是「正确」的。选哪一段，取决于这个经济体更怕什么：怕通胀、怕失业，还是怕资本外逃。</text>
</svg>
