<svg width="760" height="450" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="450" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">矩阵：24 根线管 128 个键，代价是「鬼键」</text>

  <!-- 左：矩阵 -->
  <text x="60" y="76" fill="#9fd4f5" font-size="10">实际结构：8 行 × 16 列</text>

  <g stroke="#4a4a68" stroke-width="1">
    <line x1="60" y1="110" x2="290" y2="110"/>
    <line x1="60" y1="170" x2="290" y2="170"/>
    <line x1="60" y1="230" x2="290" y2="230"/>
    <line x1="60" y1="290" x2="290" y2="290"/>
    <line x1="60" y1="110" x2="60" y2="290"/>
    <line x1="137" y1="110" x2="137" y2="290"/>
    <line x1="214" y1="110" x2="214" y2="290"/>
    <line x1="290" y1="110" x2="290" y2="290"/>
  </g>

  <g fill="#0e0e16" stroke="#67b5ef" stroke-width="1.6">
    <circle cx="60" cy="110" r="5"/><circle cx="137" cy="110" r="5"/><circle cx="214" cy="110" r="5"/><circle cx="290" cy="110" r="5"/>
    <circle cx="60" cy="170" r="5"/><circle cx="137" cy="170" r="5"/><circle cx="214" cy="170" r="5"/><circle cx="290" cy="170" r="5"/>
    <circle cx="60" cy="230" r="5"/><circle cx="137" cy="230" r="5"/><circle cx="214" cy="230" r="5"/><circle cx="290" cy="230" r="5"/>
    <circle cx="60" cy="290" r="5"/><circle cx="137" cy="290" r="5"/><circle cx="214" cy="290" r="5"/><circle cx="290" cy="290" r="5"/>
  </g>

  <text x="42" y="106" fill="#6b6b85" font-size="8" text-anchor="end">行 1</text>
  <text x="42" y="166" fill="#6b6b85" font-size="8" text-anchor="end">行 2</text>
  <text x="42" y="226" fill="#6b6b85" font-size="8" text-anchor="end">行 3</text>
  <text x="42" y="286" fill="#6b6b85" font-size="8" text-anchor="end">行 4</text>
  <text x="60" y="308" fill="#6b6b85" font-size="8" text-anchor="middle">列1</text>
  <text x="137" y="308" fill="#6b6b85" font-size="8" text-anchor="middle">列2</text>
  <text x="214" y="308" fill="#6b6b85" font-size="8" text-anchor="middle">列3 …</text>
  <text x="290" y="308" fill="#6b6b85" font-size="8" text-anchor="middle">列16</text>

  <text x="60" y="336" fill="#9a9ab4" font-size="9">一行一行拉低，读各列；每行几微秒，一轮不到 1 毫秒</text>
  <text x="60" y="354" fill="#6b6b85" font-size="8.5">8 + 16 = 24 根线。如果一键一根，要 105 根</text>

  <!-- 右：鬼键 -->
  <line x1="400" y1="66" x2="400" y2="120" stroke="#2a2a44"/>
  <text x="420" y="76" fill="#f0606a" font-size="10">鬼键：按三个，冒出第四个</text>

  <g stroke="#4a4a68" stroke-width="1.4">
    <line x1="440" y1="130" x2="680" y2="130"/>
    <line x1="440" y1="250" x2="680" y2="250"/>
    <line x1="470" y1="100" x2="470" y2="280"/>
    <line x1="640" y1="100" x2="640" y2="280"/>
  </g>

  <!-- 真实按下 -->
  <circle cx="470" cy="130" r="7" fill="#4ec9a3"/>
  <circle cx="640" cy="130" r="7" fill="#4ec9a3"/>
  <circle cx="640" cy="250" r="7" fill="#4ec9a3"/>
  <text x="458" y="122" fill="#9fe0c9" font-size="8.5" text-anchor="end">A</text>
  <text x="652" y="122" fill="#9fe0c9" font-size="8.5">B</text>
  <text x="652" y="256" fill="#9fe0c9" font-size="8.5">D</text>

  <!-- 幽灵 -->
  <circle cx="470" cy="250" r="7" fill="none" stroke="#f0606a" stroke-width="2"/>
  <text x="456" y="244" fill="#f0606a" font-size="8.5" text-anchor="end">C ?</text>

  <!-- 绕路 -->
  <path d="M440,262 L640,262 L640,142 L470,142 L470,250" fill="none" stroke="#f0606a" stroke-width="1.6" stroke-dasharray="5 3"/>

  <text x="420" y="306" fill="#f0606a" font-size="8.5">扫第 2 行时，电流绕道：D → 列2 → B → 行1 → A → 列1</text>
  <text x="420" y="322" fill="#9a9ab4" font-size="8.5">结果列 1 也被拉低，系统以为 C 也按下了</text>

  <!-- 解决 -->
  <text x="420" y="352" fill="#e8b84b" font-size="9.5">解法：每个开关串一颗二极管，只准电流单向流</text>
  <text x="420" y="370" fill="#6b6b85" font-size="8.5">104 颗二极管几块钱——这就是「全键无冲」的全部成本</text>

  <line x1="24" y1="392" x2="736" y2="392" stroke="#2a2a44"/>
  <text x="24" y="412" fill="#9a9ab4" font-size="9">USB 键盘报告默认只放 6 个按键码，所以「全键无冲」在 USB 下要扩展报告描述符才成立。</text>
  <text x="24" y="432" fill="#6b6b85" font-size="8.5">在记事本里同时按 A、S、D 和 Q、W、E，有些键盘前者会漏一个——走线决定的，不是坏了。</text>
</svg>
