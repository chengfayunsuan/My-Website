<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">收款方式有四档：免费和能用是两回事</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从左到右：门槛变高，能做的事变多</text>
<rect x="36" y="288" width="140" height="64" rx="4" fill="#8a8aa02e" stroke="#8a8aa0" stroke-width="1.5"/>
<text x="106" y="314" fill="#8a8aa0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">个人二维码</text>
<text x="106" y="376" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">免费、实时到账</text>
<text x="106" y="394" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">限额、易被风控冻结</text>
<text x="106" y="412" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开不了发票</text>
<rect x="192" y="236" width="140" height="116" rx="4" fill="#67b5ef2e" stroke="#67b5ef" stroke-width="1.5"/>
<text x="262" y="262" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">个人经营码</text>
<text x="262" y="376" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">免费提现</text>
<text x="262" y="394" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">仍有限额</text>
<text x="262" y="412" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不能接 API</text>
<rect x="348" y="180" width="140" height="172" rx="4" fill="#e8b84b2e" stroke="#e8b84b" stroke-width="1.5"/>
<text x="418" y="206" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">商户号</text>
<text x="418" y="376" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费率约 0.6%</text>
<text x="418" y="394" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要营业执照</text>
<text x="418" y="412" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发票、API、T+1</text>
<rect x="504" y="120" width="140" height="232" rx="4" fill="#67d9a02e" stroke="#67d9a0" stroke-width="1.5"/>
<text x="574" y="146" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">海外通道</text>
<text x="574" y="376" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">费率约 3%</text>
<text x="574" y="394" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要海外主体</text>
<text x="574" y="412" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">信用卡、多币种</text>
<line x1="28" y1="352" x2="652" y2="352" stroke="#4a4a62" stroke-width="1.5"/>
<text x="28" y="442" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">个人码免费是真的，但免费的意思是"没有服务"：没有发票、没有 API、没有账目，风控来了也没有申诉入口。</text>
</svg>
