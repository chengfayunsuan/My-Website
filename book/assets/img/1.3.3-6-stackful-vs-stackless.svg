<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="412" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">有栈协程与无栈协程：上下文到底存在哪</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">左：N 个执行流 = N 份栈　右：一份栈 + 堆上 N 个状态机</text>
<text x="40" y="92" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">① 有栈（Go、绿色线程）</text>
<rect x="60" y="118" width="84" height="150" rx="3" fill="#15151f" stroke="#67b5ef" stroke-width="1.4"/>
<rect x="68" y="126" width="68" height="36" rx="2" fill="#1e2430" stroke="#2e3a4a" stroke-width="1"/>
<text x="102" y="148" fill="#6d7a8c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">帧</text>
<rect x="68" y="170" width="68" height="36" rx="2" fill="#1e2430" stroke="#2e3a4a" stroke-width="1"/>
<text x="102" y="192" fill="#6d7a8c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">帧</text>
<rect x="68" y="214" width="68" height="36" rx="2" fill="#1e2430" stroke="#2e3a4a" stroke-width="1"/>
<text x="102" y="236" fill="#6d7a8c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">帧</text>
<text x="102" y="286" fill="#8a8aa2" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">协程 1</text>
<text x="102" y="302" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">2 KB 起</text>
<line x1="68" y1="112" x2="68" y2="117" stroke="#67d9a0" stroke-width="1.8"/>
<text x="75" y="116" fill="#67d9a0" font-size="8.5" text-anchor="start" font-family="monospace">rsp</text>
<rect x="170" y="118" width="84" height="150" rx="3" fill="#15151f" stroke="#67b5ef" stroke-width="1.4"/>
<rect x="178" y="126" width="68" height="36" rx="2" fill="#1e2430" stroke="#2e3a4a" stroke-width="1"/>
<text x="212" y="148" fill="#6d7a8c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">帧</text>
<rect x="178" y="170" width="68" height="36" rx="2" fill="#1e2430" stroke="#2e3a4a" stroke-width="1"/>
<text x="212" y="192" fill="#6d7a8c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">帧</text>
<rect x="178" y="214" width="68" height="36" rx="2" fill="#1e2430" stroke="#2e3a4a" stroke-width="1"/>
<text x="212" y="236" fill="#6d7a8c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">帧</text>
<text x="212" y="286" fill="#8a8aa2" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">协程 2</text>
<text x="212" y="302" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">2 KB 起</text>
<line x1="178" y1="112" x2="178" y2="117" stroke="#67d9a0" stroke-width="1.8"/>
<rect x="280" y="118" width="84" height="150" rx="3" fill="#15151f" stroke="#67b5ef" stroke-width="1.4"/>
<rect x="288" y="126" width="68" height="36" rx="2" fill="#1e2430" stroke="#2e3a4a" stroke-width="1"/>
<text x="322" y="148" fill="#6d7a8c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">帧</text>
<rect x="288" y="170" width="68" height="36" rx="2" fill="#1e2430" stroke="#2e3a4a" stroke-width="1"/>
<text x="322" y="192" fill="#6d7a8c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">帧</text>
<rect x="288" y="214" width="68" height="36" rx="2" fill="#1e2430" stroke="#2e3a4a" stroke-width="1"/>
<text x="322" y="236" fill="#6d7a8c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">帧</text>
<text x="322" y="286" fill="#8a8aa2" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">协程 3</text>
<text x="322" y="302" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="monospace">2 KB 起</text>
<line x1="288" y1="112" x2="288" y2="117" stroke="#67d9a0" stroke-width="1.8"/>
<text x="40" y="334" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">切换 = 换一个 rsp 寄存器，几条指令</text>
<text x="40" y="354" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价 = N 份栈，一千个协程就是几 MB</text>
<text x="470" y="92" fill="#b58ae8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">② 无栈（Rust / C++ / Kotlin 的 async）</text>
<rect x="470" y="118" width="106" height="150" rx="3" fill="#15151f" stroke="#4a4a62" stroke-width="1.4"/>
<text x="523" y="144" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">调用者栈</text>
<rect x="478" y="158" width="90" height="40" rx="2" fill="#1e1a2a" stroke="#b58ae8" stroke-width="1.2"/>
<text x="523" y="183" fill="#b58ae8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">poll() 的帧</text>
<text x="523" y="242" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只有当前在跑的</text>
<text x="523" y="254" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">那一个任务占栈</text>
<rect x="640" y="118" width="220" height="150" rx="3" fill="#141420" stroke="#b58ae8" stroke-width="1.4"/>
<text x="750" y="142" fill="#b58ae8" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">堆</text>
<rect x="650" y="154" width="200" height="28" rx="2" fill="#1e1a2a" stroke="#4a3a5a" stroke-width="1"/>
<text x="662" y="173" fill="#a596b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">任务 A 的状态机</text>
<text x="838" y="173" fill="#6a6a82" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">挂着</text>
<rect x="650" y="188" width="200" height="28" rx="2" fill="#1e1a2a" stroke="#4a3a5a" stroke-width="1"/>
<text x="662" y="207" fill="#a596b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">任务 B 的状态机</text>
<text x="838" y="207" fill="#6a6a82" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">挂着</text>
<rect x="650" y="222" width="200" height="28" rx="2" fill="#1e1a2a" stroke="#4a3a5a" stroke-width="1"/>
<text x="662" y="241" fill="#a596b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">任务 C 的状态机</text>
<text x="838" y="241" fill="#6a6a82" font-size="8.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">挂着</text>
<line x1="586" y1="178" x2="634" y2="178" stroke="#b58ae8" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M636,178 L626,173 L626,183 Z" fill="#b58ae8"/>
<text x="613.0" y="170" fill="#b58ae8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">指针</text>
<text x="470" y="334" fill="#e8b84b" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">挂起 = 把状态号和一个指针存下来，栈可以还给别人</text>
<text x="470" y="354" fill="#7a7a94" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价 = 每个 await 点都要保存恢复，调试时对不上源码</text>
<text x="40" y="386" fill="#6a6a82" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两种都没有错，只是把成本放在了不同的地方：一个有 N 份栈但切换极快，一个只有一份栈但每次恢复都要重建状态。</text>
</svg>
