<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 415" width="880" height="415" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="415" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.2-3  三道闸门：钱要出去，三道都得打开</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">串联不是并联，任何一道关着，钱就到不了企业手里</text>
<rect x="44" y="152" width="792" height="46" rx="4" fill="#14141f" stroke="#2f2f45" stroke-width="1.2"/>
<text x="56" y="180" fill="#8a8aa2" font-size="9.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行的钱</text>
<text x="824" y="180" fill="#8a8aa2" font-size="9.6" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">企业</text>
<rect x="228" y="144" width="20" height="62" rx="2" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<line x1="212" y1="152" x2="264" y2="152" stroke="#67d9a0" stroke-width="1.2"/>
<line x1="212" y1="198" x2="264" y2="198" stroke="#67d9a0" stroke-width="1.2"/>
<text x="238" y="112" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">准备金与流动性</text>
<text x="238" y="96" fill="#7a7a94" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">价格闸门</text>
<text x="238" y="250" fill="#9a9ab4" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">放多了要借钱补头寸</text>
<text x="238" y="268" fill="#7a7a94" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">成本上升，利差被吃掉</text>
<rect x="428" y="144" width="20" height="62" rx="2" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<line x1="412" y1="152" x2="464" y2="152" stroke="#67b5ef" stroke-width="1.2"/>
<line x1="412" y1="198" x2="464" y2="198" stroke="#67b5ef" stroke-width="1.2"/>
<text x="438" y="112" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">资本充足率</text>
<text x="438" y="96" fill="#7a7a94" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数量闸门</text>
<text x="438" y="250" fill="#9a9ab4" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每笔贷款都要占自有资本</text>
<text x="438" y="268" fill="#7a7a94" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资本不够只能缩表</text>
<rect x="628" y="144" width="20" height="62" rx="2" fill="#e8965a" stroke="#e8965a" stroke-width="1"/>
<line x1="612" y1="152" x2="664" y2="152" stroke="#e8965a" stroke-width="1.2"/>
<line x1="612" y1="198" x2="664" y2="198" stroke="#e8965a" stroke-width="1.2"/>
<text x="638" y="112" fill="#e8965a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">借贷需求</text>
<text x="638" y="96" fill="#7a7a94" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">意愿闸门</text>
<text x="638" y="250" fill="#9a9ab4" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">没人来借，额度空着</text>
<text x="638" y="268" fill="#7a7a94" font-size="8.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行不能逼人借钱</text>
<text x="40" y="312" fill="#a0a0b8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">三道闸门里，央行只能直接动第一道（调利率、调准备金率）；第二道归金融监管总局管；第三道谁也没法直接命令。</text>
<text x="40" y="342" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2022 年之后的中国，主要卡在第三道：利率降了、准备金也降了，但企业不扩张、居民提前还房贷，钱堆在银行的超额准备金账户里。</text>
<text x="40" y="370" fill="#6f7f92" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2013 年的「钱荒」卡在第一道：央行不续作，隔夜利率冲到 13%，靠短钱养长资产的银行当场补不上头寸。同一个体系，卡的位置不同，症状完全不同。</text>
</svg>
