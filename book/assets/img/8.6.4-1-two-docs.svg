<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">注册页上那一个勾，其实签了两份合同</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">用户协议管"能做什么"，隐私政策管"信息怎么处理"</text>
<rect x="180" y="84" width="320" height="44" rx="6" fill="#16161f" stroke="#4a4a62" stroke-width="1.3"/>
<rect x="196" y="96" width="20" height="20" rx="3" fill="#67d9a02a" stroke="#67d9a0" stroke-width="1.5"/>
<text x="201" y="112" fill="#67d9a0" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">✓</text>
<text x="228" y="113" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">我已阅读并同意两份文件</text>
<line x1="340" y1="128" x2="340" y2="150" stroke="#4a4a62" stroke-width="1.4"/>
<line x1="165" y1="150" x2="515" y2="150" stroke="#4a4a62" stroke-width="1.4"/>
<line x1="165" y1="150" x2="165" y2="168" stroke="#4a4a62" stroke-width="1.4"/>
<line x1="515" y1="150" x2="515" y2="168" stroke="#4a4a62" stroke-width="1.4"/>
<rect x="36" y="168" width="258" height="196" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="36" y="168" width="258" height="34" rx="6" fill="#67b5ef26" stroke="none" stroke-width="0"/>
<text x="165" y="190" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">用户协议</text>
<text x="52" y="222" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管你和用户之间的「关系」</text>
<line x1="52" y1="232" x2="278" y2="232" stroke="#2e2e44" stroke-width="1"/>
<text x="52" y="252" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 账号归谁、能不能转让</text>
<text x="52" y="277" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 用户发的内容你能否使用</text>
<text x="52" y="302" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 出了事你赔到哪一步</text>
<text x="52" y="327" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 什么情况下可以封号</text>
<text x="165" y="348" fill="#67b5ef" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">违约、侵权、责任划分</text>
<rect x="386" y="168" width="258" height="196" rx="6" fill="#14141e" stroke="#3a3a52" stroke-width="1.4"/>
<rect x="386" y="168" width="258" height="34" rx="6" fill="#67d9a026" stroke="none" stroke-width="0"/>
<text x="515" y="190" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">隐私政策</text>
<text x="402" y="222" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">管你怎么处理他的「信息」</text>
<line x1="402" y1="232" x2="624" y2="232" stroke="#2e2e44" stroke-width="1"/>
<text x="402" y="252" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 收集哪些字段、为什么收</text>
<text x="402" y="277" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 会不会给第三方、给谁</text>
<text x="402" y="302" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 存多久、存在哪里</text>
<text x="402" y="327" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 他怎么查、改、删、撤回</text>
<text x="515" y="348" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">告知义务与同意</text>
<text x="340" y="398" fill="#c8c8dc" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一个勾选动作，两份法律义务。少一份，另一份也保不住。</text>
<text x="340" y="420" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这两份不是"免责声明"，是"提前把规则说清楚"。</text>
</svg>
