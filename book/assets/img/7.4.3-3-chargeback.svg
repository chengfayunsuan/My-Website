<text x="105" y="126" fill="#67b5ef" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你</text>
<text x="105" y="148" fill="#8a8aa0" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">打客服 / App 冻结</text>
<path d="M172,134 L208,134" fill="none" stroke="#8a8aa0" stroke-width="1.4"/>
