<rect x="376" y="96" width="130" height="76" rx="6" fill="#15151f" stroke="#b58ae8" stroke-width="1.4"/>
<text x="441" y="126" fill="#b58ae8" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡组织</text>
<text x="441" y="148" fill="#8a8aa0" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">转给收单行</text>
<path d="M508,134 L544,134" fill="none" stroke="#8a8aa0" stroke-width="1.4"/>
<path d="M544,129 L552,134 L544,139 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="544" y="96" width="130" height="76" rx="6" fill="#15151f" stroke="#e8965a" stroke-width="1.4"/>
<text x="609" y="126" fill="#e8965a" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收单行</text>
<text x="609" y="148" fill="#8a8aa0" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">找商户要证据</text>
<path d="M676,134 L712,134" fill="none" stroke="#8a8aa0" stroke-width="1.4"/>
<path d="M712,129 L720,134 L712,139 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<rect x="712" y="96" width="130" height="76" rx="6" fill="#15151f" stroke="#e87a8a" stroke-width="1.4"/>
<text x="777" y="126" fill="#e87a8a" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商户</text>
<text x="777" y="148" fill="#8a8aa0" font-size="9.2" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">举证或认赔</text>
<text x="40" y="210" fill="#c8c8d4" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">时间线：报挂失当天冻结，拒付一般 3～15 个工作日出结果，最长可以拖到 45 天。</text>
<text x="40" y="234" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商户拿不出你本人签字的凭证，这笔钱通常判给你；反过来，如果商户有你的验证码记录，就很难赢。</text>
<text x="40" y="274" fill="#6e6e88" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以第一件事永远是：先冻结，再报警，最后才是跟银行谈。顺序错了，钱可能在你操作之前就被转走。</text>
