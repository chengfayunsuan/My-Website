<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="462" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">GBK 的双字节空间：一个二维的格子铺</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">每一格代表 256 个码位，横轴是低字节的高 4 位，纵轴是高字节的高 4 位</text>

  <!-- 行标签 -->
  <text x="102" y="116" fill="#6b6b85" font-size="7.5" text-anchor="end" font-family="monospace">80</text>
  <text x="102" y="146" fill="#6b6b85" font-size="7.5" text-anchor="end" font-family="monospace">90</text>
  <text x="102" y="176" fill="#6b6b85" font-size="7.5" text-anchor="end" font-family="monospace">A0</text>
  <text x="102" y="206" fill="#6b6b85" font-size="7.5" text-anchor="end" font-family="monospace">B0</text>
  <text x="102" y="236" fill="#6b6b85" font-size="7.5" text-anchor="end" font-family="monospace">C0</text>
  <text x="102" y="266" fill="#6b6b85" font-size="7.5" text-anchor="end" font-family="monospace">D0</text>
  <text x="102" y="296" fill="#6b6b85" font-size="7.5" text-anchor="end" font-family="monospace">E0</text>
  <text x="102" y="326" fill="#6b6b85" font-size="7.5" text-anchor="end" font-family="monospace">F0</text>

  <!-- 列标签 -->
  <text x="127" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">0</text>
  <text x="161" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">1</text>
  <text x="195" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">2</text>
  <text x="229" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">3</text>
  <text x="263" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">4</text>
  <text x="297" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">5</text>
  <text x="331" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">6</text>
  <text x="365" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">7</text>
  <text x="399" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">8</text>
  <text x="433" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">9</text>
  <text x="467" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">A</text>
  <text x="501" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">B</text>
  <text x="535" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">C</text>
  <text x="569" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">D</text>
  <text x="603" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">E</text>
  <text x="637" y="352" fill="#6b6b85" font-size="7" text-anchor="middle" font-family="monospace">F</text>

  <!-- 网格：无效区 列0-3 -->
  <rect x="110" y="96" width="136" height="240" fill="#171724"/>
  <text x="178" y="222" fill="#55556e" font-size="8.5" text-anchor="middle">无效区</text>

  <!-- GBK 扩展：行0-2 全列4-F + 行3-7 列4-9 -->
  <rect x="246" y="96" width="408" height="90" fill="#1c2b44" stroke="#4a7ab0"/>
  <rect x="246" y="186" width="204" height="150" fill="#1c2b44" stroke="#4a7ab0"/>

  <!-- GB2312 汉字区：行3-7 列A-F -->
  <rect x="450" y="186" width="204" height="150" fill="#20303a" stroke="#4ec9a3"/>

  <text x="552" y="252" fill="#9fe0c9" font-size="9" text-anchor="middle">GB2312 汉字区</text>
  <text x="552" y="268" fill="#6f8a80" font-size="7.5" text-anchor="middle">6763 个汉字 + 682 个符号</text>
  <text x="450" y="150" fill="#9fd4f5" font-size="8.5" text-anchor="middle">GBK 扩展区（约 2.1 万字）</text>

  <!-- 红框：低字节 0x40-0x7F -->
  <rect x="246" y="94" width="136" height="244" fill="none" stroke="#ef6b6b" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="314" y="88" fill="#ef6b6b" font-size="8" text-anchor="middle">低字节 0x40–0x7F</text>

  <!-- 图例 -->
  <line x1="30" y1="370" x2="730" y2="370" stroke="#2a2a3c"/>

  <rect x="30" y="382" width="11" height="11" rx="2" fill="#20303a" stroke="#4ec9a3"/>
  <text x="48" y="392" fill="#9a9ab4" font-size="9">GB2312 汉字区</text>

  <rect x="160" y="382" width="11" height="11" rx="2" fill="#1c2b44" stroke="#4a7ab0"/>
  <text x="178" y="392" fill="#9a9ab4" font-size="9">GBK 扩展区</text>

  <rect x="280" y="382" width="11" height="11" rx="2" fill="#171724"/>
  <text x="298" y="392" fill="#9a9ab4" font-size="9">0x80 以下，不作高字节</text>

  <rect x="450" y="382" width="11" height="11" rx="2" fill="none" stroke="#ef6b6b" stroke-dasharray="3 2"/>
  <text x="468" y="392" fill="#ef6b6b" font-size="9">这一段和 ASCII 撞车</text>

  <text x="30" y="416" fill="#d8d8e4" font-size="9.5">撞击的后果：GBK 的两个字节里，第二个字节可能是 0x5C——也就是反斜杠。</text>
  <text x="30" y="434" fill="#9a9ab4" font-size="9">于是「汉字 + 反斜杠」在某些解析器里会被吃成一个字，字符串尾巴莫名消失，路径拼接出错。</text>
  <text x="30" y="452" fill="#6b6b85" font-size="9">这不是理论问题，Windows 上的中文路径 bug 有一大批出自这里。</text>
</svg>
