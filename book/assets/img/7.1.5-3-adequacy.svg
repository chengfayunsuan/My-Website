<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="404" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.5-3  多少储备才算够：三个尺子</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">国际惯例看两条线：能付几个月进口，能还几倍短期外债。底下那条红虚线是警戒线</text>
<text x="134" y="124" fill="#67d9a0" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">日本</text>
<rect x="150" y="100" width="468.0" height="36" rx="3" fill="#16161f" stroke="#67d9a0" stroke-width="1.2"/>
<text x="608.0" y="123" fill="#67d9a0" font-size="9.6" text-anchor="end" font-family="monospace">18 个月</text>
<text x="630.0" y="123" fill="#6f6f88" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 1.2 万亿</text>
<text x="134" y="182" fill="#67b5ef" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">中国</text>
<rect x="150" y="158" width="364.0" height="36" rx="3" fill="#16161f" stroke="#67b5ef" stroke-width="1.2"/>
<text x="504.0" y="181" fill="#67b5ef" font-size="9.6" text-anchor="end" font-family="monospace">14 个月</text>
<text x="526.0" y="181" fill="#6f6f88" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 3.2 万亿</text>
<text x="134" y="240" fill="#e8b84b" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">印度</text>
<rect x="150" y="216" width="260.0" height="36" rx="3" fill="#16161f" stroke="#e8b84b" stroke-width="1.2"/>
<text x="400.0" y="239" fill="#e8b84b" font-size="9.6" text-anchor="end" font-family="monospace">10 个月</text>
<text x="422.0" y="239" fill="#6f6f88" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 6500 亿</text>
<text x="134" y="298" fill="#e8965a" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">巴西</text>
<rect x="150" y="274" width="182.0" height="36" rx="3" fill="#16161f" stroke="#e8965a" stroke-width="1.2"/>
<text x="322.0" y="297" fill="#e8965a" font-size="9.6" text-anchor="end" font-family="monospace">7 个月</text>
<text x="344.0" y="297" fill="#6f6f88" font-size="8.6" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 3500 亿</text>
<line x1="241.0" y1="92" x2="241.0" y2="330" stroke="#e87a8a" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="249.0" y="88" fill="#e87a8a" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">警戒线 3~4 个月</text>
<text x="40" y="356" fill="#a0a0b8" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一个尺子是进口：储备要能付 3 到 4 个月的进口。第二个尺子是短期外债：储备要能覆盖一年内到期的外债，一般要求 1 倍以上。</text>
<text x="40" y="380" fill="#8a8aa2" font-size="9.3" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这两个都只回答「够不够付账」，没回答「够不够挡住外逃」。后者要看储备和 M2 的比例 —— 中国大约 10%，日本大约 20%。</text>
</svg>
