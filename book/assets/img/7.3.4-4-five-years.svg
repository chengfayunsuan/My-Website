<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="290" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.4 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">五年，从「还清那天」开始算</text>
<line x1="60" y1="160" x2="820" y2="160" stroke="#4a4a62" stroke-width="1.5"/>
<circle cx="120" cy="160" r="8" fill="#e87a8a" stroke="#e87a8a" stroke-width="0"/>
<text x="120" y="140" fill="#e87a8a" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">逾期发生</text>
<circle cx="330" cy="160" r="8" fill="#e8b84b" stroke="#e8b84b" stroke-width="0"/>
<text x="330" y="140" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">还清欠款</text>
<circle cx="700" cy="160" r="8" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<text x="700" y="140" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">记录删除</text>
<path d="M330,176 L700,176" fill="none" stroke="#67d9a0" stroke-width="1.6"/>
<path d="M700,170 L710,176 L700,182 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<text x="515" y="200" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这五年</text>
<text x="60" y="240" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键：不是从逾期那天算，是从你把钱还清那天算。一直不还，五年永远不开始。</text>
<text x="60" y="266" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「拖五年就自动消掉」是错的——拖着不还，这条记录会一直跟着你。</text>
</svg>
