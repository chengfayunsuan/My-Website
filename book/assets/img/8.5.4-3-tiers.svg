<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="680" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">8.5.4-3 / 你能动多少钱，决定他要看多深</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每上一级多两样材料；额度是"通常上限"，各家不同</text>
<rect x="40" y="290" width="140" height="96" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="40" y="290" width="140" height="3" rx="0" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="54" y="318" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="monospace" font-weight="600">Tier 0</text>
<text x="54" y="342" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">邮箱</text>
<text x="54" y="362" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">姓名</text>
<text x="110" y="406" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="monospace">$0　只看不收</text>
<rect x="188" y="234" width="140" height="96" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="188" y="234" width="140" height="3" rx="0" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="202" y="262" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="monospace" font-weight="600">Tier 1</text>
<text x="202" y="286" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">护照或身份证</text>
<text x="202" y="306" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人脸</text>
<text x="258" y="350" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="monospace">$1,000 / 年</text>
<rect x="336" y="178" width="140" height="96" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="336" y="178" width="140" height="3" rx="0" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="350" y="206" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="monospace" font-weight="600">Tier 2</text>
<text x="350" y="230" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+ 地址证明</text>
<text x="350" y="250" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+ 活体视频</text>
<text x="406" y="294" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="monospace">$10,000</text>
<rect x="484" y="122" width="140" height="96" rx="6" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<rect x="484" y="122" width="140" height="3" rx="0" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="498" y="150" fill="#67b5ef" font-size="12.5" text-anchor="start" font-family="monospace" font-weight="600">Tier 3</text>
<text x="498" y="174" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+ 资金来源</text>
<text x="498" y="194" fill="#c8c8dc" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+ 合同或发票</text>
<text x="554" y="238" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="monospace">无上限</text>
<text x="24" y="78" fill="#5e5e78" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">材料深度 ↑</text>
<text x="24" y="440" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是每家都按这四级。多数机构是三级，把 Tier 1 和 2 合成一步。</text>
<text x="24" y="460" fill="#6a6a84" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">触发线各家不同，但逻辑一样：动得越多，问得越细。</text>
</svg>
