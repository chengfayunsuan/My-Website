<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="424" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.5-1  外汇储备不是「国家的存款」，是央行的资产</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产那一栏多一块钱，负债那一栏就多一块钱。这是复式记账，不是存钱罐</text>
<rect x="60" y="96" width="330" height="210" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.5"/>
<text x="84" y="128" fill="#67b5ef" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">资产</text>
<line x1="84" y1="142" x2="366" y2="142" stroke="#33334a" stroke-width="1"/>
<text x="84" y="174" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">外汇储备</text>
<text x="250" y="174" fill="#b8bccd" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3.2 万亿美元</text>
<text x="84" y="208" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">黄金</text>
<text x="250" y="208" fill="#b8bccd" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2000 多吨</text>
<text x="84" y="242" fill="#8a8aa2" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">其他资产</text>
<text x="250" y="242" fill="#b8bccd" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">IMF 头寸等</text>
<rect x="490" y="96" width="330" height="210" rx="5" fill="#2a1a20" stroke="#e87a8a" stroke-width="1.5"/>
<text x="514" y="128" fill="#e87a8a" font-size="14" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">负债</text>
<line x1="514" y1="142" x2="796" y2="142" stroke="#3a2a30" stroke-width="1"/>
<text x="514" y="174" fill="#a88a92" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">流通中现金</text>
<text x="700" y="174" fill="#b8a0a8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 12 万亿元</text>
<text x="514" y="208" fill="#a88a92" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行准备金</text>
<text x="700" y="208" fill="#b8a0a8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 20 万亿元</text>
<text x="514" y="242" fill="#a88a92" font-size="8.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">（合起来叫基础货币）</text>
<text x="700" y="242" fill="#b8a0a8" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif"></text>
<line x1="400" y1="170" x2="480" y2="170" stroke="#e8b84b" stroke-width="1.6"/>
<path d="M480,170 L490,170 L480,165 L480,175 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<text x="440" y="158" fill="#e8b84b" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">买进 1 美元</text>
<line x1="400" y1="232" x2="480" y2="232" stroke="#67b5ef" stroke-width="1.6"/>
<path d="M480,232 L490,232 L480,227 L480,237 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<text x="440" y="252" fill="#67b5ef" font-size="8.6" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">放出约 7 元</text>
<text x="40" y="348" fill="#a0a0b8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行每买进 1 美元，就要按汇率放出约 7 元人民币。所以储备越多，国内投放的货币就越多 —— 这叫「外汇占款」。</text>
<text x="40" y="372" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">反过来，如果资本外流、央行要卖美元稳汇率，就要收回人民币，国内就会变紧。这就是「储备变动」和「货币松紧」的联系。</text>
<text x="40" y="396" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「3 万亿外汇储备」不是政府可以随便花的钱，它是用人民币换来的，花出去也要有对应的去处。</text>
</svg>
