<text x="690.0" y="195" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">r/m</text>
<rect x="36" y="229" width="3" height="44" rx="0" fill="#67b5ef" stroke="none" stroke-width="1.5"/>
<text x="52" y="244" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="monospace" font-weight="bold">REX 前缀 0x48</text>
<text x="52" y="263" fill="#b0b0c8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">W=1 表示按 64 位操作。去掉它，同一条指令退回 32 位的 mov ebp, esp。</text>
<text x="52" y="280" fill="#7a7a92" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">x86 的兼容手法：新功能靠加前缀，旧编码一个字节也不动。</text>
<rect x="36" y="283" width="3" height="44" rx="0" fill="#e8b84b" stroke="none" stroke-width="1.5"/>
<text x="52" y="298" fill="#e8b84b" font-size="11.5" text-anchor="start" font-family="monospace" font-weight="bold">操作码 0x89</text>
<text x="52" y="317" fill="#b0b0c8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">查表得 MOV r/m64, r64：把右边的寄存器写进左边的寄存器或内存。</text>
<text x="52" y="334" fill="#7a7a92" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它只规定了「哪类操作数」，具体编号留给下一个字节。</text>
<rect x="36" y="337" width="3" height="44" rx="0" fill="#67d9a0" stroke="none" stroke-width="1.5"/>
<text x="52" y="352" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="monospace" font-weight="bold">ModR/M 0xe5  =  11 100 101</text>
<text x="52" y="371" fill="#b0b0c8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">mod=11 两个操作数都在寄存器；reg=100 查表是 rsp；r/m=101 是 rbp。</text>
<text x="52" y="388" fill="#7a7a92" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">reg 是源，r/m 是目的，合起来就是 mov rbp, rsp。</text>
<rect x="36" y="406" width="728" height="34" rx="4" fill="#16161f" stroke="#3a3a52" stroke-width="1.2"/>
<text x="52" y="428" fill="#7a7a92" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">整条指令  =  </text>
<text x="140" y="429" fill="#d8d8e4" font-size="13" text-anchor="start" font-family="monospace" font-weight="bold">mov  rbp,  rsp</text>
<text x="748" y="428" fill="#5f5f78" font-size="10" text-anchor="end" font-family="monospace">3 字节 / 24 位</text>
</svg>
