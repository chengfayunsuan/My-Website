<svg width="880" height="356" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="356" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">同样是 II 类户，看钱从谁来</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">二类户的限额只针对「非绑定账户」。认过四要素的那张 I 类卡，跟自己钱包一样。</text>
<text x="40" y="78" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">绑定账户：开卡时验过四要素的那张 I 类卡</text>
<rect x="40" y="92" width="372" height="60" rx="5" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="58" y="116" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的 I 类卡</text>
<text x="58" y="138" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">招行 · 尾号 8812</text>
<line x1="416" y1="122" x2="458" y2="122" stroke="#67d9a0" stroke-width="2"/>
<path d="M466,122 L456,117 L456,127 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="1"/>
<rect x="470" y="92" width="370" height="60" rx="5" fill="#16281c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="488" y="116" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的 II 类户</text>
<text x="488" y="138" fill="#67d9a0" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">不限额度</text>
<text x="40" y="174" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">等于左手倒右手，风控上没什么可担心的</text>
<text x="40" y="232" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">非绑定账户：别人，或者你在别的银行开的卡</text>
<rect x="40" y="246" width="372" height="60" rx="5" fill="#2a2118" stroke="#e8965a" stroke-width="1.2"/>
<text x="58" y="270" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">别人给你转</text>
<text x="58" y="292" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">或你另一家银行的卡转进来</text>
<line x1="416" y1="276" x2="458" y2="276" stroke="#e8965a" stroke-width="2"/>
<path d="M466,276 L456,271 L456,281 Z" fill="#e8965a" stroke="#e8965a" stroke-width="1"/>
<rect x="470" y="246" width="370" height="60" rx="5" fill="#2a2118" stroke="#e8965a" stroke-width="1.2"/>
<text x="488" y="270" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你的 II 类户</text>
<text x="488" y="292" fill="#e8965a" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">日累计 1 万 / 年累计 20 万</text>
<text x="40" y="328" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这笔钱来路不清，出了事得找得回来，所以卡着额度</text>
</svg>
