<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 606" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="606" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.2.4-4  主从 D 触发器：边沿是这么造出来的</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两个电平敏感的锁存器错开半个周期，合起来就成了一把只在「沿」上开一瞬的门</text>
<rect x="146" y="112" width="104" height="104" rx="6" fill="#1e2230" stroke="#67d9a0" stroke-width="1.8"/>
<text x="198" y="142" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">主 master</text>
<text x="198" y="164" fill="#8fc9ab" font-size="10" text-anchor="middle" font-family="monospace">EN = CLK</text>
<text x="198" y="188" fill="#6a8a7c" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CLK 高时透明</text>
<rect x="286" y="112" width="104" height="104" rx="6" fill="#1e2230" stroke="#67b5ef" stroke-width="1.8"/>
<text x="338" y="142" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">从 slave</text>
<text x="338" y="164" fill="#8fb8d9" font-size="10" text-anchor="middle" font-family="monospace">EN = ¬CLK</text>
<text x="338" y="188" fill="#6a8299" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">CLK 低时透明</text>
<line x1="60" y1="164" x2="146" y2="164" stroke="#e8b84b" stroke-width="2"/>
<text x="52" y="169" fill="#e8b84b" font-size="14" text-anchor="end" font-family="monospace" font-weight="bold">D</text>
<line x1="250" y1="164" x2="286" y2="164" stroke="#c8c8dc" stroke-width="2"/>
<text x="268" y="156" fill="#6a6a84" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">内部</text>
<line x1="390" y1="164" x2="466" y2="164" stroke="#67d9a0" stroke-width="2"/>
<text x="474" y="169" fill="#67d9a0" font-size="15" text-anchor="start" font-family="monospace" font-weight="bold">Q</text>
<line x1="60" y1="300" x2="190" y2="300" stroke="#b58ae8" stroke-width="2"/>
<text x="52" y="305" fill="#b58ae8" font-size="12.5" text-anchor="end" font-family="monospace" font-weight="bold">CLK</text>
<line x1="190" y1="300" x2="190" y2="216" stroke="#b58ae8" stroke-width="2"/>
<circle cx="190" cy="300" r="3.2" fill="#b58ae8"/>
<line x1="190" y1="300" x2="244" y2="300" stroke="#b58ae8" stroke-width="2"/>
<path d="M244,285.0 L271.0,300 L244,315.0 Z" fill="#1e1e30" stroke="#b58ae8" stroke-width="2"/>
<circle cx="277.0" cy="300" r="5" fill="#14141e" stroke="#b58ae8" stroke-width="1.8"/>
<circle cx="277.0" cy="300" r="5" fill="#14141e" stroke="#b58ae8" stroke-width="1.8"/>
<line x1="282" y1="300" x2="330" y2="300" stroke="#e8965a" stroke-width="2"/>
<line x1="330" y1="300" x2="330" y2="216" stroke="#e8965a" stroke-width="2"/>
<text x="336" y="296" fill="#e8965a" font-size="10" text-anchor="start" font-family="monospace">¬CLK</text>
<text x="490" y="124" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">① CLK 低：主级关门</text>
<text x="490" y="144" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">　　　　　从级透明，Q 跟着走</text>
<text x="490" y="176" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">② 沿一到：两级同时换岗</text>
<text x="490" y="196" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">　　　　　主级开门采样，从级关门定格</text>
<text x="490" y="228" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">③ CLK 高：主级透明但出不去</text>
<text x="490" y="248" fill="#9a9ab4" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">　　　　　从级锁死，Q 纹丝不动</text>
<text x="24" y="358" fill="#c8c8dc" font-size="12.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">只看输出 Q，它是一个严格的边沿触发器件</text>
<line x1="247.0" y1="372" x2="247.0" y2="530" stroke="#4a5a52" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="247.0" y="366" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">↑</text>
<line x1="518.8" y1="372" x2="518.8" y2="530" stroke="#4a5a52" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="518.8" y="366" fill="#67d9a0" font-size="13" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">↑</text>
<text x="24" y="397" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="monospace">CLK</text>
<line x1="96" y1="392" x2="700" y2="392" stroke="#26263a" stroke-width="1"/>
<path d="M96,392 L247.0,392 L247.0,392 L247.0,392 L247.0,366 L367.8,366 L367.8,366 L367.8,366 L367.8,392 L518.8,392 L518.8,392 L518.8,392 L518.8,366 L639.6,366 L639.6,366 L639.6,366 L639.6,392 L700,392 L700,392" fill="none" stroke="#b58ae8" stroke-width="2.4"/>
<text x="24" y="453" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="monospace">D</text>
<line x1="96" y1="448" x2="700" y2="448" stroke="#26263a" stroke-width="1"/>
<path d="M96,448 L156.4,448 L156.4,448 L156.4,448 L156.4,422 L216.8,422 L216.8,422 L216.8,422 L216.8,448 L428.20000000000005,448 L428.20000000000005,448 L428.20000000000005,448 L428.20000000000005,422 L549.0,422 L549.0,422 L549.0,422 L549.0,448 L700,448 L700,448" fill="none" stroke="#e8b84b" stroke-width="2.4"/>
<text x="24" y="509" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="monospace">Q</text>
<line x1="96" y1="504" x2="700" y2="504" stroke="#26263a" stroke-width="1"/>
<path d="M96,478 L247.0,478 L247.0,478 L247.0,478 L247.0,504 L518.8,504 L518.8,504 L518.8,504 L518.8,478 L700,478 L700,478" fill="none" stroke="#67d9a0" stroke-width="2.4"/>
<text x="277.2" y="441" fill="#b08a5a" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">D 在这里变，Q 不理它</text>
<text x="373.84000000000003" y="496" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">沿没来，Q 不动</text>
<line x1="24" y1="552" x2="736" y2="552" stroke="#2a2a3e" stroke-width="1"/>
<text x="24" y="574" fill="#9a9ab4" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">主级在低电平期已经把 D 装好了，但它出不去；上升沿那一刻从级打开，装好的值才被推到 Q。</text>
<text x="24" y="594" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以 Q 每个周期只变一次 —— 这是它能放进反馈环、能构成计数器与状态机的前提。</text>
</svg>
