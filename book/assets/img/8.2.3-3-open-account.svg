<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="780" height="440" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">开个户要跑几趟，以及被拒了怎么办</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">现在开户不是「递材料盖章」，是银行对你做一次尽职调查</text>
<defs><marker id="b1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 z" fill="#8a8aa0"/></marker></defs><rect x="29" y="74" width="170" height="72" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.4"/>
<text x="114.0" y="100" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">① 预约</text>
<text x="114.0" y="122" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1~3 天</text>
<text x="114.0" y="138" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">热门网点要排队</text>
<line x1="200" y1="110" x2="210" y2="110" stroke="#8a8aa0" stroke-width="2" marker-end="url(#b1)"/><rect x="213" y="74" width="170" height="72" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.4"/>
<text x="298.0" y="100" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">② 面签</text>
<text x="298.0" y="122" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">约 1 小时</text>
<text x="298.0" y="138" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">法人必须到场</text>
<line x1="384" y1="110" x2="394" y2="110" stroke="#8a8aa0" stroke-width="2" marker-end="url(#b1)"/><rect x="397" y="74" width="170" height="72" rx="6" fill="#16161f" stroke="#e8965a" stroke-width="1.4"/>
<text x="482.0" y="100" fill="#e8965a" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">③ 尽调</text>
<text x="482.0" y="122" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1~5 工作日</text>
<text x="482.0" y="138" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可能上门拍照</text>
<line x1="568" y1="110" x2="578" y2="110" stroke="#8a8aa0" stroke-width="2" marker-end="url(#b1)"/><rect x="581" y="74" width="170" height="72" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="666.0" y="100" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">④ 启用</text>
<text x="666.0" y="122" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">当天</text>
<text x="666.0" y="138" fill="#a0a0b8" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">网银 U 盾当场给</text>
<text x="390" y="168" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从预约到能收款，顺利的话一周内；被拒的话，换银行重来一遍</text>
<text x="40" y="196" fill="#e87a8a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">常见被拒原因</text>
<text x="420" y="196" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">怎么破</text>
<rect x="30" y="212" width="360" height="42" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="44" y="238" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注册地址是集中挂靠</text>
<rect x="400" y="212" width="350" height="42" rx="5" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="414" y="238" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换网点，或提供租赁合同 + 近三个月水电费单</text>
<rect x="30" y="262" width="360" height="42" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="44" y="288" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">经营范围里有敏感项</text>
<rect x="400" y="262" width="350" height="42" rx="5" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="414" y="288" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">说明业务实质，带上已签的合同、发票、客户名单</text>
<rect x="30" y="312" width="360" height="42" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="44" y="338" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">法人刚成年 / 异地户籍</text>
<rect x="400" y="312" width="350" height="42" rx="5" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="414" y="338" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">带户口本或居住证，法人本人到场说明情况</text>
<rect x="30" y="362" width="360" height="42" rx="5" fill="#16161f" stroke="#3a3a52" stroke-width="1"/>
<text x="44" y="388" fill="#c8c8dc" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">刚成立就要开大额网银</text>
<rect x="400" y="362" width="350" height="42" rx="5" fill="#12121a" stroke="#67d9a0" stroke-width="1"/>
<text x="414" y="388" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">先开基础额度，跑几个月流水后再提额</text>
<text x="390" y="428" fill="#e8965a" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行不是故意为难你：2020 年断卡行动之后，涉案账户要追责到开户网点，宁可错杀</text>
</svg>
