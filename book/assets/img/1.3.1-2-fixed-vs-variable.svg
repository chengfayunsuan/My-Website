<text x="40" y="380" fill="#c8c8dc" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一段逻辑，x86 用 17 字节，ARM64 用 24 字节——定长多花四成空间。</text>
<text x="40" y="402" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">换回来的是：x86 前端要逐字节扫长度，ARM64 可以直接按格并行译码。谁划算，取决于你缺的是内存还是解码带宽。</text>
