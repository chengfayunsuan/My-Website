<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="330" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.5 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同一笔钱花两次：只有被更多人接过的那条链算数</text>
<rect x="40" y="96" width="150" height="62" rx="8" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="115" y="122" fill="#67b5ef" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">你收到 10 个币</text>
<text x="115" y="144" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">准备花出去</text>
<rect x="240" y="60" width="140" height="54" rx="8" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="310" y="92" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">转给商家</text>
<rect x="240" y="150" width="140" height="54" rx="8" fill="#16161f" stroke="#e87a8a" stroke-width="1.5"/>
<text x="310" y="182" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">偷偷转给自己</text>
<path d="M194,110 L232,90" fill="none" stroke="#8a8aa0" stroke-width="1.4"/>
<path d="M194,144 L232,176" fill="none" stroke="#8a8aa0" stroke-width="1.4"/>
<rect x="420" y="60" width="76" height="54" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="458" y="92" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">块 2</text>
<path d="M408,87 L416,87" fill="none" stroke="#8a8aa0" stroke-width="1.3"/>
<rect x="510" y="60" width="76" height="54" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="548" y="92" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">块 3</text>
<path d="M498,87 L506,87" fill="none" stroke="#8a8aa0" stroke-width="1.3"/>
<rect x="600" y="60" width="76" height="54" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="638" y="92" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">块 4</text>
<path d="M588,87 L596,87" fill="none" stroke="#8a8aa0" stroke-width="1.3"/>
<rect x="690" y="60" width="76" height="54" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.4"/>
<text x="728" y="92" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">块 5</text>
<path d="M678,87 L686,87" fill="none" stroke="#8a8aa0" stroke-width="1.3"/>
<text x="420" y="140" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">商家那条链继续有人接，越接越长</text>
<text x="240" y="232" fill="#8a8aa0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">另一条没人接，永远停在这里，作废</text>
<text x="24" y="280" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">规则是「最长的那条链算数」。想作弊，你得拥有超过一半的算力去追赶，成本高到不划算。</text>
<text x="24" y="306" fill="#a0a0b8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这叫「工作量证明」：不是靠谁审核，是靠谁烧掉的电多。</text>
</svg>
