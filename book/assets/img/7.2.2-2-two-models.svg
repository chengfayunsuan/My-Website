<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.2.2-2  两种模型的差别：钱到底先有存款还是先有贷款</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">上一半是教科书，下一半是现实。顺序反过来，该盯的指标就完全不同</text>
<text x="40" y="92" fill="#67b5ef" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">教科书模型：先有存款，再放贷</text>
<text x="40" y="110" fill="#7a8aa2" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把央行发的钱反复借出去，像滚雪球</text>
<rect x="48" y="128" width="170" height="58" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.3"/>
<text x="60" y="150" fill="#b8d4ee" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">央行发行</text>
<text x="60" y="170" fill="#7a8aa2" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">100 万基础货币</text>
<rect x="248" y="128" width="170" height="58" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.3"/>
<text x="260" y="150" fill="#b8d4ee" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行留 10 万</text>
<text x="260" y="170" fill="#7a8aa2" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">贷出 90 万</text>
<rect x="448" y="128" width="170" height="58" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.3"/>
<text x="460" y="150" fill="#b8d4ee" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收款人存回 90 万</text>
<text x="460" y="170" fill="#7a8aa2" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">再留 9 万，贷 81 万</text>
<rect x="648" y="128" width="170" height="58" rx="5" fill="#1a2434" stroke="#67b5ef" stroke-width="1.3"/>
<text x="660" y="150" fill="#b8d4ee" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">如此往复</text>
<text x="660" y="170" fill="#7a8aa2" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">等比数列求和</text>
<line x1="218" y1="157" x2="240" y2="157" stroke="#6aa8dc" stroke-width="2"/>
<path d="M240,151 L250,157 L240,163 Z" fill="#6aa8dc" stroke="#6aa8dc" stroke-width="1"/>
<line x1="418" y1="157" x2="440" y2="157" stroke="#6aa8dc" stroke-width="2"/>
<path d="M440,151 L450,157 L440,163 Z" fill="#6aa8dc" stroke="#6aa8dc" stroke-width="1"/>
<line x1="618" y1="157" x2="640" y2="157" stroke="#6aa8dc" stroke-width="2"/>
<path d="M640,151 L650,157 L640,163 Z" fill="#6aa8dc" stroke="#6aa8dc" stroke-width="1"/>
<rect x="48" y="202" width="800" height="34" rx="4" fill="#101a24" stroke="#2a3a4a" stroke-width="1"/>
<text x="60" y="224" fill="#8fb0cc" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结论：最终存款 = 100 万 ÷ 10% = 1000 万，乘数 = 1/r。它假设银行必须先有存款才能放贷。</text>
<line x1="40" y1="258" x2="840" y2="258" stroke="#2f2f45" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="288" fill="#e8965a" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">现实模型：放贷的同时，存款被创造出来</text>
<text x="40" y="306" fill="#a8907a" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不需要先有一笔钱躺在池子里等着被借走</text>
<rect x="48" y="324" width="230" height="58" rx="5" fill="#2c2216" stroke="#e8965a" stroke-width="1.3"/>
<text x="60" y="346" fill="#e8c9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">银行签一笔贷款</text>
<text x="60" y="366" fill="#a8907a" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">合同就是一张欠条</text>
<rect x="320" y="324" width="230" height="58" rx="5" fill="#2c2216" stroke="#e8965a" stroke-width="1.3"/>
<text x="332" y="346" fill="#e8c9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两笔账同时记</text>
<text x="332" y="366" fill="#a8907a" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">资产 +100 万，负债 +100 万</text>
<rect x="592" y="324" width="230" height="58" rx="5" fill="#2c2216" stroke="#e8965a" stroke-width="1.3"/>
<text x="604" y="346" fill="#e8c9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存款出现了</text>
<text x="604" y="366" fill="#a8907a" font-size="8.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可以花、可以转、可以还债</text>
<line x1="278" y1="353" x2="304" y2="353" stroke="#d89a5a" stroke-width="2"/>
<path d="M304,347 L314,353 L304,359 Z" fill="#d89a5a" stroke="#d89a5a" stroke-width="1"/>
<line x1="550" y1="353" x2="576" y2="353" stroke="#d89a5a" stroke-width="2"/>
<path d="M576,347 L586,353 L576,359 Z" fill="#d89a5a" stroke="#d89a5a" stroke-width="1"/>
<rect x="48" y="396" width="800" height="34" rx="4" fill="#241c12" stroke="#4a3a22" stroke-width="1"/>
<text x="60" y="418" fill="#c8a878" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">结论：央行决定的是利率和准备金的「价格」，不是直接规定能放多少笔。数量由需求决定。</text>
</svg>
