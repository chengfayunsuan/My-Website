<svg width="900" height="566" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="900" height="566" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">MESI：进来是一回事，升级和降级是另一回事</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">上半张画「一条新行怎么进缓存」，下半张列「已经在缓存里的行怎么变状态」</text>
<rect x="95.0" y="106.0" width="130" height="52" rx="3" fill="#141420" stroke="#8a8aa0" stroke-width="2.0"/>
<text x="160" y="129" fill="#b0b0c8" font-size="15" text-anchor="middle" font-family="monospace" font-weight="bold">I</text>
<text x="160" y="148" fill="#6a6a82" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">作废 · 这一行不可用</text>
<path d="M160,158.0 L160,217 L340,217" fill="none" stroke="#67d9a0" stroke-width="1.8"/>
<path d="M340,217 L331,212 L331,221 Z" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<rect x="340" y="188" width="346" height="58" rx="3" fill="#141420" stroke="#67d9a0" stroke-width="1.8"/>
<rect x="352" y="200" width="34" height="34" rx="3" fill="#1c1c2c" stroke="#67d9a0" stroke-width="1.2"/>
<text x="369" y="224" fill="#67d9a0" font-size="16" text-anchor="middle" font-family="monospace" font-weight="bold">E</text>
<text x="398" y="215" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Exclusive　独占，且和内存一致</text>
<text x="398" y="235" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">读未命中，且没有任何别的核有副本</text>
<path d="M160,158.0 L160,289 L340,289" fill="none" stroke="#67b5ef" stroke-width="1.8"/>
<path d="M340,289 L331,284 L331,293 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<rect x="340" y="260" width="346" height="58" rx="3" fill="#141420" stroke="#67b5ef" stroke-width="1.8"/>
<rect x="352" y="272" width="34" height="34" rx="3" fill="#1c1c2c" stroke="#67b5ef" stroke-width="1.2"/>
<text x="369" y="296" fill="#67b5ef" font-size="16" text-anchor="middle" font-family="monospace" font-weight="bold">S</text>
<text x="398" y="287" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Shared　共享，且和内存一致</text>
<text x="398" y="307" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">读未命中，但别的核有副本 —— 双方都进 S</text>
<path d="M160,158.0 L160,361 L340,361" fill="none" stroke="#e8965a" stroke-width="1.8"/>
<path d="M340,361 L331,356 L331,365 Z" fill="#e8965a" stroke="#e8965a" stroke-width="0"/>
<rect x="340" y="332" width="346" height="58" rx="3" fill="#141420" stroke="#e8965a" stroke-width="1.8"/>
<rect x="352" y="344" width="34" height="34" rx="3" fill="#1c1c2c" stroke="#e8965a" stroke-width="1.2"/>
<text x="369" y="368" fill="#e8965a" font-size="16" text-anchor="middle" font-family="monospace" font-weight="bold">M</text>
<text x="398" y="359" fill="#e8965a" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Modified　独占，且比内存新</text>
<text x="398" y="379" fill="#8a8aa2" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">写未命中 —— 发 RFO，读数据同时抢独占权</text>
<text x="90" y="98" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">新的一行，都从这里开始</text>
<line x1="24" y1="400" x2="876" y2="400" stroke="#26263a" stroke-width="1"/>
<text x="24" y="392" fill="#6a6a82" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">已经在缓存里的行，怎么变状态</text>
<text x="24" y="428" fill="#67d9a0" font-size="11" text-anchor="start" font-family="monospace">E → M</text>
<text x="88" y="428" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">本地写，静默升级，一条总线事务都不发。</text>
<text x="452" y="428" fill="#6f6f88" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这是 E 状态的全部价值：最常见的「一个核自己写」变成了零开销。</text>
<text x="24" y="454" fill="#e8965a" font-size="11" text-anchor="start" font-family="monospace">S → M</text>
<text x="88" y="454" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">本地写，必须发 BusUpgr 作废别人的副本。</text>
<text x="452" y="454" fill="#6f6f88" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据不用传 —— 大家的值本来就一样，只要把别人的副本打掉。</text>
<text x="24" y="480" fill="#e87a8a" font-size="11" text-anchor="start" font-family="monospace">M → S</text>
<text x="88" y="480" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">别的核来读，我把数据递过去，然后降级。</text>
<text x="452" y="480" fill="#6f6f88" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">同时得写回内存，或交给 L3 代管（MOESI 的 O 状态就为省这一趟）。</text>
<text x="24" y="506" fill="#e87a8a" font-size="11" text-anchor="start" font-family="monospace">S → I</text>
<text x="88" y="506" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">别的核发 RFO，我的副本立刻作废。</text>
<text x="452" y="506" fill="#6f6f88" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">下次再读就是一次未命中 —— 这就是共享写昂贵的原因。</text>
<text x="24" y="532" fill="#67d9a0" font-size="11" text-anchor="start" font-family="monospace">M → M</text>
<text x="88" y="532" fill="#c8c8dc" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">本地连续写，什么都不用做。</text>
<text x="452" y="532" fill="#6f6f88" font-size="9.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最舒服的情况：这一行已经完全属于我了。</text>
<text x="24" y="558" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注：E 状态在一行被踢出缓存、或被别的核 RFO 时也会直接回到 I；图上没画，免得糊成一团。</text>
</svg>
