<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="306" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.4 / 图 3</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是谁都能查你的报告</text>
<rect x="30" y="88" width="400" height="172" rx="10" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="230" y="116" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要你授权才能查</text>
<text x="54" y="146" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 贷款审批</text>
<text x="54" y="174" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 信用卡审批</text>
<text x="54" y="202" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 担保资格审查</text>
<text x="54" y="230" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 贷后管理（已有业务）</text>
<rect x="450" y="88" width="400" height="172" rx="10" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="650" y="116" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不用授权也能查</text>
<text x="474" y="146" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 你本人（每年 2 次免费）</text>
<text x="474" y="174" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 司法机关办案</text>
<text x="474" y="202" fill="#cfcfe0" font-size="10.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">· 法律法规规定的其他情形</text>
<text x="24" y="288" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一次查询都会留记录。硬查询太多（短期频繁申请贷款），本身就是减分项。</text>
</svg>
