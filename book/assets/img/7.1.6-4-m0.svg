<svg xmlns="http://www.w3.org/2000/svg" width="880" height="306" viewBox="0 0 880 306" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="306" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.6 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数字人民币替代的是 M0，不是存款</text>
<rect x="60" y="92" width="240" height="46" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="76" y="121" fill="#67b5ef" font-size="13" text-anchor="True" font-family="'PingFang SC','Microsoft YaHei',sans-serif">M0</text>
<text x="120" y="121" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">流通中的现金　+　数字人民币</text>
<rect x="60" y="154" width="460" height="46" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="76" y="183" fill="#67d9a0" font-size="13" text-anchor="True" font-family="'PingFang SC','Microsoft YaHei',sans-serif">M1</text>
<text x="120" y="183" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">M0　+　单位活期存款</text>
<rect x="60" y="216" width="680" height="46" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="76" y="245" fill="#e8b84b" font-size="13" text-anchor="True" font-family="'PingFang SC','Microsoft YaHei',sans-serif">M2</text>
<text x="120" y="245" fill="#cfcfe0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">M1　+　定期存款、货币基金等</text>
<text x="60" y="292" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以它不会替代你的银行存款，也不会替代余额宝：它就是口袋里的现金，换了个形式。</text>
</svg>
