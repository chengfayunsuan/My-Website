<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="430" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">五条支线，同一个起点</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">1975 年之后，处理器分成了几条互不兼容的路。现在活下来的只有三条半</text>

  <!-- 时间轴 -->
  <line x1="90" y1="72" x2="720" y2="72" stroke="#4a4a68"/>
  <g fill="#6b6b85" font-size="7.5" text-anchor="middle">
    <text x="90" y="64">1975</text>
    <text x="213" y="64">1985</text>
    <text x="337" y="64">1995</text>
    <text x="460" y="64">2005</text>
    <text x="584" y="64">2015</text>
    <text x="708" y="64">2025</text>
  </g>
  <g stroke="#232338">
    <line x1="213" y1="72" x2="213" y2="352"/>
    <line x1="337" y1="72" x2="337" y2="352"/>
    <line x1="460" y1="72" x2="460" y2="352"/>
    <line x1="584" y1="72" x2="584" y2="352"/>
  </g>

  <!-- x86 -->
  <text x="24" y="104" fill="#f0606a" font-size="9">x86</text>
  <line x1="127" y1="100" x2="720" y2="100" stroke="#f0606a" stroke-width="2.6"/>
  <circle cx="127" cy="100" r="4" fill="#f0606a"/>
  <text x="127" y="88" fill="#f0a0aa" font-size="7.5" text-anchor="middle">1978 · 8086</text>
  <circle cx="337" cy="100" r="4" fill="#f0606a"/>
  <text x="337" y="118" fill="#9a9ab4" font-size="7.5" text-anchor="middle">1995 · Pentium Pro 转 uop</text>
  <circle cx="436" cy="100" r="4" fill="#f0606a"/>
  <text x="448" y="88" fill="#f0a0aa" font-size="7.5">2003 · x86-64</text>

  <!-- ARM -->
  <text x="24" y="164" fill="#4ec9a3" font-size="9">ARM</text>
  <line x1="213" y1="160" x2="720" y2="160" stroke="#4ec9a3" stroke-width="2.6"/>
  <circle cx="213" cy="160" r="4" fill="#4ec9a3"/>
  <text x="213" y="148" fill="#9fe0c9" font-size="7.5" text-anchor="middle">1985 · ARM1</text>
  <circle cx="535" cy="160" r="4" fill="#4ec9a3"/>
  <text x="535" y="178" fill="#9fe0c9" font-size="7.5" text-anchor="middle">2011 · ARMv8（64 位）</text>
  <circle cx="646" cy="160" r="4" fill="#4ec9a3"/>
  <text x="646" y="148" fill="#9fe0c9" font-size="7.5" text-anchor="middle">2020 · M1</text>
  <text x="716" y="148" fill="#4ec9a3" font-size="7" text-anchor="end">手机 99% →</text>

  <!-- MIPS -->
  <text x="24" y="224" fill="#9b4df0" font-size="9">MIPS</text>
  <line x1="164" y1="220" x2="560" y2="220" stroke="#9b4df0" stroke-width="2.6"/>
  <line x1="560" y1="220" x2="700" y2="220" stroke="#9b4df0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="164" cy="220" r="4" fill="#9b4df0"/>
  <text x="164" y="208" fill="#cfc6ff" font-size="7.5" text-anchor="middle">1981 · 斯坦福 MIPS</text>
  <circle cx="300" cy="220" r="4" fill="#9b4df0"/>
  <text x="300" y="238" fill="#6b6b85" font-size="7.5" text-anchor="middle">1992 · R4000</text>
  <text x="720" y="212" fill="#6b6b85" font-size="7" text-anchor="end">退守嵌入式</text>

  <!-- POWER -->
  <text x="24" y="284" fill="#e8b84b" font-size="9">POWER</text>
  <line x1="275" y1="280" x2="720" y2="280" stroke="#e8b84b" stroke-width="2.6"/>
  <circle cx="275" cy="280" r="4" fill="#e8b84b"/>
  <text x="275" y="268" fill="#e8b84b" font-size="7.5" text-anchor="middle">1990 · POWER1</text>
  <text x="720" y="272" fill="#6b6b85" font-size="7" text-anchor="end">服务器与超算</text>

  <!-- RISC-V -->
  <text x="24" y="344" fill="#67b5ef" font-size="9">RISC-V</text>
  <line x1="522" y1="340" x2="720" y2="340" stroke="#67b5ef" stroke-width="2.6"/>
  <circle cx="522" cy="340" r="4" fill="#67b5ef"/>
  <text x="522" y="328" fill="#9fd4f5" font-size="7.5" text-anchor="middle">2010 · 伯克利</text>
  <text x="720" y="332" fill="#6b6b85" font-size="7" text-anchor="end">开源，不要版税</text>

  <line x1="24" y1="372" x2="736" y2="372" stroke="#2a2a44"/>

  <text x="24" y="394" fill="#e8b84b" font-size="9">注意 ARM 那条线的形状：1985 到 2011 走了二十六年，2011 之后突然加速——那是智能手机的推力。</text>
  <text x="24" y="414" fill="#9a9ab4" font-size="9">MIPS 和 POWER 的技术都很优秀，输的不是性能，是生态和成本。</text>
</svg>
