<svg width="840" height="470" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="840" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">1.4.3-4  三个名字，各管一段</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">libfoo.so 是给编译器看的，libfoo.so.1 是给程序记的，实体是给加载器用的</text>
<rect x="40" y="106" width="190" height="66" rx="4" fill="#67b5ef12" stroke="#67b5ef" stroke-width="1.2"/>
<text x="135.0" y="136" fill="#67b5ef" font-size="10.5" text-anchor="middle" font-family="monospace">libfoo.so</text>
<text x="135.0" y="156" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">软链 · 开发用链接名</text>
<line x1="230" y1="139.0" x2="294" y2="139.0" stroke="#4a4a62" stroke-width="1.4"/>
<path d="M294,139.0 l-8,-4 l0,8 Z" fill="#4a4a62"/>
<text x="265.0" y="129.0" fill="#4e4e66" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">软链</text>
<rect x="300" y="106" width="190" height="66" rx="4" fill="#e8b84b12" stroke="#e8b84b" stroke-width="1.2"/>
<text x="395.0" y="136" fill="#e8b84b" font-size="10.5" text-anchor="middle" font-family="monospace">libfoo.so.1</text>
<text x="395.0" y="156" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">软链 · soname</text>
<line x1="490" y1="139.0" x2="554" y2="139.0" stroke="#4a4a62" stroke-width="1.4"/>
<path d="M554,139.0 l-8,-4 l0,8 Z" fill="#4a4a62"/>
<text x="525.0" y="129.0" fill="#4e4e66" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">软链</text>
<rect x="560" y="106" width="190" height="66" rx="4" fill="#67d9a012" stroke="#67d9a0" stroke-width="1.2"/>
<text x="655.0" y="136" fill="#67d9a0" font-size="10.5" text-anchor="middle" font-family="monospace">libfoo.so.1.2.3</text>
<text x="655.0" y="156" fill="#7a7a94" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">真身 · 实际文件</text>
<text x="135.0" y="88" fill="#67b5ef" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">gcc -lfoo 找它</text>
<text x="395.0" y="88" fill="#e8b84b" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">DT_NEEDED 记它</text>
<text x="655.0" y="88" fill="#67d9a0" font-size="9" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">加载器读它</text>
<line x1="36" y1="202" x2="804" y2="202" stroke="#26263a" stroke-width="1" stroke-dasharray="4 6"/>
<text x="40" y="228" fill="#67d9a0" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">升级到 1.2.4：soname 不动</text>
<text x="40" y="245" fill="#5f5f78" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">老程序不用重编，因为依赖记录没变</text>
<rect x="40" y="258" width="150" height="40" rx="3" fill="#1a2a20" stroke="#67d9a0" stroke-width="1"/>
<text x="115" y="283" fill="#9ae8c0" font-size="9.5" text-anchor="middle" font-family="monospace">libfoo.so.1</text>
<line x1="190" y1="278" x2="230" y2="278" stroke="#3a7a5a" stroke-width="1.2"/>
<path d="M230,278 l-8,-4 l0,8 Z" fill="#3a7a5a"/>
<rect x="236" y="258" width="180" height="40" rx="3" fill="#152018" stroke="#3a7a5a" stroke-width="1"/>
<text x="326" y="283" fill="#9ae8c0" font-size="9.5" text-anchor="middle" font-family="monospace">libfoo.so.1.2.4</text>
<text x="452" y="228" fill="#e87a8a" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">ABI 破了：发 .so.2</text>
<text x="452" y="245" fill="#5f5f78" font-size="8.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">两代并存，各找各的，谁也不影响谁</text>
<rect x="452" y="258" width="150" height="40" rx="3" fill="#1a2028" stroke="#4a7fa8" stroke-width="1"/>
<text x="527" y="283" fill="#9ac0e0" font-size="9.5" text-anchor="middle" font-family="monospace">libfoo.so.1</text>
<text x="527" y="312" fill="#4e5e70" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 老程序仍然找它</text>
<rect x="634" y="258" width="150" height="40" rx="3" fill="#2a1a20" stroke="#e87a8a" stroke-width="1"/>
<text x="709" y="283" fill="#f0a0ae" font-size="9.5" text-anchor="middle" font-family="monospace">libfoo.so.2</text>
<text x="709" y="312" fill="#7a5058" font-size="8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 新程序找它</text>
<rect x="36" y="344" width="768" height="96" rx="4" fill="#12121c" stroke="#26263a" stroke-width="1"/>
<text x="52" y="368" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为什么不能只改文件名：可执行文件里记的是一串字符串，链接时从 .so 里抄来的。</text>
<text x="52" y="388" fill="#a0a0b8" font-size="9.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">改了这个字符串，所有老程序的依赖就对不上了——所以只能新增一代，不能替换。</text>
<text x="52" y="414" fill="#6a6a82" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意 libfoo.so 只在编译时出现：发行版把它放进 -dev 包里，运行环境里根本没有它。</text>
</svg>
