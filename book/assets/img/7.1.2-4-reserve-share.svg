<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="336" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.1.2 / 图 4</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">各国央行存的外汇，都是些什么（占比，约数）</text>
<text x="40" y="107" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美元</text>
<rect x="120" y="92" width="522" height="20" rx="3" fill="#67b5ef" stroke="#67b5ef" stroke-width="0"/>
<text x="652" y="107" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">58%</text>
<text x="40" y="145" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">欧元</text>
<rect x="120" y="130" width="180" height="20" rx="3" fill="#67d9a0" stroke="#67d9a0" stroke-width="0"/>
<text x="310" y="145" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">20%</text>
<text x="40" y="183" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">日元</text>
<rect x="120" y="168" width="52" height="20" rx="3" fill="#e8b84b" stroke="#e8b84b" stroke-width="0"/>
<text x="182" y="183" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5.8%</text>
<text x="40" y="221" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">英镑</text>
<rect x="120" y="206" width="42" height="20" rx="3" fill="#b58ae8" stroke="#b58ae8" stroke-width="0"/>
<text x="172" y="221" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4.7%</text>
<text x="40" y="259" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人民币</text>
<rect x="120" y="244" width="19" height="20" rx="3" fill="#e8965a" stroke="#e8965a" stroke-width="0"/>
<text x="149" y="259" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2.2%</text>
<text x="40" y="297" fill="#cfcfe0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">其他</text>
<rect x="120" y="282" width="83" height="20" rx="3" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<text x="213" y="297" fill="#8a8aa0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">9.3%</text>
<text x="24" y="320" fill="#a0a0b8" font-size="10.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据为近年国际货币基金组织统计的约数，比例会随汇率和年份小幅波动。</text>
</svg>
