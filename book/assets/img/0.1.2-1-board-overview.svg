<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="600" fill="#0e0e16"/>

  <text x="24" y="28" fill="#9a9ab4" font-size="12.5" font-family="monospace">一块 ATX 主板的俯视布局：插座是坑，芯片是楼，中间那些线是路</text>

  <!-- 主板外框 -->
  <rect x="36" y="60" width="688" height="440" rx="8" fill="#141420" stroke="#3a3a5c" stroke-width="1.4"/>
  <text x="46" y="52" fill="#4f4f6e" font-size="10.5" font-family="monospace">MOTHERBOARD · ATX 305 × 244 mm</text>

  <!-- 固定孔 -->
  <g fill="none" stroke="#4f4f6e" stroke-width="1.2">
    <circle cx="58" cy="82" r="5"/><circle cx="702" cy="82" r="5"/>
    <circle cx="58" cy="478" r="5"/><circle cx="702" cy="478" r="5"/>
    <circle cx="380" cy="82" r="5"/>
  </g>

  <!-- ① 后置 I/O -->
  <rect x="48" y="74" width="32" height="170" rx="3" fill="#101820" stroke="#67b5ef" stroke-width="1.4"/>
  <g stroke="#2f5a78" stroke-width="3">
    <line x1="54" y1="90" x2="74" y2="90"/><line x1="54" y1="104" x2="74" y2="104"/>
    <line x1="54" y1="118" x2="74" y2="118"/><line x1="54" y1="140" x2="74" y2="140"/>
    <line x1="54" y1="162" x2="74" y2="162"/><line x1="54" y1="176" x2="74" y2="176"/>
  </g>
  <text x="64" y="228" fill="#67b5ef" font-size="9" text-anchor="middle" font-family="monospace">USB</text>
  <text x="64" y="239" fill="#67b5ef" font-size="9" text-anchor="middle" font-family="monospace">LAN</text>

  <!-- ② CPU 供电 8-pin -->
  <rect x="96" y="74" width="76" height="16" rx="3" fill="#241417" stroke="#f0606a" stroke-width="1.3"/>
  <text x="134" y="86" fill="#f0606a" font-size="9" text-anchor="middle" font-family="monospace">8-pin 12V</text>

  <!-- ③ CPU 插座 -->
  <rect x="146" y="140" width="136" height="136" rx="6" fill="#1d1d30" stroke="#9b4df0" stroke-width="1.8"/>
  <rect x="162" y="156" width="104" height="104" rx="3" fill="#171725" stroke="#6b4a9e" stroke-width="1"/>
  <g stroke="#9b4df0" stroke-opacity="0.18" stroke-width="1">
    <line x1="162" y1="182" x2="266" y2="182"/><line x1="162" y1="208" x2="266" y2="208"/>
    <line x1="162" y1="234" x2="266" y2="234"/>
    <line x1="188" y1="156" x2="188" y2="260"/><line x1="214" y1="156" x2="214" y2="260"/>
    <line x1="240" y1="156" x2="240" y2="260"/>
  </g>
  <text x="214" y="214" fill="#c9a8ff" font-size="13" text-anchor="middle" font-weight="bold">CPU</text>
  <text x="214" y="230" fill="#7a5fa8" font-size="9.5" text-anchor="middle" font-family="monospace">LGA 1700</text>
  <!-- 散热器安装孔 -->
  <g fill="#0a0a11" stroke="#6b6b85">
    <circle cx="156" cy="150" r="5"/><circle cx="272" cy="150" r="5"/>
    <circle cx="156" cy="266" r="5"/><circle cx="272" cy="266" r="5"/>
  </g>

  <!-- ④ 内存 4 条 -->
  <text x="357" y="104" fill="#67b5ef" font-size="10.5" text-anchor="middle">内存插槽</text>
  <g fill="#12242e" stroke="#67b5ef" stroke-width="1.3">
    <rect x="322" y="120" width="14" height="180" rx="2"/>
    <rect x="348" y="120" width="14" height="180" rx="2"/>
    <rect x="374" y="120" width="14" height="180" rx="2"/>
    <rect x="400" y="120" width="14" height="180" rx="2"/>
  </g>
  <!-- 缺口 -->
  <g fill="#0e0e16">
    <rect x="322" y="196" width="14" height="8"/><rect x="348" y="196" width="14" height="8"/>
    <rect x="374" y="196" width="14" height="8"/><rect x="400" y="196" width="14" height="8"/>
  </g>
  <!-- 卡扣 -->
  <g fill="#2a4f66">
    <rect x="320" y="118" width="18" height="6"/><rect x="346" y="118" width="18" height="6"/>
    <rect x="372" y="118" width="18" height="6"/><rect x="398" y="118" width="18" height="6"/>
    <rect x="320" y="296" width="18" height="6"/><rect x="346" y="296" width="18" height="6"/>
    <rect x="372" y="296" width="18" height="6"/><rect x="398" y="296" width="18" height="6"/>
  </g>
  <text x="452" y="200" fill="#4a7f9e" font-size="10">DDR5 × 4</text>
  <text x="452" y="216" fill="#4a7f9e" font-size="10">双通道</text>
  <text x="452" y="232" fill="#4a7f9e" font-size="10">A1 A2 B1 B2</text>

  <!-- ⑤ 24-pin -->
  <rect x="676" y="200" width="32" height="110" rx="3" fill="#241417" stroke="#f0606a" stroke-width="1.3"/>
  <g stroke="#8a3a40" stroke-width="2">
    <line x1="682" y1="212" x2="702" y2="212"/><line x1="682" y1="224" x2="702" y2="224"/>
    <line x1="682" y1="236" x2="702" y2="236"/><line x1="682" y1="248" x2="702" y2="248"/>
    <line x1="682" y1="260" x2="702" y2="260"/><line x1="682" y1="272" x2="702" y2="272"/>
    <line x1="682" y1="284" x2="702" y2="284"/><line x1="682" y1="296" x2="702" y2="296"/>
  </g>
  <text x="692" y="322" fill="#f0606a" font-size="9" text-anchor="middle" font-family="monospace">24-pin</text>

  <!-- ⑥ PCIe x16 #1 -->
  <rect x="146" y="300" width="226" height="13" rx="2" fill="#2b2412" stroke="#e8b84b" stroke-width="1.4"/>
  <rect x="372" y="302" width="6" height="9" fill="#e8b84b"/>
  <text x="382" y="311" fill="#e8b84b" font-size="10" font-family="monospace">PCIe x16</text>

  <!-- ⑦ PCIe x1 -->
  <rect x="146" y="332" width="44" height="13" rx="2" fill="#2b2412" stroke="#e8b84b" stroke-width="1.4"/>
  <rect x="190" y="334" width="5" height="9" fill="#e8b84b"/>
  <text x="202" y="343" fill="#a8894a" font-size="10" font-family="monospace">x1</text>

  <!-- ⑧ PCIe x16 #2 -->
  <rect x="146" y="364" width="226" height="13" rx="2" fill="#2b2412" stroke="#e8b84b" stroke-width="1.4"/>
  <rect x="372" y="366" width="6" height="9" fill="#e8b84b"/>
  <text x="382" y="375" fill="#a8894a" font-size="10" font-family="monospace">x16（常为 x4）</text>

  <!-- ⑨ M.2 -->
  <rect x="322" y="320" width="160" height="14" rx="2" fill="#122a22" stroke="#4ec9a3" stroke-width="1.4"/>
  <circle cx="478" cy="327" r="3" fill="#4ec9a3"/>
  <text x="400" y="356" fill="#4ec9a3" font-size="10" font-family="monospace">M.2 2280 (NVMe)</text>

  <!-- ⑩ 芯片组 -->
  <rect x="516" y="382" width="92" height="80" rx="4" fill="#2a1f14" stroke="#e08a4b" stroke-width="1.5"/>
  <g stroke="#8a5a30" stroke-width="1">
    <line x1="524" y1="396" x2="600" y2="396"/><line x1="524" y1="410" x2="600" y2="410"/>
    <line x1="524" y1="424" x2="600" y2="424"/><line x1="524" y1="438" x2="600" y2="438"/>
    <line x1="524" y1="452" x2="600" y2="452"/>
  </g>
  <text x="562" y="418" fill="#e08a4b" font-size="12" text-anchor="middle" font-weight="bold">PCH</text>
  <text x="562" y="434" fill="#a06a3a" font-size="9" text-anchor="middle" font-family="monospace">芯片组</text>

  <!-- ⑪ SATA -->
  <g fill="#1a1a28" stroke="#6b6b85" stroke-width="1.2">
    <rect x="560" y="286" width="36" height="11" rx="2"/>
    <rect x="560" y="303" width="36" height="11" rx="2"/>
    <rect x="560" y="320" width="36" height="11" rx="2"/>
    <rect x="560" y="337" width="36" height="11" rx="2"/>
  </g>
  <text x="616" y="316" fill="#9a9ab4" font-size="10" font-family="monospace">SATA</text>

  <!-- ⑫ CMOS 电池 -->
  <circle cx="470" cy="430" r="20" fill="#1b1b2a" stroke="#6b6b85" stroke-width="1.3"/>
  <text x="470" y="428" fill="#8a8aa4" font-size="9" text-anchor="middle" font-family="monospace">CR2032</text>
  <text x="470" y="440" fill="#5f5f7a" font-size="7.5" text-anchor="middle" font-family="monospace">3V</text>

  <!-- 编号圆 -->
  <g font-size="10" font-family="monospace" text-anchor="middle">
    <circle cx="64" cy="258" r="9" fill="#101820" stroke="#67b5ef"/><text x="64" y="261" fill="#67b5ef" font-weight="bold">1</text>
    <circle cx="186" cy="82" r="9" fill="#241417" stroke="#f0606a"/><text x="186" y="85" fill="#f0606a" font-weight="bold">2</text>
    <circle cx="214" cy="288" r="9" fill="#1d1d30" stroke="#9b4df0"/><text x="214" y="291" fill="#9b4df0" font-weight="bold">3</text>
    <circle cx="308" cy="284" r="9" fill="#12242e" stroke="#67b5ef"/><text x="308" y="287" fill="#67b5ef" font-weight="bold">4</text>
    <circle cx="692" cy="344" r="9" fill="#241417" stroke="#f0606a"/><text x="692" y="347" fill="#f0606a" font-weight="bold">5</text>
    <circle cx="120" cy="306" r="9" fill="#2b2412" stroke="#e8b84b"/><text x="120" y="309" fill="#e8b84b" font-weight="bold">6</text>
    <circle cx="120" cy="338" r="9" fill="#2b2412" stroke="#e8b84b"/><text x="120" y="341" fill="#e8b84b" font-weight="bold">7</text>
    <circle cx="120" cy="370" r="9" fill="#2b2412" stroke="#e8b84b"/><text x="120" y="373" fill="#e8b84b" font-weight="bold">8</text>
    <circle cx="504" cy="327" r="9" fill="#122a22" stroke="#4ec9a3"/><text x="504" y="330" fill="#4ec9a3" font-weight="bold">9</text>
    <circle cx="630" cy="384" r="9" fill="#2a1f14" stroke="#e08a4b"/><text x="630" y="387" fill="#e08a4b" font-weight="bold">10</text>
    <circle cx="544" cy="363" r="9" fill="#1a1a28" stroke="#6b6b85"/><text x="544" y="366" fill="#9a9ab4" font-weight="bold">11</text>
    <circle cx="470" cy="470" r="9" fill="#1b1b2a" stroke="#6b6b85"/><text x="470" y="473" fill="#9a9ab4" font-weight="bold">12</text>
  </g>

  <!-- 底部图例 -->
  <g font-size="10.5" fill="#8a8aa4" font-family="monospace">
    <text x="36" y="524">① 后置 I/O　② CPU 8-pin 供电　③ CPU 插座（LGA）　④ 内存插槽　⑤ 24-pin 主供电　⑥ PCIe x16</text>
    <text x="36" y="544">⑦ PCIe x1　⑧ PCIe x16（下半条常只通 x4）　⑨ M.2　⑩ 芯片组 PCH　⑪ SATA　⑫ CMOS 电池</text>
  </g>
  <text x="36" y="572" fill="#5f5f7a" font-size="10.5">看这张图只记一件事：<tspan fill="#c8c8d8">离 CPU 越近的插槽，带宽越高。</tspan>这不是设计者的偏好，是物理距离决定的。</text>
</svg>
