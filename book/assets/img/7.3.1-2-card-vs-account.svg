<svg xmlns="http://www.w3.org/2000/svg" width="880" height="348" viewBox="0 0 880 348" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="348" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">7.3.1 / 图 2</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡只是钥匙，钱不在卡里</text>
<rect x="50" y="110" width="200" height="126" rx="10" fill="#16161f" stroke="#e8b84b" stroke-width="1.6"/>
<text x="150" y="140" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一张借记卡</text>
<text x="150" y="164" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">卡号 · 芯片 · 磁条</text>
<text x="150" y="188" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">它证明「你是谁」</text>
<text x="150" y="212" fill="#8a8aa0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不存钱</text>
<path d="M256,172 L322,172" fill="none" stroke="#8a8aa0" stroke-width="1.7"/>
<path d="M322,166 L332,172 L322,178 Z" fill="#8a8aa0" stroke="#8a8aa0" stroke-width="0"/>
<text x="290" y="156" fill="#8a8aa0" font-size="9.8" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">指向</text>
<rect x="340" y="96" width="500" height="56" rx="8" fill="#16161f" stroke="#67b5ef" stroke-width="1.3"/>
<text x="360" y="120" fill="#67b5ef" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">活期主账户</text>
<text x="360" y="140" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">人民币日常收付</text>
<rect x="340" y="164" width="500" height="56" rx="8" fill="#16161f" stroke="#67d9a0" stroke-width="1.3"/>
<text x="360" y="188" fill="#67d9a0" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">电子账户</text>
<text x="360" y="208" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">线上支付、快捷支付</text>
<rect x="340" y="232" width="500" height="56" rx="8" fill="#16161f" stroke="#b58ae8" stroke-width="1.3"/>
<text x="360" y="256" fill="#b58ae8" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">外币账户</text>
<text x="360" y="276" fill="#8a8aa0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美元、欧元等（如开）</text>
<text x="40" y="318" fill="#a0a0b8" font-size="11.2" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">挂失卡，是换一把钥匙；账户还在，钱还在。销户，才是把抽屉清空。</text>
