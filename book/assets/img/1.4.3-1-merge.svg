<text x="52" y="424" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">a.o 和 b.o 的 .text 都从各自 0 开始编号。拼在一起后 b 的代码整体后移 200 字节，</text>
