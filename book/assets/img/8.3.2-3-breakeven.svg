<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="420" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">平衡点：进项占销售额四成以上，一般纳税人更省</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按 6% 销项、13% 进项、小规模 1% 测算，交叉点大约在 40%</text>
<line x1="96" y1="320" x2="696" y2="320" stroke="#8a8aa0" stroke-width="1.5"/>
<line x1="96" y1="320" x2="96" y2="60" stroke="#8a8aa0" stroke-width="1.5"/>
<text x="96.0" y="340" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">0%</text>
<text x="292.66666666666663" y="340" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">20%</text>
<text x="489.3333333333333" y="340" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">40%</text>
<text x="686.0" y="340" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">60%</text>
<text x="391.0" y="362" fill="#a0a0b8" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">进项（含税采购）占销售额的比例</text>
<text x="88" y="284.0" fill="#a0a0b8" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1%</text>
<text x="88" y="244.0" fill="#a0a0b8" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2%</text>
<text x="88" y="164.0" fill="#a0a0b8" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">4%</text>
<text x="88" y="84.0" fill="#a0a0b8" font-size="9.5" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">6%</text>
<text x="24" y="192.0" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">税负</text>
<text x="24" y="208.0" fill="#a0a0b8" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">占销售额</text>
<line x1="96" y1="280.4" x2="686.0" y2="280.4" stroke="#67d9a0" stroke-width="2"/><text x="115.66666666666667" y="270.4" fill="#67d9a0" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">小规模 0.99%</text>
<line x1="96" y1="93.6" x2="587.6666666666667" y2="320.0" stroke="#e8b84b" stroke-width="2"/><text x="194.33333333333331" y="81.6" fill="#e8b84b" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">一般纳税人（进项越多，税越少）</text>
<circle cx="495.2333333333333" cy="280.4" r="5" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<text x="495.2333333333333" y="302.4" fill="#e8b84b" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">交叉点约 40%</text>
<text x="282.8333333333333" y="192.0" fill="#67d9a0" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">这块小规模更省</text>
<text x="617.1666666666666" y="308.0" fill="#e8b84b" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">这块一般纳税人更省</text>
<text x="380" y="394" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注意：「更省税」不等于「更赚钱」——一般纳税人能开 6% 专票，客户可能愿意付更高价</text>
</svg>
