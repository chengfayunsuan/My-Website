<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="452" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 7.1.4-1  一笔跨境汇款：报文和钱走的是两条路</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">上面那条是「告诉对方要付钱」，下面那条是「账本上的数字变了」。两者完全不同</text>
<text x="40" y="92" fill="#67b5ef" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">报文流：一条消息</text>
<rect x="56" y="104" width="168" height="58" rx="4" fill="#1a2434" stroke="#67b5ef" stroke-width="1.3"/>
<text x="140.0" y="128" fill="#67b5ef" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">中国银行</text>
<text x="140.0" y="147" fill="#7f7f98" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">发起行，收到付款指令</text>
<line x1="230" y1="133" x2="240" y2="133" stroke="#67b5ef" stroke-width="1.5"/>
<path d="M246,133 L237,128 L237,138 Z" fill="#67b5ef" stroke="#67b5ef" stroke-width="1"/>
<rect x="252" y="104" width="168" height="58" rx="4" fill="#201a2e" stroke="#b58ae8" stroke-width="1.3"/>
<text x="336.0" y="128" fill="#b58ae8" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">SWIFT 网络</text>
<text x="336.0" y="147" fill="#7f7f98" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">比利时，只传报文</text>
<line x1="426" y1="133" x2="436" y2="133" stroke="#b58ae8" stroke-width="1.5"/>
<path d="M442,133 L433,128 L433,138 Z" fill="#b58ae8" stroke="#b58ae8" stroke-width="1"/>
<rect x="448" y="104" width="168" height="58" rx="4" fill="#2a2410" stroke="#e8b84b" stroke-width="1.3"/>
<text x="532.0" y="128" fill="#e8b84b" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">花旗银行</text>
<text x="532.0" y="147" fill="#7f7f98" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">美国代理行，转发指令</text>
<line x1="622" y1="133" x2="632" y2="133" stroke="#e8b84b" stroke-width="1.5"/>
<path d="M638,133 L629,128 L629,138 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<rect x="644" y="104" width="168" height="58" rx="4" fill="#16281c" stroke="#67d9a0" stroke-width="1.3"/>
<text x="728.0" y="128" fill="#67d9a0" font-size="11.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">收款行</text>
<text x="728.0" y="147" fill="#7f7f98" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">收到指令，准备入账</text>
<text x="40" y="226" fill="#e8b84b" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">资金流：账本上的数字</text>
<rect x="56" y="240" width="168" height="58" rx="4" fill="#2a2410" stroke="#e8b84b" stroke-width="1.3"/>
<text x="140.0" y="264" fill="#e8b84b" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">中国银行的账户</text>
<text x="140.0" y="283" fill="#7f7f98" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">在花旗开的 nostro</text>
<rect x="448" y="240" width="168" height="58" rx="4" fill="#2a2018" stroke="#e8965a" stroke-width="1.3"/>
<text x="532.0" y="264" fill="#e8965a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">花旗的账本</text>
<text x="532.0" y="283" fill="#7f7f98" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">扣一个账户，加另一个</text>
<rect x="644" y="240" width="168" height="58" rx="4" fill="#16281c" stroke="#67d9a0" stroke-width="1.3"/>
<text x="728.0" y="264" fill="#67d9a0" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">收款行的账户</text>
<text x="728.0" y="283" fill="#7f7f98" font-size="7.8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱到了，可以放款</text>
<line x1="230" y1="269" x2="436" y2="269" stroke="#e8b84b" stroke-width="1.5"/>
<path d="M442,269 L433,264 L433,274 Z" fill="#e8b84b" stroke="#e8b84b" stroke-width="1"/>
<line x1="622" y1="269" x2="632" y2="269" stroke="#e8965a" stroke-width="1.5"/>
<path d="M638,269 L629,264 L629,274 Z" fill="#e8965a" stroke="#e8965a" stroke-width="1"/>
<text x="336.0" y="300" fill="#5f5f78" font-size="8.4" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">SWIFT 不参与这一层</text>
<line x1="140.0" y1="162" x2="140.0" y2="238" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="532.0" y1="162" x2="532.0" y2="238" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="728.0" y1="162" x2="728.0" y2="238" stroke="#3a3a52" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="340" fill="#a0a0b8" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键：SWIFT 那条线上，一分钱都没有动。它只是把「请你付 100 万给某某」这句话，从一家银行传到另一家银行。</text>
<text x="40" y="364" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">钱真正动的地方是下面那条线上的账本：花旗把中国银行账户里的数字减 100 万，把收款行账户的数字加 100 万。</text>
<text x="40" y="388" fill="#8a8aa2" font-size="9.4" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「SWIFT 冻结」和「资金冻结」是两件事：前者让人收不到指令，后者让人拿不到钱。制裁通常两个一起用。</text>
</svg>
