<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="820" height="470" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">三种主体：个体户、个人独资、有限公司</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">名字很像，法律上是三种完全不同的东西</text>
<text x="20" y="100" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">对比项</text>
<rect x="122" y="66" width="212" height="62" rx="6" fill="#16161f" stroke="#67b5ef" stroke-width="1.5"/>
<text x="228.0" y="88" fill="#67b5ef" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">个体工商户</text>
<text x="228.0" y="106" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">不是法人</text>
<text x="228.0" y="120" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">经营者 = 企业</text>
<rect x="346" y="66" width="212" height="62" rx="6" fill="#16161f" stroke="#e8b84b" stroke-width="1.5"/>
<text x="452.0" y="88" fill="#e8b84b" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">个人独资企业</text>
<text x="452.0" y="106" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">是企业</text>
<text x="452.0" y="120" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">但不是法人</text>
<rect x="570" y="66" width="212" height="62" rx="6" fill="#16161f" stroke="#67d9a0" stroke-width="1.5"/>
<text x="676.0" y="88" fill="#67d9a0" font-size="12.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">有限责任公司</text>
<text x="676.0" y="106" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">法人</text>
<text x="676.0" y="120" fill="#a0a0b8" font-size="9.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">股东 = 另一个人</text>
<text x="20" y="168" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">谁还债</text>
<rect x="122" y="142" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="228.0" y="161" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全部家产</text>
<rect x="346" y="142" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="452.0" y="161" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">全部家产</text>
<rect x="570" y="142" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="676.0" y="161" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">只赔出资部分</text>
<text x="20" y="222" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">交什么税</text>
<rect x="122" y="196" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="228.0" y="215" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">经营所得个税</text>
<text x="228.0" y="231" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5%~35%</text>
<rect x="346" y="196" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="452.0" y="215" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">经营所得个税</text>
<text x="452.0" y="231" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">5%~35%</text>
<rect x="570" y="196" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="676.0" y="215" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">企业所得税 25%</text>
<text x="676.0" y="231" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">+ 分红个税 20%</text>
<text x="20" y="276" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要做账</text>
<rect x="122" y="250" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="228.0" y="269" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可核定，简单</text>
<rect x="346" y="250" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="452.0" y="269" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要建账</text>
<rect x="570" y="250" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="676.0" y="269" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">必须建账、月报季报</text>
<text x="20" y="330" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">开专票</text>
<rect x="122" y="304" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="228.0" y="323" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">通常不能自开</text>
<rect x="346" y="304" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="452.0" y="323" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可以</text>
<rect x="570" y="304" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="676.0" y="323" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">可以</text>
<text x="20" y="384" fill="#a0a0b8" font-size="10" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">注销</text>
<rect x="122" y="358" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="228.0" y="377" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">简易，快</text>
<rect x="346" y="358" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="452.0" y="377" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要清算</text>
<rect x="570" y="358" width="212" height="46" rx="4" fill="#12121a" stroke="#2a2a3e" stroke-width="1"/>
<text x="676.0" y="377" fill="#c8c8dc" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">要清算，慢</text>
<text x="410" y="432" fill="#e8965a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">最要紧的是第一行：前两种要用你全部家产兜底，第三种只赔你认缴的出资</text>
<text x="410" y="454" fill="#a0a0b8" font-size="10.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">所以「注册资本」不是随便填的——认缴多少，出事就要赔多少（下一节讲）</text>
</svg>
