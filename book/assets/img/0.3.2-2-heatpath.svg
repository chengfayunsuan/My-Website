<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="480" fill="#0e0e16"/>

  <text x="24" y="26" fill="#9a9ab4" font-size="12.5" font-family="monospace">热从芯片出来，先摊平，再挤出去</text>
  <text x="24" y="48" fill="#d8d8e4" font-size="12.5">笔记本的散热只能在一个平面里完成——没有高度，就没有塔式散热器</text>

  <!-- 剖面框 -->
  <rect x="24" y="66" width="712" height="184" rx="6" fill="#12121c" stroke="#2a2a44"/>
  <text x="40" y="86" fill="#6b6b85" font-size="8.5">机身侧视剖面（示意，不按比例）</text>

  <!-- PCB -->
  <rect x="40" y="196" width="680" height="10" rx="1" fill="#1a2a20" stroke="#2f4a3a"/>

  <!-- 芯片 -->
  <rect x="64" y="164" width="56" height="32" rx="3" fill="#3a1e26" stroke="#f0606a"/>
  <text x="92" y="184" fill="#f0606a" font-size="8" text-anchor="middle">芯片</text>
  <text x="92" y="216" fill="#f0606a" font-size="8" text-anchor="middle">28 W 热源</text>

  <!-- 热管 -->
  <path d="M120,168 L300,160 Q330,158 330,176 L330,190 L120,196 Z" fill="#2e2a3a" stroke="#9b4df0"/>
  <path d="M330,176 L440,170 L440,190 L330,190 Z" fill="#2e2a3a" stroke="#9b4df0"/>
  <text x="230" y="152" fill="#cfc6ff" font-size="8.5" text-anchor="middle">热管：靠相变搬热</text>
  <text x="230" y="240" fill="#6b6b85" font-size="8" text-anchor="middle">等效导热 5000–20000 W/(m·K)</text>

  <!-- 鳍片 -->
  <g stroke="#4ec9a3" stroke-width="1.6">
    <line x1="448" y1="150" x2="448" y2="196"/><line x1="456" y1="150" x2="456" y2="196"/>
    <line x1="464" y1="150" x2="464" y2="196"/><line x1="472" y1="150" x2="472" y2="196"/>
    <line x1="480" y1="150" x2="480" y2="196"/><line x1="488" y1="150" x2="488" y2="196"/>
    <line x1="496" y1="150" x2="496" y2="196"/><line x1="504" y1="150" x2="504" y2="196"/>
  </g>
  <text x="476" y="142" fill="#9fe0c9" font-size="8.5" text-anchor="middle">鳍片</text>
  <text x="476" y="240" fill="#6b6b85" font-size="8" text-anchor="middle">间隙 0.3–0.5 mm</text>

  <!-- 涡轮扇 -->
  <circle cx="556" cy="172" r="26" fill="#1a1a2a" stroke="#9a9ab4"/>
  <g stroke="#6b6b85" stroke-width="1.4">
    <line x1="556" y1="150" x2="556" y2="194"/>
    <line x1="534" y1="172" x2="578" y2="172"/>
    <line x1="541" y1="157" x2="571" y2="187"/>
    <line x1="571" y1="157" x2="541" y2="187"/>
  </g>
  <text x="556" y="216" fill="#c8c8d4" font-size="8" text-anchor="middle">涡轮扇</text>
  <text x="556" y="240" fill="#6b6b85" font-size="8" text-anchor="middle">静压 2–5 mmH₂O</text>

  <!-- 出风口 -->
  <path d="M590,172 L648,172" stroke="#e8b84b" stroke-width="2" marker-end="url(#b2)"/>
  <defs>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 z" fill="#e8b84b"/>
    </marker>
  </defs>
  <text x="690" y="170" fill="#e8b84b" font-size="8.5" text-anchor="middle">出风口</text>
  <text x="690" y="184" fill="#6b6b85" font-size="7.5" text-anchor="middle">不能被挡住</text>

  <!-- 气流示意 -->
  <path d="M600,132 Q620,120 640,132" fill="none" stroke="#4a4a68" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="620" y="112" fill="#4a4a68" font-size="8" text-anchor="middle">风从底部进，只能走这一条路</text>

  <!-- 分隔 -->
  <line x1="24" y1="270" x2="736" y2="270" stroke="#2a2a44"/>

  <text x="24" y="296" fill="#d8d8e4" font-size="11">重力会打折扣：同一根热管，方向不同，能力差三倍</text>

  <!-- 三种方向 -->
  <g>
    <text x="115" y="322" fill="#9a9ab4" font-size="8.5" text-anchor="middle">水平放置</text>
    <rect x="45" y="336" width="140" height="12" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
    <circle cx="45" cy="342" r="7" fill="#3a1e26" stroke="#f0606a"/>
    <text x="45" y="362" fill="#f0606a" font-size="7.5" text-anchor="middle">热端</text>
    <rect x="40" y="404" width="112" height="12" rx="2" fill="#4ec9a3" fill-opacity="0.55"/>
    <text x="160" y="414" fill="#9fe0c9" font-size="8.5">约 35 W</text>
  </g>

  <g>
    <text x="360" y="322" fill="#9a9ab4" font-size="8.5" text-anchor="middle">竖直 · 热端在下</text>
    <rect x="354" y="338" width="12" height="58" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
    <circle cx="360" cy="392" r="7" fill="#3a1e26" stroke="#f0606a"/>
    <text x="376" y="394" fill="#4ec9a3" font-size="8">重力帮忙回流</text>
    <rect x="266" y="404" width="160" height="12" rx="2" fill="#4ec9a3"/>
    <text x="434" y="414" fill="#9fe0c9" font-size="8.5">约 50 W</text>
  </g>

  <g>
    <text x="612" y="322" fill="#9a9ab4" font-size="8.5" text-anchor="middle">竖直 · 热端在上</text>
    <rect x="606" y="338" width="12" height="58" rx="2" fill="#2e2a3a" stroke="#9b4df0"/>
    <circle cx="612" cy="338" r="7" fill="#3a1e26" stroke="#f0606a"/>
    <text x="628" y="340" fill="#f0606a" font-size="8">逆着爬回来</text>
    <rect x="546" y="404" width="58" height="12" rx="2" fill="#3a1e26" stroke="#f0606a"/>
    <text x="612" y="414" fill="#f0606a" font-size="8.5">约 15 W</text>
  </g>

  <line x1="24" y1="434" x2="736" y2="434" stroke="#2a2a44"/>
  <text x="24" y="454" fill="#e8b84b" font-size="9">这解释了一个怪现象：笔记本立起来、架上支架，有时反而更热——热管的方向变了。</text>
  <text x="24" y="472" fill="#6b6b85" font-size="8.5">液体靠毛细力回流，重力有时帮忙、有时作对。厂商布线时会尽量让「热端在下」。</text>
</svg>
