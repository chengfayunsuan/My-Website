<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" width="880" height="486" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="880" height="486" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">图 1.6.1-1  同一行代码，编辑器眼里有三种形态</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">从上往下：字符、词法单元、语法树。越往下结构越多，越往下也越慢</text>
<text x="28" y="84" fill="#67d9a0" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">① 纯文本</text>
<text x="112" y="84" fill="#6f6f88" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">文件里存的就是这一串字符，没有任何结构</text>
<rect x="28" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="41.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace">l</text>
<rect x="55" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="68.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace">e</text>
<rect x="82" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="95.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace">t</text>
<rect x="109" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="122.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace"> </text>
<rect x="136" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="149.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace">x</text>
<rect x="163" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="176.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace"> </text>
<rect x="190" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="203.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace">=</text>
<rect x="217" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="230.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace"> </text>
<rect x="244" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="257.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace">a</text>
<rect x="271" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="284.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace"> </text>
<rect x="298" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="311.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace">+</text>
<rect x="325" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="338.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace"> </text>
<rect x="352" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="365.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace">1</text>
<rect x="379" y="96" width="27" height="34" rx="0" fill="#15151f" stroke="#2e2e44" stroke-width="1"/>
<text x="392.5" y="118" fill="#b8b8cc" font-size="13" text-anchor="middle" font-family="monospace">;</text>
<text x="28" y="148" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 每个字符一个位置，光标就是这里的下标。编辑器知道「第 12 个字符是 a」，但不知道 a 是个变量</text>
<text x="28" y="214" fill="#67b5ef" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">② 词法单元（token）</text>
<text x="190" y="214" fill="#6f6f88" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">切成一个个有类型的块，类型由词法规则决定</text>
<rect x="28" y="228" width="64" height="30" rx="3" fill="#14141e" stroke="#67b5ef" stroke-width="1.2"/>
<text x="60.0" y="248" fill="#67b5ef" font-size="12" text-anchor="middle" font-family="monospace">let</text>
<text x="60.0" y="274" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">关键字</text>
<rect x="102" y="228" width="40" height="30" rx="3" fill="#14141e" stroke="#e8b84b" stroke-width="1.2"/>
<text x="122.0" y="248" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="monospace">x</text>
<text x="122.0" y="274" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">标识符</text>
<rect x="152" y="228" width="40" height="30" rx="3" fill="#14141e" stroke="#e8965a" stroke-width="1.2"/>
<text x="172.0" y="248" fill="#e8965a" font-size="12" text-anchor="middle" font-family="monospace">=</text>
<text x="172.0" y="274" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">运算符</text>
<rect x="202" y="228" width="40" height="30" rx="3" fill="#14141e" stroke="#e8b84b" stroke-width="1.2"/>
<text x="222.0" y="248" fill="#e8b84b" font-size="12" text-anchor="middle" font-family="monospace">a</text>
<text x="222.0" y="274" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">标识符</text>
<rect x="252" y="228" width="40" height="30" rx="3" fill="#14141e" stroke="#e8965a" stroke-width="1.2"/>
<text x="272.0" y="248" fill="#e8965a" font-size="12" text-anchor="middle" font-family="monospace">+</text>
<text x="272.0" y="274" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">运算符</text>
<rect x="302" y="228" width="40" height="30" rx="3" fill="#14141e" stroke="#67d9a0" stroke-width="1.2"/>
<text x="322.0" y="248" fill="#67d9a0" font-size="12" text-anchor="middle" font-family="monospace">1</text>
<text x="322.0" y="274" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数字</text>
<rect x="352" y="228" width="40" height="30" rx="3" fill="#14141e" stroke="#7a7a92" stroke-width="1.2"/>
<text x="372.0" y="248" fill="#7a7a92" font-size="12" text-anchor="middle" font-family="monospace">;</text>
<text x="372.0" y="274" fill="#5f5f78" font-size="8.5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">分号</text>
<text x="28" y="298" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 到这里只认形状，不认意义：x 和 a 都叫「标识符」，谁是变量谁是参数还不知道</text>
<text x="28" y="348" fill="#b58ae8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600">③ 语法树</text>
<text x="96" y="348" fill="#6f6f88" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">按语法规则拼成树，结构关系全部显式</text>
<rect x="28" y="356" width="150" height="26" rx="3" fill="#161622" stroke="#b58ae8" stroke-width="1.2"/>
<text x="103.0" y="373.5" fill="#b58ae8" font-size="10" text-anchor="middle" font-family="monospace">变量声明</text>
<rect x="28" y="398" width="88" height="26" rx="3" fill="#161622" stroke="#e8b84b" stroke-width="1.2"/>
<text x="72.0" y="415.5" fill="#e8b84b" font-size="9.5" text-anchor="middle" font-family="monospace">标识符 x</text>
<rect x="150" y="398" width="150" height="26" rx="3" fill="#161622" stroke="#e8965a" stroke-width="1.2"/>
<text x="225.0" y="415.5" fill="#e8965a" font-size="10" text-anchor="middle" font-family="monospace">加法</text>
<rect x="150" y="438" width="88" height="26" rx="3" fill="#161622" stroke="#e8b84b" stroke-width="1.2"/>
<text x="194.0" y="455.5" fill="#e8b84b" font-size="9.5" text-anchor="middle" font-family="monospace">标识符 a</text>
<rect x="252" y="438" width="78" height="26" rx="3" fill="#161622" stroke="#67d9a0" stroke-width="1.2"/>
<text x="291.0" y="455.5" fill="#67d9a0" font-size="9.5" text-anchor="middle" font-family="monospace">数字 1</text>
<line x1="103" y1="382" x2="103" y2="398" stroke="#3a3a52" stroke-width="1.2"/>
<line x1="103" y1="382" x2="225" y2="382" stroke="#3a3a52" stroke-width="1.2"/>
<line x1="225" y1="382" x2="225" y2="398" stroke="#3a3a52" stroke-width="1.2"/>
<line x1="225" y1="424" x2="194" y2="438" stroke="#3a3a52" stroke-width="1.2"/>
<line x1="225" y1="424" x2="291" y2="438" stroke="#3a3a52" stroke-width="1.2"/>
<text x="360" y="398" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">↑ 到这里才知道：x 被赋值为「a 加 1」，a 和 1 是加法的两个操作数。</text>
<text x="360" y="418" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">重命名变量、跳转定义、找引用，全靠这棵树。</text>
<text x="360" y="438" fill="#5f5f78" font-size="9" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代价：建这棵树要跑一遍完整的词法 + 语法分析。</text>
</svg>
