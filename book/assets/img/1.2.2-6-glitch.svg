<svg width="760" height="476" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="476" fill="#0e0e16"/>
<text x="24" y="26" fill="#9a9ab4" font-size="12.5" text-anchor="start" font-family="monospace">毛刺：真值表说恒为 0，波形上却冒出一个尖峰</text>
<text x="24" y="48" fill="#7a7a94" font-size="11.5" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Y = A · ¬A 的现场记录。输入跳变的瞬间，两路快慢不同，输出短暂地「同时为真」</text>
<line x1="110" y1="90" x2="110" y2="372" stroke="#1e1e2c" stroke-width="1"/>
<line x1="184" y1="90" x2="184" y2="372" stroke="#1e1e2c" stroke-width="1"/>
<line x1="258" y1="90" x2="258" y2="372" stroke="#1e1e2c" stroke-width="1"/>
<line x1="332" y1="90" x2="332" y2="372" stroke="#1e1e2c" stroke-width="1"/>
<line x1="406" y1="90" x2="406" y2="372" stroke="#1e1e2c" stroke-width="1"/>
<line x1="480" y1="90" x2="480" y2="372" stroke="#1e1e2c" stroke-width="1"/>
<line x1="554" y1="90" x2="554" y2="372" stroke="#1e1e2c" stroke-width="1"/>
<line x1="628" y1="90" x2="628" y2="372" stroke="#1e1e2c" stroke-width="1"/>
<line x1="110" y1="378" x2="700" y2="378" stroke="#3a3a52" stroke-width="1.2"/>
<text x="700" y="396" fill="#7a7a94" font-size="11" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif">时间 →</text>
<text x="94" y="100" fill="#e8b84b" font-size="13" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">A</text>
<polyline points="110,130 300,130 300,96 700,96" fill="none" stroke="#e8b84b" stroke-width="2.5" stroke-linejoin="round"/>
<text x="94" y="200" fill="#67b5ef" font-size="13" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">¬A</text>
<polyline points="110,196 326,196 326,230 700,230" fill="none" stroke="#67b5ef" stroke-width="2.5" stroke-linejoin="round"/>
<text x="94" y="300" fill="#e87a8a" font-size="13" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="bold">Y</text>
<polyline points="110,330 300,330 300,296 326,296 326,330 700,330" fill="none" stroke="#e87a8a" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="300" y="96" width="26" height="266" fill="#e87a8a" opacity="0.12"/>
<line x1="300" y1="88" x2="300" y2="372" stroke="#e87a8a" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="326" y1="88" x2="326" y2="372" stroke="#e87a8a" stroke-width="1" stroke-dasharray="4 4"/>
<text x="313" y="80" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">非门延迟</text>
<text x="313" y="400" fill="#e87a8a" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">这几皮秒里，A 已经到 1、¬A 还没落下</text>
<line x1="110" y1="96" x2="700" y2="96" stroke="#26263a" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="110" y1="196" x2="700" y2="196" stroke="#26263a" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="110" y1="296" x2="700" y2="296" stroke="#26263a" stroke-width="1" stroke-dasharray="3 5"/>
<text x="24" y="438" fill="#c8c8dc" font-size="12" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">代数上 A · ¬A ≡ 0，所以任何一本教材都告诉你这个电路输出恒为 0。</text>
<text x="24" y="462" fill="#a0a0b8" font-size="11" text-anchor="start" font-family="'PingFang SC','Microsoft YaHei',sans-serif">但物理上它有自己的时刻表：谁先到、谁后到，决定了输出会不会抖一下。</text>
</svg>
