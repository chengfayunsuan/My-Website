<!DOCTYPE html>
<!-- 上面这行是「文档类型声明」，告诉浏览器：这是一个 HTML5 页面。
     必须放在第一行，少了它有些浏览器会用「兼容模式」，样式可能错乱。 -->

<!-- <html> 是页面的根标签，所有内容都包在它里面。
     lang="en" 是「页面语言」声明；其实你这页内容是中文，
     更规范的写法是 lang="zh-CN"，不过不写也不影响正常显示。 -->
<html lang="en">

<!-- <head> 里放的是「页面的配置信息」，这些内容不会直接显示在屏幕上，
     比如编码、标题、样式表等。 -->
<head>
  <!-- meta charset 声明文字编码为 UTF-8。
       这是最重要的一行：它保证中文、表情符号(⚠️🚨)不会变成乱码。 -->
  <meta charset="UTF-8">

  <!-- viewport 是「视口」设置，让页面在手机上能正确缩放。
       width=device-width 表示宽度等于设备宽度；
       initial-scale=1.0 表示初始不放大不缩小。
       做响应式（手机/电脑都能看）页面时这一行必写。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Orbitron 数字字体（时钟/倒计时用）：直接读本项目的自托管文件，
       不再走 Google Fonts——国内经常连不上，会一直转圈或退回等宽字体。 -->
  <style>
    @font-face {
      font-family: 'Orbitron';
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: url('/fonts/orbitron.woff2') format('woff2');
    }
  </style>

  <!-- 浏览器标签页上显示的标题 -->
  <title>乘法's Homepage</title>

  <!-- <style> 用来写 CSS（层叠样式表），控制页面长什么样。
       CSS 写在 head 里，页面一打开就能先拿到样式，不会「先丑一下再变好看」。 -->
  <style>
    /* ---- 基础重置：让页面在不同浏览器里表现一致 ---- */

    /* 选中 <body>（整个网页的可见区域）。
       CSS 语法：选择器 { 属性: 值; } */
    body {
      margin: 0;                /* 去掉浏览器默认的外边距，否则页面四边会有白边 */
      padding: 0;               /* 去掉默认内边距 */
      /* 背景：先铺纯深色兜底，再叠你放的同目录背景图。
         这里写了两张图（background.png 在前、background.jpg 在后）：
         浏览器会按顺序用，哪张存在就显示哪张，正好给你「png 或 jpg 都行」的兜底。
         cover=铺满屏幕且不变形；center=居中；fixed=滚动时背景不跟着动，更像壁纸。 */
      background-color: #121212;
      /* 背景图加载顺序：background.gif（动态图，最优先）→ background.png → background.jpg。
         哪张存在就显示哪张，所以「静态/动态/格式」你随便给，都能兜底。 */
      background-image: url('background.gif'), url('background.png'), url('background.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      /* font-family 是字体。逗号分隔多个，浏览器按顺序找：
         前面有就用前面的，没有就往后找，最后用系统默认 sans-serif（无衬线字体）*/
      font-family: "Orbitron", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    /* ---- 顶部横幅（banner）---- */

    /* .开头的叫「类选择器」，.banner 选中所有 class="banner" 的元素 */
    .banner {
      height: 60px;             /* 横幅高度 60 像素 */
      /* 磨砂玻璃：半透明底 + 背景模糊。
         rgba(30,30,30,0.5) 最后一位 0.5 是「不透明度」(0 全透明~1 全实心)；
         backdrop-filter:blur 把卡片后面的背景图糊掉，做出磨砂质感；
         -webkit- 前缀是给 Safari 用的兼容写法。 */
      background-color: rgba(30, 30, 30, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;         /* 粘性定位：正常在文档流顶部，下滑时粘在视口顶端「留在原地」不消失 */
      top: 0;                   /* 粘在距视口顶部 0px 处 */
      z-index: 100;             /* 盖在内容之上，避免被滚动内容遮住 */
      display: flex;            /* 弹性布局：让里面的子元素排成一行，方便居中对齐 */
      align-items: center;      /* 子元素在「垂直方向」居中 */
      justify-content: center;  /* 子元素在「水平方向」居中（把 "ChengFa" 放中间） */
    }

    /* 横幅里的标题文字 "ChengFa" */
    .banner-title {
      text-decoration: none;    /* 去掉链接默认的下划线 */
      color: azure;             /* 文字颜色：淡蓝白 */
      font-size: 30px;          /* 字号 30 像素 */
      font-weight: 400;         /* 字重 400 = 正常粗细（700 是加粗） */
    }

    /* #开头的是「ID 选择器」，优先级比类高。#ip-display 选中 id="ip-display" 的元素 */
    #ip-display {
      position: absolute;       /* 绝对定位：脱离正常文档流，自由摆放 */
      right: 30px;              /* 离父容器（.banner，因为它 position:relative）右边 30px */
      color: #ffffff;           /* 白色文字，更显眼 */
      font-family: 'JetBrains Mono', monospace; /* 等宽字体，适合显示 IP 这种数字 */
      font-size: 14px;          /* 小字号 */
    }

    /* ---- 大标题 "Chengfa的个人主页" ---- */
    h1 {
      color: #000;              /* 标签选择器：选中所有 <h1>，改为黑字 */
      font-size: 32px;
      padding-left: 50px;       /* 左内边距 50px，让标题不贴左边 */
      margin-top: 30px;         /* 离上面元素 30px */
    }

    /* 通用「容器宽度」类：多个地方复用，保证内容居中且不撑满屏幕 */
    .container-width {
      width: 1160px;                    /* 默认宽度 1160px（适合电脑屏幕） */
      max-width: calc(100% - 80px);     /* 关键：最大宽度不超过「屏幕宽度-80px」。
                                          calc() 可以算算式；100% 指父元素宽度。
                                          有了它，屏幕变窄时内容会自动收缩，不会横向滚动。 */
      margin: 30px auto;                /* 上下外边距 30px，左右 auto = 水平居中 */
      box-sizing: border-box;           /* 盒模型：width 包含 padding 和 border。
                                          默认是 content-box（width 只算内容，padding 另加），
                                          用 border-box 算尺寸更直观，强烈建议习惯用它。 */
    }

    /* ---- 导航按钮（.box）---- */
    /* 宽度不写死：由 .boxes 的 grid 5 列（1fr）自动均分铺满左列，每列≈215px。
       高度定为 50px，与铺满后的宽度协调（初版是 40px，铺宽后略加高避免扁长）。 */
    .box {
      display: block;           /* 块级：在 grid 格子里占满该列（即铺满宽度） */
      height: 72px;             /* 高度 72px（换回） */
      text-decoration: none;    /* 去掉链接下划线 */
      background-color: #107de9;/* 默认背景蓝（会被每个按钮自己的内联颜色覆盖） */
      font-size: 26px;          /* 字号 26px（加大） */
      color: white;             /* 文字白色 */
      text-align: center;       /* 文字水平居中 */
      line-height: 72px;        /* 行高=高度 → 单行文字垂直居中 */
      padding: 0 8px;           /* 只留左右内边距，文字不贴边 */
      white-space: nowrap;      /* 不换行，单行显示 */
      text-overflow: ellipsis;  /* 超出显示省略号 */
      overflow: hidden;         /* 名字太长时裁掉，不撑破格子 */
      border-radius: 8px;       /* 圆角 8px */
      font-weight: 500;
      box-sizing: border-box;   /* 宽度含 padding，尺寸更可控 */
    }

    /* .boxes 是包裹所有按钮的外层容器 */
    .boxes {
      display: grid;            /* 网格布局 */
      /* 5 列均分（1fr）：每列 = (左列宽 - 容器内边距40 - 4×间距12) ÷ 5 ≈ 215px，
         5 个按钮刚好铺满左列宽度，不再右边留空。 */
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;                /* 按钮之间的间距 */
      padding: 24px;            /* 外框内边距 */
      background-color: rgba(30, 30, 30, 0.5); /* 磨砂半透明（同 banner） */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;      /* 容器圆角 */
    }

    /* :hover 是「伪类」：鼠标悬停在元素上时才生效的样式 */
    .box:hover {
      transform: scale(1.05);   /* 放大到 1.05 倍，做出「按钮被撑大」的反馈感 */
      transition: 0.2s;         /* 让上面的变化在 0.2 秒内平滑过渡，而不是瞬间跳变 */
    }

    /* ---- 留言/发布区（post-container）---- */
    .post-container {
      padding: 20px;             /* 内边距调小，减少留白 */
      background-color: rgba(30, 30, 30, 0.5); /* 磨砂半透明 */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
    }

    /* 发布框内部：一个垂直排列的容器（文本框在上，按钮在下） */
    .input-area {
      display: flex;
      flex-direction: column;    /* 主轴改为「垂直」，子元素从上往下排（而不是横排） */
      gap: 15px;                /* 子元素之间的间距 15px（flex 布局专用，比 margin 好用） */
      margin-bottom: 20px;
    }

    /* 多行文本框（textarea，用来写留言） */
    #postText {
      width: 100%;              /* 宽度撑满父容器 */
      height: 100px;            /* 固定高度 100px */
      background-color: rgba(255, 255, 255, 0.08); /* 磨砂半透明（替代纯深色） */
      backdrop-filter: blur(8px);            /* 输入框也做磨砂，透出视频背景 */
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #333;   /* 1px 灰色边框 */
      border-radius: 8px;
      color: white;             /* 输入文字为白色 */
      padding: 15px;
      font-size: 16px;
      font-family: "Orbitron", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      resize: none;             /* 禁止用户拖动改变文本框大小 */
      box-sizing: border-box;
      outline: none;            /* 去掉聚焦时的默认高亮边框（下面用 :focus 自己做一个更漂亮的） */
    }

    /* :focus 伪类：元素被点进（获得焦点）时生效 */
    #postText:focus {
      border-color: #8A2BE2;    /* 聚焦时边框变成紫色，提示「这里可以输入」 */
    }

    /* 发布按钮 */
    #submitBtn {
      align-self: flex-end;     /* 在 column 弹性容器里，把自己靠右对齐（align-items 的「自己版」） */
      background-color: #8A2BE2;/* 紫色 */
      color: white;
      border: none;             /* 按钮默认有边框，去掉更好看 */
      padding: 10px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;        /* 加粗 */
      cursor: pointer;          /* 鼠标移上去变成「手指」形状，提示「能点」 */
      font-family: "Orbitron", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      transition: background-color 0.3s ease; /* 背景色变化时 0.3 秒平滑过渡 */
    }

    #submitBtn:hover {
      background-color: #9B4DF0;/* 悬停时紫色略浅，做出按下反馈 */
    }

    /* 留言列表里的单条留言。
       注意这个选择器：#postList p.post-item
       意思是「id 为 postList 的元素里面的、class 为 post-item 的 <p> 标签」 */
    #postList p.post-item {
      background-color: rgba(255, 255, 255, 0.08); /* 浅色磨砂，和留言输入框同一款 */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #8A2BE2; /* 左边一条 4px 紫色竖线，做装饰强调 */
      color: #f0f0f0;
      line-height: 1.6;         /* 行高 1.6 倍，文字不会挤在一起，更易读 */
      font-size: 16px;
      word-wrap: break-word;    /* 长单词/长串字符（比如网址）超出宽度时自动换行，避免撑破布局 */
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      position: relative;       /* 同样是给里面的「删除按钮」做绝对定位的基准 */
    }

    /* 留言里显示时间的那行 */
    .post-time {
      color: #888;              /* 灰色，弱化显示 */
      font-size: 12px;
      display: block;           /* 让它单独占一行（span 默认是行内的） */
      text-align: right;        /* 时间靠右 */
      margin-top: 8px;
    }

    /* 每条留言右上角的「删除」按钮 */
    .delete-btn {
      position: absolute;       /* 绝对定位：相对父元素（.post-item，它设了 relative）摆放 */
      top: 15px;                /* 离父元素顶部 15px */
      right: 20px;              /* 离父元素右边 20px */
      background-color: #E60000;/* 红色，警示色 */
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .delete-btn:hover {
      background-color: #FF1A1A;/* 悬停更亮红 */
    }

    /* ============ 新增：左右两栏布局 ============ */
    /* .home-layout：用 flex 把页面拆成「左主列 + 右侧栏」两栏；
       左列占满剩余宽度，于是原来的内容整体偏左，右边空出来给新部件。 */
    .home-layout {
      display: flex;             /* 弹性布局：子元素（左列、右列）横向排成一行 */
      flex-wrap: wrap;           /* 允许换行：让 h1 单独占第一行，两栏在下一行并排 */
      gap: 16px;                 /* 两栏之间的间距（调小，减少留白） */
      align-items: flex-start;   /* 两栏顶部对齐，互不把对方拉高 */
      width: 1480px;             /* 总宽 = 左内容1160 + 间距16 + 右栏300，让左侧内容仍保持原宽度 */
      max-width: calc(100% - 40px); /* 屏幕变窄时收缩（边距缓冲从 80px 减到 40px） */
      margin: 20px auto;         /* 上下 20px，左右居中（内容回到正常位置，不向下推） */
      box-sizing: border-box;
    }
    /* h1 与右侧栏同处第一行（不再独占整行） */
    .home-layout > h1 {
      flex: 1 1 auto;            /* 弹性占左，与右侧栏共享第一行 */
      order: 1;                  /* 排在第一位（左侧） */
      padding-left: 0;           /* 去掉左缩进，和下方内容左边缘对齐 */
      margin-top: 10px;
    }
    /* 左主列：换行占满整行，放在 h1 / 右侧栏之下 */
    .left-col {
      flex: 1 1 100%;            /* 占满整行，强制换到第二行 */
      order: 3;                  /* 排在 h1、右栏之后 */
      min-width: 0;              /* 关键：允许收缩，防止里面长内容把布局撑破 */
      display: flex;
      flex-direction: column;    /* 从上往下竖排 */
      gap: 16px;                 /* 导航组 和 留言板 之间留 16px 干净间距 */
    }
    /* 右侧栏：与 h1 同行，排在右上 */
    .right-col {
      width: 300px;              /* 固定宽 300px */
      flex-shrink: 0;           /* 空间不够时也不被压扁 */
      order: 2;                  /* 排在第二位，与 h1 同处第一行、居右 */
      display: flex;
      flex-direction: column;    /* 里面的小部件从上往下竖排 */
      gap: 16px;                 /* 小部件之间的间距 */
    }
    /* 手机/窄屏时，两栏改为上下堆叠，避免被挤变形 */
    @media (max-width: 900px) {
      .home-layout { flex-direction: column; }
      .right-col { width: 100%; }
      .boxes { grid-template-columns: repeat(3, 1fr); } /* 窄屏降为 3 列均分，避免溢出 */
    }

    /* ============ 新增：右侧栏通用小卡片 ============ */
    .widget {
      background-color: rgba(30, 30, 30, 0.5); /* 磨砂半透明（所有磁贴统一） */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;       /* 圆角 */
      padding: 14px;             /* 内边距（调小，减少留白） */
      box-sizing: border-box;
    }
    .card-label {
      color: #ccc;               /* 灰色小标签 */
      text-align: center;        /* 居中 */
      margin: 8px 0 0;           /* 上 8px，左右下 0（调小） */
      font-size: 13px;
    }

    /* ① 头像：绿圆 */
    .avatar-card { text-align: center; }
    .avatar-circle {
      width: 120px; height: 120px;     /* 宽高相等才能是正圆 */
      border-radius: 50%;              /* 50% 圆角 = 正圆 */
      background-color: #2ECC71;       /* 绿色底（图片没铺满时露出，无所谓） */
      margin: 0 auto;                  /* 水平居中 */
      overflow: hidden;                /* 图片超出圆的部分裁掉，保持圆形 */
      cursor: pointer;                 /* 鼠标变手指，提示可点 */
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-circle img {
      width: 100%; height: 100%;
      object-fit: cover;               /* cover：填满容器且不变形（多余部分裁掉） */
    }

    /* ② 时钟：磨砂卡片 + 大字号（用 Orbitron 字体，更醒目） */
    .clock-card { background-color: rgba(30, 30, 30, 0.5); text-align: center; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .clock-time {
      font-size: 52px;                 /* 更大，更醒目 */
      font-weight: 700;
      color: #9B4DF0;                  /* 紫色大字（和发布按钮同色系，时钟/倒计时统一） */
      font-family: 'Orbitron', 'JetBrains Mono', monospace; /* 用 Orbitron 数字字体 */
      letter-spacing: 3px;
    }

    /* ③ 倒计时：磨砂卡片（去掉刺眼的红底），只保留 分:秒 */
    .countdown-card { background-color: rgba(30, 30, 30, 0.5); text-align: center; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .countdown-time {
      font-size: 52px; color: #9B4DF0; font-weight: 700;   /* 紫色字，和时钟同字号 */
      font-family: 'Orbitron', 'JetBrains Mono', monospace; letter-spacing: 3px;
    }
    .cd-btns { margin-top: 12px; display: flex; gap: 8px; justify-content: center; }
    /* 倒计时数字可点击：点分钟 +1 分钟，点秒钟 +1 秒；禁止选中文字，避免点按变蓝 */
    .countdown-time { user-select: none; -webkit-user-select: none; }
    .countdown-time span { cursor: pointer; user-select: none; -webkit-user-select: none; }
    .countdown-time span:hover { opacity: 0.7; }
    .mini-btn {
      background-color: #ffffff; color: #333; border: none;
      padding: 6px 16px; border-radius: 6px; font-size: 14px;
      font-weight: bold; cursor: pointer;
    }
    /* 倒计时「开始 / 重置」按钮：改成和「发布」按钮一样的紫色（覆盖上面的白底） */
    #cdStart, #cdReset {
      background-color: #8A2BE2; color: #fff; border: none;
    }
    #cdStart:hover, #cdReset:hover { background-color: #9B4DF0; }

    /* ============ 动态视频背景 ============ */
    /* 垫在页面最底层（-1），铺满全屏循环播放，盖在 body 的 gif/png/jpg 背景图之上。
       磨砂卡片的 backdrop-filter 会对它做模糊，正好做出磨砂质感。 */
    #bgVideo {

  <!-- <script> 里写 JavaScript，负责页面上的「行为/交互」（不是样式）。 -->
  <script>
    // ================= 视频背景：只认同目录的 大肥鱼_ai.mp4 =================
    // 这个视频只给本页用，不进仓库、不上线（198MB，传不上 Pages，也不允许经 CDN 分发）。
    // 本机预览时文件在 → 正常播放；线上没这个文件 → 静默移除 video，露出下面的静态背景。
    (function () {
      const bgv = document.getElementById('bgVideo');
      if (!bgv) return;
      // <source> 加载失败时 video 不一定触发 error，这里同时监听并延时自检
      bgv.addEventListener('error', () => bgv.remove(), true);
      setTimeout(() => {
        // readyState 为 0 表示完全没加载到任何数据，判定为失败
        if (bgv.readyState === 0) bgv.remove();
      }, 3000);
    })();

    // ================= 一、留言板功能 =================
    // 先用 getElementById 拿到页面上对应的三个元素，存到变量里方便后面用。
    const submitBtn = document.getElementById('submitBtn'); // 发布按钮
    const postText = document.getElementById('postText');   // 文本框
    const postList = document.getElementById('postList');   // 留言列表容器

    // 功能1：从浏览器本地存储里读出所有留言，并显示出来
    function loadPosts() {
      // localStorage 是浏览器自带的「本地存储」，关掉网页数据也不会丢。
      // 这里用 key 'myHomepagePosts' 取之前存的数据（字符串）。
      // localStorage 只能存字符串，所以数据是用 JSON 字符串保存的，读出来要用 JSON.parse 转回数组。
      // || [] 的意思是：如果取不到（第一次用），就用空数组，避免后面报错。
      const savedPosts = JSON.parse(localStorage.getItem('myHomepagePosts')) || [];
      postList.innerHTML = ''; // 先把列表清空，防止重复叠加
      // 倒序遍历：从最后一条（最新的）往前，这样最新的显示在最上面
      for (let i = savedPosts.length - 1; i >= 0; i--) {
        createP(savedPosts[i].text, savedPosts[i].time, i); // 调用下面的函数生成一条留言
      }
    }

    // 功能2：根据「文字、时间、索引」生成一条留言的 DOM 元素并显示
    function createP(text, time, index) {
      // document.createElement 创建一个新标签（这里是 <p> 段落）
      const p = document.createElement('p');
      p.className = 'post-item'; // 给它加上 class，这样 CSS 里的样式才会生效
      // 用模板字符串（`...${}`）拼出留言内容：
      // ${text} 是留言文字，${time} 是时间，最后那个按钮点击会调用 deletePost(index) 删除
      p.innerHTML = `
        ${text}
        <span class="post-time">${time}</span>
        <button class="delete-btn" onclick="deletePost(${index})">删除</button>
      `;
      // insertBefore(新节点, 参考节点)：把新留言插到列表最前面（postList.firstChild 之前）
      postList.insertBefore(p, postList.firstChild);
    }

    // 功能3：删除某条留言（index 是它在数组里的位置）
    // 用 window.deletePost = ... 把它挂到全局，因为上面的 onclick 写的是字符串 "deletePost(...)"，
    // 只有全局函数才能被这种写法找到。
    window.deletePost = function (index) {
      let savedPosts = JSON.parse(localStorage.getItem('myHomepagePosts')) || [];
      savedPosts.splice(index, 1); // splice(位置, 数量)：从第 index 个删掉 1 条
      // 改完数组，再存回 localStorage（记得 JSON.stringify 转成字符串）
      localStorage.setItem('myHomepagePosts', JSON.stringify(savedPosts));
      loadPosts(); // 重新渲染列表，让删除立即生效
    }

    // 功能4：点「发布」按钮时执行
    submitBtn.addEventListener('click', function () {
      const text = postText.value.trim(); // .value 取文本框内容；.trim() 去掉首尾空格
      if (text === '') {                  // 空内容就提示并退出
        alert('写点东西再发布吧！');
        return;
      }

      // 拼出当前时间字符串，格式像 "2026-10-23 14:30"
      const now = new Date();
      const timeString = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' + // 月份从 0 开始，要 +1；padStart 补零成两位
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0');

      let savedPosts = JSON.parse(localStorage.getItem('myHomepagePosts')) || [];
      savedPosts.push({text: text, time: timeString}); // 把新留言加到数组末尾
      localStorage.setItem('myHomepagePosts', JSON.stringify(savedPosts)); // 存回本地
      loadPosts();        // 刷新显示
      postText.value = ''; // 清空输入框，方便写下一条
    });

    loadPosts(); // 页面一打开就先调用一次，把之前存的留言显示出来

    // ================= 二、获取 IP 及 校园网（IPv4）检测 =================
    const ipDisplay = document.getElementById('ip-display');

    // 以前只用一个接口（api.ipify.org），它在国内有时很慢甚至被挡，所以你才觉得「别人都流畅、你老失败」。
    // 改成一串「备用接口」依次尝试：谁先成功就用谁，单个挂了自动跳下一个，所以更稳更流畅。
    const IP_ENDPOINTS = [
      { url: 'https://ipinfo.io/ip',                         parse: t => t.trim() },            // 纯文本，CORS 友好、快
      { url: 'https://api.ipify.org?format=json',            parse: t => JSON.parse(t).ip },    // JSON，老牌稳定
      { url: 'https://ipwho.is',                             parse: t => JSON.parse(t).ip },    // JSON，CORS 友好
      { url: 'https://myip.ipip.net',                        parse: t => (t.match(/(\d+\.\d+\.\d+\.\d+)/) || [, '未知'])[1] } // 国内文本兜底
    ];

    // 依次尝试接口，返回第一个成功拿到的 IP（带 4 秒超时，慢接口直接跳过）
    async function fetchIP() {
      for (const ep of IP_ENDPOINTS) {
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 4000);
          const res = await fetch(ep.url, { cache: 'no-store', signal: ctrl.signal });
          clearTimeout(timer);
          if (!res.ok) continue;            // 状态码不对就试下一个
          const ip = ep.parse(await res.text());
          if (ip && ip !== '未知') return ip;
        } catch (e) { /* 这个接口失败（超时/被挡/CORS），试下一个 */ }
      }
      return null; // 全部失败
    }

    fetchIP().then(ip => {
      if (!ip) {
        ipDisplay.textContent = 'IP: 获取失败';
        return;
      }
      if (ipDisplay) ipDisplay.textContent = `IP: ${ip}`;
      // IPv4 地址带点（如 1.2.3.4）；IPv6 带冒号。用有没有点判断。
      if (ip.includes('.')) {
        setTimeout(() => {
          alert('⚠️ 警告：检测到当前为 IPv4 网络（校园网/宽带）！\n\n请勿在此网络下使用梯子，否则可能被学校网管追踪！');
        }, 500);
      }
    });

    // ================= 三、点击 MoonBazaar / jiajunba 时的「梯子拦截」 =================
    // querySelectorAll 选中所有 class 含 check-vpn 的元素（就是上面那两个按钮），返回列表
    const vpnButtons = document.querySelectorAll('.check-vpn');

    // forEach 遍历每个按钮，给它们分别绑定点击事件
    vpnButtons.forEach(btn => {
      btn.addEventListener('click', function (event) {
        // 点击瞬间，去请求一个「海外」接口测一下：能连上就说明你开了梯子（代理）
        fetch('https://api.ip.sb/geoip')
          .then(r => r.json())
          .then(data => {
            // 如果返回的国家代码不是 CN（中国），说明你人在海外网络/挂了梯子
            if (data.country_code !== 'CN') {
              event.preventDefault(); // preventDefault 阻止链接跳转，等于「拦截这次点击」
              alert('🚨 拦截成功：检测到当前为海外/代理 IP！\n\n做问卷不能挂梯子，请先关闭梯子再进入 MB 或 jiajunba！');
            }
          })
          .catch(() => {
            // 连不上海外接口 → 说明你在国内直连，放行（什么都不做）
            console.log("国内直连，安全放行。"); // console.log 在浏览器按 F12 的「控制台」里能看到
          });
      });
    });

    // ================= 四、右侧栏：实时时钟 =================
    // 每秒刷新一次当前时间，格式 "时:分:秒"
    const clockEl = document.getElementById('clock');
    // 把数字补成两位，例如 9 → "09"（padStart 在前面补 0 直到够 2 位）
    function pad2(n) { return String(n).padStart(2, '0'); }
    function updateClock() {
      const d = new Date(); // new Date() 取「此刻」时间
      // 用 UTC 方法，让显示与上方「当前时间(UTC)」标签一致
      clockEl.textContent = pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()) + ':' + pad2(d.getUTCSeconds());
    }
    updateClock();                  // 先跑一次，避免打开时显示 00:00:00
    setInterval(updateClock, 1000); // setInterval(函数, 毫秒)：每 1000ms（1秒）重复执行

    // ================= 五、右侧栏：头像（点击换图，存本地）=================
    const avatarImg = document.getElementById('avatarImg');
    const avatarInput = document.getElementById('avatarInput');
    const avatarCircle = document.getElementById('avatarCircle');
    // 默认占位头像：一段内嵌的 SVG 图（图片都加载失败时兜底）。
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' fill='%232ECC71'/><circle cx='60' cy='46' r='20' fill='%23ffffff'/><path d='M18 112 Q60 72 102 112 Z' fill='%23ffffff'/></svg>";
    // 优先用你「点圆圈上传」存过的头像；否则读同目录下的图片文件，没有再兜底 SVG。
    // 搬进本站后改名为 local-avatar.jpg（避免中文文件名在 URL 里出问题）。
    const savedAvatar = localStorage.getItem('myAvatar');
    if (savedAvatar) {
      avatarImg.src = savedAvatar;
    } else {
      avatarImg.src = 'local-avatar.jpg';
      avatarImg.onerror = function () {         // 图片缺失才显示占位 SVG
        this.onerror = null;
        this.src = DEFAULT_AVATAR;
      };
    }
    // 点绿圆 → 触发隐藏的文件选择框
    avatarCircle.addEventListener('click', () => avatarInput.click());
    // 选了图片后读成 base64 存起来（localStorage 只能存字符串，图片转 dataURL 正好）
    avatarInput.addEventListener('change', () => {
      const file = avatarInput.files[0];
      if (!file) return;
      const reader = new FileReader();   // FileReader 用来把文件读成文本/数据
      reader.onload = () => {            // 读取完成的回调
        avatarImg.src = reader.result;   // reader.result 就是图片的 base64 字符串
        localStorage.setItem('myAvatar', reader.result); // 存本地，下次打开还在
      };
      reader.readAsDataURL(file);        // 以 dataURL 形式读取
    });

    // ================= 六、右侧栏：可自定义倒计时 =================
    const cdMinEl = document.getElementById('cdMin');
    const cdSecEl = document.getElementById('cdSec');
    let cdTimer = null;  // 计时器句柄，用来停止
    let cdLeft = 0;      // 剩余秒数
    // 把剩余秒数刷新到「分」「秒」两个数字上
    function renderCd() {
      cdMinEl.textContent = pad2(Math.floor(cdLeft / 60));
      cdSecEl.textContent = pad2(cdLeft % 60);
    }
    // 点分钟数字 → +1 分钟（60 秒）；点秒钟数字 → +1 秒
    cdMinEl.addEventListener('click', () => { cdLeft += 60; renderCd(); });
    cdSecEl.addEventListener('click', () => { cdLeft += 1;  renderCd(); });
    function tickCd() {
      if (cdLeft <= 0) {                  // 到 0 了
        clearInterval(cdTimer); cdTimer = null; // 停掉计时器
        cdLeft = 0; renderCd();
        alert('⏰ 倒计时结束！');
        return;
      }
      cdLeft--;
      renderCd();
    }
    document.getElementById('cdStart').addEventListener('click', () => {
      if (cdTimer) clearInterval(cdTimer); // 先清掉旧计时器，防止重复
      if (cdLeft <= 0) { alert('先点数字加上时间再开始'); return; }
      cdTimer = setInterval(tickCd, 1000); // 每秒减一
    });
    document.getElementById('cdReset').addEventListener('click', () => {
      if (cdTimer) clearInterval(cdTimer);
      cdTimer = null; cdLeft = 0; renderCd();
    });

  </script>
</body>

</html>
