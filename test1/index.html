<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 纯度检测 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css">
<style>
  /* 本页专属：结果面板 */
  .result-box {
    margin-top: 20px;
    padding: 24px;
    background: var(--bg);
    border-radius: 10px;
    border: 1px solid var(--border);
    font-family: monospace;
    font-size: 15px;
    line-height: 2;
    min-height: 120px;
  }
  .result-box .label {
    color: var(--text-light);
    display: inline-block;
    width: 110px;
  }
  .result-box .value {
    color: var(--text);
    font-weight: 500;
  }
  .purity-bar {
    margin-top: 16px;
    height: 12px;
    border-radius: 6px;
    background: var(--border);
    overflow: hidden;
  }
  .purity-fill {
    height: 100%;
    width: 0%;
    background: var(--success);
    transition: width .6s, background .6s;
    border-radius: 6px;
  }
  .purity-text {
    margin-top: 8px;
    font-size: 18px;
    font-weight: bold;
    color: var(--success);
    text-align: center;
  }
  .status-loading { color: var(--text-light); }
  .status-error   { color: #e74c3c; }
</style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="logo" href="/">乘法</a>
      <div class="nav-right">
        <span class="ip-wrap">你的 IP：<span id="ip">获取中…</span></span>
        <button class="theme-btn" id="themeBtn" aria-label="切换深色模式">
          <svg id="themeIcon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <header>
    <img class="avatar" src="/avatar.jpg" alt="头像" onerror="this.style.display='none'">
    <h1 class="name">IP 纯度检测</h1>
    <p class="tagline">检测你的出口 IP 类型、代理状态与风险等级</p>
  </header>

  <section>
    <div class="card">
      <h2 class="section-title">检测结果</h2>

      <div class="result-box" id="result">
        <span class="status-loading">正在检测，请稍候…</span>
      </div>

      <div class="purity-bar">
        <div class="purity-fill" id="purityFill"></div>
      </div>
      <div class="purity-text" id="purityText">—</div>

      <p style="margin-top:22px;font-size:13px;color:var(--text-light);text-align:center;">
        数据来源：ip-api.com · 仅供参考
      </p>
    </div>
  </section>

  <footer>© 2026 CHENGFA</footer>

  <script>
    // 主题切换（和主页一致）
    const themeBtn  = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const moonSVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    const sunSVG  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      themeIcon.innerHTML = sunSVG;
    }
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeIcon.innerHTML = isDark ? sunSVG : moonSVG;
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // Logo 回首页 + 顶部 IP 展示
    document.querySelector('.logo').addEventListener('click', e => {
      e.preventDefault();
      location.href = '/';
    });
    fetch('https://api.ip.sb/ip')
      .then(r => r.text())
      .then(ip => document.getElementById('ip').textContent = ip.trim())
      .catch(() => document.getElementById('ip').textContent = '获取失败');

    // ===== 核心：IP 纯度检测 =====
    const resultBox  = document.getElementById('result');
    const purityFill = document.getElementById('purityFill');
    const purityText = document.getElementById('purityText');

    const API_KEY = '65636CB7682F0AA2621C1B05E0173849';

    function judge(d) {
      if (d.is_proxy)      return { type: '代理 / VPN',   purity: 20, color: '#e74c3c' };
      if (d.is_datacenter) return { type: '机房 / 数据中心', purity: 40, color: '#e67e22' };
      if (/mobile|cellular|4g|5g/i.test(d.as || '')) return { type: '移动网络', purity: 70, color: '#f1c40f' };
      return { type: '住宅 IP', purity: 95, color: 'var(--success)' };
    }

    fetch(`https://api.ip2location.io/?key=${API_KEY}`)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(d => {
        if (d.error) throw new Error(d.error);
        const v = judge(d);
        resultBox.innerHTML = `
          <div><span class="label">IP 地址</span><span class="value">${d.ip || '—'}</span></div>
          <div><span class="label">位置</span><span class="value">${[d.country_name, d.region_name, d.city_name].filter(Boolean).join(' · ') || '—'}</span></div>
          <div><span class="label">ISP</span><span class="value">${d.isp || '—'}</span></div>
          <div><span class="label">组织</span><span class="value">${d.as || '—'}</span></div>
          <div><span class="label">AS 号</span><span class="value">${d.asn || '—'}</span></div>
          <div><span class="label">经纬度</span><span class="value">${d.latitude ?? '—'}, ${d.longitude ?? '—'}</span></div>
          <div><span class="label">时区</span><span class="value">${d.time_zone || '—'}</span></div>
          <div><span class="label">IP 类型</span><span class="value" style="color:${v.color}">${v.type}</span></div>
          <div><span class="label">是否代理</span><span class="value">${d.is_proxy ? '是' : '否'}</span></div>
          <div><span class="label">是否机房</span><span class="value">${d.is_datacenter ? '是' : '否'}</span></div>
        `;
        purityFill.style.width = v.purity + '%';
        purityFill.style.background = v.color;
        purityText.style.color = v.color;
        purityText.textContent = `纯度评分：${v.purity} / 100`;
      })
      .catch(err => {
        console.error(err);
        resultBox.innerHTML = `<span class="status-error">检测失败：${err.message}</span>`;
        purityText.textContent = '—';
      });
  </script> 

</body>
</html>
