<!DOCTYPE html>
<!-- ============================================================
     文件：pages/write.html（写文章页）
     作用：一个「所见即所得」的文章编辑器（不用 Markdown，直接看着排）。
           支持：加粗/斜体/标题/引用/代码块/列表/颜色/字号/链接、
                 插入图片视频音频（拖角改大小）、粘贴或拖入图片直接上传、
                 字数统计、编辑已有文章。
     核心技术：contenteditable + document.execCommand + Range/Selection API
     说明：这一整段尖括号叹号包起来的是注释，不会显示在页面上。
     ============================================================ -->
<html lang="zh-CN">
<!-- 【lang="zh-CN"】声明语言是简体中文。
     影响：朗读软件选哪种口音、浏览器要不要提示翻译、中文怎么断行。 -->

<head>
<!-- 【head】给浏览器看的信息区，页面上不显示。 -->

<meta charset="UTF-8">
<!-- 【charset】字符编码，UTF-8 才能正常显示中文和 emoji。 -->

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 【viewport】手机上的虚拟窗口宽度。
     width=device-width = 等于手机实际宽度；initial-scale=1.0 = 初始不缩放。
     不写这两句，手机上会显示成桌面版缩微版，字小到看不清。 -->

<title>写文章 · 乘法</title>
<!-- 浏览器标签页上那行字。 -->

<link rel="icon" href="/favicon.ico">
<!-- 标签页左边的小图标。路径开头的 / 表示从网站根目录开始找。 -->

<link rel="stylesheet" href="/style.css?v=26">
<!-- 引入全站公共样式。
     【?v=26】缓存版本号：改完 CSS 把它加 1，浏览器才会重新下载。
     否则用户可能一直在看你几个月前缓存的旧样式。 -->

<style>
  /* 本页专属样式。ed- 前缀 = editor（编辑器），用来避免跟别的页面类名撞车。
     【为什么要前缀】CSS 类名是全局的，起个通用名（比如 .title）很容易冲突。
     这叫「命名空间」思路，是最土但最有效的防冲突办法。 */

  .ed-card { padding: 24px; }
  /* 编辑器卡片内边距，比普通卡片大一点 —— 写东西的空间要宽敞。 */

  .ed-title {
    /* 标题输入框。 */
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    /* 【inherit】继承父元素字体。
       【必须写】input / textarea / button / select 这些「表单控件」
       浏览器默认用系统字体，不会自动跟网页字体一致，不写就格格不入。 */
    font-size: 20px;
    /* 标题用大字，视觉上一眼就知道「这是内容的标题」。 */
    font-weight: 600;
    /* 字重 600 = 半粗。数字比 bold 更精确，可变字体还能取 450、650。 */
    background: var(--field);
    color: var(--text);
    outline: none;
    /* 【outline】浏览器给焦点元素画的默认轮廓线，这里关掉。
       【但关掉必须自己补焦点提示】下面 :focus 就补了。 */
  }
  .ed-title:focus { border-color: var(--primary); }
  /* 焦点时边框变主色 —— 这就是补上的焦点提示。
     【为什么必须有】不然键盘用户 Tab 过来完全不知道光标在哪，是无障碍上的错误。 */

  /* 工具栏 */
  .ed-bar {
    /* 一排格式化按钮的容器。 */
    display: flex;
    flex-wrap: wrap;
    /* 【flex-wrap:wrap】按钮太多了，窄屏上一行放不下就换行。
       不写的话按钮会一直往右挤，最后超出屏幕被切掉。 */
    gap: 4px;
    align-items: center;
    margin: 12px 0 8px;
    /* 【上 左右 下】三个值时：上 12px、左右 0、下 8px。
       四个值的顺序才是「上 右 下 左」顺时针对应。 */
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--field);
  }
  .ed-bar .sep {
    /* 按钮分组之间的竖线分隔符。
       【.ed-bar .sep】中间有空格 = 后代选择器：找 .ed-bar 里面的 .sep。
       如果写成 .ed-bar.sep（无空格）意思完全不同：
       既是 ed-bar 又是 sep 的**同一个元素**。
       这个区别是新手最容易搞混的地方之一。 */
    width: 1px; height: 20px;
    /* 用 1px 宽、20px 高的元素画出「一条竖线」——
       比用 border-left 更简单：不用管父元素高度，改高度也只改一处。 */
    margin: 0 4px;
    background: var(--border);
  }
  .ed-btn {
    /* 工具栏上的单个按钮。 */
    min-width: 30px;
    /* 【min-width 而不是 width】保证最窄 30px（让单字符按钮不至于太挤），
       但内容多的话（比如 "• 列表"）还能自己变宽。用 width 就锁死了。 */
    height: 30px;
    padding: 0 8px;
    border: 1px solid transparent;
    /* 【transparent 透明】平时边框是透明的（看不见但占 1px 位置）。
       【为什么这么写】因为 hover 时会把边框变实色。
       如果平时写 border:none，hover 时再加边框，元素会突然长大 1px，
       导致整排按钮抖动。平时用「透明边框」占住位置就没这个问题。
       这是做 hover 效果时非常常见的小技巧。 */
    border-radius: 6px;
    background: none;
    /* 【none】去掉背景（透明的）。工具栏按钮平时应该「无框无底」，
       鼠标移上去才出现底色，这样看起来更清爽。 */
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    line-height: 28px;
    /* 【line-height:28px】行高 = 30px 高减去上下各 1px 边框。
       作用是让按钮里的文字/图标竖直居中。
       【为什么不用 flex 的 align-items:center】因为按钮内容可能是 <b>、<i>、
       文本混排，flex 对行内内容处理不如 line-height 直接。老派但可靠的写法。 */
  }
  .ed-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-deep); }
  /* 悬停时同时变三样：淡主色底、主色边框、深主色文字。
     三样一起变才能让人确定「这个能点」。 */

  .ed-btn b { font-weight: 800; }
  /* 按钮里的 <b>B</b>（加粗按钮上的字母 B）。
     【为什么要规定它】浏览器默认 b 是 700，这里用 800 更「一眼就是粗体」。
       这是视觉暗示：按钮长什么样，点了就得到什么效果。 */
  .ed-btn i { font-style: italic; }
  .ed-btn u { text-decoration: underline; }
  .ed-btn s { text-decoration: line-through; }
  /* 上面三行同一个道理：按钮上的 I 是斜的、U 带下划线、S 带删除线。
     让按钮自己演示效果，比写文字标签直观得多。 */

  .ed-select {
    /* 下拉选择框（段落格式、字号）。 */
    height: 30px;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    /* 【cursor:pointer】让鼠标变小手。
       【注意】select 的 cursor 在有些系统上是无效的（系统自绘控件），
       但写上不亏。 */
  }
  .ed-color {
    /* 颜色选择器 <input type="color">。
       它是个「原生控件」，点开是系统的调色板。各浏览器外观不同，不太好统一。 */
    width: 30px; height: 30px;
    padding: 0;
    /* 【padding:0】必须写 —— 这个控件默认有内边距，
       清掉之后那个色块才能填满整个 30×30 的方块。 */
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }

  /* 编辑器主体 */
  .ed-body {
    /* 【这是整个页面最重要的元素】
       它是个 <div contenteditable="true">，也就是说 —— 
       浏览器把它变成了一个「可以直接编辑的富文本框」。
       你打的每个字、每次加粗，浏览器都会自动在它内部生成对应的 HTML。
       这是「所见即所得编辑器」最基础也最省事的实现方式。
       【代价】浏览器生成的 HTML 往往很脏（一堆 <b>、<span style>、<div> 嵌套），
       而且不同浏览器生成的结构还不一样。所以要做「严格控制输出格式」的编辑器，
       一般会自己维护一套数据模型（比如 ProseMirror、Slate 这类库）。
       本站文章只是自己看/自己写，脏一点无所谓，用原生方案最划算。 */
    min-height: 380px;
    /* 【min-height】最小高度，用 min 不用 height —— 
       内容多了它会自己长高，用 height 就锁死了，写长了要自己滚，很难受。 */
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    line-height: 1.8;
    /* 行高 1.8，中文长文阅读最舒服的区间（1.6~1.8）。 */
    outline: none;
    overflow-x: auto;
    /* 【overflow-x:auto】横向内容太宽时（比如插了个超大的表格/长代码行）
       出现横向滚动条，而不是把整个页面撑出横向滚动。
       只限制横向，纵向让它自然长高。 */
  }
  .ed-body:focus { border-color: var(--primary); }
  /* 光标进来时边框变主色，明确告诉用户「现在可以打字了」。 */

  .ed-body:empty::before {
    /* 【:empty】当这个元素里**完全没有任何内容**时匹配。
       【必须注意】空白字符（空格、换行）也算内容！
       所以 HTML 里 <div ...></div> 必须写成「中间一点空隙都没有」，
       写成两行（中间有个换行）:empty 就不生效了。
       这个坑非常经典，很多人明明写了却没效果就是这个原因。
     【::before】伪元素，在内容最前面凭空插一段。
       【铁律】必须写 content 属性，否则这个伪元素根本不会生成。
     */
    content: attr(data-placeholder);
    /* 【attr(属性名)】把某个 HTML 属性的值取出来当内容用。
       这里取 data-placeholder 的值，也就是编辑器为空时显示提示文字。
       【为什么不用 HTML 的 placeholder 属性】
       因为 placeholder 只有 input / textarea 支持，
       contenteditable 的 div 完全不认这个属性，只能自己造一个「假占位符」。
       【这个做法的好处】真正的 placeholder 属性，用户一打字就消失；
       这个伪元素是「内容为空时才出现」，所以清空内容后提示又会回来，更符合直觉。 */
    color: var(--text-light);
  }
  .ed-body img, .ed-body video { max-width: 100%; border-radius: 6px; }
  /* 编辑器里的图片和视频最宽不超过编辑区。
     【max-width:100% 而不是 width:100%】
       max 是「最宽到这儿」，小图保持原尺寸不被放大；
       用 width 会把小图标也拉满整行，糊得没法看。 */
  .ed-body audio { width: 100%; margin: 6px 0; }
  /* 音频播放器铺满整行（它本来就是个横条控件，不满宽很难看）。 */

  /* 点中图片/视频后右下角出现拖动手柄，拖一下就能改大小（改的是宽度，高度按比例） */
  .ed-body img.ed-sel, .ed-body video.ed-sel { outline: 2px solid var(--primary); outline-offset: 2px; }
  /* 【.ed-sel】= selected，「被选中的媒体」。
     【为什么要 outline 而不是 border】
       border 会占据布局空间，加上的瞬间图片会缩小 2px，内容跟着抖一下；
       outline 画在边框外面、完全不影响布局，是「高亮但不改变尺寸」的标准做法。
     【outline-offset:2px】让轮廓往外偏 2px，不贴着图片边缘，看起来更清楚。 */
  .ed-handle {
    /* 那个拖拽用的小方块手柄。 */
    position: fixed;
    /* 【position:fixed】相对于浏览器窗口定位，不随页面滚动。
       【为什么用 fixed 不用 absolute】
       因为图片可能在页面很下面的位置，用 absolute 的话手柄要跟着文档坐标系算，
       一旦页面滚动就得重新算。用 fixed + 每次滚动时重算屏幕坐标，逻辑更简单。
       这个文件里确实监听了 scroll 事件来同步位置（见 JS 部分）。 */
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    /* 【负 margin = 宽高的一半】把方块的中心对准定位点。
       因为 left/top 定的是方块的左上角，想让它「中心对准目标点」就得往回挪一半。
       这是「以中心定位」的通用手法，比用 transform:translate(-50%,-50%) 更老一些。 */
    border-radius: 3px;
    background: var(--grad-primary);
    border: 2px solid #fff;
    /* 白色外圈，让它压在任何颜色的图片上都看得清。 */
    box-shadow: none;
    cursor: nwse-resize;
    /* 【nwse-resize】西北-东南方向的双向箭头（↘↖ 那种）。
       【为什么用这个方向】因为它表示「斜着拖能改大小」，
       正好对着「从右下角往右下拖」的直觉。
       其他值：ew-resize 水平、ns-resize 垂直、nwse 是 north-west-south-east 的缩写。 */
    z-index: 120;
    /* 【z-index】层级，数字大的盖在上面。
       120 是为了压住大部分内容，但又在弹窗（通常 1000+）之下。 */
    display: none;
    /* 默认隐藏。点上图片才显示（JS 加 on 类）。 */
  }
  .ed-handle.on { display: block; }
  /* 【为什么用 display 切换而不是 opacity:0】
     opacity:0 的元素只是透明 —— 它还在那儿，还能点，还能被 Tab 到。
     用 display 才是真的不参与任何交互。 */

  .ed-body blockquote {
    /* 引用块。 */
    margin: 10px 0;
    padding: 6px 14px;
    border-left: 4px solid var(--primary);
    /* 左边一条粗色条，这是「引用」最经典的视觉符号。
       只写左边框，另外三边不写就是「无」→ 得到一条竖线。 */
    background: var(--primary-soft);
    color: var(--text-light);
    /* 引用内容用稍浅的颜色，视觉上「退后一层」。 */
  }
  .ed-body pre {
    /* 代码块。 */
    margin: 10px 0;
    padding: 12px;
    border-radius: 8px;
    background: var(--field);
    border: 1px solid var(--border);
    font-family: Consolas, Menlo, monospace;
    /* 【等宽字体】写代码必须用等宽字体，否则「i」和「m」宽度不同，
       代码根本对不齐，看着非常难受。
       【这一串是字体回退链】浏览器从左往右找，找到哪个用哪个：
         Consolas → Windows 自带
         Menlo    → macOS 自带
         monospace → 通用族名，任何系统都有一个默认等宽字体兜底
       最后这个「通用族名」一定要写，不然万一前面都没有就退化成默认字体了。 */
    font-size: 14px;
    white-space: pre-wrap;
    /* 【pre-wrap】保留换行和多余空格（pre 的默认行为），同时还能自动换行。
       【为什么不直接用 pre 的默认值】pre 默认不换行，长代码行会横向溢出，
       用户得左右拖着看，体验极差。pre-wrap 兼顾「保留格式」和「不溢出」。 */
  }
  .ed-body h1, .ed-body h2, .ed-body h3 { margin: 14px 0 8px; }
  /* 【一次管三个】用逗号把多个选择器写在一起，共用同一套声明。
       这能省不少重复代码。注意逗号是「或」的关系：
       这一组规则对三个选择器各自都生效。 */

  .ed-foot {
    /* 底部状态行：字数、素材空间、格式限制。 */
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-light);
  }
  .ed-foot .over { color: #c0392b; font-weight: 600; }
  /* 【.over】超字数时的样式：红色 + 加粗。
     JS 里用 classList.toggle('over', 字数 > 上限) 来加/删这个类。
     【为什么用 class 而不直接改 style.color】
     因为「什么情况下算超」这个判断逻辑在 JS 里，
     「超了长什么样」这个视觉在 CSS 里，职责分开才好维护。
     想改颜色只改 CSS，想改判定只改 JS。 */

  .ed-actions { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .ed-submit {
    /* 主操作按钮（发布/保存）。 */
    padding: 9px 26px;
    border: none;
    border-radius: 8px;
    background: var(--grad-primary);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .ed-submit:hover { background: var(--primary-deep); }
  .ed-submit:disabled { opacity: .6; cursor: not-allowed; }
  /* 禁用态：半透明 + 禁止符号。
     【not-allowed】就是那个 🚫 圆圈斜杠的鼠标指针。 */
  .ed-msg { font-size: 14px; color: var(--text-light); }
  /* 结果提示文字，默认灰色（表示「还没操作」）。 */
  .ed-msg.ok { color: #2e7d32; }
  .ed-msg.err { color: #c0392b; }
  /* 【.ed-msg.ok】连写两个类（中间没空格）= 同一个元素同时有这两个类。
     注意跟 .ed-msg .ok（有空格，后代选择器）完全是两回事 —— 这个区别必须要分清。
     【颜色语义】绿 = 成功，红 = 失败。
       注意这跟股市的「红涨绿跌」不是一回事，别混。 */
</style>
</head>
<body>
<!-- 从这里开始才是用户看得见的内容。 -->

  <div id="navbar"></div>
  <!-- 导航栏占位。真正的导航由 js/nav.js 加载后塞进来。 -->

  <section style="margin-top:36px;">
    <!-- 【section】语义标签，表示独立内容区块。外观跟 div 一样，
         区别只是「告诉人和搜索引擎这里是什么」。 -->
    <div class="card ed-card">
      <h2 class="section-title" id="pageTitle">写文章</h2>
      <!-- 【id="pageTitle"】编辑模式下 JS 会把它改成「编辑文章」。
           同一个页面身兼「新建」和「编辑」两种模式，靠这个标题区分。 -->

      <input class="ed-title" id="title" maxlength="100" placeholder="标题（最多 100 字）" autocomplete="off" data-lpignore="true">
      <!-- 【input】单行输入框，不需要闭合标签。
           【maxlength="100"】最多 100 字，超了打不进去。
             注意这只是「体验」，用户改代码就能绕过，后端必须再校验。
           【autocomplete="off"】不要让浏览器自动填历史记录 —— 
             标题是内容不是个人信息，弹「上次填过的」很打扰。
           【data-lpignore="true"】让 LastPass 这类密码管理器别管这个框。
             它们看到 input 就以为要填账号，会在旁边弹个小图标，很碍事。 -->

      <div class="ed-bar">
        <!-- ===== 第一组：撤销 / 重做 ===== -->
        <button class="ed-btn" data-cmd="undo" title="撤销">↶</button>
        <!-- 【data-cmd="undo"】自定义数据属性。

             【这种设计叫「数据驱动」】所有按钮共用一套逻辑，
             区别只在 data-cmd 的值不同 —— 不用为 20 个按钮写 20 个监听函数。

        <!-- 分组竖线。 -->

        <!-- ===== 第二组：段落格式 ===== -->
        <select class="ed-select" id="blockSel" title="段落格式">

               有些要求不带。这里统一传不带括号的值，由浏览器的实现决定。 -->
          <option value="p">正文</option>

          <option value="h2">二级标题</option>
          <option value="h3">三级标题</option>

          <option value="pre">代码块</option>

        <span class="sep"></span>

        <!-- ===== 第三组：文字样式 ===== -->

        <!-- 按钮里放 <b>B</b> 是为了让按钮自己演示效果（看起来就是粗的）。
             配合上面的 .ed-btn b { font-weight: 800 } 用。 -->
        <button class="ed-btn" data-cmd="italic" title="斜体"><i>I</i></button>
        <button class="ed-btn" data-cmd="underline" title="下划线"><u>U</u></button>
        <button class="ed-btn" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
        <!-- 【strikeThrough 注意大小写】execCommand 的命令名是大小写敏感的，
             这个命令就是驼峰写法 strikeThrough，写成 strikethrough 不生效。
             这类「命令名要背」的东西，用的时候查一下最稳。 -->
        <span class="sep"></span>

        <!-- ===== 第四组：字号 + 颜色 ===== -->
        <select class="ed-select" id="sizeSel" title="字号">
          <option value="2">小</option>
          <option value="3" selected>正常</option>
          <!-- 【selected】布尔属性：默认选中这一项。 -->
          <option value="5">大</option>
          <option value="6">特大</option>
          <!-- 【为什么值是 2/3/5/6 不是 14px】
               execCommand('fontSize') 只认 1~7 这七个档位（所谓「传统字号」），

        </select>

        <input class="ed-color" type="color" id="foreColor" value="#e5534b" title="文字颜色">
        <!-- 【type="color"】原生颜色选择器，点开是系统调色板。
             【value="#e5534b"】默认颜色。
             【各浏览器外观不同】有的显示一个方块，有的还带个按钮，不太能统一。 -->
        <button class="ed-btn" data-cmd="foreColor" data-val="#e5534b" title="用左边选的颜色">A</button>
        <!-- 【注意这个 data-val 只是默认值】
             JS 里会特殊处理 foreColor 这个命令：
             忽略这里的 data-val，改成读左边颜色选择器的当前值（见 JS 部分）。
             这样「用户调了颜色再点 A」才符合直觉。
             【为什么不直接写死一个颜色】那样左边那个颜色选择器就成了摆设。 -->
        <button class="ed-btn" data-cmd="hiliteColor" data-val="#fff3a3" title="黄色高亮">🖍</button>
        <!-- 【hiliteColor】高亮（背景色）命令，h 开头是 highlight。
             注意这个命令在部分浏览器里叫 backColor，兼容性略差 —— 
             所以 JS 里给它准备了兜底方案（见 FALLBACK 对象）。 -->
        <span class="sep"></span>

        <!-- ===== 第五组：块级元素 ===== -->
        <button class="ed-btn" data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
        <button class="ed-btn" data-cmd="insertOrderedList" title="有序列表">1. 列表</button>
        <button class="ed-btn" data-cmd="formatBlock" data-val="blockquote" title="引用">❝</button>
        <button class="ed-btn" data-cmd="formatBlock" data-val="pre" title="代码块">&lt;/&gt;</button>
        <!-- 【&lt;/&gt;】这是「HTML 实体」写法。
             【为什么不能直接写 </>】
             因为 < 是标签的开始，直接写的话浏览器会以为「这里要开始一个标签了」，
             然后找不到匹配就搞乱整段结构。必须转义：
               &lt; → < 的小于号
               &gt; → > 的大于号
               &amp; → & 的与号（这个最容易忘）
             【记忆法】lt = less than，gt = greater than，amp = ampersand。 -->
        <button class="ed-btn" data-cmd="insertHorizontalRule" title="分割线">—</button>
        <button class="ed-btn" data-cmd="createLink" title="插入链接">🔗</button>
        <button class="ed-btn" data-cmd="removeFormat" title="清除格式">🧹</button>
        <!-- 【removeFormat】把选中文字的加粗、颜色、大小等全清掉，
             只保留文字本身。用户从别处粘贴了一堆花里胡哨的格式时，这个是救星。 -->
        <span class="sep"></span>

        <!-- ===== 第六组：插入素材（这几个走自己的上传流程，不归 execCommand 管）===== -->
        <button class="ed-btn" data-act="img" title="插入图片">🖼 图片</button>
        <button class="ed-btn" data-act="video" title="插入视频">🎬 视频</button>
        <button class="ed-btn" data-act="audio" title="插入音频">🎵 音频</button>
        <!-- 【data-act 而不是 data-cmd】故意的区分：
             data-cmd 开头的那批走 document.execCommand（浏览器自带的编辑命令）；
             data-act 这三个是「本站自己的功能」，要先上传文件、拿到地址、再插进去。
             用不同的属性名，JS 里就能用两个独立的选择器分开处理，互不干扰。 -->
      </div>

      <div class="ed-body" id="editor" contenteditable="true" data-placeholder="开始写吧…（最多 10000 字，可粘贴或拖入图片）"></div>
      <!-- 【这一行是整个编辑器的核心，值得逐字看】

           【contenteditable="true"】
           让这个 div 变成「可编辑区域」。加上这个属性之后：
             · 里面会出现光标，可以直接打字
             · 浏览器自动处理输入法、删除、撤销、复制粘贴
             · 浏览器会自己生成 HTML：按回车生成新段落，加粗生成 <b>
           这是实现富文本编辑器最省力的方式，一行属性省掉几千行代码。

           【代价也要说清楚】
             ① 生成的 HTML 不由你控制 —— 各浏览器结构不一样，
                Chrome 可能生成 <div>，Firefox 可能生成 <br>，存进数据库后
                在不同浏览器里打开可能长得不一样。
             ② 粘贴时会带进外来的 HTML 和样式（比如从 Word 粘过来一堆
                <span style="font-family:宋体;mso-...">），把页面搞乱。
                本文件只处理了「粘贴图片」，纯文本粘贴是没管的 —— 这是个已知短板。
             ③ 安全性全靠自己：用户可以把任何 HTML 塞进去（包括脚本标签）。
                本站文章只有作者自己能发，所以风险可控；
                但如果要做「任何人可投稿」的站，服务端必须做 HTML 净化。

           【data-placeholder="..."】
           给 CSS 的 :empty::before 用的假占位符 —— 
           因为真正的 placeholder 属性 contenteditable 完全不认。
           注意这个 div 的开始和结束标签之间**一个字符都不能有**，
           连换行都不行，否则 :empty 就不匹配，占位文字永远不显示。 -->
      </div>

      <div class="ed-foot">
        <span>字数 <b id="chars">0</b> / 10000</span>
        <!-- 【b】加粗，让数字比周围的说明文字更醒目。 -->
        <span>素材空间 <span id="quota">—</span></span>
        <!-- 嵌套 span：外面是标签文字，里面的 span 单独装数字，方便 JS 只替换数字。 -->
        <span style="color:var(--text-light)">图片 ≤ 50MB，音频 ≤ 200MB，视频 ≤ 2GB</span>
        <!-- 【≤】Unicode 字符「小于等于」，直接打出来的，不是实体编码。
             类似的还有 ≥、≠、± —— 这些符号直接打比写 &le; 之类好记。 -->
      </div>

      <div class="ed-actions">
        <button class="ed-submit" id="saveBtn">发布</button>
        <!-- 【没有 disabled 初始禁用】因为标题为空时点了会 alert 提示，
             不会真的发出去。这跟「视频投稿页」的做法不同（那里是初始禁用）——
             两种都行，看取舍：
               初始禁用 → 用户不会白点，但他可能不知道为什么点不了
               可点但弹提示 → 用户点了才知道差什么，提示更明确
             【个人偏好】表单简单时用前者，字段多时用后者（不然用户要一个个猜哪个没填）。
             【注意】这个按钮没有写 type="button"。
             现在不在 form 里所以没事，但一旦包进 form，点它就会提交表单刷新页面。
             严谨起见应该写上。 -->
        <span class="ed-msg" id="msg"></span>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 CHENGFA</p>
  </footer>

  <div class="ed-handle" id="resizeHandle" title="拖我改大小，双击图片可恢复原始尺寸"></div>
  <!-- 那个拖拽手柄。
       【为什么放在 body 最后、而不是放在编辑器里面】
       因为它在 CSS 里用了 position:fixed —— 反正相对于窗口定位，
       放哪儿都一样。但放在编辑器外面更安全：
         ① 不会成为 contenteditable 的一部分，被用户误编辑或删除
         ② 不会污染文章的 HTML 内容（如果它在编辑器里，保存时会把这段
            <div class="ed-handle"> 一起存进数据库，那就出丑了）
       这个考虑很关键：**编辑器里面的所有东西都会被保存**，
       任何一个辅助元素混进去就变成文章内容的一部分。 -->

  <input type="file" id="fileImg"   accept="image/*" hidden>
  <input type="file" id="fileVideo" accept="video/*,.mkv" hidden>
  <input type="file" id="fileAudio" accept="audio/*" hidden>
  <!-- 三个隐藏的文件选择框，分别服务「图片/视频/音频」三个按钮。
       【为什么要三个】因为 accept 只能针对一个输入框设置。
       用一个框 + 动态改 accept 也行，但那样要处理「动态改完属性不生效」的兼容问题，
       不如直接放三个、各管一类简单。
       【accept 只是过滤不是限制】用户可以选「所有文件」绕过，
       真正的类型校验在 JS 和服务端做。
       【hidden】布尔属性，直接隐藏 —— 原生文件框太丑，实际做法都是藏起来，
       用好看的按钮去触发它的 click()。 -->

  <script src="/js/config.js"></script>
  <!-- 依次引入 6 个脚本，顺序绝不能乱，每个都依赖前一个：
         config.js        → 全站配置，挂到 window 上
         bg.js            → 背景图/视频（IndexedDB 取，零流量）
         supabase-js.js   → Supabase 官方 SDK
         sb.js            → 业务层，提供 window.SBAPI
         upload.js        → 上传层，提供 window.MEDIA（分片上传 + 进度回调 + 体积限制）
         nav.js           → 导航栏 + 登录弹窗 + 信箱
       【为什么都放 body 末尾】浏览器解析到 script 会停下先执行它。
       放在末尾时上面的 HTML 已解析完，脚本里 getElementById 才找得到元素。
       放 head 里执行的话元素还不存在，拿到的全是 null。 -->
<script src="/js/bg.js?v=2"></script>
<script src="/js/vendor/supabase-js.js"></script>
  <script src="/js/sb.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/nav.js?v=23"></script>
<script>
const MAX_CHARS = 10000;
/* 正文字数上限。写成常量而不是到处写 10000，
   以后要改成 2 万字只改这一行 —— 这叫「单一真相来源」。 */

/* ============ 1. 拿元素 ============ */
const editor  = document.getElementById('editor');
/* 【const】声明不可重新赋值的变量。
   规则：默认 const，确定要改才 let。读代码的人一眼知道它不会变。
   【注意】const 管的是「不能整体换成另一个对象」，
   editor.innerHTML = '...' 这种「改内容」是完全允许的。 */
const titleEl = document.getElementById('title');
const charsEl = document.getElementById('chars');
const msgEl   = document.getElementById('msg');
/* 【多空格对齐】'msgEl   = ' 中间多打了两个空格，纯粹为了让等号对齐好读。
   JS 完全不介意这种空白，这是给人看的排版。 */

/* ============ 2. 判断是新建还是编辑 ============ */
const qs = new URLSearchParams(location.search);
/* 【location.search】当前地址里问号开始那一段（含问号），例如 "?id=3"。
   【URLSearchParams】浏览器自带的解析器。
     比手动 split('&') 可靠 —— 它会自动解码 URL 编码（%E5%BC%A0 这种）。 */
let articleId = parseInt(qs.get('id'), 10) || null;
/* 【三件事串在一起，从左往右看】
   ① qs.get('id') → 取 id 参数的字符串值；不存在时返回 null
   ② parseInt(值, 10) → 转整数
      第二个参数 10 是进制，【必须写】！
      不写的话以 0 开头的字符串会被当成八进制（"010" 变成 8），
      这是 JS 出了名的历史遗留坑。
      参数不存在时 parseInt(null) 得到 NaN。
   ③ || null → NaN 是假值，所以最终得到 null
   【结果】有 id 就是数字，没有就是 null。
   【为什么用 null 不用 0】因为 0 也可能是合法 id（虽然实际不会），
   null 明确表示「没有」，语义更准确。 */
let loggedIn = false;
/* 是否已登录。初始 false，下面那个 IIFE 会去查会话然后改它。 */

/* ============ 3. 登录检查 ============ */
function requireLogin() {
  /* 检查是否登录，没登录就把登录框怼到用户脸上。
     返回 true = 可以继续；false = 已经拦下来了。 */
  if (loggedIn) return true;
  const m = document.getElementById('loginModal');
  if (m) m.classList.add('show'); else alert('请先登录');
  /* 【classList.add('show')】加上 show 类，CSS 里 .login-modal.show 会把
     display:none 改成 flex，弹窗就出来了。
     【为什么不用 opacity 控制显隐】opacity:0 的元素还在那儿，
     还能点、还能 Tab 到 —— 那不是真的隐藏。 */
  return false;
}
(async () => { const s = await SBAPI.getSession(); loggedIn = !!s; })();
/* 【IIFE 立即执行函数 + async】
   结构是 ( 函数 )() —— 括号把函数包成表达式，然后立刻用 () 调用。
   【为什么要包】两个原因：
     ① 顶层不能直接用 await（老浏览器会语法错误），包进 async 函数里才行
     ② 造成独立作用域，里面的 s 变量外面完全看不到，不污染全局
   【!!s】两个感叹号 = 强制转布尔值：
     !!对象 → true，!!null → false，!!undefined → false。
     为什么要转？因为 s 可能是个对象或 null，
     存成干净的 true/false 语义更清楚，调试打印也不会一坨对象信息。 */

/* ============ 4. 字数统计 ============ */
function countChars() {
  /* 数一数正文有多少字。 */
  const plain = editor.innerText.replace(/\s+/g, ' ').trim();
  /* 【.innerText】取元素里的「可见文本」。
     【为什么用 innerText 不用 textContent】
       textContent 会把脚本标签里的内容、隐藏元素的内容、所有空白都算进来；
       innerText 更接近「人眼看到的文字」，只算渲染出来的部分。
       数「文章多少字」显然该用 innerText。
     【/\\s+/g】正则：一个或多个（+）空白字符（\\s = 空格、换行、制表符），
       g 表示全局替换所有出现的地方。
     【替换成 ' '】把「连续多个空白」压成一个空格。
       为什么？因为富文本编辑器里按两次回车会生成两个 <p>，
       innerText 里就是两个换行。多按几下回车，字数就虚增了。
       压成一个空格，让「排版用的空白」不至于虚占字数。
     【.trim()】去掉首尾空白 —— 只打了一堆空格不算内容。 */
  charsEl.textContent = plain.length;
  /* 【.length】字符串长度。
     【注意】它数的是「UTF-16 代码元」，
     一个 emoji（比如 😀）会算成 2。所以严格说不是「人眼看到的字符数」。
     要精确数得用 [...plain].length（展开运算符按码点拆开）。
     对中文文章来说基本没差别（中文字符都是 1），所以这里不管。 */
  charsEl.parentElement.classList.toggle('over', plain.length > MAX_CHARS);
  /* 【.parentElement】父元素（上一级）。
     这里要操作的是包着 charsEl 的那个 <span>，不是 charsEl 自己。
     【.classList.toggle(类名, 布尔值)】
       第二个参数是 true → 加上这个类；false → 去掉。
     【为什么用两参数版而不是单参数版】
       单参数 toggle('over') 是「有就删、没就加」，它会假设当前状态跟你想要的反着来。
       但其实我们明确知道「超了就该有、没超就该没有」，
       用两参数版强制设定，永远不会出错。
       这是个很值得养成的习惯：状态明确时就用两参数版。 */
  return plain.length;
  /* 返回字数，因为保存时还要再判一次（见下面 saveBtn 的点击处理）。 */
}
editor.addEventListener('input', countChars);
/* 【'input' 事件】内容一变就触发（每敲一个字、每次粘贴、每次删除都触发）。
   【和 'change' 的区别】change 只在「失去焦点且内容变了」时触发一次，
   实时字数统计必须用 input。
   【直接传函数名 countChars】因为 addEventListener 会把事件对象当参数传进去，
   而 countChars 不需要参数，忽略掉就行 —— 这样写最简洁。 */

/* ============ 5. 工具栏：核心难题「选区保不住」 ============ */
/* 点工具栏按钮会抢走焦点，编辑器的选区就没了，execCommand 作用在空选区上等于没干。
   所以：随时记下编辑器里最后的选区，点按钮时先把它恢复回来。 */
/* 【这一段解释的是整个编辑器最核心也最容易被忽略的问题】
   【现象】用户在正文里选中「你好」两个字，然后去点「加粗」按钮，
   结果什么都没发生，或者只加粗了光标位置的一个字。
   【原因】浏览器里「选中的文字」是跟着「焦点」走的。
   你一点按钮，焦点就从编辑器跑到按钮上了，选区（selection）当场消失。
   等到按钮的 click 事件触发时，execCommand 面对的已经是「没有选区」的状态。
   【解法】① 在编辑器里操作时，随时把「当前选区」存成快照
           ② 点按钮时先把快照恢复回去，再执行命令
   这是所有基于 execCommand 的编辑器都必须处理的问题。 */
let savedRange = null;
/* 存着「最后的那个选区」的快照。
   【Range 对象是什么】它表示文档里的一段「范围」，
   有起点、终点、起点容器、终点容器等信息。
   可以理解成「用两个看不见的标记夹住一段内容」。 */
function saveRange() {
  /* 把当前选区存成快照。 */
  const s = window.getSelection();
  /* 【window.getSelection()】拿到「当前页面的选区对象」。
     注意它是**全局唯一**的 —— 整个页面只有一个选区，不是每个元素一个。 */
  if (!s || !s.rangeCount) return;
  /* 【rangeCount】选区里有几个范围。通常 0（没选）或 1（选了）。
     为 0 说明当前没有任何选区，直接返回。
     【理论上可能大于 1】在表格等特殊元素里，Firefox 曾支持多个范围，
     但现在基本见不到了。只取第一个就够。 */
  const r = s.getRangeAt(0);
  /* 【.getRangeAt(0)】取第 0 个范围。
     注意这是「活的」对象 —— 文档一变它自己就跟着变，
     所以下面必须 clone，不能直接存。 */
  if (editor.contains(r.commonAncestorContainer)) savedRange = r.cloneRange();
  /* 【r.commonAncestorContainer】选区起点和终点的「共同祖先节点」。
       举例：选区从「第一段的字」到「第二段的字」，
       共同祖先就是包着这两段的那个容器（也就是编辑器本身）。
     【editor.contains(节点)】判断这个节点是不是编辑器的后代（或它自己）。
     【为什么必须判断】因为用户可能在标题输入框里也选中了文字，
       那个选区不是编辑器的 —— 存下来会让后面的加粗作用到错误的地方。
       只存「编辑器内部的选区」，才安全。
     【.cloneRange()】复制一份。
       【为什么不能直接存 r】它是「活对象」——
       用户下一次点击、下一次输入，它自己就会变。
       存了等于没存，等你恢复的时候它已经指向别处了。
       clone 出来的是「死快照」，永远不会自己变。 */

  /* 【一个容易忽略的点】这个函数会在 keyup / mouseup / input / focus 四个事件时调用。
     这四个时机基本覆盖了「用户改了选区」的所有情况：
       keyup    → 用 Shift + 方向键扩选
       mouseup  → 鼠标拖选
       input    → 打字（选区会跟着移动）
       focus    → 点进编辑器
     四个加起来才算全覆盖。只监听 mouseup 的话，键盘选中的就存不到。 */
}
function restoreRange() {
  /* 把存的快照恢复成当前选区。返回 true 表示恢复成功。 */
  if (!savedRange) return false;
  const s = window.getSelection();
  s.removeAllRanges();
  /* 【.removeAllRanges()】先清空所有选区。
     为什么要先清？因为 addRange 是「追加」——
     不清的话会有两个选区叠加，行为很奇怪。 */
  s.addRange(savedRange);
  /* 【.addRange(范围)】把快照加进去，选区就恢复了。
     注意这里加的是「快照对象本身」，不是 clone —— 
     所以恢复之后 savedRange 又变成「活」的了，会被后续操作继续修改。
     这个行为在这里是好事（选区确实在跟着变），但也意味着
     每次用之前最好重新 saveRange 一次（代码里确实这么做了）。 */
  return true;
}
['keyup', 'mouseup', 'input', 'focus'].forEach(ev => editor.addEventListener(ev, saveRange));
/* 【数组 + forEach 批量绑事件】
   等价于写四行 editor.addEventListener(...)，但更紧凑。
   【为什么可以这么写】因为事件名只是字符串，
   用数组装着循环一遍就行 —— 这是「减少重复代码」很常见的技巧。
   【ev => ...】箭头函数，参数 ev 就是当前这一轮的字符串。 */

// 让颜色、高亮这些生成 <span style>，而不是被浏览器忽略的 <font>
try { document.execCommand('styleWithCSS', false, true); } catch { /* 老浏览器没有就算了 */ }
/* 【styleWithCSS 这个命令本身不改变内容，它是个「开关」】
   打开之后，所有格式化命令都会用 CSS 实现：
     打开 → <span style="color: red">
     关闭 → <font color="red">（老古董标签，现代 CSS 里已经不推荐了）
   【为什么必须放在最前面执行一次】因为它是全局设置，设一次就一直有效。
   【catch 后面没写参数】现代 JS 允许省略 —— 反正也不用这个错误对象。
   【try/catch 包着它的原因】有些老浏览器或特殊模式下没有这个命令，
   会直接抛错。抛错会中断整个脚本（后面的代码全都不执行），
   所以必须包起来。这种「一句失败就全盘皆输」的地方一定要 try。 */

/* 这些命令不需要先选中文字（光标放在那儿就能用） */
const NO_SELECTION_OK = ['insertHorizontalRule', 'undo', 'redo', 'formatBlock'];
/* 【为什么要这个白名单】
   加粗、斜体这些命令必须有选区才有意义（加粗谁？）。
   但插入分割线、撤销、改段落格式这些，光标放那儿就能干。
   下面的 exec() 会用这个名单来判断「没选区时该不该报错」。 */

/* execCommand 万一没生效（有些浏览器/场景会），自己把选中的文字包一层 */
function wrapSelection(tag, css) {
  /* 【这是兜底方案（fallback）】
     document.execCommand 虽然用着方便，但它是**已废弃**的 API：
       · 各浏览器实现不一致
       · 某些情况下静默失败（返回 false，什么都不做）
       · 规范里明确说「不要在新项目里用」
     但富文本编辑至今没有官方的替代品，所以现实里大家还是一边用一边骂。
     这里的思路：先试官方命令，失败了就用底层的 Range API 自己包一层标签。
     【手动包标签的好处】输出的 HTML 结构完全由自己控制，干净。
     【坏处】要处理一堆边界情况（跨段落选中怎么办、选区已经在标签里怎么办）。 */
  const s = window.getSelection();
  if (!s || s.rangeCount === 0 || s.isCollapsed) return false;
  /* 【s.isCollapsed】选区是否「塌陷」= 起点和终点在一起 = 没选中任何东西。
     【为什么必须挡掉】没选中东西，包一层标签包的是空，没意义。 */
  const r = s.getRangeAt(0);
  const el = document.createElement(tag);
  /* 按传进来的标签名造元素（strong、em、span 等）。 */
  if (css) el.setAttribute('style', css);
  /* 【为什么用 setAttribute 而不是 el.style.cssText】
     两种都能设多个样式，但 setAttribute 更直白（就是写 style 字符串）。
     el.style.xxx 是逐个属性设，适合要动态改单个值的情况。 */
  try {
    el.appendChild(r.extractContents());
    /* 【.extractContents()】这是关键的一步：
       把选区里的内容从文档里「剪」出来，作为一段游离的文档片段返回。
       注意是「剪」不是「复制」（复制用 cloneContents）。
     【然后 appendChild 进新建的标签】内容就装进新容器里了。
     【这一步可能出现什么问题】
       如果选区跨越了段落边界（比如从第一段中间选到第二段中间），
       extractContents 会把中间的段落结构一起剪出来，
       包进 <strong> 里会生成非法的 HTML（<strong> 里不能有 <p>）。
       浏览器会自动修正，但结果可能很怪。
       这就是「手动包标签」的兜底方案不能做到完美的原因。 */
    r.insertNode(el);
    /* 【.insertNode(节点)】把节点插回文档，插在原来选区的位置。
       因为刚才把内容剪走了，那个位置现在是空的，正好插进去。 */
    const nr = document.createRange();
    /* 【createRange()】凭空造一个新的空选区。 */
    nr.selectNodeContents(el);
    /* 【.selectNodeContents(节点)】让范围「选中这个节点的全部内容」。
       这样用户看到的就是「刚才选中的文字还是选中状态」（现在是新加的标签里）。 */
    s.removeAllRanges();
    s.addRange(nr);
    /* 清空旧选区、换成新选区 —— 同上面 restoreRange 的做法。 */
    savedRange = nr.cloneRange();
    /* 更新快照。clone 的原因同上：nr 是活对象，直接存会自己变。 */
    return true;
  } catch { return false; }
  /* 【为什么整个包在 try 里】Range API 有很多「非法操作会抛错」的情况
     （比如节点已经被移除了、跨文档操作等）。包起来最安全，
     失败就返回 false，让上层继续走原来的逻辑。 */
}
const FALLBACK = {
  /* 【兜底方案映射表】键是 execCommand 的命令名，值是「怎么手动实现」。 */
  bold:         () => wrapSelection('strong', ''),
  /* 【为什么用 <strong> 不用 <b>】
     <b> 是「视觉上加粗」，<strong> 是「语义上重要」。
     两者默认都渲染成粗体，但 <strong> 更符合现代 HTML 的语义化理念，
     而且读屏软件会给 <strong> 加重语气。所以语义标签优先。 */
  italic:       () => wrapSelection('em', ''),
  /* 【em】emphasis 强调，语义版的斜体（对应视觉版的 <i>）。 */
  underline:    () => wrapSelection('span', 'text-decoration:underline'),
  /* 【下划线没有语义标签】HTML 里本来有 <u>，但它在 HTML5 里被「重新定义」成
     「表示拼写错误之类的不精确标注」，语义很尴尬。
     所以这里用 <span> + CSS 实现，最干净。 */
  strikeThrough:() => wrapSelection('span', 'text-decoration:line-through'),
  foreColor:    v => wrapSelection('span', 'color:' + v),
  /* 【v 是传入的颜色值】比如 '#e5534b'，拼成 'color:#e5534b'。
     注意这里调用的箭头函数带参数（v），而上面几个不带 —— 
     因为只有这两个命令需要额外参数。 */
  hiliteColor:  v => wrapSelection('span', 'background:' + v)
  /* 【注意是 background 不是 background-color】
     background 是个「大杂烩」属性，能同时设颜色和图片；
     写 background 兼容性更好。用 background-color 也行，效果一样。 */
};

function exec(cmd, val) {
  /* 【执行一个编辑命令的统一入口】
     所有工具栏按钮最后都走这个函数，只是传的 cmd 不同。
     这样「恢复选区、判断合法性、兜底、更新字数」这些公共逻辑只写一次。 */
  editor.focus();
  /* 【先让编辑器获得焦点】
     因为 execCommand 只对「当前有焦点的可编辑区域」生效。
     点按钮时焦点跑到按钮上了，必须先抢回来。 */
  const has = restoreRange();
  /* 恢复之前存的选区。has 表示恢复成功没有。 */
  if (!has && NO_SELECTION_OK.indexOf(cmd) === -1) {
    /* 【条件的意思是】没有可恢复的选区，并且这个命令不在「不需要选区」的白名单里
       → 说明用户可能根本没在编辑器里操作过，得拦下来。 */
    const s = window.getSelection();
    if ((!s || s.isCollapsed) && !editor.contains(s && s.anchorNode)) {
      /* 【这一行判断非常绕，拆开看】
         【!s || s.isCollapsed】没有选区对象，或者选区是塌陷的（没选中东西）
         【!editor.contains(s && s.anchorNode)】光标也不在编辑器里面
           · s && s.anchorNode → s 不存在时直接得 null（短路求值，不会报错）
           · editor.contains(null) → 返回 false → 取反就是 true
         【两个条件都成立】= 没选中，光标也不在编辑器里 → 确实没法执行
         【为什么要这么严】因为有一种情况是「没选中文字，但光标在编辑器里」，
           这时候加粗会作用于「接下来要打的字」，是合理的行为，不该拦。 */
      setMsg('先在正文里点一下，选中要改的文字', 'err');
      return false;
    }
  }
  let ok = false;
  try { ok = document.execCommand(cmd, false, val); } catch { ok = false; }
  /* 【execCommand 的三个参数】命令名、是否显示默认 UI（几乎总是 false）、参数值。
     【返回值】true 表示执行成功，false 表示不支持或失败。
     【为什么要自己 try/catch】因为某些命令在某些浏览器上会直接抛错，
     不包的话整个点击处理就中断了，用户点了完全没反应还不知道为什么。 */
  if (!ok && FALLBACK[cmd]) ok = FALLBACK[cmd](val);
  /* 【官方命令失败 → 试兜底方案】
     【FALLBACK[cmd]】用命令名当键去查兜底表，查不到就是 undefined，
       所以外层要判断存在才调用。
     【注意这里把 val 也传进去了】因为 foreColor / hiliteColor 这两个需要参数。
       不传参数的兜底函数会忽略这个多余的参数，所以统一传没坏处。 */
  saveRange();
  /* 执行完再存一次选区（因为内容变了，选区也跟着变了）。 */
  countChars();
  /* 字数可能变了（比如清除了格式导致空白变化），更新一下。 */
  return ok;
}

document.querySelectorAll('.ed-btn[data-cmd]').forEach(btn => {
  /* 【.ed-btn[data-cmd]】组合选择器：
       类名是 ed-btn 并且 有 data-cmd 属性的元素。
     【为什么要加 [data-cmd] 过滤】因为工具栏里还有三个 data-act 的按钮
       （图片/视频/音频），它们不走这条路。用属性过滤干净地分开。 */

  /* 【这一行是解决「选区丢失」问题最关键的一招，很多人不知道】
     【原理】浏览器里点一个元素时，默认行为是「让它获得焦点」。
     一旦按钮获得焦点，编辑器的选区就没了。
     【e.preventDefault()】阻止这个默认行为 —— 按钮不抢焦点，
     编辑器继续保持焦点，选区也就不会消失。
     【为什么用 mousedown 而不是 click】
       因为焦点转移发生在 mousedown（按下那一瞬间），
       等到 click（按下并松开）时已经晚了，选区早没了。
       【事件顺序】mousedown → mouseup → click，想「抢先一步」必须挂在前面的。
     【副作用】按钮按下去时不会有「按压」的视觉反馈，
       所以下面用改背景色 180ms 的方式补了个反馈。
       这是为了功能牺牲一点原生体验，值得。 */
  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    /* 【dataset.cmd】读 data-cmd 属性的值。 */
    if (cmd === 'createLink') {
      /* 插入链接要额外问用户地址，所以单独处理。 */
      const url = prompt('链接地址（要带 http:// 或 https://）', 'https://');
      /* 【prompt(提示文字, 默认值)】弹出输入框。
         点确定 → 返回用户输入的字符串（可能是空的）；
         点取消 → 返回 null。
         【默认值 'https://' 的设计】省掉用户打这七个字，
           而且暗示了正确格式。
         【注意】如果用户直接点确定，会得到 'https://'，
           下面那个正则校验能过，于是插入一个空链接 —— 这是个小瑕疵。 */
      if (!url) return;
      /* 【!url】空字符串和 null 都是假值，两种情况都退出。
         这里用「假值判断」而不是 === null，是因为
         「用户点确定但什么都没填」也应该当作取消。 */
      if (!/^https?:\/\//i.test(url)) return alert('只支持 http/https 链接');
      /* 【校验链接协议】只允许 http 和 https。
         【为什么必须校验】因为 javascrip: 这种伪协议（注意这里故意错拼一个字母
           以免被某些工具误判成真实代码）可以在点击时执行任意代码，是经典的 XSS 手法。
           必须挡掉。
         【/^https?:\/\//】拆开看：
           ^        → 从开头匹配
           https?   → http 后面 s 可有可无（? 表示 0 或 1 次）
           :        → 冒号
           \/\/     → 两道斜杠。斜杠在正则里要写 \/ 转义，
                      因为普通斜杠是正则的分隔符，不转义会被当成结束。
           i 标志   → 忽略大小写，所以 HTTP:// 也能过。 */
      exec('createLink', url);
      return;
    }
    let val = btn.dataset.val;
    /* 【let 不是 const】因为下面可能覆盖它。 */
    if (cmd === 'foreColor') val = document.getElementById('foreColor').value;
    /* 【这里就是上面提过的那句「特殊处理」】
       颜色按钮的 data-val 只是个占位，实际用的颜色是左边那个颜色选择器的当前值。
       这样「调好颜色 → 点 A」才符合用户直觉。
       【.value】读 <input type="color"> 的当前值，形如 "#e5534b"。 */
    if (exec(cmd, val)) {                                        // 点到了就闪一下，给个反馈
      /* 【用返回值判断成功】exec 返回 true 才给反馈 —— 
         失败了也闪一下会误导用户。 */
      btn.style.background = 'var(--primary)';
      btn.style.color = '#fff';
      /* 【.style.xxx = ...】直接改行内样式。
         优先级很高，能压过所有 CSS 类。 */
      setTimeout(() => { btn.style.background = ''; btn.style.color = ''; }, 180);
      /* 【180ms 后恢复】
         【style = '' 是什么意思】设成空字符串 = 清除这个行内样式，
         元素回到 CSS 里定义的样子。
         这比记下原来的颜色再改回去更可靠 —— 不用关心原本是什么色。
       【为什么要这个反馈】因为上面用 preventDefault 干掉了按钮的「按压感」，
         不补一个视觉反馈，用户会觉得「我点了但它完全没反应」。
         180ms 是「刚好看得见但不会觉得慢」的经验值。 */
    }
  });
});
document.getElementById('blockSel').addEventListener('change', e => exec('formatBlock', e.target.value));
document.getElementById('sizeSel').addEventListener('change', e => exec('fontSize', e.target.value));
/* 【两个下拉框用同一套逻辑】

/* ============ 6. 图片/视频：拖动改大小 ============ */
const handleEl = document.getElementById('resizeHandle');
let resizing = null;

function showHandle(el) {
  /* 在某个图片/视频的右下角显示拖拽手柄。 */
  hideHandle();
  /* 【先清掉之前的】保证同一时刻只有一个元素被选中。
     不加这句的话，点第二张图时第一张的高亮不会消失，两个都亮着很乱。 */
  if (!el) return;
  el.classList.add('ed-sel');
  /* 给目标元素加上「被选中」的类 → 出现主色轮廓线。 */
  const r = el.getBoundingClientRect();
  /* 【.getBoundingClientRect()】获取元素在「视口坐标系」里的位置和尺寸，
     返回 { left, top, right, bottom, width, height, x, y }。
     【和 offsetLeft / clientWidth 的区别】
       getBoundingClientRect 会算上 transform 变换、而且坐标是相对于视口的；
       offsetLeft 是相对于定位父元素的，不考虑缩放。
       所以算「元素在屏幕上哪儿」一律用这个。
     【名字为什么这么长】bounding = 边界，client = 视口，rect = rectangle 矩形。
       直译就是「相对于视口的边界矩形」。 */
  handleEl.style.left = r.right + 'px';
  handleEl.style.top = r.bottom + 'px';
  /* 把手柄放在元素的「右下角」。
     【为什么要 + 'px'】因为给 style 赋值必须带单位，
     光给数字浏览器不认识（除了少数几个无条件属性）。
     这是新手最容易踩的坑之一：`el.style.width = 100` 是无效的，
     必须写 `el.style.width = '100px'`。 */
  handleEl.classList.add('on');
  /* 加 on 类 → CSS 里 .ed-handle.on 把 display 改成 block，手柄就显示了。 */
}
function hideHandle() {
  handleEl.classList.remove('on');
  editor.querySelectorAll('.ed-sel').forEach(x => x.classList.remove('ed-sel'));
  /* 【querySelectorAll 而不是 querySelector】
     因为可能有多个元素残留 ed-sel 类（比如程序出了点状况），
     全部清一遍最保险。
     【为什么不用 editor.querySelector('.ed-sel').classList.remove(...)】
     那样只清第一个，剩下的还亮着。 */
}
function selectedMedia() { return editor.querySelector('img.ed-sel, video.ed-sel'); }
/* 【一行函数：找到「当前被选中的那个媒体元素」】
   【img.ed-sel, video.ed-sel】逗号分隔 = 两者任一都匹配。
     注意 ed-sel 是连写的（同一元素上的类），不是空格（后代）。
   【只找第一个】因为设计上同一时刻只允许选中一个。
   【找不到返回 null】调用方用 if (el) 判断。 */
editor.addEventListener('click', e => {
  const el = e.target.closest('img, video');
  /* 【e.target】实际被点到的元素。
     【.closest(选择器)】从它开始往上找最近的匹配祖先，包含它自己。
     【为什么要 closest 而不是直接判断 e.target.tagName】
       因为点图片时，e.target 可能是图片，也可能不是（取决于是否有包裹元素）。
       用 closest 能往上找一层，更稳。
     【'img, video'】两个标签名用逗号分隔 = 匹配任一个。 */
  if (el) showHandle(el); else hideHandle();
  /* 点到了媒体就显示手柄，点空白就收起。 */
});
// 双击恢复原始尺寸
editor.addEventListener('dblclick', e => {
  /* 【'dblclick'】双击事件。
     【注意和 click 的关系】双击会先触发两次 click，再触发 dblclick。
     所以同一个元素上两个事件都有监听时，要小心逻辑冲突。 */
  const el = e.target.closest('img, video');
  if (!el) return;
  el.style.width = '';
  el.style.height = '';
  /* 【设成空字符串 = 清除行内样式】
     图片回到 CSS 里定义的 max-width:100%，也就是「按原始尺寸显示（超宽则缩到容器宽）」。
     【为什么两个都要清】因为拖动改大小时同时设了 width 和 height，
       只清一个的话另一个还卡着，比例会乱。清理就要清干净。 */
  showHandle(el);
  setMsg('已恢复原始尺寸', 'ok');
  /* 【一个小问题】contenteditable 里双击的默认行为是「选中一个词」，
     这里没阻止它，所以双击图片时会同时触发选词。
     实际用起来不太明显，但如果发现「双击后文字被选中了一块」就是这个原因。
     想避免得加 e.preventDefault()。 */
});
editor.addEventListener('input', hideHandle);
/* 内容一变就收起手柄。
   【为什么】因为用户开始打字了，说明注意力转移了，
   手柄还挂在那儿会挡视线。 */
window.addEventListener('scroll', () => { const el = selectedMedia(); if (el) showHandle(el); }, true);
/* 【滚动时重新定位手柄，这里有个关键细节：第三个参数 true】
   【为什么需要重算】因为手柄用的是 position:fixed（相对于视口固定），
     而图片是跟着页面一起滚的。滚动之后图片位置变了，手柄还停在原处。
     所以每次滚动都要重新算一遍坐标。
   【第三个参数 true 是什么】是「捕获阶段」标志。
     【为什么必须用捕获】因为 scroll 事件**不冒泡**！
       （这是个特例：绝大多数事件都会从子元素往上冒泡到 window，
       但 scroll 不会 —— 它是直接在滚动元素上触发的。）
     不冒泡就意味着在 window 上监听收不到「编辑器内部某元素滚动」的事件。
     加上 true 走「捕获阶段」（从 window 往下传），就能收到了。
     【这个坑非常隐蔽】很多人加了滚动监听却完全没反应，就是因为少了这个 true。 */
document.addEventListener('click', e => {
  if (!resizing && !e.target.closest('#resizeHandle') && !e.target.closest('#editor')) hideHandle();
});
/* 【点页面其他地方收起手柄】
   【三个条件】① 不在拖拽中（拖动时不应该收起）
             ② 点的不是手柄本身
             ③ 点的不是编辑器内部
   【为什么是 document 而不是 window】点击事件会冒泡到 document，够了。 */
handleEl.addEventListener('mousedown', e => {
  /* 开始拖动（按下鼠标那一刻）。 */
  const el = selectedMedia();
  if (!el) return;
  /* 没有选中的媒体就没得拖（理论上不会发生，但防御一下）。 */
  e.preventDefault();
  /* 【阻止默认行为】防止拖动时把整个元素「拖走」（HTML5 的拖放默认行为），
     也防止选中页面文字。 */
  resizing = { el, x: e.clientX, w: el.getBoundingClientRect().width };
  /* 【记下拖动的初始状态】
       el       → 正在拖哪个元素
       x        → 按下鼠标时的水平位置
       w        → 元素当前的宽度
     【为什么要记初始值】因为拖动过程中用的是「相对位移」：
       新宽度 = 初始宽度 + (当前鼠标位置 - 初始鼠标位置)
       如果不记初始值，每次都用绝对位置算，宽度会跳得乱七八糟。
     【e.clientX】鼠标位置相对于视口左边的距离（像素）。 */
});
window.addEventListener('mousemove', e => {
  /* 【为什么监听 window 而不是 handleEl】
     因为拖动时鼠标可能移出手柄（甚至移出窗口），
     只在手柄上监听就会「拖动中断」。绑在 window 上，全程都能收到。 */
  if (!resizing) return;
  /* 没在拖就直接返回。这个函数会在鼠标每次移动时都触发，
     不加这行的话全站鼠标移动都要跑一遍计算，白耗性能。 */
  const max = editor.clientWidth;
  /* 【.clientWidth】元素「内容区 + 内边距」的宽度，不含边框和滚动条。
     【为什么用它当上限】图片最宽不该超过编辑区，否则会撑着出现横向滚动条。 */
  const w = Math.max(60, Math.min(max, resizing.w + (e.clientX - resizing.x)));
  /* 【这一行有两层限制，拆开看】
       resizing.w + (e.clientX - resizing.x)  → 初始宽度 + 鼠标位移 = 想设的宽度
       Math.min(max, ...)                     → 不超过编辑区宽度
       Math.max(60, ...)                      → 不小于 60px
     【两个 Math 一起用叫「夹取（clamp）」】把值限制在一个区间内。
       为什么需要：允许宽度变成负数或 0 的话，图片会消失，用户就找不回来了。
       60px 是「还能看见是个图」的最小值。
     【Math.min 和 Math.max 的顺序不能反】
       先 min 再 max：先砍上限，再保下限。反过来的话，
       如果 max 比 max 上限还大，结果会超上限。 */
  resizing.el.style.width = Math.round(w) + 'px';
  /* 【Math.round】四舍五入成整数。
     【为什么】鼠标位置是整数，但加上初始值可能是小数，
     带小数的像素值浏览器也能渲染（会有亚像素模糊），
     取整更干净，也省得 style 里出现 "123.456789px" 这种长串。 */
  resizing.el.style.height = 'auto';
  /* 【高度设成 auto】让浏览器按原始比例自动算高度。
     不写的话，图片的 height 属性（如果有）会固定住，改宽度时比例就乱了。
     【这是「等比例缩放」的核心一行】只改 width、height 给 auto，比例自动保持。 */
  showHandle(resizing.el);
  /* 手柄跟着重新定位（因为元素变大了，右下角位置也变了）。 */
});
window.addEventListener('mouseup', () => {
  /* 松开鼠标 = 结束拖动。 */
  if (!resizing) return;
  resizing = null;
  /* 【关键：清空状态】不清的话松手之后鼠标一动，图片还会继续变大变小。 */
  countChars();
  /* 重新数一遍字数 —— 拖动本身不改文字，但图片尺寸变了可能影响排版。
     （其实这里影响不大，属于「顺手做一下」的保险。） */
  setMsg('大小已调整', 'ok');
});

/* ============ 7. 插入图片 / 视频 / 音频 ============ */
const FILE_INPUT = { img: 'fileImg', video: 'fileVideo', audio: 'fileAudio' };
/* 【映射表：类型 → 对应隐藏输入框的 id】
   为什么用对象当映射？
   因为后面可以写 document.getElementById(FILE_INPUT[btn.dataset.act]) —— 
   一行代码服务三个按钮，不用写 if/else 三段。 */
document.querySelectorAll('.ed-btn[data-act]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!requireLogin()) return;
    /* 没登录就不让插素材（反正也传不上去）。 */
    document.getElementById(FILE_INPUT[btn.dataset.act]).click();
    /* 【用 JS 触发隐藏 input 的 click()】
       这是「美化文件选择框」的标准套路：
       原生 file 输入框太丑，没有统一的 CSS 能改，所以藏起来，
       用好看的按钮去点它。
       【.click()】模拟一次点击，效果跟用户真的点了完全一样。 */
  });
});

function progress(pct, text) {
  setMsg(text + (pct ? ' ' + pct + '%' : ''), '');
}
/* 【拼进度文字的辅助函数】
   【pct ? ... : ''】有进度百分比才拼在后面。
     为什么判断真假？因为 pct 可能是 0（上传刚开始，0 是假值），
     这时候不显示 "0%" 而只显示「上传中…」也说得通。
     （其实显示 0% 更好，但这不叫 bug，叫设计选择。） */
let uploading = false;
/* 【上传锁】同一时刻只允许传一个文件。
   为什么要这样：多个大文件同时上传会抢带宽，每个都很慢，
   而且进度提示只有一个，多文件同时传的话百分比会跳来跳去，用户完全看不懂。 */
async function uploadFile(rawFile, kind) {
  /* 【rawFile】用户选的原始 File 对象。
     【kind】'img' / 'video' / 'audio'。 */
  if (!rawFile) return;
  /* 用户点了取消，没有文件 → 退出。 */
  if (uploading) return setMsg('还有文件在传，等它传完', 'err');
  /* 【上传锁生效】明确告诉用户为什么没反应，而不是静静地什么都不做。 */
  uploading = true;
  /* 上锁。 */
  try {
    if (!window.MEDIA) throw new Error('upload.js 没加载');
    /* 【防御性检查】upload.js 加载失败时 window.MEDIA 是 undefined，
       直接调用会报一个很难懂的错（"Cannot read property upload of undefined"）。
       这里主动抛一个说人话的错误 —— 把技术错误翻译成人能看懂的话，很值得学。 */
    setMsg('上传中… 0%', '');
    const r = await MEDIA.upload(rawFile, kind, pct => progress(pct, '上传中…'));
    /* 【MEDIA.upload 的三个参数】文件、类型、进度回调。
       【进度回调的机制】上传可能要几分钟，不可能等完了才有反馈，
       所以上传器会在过程中反复调用这个回调，参数是 0~100 的百分比。
       这种「过程主动汇报」的模式是异步操作里非常常见的。 */
    insertMedia(r.url, kind);
    /* 上传成功拿到地址，插进编辑器。 */
    setMsg('已插入 · ' + MEDIA.fmt(r.size), 'ok');
    /* 【MEDIA.fmt(size)】把字节数格式化成人能看的（比如 "13.4MB"）。
       【为什么不在页面里自己算】因为格式化逻辑是公共的，
       放在 upload.js 里一处维护，所有页面共用 —— 这叫「职责归位」。 */
  } catch (e) {
    setMsg(e.message || '上传失败', 'err');
    /* 【e.message || '上传失败'】优先显示具体原因（比如「文件太大」），
       没有就用通用文案。具体 > 笼统，能大幅减少用户困惑。 */
  } finally {
    /* 【finally】不管成功还是失败都执行。
       最适合放「清理状态」这种必须做的事。
       【为什么不能写在 try 末尾】中途抛错就跳过了；
       catch 里也要写一遍，重复。finally 一次搞定。 */
    uploading = false;
  }
}

function insertMedia(src, kind) {
  /* 把上传好的媒体插进编辑器。 */
  editor.focus();
  restoreRange();
  /* 【先聚焦再恢复选区】顺序很重要：
     先 focus 让编辑器成为活动元素，再恢复选区让它指向之前的位置。
     反过来的话，focus 可能会重置选区，白恢复了。 */
  if (kind === 'img')        document.execCommand('insertHTML', false, `<img src="${src}" alt=""><br>`);
  else if (kind === 'video') document.execCommand('insertHTML', false, `<video src="${src}" controls preload="metadata" style="max-width:100%"></video><br>`);
  else                       document.execCommand('insertHTML', false, `<audio src="${src}" controls preload="metadata"></audio><br>`);
  /* 【insertHTML】把一段 HTML 直接插到光标/选区位置。
     【末尾的 <br> 是干什么的】**非常重要**：不插一个换行，
       图片后面就没有光标可以落脚的地方，用户想接着打字都点不进去。
       这是 contenteditable 里插入媒体时几乎必踩的坑。

     【video 的三个属性】
       controls           → 显示播放控件（播放/暂停/进度条），不写就是个不能操作的画面
       preload="metadata" → 只预加载元数据（时长、尺寸），不下载整个视频。
         这个很关键：不加的话浏览器可能一开始就把 2GB 视频全下了，
         而用户可能根本不打算播放。这是巨额的流量浪费。
       style="max-width:100%" → 不超过编辑区宽

     【为什么这里没对 src 做转义】
       因为 src 来自上传接口的返回值，是我们自己服务器给的地址，
       不是用户手输的，所以不存在 XSS 风险。
       【但这个假设要写清楚】如果哪天上传层能被注入（比如文件名字段拼进了地址），
       这里就成了漏洞入口。安全是一整条链，任何一环松了都不行。

     【为什么用 insertHTML 而不是自己造元素再插入】
       因为自己造元素要处理「插到哪、怎么定位、光标怎么跟过去」一堆事，
       insertHTML 一行搞定。代价是它同样属于已废弃的 execCommand。 */
  setMsg('已插入', 'ok');
  countChars();
  loadQuota();
  /* 更新字数和存储占用提示（插入大文件后占用变了）。 */
}
['img', 'video', 'audio'].forEach(k => {
  document.getElementById(FILE_INPUT[k]).addEventListener('change', e => {
    /* 【'change'】选完文件（或取消）时触发。 */
    uploadFile(e.target.files[0], k);
    /* 【e.target.files】选中的文件列表（FileList 类数组），files[0] 是第一个。
       注意这里没判断 files[0] 存在 —— 用户点取消时是 undefined，
       但 uploadFile 开头有 if (!rawFile) return 兜住了。 */
    e.target.value = '';
    /* 【这个清空绝对不能漏】
       把 file 输入框的值清空，这样**连续选同一个文件也能触发 change**。
       不清的话，用户第二次选同一个文件，浏览器认为「值没变」不触发事件，
       用户会以为按钮坏了。这是极其经典的坑。 */
  });
});

// 粘贴 / 拖入图片直接上传
editor.addEventListener('paste', e => {
  /* 【'paste' 粘贴事件】用户按 Ctrl+V 或右键粘贴时触发。 */
  const items = (e.clipboardData || {}).items || [];
  /* 【(e.clipboardData || {})】如果浏览器没提供 clipboardData，
     就用一个空对象顶上，这样下一句 .items 不会报「Cannot read property of undefined」。
     然后 .items || [] 再兜一层空数组。双重保险。
     【这个写法叫「空对象模式」】比写一串 if (e.clipboardData && e.clipboardData.items) 简洁。 */
  for (const it of items) {
    /* 【for...of】遍历可迭代对象。
       【为什么用 for...of 不用 forEach】因为需要用 return 提前跳出整个循环
       （forEach 里的 return 只是 continue，跳不出循环）。 */
    if (it.type && it.type.startsWith('image/')) {
      /* 【it.type】剪贴板里这一项的类型，比如 "image/png"、"text/plain"。
         【.startsWith('image/')】看是不是图片。
         【为什么要判断 it.type 存在】有些剪贴板项没有 type 字段，
           直接调 startsWith 会报错。 */
      e.preventDefault();
      /* 【阻止默认粘贴行为】
         不阻止的话，浏览器会把图片当成「一个文件路径」或者一串 base64 文本粘进来，
         那不是我们要的。我们要自己上传后插入真实地址。 */
      if (!requireLogin()) return;
      /* 【注意这里用 return 而不是 continue】
         没登录就整个放弃粘贴 —— 反正是同一件事，不用处理后面的项了。 */
      uploadFile(it.getAsFile(), 'img');
      /* 【.getAsFile()】把剪贴板项转成 File 对象，这样才能上传。
         【可能返回 null】比如某些系统上剪贴板里的图片拿不到文件形式，
           uploadFile 第一行 if (!rawFile) return 会兜住。 */
      return;
      /* 【找到一张图就够了】一次只处理一个，多张图一起粘的情况很少见，
         而且上传是串行的（有上传锁），一次一个更符合用户体验。 */
    }
  }
  /* 【注意这个功能有个明显的缺口】
     上面只处理了「粘贴图片」。如果用户从 Word 或别的网页复制的**带格式文字**，
     会原样粘进来 —— 包括外来的 <span style="font-family:微软雅黑;font-size:14pt"> 之类，
     把编辑器的样式搞得很乱。
     【正规做法】监听 paste，把粘贴内容当纯文本读，然后自己按需重建成干净的 HTML。
     但那样会丢掉「从本站复制自己的文章」时的格式。是个需要权衡的设计问题。
     这里选择「不管」，因为本站文章都是自己写自己发，脏一点能接受。 */
});
/* 【拖入图片直接上传 —— 这段代码原来只写在注释里，现在真的补上了】
   之前文件名和注释都写着「粘贴 / 拖入图片直接上传」，
   但代码里只监听了 paste，拖进来完全没反应。
   这是典型的「文档超前于实现」，用户按提示操作会失望。

   【拖拽的三件套事件，缺一不可】
     dragenter / dragover —— 拖到元素上方时持续触发
     drop                  —— 松手那一刻触发
   关键点：必须在 dragover 里调用 preventDefault()，
   否则浏览器认为「这个位置不接受放置」，drop 事件根本不会触发。
   这是拖拽最容易卡住的地方 —— 写了 drop 却永远不执行，八成是漏了这句。 */

editor.addEventListener('dragover', e => {
  /* 【只对「拖文件」放行，拖文字不拦】
     e.dataTransfer.types 是一个列表，里面是这次拖拽携带的数据类型。
     拖文件时里面会有 'Files'；拖一段选中的文字时是 'text/plain' 之类。
     【为什么不全无脑 preventDefault】
       如果对什么都放行，用户想「把一段文字拖进编辑器」也会被我们接管，
       但我们的 drop 只处理图片、不处理文字 —— 结果就是文字拖不进去了，
       相当于为了加一个功能，弄坏了另一个功能。
     【[...].includes 的写法】types 可能是数组也可能是 DOMStringList，
       用扩展运算符统一转成真数组，才能安全调用 includes。 */
  const types = [...((e.dataTransfer && e.dataTransfer.types) || [])];
  if (types.includes('Files')) {
    e.preventDefault();
    /* 【dropEffect = 'copy'】让鼠标指针显示成「复制」图标（带加号）。
       纯视觉提示，不设也能用，但用户能更明确地知道「松手就会上传」。 */
    e.dataTransfer.dropEffect = 'copy';
  }
});

editor.addEventListener('drop', e => {
  /* 【drop 里也要 preventDefault】
     不拦的话，浏览器会用默认方式处理这个文件 ——
     通常是「直接打开它」，当前页面就被导航走了，写了一半的文章全丢。
     这个坑比想象中更常见，所以即使 dragover 已经拦过，这里还要再拦一次。 */
  const files = (e.dataTransfer && e.dataTransfer.files) || [];
  for (const f of files) {
    if (f.type && f.type.startsWith('image/')) {
      e.preventDefault();
      if (!requireLogin()) return;
      uploadFile(f, 'img');
      /* 【只传第一个图片就收工】和粘贴那边保持一致 ——
         一次拖十张图，串行上传会让用户等很久，而且光标位置也难处理。 */
      return;
    }
  }
  /* 【拖进来的不是图片（比如 PDF、视频）】
     这里什么都不做，也不 preventDefault ——
     浏览器会按它自己的方式处理（可能是下载，可能是打开）。
     其实更好的做法是提示一句「只支持图片」，
     但沉默的降级也不算错，至少不会打乱编辑器的内容。 */
});

function setMsg(text, cls) {
  /* 设置页面上的结果提示文字。 */
  msgEl.textContent = text;
  /* 【textContent 而不是 innerHTML】安全 —— 哪怕 text 里有 HTML 标签也只当文字显示。
     这个函数会被上传错误信息调用，而错误信息里可能含有文件名，
     用 innerHTML 就有 XSS 风险。 */
  msgEl.className = 'ed-msg' + (cls ? ' ' + cls : '');
  /* 【className 整体替换】注意是整体赋值，不是追加。
     所以每次都要把基础类 'ed-msg' 重新拼上，
     否则设成 'ok' 之后基础样式就丢了。
     【那个空格绝对不能少】不然会拼成 'ed-msgok'，一个不存在的类名。 */
}

/* ============ 8. 素材空间提示 ============ */
async function loadQuota() {
  document.getElementById('quota').textContent = '媒体直传 R2 · 图片 8MB / 音频 30MB / 视频 2GB';
}
/* 【这个名字又和实际行为不符了】
   叫 loadQuota（加载配额），实际上只是写了一句固定文案。
   既没请求数据也没算空间。属于「历史遗留的命名」。
   【为什么还是 async】因为早期版本真的是异步请求的，后来改成固定文案，
   函数签名没跟着改。加了 async 无害（调用方可以 await 它），只是有点多余。 */

/* ============ 9. 编辑模式：读取已有文章 ============ */
async function loadArticle() {
  if (!articleId) return;
  /* 没有 id → 新建模式，什么都不用做。 */
  document.getElementById('pageTitle').textContent = '编辑文章';
  /* 改标题，让用户知道现在是编辑不是新建。 */
  try {
    const d = await SBAPI.getArticle(articleId);
    if (!d.ok) { setMsg(d.error || '加载失败', 'err'); return; }
    if (!d.canEdit) {
      setMsg('这不是你的文章', 'err');
      document.getElementById('saveBtn').disabled = true;
      /* 【禁用按钮】比只提示更好：用户不会白点一下才发现没权限。 */
      return;
    }
    titleEl.value = d.title;
    /* 【.value = ...】给输入框设初始值。 */
    editor.innerHTML = d.content || '';
    /* 【.innerHTML = ...】把文章内容（一段 HTML）塞进编辑器。
       【为什么这里用 innerHTML 而不是 textContent】
         因为文章内容是富文本（带加粗、图片、段落），必须当 HTML 解析，
         否则用户会看到一堆 <p><strong> 这样的原始标签文字。
       【那不怕 XSS 吗】这里的内容来自数据库，是作者自己写的。
         如果作者能给自己下毒，那也没辙（他自己就在攻击自己）。
         但如果以后要做「多人协作编辑」或「转载别人文章」，这里就必须做 HTML 净化。
       【|| ''】字段是 null 时兜底成空字符串 —— 
         直接赋 null 会变成字符串 "null" 显示在编辑器里，那就尴尬了。 */
    countChars();
    /* 内容变了，重新数字数。 */
  } catch { setMsg('加载失败', 'err'); }
}

/* ============ 10. 保存 / 发布 ============ */
document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!requireLogin()) return;
  const title = titleEl.value.trim();
  if (!title) return alert('先写个标题');
  /* 【为什么标题必填】因为列表页、详情页都要显示标题，
     没有标题的卡片会是一片空白，很难看也很难点。
     【用 alert 而不是 setMsg】这是「用户操作不对」，需要强提示；
     setMsg 是给「系统层面的结果」用的，两者语气不一样。 */
  const n = countChars();
  if (n > MAX_CHARS) return alert(`正文 ${n} 字，超过 ${MAX_CHARS} 字上限`);
  /* 【模板字符串】用反引号包起来，${} 里可以放表达式。
     【为什么不直接把上限写死成 10000】用常量，以后改上限时文案自动跟着变。
     【注意】这里是「拦在客户端」，用户改代码能绕过，
       所以服务端必须再校验一次（数据库字段可能有长度限制，或者 RPC 里有判断）。 */

  const btn = document.getElementById('saveBtn');
  /* 【为什么重新 getElementById】因为上面已经查到过一次了，
     这里再查有点重复。其实可以在最上面存成一个常量。
     属于「可以优化但无害」的小冗余。 */
  btn.disabled = true;
  /* 【禁用按钮，防重复提交】
     不禁的话用户可能连点三下，发出三篇一模一样的文章。
     这是表单提交最基本的防护。 */
  setMsg('保存中…', '');
  /* 【先清掉上一轮的提示】不然用户会看到「上次的错误信息 + 保存中」并存。 */
  try {
    let d;
    /* 【先声明不赋值，在两个分支里各自赋值】
       这叫「延后赋值」，适合 if/else 两路都要产出一个结果的情况。 */
    if (articleId) d = await SBAPI.updateArticle(articleId, title, editor.innerHTML, n);
    else d = await SBAPI.createArticle(title, editor.innerHTML, n);
    /* 【分两条路】
       有 articleId → 更新已有文章
       没有      → 创建新文章
     【注意传的是 editor.innerHTML】也就是编辑器里的**完整 HTML**，
     不是纯文本。这是「富文本存储」最直接的方式 —— 存 HTML 字符串。
     【这种方式的取舍】
       好处：简单，存进去什么、读出来就是什么，不用解析/重建
       坏处：① HTML 里的结构跟浏览器有关，换浏览器可能显示不一样
            ② 存储体积大（一堆标签）
            ③ 以后要改渲染样式很难（样式已经写死在 HTML 里了）
       更先进的做法是存结构化数据（像 Notion 那样），但复杂度高一个量级。
       本站这个规模，存 HTML 是合理选择。 */
    if (!d.ok) { btn.disabled = false; return setMsg(d.error || '保存失败', 'err'); }
    /* 【失败必须恢复按钮】否则按钮永远灰着，用户只能刷新页面重来，
       写的内容全丢了 —— 那是最糟糕的体验。 */
    articleId = d.id;
    /* 【更新 articleId】这行很关键：
       新建成功后记下 id，这样如果用户接着又点了保存，
       走的就是「更新」而不是「又新建一篇」。
       不加这行，用户点两次保存就会发出两篇文章。 */
    setMsg('已发布，正在跳转…', 'ok');
    setTimeout(() => { location.href = '/pages/article.html?id=' + d.id; }, 600);
    /* 【600ms 后跳转】
       为什么要等：留时间让用户看到「已发布」三个字。
       立刻跳走的话，用户根本不知道保存成功没有。
       600ms 是「看得清又不会觉得卡」的经验值。
       【location.href = 地址】当前标签页跳转。 */
  } catch {
    btn.disabled = false;
    setMsg('保存失败，检查网络', 'err');
    /* 【catch 里没写 (e)】不关心具体错误，统一提示。 */
  }
});

/* ============ 11. 启动 ============ */
loadQuota();
loadArticle();
countChars();
/* 【三件事，为什么这个顺序】
   ① loadQuota()  → 先写底部的提示文案（同步的，马上就有）
   ② loadArticle() → 如果是编辑模式，去拉文章内容填进编辑器（异步）
   ③ countChars() → 先数一次字数

   【③ 可以放在 ② 前面吗】不行。
     loadArticle 是异步的，它内部 await 完之后才有内容；
     如果 countChars 在它前面同步执行，数到的是 0。
     不过 loadArticle 内部自己也会调一次 countChars，
     所以这里的 ③ 其实是给「新建模式」用的（确保显示 0/10000 而不是空）。

   【三个都没加 await】意思是「让它们各自跑，页面先显示」。
     这样用户能立刻看到界面，而不是对着白屏等一秒。
     【代价】如果内部抛错，会变成「未处理的 Promise 拒绝」，控制台报警告。
     更严谨的写法是 .catch(() => {}) 兜一下。 */
</script>
</body>
</html>
