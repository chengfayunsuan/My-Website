<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css?v=25">
<style>
  .vid-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .vid-tabs { display: flex; gap: 8px; }
  .vid-tab {
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text-light);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .vid-tab.on {
    background: var(--grad-primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
  }
  .vid-write {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    background: var(--grad-primary);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .vid-write:hover { background: var(--primary-deep); }
  .vid-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-light);
    font-size: 15px;
  }
  .vid-more {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text-light);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .vid-more:hover { border-color: var(--primary); color: var(--primary); }

  /* B 站式封面网格 */
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px 16px; }
  .vb { display: block; text-decoration: none; color: var(--text); }
  .vb-cover { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px;
    overflow: hidden; background: var(--field); }
  .vb-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vb-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #fff; background: var(--primary); }
  .vb-dur { position: absolute; right: 6px; bottom: 6px; padding: 1px 5px; border-radius: 4px;
    background: rgba(0, 0, 0, .74); color: #fff; font-size: 12px; line-height: 16px; }
  .vb-tag { position: absolute; left: 6px; top: 6px; padding: 1px 6px; border-radius: 4px;
    background: rgba(251, 114, 153, .92); color: #fff; font-size: 11px; line-height: 16px; }
  .vb-title { margin-top: 8px; font-size: 14px; line-height: 1.45; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vb:hover .vb-title { color: var(--primary-deep); }
  .vb-meta { margin-top: 5px; font-size: 12px; color: var(--text-light); display: flex;
    flex-wrap: wrap; gap: 8px; }
  #list .vid-empty { grid-column: 1 / -1; }
</style>
</head>
<body>
  <div id="navbar"></div>

  <section style="margin-top:36px;">
    <div class="card">
      <div class="vid-head">
        <h2 class="section-title" style="margin:0;">视频</h2>
        <div style="display:flex; gap:10px; align-items:center;">
          <div class="vid-tabs">
            <button class="vid-tab on" data-sort="new">最新</button>
            <button class="vid-tab" data-sort="hot">热门</button>
          </div>
          <a class="vid-write" href="/pages/video-write.html">传视频</a>
        </div>
      </div>

      <div class="v-grid" id="list">
        <p class="vid-empty">加载中…</p>
      </div>

      <button class="vid-more" id="moreBtn" style="display:none;">加载更多</button>
    </div>
  </section>

  <footer><p>© 2026 CHENGFA</p></footer>

  <script src="/js/config.js"></script>
<script src="/js/bg.js?v=1"></script>
<script src="/js/vendor/supabase-js.js"></script>
  <script src="/js/sb.js"></script>
  <script src="/js/nav.js?v=23"></script>
<script>
const listEl = document.getElementById('list');
const moreBtn = document.getElementById('moreBtn');

let sort = 'new';
let offset = 0;
const STEP = 20;

function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const MEDIA = window.MEDIA_BASE || '';
function mediaUrl(p) {
  if (!p) return '';
  if (/^(https?:|data:|\/\/)/.test(p)) return p;
  return MEDIA.replace(/\/+$/, '') + '/' + String(p).replace(/^\/+/, '');
}
function fmtDur(sec) {
  const s = Math.floor(Number(sec) || 0);
  if (!s) return '';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = n => (n < 10 ? '0' + n : '' + n);
  return (h ? h + ':' + p(m) : m) + ':' + p(ss);
}

function cardHTML(v) {
  const cover = mediaUrl(v.poster);
  const bili = /^bili:/i.test(v.video_path || '');
  return `
    <a class="vb" href="/pages/video.html?id=${v.id}">
      <div class="vb-cover">
        ${cover
          ? `<img src="${escapeHTML(cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
          : (bili
              ? `<span class="vb-ph vb-lazy" data-bv="${escapeHTML(String(v.video_path || '').replace(/^bili:/i, ''))}">▶</span>`
              : '<span class="vb-ph">▶</span>')}
        ${fmtDur(v.duration) ? `<span class="vb-dur">${fmtDur(v.duration)}</span>` : ''}
        ${bili ? '<span class="vb-tag">B 站</span>' : ''}
      </div>
      <div class="vb-title">${escapeHTML(v.title)}</div>
      <div class="vb-meta">
        <span>${escapeHTML(v.author || '匿名')}</span>
        <span>▶ ${v.views || 0}</span>
        <span>♥ ${v.likes || 0}</span>
        <span>${escapeHTML(SBAPI.fmtTime(v.created_at))}</span>
      </div>
    </a>`;
}

// 老数据 poster 存成 null（当年第三方代理抓不到），这里按 BV 号现取封面补上
async function fillLazyPosters() {
  const els = [...document.querySelectorAll('.vb-lazy[data-bv]')];
  await Promise.all(els.map(async el => {
    const info = await SBAPI.fetchBili(el.getAttribute('data-bv'));
    if (!info || !info.pic) return;
    const img = document.createElement('img');
    img.src = info.pic;
    img.alt = '';
    img.loading = 'lazy';
    img.setAttribute('referrerpolicy', 'no-referrer');
    el.replaceWith(img);
  }));
}

async function load(append) {
  if (!append) { offset = 0; listEl.innerHTML = '<p class="vid-empty">加载中…</p>'; }
  try {
    const d = await SBAPI.getVideos({ limit: STEP, offset, sort });
    if (!d.ok) throw new Error();
    const rows = d.list.map(cardHTML).join('');
    listEl.innerHTML = (append ? listEl.innerHTML.replace(/<p class="vid-empty">.*?<\/p>/s, '') : '') + rows;
    if (!d.list.length && !append) listEl.innerHTML = '<p class="vid-empty">还没有人传视频，来当第一个吧~</p>';
    offset += d.list.length;
    moreBtn.style.display = d.list.length < STEP ? 'none' : 'block';
    fillLazyPosters();
  } catch {
    listEl.innerHTML = '<p class="vid-empty">加载失败，刷新试试</p>';
  }
}

document.querySelectorAll('.vid-tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.vid-tab').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    sort = b.dataset.sort;
    load(false);
  });
});
moreBtn.addEventListener('click', () => load(true));

load(false);
</script>
</body>
</html>
