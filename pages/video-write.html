<!DOCTYPE html>
<!-- ============================================================
     文件：pages/video-write.html（投稿视频页）
     作用：上传视频与封面（大文件走分片上传）、填写标题简介、提交发布。
     说明：注释不会显示在页面上，只给看代码的人（也就是你）看的。
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿视频 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css?v=26">
<style>
  .ed-card { padding: 24px; }
  .ed-title {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 20px; font-weight: 600; background: var(--field); color: var(--text); outline: none; box-sizing: border-box;
  }
  .ed-title:focus { border-color: var(--primary); }
  .ed-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 6px; }
  .ed-btn {
    min-width: 30px; height: 32px; padding: 0 14px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); color: var(--text); font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .ed-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-deep); }
  .ed-desc {
    width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 15px; background: var(--field); color: var(--text); outline: none; box-sizing: border-box; resize: vertical; margin-top: 14px;
  }
  .ed-desc:focus { border-color: var(--primary); }
  .bar { height: 8px; border-radius: 6px; background: var(--field); border: 1px solid var(--border); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--grad-primary); transition: width .2s; }
  .bar-txt { font-size: 13px; color: var(--text-light); margin-top: 6px; }
  .ed-foot { margin-top: 12px; font-size: 13px; color: var(--text-light); }
  .ed-actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .ed-submit { padding: 9px 26px; border: none; border-radius: 8px; background: var(--grad-primary); color: #fff; font-family: inherit; font-size: 15px; cursor: pointer; }
  .ed-submit:hover { background: var(--primary-deep); }
  .ed-submit:disabled { opacity: .6; cursor: not-allowed; }
  .ed-msg { font-size: 14px; }
  .ed-msg.ok { color: #2e7d32; } .ed-msg.err { color: #c0392b; }
</style>
</head>
<body>
  <div id="navbar"></div>

  <section style="margin-top:36px;">
    <div class="card ed-card">
      <h2 class="section-title" id="pageTitle">投稿视频</h2>

      <input class="ed-title" id="title" maxlength="100" placeholder="标题（最多 100 字）" autocomplete="off" data-lpignore="true">

      <div style="margin-top:14px">
        <input class="ed-title" id="bvid" maxlength="60" style="margin-top:0"
               placeholder="B 站 BV 号（推荐）：例 BV1xx411c7mD"
               autocomplete="one-time-code" data-lpignore="true" autocapitalize="off" spellcheck="false">
        <div id="biliHint" style="font-size:13px;color:var(--text-light);margin-top:6px;line-height:1.6">
          填了 BV 号就不用上传视频，播放直接走 B 站。<b>视频必须是「公开」</b>，仅自己可见的视频访客打不开。
        </div>
      </div>

      <div style="margin-top:12px">
        <input class="ed-title" id="posterUrl" maxlength="600" style="margin-top:0"
               placeholder="封面图地址（选填，自动抓不到时粘一个）"
               autocomplete="off" data-lpignore="true" data-1p-ignore spellcheck="false">
        <div style="font-size:12px;color:var(--text-light);margin-top:6px;line-height:1.6">
          拿法：打开 B 站视频页 → 封面图上右键 → 复制图片地址 → 粘到这里。留空就用自动抓的。
        </div>
      </div>

      <div class="ed-bar">
        <button class="ed-btn" id="pickVideo" type="button">🎬 或者上传视频文件</button>
        <span id="fileInfo" style="font-size:13px;color:var(--text-light)">支持 mp4 / webm / ogv / mov / mkv，最大 2GB</span>
      </div>
      <div class="bar" id="prog" style="display:none;"><i id="barFill"></i></div>
      <div class="bar-txt" id="barTxt" style="display:none;"></div>
      <input type="file" id="fileVideo" accept="video/*,.mkv" hidden>

      <textarea class="ed-desc" id="desc" maxlength="2000" placeholder="简介（选填，最多 2000 字）" autocomplete="off"></textarea>

      <div class="ed-foot" id="quota">素材空间 —</div>

      <div class="ed-actions">
        <button class="ed-submit" id="publish" disabled>发布</button>
        <span class="ed-msg" id="msg"></span>
      </div>
    </div>
  </section>

  <footer><p>© 2026 CHENGFA</p></footer>

  <script src="/js/config.js"></script>
<script src="/js/bg.js?v=2"></script>
<script src="/js/vendor/supabase-js.js"></script>
  <script src="/js/sb.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/nav.js?v=23"></script>
<script>
const VID_MAX = 2 * 1024 * 1024 * 1024;

const fileVideo = document.getElementById('fileVideo');
const progEl = document.getElementById('prog');
const barFill = document.getElementById('barFill');
const barTxt = document.getElementById('barTxt');
const fileInfo = document.getElementById('fileInfo');
const titleEl = document.getElementById('title');
const descEl = document.getElementById('desc');
const publishBtn = document.getElementById('publish');
const bvidEl = document.getElementById('bvid');
const biliHint = document.getElementById('biliHint');
const posterEl = document.getElementById('posterUrl');
const msgEl = document.getElementById('msg');
const quotaEl = document.getElementById('quota');

let videoName = '', duration = 0, uploaded = false, videoUrl = '';
let loggedIn = false;

const BILI_TIP = '填了 BV 号就不用上传视频，播放直接走 B 站。<b>视频必须是「公开」</b>，仅自己可见的视频访客打不开。';
let biliInfo = null;      // { pic, duration, title } —— 抓到就存下来，发布时写进库
let biliTimer = null;

// B 站接口没有 CORS 头，浏览器直连会被拦，走公共代理；三个轮流试，抓不到也不影响发布
// 统一走 SBAPI.fetchBili（JSONP 直连 B 站，失败再走 /bili 边缘函数）
async function fetchBiliInfo(bv) {
  try { return await SBAPI.fetchBili(bv); } catch (e) { return null; }
}
function httpsUrl(u) { return String(u || '').replace(/^http:/, 'https:'); }
function biliOf(v) {
  if (!v) return '';
  const m = String(v).trim().match(/(BV[0-9A-Za-z]{10})/);
  return m ? m[1] : '';
}
function requireLogin() {
  if (loggedIn) return true;
  const m = document.getElementById('loginModal');
  if (m) m.classList.add('show'); else alert('请先登录');
  return false;
}
(async () => { const s = await SBAPI.getSession(); loggedIn = !!s; })();
function setMsg(text, cls) { msgEl.textContent = text; msgEl.className = 'ed-msg' + (cls ? ' ' + cls : ''); }

bvidEl.addEventListener('input', () => {
  const raw = bvidEl.value.trim();
  if (!raw) {
    biliHint.innerHTML = BILI_TIP; biliHint.style.color = '';
    publishBtn.disabled = !uploaded;
    biliInfo = null;
    return;
  }
  const bv = biliOf(raw);
  if (bv) {
    biliHint.innerHTML = '✓ 已识别 ' + bv + '，正在取封面…';
    biliHint.style.color = 'var(--primary-deep)';
    publishBtn.disabled = false;
    clearTimeout(biliTimer);
    biliTimer = setTimeout(async () => {
      const info = await fetchBiliInfo(bv);
      if (biliOf(bvidEl.value) !== bv) return;   // 期间又改了
      if (info) {
        biliInfo = info;
        if (!titleEl.value.trim() && info.title) titleEl.value = info.title;
        if (info.pic && !posterEl.value.trim()) posterEl.value = info.pic;
        biliHint.innerHTML = '✓ ' + bv + ' · 封面和时长已抓到，直接发布就行';
      } else {
        biliInfo = null;
        biliHint.innerHTML = '✓ ' + bv + '（封面没抓到，不影响播放）';
      }
    }, 600);
  } else {
    biliHint.textContent = '没认出来。BV 号是 BV + 10 位字母数字，总共 12 位；也可以直接粘整条视频链接';
    biliHint.style.color = '#e03e6a';
    publishBtn.disabled = !uploaded;
  }
});

document.getElementById('pickVideo').addEventListener('click', () => fileVideo.click());
fileVideo.addEventListener('change', e => { if (e.target.files[0]) handleVideo(e.target.files[0]); e.target.value = ''; });

async function handleVideo(file) {
  if (!requireLogin()) return;
  if (!/^video\//.test(file.type) && !/\.(mp4|webm|ogv|mov|mkv)$/i.test(file.name)) {
    return alert('只支持视频文件');
  }
  if (file.size > VID_MAX) return alert('这个视频 ' + (file.size / 1024 / 1024 / 1024).toFixed(2) + 'GB，超过 2GB 上限');
  videoName = file.name; videoUrl = ''; uploaded = false;
  publishBtn.disabled = !biliOf(bvidEl.value);
  fileInfo.textContent = file.name + ' · ' + (file.size / 1048576).toFixed(1) + 'MB';
  progEl.style.display = ''; barTxt.style.display = ''; barFill.style.width = '0%';
  barTxt.textContent = '上传中… 0%';
  setMsg('');
  try {
    if (!window.MEDIA) throw new Error('upload.js 没加载');
    const r = await MEDIA.upload(file, 'video', pct => {
      barFill.style.width = pct + '%';
      barTxt.textContent = pct + '%  ·  ' + (file.size * pct / 104857600).toFixed(1) + ' / ' + (file.size / 1048576).toFixed(1) + 'MB';
    });
    videoUrl = r.url; uploaded = true;
    barFill.style.width = '100%'; barTxt.textContent = '上传完成';
    publishBtn.disabled = false;
    setMsg('视频已上传，填好标题就能发布', 'ok');
  } catch (e) {
    progEl.style.display = 'none'; barTxt.style.display = 'none';
    setMsg(e.message || '上传失败', 'err');
  }
}

async function loadQuota() {
  quotaEl.textContent = '推荐 B 站嵌入（不限大小、不占本站流量）';
}

publishBtn.addEventListener('click', async () => {
  if (!requireLogin()) return;
  const bv = biliOf(bvidEl.value);
  if (!bv && !uploaded && !editId) return setMsg('填 B 站 BV 号，或者选个视频等它上传完', 'err');
  const title = titleEl.value.trim();
  if (!title) return alert('先写个标题');
  publishBtn.disabled = true; setMsg(editId ? '保存中…' : '发布中…', '');
  try {
    const path = bv ? 'bili:' + bv : videoUrl;
    const poster = (posterEl.value.trim() || (bv && biliInfo ? httpsUrl(biliInfo.pic) : '')) || null;

    // 编辑模式：只改标题 / 简介 / 封面，不动播放地址和时长
    if (editId) {
      const u = await SBAPI.updateVideo(editId, title, descEl.value.trim(), poster);
      if (!u.ok) { publishBtn.disabled = false; return setMsg(u.error || '保存失败', 'err'); }
      setMsg('已保存，跳转中…', 'ok');
      setTimeout(() => { location.href = '/pages/video.html?id=' + editId; }, 500);
      return;
    }

    const dur = bv && biliInfo ? Math.round(Number(biliInfo.duration) || 0) : 0;
    const d = await SBAPI.createVideo(title, descEl.value.trim(), path, poster, dur);
    if (!d.ok) { publishBtn.disabled = false; return setMsg(d.error || '发布失败', 'err'); }
    setMsg('已发布，跳转中…', 'ok');
    setTimeout(() => { location.href = '/pages/video.html?id=' + d.id; }, 600);
  } catch {
    publishBtn.disabled = false; setMsg('发布失败，检查网络', 'err');
  }
});

// 编辑已有视频：/pages/video-write.html?id=3
const editId = new URLSearchParams(location.search).get('id');
async function initEdit() {
  if (!editId) return;
  document.getElementById('pageTitle').textContent = '编辑视频';
  publishBtn.textContent = '保存修改';
  const d = await SBAPI.getVideo(editId);
  if (!d.ok) { setMsg(d.error || '读不到这条视频', 'err'); return; }
  if (!d.canEdit) { setMsg('这不是你发的视频', 'err'); publishBtn.disabled = true; return; }
  titleEl.value = d.title || '';
  descEl.value = d.description || '';
  posterEl.value = d.poster || '';
  const bv = biliOf(d.video_path);
  if (bv) {
    bvidEl.value = bv;
    biliHint.innerHTML = '✓ 已识别 ' + bv + '（编辑模式不改播放地址）';
    biliHint.style.color = 'var(--primary-deep)';
  } else if (d.video_path) {
    videoUrl = d.video_path;
    uploaded = true;
    fileInfo.textContent = '已有视频文件，编辑时不重传';
  }
  publishBtn.disabled = false;
}

loadQuota();
initEdit();
// 上限文案跟着当前存储后端走：R2 2GB，Supabase Storage 兜底 50MB
(function () {
  if (!window.MEDIA) return;
  const big = MEDIA.limitOf('video') >= 1073741824;
  fileInfo.textContent = big
    ? '支持 mp4 / webm / ogv / mov / mkv，最大 2GB'
    : '支持 mp4 / webm / ogv / mov / mkv，当前最大 50MB；长视频请用 B 站 BV 号';
})();
</script>
</body>
</html>
