<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿视频 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css?v=23">
<style>
  .ed-card { padding: 24px; }
  .ed-title {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 20px; font-weight: 600; background: var(--bg); color: var(--text); outline: none; box-sizing: border-box;
  }
  .ed-title:focus { border-color: var(--primary); }
  .ed-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 6px; }
  .ed-btn {
    min-width: 30px; height: 32px; padding: 0 14px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); color: var(--text); font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .ed-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-deep); }
  .ed-desc {
    width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 15px; background: var(--bg); color: var(--text); outline: none; box-sizing: border-box; resize: vertical; margin-top: 14px;
  }
  .ed-desc:focus { border-color: var(--primary); }
  .bar { height: 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .2s; }
  .bar-txt { font-size: 13px; color: var(--text-light); margin-top: 6px; }
  .ed-foot { margin-top: 12px; font-size: 13px; color: var(--text-light); }
  .ed-actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .ed-submit { padding: 9px 26px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-family: inherit; font-size: 15px; cursor: pointer; }
  .ed-submit:hover { background: var(--primary-deep); }
  .ed-submit:disabled { opacity: .6; cursor: not-allowed; }
  .ed-msg { font-size: 14px; }
  .ed-msg.ok { color: #2e7d32; } .ed-msg.err { color: #c0392b; }
</style>
</head>
<body>
  <div id="navbar"></div>

  <section style="margin-top:36px;">
    <div class="card ed-card">
      <h2 class="section-title" id="pageTitle">投稿视频</h2>

      <input class="ed-title" id="title" maxlength="100" placeholder="标题（最多 100 字）">

      <div class="ed-bar">
        <button class="ed-btn" id="pickVideo" type="button">🎬 选择视频</button>
        <span id="fileInfo" style="font-size:13px;color:var(--text-light)">支持 mp4 / webm / ogv / mov / mkv，最大 2GB</span>
      </div>
      <div class="bar" id="prog" style="display:none;"><i id="barFill"></i></div>
      <div class="bar-txt" id="barTxt" style="display:none;"></div>
      <input type="file" id="fileVideo" accept="video/*,.mkv" hidden>

      <textarea class="ed-desc" id="desc" maxlength="2000" placeholder="简介（选填，最多 2000 字）"></textarea>

      <div class="ed-foot" id="quota">素材空间 —</div>

      <div class="ed-actions">
        <button class="ed-submit" id="publish" disabled>发布</button>
        <span class="ed-msg" id="msg"></span>
      </div>
    </div>
  </section>

  <footer><p>© 2026 CHENGFA</p></footer>

  <script src="/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');</script>
  <script src="/js/sb.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/nav.js?v=23"></script>
<script>
const VID_MAX = 2 * 1024 * 1024 * 1024;

const fileVideo = document.getElementById('fileVideo');
const progEl = document.getElementById('prog');
const barFill = document.getElementById('barFill');
const barTxt = document.getElementById('barTxt');
const fileInfo = document.getElementById('fileInfo');
const titleEl = document.getElementById('title');
const descEl = document.getElementById('desc');
const publishBtn = document.getElementById('publish');
const msgEl = document.getElementById('msg');
const quotaEl = document.getElementById('quota');

let videoName = '', duration = 0, uploaded = false, videoUrl = '';
let loggedIn = false;

function requireLogin() {
  if (loggedIn) return true;
  const m = document.getElementById('loginModal');
  if (m) m.classList.add('show'); else alert('请先登录');
  return false;
}
(async () => { const s = await SBAPI.getSession(); loggedIn = !!s; })();
function setMsg(text, cls) { msgEl.textContent = text; msgEl.className = 'ed-msg' + (cls ? ' ' + cls : ''); }

document.getElementById('pickVideo').addEventListener('click', () => fileVideo.click());
fileVideo.addEventListener('change', e => { if (e.target.files[0]) handleVideo(e.target.files[0]); e.target.value = ''; });

async function handleVideo(file) {
  if (!requireLogin()) return;
  if (!/^video\//.test(file.type) && !/\.(mp4|webm|ogv|mov|mkv)$/i.test(file.name)) {
    return alert('只支持视频文件');
  }
  if (file.size > VID_MAX) return alert('这个视频 ' + (file.size / 1024 / 1024 / 1024).toFixed(2) + 'GB，超过 2GB 上限');
  videoName = file.name; videoUrl = ''; uploaded = false;
  publishBtn.disabled = true;
  fileInfo.textContent = file.name + ' · ' + (file.size / 1048576).toFixed(1) + 'MB';
  progEl.style.display = ''; barTxt.style.display = ''; barFill.style.width = '0%';
  barTxt.textContent = '上传中… 0%';
  setMsg('');
  try {
    if (!window.MEDIA) throw new Error('upload.js 没加载');
    const r = await MEDIA.upload(file, 'video', pct => {
      barFill.style.width = pct + '%';
      barTxt.textContent = pct + '%  ·  ' + (file.size * pct / 104857600).toFixed(1) + ' / ' + (file.size / 1048576).toFixed(1) + 'MB';
    });
    videoUrl = r.url; uploaded = true;
    barFill.style.width = '100%'; barTxt.textContent = '上传完成';
    publishBtn.disabled = false;
    setMsg('视频已上传，填好标题就能发布', 'ok');
  } catch (e) {
    progEl.style.display = 'none'; barTxt.style.display = 'none';
    setMsg(e.message || '上传失败', 'err');
  }
}

async function loadQuota() {
  quotaEl.textContent = '媒体直传 R2 · 视频上限 2GB';
}

publishBtn.addEventListener('click', async () => {
  if (!requireLogin()) return;
  if (!uploaded) return setMsg('先选个视频并等它上传完', 'err');
  const title = titleEl.value.trim();
  if (!title) return alert('先写个标题');
  publishBtn.disabled = true; setMsg('发布中…', '');
  try {
    const d = await SBAPI.createVideo(title, descEl.value.trim(), videoUrl);
    if (!d.ok) { publishBtn.disabled = false; return setMsg(d.error || '发布失败', 'err'); }
    setMsg('已发布，跳转中…', 'ok');
    setTimeout(() => { location.href = '/pages/video.html?id=' + d.id; }, 600);
  } catch {
    publishBtn.disabled = false; setMsg('发布失败，检查网络', 'err');
  }
});

loadQuota();
</script>
</body>
</html>
