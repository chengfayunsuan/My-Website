<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css?v=4">
</head>
<body>

  <div id="navbar"></div>

  <section style="margin-top:40px; margin-bottom:40px;">
    <div class="profile-wrap">

      <!-- 左栏 -->
      <div class="profile-left">

        <!-- 头部：头像 + 用户名（横排，靠左） -->
        <div class="card profile-head">
          <div class="profile-avatar-box">
            <img class="profile-avatar" id="avatarImg" src="/avatar-default.jpg" alt="头像">
            <label class="avatar-upload" id="avatarUploadLabel" for="avatarInput" style="display:none;">
              <span>更换头像</span>
              <input type="file" id="avatarInput" accept="image/*" hidden>
            </label>
          </div>
          <div class="profile-info">
            <h1 class="profile-name" id="profileName">加载中…</h1>
            <span class="role-tag" id="roleTag">用户</span>
          </div>
        </div>

        <!-- 签名 -->
        <div class="card profile-bio-card">
          <h2 class="section-title">个性签名</h2>
          <p class="profile-bio" id="bioText">这个人很懒，什么都没写。</p>
          <textarea class="profile-bio-input" id="bioInput" maxlength="200" placeholder="写点什么…" style="display:none;"></textarea>
        </div>

        <!-- 我的留言 -->
        <div class="card profile-feed">
          <h2 class="section-title">我的留言</h2>
          <div id="myMessages">加载中…</div>
        </div>

      </div>

      <!-- 右栏 -->
      <div class="profile-right">
        <div class="card profile-side">

          <div class="side-section">
            <div class="profile-stat" data-type="following">
              <span class="stat-label">关注</span>
              <span class="stat-num" id="followingCount">0</span>
            </div>
            <div class="profile-stat" data-type="followers">
              <span class="stat-label">粉丝</span>
              <span class="stat-num" id="followersCount">0</span>
            </div>
            <div class="profile-stat" data-type="blocked">
              <span class="stat-label">拉黑</span>
              <span class="stat-num" id="blockedCount">0</span>
            </div>
          </div>

          <div class="side-section">
            <p class="profile-meta">UID: <span id="uid">—</span></p>
            <p class="profile-meta">注册于 <span id="createdAt">—</span></p>
          </div>

        </div>
      </div>

    </div>
  </section>

  <button class="edit-fab" id="editFab" aria-label="编辑">
    <svg viewBox="0 0 24 24" id="editIcon">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
    </svg>
  </button>

  <div class="edit-actions" id="editActions" style="display:none;">
    <button class="edit-save" id="saveBtn">保存</button>
    <button class="edit-cancel" id="cancelBtn">取消</button>
    <button class="edit-pwd" id="pwdBtn">修改密码</button>
  </div>

  <div class="generic-modal" id="genericModal">
    <div class="generic-box">
      <button class="generic-close" id="genericClose">×</button>
      <h2 class="generic-title" id="genericTitle">标题</h2>
      <div class="generic-body" id="genericBody"></div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="/nav.js?v=4"></script>
  <script>
  (function () {
    const API = window.API_BASE || 'https://api.chengfa.dpdns.org';
    const token = localStorage.getItem('token');

    if (!token) {
      alert('请先登录');
      location.href = '/';
      return;
    }

    let editing = false;
    let originalBio = '';
    let originalAvatar = '';
    let currentUsername = '';

    const el = {
      avatarImg: document.getElementById('avatarImg'),
      avatarInput: document.getElementById('avatarInput'),
      avatarLabel: document.getElementById('avatarUploadLabel'),
      name: document.getElementById('profileName'),
      roleTag: document.getElementById('roleTag'),
      bioText: document.getElementById('bioText'),
      bioInput: document.getElementById('bioInput'),
      uid: document.getElementById('uid'),
      createdAt: document.getElementById('createdAt'),
      myMessages: document.getElementById('myMessages'),
      editFab: document.getElementById('editFab'),
      editIcon: document.getElementById('editIcon'),
      editActions: document.getElementById('editActions'),
      saveBtn: document.getElementById('saveBtn'),
      cancelBtn: document.getElementById('cancelBtn'),
      pwdBtn: document.getElementById('pwdBtn'),
      genericModal: document.getElementById('genericModal'),
      genericClose: document.getElementById('genericClose'),
      genericTitle: document.getElementById('genericTitle'),
      genericBody: document.getElementById('genericBody')
    };

    const pencilSVG = '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>';
    const closeSVG  = '<path d="M18 6 6 18"/><path d="M6 6l12 12"/>';

    async function loadMe() {
      try {
        const res = await fetch(API + '/me', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (!data.ok) {
          alert('登录已失效，请重新登录');
          localStorage.removeItem('token');
          localStorage.removeItem('username');
          location.href = '/';
          return;
        }
        render(data);
        loadMyMessages(data.username);
      } catch {
        el.name.textContent = '加载失败';
      }
    }

    function render(data) {
      currentUsername = data.username;
      el.name.textContent = data.username;
      el.uid.textContent = data.uid || '—';
      el.createdAt.textContent = data.createdAt || '—';

      const role = data.role || 'user';
      el.roleTag.className = 'role-tag';
      if (role === 'owner') {
        el.roleTag.textContent = '站长';
        el.roleTag.classList.add('role-owner');
      } else if (role === 'admin') {
        el.roleTag.textContent = '管理员';
        el.roleTag.classList.add('role-admin');
      } else {
        el.roleTag.textContent = '用户';
        el.roleTag.classList.add('role-user');
      }

      const avatarSrc = data.avatar || '/avatar-default.jpg';
      el.avatarImg.src = avatarSrc;
      originalAvatar = avatarSrc;

      if (data.bio && data.bio.trim()) {
        el.bioText.textContent = data.bio;
      } else {
        el.bioText.textContent = '这个人很懒，什么都没写。';
      }
      el.bioInput.value = data.bio || '';
      originalBio = data.bio || '';
    }

    async function loadMyMessages(username) {
      try {
        const res = await fetch(API + '/messages');
        const data = await res.json();
        const mine = data.filter(m => m.name === username).reverse();
        if (!mine.length) {
          el.myMessages.innerHTML = '<p class="empty-hint">还没有发过留言</p>';
          return;
        }
        el.myMessages.innerHTML = mine.map(m => `
          <div class="my-msg-item">
            <div class="my-msg-text">${escapeHTML(m.text)}</div>
            <div class="my-msg-time">${escapeHTML(m.time)}</div>
          </div>
        `).join('');
      } catch {
        el.myMessages.innerHTML = '<p class="empty-hint">加载失败</p>';
      }
    }

    function escapeHTML(s) {
      const d = document.createElement('div');
      d.textContent = String(s);
      return d.innerHTML;
    }

    function enterEdit() {
      editing = true;
      el.bioText.style.display = 'none';
      el.bioInput.style.display = 'block';
      el.avatarLabel.style.display = 'flex';
      el.editActions.style.display = 'flex';
      el.editIcon.innerHTML = closeSVG;
    }

    function exitEdit() {
      editing = false;
      el.bioText.style.display = 'block';
      el.bioInput.style.display = 'none';
      el.avatarLabel.style.display = 'none';
      el.editActions.style.display = 'none';
      el.editIcon.innerHTML = pencilSVG;
      el.bioInput.value = originalBio;
      el.avatarImg.src = originalAvatar;
    }

    el.editFab.addEventListener('click', () => {
      editing ? exitEdit() : enterEdit();
    });
    el.cancelBtn.addEventListener('click', exitEdit);

    el.avatarInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) return alert('请选图片文件');
      if (file.size > 1024 * 1024) return alert('图片不能超过 1MB');
      const reader = new FileReader();
      reader.onload = ev => { el.avatarImg.src = ev.target.result; };
      reader.readAsDataURL(file);
    });

    el.saveBtn.addEventListener('click', async () => {
      const bio = el.bioInput.value;
      const avatar = el.avatarImg.src;
      try {
        const res = await fetch(API + '/profile', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ bio, avatar })
        });
        const data = await res.json();
        if (!data.ok) return alert('保存失败：' + (data.error || '未知错误'));
        originalBio = bio;
        originalAvatar = avatar;
        alert('保存成功');
        exitEdit();
        loadMe();
      } catch {
        alert('网络错误，保存失败');
      }
    });

    el.pwdBtn.addEventListener('click', async () => {
      const oldPassword = prompt('请输入原密码');
      if (!oldPassword) return;
      const newPassword = prompt('请输入新密码（至少 6 位）');
      if (!newPassword) return;
      if (newPassword.length < 6) return alert('新密码至少 6 位');
      try {
        const res = await fetch(API + '/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ oldPassword, newPassword })
        });
        const data = await res.json();
        if (!data.ok) return alert('修改失败：' + (data.error || '未知错误'));
        alert('密码已修改');
      } catch {
        alert('网络错误，修改失败');
      }
    });

    document.querySelectorAll('.profile-stat').forEach(stat => {
      stat.addEventListener('click', () => {
        const type = stat.dataset.type;
        const titles = { following: '关注', followers: '粉丝', blocked: '拉黑' };
        el.genericTitle.textContent = titles[type];
        el.genericBody.innerHTML = '<p class="empty-hint">功能开发中…</p>';
        el.genericModal.classList.add('show');
      });
    });

    el.genericClose.addEventListener('click', () => el.genericModal.classList.remove('show'));
    el.genericModal.addEventListener('click', e => {
      if (e.target === el.genericModal) el.genericModal.classList.remove('show');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') el.genericModal.classList.remove('show');
    });

    loadMe();
  })();
  </script>

</body>
</html>
