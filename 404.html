<!DOCTYPE html>
<!-- ============================================================
     文件：404.html（404 页面）
     作用：访问了不存在的地址时，Cloudflare Pages 自动返回这个页面。作用：告诉访客「地址错了」，并给一条回首页的路。
     说明：注释不会显示在页面上，只给看代码的人（也就是你）看的。
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面走丢了</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css?v=26">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .lx-card {
    max-width: 460px;
    width: 100%;
    padding: 48px 32px 40px;
    text-align: center;
  }
  h1 {
    font-family: var(--font-num);
    font-size: 110px;
    font-weight: 800;
    letter-spacing: 6px;
    margin: 0 0 8px;
    line-height: 1;
    color: azure;
  }
  p {
    color: var(--text-light);
    margin: 6px 0 30px;
    font-size: 15px;
  }
  a.lx-btn {
    display: inline-block;
    padding: 12px 30px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: none;
    transition: background .2s;
  }
  a.lx-btn:hover {
    background: var(--primary-deep);
    transform: none;
    filter: none;
  }
</style>
</head>
<body>
  <div class="lx-card glass">
    <h1>404</h1>
    <p>这个页面去乘法运算了，没算出来。</p>
    <a class="lx-btn" href="/">回到首页</a>
  </div>
<script src="/js/config.js"></script>
<script src="/js/bg.js?v=2"></script>
</body>
</html>
