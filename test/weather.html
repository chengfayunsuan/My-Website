<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气预报 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css?v=18">
<style>
  .weather-search {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .weather-search input {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  .weather-search input:focus { border-color: var(--primary); }
  .weather-search button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    transition: background .2s;
  }
  .weather-search button:hover { background: var(--primary-deep); }

  .weather-hint {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 18px;
  }

  .weather-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 26px;
    text-align: center;
  }
  .weather-city {
    font-size: 22px;
    font-weight: bold;
    color: var(--text);
    margin-bottom: 6px;
  }
  .weather-temp {
    font-size: 64px;
    font-weight: bold;
    color: var(--primary-deep);
    line-height: 1.1;
    margin: 14px 0;
  }
  .weather-desc {
    font-size: 18px;
    color: var(--text);
    margin-bottom: 18px;
  }
  .weather-details {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--text-light);
    margin-top: 12px;
  }
  .weather-details span b { color: var(--text); font-weight: 600; }
  .weather-error { color: #e74c3c; text-align: center; padding: 20px; }
  .weather-loading { color: var(--text-light); text-align: center; padding: 20px; }
</style>
</head>
<body>

    <div id="navbar"></div>

  <header>
    <img class="avatar" src="/avatar.jpg" alt="头像" onerror="this.style.display='none'">
    <h1 class="name">天气预报</h1>
    <p class="tagline">查询全国各大城市实时天气</p>
  </header>

  <section>
    <div class="card">
      <h2 class="section-title">查询天气</h2>

      <div class="weather-search">
        <input id="cityInput" type="text" placeholder="输入城市名，如：开封 / 北京 / 上海" />
        <button id="searchBtn">查询</button>
        <button id="locateBtn">📍 定位我</button>
      </div>
      <p class="weather-hint">数据来源：Open-Meteo · 无需注册</p>

      <div id="weatherResult">
        <p class="weather-loading">请输入城市名，或点「定位我」自动获取当前位置</p>
      </div>
    </div>
  </section>

  <footer><p>© 2026 CHENGFA</p></footer>
  
 <script src="/config.js"></script>
 <script src="/nav.js?v=18"></script>
<script>

/* ========== 天气 ========== */
const resultBox = document.getElementById('weatherResult');

// 天气代码 → 中文描述（Open-Meteo 用 WMO code）
const WMO = {
  0: '晴', 1: '少云', 2: '多云', 3: '阴',
  45: '雾', 48: '雾凇',
  51: '小毛毛雨', 53: '毛毛雨', 55: '大毛毛雨',
  61: '小雨', 63: '中雨', 65: '大雨',
  71: '小雪', 73: '中雪', 75: '大雪',
  80: '阵雨', 81: '强阵雨', 82: '暴雨',
  95: '雷暴', 96: '雷暴伴冰雹', 99: '强雷暴伴冰雹'
};

async function queryByName(name) {
  resultBox.innerHTML = '<p class="weather-loading">查询中…</p>';
  try {
    // 1. 城市名 → 经纬度
    const geoRes = await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=zh`
    );
    const geo = await geoRes.json();
    if (!geo.results || !geo.results.length) throw new Error('找不到这个城市');
    const loc = geo.results[0];
    await queryByCoord(loc.latitude, loc.longitude, loc.name);
  } catch (err) {
    resultBox.innerHTML = `<p class="weather-error">查询失败：${err.message}</p>`;
  }
}

async function queryByCoord(lat, lon, cityName) {
  try {
    const wRes = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&timezone=auto`
    );
    const w = await wRes.json();
    const c = w.current;
    const dirs = ['北','东北','东','东南','南','西南','西','西北'];
    const dir = dirs[Math.round(c.wind_direction_10m / 45) % 8];

    resultBox.innerHTML = `
      <div class="weather-card">
        <div class="weather-city">${cityName || '当前位置'}</div>
        <div class="weather-temp">${Math.round(c.temperature_2m)}°C</div>
        <div class="weather-desc">${WMO[c.weather_code] || '未知'}</div>
        <div class="weather-details">
          <span>体感 <b>${Math.round(c.apparent_temperature)}°C</b></span>
          <span>湿度 <b>${c.relative_humidity_2m}%</b></span>
          <span>风向 <b>${dir}</b></span>
          <span>风速 <b>${c.wind_speed_10m} km/h</b></span>
        </div>
      </div>
    `;
  } catch (err) {
    resultBox.innerHTML = `<p class="weather-error">查询失败：${err.message}</p>`;
  }
}

/* ========== 按钮 ========== */
document.getElementById('searchBtn').addEventListener('click', () => {
  const city = document.getElementById('cityInput').value.trim();
  if (!city) return alert('请输入城市名');
  queryByName(city);
});
document.getElementById('cityInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('searchBtn').click();
});

document.getElementById('locateBtn').addEventListener('click', () => {
  if (!navigator.geolocation) return alert('你的浏览器不支持定位');
  resultBox.innerHTML = '<p class="weather-loading">正在获取你的位置…</p>';
  navigator.geolocation.getCurrentPosition(
    pos => queryByCoord(pos.coords.latitude, pos.coords.longitude, '当前位置'),
    err => {
      resultBox.innerHTML = `<p class="weather-error">定位失败：${err.message}<br>请手动输入城市名。</p>`;
    },
    { timeout: 10000 }
  );
});
</script>

</body>
</html>
