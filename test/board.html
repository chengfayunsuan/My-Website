<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>留言板 · 乘法</title>
<link rel="stylesheet" href="/style.css?v=9">
<style>
  .form-row { margin: 12px 0; }
  .form-row input, .form-row textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  .form-row textarea { min-height: 80px; resize: vertical; }
  .form-row button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
  }
  .msg-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .msg-item.hl { background: var(--primary-soft); border-radius: 8px; }
  .reply-box {
    margin: 10px 0 4px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--primary-soft);
  }
  .reply-input {
    width: 100%;
    min-height: 56px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    background: var(--card);
    color: var(--text);
    outline: none;
    resize: vertical;
  }
  .reply-input:focus { border-color: var(--primary); }
  .reply-actions { display: flex; gap: 8px; margin-top: 8px; }
  .reply-actions .act-btn { background: var(--card); }
  .reply-actions .act-btn.on { background: var(--primary); color: #fff; }
  .like-btn { font-size: 15px; line-height: 1; }
  .like-btn .like-n { font-size: 13px; margin-left: 2px; }
  .like-btn.on { color: #e5534b; border-color: #e5534b; background: rgba(229,83,75,.12); }
  .like-btn.on:hover { background: rgba(229,83,75,.2); }
  .msg-head { display: flex; align-items: center; gap: 8px; }
  .msg-avatar { display: inline-flex; flex: none; line-height: 0; }
  .msg-avatar img {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
  }
  a.msg-avatar:hover { opacity: .85; }
  .msg-name { font-weight: bold; color: var(--text); }
  a.msg-name { text-decoration: none; border-bottom: 1px dashed currentColor; }
  a.msg-name:hover { color: var(--primary); }
  .msg-time { color: var(--text-light); font-size: 13px; margin-left: 4px; }
  .msg-text { margin-top: 6px; color: var(--text); }
</style>
</head>
<body>

    <div id="navbar"></div>

  <section style="margin-top:40px;">
    <div class="card">
      <h2 class="section-title">留言板</h2>
      <p style="margin-bottom:16px;">当前用户：<b id="who">未登录</b> <a href="javascript:;" id="goLogin">去登录</a></p>

      <div class="warn-bar" id="warnBar"></div>

      <div class="form-row">
        <textarea id="text" placeholder="留言内容（最多 200 字）" maxlength="200"></textarea>
      </div>
      <div class="form-row">
        <button id="submitBtn">提交留言</button>
      </div>

      <div class="social-tip" id="tip"></div>

      <h3 style="margin-top:30px;">全部留言</h3>
      <div id="list">加载中…</div>
    </div>
  </section>

  <script src="/config.js"></script>
  <script src="/nav.js?v=9"></script>
<script>
const API = window.API_BASE || 'https://api.chengfa.dpdns.org';

const goLogin = document.getElementById('goLogin');
if (goLogin) {
  goLogin.addEventListener('click', () => {
    const modal = document.getElementById('loginModal');
    if (modal) modal.classList.add('show');
  });
}

/* 把 uid 和用户名都对到一个用户上：
   新留言带了 uid，直接用；老留言没 uid，就用用户名去对 */
let byName = null, byUid = null;

async function loadUsers() {
  if (byName) return;
  byName = new Map();
  byUid  = new Map();
  try {
    const res = await fetch(API + '/users');
    const d = await res.json();
    if (Array.isArray(d)) {
      d.forEach(u => {
        byName.set(u.username, u);
        byUid.set(u.uid, u);
      });
    }
  } catch {
    /* 拿不到名单就统一显示默认头像 */
  }
}

function safeAvatar(a) {
  if (typeof a !== 'string' || !a) return '/avatar-default.jpg';
  let s = a;
  // 新后端给完整网址；旧后端只给文件名 uid1.jpg，这里补上前缀
  if (!s.startsWith('data:') && !s.startsWith('/') && !/^https?:\/\//.test(s)) {
    s = API.replace(/\/+$/, '') + '/avatar/' + s;
  }
  if (s.indexOf('"') !== -1 || s.indexOf('<') !== -1) return '/avatar-default.jpg';
  return s;
}

function whoOf(m) {
  const u = (m.uid != null ? byUid.get(m.uid) : null) || byName.get(m.name) || null;
  return {
    uid: (m.uid != null) ? m.uid : (u ? u.uid : null),
    name: u ? u.username : m.name,
    avatar: safeAvatar(u && u.avatar)
  };
}

/* 文本和属性里都能安全用的转义（'"' 在属性里必须转，所以不能用 innerHTML 那套） */
function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ===== 我自己的状态 ===== */
let me = null;                    // {uid, username, role}
let followSet  = new Set();       // 我关注的人
let blockedSet = new Set();       // 我拉黑的人
let reportedSet = new Set();      // 我举报过、还没处理的留言 id
let likeCount = {};               // { 留言id: 赞数 }
let likeSet   = new Set();        // 我赞过的留言 id
let openReplyId = null;           // 当前打开着回复框的那条留言 id
let replyDraft = '';              // 回复框里预填的内容（@某某 ）
let msgsCache = [];
let meToken = null;               // 记住这份 me 是用哪个 token 换来的，换人了要重取
let urlActionDone = false;        // ?reply= / ?msg= 只处理一次，别每次重画都跳

function authHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + localStorage.getItem('token')
  };
}

function ensureLogin() {
  if (localStorage.getItem('token')) return true;
  const m = document.getElementById('loginModal');
  if (m) m.classList.add('show');
  else alert('请先登录');
  return false;
}

async function loadMe() {
  const token = localStorage.getItem('token');
  // 退出登录了就当没登录；换了个 token（换人登录）要重新取
  if (!token) { me = null; meToken = null; return; }
  if (me && meToken === token) return;
  try {
    const res = await fetch(API + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await res.json();
    if (d && d.ok) {
      me = { uid: d.uid, username: d.username, role: d.role };
      meToken = token;
      const who = document.getElementById('who');
      if (who) who.textContent = d.username;
      if (goLogin) goLogin.style.display = 'none';
    }
  } catch { /* 网络不行就当成没登录 */ }
}

async function loadRelations() {
  if (!me) return;
  try {
    const res = await fetch(API + '/relations?uid=' + me.uid, {
      headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
    });
    const d = await res.json();
    if (d && d.ok) {
      followSet  = new Set(d.following || []);
      blockedSet = new Set(d.blocked || []);
    }
  } catch { /* 忽略 */ }
}

async function loadReports() {
  if (!me) return;
  try {
    const res = await fetch(API + '/my-reports', {
      headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
    });
    const d = await res.json();
    if (Array.isArray(d)) reportedSet = new Set(d);
  } catch { /* 忽略 */ }
}

/* ===== 渲染 ===== */
/* 每条留言右边的按钮： 关注 | 回复 | ♡赞 | ⋯
   —— 自己的留言也有「回复 / 赞 / 三个点」，只是三个点里没有关注和拉黑 */
function actionsHTML(m, who) {
  if (!me) return '';
  if (typeof m.id !== 'number') return '';

  const mine = who.uid != null && who.uid === me.uid;
  const hasUid = who.uid != null;
  const followed = hasUid && followSet.has(who.uid);
  const liked = likeSet.has(m.id);
  const n = likeCount[m.id] || 0;
  const reported = reportedSet.has(m.id);

  const followBtn = (!mine && hasUid)
    ? `<button type="button" class="act-btn${followed ? ' on' : ''}" data-act="follow" data-uid="${who.uid}">${followed ? '已关注' : '关注'}</button>`
    : '';
  // 拉黑只对别人开放（后端也拦着自己拉黑自己）
  const blockItem = (!mine && hasUid)
    ? `<button type="button" data-act="block" data-uid="${who.uid}" class="danger">拉黑 TA</button>`
    : '';

  return `
        <div class="msg-actions">
          ${followBtn}
          <button type="button" class="act-btn" data-act="reply" data-id="${m.id}" data-name="${escapeHTML(who.name)}">回复</button>
          <button type="button" class="act-btn like-btn${liked ? ' on' : ''}" data-act="like" data-id="${m.id}" data-uid="${hasUid ? who.uid : ''}" title="${liked ? '取消赞' : '赞一个'}">♥<span class="like-n">${n > 0 ? n : ''}</span></button>
          <button type="button" class="act-btn dots" data-act="menu" aria-label="更多操作" title="更多操作">⋯</button>
          <div class="act-menu">
            ${blockItem}
            <button type="button" data-act="report" data-id="${m.id}"${reported ? ' disabled' : ''} class="danger">${reported ? '已举报' : '举报'}</button>
          </div>
        </div>`;
}

/* 回复框：预填「@某某 」，和后端识别 @ 的逻辑对上 */
function replyBoxHTML(m, who) {
  return `
      <div class="reply-box" data-for="${m.id}">
        <textarea class="reply-input" placeholder="回复 ${escapeHTML(who.name)}…（第一行会自动带上 @${escapeHTML(who.name)} ）">${escapeHTML(replyDraft)}</textarea>
        <div class="reply-actions">
          <button type="button" class="act-btn on" data-act="send-reply" data-id="${m.id}" data-uid="${who.uid == null ? '' : who.uid}" data-name="${escapeHTML(who.name)}">发送回复</button>
          <button type="button" class="act-btn" data-act="cancel-reply">取消</button>
        </div>
      </div>`;
}

/* 打开某条留言下面的回复框，并预填 @名字 */
function openReply(id, name) {
  openReplyId = id;
  replyDraft = name ? '@' + name + ' ' : '';
  render();
  const box = document.querySelector('.reply-box[data-for="' + id + '"]');
  if (!box) return;
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const ta = box.querySelector('.reply-input');
  if (ta) {
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);   // 光标放最后，直接接着打
  }
}

/* 信箱点过来会带 ?reply=留言id&to=对方名字（或 ?msg=留言id 只跳过去）*/
function applyUrlAction() {
  if (urlActionDone) return;
  const qs = new URLSearchParams(location.search);
  const rid = parseInt(qs.get('reply'), 10);
  const mid = parseInt(qs.get('msg'), 10);

  if (rid) {
    const m = msgsCache.find(x => x.id === rid);
    if (m) {
      urlActionDone = true;
      openReply(rid, qs.get('to') || whoOf(m).name);
      return;
    }
  }
  if (mid) {
    const item = document.querySelector('.msg-item[data-id="' + mid + '"]');
    if (item) {
      urlActionDone = true;
      item.classList.add('hl');
      item.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => item.classList.remove('hl'), 2500);
    }
  }
}

function render() {
  const list = document.getElementById('list');
  const rows = msgsCache.slice().reverse();   // 最新的排在最上面

  const html = rows.map(m => {
    const who = whoOf(m);
    const href = '/profile/?uid=' + who.uid;
    const mine = me && who.uid === me.uid;
    const idAttr = typeof m.id === 'number' ? m.id : '';

    // 拉黑的人：留言折叠起来，留一个「取消拉黑」的入口，不然永远解不开
    if (me && who.uid != null && !mine && blockedSet.has(who.uid)) {
      return `
      <div class="msg-item blocked-item" data-id="${idAttr}">
        <div class="msg-head">
          <span class="msg-avatar"><img src="${who.avatar}" alt=""></span>
          <span class="msg-name">${escapeHTML(who.name)}</span>
          <span class="msg-time">已拉黑</span>
          <div class="msg-actions">
            <button type="button" class="act-btn" data-act="block" data-uid="${who.uid}">取消拉黑</button>
          </div>
        </div>
        <div class="msg-text">这条留言来自你拉黑的用户，已经隐藏起来了。</div>
      </div>`;
    }

    const nameHTML = who.uid
      ? `<a class="msg-name" href="${href}">${escapeHTML(who.name)}</a>`
      : `<span class="msg-name">${escapeHTML(who.name)}</span>`;
    const avatarHTML = who.uid
      ? `<a class="msg-avatar" href="${href}" title="${escapeHTML(who.name)} 的主页"><img src="${who.avatar}" alt=""></a>`
      : `<span class="msg-avatar"><img src="${who.avatar}" alt=""></span>`;

    return `
      <div class="msg-item" data-id="${idAttr}">
        <div class="msg-head">
          ${avatarHTML}
          ${nameHTML}
          <span class="msg-time">${escapeHTML(m.time)}</span>
          ${actionsHTML(m, who)}
        </div>
        <div class="msg-text">${escapeHTML(m.text)}</div>
        ${openReplyId === m.id ? replyBoxHTML(m, who) : ''}
      </div>`;
  }).join('');

  list.innerHTML = html || '还没有留言';
}

function closeMenus() {
  document.querySelectorAll('.act-menu.show').forEach(x => x.classList.remove('show'));
}

let tipTimer = null;
function showTip(text) {
  const t = document.getElementById('tip');
  if (!t) return;
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => t.classList.remove('show'), 5000);
}

async function load() {
  const list = document.getElementById('list');
  list.textContent = '加载中…';
  let data;
  try {
    const token = localStorage.getItem('token');
    // 带上 token，后端才知道哪几条是我赞过的
    const res = await fetch(API + '/messages', {
      headers: token ? { 'Authorization': 'Bearer ' + token } : {}
    });
    data = await res.json();
  } catch {
    list.textContent = '加载失败';
    return;
  }
  if (!Array.isArray(data)) { list.textContent = '加载失败'; return; }
  msgsCache = data;

  // 赞数和「我赞过没」跟着留言一起来，不用再单独请求
  likeCount = {};
  likeSet = new Set();
  data.forEach(m => {
    if (typeof m.id !== 'number') return;
    likeCount[m.id] = m.likes || 0;
    if (m.likedByMe) likeSet.add(m.id);
  });

  await loadUsers();
  await loadMe();
  await Promise.all([loadRelations(), loadReports()]);

  // 后端没重启的提示：旧后端不会给留言编号
  const warn = document.getElementById('warnBar');
  if (warn) {
    if (msgsCache.some(m => typeof m.id !== 'number')) {
      warn.textContent = '后端还是旧版本：留言还没编号，点赞、回复、举报都用不了。请把那个黑窗口关掉，再双击「启动网站.bat」。';
      warn.classList.add('show');
    } else {
      warn.classList.remove('show');
    }
  }

  render();
  applyUrlAction();
}

/* ===== 按钮事件（用事件委托，重新渲染后不用重新绑定）===== */
document.getElementById('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const uid = Number(btn.dataset.uid);
  const id  = Number(btn.dataset.id);

  if (act === 'menu') {
    const menu = btn.parentElement.querySelector('.act-menu');
    const wasOpen = menu.classList.contains('show');
    closeMenus();
    if (!wasOpen) menu.classList.add('show');
    return;
  }
  closeMenus();

  // 打开 / 收起回复框不用登录，真要发送时才拦
  if (act === 'reply') {
    openReply(id, btn.dataset.name || '');
    return;
  }
  if (act === 'cancel-reply') {
    openReplyId = null;
    replyDraft = '';
    render();
    return;
  }

  if (!ensureLogin()) return;

  if (act === 'send-reply') {
    const box = btn.closest('.reply-box');
    const ta = box && box.querySelector('.reply-input');
    const text = ta ? ta.value.trim() : '';
    if (!text) return alert('内容不能为空');
    btn.disabled = true;
    try {
      const res = await fetch(API + '/messages', {
        method: 'POST', headers: authHeaders(), body: JSON.stringify({ text })
      });
      const d = await res.json();
      if (!d.ok) { btn.disabled = false; return alert(d.error || '发送失败'); }
      openReplyId = null;
      replyDraft = '';
      await load();
      showTip(uid ? '回复发出去了，TA 的信箱里会收到提醒。' : '回复发出去了。');
    } catch { btn.disabled = false; alert('网络错误，请重试'); }
    return;
  }

  if (act === 'like') {
    btn.disabled = true;
    try {
      const res = await fetch(API + '/like', {
        method: 'POST', headers: authHeaders(), body: JSON.stringify({ id })
      });
      const d = await res.json();
      btn.disabled = false;
      if (!d.ok) return alert(d.error || '操作失败');
      likeCount[id] = d.likes;
      if (d.liked) likeSet.add(id); else likeSet.delete(id);
      // 只改这一个按钮，不整页重画 —— 重画会把正开着的回复框关掉
      btn.classList.toggle('on', !!d.liked);
      const nEl = btn.querySelector('.like-n');
      if (nEl) nEl.textContent = d.likes > 0 ? String(d.likes) : '';
      btn.title = d.liked ? '取消赞' : '赞一个';
      if (d.liked && uid && (!me || uid !== me.uid)) showTip('赞好了，TA 的信箱里会收到提醒。');
    } catch { btn.disabled = false; alert('网络错误，请重试'); }
    return;
  }

  if (act === 'follow') {
    btn.disabled = true;
    try {
      const res = await fetch(API + '/follow', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ uid }) });
      const d = await res.json();
      if (!d.ok) { btn.disabled = false; return alert(d.error || '操作失败'); }
      if (d.following) { followSet.add(uid); showTip('关注好了，可以在 TA 的主页看到。'); }
      else followSet.delete(uid);
      render();
    } catch { btn.disabled = false; alert('网络错误，请重试'); }
    return;
  }

  if (act === 'block') {
    btn.disabled = true;
    try {
      const res = await fetch(API + '/block', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ uid }) });
      const d = await res.json();
      if (!d.ok) { btn.disabled = false; return alert(d.error || '操作失败'); }
      if (d.blocked) { blockedSet.add(uid); showTip('已拉黑，TA 的留言不再显示（折叠在上面那条里）。'); }
      else { blockedSet.delete(uid); showTip('已经取消拉黑了。'); }
      render();
    } catch { btn.disabled = false; alert('网络错误，请重试'); }
    return;
  }

  if (act === 'report') {
    if (!id) return alert('这条留言还没有编号。请把后端那个黑窗口关掉，再双击「启动网站.bat」重启一次。');
    const reason = prompt('说说这条留言哪里有问题（可以留空）：', '');
    if (reason === null) return;   // 点了取消
    try {
      const res = await fetch(API + '/report', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ id, reason: reason.trim() }) });
      const d = await res.json();
      if (!d.ok) return alert(d.error || '举报失败');
      reportedSet.add(id);
      render();
      showTip('举报已经交给后台，管理员在管理面板里会看到。');
    } catch { alert('网络错误，请重试'); }
  }
});

// 点空白处收起菜单
document.addEventListener('click', (e) => {
  if (e.target.closest('.msg-actions')) return;
  closeMenus();
});

document.getElementById('submitBtn').onclick = async () => {
  if (!ensureLogin()) return;

  const text = document.getElementById('text').value.trim();
  if (!text) return alert('内容不能为空');

  try {
    const res = await fetch(API + '/messages', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (!data.ok) return alert('失败：' + data.error);
    document.getElementById('text').value = '';
    load();
  } catch {
    alert('提交失败，请重试');
  }
};

load();

// 导航栏里登录成功后这个页面不会自己刷新，盯一下 token 变了就重载
let lastToken = localStorage.getItem('token');
setInterval(() => {
  const t = localStorage.getItem('token');
  if (t !== lastToken) { lastToken = t; load(); }
}, 1000);
</script>

</body>
</html>
