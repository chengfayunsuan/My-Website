<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>后台测试 · 乘法</title>
<link rel="stylesheet" href="/style.css?v=6">
<style>
  .form-row { margin: 12px 0; }
  .form-row input, .form-row textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  .form-row textarea { min-height: 80px; resize: vertical; }
  .form-row button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
  }
  .msg-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .msg-head { display: flex; align-items: center; gap: 8px; }
  .msg-avatar { display: inline-flex; flex: none; line-height: 0; }
  .msg-avatar img {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
  }
  a.msg-avatar:hover { opacity: .85; }
  .msg-name { font-weight: bold; color: var(--text); }
  a.msg-name { text-decoration: none; border-bottom: 1px dashed currentColor; }
  a.msg-name:hover { color: var(--primary); }
  .msg-time { color: var(--text-light); font-size: 13px; margin-left: 4px; }
  .msg-text { margin-top: 6px; color: var(--text); }
</style>
</head>
<body>

    <div id="navbar"></div>

  <section style="margin-top:40px;">
    <div class="card">
      <h2 class="section-title">留言板</h2>
      <p style="margin-bottom:16px;">当前用户：<b id="who">未登录</b> <a href="javascript:;" id="goLogin">去登录</a></p>

      <div class="form-row">
        <textarea id="text" placeholder="留言内容（最多 200 字）" maxlength="200"></textarea>
      </div>
      <div class="form-row">
        <button id="submitBtn">提交留言</button>
      </div>

      <h3 style="margin-top:30px;">全部留言</h3>
      <div id="list">加载中…</div>
    </div>
  </section>

  <script src="/config.js"></script>
  <script src="/nav.js?v=6"></script>
<script>
const API = window.API_BASE || 'https://api.chengfa.dpdns.org';

const goLogin = document.getElementById('goLogin');
if (goLogin) {
  goLogin.addEventListener('click', () => {
    const modal = document.getElementById('loginModal');
    if (modal) modal.classList.add('show');
  });
}

/* 把 uid 和用户名都对到一个用户上：
   新留言带了 uid，直接用；老留言没 uid，就用用户名去对 */
let byName = null, byUid = null;

async function loadUsers() {
  if (byName) return;
  byName = new Map();
  byUid  = new Map();
  try {
    const res = await fetch(API + '/users');
    const d = await res.json();
    if (Array.isArray(d)) {
      d.forEach(u => {
        byName.set(u.username, u);
        byUid.set(u.uid, u);
      });
    }
  } catch {
    /* 拿不到名单就统一显示默认头像 */
  }
}

function safeAvatar(a) {
  if (typeof a === 'string' &&
      (a.startsWith('data:image/') || a.startsWith('/')) &&
      a.indexOf('"') === -1 && a.indexOf('<') === -1) return a;
  return '/avatar-default.jpg';
}

function whoOf(m) {
  const u = (m.uid != null ? byUid.get(m.uid) : null) || byName.get(m.name) || null;
  return {
    uid: (m.uid != null) ? m.uid : (u ? u.uid : null),
    avatar: safeAvatar(u && u.avatar)
  };
}

async function load() {
  const list = document.getElementById('list');
  try {
    const res = await fetch(API + '/messages');
    const data = await res.json();
    if (!data.length) { list.textContent = '还没有留言'; return; }

    await loadUsers();

    list.innerHTML = data.slice().reverse().map(m => {
      const who = whoOf(m);
      const href = '/profile/?uid=' + who.uid;
      // 头像和名字都能点，进 TA 的主页；认不出是谁就只是普通头像
      const avatarHTML = who.uid
        ? `<a class="msg-avatar" href="${href}" title="${escapeHTML(m.name)} 的主页"><img src="${who.avatar}" alt=""></a>`
        : `<span class="msg-avatar"><img src="${who.avatar}" alt=""></span>`;
      const nameHTML = who.uid
        ? `<a class="msg-name" href="${href}">${escapeHTML(m.name)}</a>`
        : `<span class="msg-name">${escapeHTML(m.name)}</span>`;
      return `
      <div class="msg-item">
        <div class="msg-head">
          ${avatarHTML}
          ${nameHTML}
          <span class="msg-time">${escapeHTML(m.time)}</span>
        </div>
        <div class="msg-text">${escapeHTML(m.text)}</div>
      </div>
    `;
    }).join('');
  } catch {
    list.textContent = '加载失败';
  }
}

function escapeHTML(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

const token = localStorage.getItem('token');
const username = localStorage.getItem('username');
const whoEl = document.getElementById('who');
if (token) {
  whoEl.textContent = username || '已登录';
  if (goLogin) goLogin.style.display = 'none';
}

document.getElementById('submitBtn').onclick = async () => {
  const token = localStorage.getItem('token');
  if (!token) return alert('请先登录');

  const text = document.getElementById('text').value.trim();
  if (!text) return alert('内容不能为空');

  try {
    const res = await fetch(API + '/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (!data.ok) return alert('失败：' + data.error);
    document.getElementById('text').value = '';
    load();
  } catch {
    alert('提交失败，请重试');
  }
};

load();
</script>

</body>
</html>
