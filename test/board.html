<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>后台测试 · 乘法</title>
<link rel="stylesheet" href="/style.css">
<style>
  .form-row { margin: 12px 0; }
  .form-row input, .form-row textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  .form-row textarea { min-height: 80px; resize: vertical; }
  .form-row button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    font-size: 15px;
    font-family: inherit;
  }
  .msg-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .msg-name { font-weight: bold; color: var(--text); }
  .msg-time { color: var(--text-light); font-size: 13px; margin-left: 10px; }
  .msg-text { margin-top: 6px; color: var(--text); }
</style>
</head>
<body>

    <div id="navbar"></div>

  <section style="margin-top:40px;">
    <div class="card">
      <h2 class="section-title">留言板</h2>
            <p style="margin-bottom:16px;">当前用户：<b id="who">未登录</b> <a href="javascript:;" id="goLogin">去登录</a></p>

      <div class="form-row">
        <textarea id="text" placeholder="留言内容（最多 200 字）" maxlength="200"></textarea>
      </div>
      <div class="form-row">
        <button id="submitBtn">提交留言</button>
      </div>

      <h3 style="margin-top:30px;">全部留言</h3>
      <div id="list">加载中…</div>
    </div>
  </section>

  <script src="/nav.js"></script>
<script>
/* 点"去登录"打开登录弹窗 */
const goLogin = document.getElementById('goLogin');
if (goLogin) {
  goLogin.addEventListener('click', () => {
    const modal = document.getElementById('loginModal');
    if (modal) modal.classList.add('show');
  });
}

const API = 'https://api.chengfa.dpdns.org';

// 加载留言
async function load() {
  const list = document.getElementById('list');
  try {
    const res = await fetch(API + '/messages');
    const data = await res.json();
    if (!data.length) { list.textContent = '还没有留言'; return; }
    list.innerHTML = data.slice().reverse().map(m => `
      <div class="msg-item">
        <span class="msg-name">${escapeHTML(m.name)}</span>
        <span class="msg-time">${escapeHTML(m.time)}</span>
        <div class="msg-text">${escapeHTML(m.text)}</div>
      </div>
    `).join('');
  } catch {
    list.textContent = '加载失败';
  }
}

// 防 XSS
function escapeHTML(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 提交
// 显示当前用户
const token = localStorage.getItem('token');
const username = localStorage.getItem('username');
if (token) document.getElementById('who').textContent = username;

document.getElementById('submitBtn').onclick = async () => {
  const token = localStorage.getItem('token');
  if (!token) return alert('请先登录');

  const text = document.getElementById('text').value.trim();
  if (!text) return alert('内容不能为空');

  try {
    const res = await fetch(API + '/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (!data.ok) return alert('失败：' + data.error);
    document.getElementById('text').value = '';
    load();
  } catch {
    alert('提交失败，请重试');
  }
};

load();
</script>

</body>
</html>
