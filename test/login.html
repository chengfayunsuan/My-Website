<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css?v=8">
<style>
  .auth-card { max-width: 420px; margin: 0 auto; }

  .auth-tabs {
    display: flex;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .auth-tab {
    flex: 1;
    padding: 12px 0;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    background: transparent;
    color: var(--text-light);
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .auth-tab:hover { color: var(--primary); }
  .auth-tab.on {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 600;
  }

  .auth-field { margin-bottom: 16px; }
  .auth-field label {
    display: block;
    font-size: 14px;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  .auth-input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .auth-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  .auth-submit {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 16px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, opacity .2s;
  }
  .auth-submit:hover { background: var(--primary-deep); }
  .auth-submit:disabled { opacity: .6; cursor: default; }

  .auth-msg {
    min-height: 22px;
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    color: var(--text-light);
  }
  .auth-msg.ok { color: #4CAF50; }
  .auth-msg.err { color: #e5534b; }

  .auth-hint {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-light);
    text-align: center;
    line-height: 1.8;
  }

  /* 已登录时显示的面板 */
  .who-box { text-align: center; padding: 8px 0 4px; }
  .who-avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    display: inline-block;
    border: 2px solid var(--border);
    background: var(--card);
  }
  .who-name { font-size: 21px; font-weight: 600; color: var(--text); margin: 14px 0 6px; }
  .who-sub { font-size: 14px; color: var(--text-light); }
  .who-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 26px;
  }
  .who-btn {
    padding: 10px 22px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: background .2s, color .2s, border-color .2s;
  }
  .who-btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .who-btn.primary:hover { background: var(--primary-deep); }
  .who-btn.danger:hover { color: #e5534b; border-color: #e5534b; }
</style>
</head>
<body>

  <div id="navbar"></div>

  <section style="margin-top:40px;">
    <div class="card auth-card">

      <!-- 已经登录了 -->
      <div id="paneWho" style="display:none;">
        <div class="who-box">
          <img class="who-avatar" id="whoAvatar" src="/avatar-default.jpg" alt="">
          <div class="who-name" id="whoName">…</div>
          <div class="who-sub" id="whoSub"></div>
        </div>
        <div class="who-actions">
          <a class="who-btn primary" id="whoProfile" href="/profile/">进入我的主页</a>
          <button class="who-btn danger" id="whoLogout" type="button">退出登录</button>
        </div>
      </div>

      <!-- 登录 / 注册 -->
      <div id="paneAuth">
        <div class="auth-tabs">
          <button class="auth-tab on" id="tabLogin" type="button">登录</button>
          <button class="auth-tab" id="tabRegister" type="button">注册</button>
        </div>

        <form id="paneLogin" autocomplete="on">
          <div class="auth-field">
            <label for="loginUser">用户名</label>
            <input class="auth-input" id="loginUser" type="text" autocomplete="username" placeholder="输入你的用户名">
          </div>
          <div class="auth-field">
            <label for="loginPass">密码</label>
            <input class="auth-input" id="loginPass" type="password" autocomplete="current-password" placeholder="输入密码">
          </div>
          <button class="auth-submit" id="loginBtn" type="submit">登 录</button>
          <div class="auth-msg" id="loginMsg"></div>
        </form>

        <form id="paneRegister" autocomplete="on" style="display:none;">
          <div class="auth-field">
            <label for="regUser">用户名</label>
            <input class="auth-input" id="regUser" type="text" autocomplete="username" placeholder="2 ~ 20 个字">
          </div>
          <div class="auth-field">
            <label for="regPass">密码</label>
            <input class="auth-input" id="regPass" type="password" autocomplete="new-password" placeholder="至少 6 位">
          </div>
          <div class="auth-field">
            <label for="regPass2">再输一遍密码</label>
            <input class="auth-input" id="regPass2" type="password" autocomplete="new-password" placeholder="两次要一样">
          </div>
          <button class="auth-submit" id="regBtn" type="submit">注 册</button>
          <div class="auth-msg" id="regMsg"></div>
        </form>

        <div class="auth-hint">
          注册之后就能发留言、发更新日志（管理员才有）、被关注。<br>
          账号存在站长自己电脑上的 JSON 文件里，别用你常用的密码。
        </div>
      </div>

    </div>
  </section>

  <script src="/config.js"></script>
  <script src="/nav.js?v=8"></script>
<script>
(function () {
  const API = window.API_BASE || 'https://api.chengfa.dpdns.org';

  const paneWho  = document.getElementById('paneWho');
  const paneAuth = document.getElementById('paneAuth');
  const tabLogin = document.getElementById('tabLogin');
  const tabReg   = document.getElementById('tabRegister');
  const paneLogin = document.getElementById('paneLogin');
  const paneReg   = document.getElementById('paneRegister');

  const loginUser = document.getElementById('loginUser');
  const loginPass = document.getElementById('loginPass');
  const loginBtn  = document.getElementById('loginBtn');
  const loginMsg  = document.getElementById('loginMsg');

  const regUser = document.getElementById('regUser');
  const regPass = document.getElementById('regPass');
  const regPass2 = document.getElementById('regPass2');
  const regBtn  = document.getElementById('regBtn');
  const regMsg  = document.getElementById('regMsg');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fixAvatar(a) {
    if (typeof a !== 'string' || !a) return '/avatar-default.jpg';
    let s = a.trim();
    if (/^data:image\//.test(s) || s.charAt(0) === '/' || /^https?:\/\//.test(s)) {
      // 已经能直接用
    } else {
      s = API.replace(/\/+$/, '') + '/avatar/' + s;
    }
    if (s.indexOf('"') !== -1 || s.indexOf('<') !== -1) return '/avatar-default.jpg';
    return s;
  }

  function say(el, kind, text) {
    el.className = 'auth-msg' + (kind ? ' ' + kind : '');
    el.textContent = text || '';
  }

  function chooseLogin() {
    tabLogin.classList.add('on');
    tabReg.classList.remove('on');
    paneLogin.style.display = '';
    paneReg.style.display = 'none';
  }
  function chooseRegister() {
    tabReg.classList.add('on');
    tabLogin.classList.remove('on');
    paneReg.style.display = '';
    paneLogin.style.display = 'none';
  }
  tabLogin.addEventListener('click', chooseLogin);
  tabReg.addEventListener('click', chooseRegister);

  function saveLogin(d, fallbackName) {
    localStorage.setItem('token', d.token);
    localStorage.setItem('username', d.username || fallbackName || '');
    localStorage.setItem('uid', d.uid || '');
  }

  async function post(path, body) {
    const res = await fetch(API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(function () { return null; });
    return { ok: res.ok, status: res.status, body: data || {} };
  }

  paneLogin.addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = loginUser.value.trim();
    const password = loginPass.value;
    if (!username || !password) { say(loginMsg, 'err', '用户名和密码都要填'); return; }

    loginBtn.disabled = true;
    say(loginMsg, '', '正在登录…');
    try {
      const r = await post('/login', { username: username, password: password });
      if (!r.ok || !r.body.ok) {
        say(loginMsg, 'err', r.body.error || ('登录失败（HTTP ' + r.status + '）'));
        loginBtn.disabled = false;
        return;
      }
      saveLogin(r.body, username);
      say(loginMsg, 'ok', '登录成功，正在刷新…');
      setTimeout(function () { location.reload(); }, 700);
    } catch (err) {
      say(loginMsg, 'err', '连不上后端，看看后端和隧道是不是开着');
      loginBtn.disabled = false;
    }
  });

  paneReg.addEventListener('submit', async function (e) {
    e.preventDefault();
    const username = regUser.value.trim();
    const password = regPass.value;
    const password2 = regPass2.value;

    if (username.length < 2 || username.length > 20) { say(regMsg, 'err', '用户名要 2 ~ 20 个字'); return; }
    if (password.length < 6) { say(regMsg, 'err', '密码至少 6 位'); return; }
    if (password !== password2) { say(regMsg, 'err', '两次输入的密码不一样'); return; }

    regBtn.disabled = true;
    say(regMsg, '', '正在注册…');
    try {
      const r = await post('/register', { username: username, password: password });
      if (!r.ok || !r.body.ok) {
        say(regMsg, 'err', r.body.error || ('注册失败（HTTP ' + r.status + '）'));
        regBtn.disabled = false;
        return;
      }
      say(regMsg, 'ok', '注册成功，正在登录…');
      const r2 = await post('/login', { username: username, password: password });
      if (!r2.ok || !r2.body.ok) {
        say(regMsg, 'err', '注册好了，但自动登录没成功，请在上面的「登录」里登一次');
        regBtn.disabled = false;
        return;
      }
      saveLogin(r2.body, username);
      say(regMsg, 'ok', '都好了，正在刷新…');
      setTimeout(function () { location.reload(); }, 700);
    } catch (err) {
      say(regMsg, 'err', '连不上后端，看看后端和隧道是不是开着');
      regBtn.disabled = false;
    }
  });

  // 已经登录就直接显示「你是谁」的面板
  async function checkWho() {
    const token = localStorage.getItem('token');
    if (!token) return;
    try {
      const res = await fetch(API + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) return;
      const d = await res.json();
      if (!d || !d.ok) return;

      document.getElementById('whoAvatar').src = fixAvatar(d.avatar);
      document.getElementById('whoName').textContent = d.username || '';
      document.getElementById('whoSub').textContent =
        'UID ' + d.uid + ' · ' + (d.role === 'owner' ? '站长' : d.role === 'admin' ? '管理员' : '普通用户')
        + (d.muted ? ' · 已被禁言' : '') + (d.banned ? ' · 已被封禁' : '');
      const a = document.getElementById('whoProfile');
      a.href = '/profile/?uid=' + encodeURIComponent(d.uid);

      document.getElementById('whoLogout').addEventListener('click', function () {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        localStorage.removeItem('uid');
        location.reload();
      });

      paneAuth.style.display = 'none';
      paneWho.style.display = '';
    } catch (err) { /* 后端连不上就老老实实显示登录框 */ }
  }

  checkWho();
})();
</script>
</body>
</html>
