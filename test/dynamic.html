<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>近期动态 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css?v=20">
<style>
  .feed-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .feed-live {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-light);
  }
  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #e53e3e;
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .btn-refresh {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background .2s;
  }
  .btn-refresh:hover:not(:disabled) { background: var(--primary-deep); }
  .btn-refresh:disabled { opacity: .6; cursor: not-allowed; }

  .feed-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 600px;
    overflow-y: auto;
    padding: 4px;
  }
  .feed-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    flex-wrap: wrap;
    gap: 6px 10px;
    transition: transform .15s;
  }
  .feed-item:hover { transform: translateX(2px); }
  .feed-item.new {
    animation: slideIn .4s ease;
    border-color: var(--primary);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .feed-item .user {
    font-weight: 700;
    color: var(--text);
  }
  .feed-item .source {
    color: var(--text-light);
  }
  .feed-item .right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .feed-item .amount {
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .feed-item .amount.gain {
    background: rgba(76,175,80,.15);
    color: #2e7d32;
  }
  .feed-item .amount.loss {
    background: rgba(231,76,60,.15);
    color: #c0392b;
  }
  .feed-item .time {
    font-size: 12px;
    color: var(--text-light);
    white-space: nowrap;
  }
  .feed-status {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 15px;
  }
  .feed-status .icon {
    font-size: 32px;
    display: block;
    margin-bottom: 10px;
  }
  .feed-foot {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-light);
    text-align: right;
  }

  /* ===== 重点关注：两个人的记录左右并排 ===== */
  .watch-wrap { margin-top: 18px; }
  .watch-title {
    font-size: 16px;
    color: var(--text);
    margin-bottom: 10px;
    position: relative;
    padding-left: 12px;
  }
  .watch-title::before {
    content: "";
    position: absolute;
    left: 0; top: 5px;
    width: 3px; height: 16px;
    background: var(--primary-deep);
    border-radius: 2px;
  }
  .watch-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 700px) {
    .watch-grid { grid-template-columns: 1fr; }
  }
  .watch-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    padding: 12px;
  }
  .watch-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .watch-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    word-break: break-all;
  }
  .watch-count {
    flex: none;
    min-width: 22px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary-deep);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
  }
  .watch-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 300px;
    overflow-y: auto;
    padding: 2px;
  }
  /* 跟上面实时列表同一套样式，只是小一号 */
  .watch-box .feed-item {
    padding: 9px 12px;
    font-size: 13px;
  }
  .watch-box .feed-item:hover { transform: none; }
  .watch-empty {
    padding: 18px 10px;
    text-align: center;
    font-size: 13px;
    color: var(--text-light);
  }
</style>
</head>
<body>

  
      <div id="navbar"></div>

  <header>
    <img class="avatar" src="/avatar.jpg" alt="头像" onerror="this.style.display='none'">
    <h1 class="name">近期动态</h1>
    <p class="tagline">来自 MoonBazaar 的实时动态</p>
  </header>

  <section>
    <div class="card">
      <div class="feed-header">
        <div class="feed-live">
          <span class="live-dot"></span>
          <span>实时更新中</span>
        </div>
        <button class="btn-refresh" id="refreshBtn">刷新</button>
      </div>

      <div class="feed-list" id="feedList">
        <div class="feed-status">
          <span class="icon">⏳</span>
          加载中…
        </div>
      </div>

      <p class="feed-foot">
        共 <b id="feedCount">0</b> 条 · 每 5 秒自动刷新
      </p>

      <div class="watch-wrap">
        <h3 class="watch-title">重点关注</h3>
        <div class="watch-grid">
          <div class="watch-box" id="watch0">
            <div class="watch-head">
              <span class="watch-name">chengfayunsuan</span>
              <span class="watch-count">0</span>
            </div>
            <div class="watch-list"><div class="watch-empty">加载中…</div></div>
          </div>
          <div class="watch-box" id="watch1">
            <div class="watch-head">
              <span class="watch-name">hym666</span>
              <span class="watch-count">0</span>
            </div>
            <div class="watch-list"><div class="watch-empty">加载中…</div></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 CHENGFA</p>
  </footer>
  
  <script src="/config.js"></script>
  <script src="/nav.js?v=20"></script>
<script>
/* ============ 动态列表 ============ */
const feedList = document.getElementById('feedList');
const feedCount = document.getElementById('feedCount');
const refreshBtn = document.getElementById('refreshBtn');

const API = window.API_BASE || 'https://api.chengfa.dpdns.org';

const TARGET = 'https://moonbazaar.xyz/home/get_live_feed.php?limit=30&offset=0';
const LIMIT = 30;
const POLL_INTERVAL = 5000;

let currentFingerprint = null;
let pollTimer = null;
let isRefreshing = false;
let feedLoaded = false;

/* 取数据的两条路：
   ① 问自己的后端（/live-feed）—— 后端是 Node，能直连源站，快且不卡，优先走这条；
   ② 后端没开或不通时，才退回公共 CORS 代理（那些代理又慢又爱挂，是以前卡顿的根因） */
const PROXIES = [
  url => `https://cors.eu.org/${url}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
];

async function fetchViaBackend() {
  const r = await fetch(API + '/live-feed?limit=' + LIMIT + '&offset=0', { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  if (!Array.isArray(d)) throw new Error('后端没给数组');
  return d;
}

async function fetchViaProxy() {
  const results = await Promise.allSettled(
    PROXIES.map(p => fetch(p(TARGET)).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r;
    }))
  );
  const ok = results.find(r => r.status === 'fulfilled');
  if (!ok) throw new Error('所有代理均失败');
  return await ok.value.json();
}

async function fetchFeed() {
  try {
    return await fetchViaBackend();
  } catch {
    return await fetchViaProxy();
  }
}

/* 防 XSS */
function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

/* ============ 重点关注：只留这两个人的记录 ============ */
const WATCH = ['chengfayunsuan', 'hym666'];
const WATCH_KEEP = 60;
const watchStore = {};   // { 名字: [tx, ...] } 新 → 旧
const watchSeen  = {};   // { 名字: Set(指纹) }

function wfp(tx) {
  return `${tx.username}|${tx.source}|${tx.robux_val}|${tx.created_at || tx.time_ago}`;
}

function mergeWatch(list) {
  if (!Array.isArray(list)) return;
  list.forEach(tx => {
    const n = tx.username;
    if (WATCH.indexOf(n) === -1) return;
    watchStore[n] = watchStore[n] || [];
    watchSeen[n]  = watchSeen[n] || new Set();
    if (watchSeen[n].has(wfp(tx))) return;
    watchSeen[n].add(wfp(tx));
    watchStore[n].push(tx);
    watchStore[n].sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
    if (watchStore[n].length > WATCH_KEEP) watchStore[n].length = WATCH_KEEP;
  });
  renderWatch();
}

function renderWatch() {
  WATCH.forEach((n, i) => {
    const box = document.getElementById('watch' + i);
    if (!box) return;
    const items = watchStore[n] || [];
    box.querySelector('.watch-count').textContent = items.length;
    const listEl = box.querySelector('.watch-list');
    if (!items.length) {
      listEl.innerHTML = '<div class="watch-empty">还没抓到 TA 的动态</div>';
      return;
    }
    listEl.innerHTML = '';
    items.forEach(tx => listEl.appendChild(createItem(tx, false)));
  });
}

/* 开页先把后端攒下来的记录铺上（Backend/test/feed-watch.json），
   省得刚进来两个框是空的。后端没开就只靠实时抓取慢慢攒。 */
async function seedWatch() {
  try {
    const r = await fetch(API + '/feed-watch', { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.users) WATCH.forEach(n => mergeWatch(d.users[n] || []));
  } catch { /* 后端没开就算了 */ }
}

/* 指纹：用于判断"新数据" */
function fingerprint(tx) {
  return `${tx.username}|${tx.source}|${parseFloat(tx.robux_val).toFixed(4)}|${tx.time_ago}`;
}

function createItem(tx, isNew) {
  const val = parseFloat(tx.robux_val);
  const isGain = val > 0;
  const abs = Math.abs(val).toFixed(4);

  const div = document.createElement('div');
  div.className = 'feed-item' + (isNew ? ' new' : '');
  div.innerHTML = `
    <div>
      <span class="user">${escapeHTML(tx.username)}</span>
      <span class="source">在 ${escapeHTML(tx.source)}</span>
    </div>
    <div class="right">
      <span class="amount ${isGain ? 'gain' : 'loss'}">
        ${isGain ? '+' : '-'}${abs} Gascoin
      </span>
      <span class="time">${escapeHTML(tx.time_ago)}</span>
    </div>
  `;
  return div;
}

async function loadFeed(isManual = false) {
  if (isRefreshing) return;
  isRefreshing = true;
  refreshBtn.disabled = true;
  refreshBtn.textContent = '刷新中…';

  try {
    const data = await fetchFeed();
    if (Array.isArray(data)) mergeWatch(data);

    if (!Array.isArray(data) || data.length === 0) {
      if (!feedLoaded || isManual) {
        feedList.innerHTML = `<div class="feed-status"><span class="icon">📭</span>暂无动态</div>`;
        feedCount.textContent = '0';
      }
      feedLoaded = true;
      return;
    }

    // 首次加载 / 手动刷新：全部重画
    if (!feedLoaded || isManual) {
      feedList.innerHTML = '';
      data.forEach(tx => feedList.appendChild(createItem(tx, false)));
      currentFingerprint = fingerprint(data[0]);
      feedCount.textContent = data.length;
      feedLoaded = true;
      return;
    }

    // 增量更新：找新的插到最上面
    if (fingerprint(data[0]) === currentFingerprint) {
      feedCount.textContent = feedList.querySelectorAll('.feed-item').length;
      return;
    }
    const newItems = [];
    for (const tx of data) {
      if (fingerprint(tx) === currentFingerprint) break;
      newItems.push(tx);
    }
    if (newItems.length > 0) {
      currentFingerprint = fingerprint(data[0]);
      for (let i = newItems.length - 1; i >= 0; i--) {
        feedList.prepend(createItem(newItems[i], true));
      }
      while (feedList.querySelectorAll('.feed-item').length > 150) {
        feedList.removeChild(feedList.lastChild);
      }
      feedCount.textContent = feedList.querySelectorAll('.feed-item').length;
    }
  } catch (err) {
    console.error('加载失败:', err);
    if (!feedLoaded || isManual) {
      feedList.innerHTML = `<div class="feed-status"><span class="icon">⚠️</span>加载失败，请点「刷新」重试</div>`;
    }
  } finally {
    isRefreshing = false;
    refreshBtn.disabled = false;
    refreshBtn.textContent = '刷新';
  }
}

/* 手动刷新：清状态重来 */
refreshBtn.addEventListener('click', () => {
  if (pollTimer) clearInterval(pollTimer);
  currentFingerprint = null;
  feedLoaded = false;
  feedList.innerHTML = `<div class="feed-status"><span class="icon">⏳</span>刷新中…</div>`;
  loadFeed(true).then(() => {
    pollTimer = setInterval(() => loadFeed(false), POLL_INTERVAL);
  });
});

/* 首次加载 + 开启轮询 */
renderWatch();                       // 先把两个框摆出来（空态）
seedWatch().then(() => loadFeed(true)).then(() => {
  pollTimer = setInterval(() => loadFeed(false), POLL_INTERVAL);
});

/* 页面隐藏时暂停轮询 */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  } else {
    if (!pollTimer) {
      pollTimer = setInterval(() => loadFeed(false), POLL_INTERVAL);
      loadFeed(false);
    }
  }
});
</script>

</body>
</html>
