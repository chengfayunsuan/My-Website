<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>近期动态 · 乘法</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css?v=9">
<style>
  .feed-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .feed-live {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-light);
  }
  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #e53e3e;
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .btn-refresh {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background .2s;
  }
  .btn-refresh:hover:not(:disabled) { background: var(--primary-deep); }
  .btn-refresh:disabled { opacity: .6; cursor: not-allowed; }

  .feed-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 600px;
    overflow-y: auto;
    padding: 4px;
  }
  .feed-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    flex-wrap: wrap;
    gap: 6px 10px;
    transition: transform .15s;
  }
  .feed-item:hover { transform: translateX(2px); }
  .feed-item.new {
    animation: slideIn .4s ease;
    border-color: var(--primary);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .feed-item .user {
    font-weight: 700;
    color: var(--text);
  }
  .feed-item .source {
    color: var(--text-light);
  }
  .feed-item .right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .feed-item .amount {
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .feed-item .amount.gain {
    background: rgba(76,175,80,.15);
    color: #2e7d32;
  }
  .feed-item .amount.loss {
    background: rgba(231,76,60,.15);
    color: #c0392b;
  }
  .feed-item .time {
    font-size: 12px;
    color: var(--text-light);
    white-space: nowrap;
  }
  .feed-status {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 15px;
  }
  .feed-status .icon {
    font-size: 32px;
    display: block;
    margin-bottom: 10px;
  }
  .feed-foot {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-light);
    text-align: right;
  }
</style>
</head>
<body>

  
      <div id="navbar"></div>

  <header>
    <img class="avatar" src="/avatar.jpg" alt="头像" onerror="this.style.display='none'">
    <h1 class="name">近期动态</h1>
    <p class="tagline">来自 MoonBazaar 的实时动态</p>
  </header>

  <section>
    <div class="card">
      <div class="feed-header">
        <div class="feed-live">
          <span class="live-dot"></span>
          <span>实时更新中</span>
        </div>
        <button class="btn-refresh" id="refreshBtn">刷新</button>
      </div>

      <div class="feed-list" id="feedList">
        <div class="feed-status">
          <span class="icon">⏳</span>
          加载中…
        </div>
      </div>

      <p class="feed-foot">
        共 <b id="feedCount">0</b> 条 · 每 5 秒自动刷新
      </p>
    </div>
  </section>

  <footer>
    <p>© 2026 CHENGFA</p>
  </footer>
  
  <script src="/config.js"></script>
  <script src="/nav.js?v=9"></script>
<script>
/* ============ 动态列表 ============ */
const feedList = document.getElementById('feedList');
const feedCount = document.getElementById('feedCount');
const refreshBtn = document.getElementById('refreshBtn');

const TARGET = 'https://moonbazaar.xyz/home/get_live_feed.php?limit=30&offset=0';
const LIMIT = 30;
const POLL_INTERVAL = 5000;

let currentFingerprint = null;
let pollTimer = null;
let isRefreshing = false;
let feedLoaded = false;

/* 三个 CORS 代理，谁先成功用谁 */
const PROXIES = [
  url => `https://cors.eu.org/${url}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
];

async function fetchFeed() {
  const results = await Promise.allSettled(
    PROXIES.map(p => fetch(p(TARGET)).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r;
    }))
  );
  const ok = results.find(r => r.status === 'fulfilled');
  if (!ok) throw new Error('所有代理均失败');
  return await ok.value.json();
}

/* 防 XSS */
function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

/* 指纹：用于判断"新数据" */
function fingerprint(tx) {
  return `${tx.username}|${tx.source}|${parseFloat(tx.robux_val).toFixed(4)}|${tx.time_ago}`;
}

function createItem(tx, isNew) {
  const val = parseFloat(tx.robux_val);
  const isGain = val > 0;
  const abs = Math.abs(val).toFixed(4);

  const div = document.createElement('div');
  div.className = 'feed-item' + (isNew ? ' new' : '');
  div.innerHTML = `
    <div>
      <span class="user">${escapeHTML(tx.username)}</span>
      <span class="source">在 ${escapeHTML(tx.source)}</span>
    </div>
    <div class="right">
      <span class="amount ${isGain ? 'gain' : 'loss'}">
        ${isGain ? '+' : '-'}${abs} Gascoin
      </span>
      <span class="time">${escapeHTML(tx.time_ago)}</span>
    </div>
  `;
  return div;
}

async function loadFeed(isManual = false) {
  if (isRefreshing) return;
  isRefreshing = true;
  refreshBtn.disabled = true;
  refreshBtn.textContent = '刷新中…';

  try {
    const data = await fetchFeed();

    if (!Array.isArray(data) || data.length === 0) {
      if (!feedLoaded || isManual) {
        feedList.innerHTML = `<div class="feed-status"><span class="icon">📭</span>暂无动态</div>`;
        feedCount.textContent = '0';
      }
      feedLoaded = true;
      return;
    }

    // 首次加载 / 手动刷新：全部重画
    if (!feedLoaded || isManual) {
      feedList.innerHTML = '';
      data.forEach(tx => feedList.appendChild(createItem(tx, false)));
      currentFingerprint = fingerprint(data[0]);
      feedCount.textContent = data.length;
      feedLoaded = true;
      return;
    }

    // 增量更新：找新的插到最上面
    if (fingerprint(data[0]) === currentFingerprint) {
      feedCount.textContent = feedList.querySelectorAll('.feed-item').length;
      return;
    }
    const newItems = [];
    for (const tx of data) {
      if (fingerprint(tx) === currentFingerprint) break;
      newItems.push(tx);
    }
    if (newItems.length > 0) {
      currentFingerprint = fingerprint(data[0]);
      for (let i = newItems.length - 1; i >= 0; i--) {
        feedList.prepend(createItem(newItems[i], true));
      }
      while (feedList.querySelectorAll('.feed-item').length > 150) {
        feedList.removeChild(feedList.lastChild);
      }
      feedCount.textContent = feedList.querySelectorAll('.feed-item').length;
    }
  } catch (err) {
    console.error('加载失败:', err);
    if (!feedLoaded || isManual) {
      feedList.innerHTML = `<div class="feed-status"><span class="icon">⚠️</span>加载失败，请点「刷新」重试</div>`;
    }
  } finally {
    isRefreshing = false;
    refreshBtn.disabled = false;
    refreshBtn.textContent = '刷新';
  }
}

/* 手动刷新：清状态重来 */
refreshBtn.addEventListener('click', () => {
  if (pollTimer) clearInterval(pollTimer);
  currentFingerprint = null;
  feedLoaded = false;
  feedList.innerHTML = `<div class="feed-status"><span class="icon">⏳</span>刷新中…</div>`;
  loadFeed(true).then(() => {
    pollTimer = setInterval(() => loadFeed(false), POLL_INTERVAL);
  });
});

/* 首次加载 + 开启轮询 */
loadFeed(true).then(() => {
  pollTimer = setInterval(() => loadFeed(false), POLL_INTERVAL);
});

/* 页面隐藏时暂停轮询 */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  } else {
    if (!pollTimer) {
      pollTimer = setInterval(() => loadFeed(false), POLL_INTERVAL);
      loadFeed(false);
    }
  }
});
</script>

</body>
</html>
